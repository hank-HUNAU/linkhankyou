if(st.today.d !== new Date().toISOString().slice(0,10)) st.today = {d:new Date().toISOString().slice(0,10), ids:[], i:0};

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let audio = new Audio(); audio.preload='none';
function voice(){ return st.voice; }
function play(key){
  audio.pause();
  audio.src = voice()+'/'+key+'.mp3';
  audio.onerror = function(){ if(voice()!=='gb_f'){ audio.onerror=null; audio.src='gb_f/'+key+'.mp3'; audio.play().catch(function(){toast('音频未找到：'+key);}); } else toast('音频未找到：'+key); };
  audio.play().catch(function(){});
}
let tt=null;
function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),1900); }

/* ---------- 学习模式 ---------- */
function queue(){ return CORE.slice(0, TODAY_GOAL); }
let qi = 0, revealed = false;
function kcount(){ return Object.keys(st.known).length; }
function renderStudy(){
  const q = queue(), c = q[qi], box = $('card');
  const done = q.filter(x => x.term in st.known).length;
  $('ptext').textContent = '今日 ' + Math.min(qi+1, q.length) + ' / ' + q.length;
  $('pfill').style.width = (100 * done / q.length) + '%';
  $('ktop').textContent = '已掌握 ' + kcount() + ' / ' + CORE.length;
  if(!c){
    const no = Object.keys(st.known).filter(k => st.known[k] === 0);
    box.innerHTML = '<div class="done"><h3>今日 20 张已完成</h3>'
      + '<p>标记「不认识」' + no.length + ' 张' + (no.length ? '，建议再滚一遍' : '，全部认识') + '</p>'
      + '<p style="margin-top:14px"><button class="bt play" id="again">'
      + (no.length ? '重看「不认识」的 ' + no.length + ' 张' : '再来一轮') + '</button> '
      + '<button class="bt ghost" id="all">去词表核对</button></p></div>';
    $('again').onclick = () => { if(no.length){ q.length = 0; no.forEach(k => q.push(CORE.find(x => x.term === k))); qi = 0; revealed = false; renderStudy(); } else { qi = 0; revealed = false; renderStudy(); } };
    $('all').onclick = () => switchView('list');
    return;
  }
  const tag3 = c.src3 ? 'src3' : 'src';
  box.innerHTML =
    '<div class="tags"><span class="tag pos">' + esc(c.pos) + '</span>'
      + '<span class="tag ' + tag3 + '">' + esc(c.src) + '</span>'
      + (c.sp ? '<span class="tag">易错拼写</span>' : '') + '</div>'
    + '<div class="en' + (c.term.length > 20 ? ' small' : '') + '">' + esc(c.term) + '</div>'
    + '<div class="hint">' + (revealed ? '' : '先在心里默写中文，再点开核对') + '</div>'
    + '<button class="spk" id="spk">🔊</button>'
    + '<div class="reveal' + (revealed ? '' : ' hide') + '" id="rv">'
      + '<div class="zh">' + esc(c.zh) + '</div>'
      + '<div class="sent"><div class="q">' + hl(c.q, c.term) + ' <button class="mini" id="spkEx">🔊</button></div><div class="t">' + esc(c.tr) + '</div></div>'
      + (c.sp ? spellBox(c) : '')
    + '</div>'
    + '<div class="acts">'
      + (revealed
          ? '<button class="bt no" id="bNo">不认识</button><button class="bt play" id="bYes">认识</button>'
          : '<button class="bt play" id="bShow">点开核对</button>')
      + '<button class="bt ghost" id="bSkip">跳过</button>'
    + '</div>';
  $('spk').onclick = e => { e.stopPropagation(); play(c.key); };
  const sx = $('spkEx'); if(sx) sx.onclick = e => { e.stopPropagation(); play(c.exk); };
  const rv = $('rv');
  function show(){ revealed = true; rv.classList.remove('hide'); renderStudy(); }
  if(!revealed){
    box.onclick = show; $('bShow').onclick = e => { e.stopPropagation(); show(); };
  } else {
    box.onclick = null;
    $('bYes').onclick = e => { e.stopPropagation(); mark(c, 1); };
    $('bNo').onclick = e => { e.stopPropagation(); mark(c, 0); };
  }
  $('bSkip').onclick = e => { e.stopPropagation(); qi++; revealed = false; renderStudy(); };
  if(c.sp){
    const so = $('spOpen');
    so.onclick = e => { e.stopPropagation(); openSpell(c, wasFirstTry => { if(wasFirstTry) mark(c, 1); }); };
  }
}
function hl(sent, term){
  const w = term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc(sent).replace(new RegExp('(^|[^A-Za-z])(' + w + ')(?![A-Za-z])','i'), '$1<b>$2</b>');
}
function hasWord(sent, w){
  const q = w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp('(^|[^A-Za-z])' + q + '(?![A-Za-z])','i').test(sent || '');
}
function blank(sent, w){
  const q = w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc(sent).replace(new RegExp('(^|[^A-Za-z])(' + q + ')(?![A-Za-z])','i'), '$1<u></u>');
}
function mark(c, ok){
  st.known[c.term] = ok;
  if(!st.today.ids.includes(c.term)) st.today.ids.push(c.term);
  save(); qi++; revealed = false; renderStudy();
}
function spellBox(c){
  return '<button class="bt ghost" id="spOpen" style="margin-top:14px">✎ 易错拼写自测（一字母一格）</button>';
}
/* ---------- 易错拼写：中央弹窗 · 一字母一格 · 背景虚化 ---------- */
let pmCard = null, pmCb = null, pmFirst = true;
function openSpell(c, cb, retry){
  pmCard = c;
  if(!retry){ pmCb = cb || null; pmFirst = true; }
  $('pmZh').textContent = c.zh;
  const src = hasWord(c.q, c.sp) ? c.q : c.term;   /* 例句里没有该词时退到词块本身，保证一定出现挖空 */
  $('pmEx').innerHTML = blank(src, c.sp);
  const g = $('pmGrid'); g.innerHTML = '';
  for(const ch of c.sp){
    const el = document.createElement('input');
    el.className = 'lcell'; el.autocomplete='off'; el.spellcheck=false; el.inputMode='text';
    if(/[A-Za-z]/.test(ch)){ el.maxLength = 1; }
    else { el.value = ch; el.readOnly = true; el.classList.add('fixed'); }
    g.appendChild(el);
  }
  const cells = []; g.querySelectorAll('.lcell').forEach(x => { if(!x.readOnly) cells.push(x); });
  cells.forEach((el, i) => {
    el.addEventListener('input', () => {
      el.value = (el.value.match(/[A-Za-z]/g) || []).slice(-1).join('');
      el.classList.remove('ok','bad');
      if(el.value && i < cells.length - 1) cells[i+1].focus();
      if(cells.every(x => x.value)) pmCheck();
    });
    el.addEventListener('keydown', e => {
      if(e.key === 'Backspace' && !el.value && i > 0){ e.preventDefault(); cells[i-1].focus(); cells[i-1].value=''; }
      else if(e.key === 'ArrowLeft' && i > 0){ e.preventDefault(); cells[i-1].focus(); }
      else if(e.key === 'ArrowRight' && i < cells.length - 1){ e.preventDefault(); cells[i+1].focus(); }
      else if(e.key === 'Enter'){ e.preventDefault(); pmCheck(); }
      else if(e.key === 'Escape'){ e.preventDefault(); closeSpell(); }
    });
    el.addEventListener('paste', e => {
      e.preventDefault();
      const s = (e.clipboardData.getData('text') || '').replace(/[^A-Za-z]/g,'');
      s.split('').slice(0, cells.length - i).forEach((ch, k) => { cells[i+k].value = ch; });
      const nxt = Math.min(i + s.length, cells.length - 1); cells[nxt].focus();
      if(cells.every(x => x.value)) pmCheck();
    });
  });
  $('pmFb').className = 'pmfb'; $('pmFb').textContent = '';
  $('pmFt').innerHTML = '<button class="bt ghost" id="pmSkip">稍后再练</button>';
  $('pmSkip').onclick = () => closeSpell();
  $('pmask').classList.add('show'); $('pmask').setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';          /* 弹窗打开时锁住背景滚动 */
  setTimeout(() => { if(cells[0]) cells[0].focus(); }, 60);
}
function closeSpell(){
  $('pmask').classList.remove('show'); $('pmask').setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  pmCard = null; pmCb = null;
}
function pmCheck(){
  if(!pmCard) return;
  const cells = [...$('pmGrid').querySelectorAll('.lcell')];
  const typed = cells.map(x => x.value).join('');
  const editable = cells.filter(x => !x.readOnly);
  if(editable.some(x => !x.value)) { toast('还没填完'); return; }
  const ok = typed.toLowerCase() === pmCard.sp.toLowerCase();
  cells.forEach(x => x.classList.remove('ok','bad'));
  if(ok){
    cells.forEach(x => x.classList.add('ok'));
    $('pmFb').className = 'pmfb ok'; $('pmFb').textContent = '✓ 正确';
    st.spelled[pmCard.sp] = 1; save();
    const cb = pmCb, first = pmFirst;
    $('pmFt').innerHTML = '';
    setTimeout(() => { closeSpell(); if(cb) cb(first); }, 720);
  } else {
    cells.forEach(x => x.classList.add('bad'));
    $('pmFb').className = 'pmfb bad'; $('pmFb').textContent = '✗ 应为 ' + pmCard.sp;
    pmFirst = false;
    $('pmFt').innerHTML = '<button class="bt ghost" id="pmAgain">再试一次</button>'
      + '<button class="bt play" id="pmGo">继续</button>';
    $('pmAgain').onclick = () => openSpell(pmCard, pmCb, true);
    $('pmGo').onclick = () => { const cb = pmCb; closeSpell(); if(cb) cb(false); };
  }
}
$('pmask').addEventListener('click', e => { if(e.target === $('pmask')) closeSpell(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('pmask').classList.contains('show')) closeSpell(); });

/* ---------- 词表 / 专名 ---------- */
function renderList(f){
  const q = (f||'').trim().toLowerCase();
  const body = $('tb1');
  $('listSc').textContent = CORE.length + ' 张 ｜ 来源 ' + (q ? '筛选中' : '标注见下');
  body.innerHTML = CORE.filter(c => !q || c.term.toLowerCase().includes(q) || (c.zh||'').includes(q)).map(c =>
    '<tr><td class="en">' + esc(c.term) + '</td><td>' + esc(c.pos) + '</td><td class="zh">' + esc(c.zh) + '</td>'
    + '<td><span class="tag ' + (c.src3 ? 'src3' : 'src') + '">' + esc(c.src) + '</span></td>'
    + '<td class="ex">' + hl(c.q, c.term) + '<div style="color:#7a6a52;margin-top:3px">' + esc(c.tr) + '</div></td>'
    + '<td><button class="mini" data-k="' + esc(c.key) + '">词</button>'
    + '<button class="mini" data-k="' + esc(c.exk) + '" style="margin-left:4px">句</button></td></tr>').join('');
  body.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => play(b.dataset.k));
}
function renderApp(f){
  const q = (f||'').trim().toLowerCase();
  $('appSc').textContent = APP.length + ' 条 ｜ 篇名·人名·朝代·体裁（拼音）：可认、不测、无音频';
  $('tb2').innerHTML = APP.filter(c => !q || c.term.toLowerCase().includes(q) || (c.zh||'').includes(q)).map(c =>
    '<tr><td class="en">' + esc(c.term) + '</td><td class="zh">' + esc(c.zh) + '</td>'
    + '<td><span class="tag ap">' + esc(c.cat) + '</span></td><td class="ex">' + esc(c.note) + '</td></tr>').join('');
}

/* ---------- 视图 ---------- */
function switchView(v){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v));
  $('viewStudy').style.display = v === 'study' ? '' : 'none';
  $('viewList').style.display = v === 'list' ? '' : 'none';
  $('viewApp').style.display = v === 'app' ? '' : 'none';
  if(v === 'list') renderList($('q1').value);
  if(v === 'app') renderApp($('q2').value);
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => switchView(t.dataset.v));
document.querySelectorAll('[data-v]').forEach(b => {
  if(b.classList.contains('tab')) return;
  b.onclick = () => { st.voice = b.dataset.v; save();
    document.querySelectorAll('.ctl [data-v]').forEach(x => x.classList.toggle('on', x.dataset.v === st.voice)); };
});
document.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => {
  st.fs = Math.max(0.85, Math.min(1.5, st.fs + 0.08 * +b.dataset.fs)); save();
  document.documentElement.style.setProperty('--fs', st.fs); toast('字号 ' + Math.round(st.fs * 100) + '%');
});
$('q1').addEventListener('input', e => renderList(e.target.value));
$('q2').addEventListener('input', e => renderApp(e.target.value));

/* ---------- 初始化 ---------- */
document.documentElement.style.setProperty('--fs', st.fs);
document.querySelectorAll('.ctl [data-v]').forEach(x => x.classList.toggle('on', x.dataset.v === st.voice));
$('nStudy').textContent = TODAY_GOAL;
$('nList').textContent = CORE.length;
$('nApp').textContent = APP.length;
renderStudy();
</script>
</body>
