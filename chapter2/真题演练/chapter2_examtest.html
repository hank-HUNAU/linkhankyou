.iscore .tgt.ok{color:var(--green)}

: "断句:单分句;核心=①;话题:补主语(→Chinese);时锚:现在→一般现在时;文化:汉语→Chinese(S4 通译)；本族语→native tongue", "ta": "补主语；修饰语后置（spoken as a native tongue…）。", "te": "增补（now）；被动分词定语（spoken as…）。", "rp": ["the language spoken by the largest number of people`（L2·PC）", "native tongue`（L2·PC）。"], "ptrn": ""}, {"cat": "真题B", "set": "CET6 2019·06·S2", "map": "汉语", "cls": "Chapter 2", "term": "", "zh": "", "cn": "汉语与西方语言的一个重要区别在于它是以方块字(character)而不是以字母构成的。", "en": "An important difference between Chinese and Western languages is that Chinese is composed of characters rather than letters.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"汉字\"官方短语见 China Daily，S1；\"方块字\"从原卷括注 character（同源提示）。", "tip": "断句:单分句;核心=①;话题:补主语(→An important difference);表语从句(that…);文化:方块字→Chinese characters(原卷括注 character)；汉字→S1 Chinese characters", "ta": "补主语；意合→形合（表语从句 that…）；名词化（\"区别\"→difference）。", "te": "惯用等值（\"不是…而是…\"→rather than）；被动（be composed of，Vinay & Darbelnet 1958）。", "rp": ["the difference between A and B is that…`（L2·SB）→ 本句实例：An important difference between Chinese and Western languages is that…", "be composed of`（L2·PC）。"], "ptrn": ""}, {"cat": "真题B", "set": "CET6 2019·06·S2", "map": "汉语", "cls": "Chapter 2", "term": "", "zh": "", "cn": "目前仍在使用的书写系统中，汉语是最古老的。", "en": "Among the writing systems still in use today, Chinese is the oldest.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"书写系统\"官方短语见 China Daily，S1。", "tip": "断句:单分句;核心=①;话题:句首框架状语(在…书写系统中)→Among…;补主语(→Chinese);时锚:目前→一般现在时;文化:书写系统→S1 writing system", "ta": "状语前置（Among…，连淑能 1993）；补主语。", "te": "省略（后置定语 still in use 简述）；增补（today）。", "rp": ["the writing systems still in use`（L2·PC）", "among …`（L2·PC）。"], "ptrn": ""}, {"cat": "真题B", "set": "CET6 2019·06·S2", "map": "汉语", "cls": "Chapter 2", "term": "", "zh": "", "cn": "在中国，来自不同地区的人可能听不懂对方的方言，但由于汉字有统一的书写形式，他们交流起来几乎没有任何困难。", "en": "In China, people from different regions may not understand each other's dialects, but because Chinese characters have a uniform written form, they have almost no difficulty communicating.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"统一的书写形式\"官方短语见 China Daily，S1。", "tip": "断句:分句①②;核心=②;①→让步/背景;逻辑:因果→because;话题:补主语(→people / they);文化:方言→Chinese dialects；统一的书写形式→S1 a uniform written form", "ta": "补主语；意合→形合（因果 because，连淑能 1993）。", "te": "增补（In China）；词性转换（\"交流\"→communicating）。", "rp": ["have no difficulty V-ing`（L2·SB）→ 本句实例：…they have almost no difficulty communicating", "a uniform written form`（L2·PC）。"], "ptrn": ""}, {"cat": "真题B", "set": "CET6 2019·06·S2", "map": "汉语", "cls": "Chapter 2", "term": "", "zh": "", "cn": "汉语历史上对团结中华民族发挥了重要作用。", "en": "Historically, Chinese has played an important role in uniting the Chinese nation.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"中华民族\"官方行文 S1；\"团结\"库内首选 S1（lasting unity），本句取 uniting 通译并存。", "tip": "断句:单分句;核心=①;话题:补主语(→Chinese);时锚:历史上→一般过去/现在完成;文化:团结→S1 lasting unity(库内)；中华民族→S1 the Chinese nation", "ta": "补主语；状语前置（Historically）。", "te": "副词化（\"历史上\"→Historically）；词性转换（\"团结\"→uniting）。", "rp": ["play an important role in V-ing`（L2·PC）。"], "ptrn": ""}, {"cat": "真题B", "set": "CET6 2019·06·S2", "map": "汉语", "cls": "Chapter 2", "term": "", "zh": "", "cn": "今天，随着中国经济的快速增长和全球影响力的增强，越来越多其他国家的人也开始学习汉语。", "en": "Today, with China's rapid economic growth and growing global influence, more and more people in other countries are beginning to learn Chinese.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"随着中国经济增长与国际影响力提升\"官方短语见 China Daily，S1（本句按原文措辞微调）。", "tip": "断句:单分句;核心=①;话题:句首框架状语(随着…)→with 短语;补主语(→more and more people);时锚:今天→一般现在时;文化:随着中国经济增长与国际影响力提升→S1 With China's growing economic power and global influence", "ta": "状语前置（with…，连淑能 1993）；补主语；时态呼应（现在进行时，连淑能 1993）。", "te": "增补（rapid / growing）；词性转换（\"增强\"→growing）。", "rp": ["with the rapid growth of`（L2·PC）", "more and more`（L2·PC）。"], "ptrn": ""}, {"cat": "真题A", "set": "CET6 2019·06·S3", "map": "成语", "cls": "Chapter 2", "term": "", "zh": "", "cn": "成语(Chinese idioms)是汉语中的一种独特的表达方式，大多由四个汉字组成。", "en": "Chengyu, or Chinese idioms, is a unique form of expression in Chinese, most of which consist of four characters.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"成语\"库内首选 S1 chengyu（China Daily 语言点），原卷括注 Chinese idioms（异译并存）；\"由四个字组成\"库内 S1（consists of four characters）。", "tip": "断句:分句①\"成语是…表达方式\"/②\"大多由…组成\";核心=①;②→非限定定语从句(most of which…);话题:补主语(→Chengyu)；文化:成语→S1 chengyu|原卷括注 Chinese idioms；由四个字组成→S1 consists of four characters", "ta": "补主语；意合→形合（分句②→非限定定语从句，连淑能 1993）；同位语。", "te": "增补（or）；词性转换（\"表达方式\"→a form of expression）。", "rp": ["a unique form of expression`（L2·PC）", "most of which consist of`（L2·SB）→ 本句实例：…Chinese idioms, most of which consist of four characters。"], "ptrn": ""}, {"cat": "真题A", "set": "CET6 2019·06·S3", "map": "成语", "cls": "Chapter 2", "term": "", "zh": "", "cn": "它们高度简练且形式固定，但通常能形象地表达深刻的含义。", "en": "They are highly concise and fixed in form, yet they can usually express profound meanings in a vivid way.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"蕴含深刻的含义\"库内 S1（have a deep meaning），本句取 express profound meanings 通译并存。", "tip": "断句:分句①②;核心=①;②→并列转折(yet…);逻辑:转折→yet;话题:承前主语(→They);文化:简练→concise；深刻的含义→S1 have a deep meaning(库内)", "ta": "承前补主语；意合→形合（转折 yet，连淑能 1993）。", "te": "副词化（\"高度\"→highly）；增补（in a vivid way）。", "rp": ["be concise and fixed in form`（L2·PC）", "express profound meanings`（L2·PC）。"], "ptrn": ""}, {"cat": "真题A", "set": "CET6 2019·06·S3", "map": "成语", "cls": "Chapter 2", "term": "", "zh": "", "cn": "成语大多来源于中国古代的文学作品，通常与某些神话、传说或者历史事件有关。", "en": "Most chengyu come from ancient Chinese literary works and are usually related to certain myths, legends or historical events.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"中国古代文学\"官方短语见 China Daily 语言点，S1；\"神话\"库内 S1（classical Chinese mythology）。", "tip": "断句:分句①②;核心=①;②→并列谓语(and are usually…);逻辑:并列→and;话题:补主语(→Most chengyu);文化:中国古代文学→S1 ancient Chinese literature；神话→S1 classical Chinese mythology", "ta": "补主语；意合→形合（并列谓语，连淑能 1993）。", "te": "增补（certain）；惯用等值（\"与…有关\"→be related to）。", "rp": ["be related to`（L2·PC）", "myths, legends or historical events`（L2·PC）。"], "ptrn": ""}, {"cat": "真题A", "set": "CET6 2019·06·S3", "map": "成语", "cls": "Chapter 2", "term": "", "zh": "", "cn": "如果不知道某个成语的出处，就很难理解其确切含义。", "en": "If one does not know the origin of a certain chengyu, it is hard to understand its exact meaning.", "srcEn": "S2 · 整句无官方译文（整理编译）。", "tip": "断句:单复句(如果…就…);核心=②;①→条件状语从句(If…);逻辑:条件→If;话题:形式主语(It is hard to…)(CL-02)", "ta": "意合→形合（条件 If，连淑能 1993）；形式主语（It is hard to…，连淑能 1993）。", "te": "增补（exact / one）；词性转换（\"出处\"→origin）。", "rp": ["If …, it is hard to …`（L2·SB）→ 本句实例：If one does not know the origin…, it is hard to understand its exact meaning", "the origin of`（L2·PC）。"], "ptrn": ""}, {"cat": "真题A", "set": "CET6 2019·06·S3", "map": "成语", "cls": "Chapter 2", "term": "", "zh": "", "cn": "因此，学习成语有助于人们更好地理解中国传统文化。", "en": "Therefore, learning chengyu helps people to better understand traditional Chinese culture.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"中国传统文化\"官方短语见 China Daily，S1。", "tip": "断句:单分句;核心=①;逻辑:因果→Therefore;话题:动名词主语(→learning chengyu)(CL-02);文化:中国传统文化→S1 traditional Chinese culture", "ta": "动名词主语（Learning chengyu…，连淑能 1993）；连接词 Therefore。", "te": "增补（better）；词性转换（\"理解\"→understand）。", "rp": ["help sb (to) do sth`（L2·PC）", "traditional Chinese culture`（L2·PC）。"], "ptrn": ""}, {"cat": "真题A", "set": "CET6 2019·06·S3", "map": "成语", "cls": "Chapter 2", "term": "", "zh": "", "cn": "成语在日常会话和文学创作中广泛使用。", "en": "Chengyu are widely used in daily conversation and literary creation.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"文学创作\"库内标 S3。", "tip": "断句:单分句;核心=①;话题:受事→被动(广泛使用→be widely used);文化:文学创作→S3 literary work(库内)", "ta": "受事→被动（be widely used，CL-04）。", "te": "增补（widely）；词性转换。", "rp": ["be widely used in`（L2·PC）。"], "ptrn": ""}, {"cat": "真题A", "set": "CET6 2019·06·S3", "map": "成语", "cls": "Chapter 2", "term": "", "zh": "", "cn": "恰当使用成语可以使一个人的语言更具表现力，交流更有效。", "en": "Using chengyu appropriately can make one's language more expressive and one's communication more effective.", "srcEn": "S2 · 整句无官方译文（整理编译）。", "tip": "断句:单分句;核心=①;触发[使]→make+A+adj;话题:动名词主语(→Using chengyu appropriately)(CL-02)", "ta": "动名词主语（连淑能 1993）；使役转移（\"使…更…\"→make…more…）。", "te": "副词化（\"恰当\"→appropriately）；增补（more）。", "rp": ["make sth more + adj`（L2·SB）→ 本句实例：…can make one's language more expressive and one's communication more effective", "expressiveness`（L2·PC）。"], "ptrn": ""}, {"cat": "真题B", "set": "CET4 2019·12·S3", "map": "姓名", "cls": "Chapter 2", "term": "", "zh": "", "cn": "中国汉族人的全名由姓和名组成。", "en": "The full name of a Han Chinese consists of a surname and a given name.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"汉族/姓/名\"无 whitelist 同形定译，标 S4（the Han ethnic group / surname / given name）。", "tip": "断句:单分句;核心=①;话题:补主语(→The full name);意合→形合(由…组成→consists of);文化:汉族→the Han ethnic group(S4)；姓/名→surname/given name", "ta": "补主语；意合→形合（\"由…组成\"→consist of）。", "te": "增补（full）；词性转换。", "rp": ["consist of A and B`（L2·PC）", "a surname and a given name`（L2·PC）。"], "ptrn": ""}, {"cat": "真题B", "set": "CET4 2019·12·S3", "map": "姓名", "cls": "Chapter 2", "term": "", "zh": "", "cn": "中文姓名的特点是，姓总是在前，名跟在其后。", "en": "A characteristic of Chinese names is that the surname always comes first, followed by the given name.", "srcEn": "S2 · 整句无官方译文（整理编译）。", "tip": "断句:单分句;核心=①;表语从句(that…);话题:补主语(→A characteristic of Chinese names);文化:姓/名→surname/given name", "ta": "补主语；意合→形合（表语从句）；名词化（\"特点\"→characteristic）。", "te": "过去分词状语（followed by…）；增补（always）。", "rp": ["a characteristic of … is that…`（L2·SB）→ 本句实例：A characteristic of Chinese names is that the surname always comes first…", "be followed by`（L2·PC）。"], "ptrn": ""}, {"cat": "真题B", "set": "CET4 2019·12·S3", "map": "姓名", "cls": "Chapter 2", "term": "", "zh": "", "cn": "千百年来，父姓一直世代相传。", "en": "For thousands of years, the father's surname has been passed down from generation to generation.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"世代相传\"无 whitelist 同形，按义通译 S4。", "tip": "断句:单分句;核心=①;话题:句首框架状语(千百年来)→For…;受事→被动(世代相传→be passed down);时锚:千百年来→现在完成时;文化:世代相传→S4 passed down from generation to generation", "ta": "受事→被动（be passed down，CL-04）；状语前置（连淑能 1993）；时态呼应（现在完成时，连淑能 1993）。", "te": "惯用等值（\"世代相传\"→passed down from generation to generation）。", "rp": ["be passed down from generation to generation`（L2·PC）。"], "ptrn": ""}, {"cat": "真题B", "set": "CET4 2019·12·S3", "map": "姓名", "cls": "Chapter 2", "term": "", "zh": "", "cn": "然而，如今，孩子跟母亲姓并不罕见。", "en": "However, nowadays it is not uncommon for a child to take the mother's surname.", "srcEn": "S2 · 整句无官方译文（整理编译）。", "tip": "断句:单分句;核心=①;逻辑:转折→However;话题:形式主语(It is not uncommon for…to…)(CL-02);时锚:如今→一般现在时", "ta": "形式主语（It is not uncommon…，连淑能 1993）；连接词 However。", "te": "双重否定（\"并不罕见\"→not uncommon，Vinay & Darbelnet 1958）。", "rp": ["it is not uncommon for sb to do sth`（L2·SB）→ 本句实例：…it is not uncommon for a child to take the mother's surname", "take the mother's surname`（L2·PC）。"], "ptrn": ""}, {"cat": "真题B", "set": "CET4 2019·12·S3", "map": "姓名", "cls": "Chapter 2", "term": "", "zh": "", "cn": "一般来说，名有一个或两个汉字，通常承载父母对孩子的愿望。", "en": "Generally speaking, a given name has one or two Chinese characters and usually carries the parents' hopes for their child.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"汉字\"官方短语见 China Daily，S1。", "tip": "断句:分句①②;核心=①;②→并列谓语(and usually…);话题:补主语(→a given name);文化:汉字→S1 Chinese characters", "ta": "补主语；意合→形合（并列，连淑能 1993）。", "te": "增补（Generally speaking / usually）。", "rp": ["generally speaking`（L2·PC）", "carry the parents' hopes for`（L2·PC）。"], "ptrn": ""}, {"cat": "真题B", "set": "CET4 2019·12·S3", "map": "姓名", "cls": "Chapter 2", "term": "", "zh": "", "cn": "从孩子的名字可以推断出父母希望孩子成为什么样的人，或者期望他们过什么样的生活。", "en": "From a child's name, one can infer what kind of person the parents hope the child will become, or what kind of life they expect them to lead.", "srcEn": "S2 · 整句无官方译文（整理编译）。", "tip": "断句:单分句;核心=①;话题:无主句→补泛指主语(one);句首框架状语(从…名字)→From…;文化:推断→infer", "ta": "补泛指主语（one，Li & Thompson 1976）；状语前置（连淑能 1993）。", "te": "增补（kind of）；宾语从句并列（what…, or what…）。", "rp": ["infer … from …`（L2·PC）", "lead a life`（L2·PC）。"], "ptrn": ""}, {"cat": "真题B", "set": "CET4 2019·12·S3", "map": "姓名", "cls": "Chapter 2", "term": "", "zh": "", "cn": "父母非常重视给孩子取名，因为名字往往会伴随孩子一生。", "en": "Parents attach great importance to naming their children, because a name often accompanies a child throughout his or her life.", "srcEn": "S2 · 整句无官方译文（整理编译）。", "tip": "断句:分句①②;核心=①;②→原因状语从句(because…);逻辑:因果→because;话题:补主语(→Parents);文化:取名→naming", "ta": "补主语；意合→形合（因果 because，连淑能 1993）。", "te": "惯用等值（\"重视\"→attach great importance to）；增补（throughout his or her life）。", "rp": ["attach great importance to`（L2·PC）", "accompany sb throughout one's life`（L2·PC）。"], "ptrn": ""}, {"cat": "真题A", "set": "CET4 2024·06·S3", "map": "福字", "cls": "Chapter 2", "term": "", "zh": "", "cn": "汉语中的“福”字 (the character fu) 表示幸福和好运，是中国传统文化中最常用的吉祥 (auspicious)符号之一。", "en": "The Chinese character \"fu\" (meaning good fortune) in Chinese signifies happiness and good luck, and is one of the most commonly used auspicious symbols in traditional Chinese culture.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"福\"字官方英文 the Chinese character \"fu\"（新华社/中国网），S1；\"幸福\"\"好运\"\"吉祥\"分别见 China Daily/新华社，S1。", "tip": "断句:分句①\"福字表示幸福和好运\"/②\"是…吉祥符号之一\";核心=①;②→并列谓语(and is…);话题:补主语(→The Chinese character \"fu\");文化:福字→S1 the Chinese character \"fu\"(新华社/中国网)；幸福→S1 happiness；好运→S1 good luck；吉祥→S1 auspicious；传统文化→S1 traditional Chinese culture；备注:[原卷如此]（\"“福”字 (the character fu)\"全角引号＋半角括号＋空格，照抄不改）", "ta": "补主语；意合→形合（并列谓语，连淑能 1993）。", "te": "增补（meaning good fortune）；词性转换。", "rp": ["the Chinese character \"fu\"`（L2·PC）", "one of the most commonly used … symbols`（L2·PC）。"], "ptrn": ""}, {"cat": "真题A", "set": "CET4 2024·06·S3", "map": "福字", "cls": "Chapter 2", "term": "Family", "zh": "家", "cn": "人们通常将一个大大的福字写在红纸上，寓意期盼家庭幸福、社会安定、国家昌盛。", "en": "People usually write a big fu character on red paper, symbolizing the hope for family happiness, social stability and national prosperity.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"繁荣\"库内 S1（prosperity）。", "tip": "断句:分句①②;核心=①;②→分词状语(symbolizing…)(CL-03);话题:补主语(→People);文化:红纸→red paper；家庭幸福/社会安定/国家昌盛→family happiness, social stability, national prosperity；繁荣→S1 prosperity", "ta": "补主语；分词状语（symbolizing…，连淑能 1993）。", "te": "增补（big / national）；并列名词短语。", "rp": ["symbolizing the hope for`（L2·PC）", "family happiness, social stability and national prosperity`（L2·PC）。"], "ptrn": ""}, {"cat": "真题A", "set": "CET4 2024·06·S3", "map": "福字", "cls": "Chapter 2", "term": "Spring Festival", "zh": "春节", "cn": "春节贴福字是民间由来已久的习俗。", "en": "Pasting up fu characters during the Spring Festival is a long-standing folk custom.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"春节\"官方定译 the Spring Festival，S1。", "tip": "断句:单分句;核心=①;话题:动名词主语(→Pasting up fu characters…)(CL-02);文化:春节→S1 the Spring Festival；习俗→folk custom", "ta": "动名词主语（连淑能 1993）；名词化（\"贴\"→pasting up）。", "te": "词性转换（\"由来已久\"→long-standing）。", "rp": ["a long-standing folk custom`（L2·PC）。"], "ptrn": ""}, {"cat": "真题A", "set": "CET4 2024·06·S3", "map": "福字", "cls": "Chapter 2", "term": "Spring Festival", "zh": "春节", "cn": "为了欢庆春节，家家户户都会将福字贴在门上或墙上，表达对幸福生活的向往、对美好未来的期待。", "en": "To celebrate the Spring Festival, every household pastes fu characters on doors or walls to express their yearning for a happy life and their expectation of a bright future.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"春节\"定译 S1；\"对美好生活的向往\"官方短语见 China Daily Asia，S1。", "tip": "断句:分句①\"为了欢庆春节\"/②\"家家户户…贴…表达…\";核心=②;①→目的状语(To V…)(CL-07);②内\"表达…\"→目的状语(to express…);文化:春节→S1 the Spring Festival；对美好生活的向往→S1 yearning for a better life", "ta": "目的状语前置（To V…，CL-07，连淑能 1993）；补主语。", "te": "增补（bright）；并列名词短语（\"向往…期待\"→yearning… and expectation…）。", "rp": ["To V …, S + V … to express …`（L2·SB）→ 本句实例：To celebrate the Spring Festival, every household pastes fu characters… to express their yearning…", "yearning for a happy life`（L2·PC）。"], "ptrn": ""}, {"cat": "真题A", "set": "CET4 2024·06·S3", "map": "福字", "cls": "Chapter 2", "term": "", "zh": "", "cn": "人们有时还将福字倒过来贴，表示幸福已到、好运已到。", "en": "People sometimes even paste the fu character upside down, indicating that happiness and good fortune have arrived.", "srcEn": "S2 · 整句无官方译文（整理编译）；\"倒贴\"\"福气到了\"官方短语见中国网，S1。", "tip": "断句:分句①②;核心=①;②→分   raw=raw.replace(/^(to|be|is|are|was|were|being|a|an|the)\s+/i,'');
  return normT(raw).split(' ').filter(Boolean);
}
function tokEq(u,g){
  u=normT(u);g=normT(g);
  if(u===g)return true;
  var sufs=['ing','ies','es','ed','ly','s','d'];
  var base=function(w){for(var i=0;i<sufs.length;i++){if(w.slice(-sufs[i].length)===sufs[i])return w.slice(0,w.length-sufs[i].length);}return w;};
  var bu=base(u),bg=base(g);
  if(bu===bg)return true;
  if(bu+'e'===bg)return true;
  if(bu===bg+'e')return true;
  return false;
}
function inspect(user,term){
  var utoks=normT(user).split(' ').filter(Boolean);
  var gold=goldList(term).filter(function(g){return g.length>=3;});
  var k=0;
  for(var u=0;u<utoks.length&&k<gold.length;u++){if(tokEq(utoks[u],gold[k]))k++;}
  return {ok:k===gold.length,missing:gold.slice(k),total:gold.length,covered:k};
}
function blankOk(user,term){return inspect(user,term).ok;}
/* 逐词对照参考译文：未覆盖的重点词以 <gap> 标红，回答"差在哪" */
function refDiff(user,en){
  var uv=' '+normT(user)+' ';
  return String(en).split(/(\s+)/).map(function(part){
    if(!part.trim())return esc(part);
    var t=normT(part.trim());
    if(t.length<3||STOP[t])return esc(part);
    return uv.indexOf(' '+t+' ')!==-1?esc(part):'<span class="gap">'+esc(part.replace(/[.,;:!?()]/g,''))+'</span>';
  }).join('');
}
function setSel(v){sel[i]=v;if(v==='unsure')st[i]='w';else if(v==='sure')st[i]='c';save();if(mode==='rev'&&seq().indexOf(i)<0)ensureInSeq();render();}
function check(){
  var e=EXAMS[i],tin=$('tin');
  var val=tin?tin.value.trim():'';
  if(!val)return;
  var ok=blankOk(val,e.term);
  var rs=inspect(val,e.term);
  st[i]=ok?'c':'w';save();
  var core=coreTerm(e);
  var pct=rs.total?Math.min(100,Math.round(rs.covered/rs.total*100)):100;
  var h='<div class="row"><span class="lbl">已写出</span><div class="bar"><i style="width:'+pct+'%"></i></div><b class="'+(ok?'ok':'no')+'">'+pct+'%</b></div>';
  if(ok)h+='<div class="tgt ok">关键表达写全了 ✓「'+esc(core)+'」</div>';
  else h+='<div class="tgt no">还差：<b>'+esc(rs.missing.join('、'))+'</b></div>';
  h+='<div class="gapbox"><div class="gl">对照参考译文：<b style="color:var(--red2)">红字</b>是你还没写到的词</div><div class="en">'+refDiff(val,e.en)+'</div></div>';
  h+='<div class="selfrow">'
    +'<span class="sm-l">自己感觉？</span>'
    +'<button class="sm '+(sel[i]==='sure'?'on':'')+'" data-s="sure">很有把握</button>'
    +'<button class="sm '+(sel[i]==='ok'?'on':'')+'" data-s="ok">还行</button>'
    +'<button class="sm '+(sel[i]==='unsure'?'on':'')+'" data-s="unsure">不确定</button>'
    +'</div>';
  sc[i]=h;
  ansOpen=true;
  ensureInSeq();
  render();
}
function seq(){
  var out=[];
  for(var k=0;k<N;k++){if(mode==='rev'?(st[k]==='w'):true)out.push(k);}
  return out;
}
function tallies(){var a=0,b=0;for(var k=0;k<N;k++){if(st[k]==='c')a++;else if(st[k]==='w')b++;}return[a,b];}
function ensureInSeq(){
  if(mode==='rev'){
    var S=seq();
    if(S.indexOf(i)<0){ if(S.length)i=S[0]; else {mode='all';i=0;} }
  }
}
function viewTabs(){return '<div class="vtabs"><button class="vtab '+(view==='card'?'on':'')+'" id="vcard"><span class="vi">📖</span>学习卡</button><button class="vtab '+(view==='test'?'on':'')+'" id="vtest"><span class="vi">✎</span>自测卡</button></div>';}
function bindView(){var t=$('vtest');if(t)t.onclick=function(){view='test';save();render();focusTin();};var c=$('vcard');if(c)c.onclick=function(){view='card';save();render();};}
function renderCard(){
  var e=EXAMS[i],S=seq(),pos=S.indexOf(i);
  var rp=Array.isArray(e.rp)?e.rp:[];
  var teItems=(e.te||'').split('；').filter(function(s){return s&&String(s).replace(/[\s·:：]/g,'').length;});
  var rpHtml='';
  if(rp.length){rpHtml=rp.map(function(s){var p=String(s).split('|');return '<div class="rpit"><span class="src-tag">词卡复现</span><span class="cn">'+esc(p[0]||'')+'</span><span class="sep">→</span><span class="en">'+esc(p[1]||'')+'</span></div>';}).join('');}
  else{rpHtml='<div class="rp-none">暂无匹配的复现表达 · 可到本页词卡「真题扩展 / 高频补充」中复习相关表达</div>';}
  var teHtml=teItems.length?teItems.map(function(s,j){return '<div class="teit"><span class="dot">'+(j+1)+'</span><div>'+esc(s)+'</div></div>';}).join(''):'<div class="rp-none">—</div>';
  var done=Object.keys(st).length;
  var srcTxt='译文来源：'+esc(e.srcEn||'整理编译 · 非官方定稿 · 仅供自测对照');
  $('qal').innerHTML=
    '<div class="prow"><div class="pbar"><i style="width:'+Math.round(done/N*100)+'%"></i></div><div class="pstat">已答 <b class="'+(done?'ok':'')+'">'+done+'/'+N+'</b> · 学习卡合集</div></div>'
    +viewTabs()
    +'<div class="qbox cvcard">'
    +'<div class="qcnt"><span class="cv-badge">学习卡</span><span class="qt">第 '+(pos+1)+' / '+S.length+' 题 · '+esc(e.cat||'')+(e.set?' · '+esc(e.set):'')+'</span></div>'
    +'<div class="zh">'+esc(e.cn)+'</div>'
    +'<div class="cv-ans"><div class="cv-ans-h">参考译文</div><div class="cen">'+renderEn(e)+'</div><div class="csrc">'+srcTxt+'</div></div>'
    +'<div class="cgrid">'
    +'<section class="csec c-tsec"><h6><span class="num">3</span><span class="lab">翻译策略</span></h6><div class="c-ta"><span class="c-tag">策略</span>'+esc(e.ta||'先确立主语与核心动词，再按英语习惯展开修饰与状语。')+'</div></section>'
    +'<section class="csec c-tsec"><h6><span class="num">4</span><span class="lab">翻译技巧</span></h6><div class="c-te">'+teHtml+'</div></section>'
    +'<section class="csec c-tsec"><h6><span class="num">5</span><span class="lab">重点表达</span></h6><div class="c-chunk"><span class="zh">'+esc(e.zh||'')+'</span><span class="arr">→</span><span class="en">'+esc(e.term||'')+'</span></div></section>'
    +'<section class="csec c-tsec"><h6><span class="num">6</span><span class="lab">复现表达</span></h6><div class="c-rp">'+rpHtml+'</div></section>'
    +'</div>'
    +'</div>'
    +'<div class="fbar"><button id="prev" '+((pos<=0)?'disabled':'')+'>‹</button><span class="pg">'+(pos+1)+' / '+S.length+'</span><button id="next" '+((pos>=S.length-1)?'disabled':'')+'>›</button></div>';
  bindCard();
}
function bindCard(){
  bindView();
  var S=seq();
  var p=$('prev'),n=$('next');
  if(p)p.onclick=function(){var ps=seq().indexOf(i);if(ps>0){i=seq()[ps-1];render();}};
  if(n)n.onclick=function(){var ps=seq().indexOf(i);var L=seq().length;if(ps<L-1){i=seq()[ps+1];render();}};
}
function render(){
  ensureInSeq();
  if(view==='card'){renderCard();return;}
  var e=EXAMS[i];
  var S=seq(),pos=S.indexOf(i);
  var done=Object.keys(st).length, pct=Math.round(done/N*100);
  var badge=!st[i]?'<span class="sb new">○ 未答</span>':(st[i]==='c'?'<span class="sb ok">✓ 已掌握</span>':'<span class="sb bad">● 待复习</span>');
  $('qal').innerHTML=
    '<div class="prow"><div class="pbar"><i style="width:'+pct+'%"></i></div><div class="pstat">已答 '+(done?'<b>'+done+'/'+N+'</b>':'<b>0/'+N+'</b>')+' · 整句挑战</div></div>'
    +viewTabs()
    +'<div class="qbox">'
    +'<div class="qcnt">'+badge+'<span class="qt">第 '+(pos+1)+' / '+S.length+' 题</span></div>'
    +'<div class="zh">'+esc(e.cn)+'</div>'
    +'<div class="inwrap">'
    +'<div class="tnote">整句挑战 · 写完停顿片刻，或按 Ctrl+Enter 自动核对</div>'
    +'<textarea id="tin" rows="3" placeholder="在此输入整句英文翻译…写完后稍等，自动核对并显示参考译文"></textarea>'
    +'<div class="iscore" id="iscore">'+(sc[i]||'')+'</div>'
    +'</div>'
    +'<div class="ans '+(ansOpen?'open':'')+'" id="ans"><h5>参考译文 · 与你的对照</h5><div class="en">'+renderEn(e)+'</div>'
    +(e.tip?'<details class="tipd" '+(ansOpen?'open':'')+'><summary>译点解析 · 检查汉英差异</summary><div class="trows">'+tipRows(e.tip)+'</div></details>':'')
    +'<div class="src">译文来源：'+esc(e.srcEn||'整理编译 · 非官方定稿 · 仅供自测对照')+'</div><details class="how"><summary>来源与核查说明</summary><p>本卷参考译文为整理编译，非官方定稿，仅供自测对照。逐句核查渠道：China Daily（中国日报网）、Xinhua（新华社英文）、CGTN、SCIO（国务院新闻办英文）等官方英文，检索整句及关键短语的官方译法；命中即注明出处，未命中如实标注，不编造译文或来源。</p></details></div>'
    +'</div>'
    +'<div class="fbar"><button id="prev" '+(pos<=0?'disabled':'')+'>‹</button><span class="pg">'+(pos+1)+' / '+S.length+'</span><button id="next" '+(pos>=S.length-1?'disabled':'')+'>›</button></div>';
  var tin=$('tin');if(tin)tin.value=draft[i]||'';
  bind();
}
function focusTin(){var t=$('tin');if(t)t.focus();}
function bind(){
  bindView();
  var S=seq();
  var p=$('prev'),n=$('next');
  if(p)p.onclick=function(){var ps=seq().indexOf(i);if(ps>0){i=seq()[ps-1];sc[i]='';ansOpen=false;if(_chkT)clearTimeout(_chkT);save();render();focusTin();}};
  if(n)n.onclick=function(){var ps=seq().indexOf(i);if(ps<seq().length-1){i=seq()[ps+1];sc[i]='';ansOpen=false;if(_chkT)clearTimeout(_chkT);save();render();focusTin();}};
  var sms=$('iscore')&&$('iscore').querySelectorAll?$('iscore').querySelectorAll('.sm'):[];
  if(sms)for(var si=0;si<sms.length;si++)(function(btn){btn.onclick=function(){setSel(btn.getAttribute('data-s'));};})(sms[si]);
  var tin=$('tin');if(tin){
    tin.oninput=function(){
      draft[i]=tin.value;save();
      if(sc[i]){sc[i]='';var s=$('iscore');if(s)s.innerHTML='';}
      if(_chkT)clearTimeout(_chkT);
      _chkT=setTimeout(function(){var t=$('tin');if(t&&t.value.trim()){check();}},1100);
    };
  }
}
function renderEn(e){
  var s=esc(e.en),t=esc(e.term);
  var core=t;
  var m=core.match(/^(be|to|is|are|was|were|being|a|an|the)\s+/i);
  if(m)core=core.slice(m[0].length);
  var idx=s.toLowerCase().indexOf(core.toLowerCase());
  if(core.length>=3 && idx>=0){ s=s.slice(0,idx)+'<span class="hl">'+s.slice(idx,idx+core.length)+'</span>'+s.slice(idx+core.length); }
  return s;
}
function renderPtn(ptrn,term){return esc(ptrn);}
function ptnShow(ptrn){return esc(ptrn||'').replace(/[_＿]+/g,function(m){return '<span class="blank">'+m+'</span>';});}
function tipRows(tips){
  var map={'增补':'add','省略':'omit','语序':'order','转换':'conv','搭配':'coll','表达':'expr','专名':'name','语态':'voice','时态':'tense','句法':'syn'};
  return (tips||'').split(String.fromCharCode(10)).filter(Boolean).map(function(line){
    var m=line.match(/^([^｜]+)｜(.*)$/);
    var tag=m?m[1]:'要点'; var rest=m?m[2]:line; var key=map[tag]||'gen';
    var icons={add:'▲ 增补',omit:'▽ 省略',order:'⇄ 语序',conv:'◈ 转换',coll:'◆ 搭配',expr:'✎ 表达',name:'◎ 专名',voice:'▷ 语态',tense:'◷ 时态',syn:'⌗ 句法',gen:'• 要点'};
    return '<div class="trow"><span class="tk tk-'+key+'">'+icons[key]+'</span>'+esc(rest)+'</div>';
  }).join('');
}
function fillRow(term){var toks=goldList(term)||[];return toks.map(function(t){return new Array((t.length||1)+1).join('_');}).join(' ');}
window.addEventListener('keydown',function(e){
  var tag=(e.target&&e.target.tagName||'').toLowerCase();
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();if(tag==='textarea'||tag==='input')check();return;}
  if(tag==='textarea'||tag==='input')return;
  var S=seq(),ps=S.indexOf(i);
  if(e.key==='ArrowLeft'){if(ps>0){i=S[ps-1];ansOpen=false;hintOpen=false;render();focusTin();}}
  else if(e.key==='ArrowRight'){if(ps<S.length-1){i=S[ps+1];ansOpen=false;hintOpen=false;render();focusTin();}}
});
render();focusTin();
</script></body></html>
