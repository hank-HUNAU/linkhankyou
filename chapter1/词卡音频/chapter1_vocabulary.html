<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《中国文化概况》Chapter 1 · 哲学与宗教 在线预习 · 复习 · 自测</title>
<style>
:root{--red:#5c1a1a;--red2:#8c2a26;--gold:#c2912a;--paper:#ece9e0;--card:#fff;--line:#cfbfa0;--exbg:#faf6ec;--ink:#222;--muted:#6f6a58;--green:#1c6e3c;--fs:1}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",SimSun,sans-serif;background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}
.hdr{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#5c1a1a,#8c2a26);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hdr-top{max-width:1040px;margin:0 auto;padding:10px 14px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.title{font-size:16px;font-weight:800;letter-spacing:.5px}
.title small{font-weight:400;font-size:12px;opacity:.85;margin-left:6px}
.stats{font-size:12px;background:rgba(255,255,255,.14);border-radius:14px;padding:3px 12px}
.hdr-right{display:flex;align-items:center;gap:10px}
.hlink{background:rgba(255,255,255,.16);color:#ffe9c9;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;text-decoration:none;white-space:nowrap}
.hlink:hover{background:rgba(255,255,255,.3);color:#fff}
.modebar{max-width:1040px;margin:0 auto;padding:4px 14px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,255,255,.16);border-radius:8px;padding:2px;gap:2px}
.seg button{border:none;background:transparent;color:#fff;font-size:13px;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600}
.seg button.on{background:#fff;color:var(--red)}
.ctl{display:flex;align-items:center;gap:4px;font-size:12px;color:#ffe9c9;margin-left:auto}
.ctl b{font-weight:700;margin-right:4px}
.ctl .grp{display:inline-flex;background:rgba(0,0,0,.25);border-radius:6px;overflow:hidden;margin-right:8px}
.ctl .grp button{background:transparent;border:none;color:#ffe9c9;font-size:12px;padding:4px 9px;cursor:pointer}
.ctl .grp button.on{background:rgba(255,255,255,.3);color:#fff;font-weight:700}
.fsctl{display:flex;align-items:center;gap:2px}
.fsctl button{background:rgba(0,0,0,.25);border:none;color:#fff;width:26px;height:26px;border-radius:5px;font-weight:800;cursor:pointer;font-size:14px}
.fsctl .val{min-width:46px;text-align:center;font-size:12px}
.tabs{max-width:1040px;margin:10px auto 4px;padding:0 14px;display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:7px 16px;background:#fff;border:1px solid var(--line);border-radius:20px;font-size:13px;cursor:pointer;color:#4a3d2a;font-weight:600}
.tab.on{background:var(--red);color:#fff;border-color:var(--red)}
.tab .n{font-size:11px;opacity:.8;margin-left:4px}
/* ---- 滑动分组导航 ---- */
.decknav{max-width:1040px;margin:8px auto 0;padding:0 14px;display:none;align-items:center;gap:10px}
.pgmid{flex:1;display:flex;flex-direction:column;gap:4px;align-items:center}
.pgnum{font-size:13px;font-weight:700;color:var(--red2)}
.pgtrack{width:100%;height:6px;background:#d8cfba;border-radius:4px;overflow:hidden}
.pgfill{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.decknav .bt{white-space:nowrap}
.hint{max-width:1040px;margin:4px auto 0;padding:0 14px;font-size:12px;color:var(--muted);display:none}
.hint b{color:var(--red2)}
.msg{max-width:1040px;margin:8px auto;padding:0 14px}
.rkmode{font-size:12px;color:var(--muted);text-align:center;margin:2px 0 2px}
.bar{max-width:1040px;margin:6px auto 0;padding:0 14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.bar .track{flex:1;height:8px;background:#d8cfba;border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--green);width:0;transition:width .3s}
.wrap{max-width:1040px;margin:12px auto 70px;padding:0 14px}
/* ---- 预习：翻转卡（分组） ---- */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.pcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;min-height:172px;transition:opacity .2s;overflow:hidden}
.pcard:hover{border-color:#b09a75}
.pcard.done .pword{opacity:.35}
.pcard.done .pback{opacity:.6}
.pfront{position:absolute;inset:0;z-index:2;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;transform-origin:top center;transition:transform .42s cubic-bezier(.2,.7,.3,1),opacity .3s}
.pcard.open .pfront{transform:rotateX(84deg) scale(.97);opacity:0;pointer-events:none}
.pword{font-family:"Segoe UI",Georgia,serif;font-weight:800;color:#174a7f;font-size:calc(26px*var(--fs));line-height:1.25;word-break:break-word;max-width:100%}
.pfoothint{font-size:calc(12.5px*var(--fs));color:var(--muted)}
.pstat{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:background .2s,border-color .2s}
.pstat svg{width:14px;height:14px;display:block}
.pcard:not(.done) .pstat{background:var(--card);border:1.5px solid var(--line)}
.pcard:not(.done) .pstat svg{opacity:0}
.pcard.done .pstat{background:var(--green);border:1.5px solid var(--green)}
.pcard.done .pstat svg{stroke:#fff;opacity:1}
.pback{padding:20px 24px;display:flex;flex-direction:column;gap:12px}
.pback .phd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:100%}
.pback .en{font-family:"Segoe UI",Georgia,serif;font-weight:800;color:#174a7f;font-size:calc(19px*var(--fs));line-height:1.25;word-break:break-word}
.pback .zh{font-weight:700;color:var(--red2);background:#f3e6d0;padding:4px 12px;border-radius:6px;font-size:calc(14px*var(--fs));white-space:nowrap;flex-shrink:0;margin-top:2px}
.pback .q{font-size:calc(13.5px*var(--fs));color:#7a4a1a;line-height:1.6}
.pback .lbl{color:var(--muted);font-weight:700;font-size:calc(10.5px*var(--fs));margin-right:4px}
.pback .tr{font-size:calc(13.5px*var(--fs));color:var(--green);font-style:italic}
.pback .bk{font-size:calc(12px*var(--fs));color:#8a6410}
.acts{display:flex;gap:10px;margin-top:2px;flex-wrap:wrap}
.bt.mark{width:36px;height:32px;padding:0;justify-content:center;align-items:center}
.bt.mark svg{width:16px;height:16px;display:block}
.bt.mark:not(.master) svg{stroke:#7a8a76}
.bt.mark.master svg{stroke:#fff}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:44px 0;background:var(--card);border:1px dashed var(--line);border-radius:14px}
/* ---- 复习自测 ---- */
.quiz{max-width:680px;margin:0 auto}
.qcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 28px;box-shadow:0 4px 16px rgba(0,0,0,.06);min-height:280px;display:flex;flex-direction:column}
.ring{position:absolute;left:16px;top:16px;width:46px;height:46px;pointer-events:none}
.ringbg{fill:none;stroke:#d8cfba;stroke-width:4}
.ringfg{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round}
.ringt{font:600 9px "Microsoft YaHei",sans-serif;fill:var(--green)}
.qdir{font-size:12.5px;color:var(--muted);text-align:right;margin-bottom:6px}
.qprompt{font-size:calc(26px*var(--fs));font-weight:800;color:var(--red);line-height:1.3;text-align:center;margin:auto 0;font-family:"Segoe UI",Georgia,serif}
.qans{font-size:calc(21px*var(--fs));font-weight:800;color:#174a7f;text-align:center;margin:8px 0;font-family:"Segoe UI",Georgia,serif}
.qgrid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:flex-end;margin:18px auto;max-width:760px}
.wordcell{width:3.6em;box-sizing:border-box;padding:5px 0;border:none;border-bottom:2px solid var(--line);border-radius:0;background:transparent;font-size:calc(22px*var(--fs));font-family:"Segoe UI",monospace;text-align:center;color:var(--red2);caret-color:var(--red2)}
.wordcell:focus{outline:none;border-bottom-color:var(--red2)}
.wordcell.ok{border-bottom-color:var(--green);color:var(--green)}
.wordcell.err{border-bottom-color:#d9534f;color:#d9534f}
.fillok{color:var(--green);font-weight:700}
.fillerr{color:#d9534f;font-weight:700;text-decoration:underline}
.cap{font-size:11px;color:#8a6410;text-align:center;margin:2px 0 4px}
.cap b{font-weight:700;color:#b06a1b}
.blankline{display:inline-block;vertical-align:bottom;border-bottom:2px solid var(--red2);height:1.05em;width:3.4em;margin:0 4px}
.qsen{font-size:calc(15px*var(--fs));color:#4a3d2a;line-height:1.75;text-align:center;margin:12px 0 4px;font-family:"Segoe UI",Georgia,serif}
.qsen .blank{color:var(--red2);font-weight:800;letter-spacing:2px}
.qtr{font-size:calc(14px*var(--fs));color:var(--green);font-style:italic;text-align:center;margin:0 0 8px}
.qnote{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px}
.qhint{font-size:11.5px;color:#b3a98a;text-align:center;margin:10px 0 6px}
.qhint b{color:var(--red2);font-weight:800}
.qex{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.qeline{display:flex;align-items:flex-start;margin-bottom:8px}
.qelabel{flex:0 0 68px;box-sizing:border-box;font-size:10.5px;color:var(--red2);font-weight:700;border:1px solid #e3cdb8;border-radius:999px;padding:2px 5px;margin-right:12px;text-align:center;background:#fbf3e6}
.qetext{flex:1;font-size:calc(14px*var(--fs));line-height:1.7;color:#7a4a1a}
.qetext.tr{color:var(--green);font-style:italic}
.qeline.bk{margin-top:3px}
.qeline.bk .qelabel{color:#8a6410;border-color:#e6d7ab;background:#faf5e6}
.qeline.bk .qetext{font-size:12px;color:#8a6410}
.reveal{opacity:.18;filter:blur(6px);pointer-events:none}
.qfoot{display:flex;justify-content:space-between;align-items:center;max-width:680px;margin:16px auto 0;gap:10px;flex-wrap:wrap}
.qbar{font-size:12px;color:var(--muted);text-align:center;margin:10px auto 4px}
.qbar b{color:var(--red)}
.retag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:#e8953a;border-radius:999px;padding:1px 8px}
.rkmode b{color:var(--red2);font-weight:700}
.qelabel.src,.qetext.src{cursor:pointer}
.qeline .qetext.src{color:#86702a;font-size:11px;text-decoration:underline dotted}
.qfoot .bt.pw{display:inline-flex;align-items:center;gap:5px}
.qfoot .ic{font-size:14px;line-height:1}
.statsbar{max-width:1040px;margin:6px auto 0;padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px}
.si{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap}
.si b{color:var(--red2);margin-right:3px}
.si.all b{color:var(--red)}
.si .fl{display:inline-block;padding:0 7px;border-radius:999px;cursor:pointer;font-weight:700;margin:0 2px;transition:all .15s}
.si .fl.p{color:var(--green)}
.si .fl.u{color:#c0712a}
.si .fl.on{background:var(--red2);color:#fff}
.si .fl:hover{background:#f0e0c6}
.si .fl.on:hover{background:var(--red)}
.fnote{max-width:1040px;margin:6px auto 0;padding:6px 14px;font-size:12px;color:var(--red2);background:#fbeef0;border:1px dashed #e5b8bd;border-radius:8px}
.fnote b{font-weight:700}
.fnote .x{margin-left:8px;font-size:11px;color:#fff;background:var(--red2);border:none;border-radius:999px;padding:1px 10px;cursor:pointer}
.pback .src{display:block;font-size:11px;color:#8a6410;margin:2px 0;cursor:pointer;text-decoration:underline dotted}
.donecard{text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px;padding:40px 20px}
.donecard h2{color:var(--green);margin:0 0 8px}
/* ---- 通用控件 ---- */
.bt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#f4efe4;color:#4a3d2a;border-radius:10px;padding:8px 15px;font-size:calc(13px*var(--fs));cursor:pointer;font-weight:600}
.bt:hover{background:#ede5d2}
.bt.play{background:var(--red2);border-color:var(--red2);color:#fff}
.bt.master{background:var(--green);border-color:var(--green);color:#fff}
.bt.ghost{background:transparent}
.foot{max-width:1040px;margin:20px auto 30px;padding:0 14px;font-size:11px;color:var(--muted);line-height:1.7;text-align:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:640px){.ctl{width:100%;justify-content:flex-start;margin-left:0;margin-top:6px}.pgrid{grid-template-columns:1fr}}
@media(max-width:520px){.qfoot{flex-wrap:nowrap}.qfoot .bt.pw{flex:1;justify-content:center;padding:7px 2px;min-width:0}.qfoot .wl{display:none}.qcard{padding:20px 12px}.retag{margin-bottom:4px}.wordcell{width:2.8em;font-size:17px}.qgrid{gap:10px}}
/* ---- 工具条收纳（右上角 ☰） ---- */
.util{background:rgba(0,0,0,.25);border:1px solid #ffe9c9;color:#ffe9c9;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;line-height:1.2;cursor:pointer}
.util:hover{background:rgba(255,255,255,.3)}
body.focus .tabs,body.focus .statsbar,body.focus .foot,body.focus .fnote{display:none}
/* 自测：出错后灰显答案提示 */
.wordcell.gh{color:#bdb6a6;font-weight:400}
.wordcell.gh.ok{color:var(--green);font-weight:700}
/* 自测：取消边框卡片，直排于背景，输入栏自适应宽度 */
.quiz.qzsolo{max-width:1000px}
.quiz.qzsolo .qcard{background:transparent;border:none;box-shadow:none;padding:16px 6px;min-height:0}
.quiz.qzsolo .qcard .qdir{margin-bottom:12px;font-size:13px}
.quiz.qzsolo .qgrid{max-width:none;gap:16px 22px}
.wordcell{width:auto;min-width:2.2em;padding:6px 2px;position:relative}
.wordcell.gh::after{content:attr(data-hint);position:absolute;left:0;right:0;top:50%;transform:translateY(-52%);text-align:center;color:#c4bcad;font-weight:400;pointer-events:none}
.quiz.qzsolo .qcard .qsen{max-width:860px;margin:16px auto 6px;font-size:calc(17px*var(--fs));line-height:2;color:#3c342a}
.quiz.qzsolo .qcard .qtr{max-width:860px;margin:6px auto 0;font-size:calc(15px*var(--fs));line-height:1.9;color:var(--green)}
.quiz.qzsolo .qcard .qnote{font-size:12.5px;line-height:1.9;margin-top:10px}
.quiz.qzsolo .qhint{margin-top:18px;font-size:13px;letter-spacing:.3px;color:#7a6a50}
.quiz.qzsolo .cap{font-size:calc(12.5px*var(--fs));margin:4px 0 2px}
@media(max-width:520px){.quiz.qzsolo .qcard{padding:14px 2px}.quiz.qzsolo .qcard .qsen,.quiz.qzsolo .qcard .qtr{font-size:calc(15px*var(--fs))}}
/* 逐字浮现 · 幽灵拼写（透明输入 + 回声 + 灰色下一个字母） */
.wbox{position:relative;display:inline-block;vertical-align:bottom}
.wbox .wshow{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:flex-start;pointer-events:none;font-family:"Segoe UI",monospace;font-size:calc(22px*var(--fs));line-height:1.3;padding:6px 2px;box-sizing:border-box;white-space:nowrap;overflow:hidden}
.wbox .wok{color:#a89d88;font-weight:600}
.wbox.guided .wok{color:var(--green);font-weight:700}
.wbox .wrem{color:#c0b8a8;font-family:"Segoe UI",monospace}
.wbox .wordcell{width:100%;min-width:0;text-align:left;color:transparent;caret-color:var(--red2)}
.wordcell.flash{animation:wflash .32s ease}
@keyframes wflash{0%{background:rgba(185,64,64,.20)}100%{background:transparent}}
/* ---- 掌握确认弹窗：例句挖空 · 一字母一格 ---- */
.pmask{position:fixed;inset:0;background:rgba(40,30,20,.46);display:flex;align-items:center;justify-content:center;z-index:120;padding:16px;opacity:0;pointer-events:none;transition:opacity .18s}
.pmask.show{opacity:1;pointer-events:auto}
.pmodal{width:min(700px,100%);max-height:88vh;overflow:auto;background:#fffdf8;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(60,40,20,.28);padding:20px 22px 14px;transform:translateY(8px) scale(.985);transition:transform .18s}
.pmask.show .pmodal{transform:none}
.pmhd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pmtag{font-size:11.5px;font-weight:700;color:#fff;background:var(--red2);border-radius:999px;padding:2px 10px;white-space:nowrap}
.pmtag.t2{background:#8a6410}
.pmzh{font-size:calc(20px*var(--fs));font-weight:700;color:#3c342a}
.pmmeta{font-size:11.5px;color:var(--muted);margin:6px 0 12px}
.pmsen{font-size:calc(17px*var(--fs));line-height:2.6;color:#3c342a}
.pmtr{font-size:calc(14.5px*var(--fs));line-height:1.9;color:var(--green);font-style:italic;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.pmtr u{text-decoration:underline;text-decoration-color:var(--red2);text-decoration-thickness:2px;text-underline-offset:3px;font-style:normal;font-weight:700}
.pmgrid{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;vertical-align:middle;margin:0 5px;padding:2px 0}
.pmword{display:inline-flex;gap:5px}
.lcell{width:2em;height:2.35em;text-align:center;font-family:"Segoe UI",monospace;font-size:calc(19px*var(--fs));font-weight:700;color:var(--red2);border:1.5px solid #d8cdb6;border-radius:8px;background:#fff;outline:none;padding:0}
.lcell:focus{border-color:var(--red2);box-shadow:0 0 0 3px rgba(185,64,64,.14)}
.lcell.ok{border-color:var(--green);color:var(--green);background:#f3faf4}
.lcell.bad{border-color:#c0392b;background:#fdeceb;animation:lshake .3s}
@keyframes lshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.pmfb{min-height:21px;font-size:13px;font-weight:700;margin-top:12px}
.pmfb.ok{color:var(--green)}
.pmfb.bad{color:#c0392b}
.pmft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.pmft .bt{font-size:calc(12.5px*var(--fs));padding:7px 13px}
.pmnote{font-size:11.5px;color:#b3a98a;margin-top:2px}
@media(max-width:520px){.pmodal{padding:16px 13px 10px}.lcell{width:1.65em;height:2.1em;font-size:calc(17px*var(--fs))}.pmsen{line-height:2.35}}
</style></head><body>
<div class="hdr">
  <div class="hdr-top">
    <div class="title">《中国文化概况》Chapter 1 · 哲学与宗教<small>章节术语 93 条 · 按类别分组</small></div>

  </div>

      <button data-mode="preview" class="on">📖 预习</button>
      <button data-mode="review">🎯 复习</button>
      <button data-mode="quiz">✏️ 自测</button>
    </div>

      <b>音色</b>
      <span class="grp" id="regionG"><button data-v="gb" class="on">英式</button><button data-v="us">美式</button></span>
      <span class="grp" id="genderG"><button data-v="f" class="on">女声</button><button data-v="m">男声</button></span>
      <span class="fsctl"><button id="fsD">−</button><span class="val" id="fsVal">100%</span><button id="fsU">＋</button></span>

  </div>

<script>

function renderDeck(){

function cardTap(id){

function toggleMaster(id,btn){

    renderDeck(); toast(nowOn?'已标记掌握':'已取消掌握');

    if(nowOn) setTimeout(function(){ openPM(i); },140);

/* ==================== 渲染分发 ==================== */
function render(){
  var list=filtered();

    $('reviewCtl').innerHTML=''; $('payBar').style.display='none';
    $('decknav').style.display='flex'; $('deckHint').style.display='block'; $('revHint').style.display='none';
    buildPages(list);
  }else if(state.mode==='quiz'){

    $('decknav').style.display='none'; $('deckHint').style.display='none'; $('revHint').style.display='block';

  }else fn.style.display='none';
}
/* ==================== 复习/自测 ==================== */
var queue=[], qi=0, totalN=0, retryFlag={};
function scopeName(){ return state.tab==='' ? '全部' : state.tab; }
function filterSrc(v){
  state.mode='preview'; state.tab=''; state.search=v||'';
  document.querySelectorAll('#modeSeg button').forEach(function(x){x.classList.toggle('on',x.dataset.mode==='preview');});
  renderTabs(); persist(); render(); toast('已筛选出处：'+(v||''));
}
function startReview(list){
  $('payBar').style.display='';
  var un=list.filter(function(c){return !SAVED[c.id];}).length;
  $('reviewCtl').innerHTML='<div class="rkmode">复习范围：<b>'+scopeName()+'</b> · 未掌握 '+un+' 词 · 共 '+un*2+' 题（英→中 / 中→英 混合）</div>';
  retryFlag={};
  queue=[];
  list.forEach(function(c){
    if(SAVED[c.id]) return;
    queue.push({id:c.id,dir:'ef'});
    queue.push({id:c.id,dir:'fe'});
  });
  shuffle(queue); qi=0; totalN=queue.length;
  updatePay();
  if(!queue.length){ emptyReview(); return; }
  showCard();
}
function emptyReview(){
  $('grid').className='grid quiz';
  $('grid').innerHTML='<div class="donecard"><h2>🎉 本组全部掌握！</h2><p>当前筛选下没有未掌握的词卡。可以“洗牌重来”或切换分类继续。</p>'+
    '<p style="margin-top:14px"><button class="bt play" onclick="resetReview()">🔄 重置全部为未掌握</button> <button class="bt" onclick="shuffleReview()">🔀 重新洗牌</button></p></div>';
  updatePay();
}
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t; } return a; }
function updatePay(){
  var remain = queue.length - qi; var done = totalN - remain;
  $('payInfo').textContent = '剩余 '+remain+' / '+totalN;
  $('payFill').style.width = (totalN? (done/totalN*100):0)+'%';

function showCard(){
  if(qi>=queue.length){ queue=queue.slice(0,qi); doneReview(); return; }
  var q=queue[qi], card=ALL[q.id], ef=(q.dir==='ef');
  var qprompt = ef ? card.en : card.zh;

  $('grid').innerHTML =
    '<div class="qcard">'+
      '<div class="ring"><svg viewBox="0 0 46 46">'+
        '<circle class="ringbg" cx="23" cy="23" r="18"/>'+
        '<circle class="ringfg" cx="23" cy="23" r="18" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'" transform="rotate(-90 23 23)"/>'+
        '<text class="ringt" x="23" y="28" text-anchor="middle">'+Math.round(ratio*100)+'%</text>'+
      '</svg></div>'+
      '<div class="qdir">'+(retryFlag[card.id]?'<span class="retag">↻ 重点回看</span>　':'')+(ef?'看英文 → 回想中文':'看中文 → 回想英文')+'　第 <b>'+(qi+1)+'</b>/'+queue.length+' 题 · '+card.tab+'</div>'+
      '<div class="qprompt">'+esc(qprompt)+'</div>'+
      '<div id="revAns" class="reveal">'+
        '<div class="qans">'+esc(ef?card.zh:card.en)+'</div>'+
        ((card.q||card.tr||card.bk||card.dq)?'<div class="qex">'+
          (card.dq?'<div class="qeline"><span class="qelabel src">出处</span><span class="qetext src" data-src="'+esc(card.dq)+'" onclick="filterSrc(this.dataset.src);event.stopPropagation()">'+esc(card.dq)+'</span></div>':'')+
          (card.q?'<div class="qeline"><span class="qelabel">'+(card.type==='真题扩展'?'真题原句':'例句')+'</span><span class="qetext">'+esc(card.q)+'</span></div>':'')+
          (card.tr?'<div class="qeline"><span class="qelabel">译文</span><span class="qetext tr">'+esc(card.tr)+'</span></div>':'')+
          (card.bk?'<div class="qeline bk"><span class="qelabel">课本原句</span><span class="qetext">'+esc(card.bk)+'</span></div>':'')+
        '</div>':'')+
      '</div>'+
    '</div>'+
    '<div class="qfoot">'+
      '<button class="bt pw" id="peekBtn" onclick="peekToggle()"><span class="ic">👁</span><span class="wl">查看答案</span></button>'+
      '<button class="bt pw play" data-play="'+esc(card.key)+'" onclick="playWord(this.dataset.play)"><span class="ic">🔊</span><span class="wl">发音</span></button>'+
      (hasEx(card)?'<button class="bt pw" data-ex="'+card.id+'" onclick="playExample(ALL[+this.dataset.ex])"><span class="ic">🔊</span><span class="wl">例句</span></button>':'')+
      '<button class="bt pw ghost" data-rk="'+card.id+'" onclick="retry('+card.id+')"><span class="ic">↻</span><span class="wl">再练</span></button>'+
      '<button class="bt pw master" id="knowBtn" onclick="know()"><span class="ic">✓</span><span class="wl">会了</span></button>'+
    '</div>';

function peekToggle(){
  var a=$('revAns'); if(!a) return;
  if(a.classList.contains('reveal')){ a.classList.remove('reveal'); $('peekBtn').textContent='隐藏答案'; }
  else{ a.classList.add('reveal'); $('peekBtn').textContent='👁 查看答案'; }
}
function know(){
  var c=queue[qi]; if(!c) return; SAVED[c.id]=true; delete retryFlag[c.id]; qi++;
  try{ localStorage.setItem('ov_mastered',JSON.stringify(SAVED)); }catch(e){}
  refreshStats(); updatePay(); showCard(); toast('✓ 已掌握：'+c.id+' → +1');
}
function retry(id){
  var idx=-1; for(var i=qi;i<queue.length;i++){ if(queue[i].id===id){idx=i;break;} }
  if(idx<0){ qi++; showCard(); return; }
  var c=queue.splice(idx,1)[0]; retryFlag[id]=true; queue.push(c);
  if(idx===qi && qi>0) qi--;
  showCard(); toast('↻ 已加入再练，待会重现');
}
function reviewRetry(){
  var c=queue[qi]; if(!c || qi>=queue.length) return;
  retry(c.id);
}
function reviewKey(e){

  else if(k==='Enter'){ e.preventDefault(); know(); }

}

/* ==================== 自测（拼写） ==================== */
var qzQueue=[], qzI=0, qzN=0, qzRetry={};
function quizTarget(c){ return String(c.en||'').replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim(); }
function startQuiz(list){
  $('payBar').style.display='none';

  $('reviewCtl').innerHTML='<div class="rkmode">自测范围：<b>'+scopeName()+'</b> · 未掌握 '+un+' 词 · 看中文 → 拼写英文</div>';
  qzQueue=[]; qzRetry={};
  list.forEach(function(c){ if(!SAVED[c.id]) qzQueue.push(c.id); });
  shuffle(qzQueue); qzI=0; qzN=qzQueue.length;
  if(!qzN){ doneQuiz(); return; }
  showQuiz();
}
function quizTarget(c){ return String(c.en||'').replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim(); }
function pickSentence(c){
  var t=quizTarget(c); if(!t) return null;
  var tV=[t, t.charAt(0).toLowerCase()+t.slice(1)];
  var probes=[['q',c.q||''],['tr',c.tr||'']];
  for(var k=0;k<probes.length;k++){
    var text=probes[k][1]; if(!text) continue;
    var lo=text.toLowerCase(), hit=-1, hitv=-1;
    for(var v=0;v<tV.length;v++){ var idx2=lo.indexOf(tV[v].toLowerCase()); if(idx2>=0){ hit=idx2; hitv=v; break; } }
    if(hit>=0){ var found=tV[hitv]; var start=text.indexOf(found); if(start<0) start=hit;
      return {sent:text,start:start,len:found.length,target:found,kind:probes[k][0],partial:false,fallback:false};
    }
  }
  return {sent:null,start:-1,len:0,target:t,kind:'none',partial:false,fallback:true};
}
var qzAns='', curSc=null, qzWords=[], qzAlts=[], qzHints=[], qzAltMode=false, qzLens=[];
function capWords(s){
  var r=[]; (s||'').split(/\s+/).forEach(function(w){ if(w && /^[A-Z]/.test(w)) r.push(w); }); return r;
}
/* 下划线自适应词长：以幽灵拼写的等宽字体实际测量最宽可接受串的像素宽度，

function zhSentence(c){ return c.type==='真题扩展' ? (c.q||'') : (c.tr||''); }
function pmTargetRaw(c){
  var t=String(c.en||'').replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim();
  if(t.indexOf('/')>=0) t=t.split('/')[0].trim();
  return t;
}
/* 译文里把对应词汇的中文部分加下划线 */
function underlineZh(zh, text){
  if(!text) return '';
  var raw=String(zh||'').trim();
  if(!raw) return esc(text);
  var cands=[raw, raw.replace(/[（(][^）)]*[）)]/g,'').trim()];
  cands=cands.concat(raw.split(/[，、；\/·]/).map(function(x){return x.trim();}));
  cands=cands.concat([raw.replace(/[的地得]$/,''), raw.replace(/^[的地得]/,'')]);
  cands=cands.filter(function(x){return x && x.length>=2;});
  cands.sort(function(a,b){return b.length-a.length;});
  for(var i=0;i<cands.length;i++){
    var k=cands[i], idx=text.indexOf(k);
    if(idx>=0) return esc(text.slice(0,idx))+'<u>'+esc(k)+'</u>'+esc(text.slice(idx+k.length));
  }
  /* 末选兜底：取与译文的最长公共子串（≥2 字），
     处理「有记载的」对「…的有记载历史」这类词条与译文的用字差异 */
  var best='', bl=0;
  for(var a=0;a<raw.length;a++){
    for(var b=a+2;b<=raw.length;b++){
      var sub=raw.slice(a,b);
      if(sub.length>bl && text.indexOf(sub)>=0){ best=sub; bl=sub.length; }
    }
  }
  if(best){
    var j=text.indexOf(best);
    return esc(text.slice(0,j))+'<u>'+esc(best)+'</u>'+esc(text.slice(j+best.length));
  }
  return esc(text);
}

/* 在例句中定位词块：① 逐字 ② 忽略标点 ③ 逐词（容忍词形变化，如 consist/consists） */
var PM_IRR={am:'be',is:'be',are:'be',was:'be',were:'be',been:'be',being:'be',
  has:'have',had:'have',having:'have',made:'make',making:'make',took:'take',taken:'take',
  grew:'grow',grown:'grow',rose:'rise',risen:'rise',built:'build',became:'become',
  began:'begin',begun:'begin',found:'find',held:'hold',kept:'keep',left:'leave',lost:'lose',
  wrote:'write',written:'write',spoke:'speak',spoken:'speak',thought:'think',
  taught:'teach',told:'tell',saw:'see',seen:'see',ran:'run',sent:'send',met:'meet'};
function pmStem(w){
  w=String(w||'').toLowerCase();
  if(PM_IRR[w]) return PM_IRR[w];
  if(/ies$/.test(w)) return w.replace(/ies$/,'y');
  if(/ied$/.test(w)) return w.replace(/ied$/,'y');
  if(/ves$/.test(w)) return w.replace(/ves$/,'f');
  var s=w.replace(/(ing|ed|es|s)$/,'');
  return PM_IRR[s]||s;
}
function wordSpan(text, target){
  var tw=String(target||'').toLowerCase().split(/\s+/).filter(Boolean);
  if(!tw.length) return null;
  var m=[], re=/[A-Za-z0-9\u2019'\-]+/g, x;
  while((x=re.exec(text))!==null) m.push({w:x[0], i:x.index, e:x.index+x[0].length});
  for(var i=0;i+tw.length<=m.length;i++){
    var ok=true;
    for(var j=0;j<tw.length;j++){ if(pmStem(m[i+j].w)!==pmStem(tw[j])){ ok=false; break; } }
    if(ok) return {start:m[i].i, end:m[i+tw.length-1].e};
  }
  return null;
}
function findSpan(text, target){
  var t0=String(target||''); if(!t0) return null;
  var i=text.toLowerCase().indexOf(t0.toLowerCase());
  if(i>=0) return {start:i, end:i+t0.length};
  var norm='', map=[];
  for(var k=0;k<text.length;k++){
    var ch=text.charAt(k);
    if(/[A-Za-z0-9]/.test(ch)){ norm+=ch.toLowerCase(); map.push(k); }
    else if(norm && norm.charAt(norm.length-1)!==' '){ norm+=' '; map.push(k); }
  }
  var t=t0.toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
  if(t){
    var idx=norm.indexOf(t);
    if(idx>=0){
      var s=map[idx], e=map[Math.min(idx+t.length-1, map.length-1)];
      return {start:s, end:e+1};
    }
  }
  return wordSpan(text, t0);
}

    el.addEventListener('input',function(){
      el.value=String(el.value||'').replace(/[^A-Za-z]/g,'').slice(0,1);
      el.classList.remove('bad');

      else if(ev.key==='Escape'){ ev.preventDefault(); closePM(); }
      else if(ev.key==='Backspace'){ if(!el.value && idx>0){ pmCells[idx-1].value=''; pmCells[idx-1].classList.remove('ok','bad'); pmCells[idx-1].focus(); } }
      else if(ev.key==='ArrowLeft'&&idx>0){ ev.preventDefault(); pmCells[idx-1].focus(); }

  });

$('nextB').addEventListener('click',function(){ goPg(1); });
/* 键盘控制：预习=方向键切组，复习=空格/Enter/R/1/2 */
document.addEventListener('keydown',function(e){
  var t=e.target; if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT')) return;
  if(state.mode==='review'){ reviewKey(e); return; }
  if(state.mode!=='preview') return;
  if(e.key==='ArrowRight'){ e.preventDefault(); goPg(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); goPg(-1); }
});
/* 平板/触屏左右滑动切组（预习） */
var touchX0=null;
$('grid').addEventListener('touchstart',function(e){ if(state.mode==='preview') touchX0=e.changedTouches[0].clientX; },{passive:true});
$('grid').addEventListener('touchend',function(e){
  if(state.mode!=='preview' || touchX0==null) return;
  var dx=e.changedTouches[0].clientX - touchX0; touchX0=null;
  if(dx < -60) goPg(1); else if(dx > 60) goPg(-1);
});
/* ==================== 启动 ==================== */
renderTabs(); refreshStats(); setFs(fsIdx); pickVoice(); document.body.classList.add('focus'); applyFocus(); render();
</script>
</body></html>
