const RK={'—':0,'C2':6,'C1':5,'B2':4,'B1':3,'A2':2,'A1':1};
let sk='n';
function view(){
  const k=q.value.trim().toLowerCase(),lv=lvS.value,ch=chS.value;
  let rows=D.filter(r=>{
    if(lv&&r.c!==lv)return false;
    if(ch&&r.ch!==ch)return false;
    if(!k)return true;
    return r.w.includes(k)||(r.d&&r.d.toLowerCase().includes(k));
  });
  rows.sort((a,b)=>{
    if(sk==='w')return a.w.localeCompare(b.w);
    if(sk==='c')return ((RK[b.c]||RK[b.c==='—'?0:b.c]||0)-(RK[a.c]||0))||(b.n-a.n);
    return (b.n-a.n)||a.w.localeCompare(b.w);
  });
  const kk=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),rg=k?new RegExp(kk,'ig'):null;
  tb.innerHTML=rows.map(r=>{
    const w=rg?r.w.replace(rg,m=>`<span class="hl">${m}</span>`):r.w;
    const d=rg&&r.d?r.d.replace(rg,m=>`<span class="hl">${m}</span>`):(r.d||'');
    return `<tr><td class="w">${w}</td><td class="i">${r.i?"/"+r.i+"/":""}</td><td>${d}</td>

}
