aid to the arrangement of seats at the table: the host sits in the seat facing the main door, and the most important guest sits beside the host.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET4 2026·06·S2#4", "type": "sentence", "label": "进餐时，主人会不时地为客人添酒加菜。", "ch": 1, "full": "进餐时，主人会不时地为客人添酒加菜。", "en": "During the meal, the host from time to time refills the guests' glasses and serves them more food.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET4 2026·06·S2#5", "type": "sentence", "label": "这种独特的餐桌礼仪已延续了数千年，对促进和谐的人际交往起到了重要作用。", "ch": 1, "full": "这种独特的餐桌礼仪已延续了数千年，对促进和谐的人际交往起到了重要作用。", "en": "This distinctive dining etiquette has lasted for thousands of years and has played an important role in promoting harmonious interpersonal interaction.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET4 2026·06·S3#1", "type": "sentence", "label": "在中国传统文化中，亲朋好友之间互赠礼物是人际交往的一种重要礼节 (etiquet", "ch": 1, "full": "在中国传统文化中，亲朋好友之间互赠礼物是人际交往的一种重要礼节 (etiquette)。", "en": "In traditional Chinese culture, exchanging gifts among relatives and friends is an important form of etiquette in interpersonal interaction.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET4 2026·06·S3#2", "type": "sentence", "label": "赠送礼物不仅是物质的馈赠，更是情感的表达，是维系人际关系的重要纽带。", "ch": 1, "full": "赠送礼物不仅是物质的馈赠，更是情感的表达，是维系人际关系的重要纽带。", "en": "Giving a gift is not merely a material offering but an expression of feeling and an important bond that sustains interpersonal relationships.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET4 2026·06·S3#3", "type": "sentence", "label": "一份精心挑选、符合接受者喜好的礼物，往往能加深彼此的感情。", "ch": 1, "full": "一份精心挑选、符合接受者喜好的礼物，往往能加深彼此的感情。", "en": "A gift carefully chosen to suit the recipient's taste often deepens the affection between the two parties.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET4 2026·06·S3#4", "type": "sentence", "label": "中国人遵循“礼尚往来” (mutually exchanging courtes", "ch": 1, "full": "中国人遵循“礼尚往来” (mutually exchanging courtesies) 的传统，接受礼物时会表达谢意，并适时回赠礼物，以增进彼此的融洽关系。", "en": "Observing the tradition of “mutually exchanging courtesies”, the Chinese express their gratitude when they receive a gift and return one in due course, thereby enhancing the harmonious relationship between them.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET6 2014·12·S1#1", "type": "sentence", "label": "反映在艺术和文学中的乡村生活理想是中国文明的重要特征。", "ch": 1, "full": "反映在艺术和文学中的乡村生活理想是中国文明的重要特征。", "en": "The ideal of rural life as reflected in art and literature is an important feature of Chinese civilization.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET6 2014·12·S1#2", "type": "sentence", "label": "这在很大程度上归功于道家（Taoist) 对自然的情感。", "ch": 1, "full": "这在很大程度上归功于道家（Taoist) 对自然的情感。", "en": "This is to a large extent thanks to the Taoist love of nature.", "cls": "A", "pid": "u2_s2_p7", "sid": "u2_s2", "sec": "古代哲学的发展 Development of Ancient Chinese Philosophy", "cov": 0.255, "hits": ["道家"], "deg": 2}, {"id": "s:1:CET6 2014·12·S1#3", "type": "sentence", "label": "传统中国画有两个最受青睐的主题，一是家庭生活的各种幸福场景，画中往往有老人在饮茶", "ch": 1, "full": "传统中国画有两个最受青睐的主题，一是家庭生活的各种幸福场景，画中往往有老人在饮茶下棋，男人在耕耘收割，妇女在织布缝衣，小孩在户外玩耍。", "en": "Traditional Chinese painting has two favored themes. One is the various happy scenes of family life, in which old people are often seen drinking tea and playing chess, men plowing and harvesting, women weaving and sewing, and children playing outdoors.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET6 2014·12·S1#4", "type": "sentence", "label": "另一个则是乡村生活的种种乐趣，画有渔夫在湖上打渔，农夫在山上欲柴采药，或是书生坐", "ch": 1, "full": "另一个则是乡村生活的种种乐趣，画有渔夫在湖上打渔，农夫在山上欲柴采药，或是书生坐在松树下呤诗作画。", "en": "The other is the various pleasures of country life, with fishermen fishing on the lake, farmers cutting firewood and gathering herbs in the mountains, or scholars sitting under pine trees composing poems and painting.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET6 2014·12·S1#5", "type": "sentence", "label": "这两个主题可以分别代表儒家 (Confucian)和道家的生活理想。", "ch": 1, "full": "这两个主题可以分别代表儒家 (Confucian)和道家的生活理想。", "en": "These two themes can respectively represent the Confucian and the Taoist ideals of life.", "cls": "A", "pid": "u2_s2_p4", "sid": "u2_s2", "sec": "古代哲学的发展 Development of Ancient Chinese Philosophy", "cov": 0.27, "hits": ["儒家"], "deg": 2}, {"id": "s:1:CET6 2025·12·S1#1", "type": "sentence", "label": "尊老是中华民族的传统美德，深深植根于中国人的思想和行为中，是人们普遍遵守的行为规", "ch": 1, "full": "尊老是中华民族的传统美德，深深植根于中国人的思想和行为中，是人们普遍遵守的行为规范和社会准则。", "en": "Respecting the elderly is a traditional virtue of the Chinese nation, deeply rooted in the thoughts and behavior of the Chinese people and widely observed as a code of conduct and social norm.", "cls": "A", "pid": "u2_s2_p4", "sid": "u2_s2", "sec": "古代哲学的发展 Development of Ancient Chinese Philosophy", "cov": 0.262, "hits": ["准则", "植根于"], "deg": 2}, {"id": "s:1:CET6 2025·12·S1#2", "type": "sentence", "label": "在当今的中国，这种美德得到广泛传承。", "ch": 1, "full": "在当今的中国，这种美德得到广泛传承。", "en": "In China today, this virtue is widely passed down.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET6 2025·12·S1#3", "type": "sentence", "label": "社会各界积极营造敬老助老的社会氛围。", "ch": 1, "full": "社会各界积极营造敬老助老的社会氛围。", "en": "All sectors of society are actively fostering a social atmosphere of respecting and helping the elderly.", "cls": "A", "pid": "u2_s1_p3", "sid": "u2_s1", "sec": "引言与\"百家争鸣\"", "cov": 0.267, "hits": ["氛围"], "deg": 2}, {"id": "s:1:CET6 2025·12·S1#4", "type": "sentence", "label": "为老年人提供便利服务已成为社会共识，例如社区专门开设长者食堂，公共场所配置优先座", "ch": 1, "full": "为老年人提供便利服务已成为社会共识，例如社区专门开设长者食堂，公共场所配置优先座位。", "en": "Providing convenient services for the elderly has become a social consensus: communities have set up canteens for seniors, and priority seats have been provided in public places.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET6 2025·12·S1#5", "type": "sentence", "label": "政府还出台了一系列政策，为老年人的权益提供有力保障。", "ch": 1, "full": "政府还出台了一系列政策，为老年人的权益提供有力保障。", "en": "The government has also introduced a series of policies that provide strong protection for the rights and interests of the elderly.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET6 2025·12·S1#6", "type": "sentence", "label": "尊老是社会和谐与发展的重要基石，有助于培育良好的社会氛围，推动整个社会文明进步。", "ch": 1, "full": "尊老是社会和谐与发展的重要基石，有助于培育良好的社会氛围，推动整个社会文明进步。", "en": "Respecting the elderly is an important cornerstone of social harmony and development, helping to foster a sound social atmosphere and advance the civility and progress of society as a whole.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET6 2025·12·S3#1", "type": "sentence", "label": "节俭 (frugality) 是中华民族的传统美德。", "ch": 1, "full": "节俭 (frugality) 是中华民族的传统美德。", "en": "Frugality is a traditional virtue of the Chinese nation.", "cls": "A", "pid": "u2_s4_p2", "sid": "u2_s4", "sec": "中国伦理道德的特征 Characteristics of Chinese Ethics and Morality", "cov": 0.364, "hits": ["中华民族"], "deg": 2}, {"id": "s:1:CET6 2025·12·S3#2", "type": "sentence", "label": "在中国古代，生产力低下，先人们深知劳动成果来之不易，因而秉持节俭的理念。", "ch": 1, "full": "在中国古代，生产力低下，先人们深知劳动成果来之不易，因而秉持节俭的理念。", "en": "In ancient China, productivity was low, and our ancestors, well aware that the fruits of their labor were hard won, therefore upheld the idea of frugality.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET6 2025·12·S3#3", "type": "sentence", "label": "到了物质极大丰富的今天，中国人民依然坚持节俭的生活方式，体现了理性消费的生活理念", "ch": 1, "full": "到了物质极大丰富的今天，中国人民依然坚持节俭的生活方式，体现了理性消费的生活理念和对劳动的尊重。", "en": "Even in today's world of great material abundance, the Chinese people still maintain a frugal lifestyle, which reflects a philosophy of rational consumption and a respect for labor.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET6 2025·12·S3#4", "type": "sentence", "label": "近年来，中国政府持续加强节约型社会的建设，倡导“光盘行动”，减少食物浪费，提倡简", "ch": 1, "full": "近年来，中国政府持续加强节约型社会的建设，倡导“光盘行动”，减少食物浪费，提倡简约低碳的生活方式，推进资源循环利用，反对过度消费。", "en": "In recent years, the Chinese government has consistently strengthened the building of a resource-conserving society, promoting the Clear Your Plate Campaign, reducing food waste, encouraging a simple, low-carbon lifestyle, advancing resource recycling, and opposing excessive consumption.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:1:CET6 2025·12·S3#5", "type": "sentence", "label": "节约型社会的建设有力地推动了中国经济的高质量发展。", "ch": 1, "full": "节约型社会的建设有力地推动了中国经济的高质量发展。", "en": "The building of a resource-conserving society has given a strong boost to the high-quality development of China's economy.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET4 2019·12·S3#1", "type": "sentence", "label": "中国汉族人的全名由姓和名组成。", "ch": 2, "full": "中国汉族人的全名由姓和名组成。", "en": "The full name of a Han Chinese consists of a surname and a given name.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET4 2019·12·S3#2", "type": "sentence", "label": "中文姓名的特点是，姓总是在前，名跟在其后。", "ch": 2, "full": "中文姓名的特点是，姓总是在前，名跟在其后。", "en": "A distinctive feature of Chinese names is that the surname always comes first, followed by the given name.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET4 2019·12·S3#3", "type": "sentence", "label": "千百年来，父姓一直世代相传。", "ch": 2, "full": "千百年来，父姓一直世代相传。", "en": "For thousands of years, the father's surname has been passed down from generation to generation.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET4 2019·12·S3#4", "type": "sentence", "label": "然而，如今，孩子跟母亲姓并不罕见。", "ch": 2, "full": "然而，如今，孩子跟母亲姓并不罕见。", "en": "Today, however, it is not uncommon for children to take their mother's surname.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET4 2019·12·S3#5", "type": "sentence", "label": "一般来说，名有一个或两个汉字，通常承载父母对孩子的愿望。", "ch": 2, "full": "一般来说，名有一个或两个汉字，通常承载父母对孩子的愿望。", "en": "Generally speaking, a given name consists of one or two Chinese characters and usually carries the parents' wishes for their child.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET4 2019·12·S3#6", "type": "sentence", "label": "从孩子的名字可以推断出父母希望孩子成为什么样的人，或者期望他们过什么样的生活。", "ch": 2, "full": "从孩子的名字可以推断出父母希望孩子成为什么样的人，或者期望他们过什么样的生活。", "en": "A child's name reveals what kind of person the parents hope the child will become, or what kind of life they expect the child to lead.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET4 2019·12·S3#7", "type": "sentence", "label": "父母非常重视给孩子取名，因为名字往往会伴随孩子一生。", "ch": 2, "full": "父母非常重视给孩子取名，因为名字往往会伴随孩子一生。", "en": "Parents attach great importance to naming their children, because a name often accompanies a child throughout his or her life.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2014·06·S2#1", "type": "sentence", "label": "中文热词通常反映社会变化和文化，有些在外国媒体上愈来愈流行。", "ch": 2, "full": "中文热词通常反映社会变化和文化，有些在外国媒体上愈来愈流行。", "en": "Chinese buzzwords usually reflect social changes and culture, and some of them are becoming increasingly popular in foreign media.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2014·06·S2#2", "type": "sentence", "label": "例如,土豪（tuhao)和大妈（dama)都是老词，但已获取了新的意义。", "ch": 2, "full": "例如,土豪（tuhao)和大妈（dama)都是老词，但已获取了新的意义。", "en": "For example, tuhao and dama are both old words, but they have acquired new meanings.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2014·06·S2#3", "type": "sentence", "label": "土豪以前指欺压佃户和仆人的乡村地主，现在用于指花钱如流水或喜欢炫耀财富的人。", "ch": 2, "full": "土豪以前指欺压佃户和仆人的乡村地主，现在用于指花钱如流水或喜欢炫耀财富的人。", "en": "Tuhao used to refer to a rural landlord who oppressed tenant farmers and servants, but now it refers to someone who spends money like water or likes to show off his or her wealth.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2014·06·S2#4", "type": "sentence", "label": "也就是说，土豪有钱，但没有品位。", "ch": 2, "full": "也就是说，土豪有钱，但没有品位。", "en": "In other words, tuhao means having money but no taste.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2014·06·S2#5", "type": "sentence", "label": "大妈是对中年妇女的称呼，但现在特指不久前金价下跌时大量购买黄金的中国妇女。", "ch": 2, "full": "大妈是对中年妇女的称呼，但现在特指不久前金价下跌时大量购买黄金的中国妇女。", "en": "Dama is a term for middle-aged women, but now it specifically refers to the Chinese women who bought large quantities of gold when the price of gold fell not long ago.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2014·06·S2#6", "type": "sentence", "label": "土豪和大妈可能会被收入新版牛津(Oxford)英语词典。", "ch": 2, "full": "土豪和大妈可能会被收入新版牛津(Oxford)英语词典。", "en": "Tuhao and dama may be included in the new edition of the Oxford English Dictionary.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2014·06·S2#7", "type": "sentence", "label": "至今已有约 120 个中文词被加进了牛津英语词典,成了英语语言的一部分。", "ch": 2, "full": "至今已有约 120 个中文词被加进了牛津英语词典,成了英语语言的一部分。", "en": "So far, about 120 Chinese words have been added to the Oxford English Dictionary, becoming part of the English language.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2016·12·S2#1", "type": "sentence", "label": "随着中国经济的蓬勃发展，学汉语的人数迅速增加，使汉语成了世界上人们最爱学的语言之", "ch": 2, "full": "随着中国经济的蓬勃发展，学汉语的人数迅速增加，使汉语成了世界上人们最爱学的语言之一。", "en": "With the vigorous development of China's economy, the number of Chinese learners has increased rapidly, making Chinese one of the most popular languages to learn in the world.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2016·12·S2#2", "type": "sentence", "label": "近年来，中国大学在国际上的排名也有了明显的提高。", "ch": 2, "full": "近年来，中国大学在国际上的排名也有了明显的提高。", "en": "In recent years, the international rankings of Chinese universities have also improved markedly.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2016·12·S2#3", "type": "sentence", "label": "由于中国教育的巨大进步，中国成为最受海外学生欢迎的留学目的地之一就不足为奇了。", "ch": 2, "full": "由于中国教育的巨大进步，中国成为最受海外学生欢迎的留学目的地之一就不足为奇了。", "en": "Given the tremendous progress of Chinese education, it is not surprising that China has become one of the most popular destinations for overseas students.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2016·12·S2#4", "type": "sentence", "label": "2015 年，近 40 万国际学生蜂拥来到中国市场。", "ch": 2, "full": "2015 年，近 40 万国际学生蜂拥来到中国市场。", "en": "In 2015, nearly 400,000 international students flocked to the Chinese market.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2016·12·S2#5", "type": "sentence", "label": "他们学习的科目不再限于中国语言和文化，而包括科学与工程。", "ch": 2, "full": "他们学习的科目不再限于中国语言和文化，而包括科学与工程。", "en": "The subjects they study are no longer limited to Chinese language and culture, but include science and engineering.", "cls": "B", "pid": "u3_s1_p4", "sid": "u3_s1", "sec": "当代文学", "cov": 0.24, "hits": [], "deg": 2}, {"id": "s:2:CET6 2016·12·S2#6", "type": "sentence", "label": "在全球教育市场上，美国和英国仍占主导地位，但中国正在迅速赶上。", "ch": 2, "full": "在全球教育市场上，美国和英国仍占主导地位，但中国正在迅速赶上。", "en": "In the global education market, the United States and the United Kingdom still dominate, but China is catching up quickly.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2017·06·S3#1", "type": "sentence", "label": "唐朝始于618年，终于907年，是中国历史上最灿烂的时期。", "ch": 2, "full": "唐朝始于618年，终于907年，是中国历史上最灿烂的时期。", "en": "The Tang Dynasty began in 618 and ended in 907, and was the most glorious period in Chinese history.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2017·06·S3#2", "type": "sentence", "label": "经过近三百年的发展，唐代中国成为世界上最繁荣的强国，其首都长安是当时世界上最大的", "ch": 2, "full": "经过近三百年的发展，唐代中国成为世界上最繁荣的强国，其首都长安是当时世界上最大的都市。", "en": "After nearly three hundred years of development, Tang China became the most prosperous power in the world, and its capital Chang'an was the largest city in the world at that time.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2017·06·S3#3", "type": "sentence", "label": "这一时期，经济发达、商业繁荣、社会秩序稳定，甚至边境也对外开放。", "ch": 2, "full": "这一时期，经济发达、商业繁荣、社会秩序稳定，甚至边境也对外开放。", "en": "During this period, the economy was developed, commerce flourished and social order was stable; even the borders were open to the outside world.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2017·06·S3#4", "type": "sentence", "label": "随着城市化和财富的增加，艺术和文学也繁荣起来。", "ch": 2, "full": "随着城市化和财富的增加，艺术和文学也繁荣起来。", "en": "With urbanization and growing wealth, art and literature also flourished.", "cls": "B", "pid": "u1_s12_p1", "sid": "u1_s12", "sec": "明清小说", "cov": 0.2, "hits": [], "deg": 2}, {"id": "s:2:CET6 2017·06·S3#5", "type": "sentence", "label": "李白和杜甫是以作品简洁自然而著称的诗人。", "ch": 2, "full": "李白和杜甫是以作品简洁自然而著称的诗人。", "en": "Li Bai and Du Fu were poets known for the simplicity and naturalness of their works.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2017·06·S3#6", "type": "sentence", "label": "他们的诗歌打动了学者和普通人的心。", "ch": 2, "full": "他们的诗歌打动了学者和普通人的心。", "en": "Their poems touched the hearts of scholars and ordinary people alike.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2017·06·S3#7", "type": "sentence", "label": "即使在今天，他们的许多诗歌仍广为儿童及成人阅读背诵。", "ch": 2, "full": "即使在今天，他们的许多诗歌仍广为儿童及成人阅读背诵。", "en": "Even today, many of their poems are still widely read and recited by children and adults.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2019·06·S1#1", "type": "sentence", "label": "中国幅员辽阔，人口众多，很多地方人们都说自己的方言。", "ch": 2, "full": "中国幅员辽阔，人口众多，很多地方人们都说自己的方言。", "en": "China is a vast country with a large population, and in many places people speak their own dialects.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2019·06·S1#2", "type": "sentence", "label": "方言在发音上差别很大，词汇和语法差别较小。", "ch": 2, "full": "方言在发音上差别很大，词汇和语法差别较小。", "en": "Dialects differ greatly in pronunciation but only slightly in vocabulary and grammar.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2019·06·S1#3", "type": "sentence", "label": "有些方言，特别是北方和南方的方言，差异很大，以致于说不同方言的人常常很难听懂彼此", "ch": 2, "full": "有些方言，特别是北方和南方的方言，差异很大，以致于说不同方言的人常常很难听懂彼此的讲话。", "en": "Some dialects, especially those in the north and the south, differ so greatly that people who speak different dialects often find it hard to understand each other.", "cls": "B", "pid": "u1_s11_p1", "sid": "u1_s11", "sec": "元曲", "cov": 0.108, "hits": ["北方和南方"], "deg": 2}, {"id": "s:2:CET6 2019·06·S1#4", "type": "sentence", "label": "方言被认为是当地文化的一个组成部分，但近年来能说方言的人数不断减少。", "ch": 2, "full": "方言被认为是当地文化的一个组成部分，但近年来能说方言的人数不断减少。", "en": "Dialects are regarded as an integral part of local culture, but in recent years the number of people who can speak them has been steadily declining.", "cls": "B", "pid": "u1_s11_p2", "sid": "u1_s11", "sec": "元曲", "cov": 0.167, "hits": ["组成部分"], "deg": 2}, {"id": "s:2:CET6 2019·06·S1#5", "type": "sentence", "label": "为了鼓励 rs, this novel has been deeply loved by Chinese readers for centuries.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2020·09·S1#3", "type": "sentence", "label": "毫不夸张地说，几乎每个中国人都熟悉小说中的一些主要人物。", "ch": 2, "full": "毫不夸张地说，几乎每个中国人都熟悉小说中的一些主要人物。", "en": "It is no exaggeration to say that almost every Chinese is familiar with some of the main characters in the novel.", "cls": "B", "pid": "u1_s12_p5", "sid": "u1_s12", "sec": "明清小说", "cov": 0.22, "hits": [], "deg": 2}, {"id": "s:2:CET6 2020·09·S1#4", "type": "sentence", "label": "这部小说中的精彩故事在茶馆、戏剧舞台、广播电视、电影屏幕和无数家庭中反复讲述。", "ch": 2, "full": "这部小说中的精彩故事在茶馆、戏剧舞台、广播电视、电影屏幕和无数家庭中反复讲述。", "en": "The wonderful stories in this novel have been told and retold in teahouses, on the stage, on radio and television, on the cinema screen and in countless households.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2020·09·S1#5", "type": "sentence", "label": "事实上，这部小说的影响已经远远超出了国界。", "ch": 2, "full": "事实上，这部小说的影响已经远远超出了国界。", "en": "In fact, the influence of this novel has gone far beyond national borders.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2020·09·S1#6", "type": "sentence", "label": "越来越多的外国读者也感到这部小说里的故事生动感人、趣味盎然。", "ch": 2, "full": "越来越多的外国读者也感到这部小说里的故事生动感人、趣味盎然。", "en": "More and more foreign readers also find the stories in this novel vivid, moving and full of interest.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:2:CET6 2020·09·S2#1", "type": "sentence", "label": "《红楼梦》(Dream of the Red Chamber)是18世纪曹雪芹创", "ch": 2, "full": "《红楼梦》(Dream of the Red Chamber)是18世纪曹雪芹创作的一部小说。", "en": "Dream of the Red Chamber is a novel written by Cao Xueqin in the 18th century.", "cls": "A", "pid": "u1_s12_p9", "sid": "u1_s12", "sec": "明清小说", "cov": 0.42, "hits": ["红楼梦", "曹雪芹"], "deg": 2}, {"id": "s:2:CET6 2020·09·S2#2", "type": "sentence", "label": "曹雪芹基于自己痛 es and universities have advanced teaching philosophies and superior teaching resources, and should therefore become the main providers of continuing education.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:4:CET4 2023·06·S3#3", "type": "sentence", "label": "因此，近年来许多高校适应社会需求，加强与用人单位沟通，努力探索一条符合中国国情的", "ch": 4, "full": "因此，近年来许多高校适应社会需求，加强与用人单位沟通，努力探索一条符合中国国情的继续教育发展新路，以使继续教育在国家发展战略中发挥更大的作用。", "en": "Therefore, in recent years many colleges and universities have adapted to social needs, strengthened communication with employers, and worked hard to explore a new path of continuing education development suited to China's national conditions, so that continuing education can play a greater role in the national development strategy.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:4:CET4 2026·06·S1#1", "type": "sentence", "label": "中国有句老话：“一日为师，终身为父”。", "ch": 4, "full": "中国有句老话：“一日为师，终身为父”。", "en": "There is an old saying in China: \"One who teaches you for a day is like a father for life.\"", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:4:CET4 2026·06·S1#2", "type": "sentence", "label": "在中国人的观念里，老师不仅传授知识，更教给学生做人的道理。", "ch": 4, "full": "在中国人的观念里，老师不仅传授知识，更教给学生做人的道理。", "en": "In the eyes of Chinese people, teachers not only impart knowledge but also teach students the principles of how to conduct themselves.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:4:CET4 2026·06·S1#3", "type": "sentence", "label": "在古代，学生初次见老师时要举行隆重的仪式，足见老师地位之高。", "ch": 4, "full": "在古代，学生初次见老师时要举行隆重的仪式，足见老师地位之高。", "en": "In ancient times, a grand ceremony was held when students first met their teachers, which shows how high the status of teachers was.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:4:CET4 2026·06·S1#4", "type": "sentence", "label": "为弘扬尊师的优良传统，中国从1985年开始将每年的9月10日定为教师节。", "c : "sentence", "label": "人们将月饼作为礼物馈赠亲友或在家庭聚会上享用。", "ch": 7, "full": "人们将月饼作为礼物馈赠亲友或在家庭聚会上享用。", "en": "People give mooncakes as gifts to relatives and friends, or enjoy them at family gatherings.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET6 2013·12·S3#9", "type": "sentence", "label": "传统的月饼上带有“寿”（longevity）、“福”或“和”等字样。", "ch": 7, "full": "传统的月饼上带有“寿”（longevity）、“福”或“和”等字样。", "en": "Traditional mooncakes bear characters such as \"shou\" (longevity), \"fu\" (good fortune) and \"he\" (harmony).", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2020·12·S2#1", "type": "sentence", "label": "春节前夕吃团圆饭是中国人的传统。", "ch": 7, "full": "春节前夕吃团圆饭是中国人的传统。", "en": "Eating the reunion dinner on the eve of the Spring Festival is a Chinese tradition.", "cls": "A", "pid": "u2_s1_p1", "sid": "u2_s1", "sec": "春节", "cov": 0.357, "hits": ["春节"], "deg": 2}, {"id": "s:7:CET4 2020·12·S2#2", "type": "sentence", "label": "团圆饭是一年中最重要的晚餐，也是家庭团聚的最佳时机，家人生活在不同地方的家庭尤其", "ch": 7, "full": "团圆饭是一年中最重要的晚餐，也是家庭团聚的最佳时机，家人生活在不同地方的家庭尤其如此。", "en": "The reunion dinner is the most important dinner of the year and the best time for family reunions, especially for families whose members live in different places.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2020·12·S2#3", "type": "sentence", "label": "团圆饭上的菜看丰富多样，其中有些菜看有特殊含义。", "ch": 7, "full": "团圆饭上的菜看丰富多样，其中有些菜看有特殊含义。", "en": "The dishes at the reunion dinner are rich and varied, and some of them have special meanings.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2020·12·S2#4", "type": "sentence", "label": "例如，鱼是不可缺少的一道莱，因为汉语中的“鱼”宇和“余”宇听上去一样。", "ch": 7, "full": "例如，鱼是不可缺少的一道莱，因为汉语中的“鱼”宇和“余”宇听上去一样。", "en": "For example, fish is an indispensable dish, because the Chinese characters for \"fish\" and \"surplus\" sound the same.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2020·12·S2#5", "type": "sentence", "label": "在中国的许多地方，饺子也是一道重要的佳肴，因为饺子象征着财富和好运。", "ch": 7, "full": "在中国的许多地方，饺子也是一道重要的佳肴，因为饺子象征着财富和好运。", "en": "In many parts of China, jiaozi is also an important dish, because it symbolizes wealth and good luck.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2020·12·S3#1", "type": "sentence", "label": "，鱼是春节前夕餐桌上不可或缺的一道莱，因为汉语中“鱼”字的发音与“余”字的发音相", "ch": 7, "full": "，鱼是春节前夕餐桌上不可或缺的一道莱，因为汉语中“鱼”字的发音与“余”字的发音相同。", "en": "Fish is an indispensable dish on the dinner table on the eve of the Spring Festival, because the pronunciation of the Chinese character for \"fish\" is the same as that of \"surplus\".", "cls": "B", "pid": "u2_s3_p6", "sid": "u2_s3", "sec": "春节的活动", "cov": 0.214, "hits": ["春节", "不可或缺"], "deg": 2}, {"id": "s:7:CET4 2020·12·S3#2", "type": "sentence", "label": "正由于这个象征性的意义，春节期间鱼也作为礼物送给亲戚朋友。", "ch": 7, "full": "正由于这个象征性的意义，春节期间鱼也作为礼物送给亲戚朋友。", "en": "Because of this symbolic meaning, fish is also given as a gift to relatives and friends during the Spring Festival.", "cls": "B", "pid": "u2_s3_p9", "sid": "u2_s3", "sec": "春节的活动", "cov": 0.174, "hits": ["春节"], "deg": 2}, {"id": "s:7:CET4 2020·12·S3#3", "type": "sentence", "label": "鱼的象征意义据说源于中国传统文化。", "ch": 7, "full": "鱼的象征意义据说源于中国传统文化。", "en": "The symbolic meaning of fish is said to originate from traditional Chinese culture.", "cls": "B", "pid": "u2_s11_p6", "sid": "u2_s11", "sec": "中秋节", "cov": 0.333, "hits": [], "deg": 2}, {"id": "s:7:CET4 2020·12·S3#4", "type": "sentence", "label": "中国人有节省的传统，他们认为节省得愈多，就感到愈为安全。", "ch": 7, "full": "中国人有节省的传统，他们认为节省得愈多，就感到愈为安全。", "en": "Chinese people have a tradition of thrift: they believe that the more they save, the safer they feel.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2020·12·S3#5", "type": "sentence", "label": "今天，尽管人们愈来愈富裕了，但他们仍然认为节省是一种值得弘扬的美德。", "ch": 7, "full": "今天，尽管人们愈来愈富裕了，但他们仍然认为节省是一种值得弘扬的美德。", "en": "Today, although people are getting richer and richer, they still regard thrift as a virtue worth promoting.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2022·09·S2#1", "type": "sentence", "label": "按照中国民间的传统习俗，春节期间长辈通常会给孩子发红包，俗称发压岁钱(lucky", "ch": 7, "full": "按照中国民间的传统习俗，春节期间长辈通常会给孩子发红包，俗称发压岁钱(luckymoney),以表达对孩子的祝福，祝他们好运。", "en": "According to traditional Chinese folk customs, during the Spring Festival elders usually give children red envelopes, commonly known as \"lucky money\", to express their blessings and wish them good luck.", "cls": "A", "pid": "u2_s3_p7", "sid": "u2_s3", "sec": "春节的活动", "cov": 0.27, "hits": ["红包", "压岁钱"], "deg": 2}, {"id": "s:7:CET4 2022·09·S2#2", "type": "sentence", "label": "如今，红包不仅是给孩子的礼物，而且经常也是给长辈或亲朋好友的礼物。", "ch": 7, "full": "如今，红包不仅是给孩子的礼物，而且经常也是给长辈或亲朋好友的礼物。", "en": "Today, red envelopes are not only gifts for children but also gifts for elders or relatives and friends.", "cls": "B", "pid": "u2_s3_p7", "sid": "u2_s3", "sec": "春节的活动", "cov": 0.135, "hits": ["红包"], "deg": 2}, {"id": "s:7:CET4 2022·09·S2#3", "type": "sentence", "label": "近年来，随着微信用户数量的增加，微信红包变得愈加流行。", "ch": 7, "full": "近年来，随着微信用户数量的增加，微信红包变得愈加流行。", "en": "In recent years, with the increase in the number of WeChat users, WeChat red envelopes have become increasingly popular.", "cls": "B", "pid": "u2_s3_p8", "sid": "u2_s3", "sec": "春节的活动", "cov": 0.111, "hits": ["红包"], "deg": 2}, {"id": "s:7:CET4 2022·09·S2#4", "type": "sentence", "label": "欢度春节时，人们经常互发微信红包表达问候。", "ch": 7, "full": "欢度春节时，人们经常互发微信红包表达问候。", "en": "When celebrating the Spring Festival, people often send each other WeChat red envelopes to express greetings.", "cls": "B", "pid": "u2_s3_p6", "sid": "u2_s3", "sec": "春节的活动", "cov": 0.187, "hits": ["春节", "欢度春节"], "deg": 2}, {"id": "s:7:CET4 2022·09·S2#5", "type": "sentence", "label": "这无疑是一种与远方亲友联系的便捷方式。", "ch": 7, "full": "这无疑是一种与远方亲友联系的便捷方式。", "en": "This is undoubtedly a convenient way to keep in touch with relatives and friends far away.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2022·12·S1#1", "type": "sentence", "label": "在中国农历中，立秋(Start of Autumn)意味着夏天的结束和秋天的开始", "ch": 7, "full": "在中国农历中，立秋(Start of Autumn)意味着夏天的结束和秋天的开始。", "en": "In the Chinese lunar calendar, Start of Autumn means the end of summer and the beginning of autumn.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2022·12·S1#2", "type": "sentence", "label": "立秋带来的首先是天气的变化，气温逐渐下降。", "ch": 7, "full": "立秋带来的首先是天气的变化，气温逐渐下降。", "en": "What Start of Autumn brings first is a change in the weather, as temperatures gradually drop.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2022·12·S1#3", "type": "sentence", "label": "人们看到树叶开始变黄飘落时，知道秋天已经来临，这就是所谓的“一叶知秋”。", "ch": 7, "full": "人们看到树叶开始变黄飘落时，知道秋天已经来临，这就是所谓的“一叶知秋”。", "en": "When people see the leaves begin to turn yellow and fall, they know autumn has arrived; this is the so-called \"one falling leaf heralds the coming of autumn\".", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2022·12·S1#4", "type": "sentence", "label": "但此时酷热的天气并未完全结束，高温通常还会持续一段时间，被称为“秋老虎”。", "ch": 7, "full": "但此时酷热的天气并未完全结束，高温通常还会持续一段时间，被称为“秋老虎”。", "en": "But the hot weather is not yet completely over; the high temperatures usually last for some time and are known as the \"Autumn Tiger\".", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2022·12·S1#5", "type": "sentence", "label": "立秋对农民意义重大，这时各种秋季作物迅速生长、开始成熟，收获的季节即将到来。", "ch": 7, "full": "立秋对农民意义重大，这时各种秋季作物迅速生长、开始成熟，收获的季节即将到来。", "en": "Start of Autumn is of great significance to farmers; at this time, various autumn crops grow rapidly and begin to ripen, and the harvest season is approaching.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2022·12·S3#1", "type": "sentence", "label": "冬至(Winter Solstice)是全年白昼最短、黑夜最长的一天，标志着一年", "ch": 7, "full": "冬至(Winter Solstice)是全年白昼最短、黑夜最长的一天，标志着一年中最寒冷时节的开始。", "en": "Winter Solstice is the shortest day and the longest night of the year, marking the beginning of the coldest season of the year.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2022·12·S3#2", "type": "sentence", "label": "冬至过后，气温越来越低，人们的户外活动逐渐减少。", "ch": 7, "full": "冬至过后，气温越来越低，人们的户外活动逐渐减少。", "en": "After Winter Solstice, temperatures drop lower and lower, and people's outdoor activities gradually decrease.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2022·12·S3#3", "type": "sentence", "label": "农民地里活儿不多，主要忙于灌溉系统的维护和农作物的防冻，同时为来年春天播种做准备", "ch": 7, "full": "农民地里活儿不多，主要忙于灌溉系统的维护和农作物的防冻，同时为来年春天播种做准备。", "en": "Farmers have little work in the fields; they are mainly busy with the maintenance of irrigation systems and the frost protection of crops, and are also preparing for spring sowing the following year.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2022·12·S3#4", "type": "sentence", "label": "中国人历来很重视冬至，许多地方都把冬至当作一个节日，庆祝方式各地不尽相同。", "ch": 7, "full": "中国人历来很重视冬至，许多地方都把冬至当作一个节日，庆祝方式各地不尽相同。", "en": "Chinese people have always attached great importance to Winter Solstice; in many places it is treated as a festival, and the ways of celebration vary from place to place.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2022·12·S3#5", "type": "sentence", "label": "北方人有冬至吃饺子(jiaozi)的习俗，南方人有冬至吃汤圆(tangyuan)", "ch": 7, "full": "北方人有冬至吃饺子(jiaozi)的习俗，南方人有冬至吃汤圆(tangyuan)的传统。", "en": "People in the north have the custom of eating jiaozi on Winter Solstice, while people in the south have the tradition of eating tangyuan.", "cls": "B", "pid": "u2_s3_p5", "sid": "u2_s3", "sec": "春节的活动", "cov": 0.333, "hits": [], "deg": 2}, {"id": "s:7:CET4 2024·06·S2#1", "type": "sentence", "label": "农历 (the lunar calendar) 起源于数千年前的中国，根据太阳和", "ch": 7, "full": "农历 (the lunar calendar) 起源于数千年前的中国，根据太阳和月亮的运行规律制定。", "en": "The lunar calendar originated in China thousands of years ago and was formulated according to the movements of the sun and the moon.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2024·06·S2#2", "type": "sentence", "label": "长期以来，农历在农业生产和人们日常生活中发挥着重要作用。", "ch": 7, "full": "长期以来，农历在农业生产和人们日常生活中发挥着重要作用。", "en": "For a long time, the lunar calendar has played an important role in agricultural production and people's daily life.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2024·06·S2#3", "type": "sentence", "label": "古人依据农历记录日期、安排农活，以便最有效地利用自然资源和气候条件，提高农作物的", "ch": 7, "full": "古人依据农历记录日期、安排农活，以便最有效地利用自然资源和气候条件，提高农作物的产量和质量。", "en": "The ancients recorded dates and arranged farm work according to the lunar calendar so as to make the most effective use of natural resources and climatic conditions and improve the yield and quality of crops.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2024·06·S2#4", "type": "sentence", "label": "中国的春节、中秋节等传统节日的日期都基于农历。", "ch": 7, "full": "中国的春节、中秋节等传统节日的日期都基于农历。", "en": "The dates of traditional Chinese festivals such as the Spring Festival and the Mid-Autumn Festival are all based on the lunar calendar.", "cls": "A", "pid": "u2_s1_p1", "sid": "u2_s1", "sec": "春节", "cov": 0.32, "hits": ["春节", "传统节日"], "deg": 2}, {"id": "s:7:CET4 2024·06·S2#5", "type": "sentence", "label": "农历是中国传统文化的重要组成部分，当今依然广为使用。", "ch": 7, "full": "农历是中国传统文化的重要组成部分，当今依然广为使用。", "en": "The lunar calendar is an important part of traditional Chinese culture and is still widely used today.", "cls": "B", "pid": "u2_s1_p1", "sid": "u2_s1", "sec": "春节", "cov": 0.237, "hits": [], "deg": 2}, {"id": "s:7:CET4 2024·06·S3#1", "type": "sentence", "label": "汉语中的“福”字 (the character fu) 表示幸福和好运，是中国传", "ch": 7, "full": "汉语中的“福”字 (the character fu) 表示幸福和好运，是中国传统文化中最常用的吉祥 (auspicious)符号之一。", "en": "The Chinese character \"fu\" in Chinese means happiness and good luck, and is one of the most commonly used auspicious symbols in traditional Chinese culture.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2024·06·S3#2", "type": "sentence", "label": "人们通常将一个大大的福字写在红纸上，寓意期盼家庭幸福、社会安定、国家昌盛。", "ch": 7, "full": "人们通常将一个大大的福字写在红纸上，寓意期盼家庭幸福、社会安定、国家昌盛。", "en": "People usually write a big \"fu\" character on red paper, symbolizing the hope for family happiness, social stability and national prosperity.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2024·06·S3#3", "type": "sentence", "label": "春节贴福字是民间由来已久的习俗。", "ch": 7, "full": "春节贴福字是民间由来已久的习俗。", "en": "Pasting the \"fu\" character during the Spring Festival is a long-standing folk custom.", "cls": "B", "pid": "u2_s3_p10", "sid": "u2_s3", "sec": "春节的活动", "cov": 0.214, "hits": ["春节"], "deg": 2}, {"id": "s:7:CET4 2024·06·S3#4", "type": "sentence", "label": "为了欢庆春节，家家户户都会将福字贴在门上或墙上，表达对幸福生活的向往、对美好未来", "ch": 7, "full": "为了欢庆春节，家家户户都会将福字贴在门上或墙上，表达对幸福生活的向往、对美好未来的期待。", "en": "To celebrate the Spring Festival, every household pastes the \"fu\" character on the door or wall, expressing their yearning for a happy life and their expectation of a bright future.", "cls": "B", "pid": "u2_s2_p5", "sid": "u2_s2", "sec": "春节的传说", "cov": 0.154, "hits": ["家家户户"], "deg": 2}, {"id": "s:7:CET4 2024·06·S3#5", "type": "sentence", "label": "人们有时还将福字倒过来贴，表示幸福已到、好运已到。", "ch": 7, "full": "人们有时还将福字倒过来贴，表示幸福已到、好运已到。", "en": "People sometimes paste the \"fu\" character upside down, indicating that good fortune and good luck have arrived.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET6 2022·09·S1#1", "type": "sentence", "label": "贴春联(Spring Festival couplets)是中国人欢度春节的一个", "ch": 7, "full": "贴春联(Spring Festival couplets)是中国人欢度春节的一个重要习俗。", "en": "Pasting Spring Festival couplets is an important custom for Chinese people to celebrate the Spring Festival.", "cls": "A", "pid": "u2_s3_p6", "sid": "u2_s3", "sec": "春节的活动", "cov": 0.412, "hits": ["春节", "欢度春节"], "deg": 2}, {"id": "s:7:CET6 2022·09·S1#2", "type": "sentence", "label": "春联由一对诗句和四字横批(horizontal scroll)组成，诗句和横批用", "ch": 7, "full": "春联由一对诗句和四字横批(horizontal scroll)组成，诗句和横批用金色或黑色写在红纸上，红色代表幸运，金色代表财富。", "en": "Spring Festival couplets are composed of a pair of poetic lines and a four-character horizontal scroll, which are written on red paper in gold or black; red represents good luck and gold represents wealth.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET6 2022·09·S1#3", "type": "sentence", "label": "春联贴在大门左右两侧和门框上方。", "ch": 7, "full": "春联贴在大门左右两侧和门框上方。", "en": "Spring Festival couplets are pasted on both sides of the front gate and above the door frame.", "cls": "B", "pid": "u2_s3_p4", "sid": "u2_s3", "sec": "春节的活动", "cov": 0.214, "hits": [], "deg": 2}, {"id": "s:7:CET6 2022·09·S1#4", "type": "sentence", "label": "春联的诗句体现中国传统诗词的特点，两句诗的字数相同、内容相关。", "ch": 7, "full": "春联的诗句体现中国传统诗词的特点，两句诗的字数相同、内容相关。", "en": "The poetic lines of Spring Festival couplets reflect the characteristics of traditional Chinese poetry: the two lines have the same number of characters and are related in content.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET6 2022·09·S1#5", "type": "sentence", "label": "横批凸显春联的主题，更是锦上添花。", "ch": 7, "full": "横批凸显春联的主题，更是锦上添花。", "en": "The horizontal scroll highlights the theme of the couplets and even adds a finishing touch.", "cls": "B", "pid": "u2_s2_p5", "sid": "u2_s2", "sec": "春节的传说", "cov": 0.091, "hits": ["春联"], "deg": 2}, {"id": "s:7:CET6 2022·09·S1#6", "type": "sentence", "label": "春联以简洁的文字描绘生动的形象，抒发美好的愿望。", "ch": 7, "full": "春联以简洁的文字描绘生动的形象，抒发美好的愿望。", "en": "Spring Festival couplets use concise words to depict vivid images and express beautiful wishes.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET6 2022·09·S1#7", "type": "sentence", "label": "当家家户户贴春联时，人们就会意识到春节已经正式拉开序幕。", "ch": 7, "full": "当家家户户贴春联时，人们就会意识到春节已经正式拉开序幕。", "en": "When every household pastes Spring Festival couplets, people realize that the Spring Festival has officially begun.", "cls": "A", "pid": "u2_s2_p5", "sid": "u2_s2", "sec": "春节的传说", "cov": 0.26, "hits": ["春联", "家家户户"], "deg": 2}, {"id": "s:7:CET4 2019·06·S2#1", "type": "sentence", "label": "灯笼起源于东汉，最初主要用于照明。", "ch": 7, "full": "灯笼起源于东汉，最初主要用于照明。", "en": "Lanterns originated in the Eastern Han Dynasty and were initially used mainly for illumination.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2019·06·S2#2", "type": "sentence", "label": "在唐代，人们用红灯笼来庆祝安定的生活。", "ch": 7, "full": "在唐代，人们用红灯笼来庆祝安定的生活。", "en": "In the Tang Dynasty, people used red lanterns to celebrate a stable life.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2019·06·S2#3", "type": "sentence", "label": "从那时起，灯笼在中国的许多地方流行起来。", "ch": 7, "full": "从那时起，灯笼在中国的许多地方流行起来。", "en": "From then on, lanterns became popular in many parts of China.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2019·06·S2#4", "type": "sentence", "label": "灯笼通常用色彩鲜艳的薄纸，形状和尺寸各异。", "ch": 7, "full": "灯笼通常用色彩鲜艳的薄纸，形状和尺寸各异。", "en": "Lanterns are usually made of thin, brightly colored paper and come in various shapes and sizes.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2019·06·S2#5", "type": "sentence", "label": "在中国传统文化中，红灯笼象征生活美满和生意兴隆，通常在春节、元宵节和国庆等节日期", "ch": 7, "full": "在中国传统文化中，红灯笼象征生活美满和生意兴隆，通常在春节、元宵节和国庆等节日期间悬挂。", "en": "In traditional Chinese culture, red lanterns symbolize a happy life and a thriving business, and are usually hung during festivals such as the Spring Festival, the Lantern Festival and National Day.", "cls": "B", "pid": "u2_s9_p5", "sid": "u2_s9", "sec": "屈原与端午节", "cov": 0.154, "hits": ["节日期间"], "deg": 2}, {"id": "s:7:CET4 2019·06·S2#6", "type": "sentence", "label": "如今，世界上许多其他地方也能看到红灯笼。", "ch": 7, "full": "如今，世界上许多其他地方也能看到红灯笼。", "en": "Today, red lanterns can also be seen in many other parts of the world.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2016·12·S1#1", "type": "sentence", "label": "在中国文化中，红色通常象征着好运、长寿和幸福。", "ch": 7, "full": "在中国文化中，红色通常象征着好运、长寿和幸福。", "en": "In Chinese culture, red usually symbolizes good luck, longevity and happiness.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2016·12·S1#2", "type": "sentence", "label": "在春节和其他喜庆场合，红色到处可见。", "ch": 7, "full": "在春节和其他喜庆场合，红色到处可见。", "en": "During the Spring Festival and other festive occasions, red can be seen everywhere.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2016·12·S1#3", "type": "sentence", "label": "人们把现金作为礼物送给家人或亲密朋友时，通常放在红信封里。", "ch": 7, "full": "人们把现金作为礼物送给家人或亲密朋友时，通常放在红信封里。", "en": "When people give cash as a gift to family members or close friends, it is usually put in a red envelope.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2016·12·S1#4", "type": "sentence", "label": "红色在中国流行的另一个原因是人们把它与中国革命和共产党相联系。", "ch": 7, "full": "红色在中国流行的另一个原因是人们把它与中国革命和共产党相联系。", "en": "Another reason why red is popular in China is that people associate it with the Chinese revolution and the Communist Party.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2016·12·S1#5", "type": "sentence", "label": "然而，红色并不总是代表好运和快乐。", "ch": 7, "full": "然而，红色并不总是代表好运和快乐。", "en": "However, red does not always represent good luck and happiness.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:7:CET4 2016·12·S1#6", "type": "sentence", "label": "因为从前死者的名字常用红色书写，用红墨水书写中国人名被看成是一种冒犯行为。", "ch": 7, "full": "因为从前死者的名字常用红色书写，用红墨水书写中国人名被看成是一种冒犯行为。", "en": "Because the names of the dead used to be written in red, writing a Chinese name in red ink is regarded as an offense.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2013·12·S1#1", "type": "sentence", "label": "许多人喜欢中餐。", "ch": 8, "full": "许多人喜欢中餐。", "en": "Many people like Chinese food.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2013·12·S1#2", "type": "sentence", "label": "在中国，烹饪不仅被视为一种技能，而且也被视为一种艺术。", "ch": 8, "full": "在中国，烹饪不仅被视为一种技能，而且也被视为一种艺术。", "en": "In China, cooking is regarded not only as a skill but also as an art.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2013·12·S1#3", "type": "sentence", "label": "精心准备的中餐既可口又好看。", "ch": 8, "full": "精心准备的中餐既可口又好看。", "en": "A well-prepared Chinese meal is both delicious and good-looking.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2013·12·S1#4", "type": "sentence", "label": "烹饪技艺和配料在中国各地差别很大。", "ch": 8, "full": "烹饪技艺和配料在中国各地差别很大。", "en": "Cooking techniques and ingredients vary greatly from region to region across China.", "cls": "B", "pid": "u2_s2_p1", "sid": "u2_s2", "sec": "烹饪方法", "cov": 0.267, "hits": [], "deg": 2}, {"id": "s:8:CET4 2013·12·S1#5", "type": "sentence", "label": "但好的烹饪都有一个共同点，总是要考虑到颜色、味道、口感和营养(nutrition", "ch": 8, "full": "但好的烹饪都有一个共同点，总是要考虑到颜色、味道、口感和营养(nutrition)。", "en": "But all good cooking shares one thing in common: it always takes color, taste, texture and nutrition into account.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2013·12·S1#6", "type": "sentence", "label": "由于食物对健康至关重要，好的厨师总是努力在谷物、肉类和蔬菜之间取得平衡，所以中餐", "ch": 8, "full": "由于食物对健康至关重要，好的厨师总是努力在谷物、肉类和蔬菜之间取得平衡，所以中餐既味美又健康。", "en": "Since food is vital to health, good chefs always strive to strike a balance among grains, meat and vegetables, so Chinese food is both delicious and healthy.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2013·12·S3#1", "type": "sentence", "label": "“你要茶还是要咖啡？”是用餐人常被问到的问题。", "ch": 8, "full": "“你要茶还是要咖啡？”是用餐人常被问到的问题。", "en": "\"Would you like tea or coffee?\" is a question often asked of diners.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2013·12·S3#2", "type": "sentence", "label": "许多西方人会选咖啡，而中国人则会选茶。", "ch": 8, "full": "许多西方人会选咖啡，而中国人则会选茶。", "en": "Many Westerners choose coffee, while Chinese people choose tea.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2013·12·S3#3", "type": "sentence", "label": "相传，中国的一位帝王于五千多年前发现了茶，并用来治病。", "ch": 8, "full": "相传，中国的一位帝王于五千多年前发现了茶，并用来治病。", "en": "It is said that an ancient Chinese emperor discovered tea more than five thousand years ago and used it to treat illnesses.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2013·12·S3#4", "type": "sentence", "label": "在明清（the Ming and Qing Dynasties）期间，茶馆遍布全", "ch": 8, "full": "在明清（the Ming and Qing Dynasties）期间，茶馆遍布全国。", "en": "During the Ming and Qing Dynasties, teahouses could be found all over the country.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2013·12·S3#5", "type": "sentence", "label": "饮茶在六世纪传到日本，但直到十七、十八世纪才传到欧美。", "ch": 8, "full": "饮茶在六世纪传到日本，但直到十七、十八世纪才传到欧美。", "en": "Tea drinking spread to Japan in the sixth century, but it did not reach Europe and America until the 17th and 18th centuries.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2013·12·S3#6", "type": "sentence", "label": "如今，茶是世界上最流行的饮料（beverage）之一。", "ch": 8, "full": "如今，茶是世界上最流行的饮料（beverage）之一。", "en": "Today, tea is one of the most popular beverages in the world.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2013·12·S3#7", "type": "sentence", "label": "茶是中国的民族饮品，也是中国传统和文化的重要组成部分。", "ch": 8, "full": "茶是中国的民族饮品，也是中国传统和文化的重要组成部分。", "en": "Tea is China's national beverage and an important part of Chinese tradition and culture.", "cls": "B", "pid": "u6_s0_p1", "sid": "u6_s0", "sec": "中国酒", "cov": 0.273, "hits": [], "deg": 2}, {"id": "s:8:CET4 2015·06·S3#1", "type": "sentence", "label": "在西方人心目中，和中国联系最为密切的基本食物是大米。", "ch": 8, "full": "在西方人心目中，和中国联系最为密切的基本食物是大米。", "en": "In the eyes of Westerners, rice is the basic food most closely associated with China.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2015·06·S3#2", "type": "sentence", "label": "长期以来，大米在中国人的饮食中占据很重要的地位，以至于有谚语说“巧妇难为无米之炊", "ch": 8, "full": "长期以来，大米在中国人的饮食中占据很重要的地位，以至于有谚语说“巧妇难为无米之炊”。", "en": "For a long time, rice has occupied such an important place in the Chinese diet that there is a saying, \"Even the cleverest housewife cannot cook a meal without rice.\"", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2015·06·S3#3", "type": "sentence", "label": "中国南方大多种植水稻，人们通常以大米为主食；而华北大部分地区因为过于寒冷或过于干", "ch": 8, "full": "中国南方大多种植水稻，人们通常以大米为主食；而华北大部分地区因为过于寒冷或过于干燥,无法种植水稻，那里的主要作物是小麦。", "en": "Rice is widely grown in southern China, where people usually take rice as their staple food; in most parts of North China, however, rice cannot be grown because it is too cold or too dry, so the main crop there is wheat.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2015·06·S3#4", "type": "sentence", "label": "在中国，有些人用面粉做面包,但大多数人用面粉做馒头和面", "ch": 8, "full": "在中国，有些人用面粉做面包,但大多数人用面粉做馒头和面", "en": "In China, some people make bread from flour, but most people use flour to make steamed buns and noodles.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2020·07·S1#1", "type": "sentence", "label": "在中国，火锅已有2，000多年的历史，最早流行于最寒冷的地区，然后在很多地区盛行", "ch": 8, "full": "在中国，火锅已有2，000多年的历史，最早流行于最寒冷的地区，然后在很多地区盛行，出现了具有地方特色的种类。", "en": "In China, hot pot has a history of more than 2,000 years. It first became popular in the coldest regions and then spread widely across many areas, giving rise to varieties with local characteristics.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2020·07·S1#2", "type": "sentence", "label": "吃火锅时，家人和朋友围坐在桌边，桌子中间放着热腾腾的火锅。", "ch": 8, "full": "吃火锅时，家人和朋友围坐在桌边，桌子中间放着热腾腾的火锅。", "en": "When eating hot pot, family members and friends sit around a table with a steaming hot pot in the middle.", "cls": "B", "pid": "u3_s2_p3", "sid": "u3_s2", "sec": "川菜", "cov": 0.062, "hits": ["火锅"], "deg": 2}, {"id": "s:8:CET4 2020·07·S1#3", "type": "sentence", "label": "吃火锅时，人们可以根据自己的口味放肉、海鲜、蔬菜和其他配料，自己烹饪。", "ch": 8, "full": "吃火锅时，人们可以根据自己的口味放肉、海鲜、蔬菜和其他配料，自己烹饪。", "en": "When eating hot pot, people can add meat, seafood, vegetables and other ingredients according to their own taste, and cook the food themselves.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2020·07·S1#4", "type": "sentence", "label": "人们可以一边尽情地聊天，一边享受美餐。", "ch": 8, "full": "人们可以一边尽情地聊天，一边享受美餐。", "en": "People can chat to their heart's content while enjoying a delicious meal.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2020·09·S1#1", "type": "sentence", "label": "茅台（Moutai)是中国最有名的白酒，在新中国成立前夕，被选为国宴用酒。", "ch": 8, "full": "茅台（Moutai)是中国最有名的白酒，在新中国成立前夕，被选为国宴用酒。", "en": "Moutai is China's most famous baijiu and, on the eve of the founding of New China, was chosen as the liquor for state banquets.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2020·09·S1#2", "type": "sentence", "label": "据说赤水沿岸的村民四千年前就开始酿造茅台。", "ch": 8, "full": "据说赤水沿岸的村民四千年前就开始酿造茅台。", "en": "It is said that villagers along the Chishui River began to brew Moutai four thousand years ago.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2020·09·S1#3", "type": "sentence", "label": "在西汉时期，那里的人们生产出了高质量的茅台，并把它贡给皇帝。", "ch": 8, "full": "在西汉时期，那里的人们生产出了高质量的茅台，并把它贡给皇帝。", "en": "During the Western Han Dynasty, the people there produced high-quality Moutai and presented it to the emperor as tribute.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2020·09·S1#4", "type": "sentence", "label": "自唐朝开始，这种地方酒通过海上丝绸之路运往海外。", "ch": 8, "full": "自唐朝开始，这种地方酒通过海上丝绸之路运往海外。", "en": "Starting in the Tang Dynasty, this local liquor was shipped overseas along the Maritime Silk Road.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2020·09·S1#5", "type": "sentence", "label": "茅台味道柔和，有一种特殊的香味；适量饮用可以帮助缓解疲劳，有镇静作用，因而广受国", "ch": 8, "full": "茅台味道柔和，有一种特殊的香味；适量饮用可以帮助缓解疲劳，有镇静作用，因而广受国内夕消费者的喜爱。", "en": "Moutai has a mild taste and a distinctive aroma; when drunk in moderation, it can help relieve fatigue and has a calming effect, so it is widely loved by domestic consumers.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2020·09·S2#1", "type": "sentence", "label": "茶拥有5,000年的历史。", "ch": 8, "full": "茶拥有5,000年的历史。", "en": "Tea has a history of 5,000 years.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2020·09·S2#2", "type": "sentence", "label": "传说，神农氏(Shen Nong)喝开水时，几片野树叶子落进壶里，开水顿时散发出", "ch": 8, "full": "传说，神农氏(Shen Nong)喝开水时，几片野树叶子落进壶里，开水顿时散发出宜人的香味。", "en": "Legend has it that when Shen Nong was drinking boiled water, a few wild leaves fell into the pot, and the water immediately gave off a pleasant fragrance.", "cls": "C", "pid": "", "sid": "", "sec": "", ll": "龙井茶独特的香味和口感为其赢得了“中国名茶”的称号，在中国深受大众的欢迎，在海外饮用的人也越来越多。", "en": "The unique aroma and taste of Longjing tea have earned it the title of \"a famous Chinese tea\". It is deeply loved by the Chinese public, and is being drunk by more and more people overseas.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2021·06·S3#3", "type": "sentence", "label": "龙井茶通常手工制作，其价格可能极其昂贵，也可能比较便宜，这取决于茶的生长地、采摘", "ch": 8, "full": "龙井茶通常手工制作，其价格可能极其昂贵，也可能比较便宜，这取决于茶的生长地、采摘时间和制作工艺。", "en": "Longjing tea is usually handmade. Its price may be extremely high or fairly low, depending on where the tea is grown, when it is picked and how it is processed.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2021·06·S3#4", "type": "sentence", "label": "龙井茶富含维生素C和其他多种有益健康的元素。", "ch": 8, "full": "龙井茶富含维生素C和其他多种有益健康的元素。", "en": "Longjing tea is rich in vitamin C and many other elements beneficial to health.", "cls": "B", "pid": "u5_s7_p2", "sid": "u5_s7", "sec": "黑茶", "cov": 0.211, "hits": ["维生素"], "deg": 2}, {"id": "s:8:CET4 2021·06·S3#5", "type": "sentence", "label": "经常喝龙井茶有助于减轻疲劳、延缓衰老。", "ch": 8, "full": "经常喝龙井茶有助于减轻疲劳、延缓衰老。", "en": "Drinking Longjing tea regularly helps reduce fatigue and delay aging.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET6 2015·06·S1#1", "type": "sentence", "label": "中国传统的待客之道要求饭菜丰富多样，让客人吃不完。", "ch": 8, "full": "中国传统的待客之道要求饭菜丰富多样，让客人吃不完。", "en": "The traditional Chinese way of entertaining guests requires a rich and varied spread of dishes, with more food than the guests can finish.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET6 2015·06·S1#2", "type": "sentence", "label": "中国宴席上典型的菜单包括开席的一套凉菜及其后的热菜，例如肉类、鸡鸭、蔬菜等。", "ch": 8, "full": "中国宴席上典型的菜单包括开席的一套凉菜及其后的热菜，例如肉类、鸡鸭、蔬菜等。", "en": "A typical menu at a Chinese banquet includes a set of cold dishes to start with, followed by hot dishes such as meat, chicken and duck, and vegetables.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET6 2015·06·S1#3", "type": "sentence", "label": "大多数宴席上，全鱼被认为是必不可少的，除非已经上过各式海鮮。", "ch": 8, "full": "大多数宴席上，全鱼被认为是必不可少的，除非已经上过各式海鮮。", "en": "At most banquets, a whole fish is considered essential unless various kinds of seafood have already been served.", "cls": "B", "pid": "u5_s8_p6", "sid": "u5_s8", "sec": "茶文化", "cov": 0.192, "hits": ["必不可少"], "deg": 2}, {"id": "s:8:CET6 2015·06·S1#4", "type": "sentence", "label": "如今，中国人喜欢把西方特色菜与传统中式菜肴融于一席，因此牛排上桌也不少见。", "ch": 8, "full": "如今，中国人喜欢把西方特色菜与传统中式菜肴融于一席，因此牛排上桌也不少见。", "en": "Today, Chinese people like to combine Western specialties with traditional Chinese dishes at one table, so it is not uncommon for steak to be served.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET6 2015·06·S1#5", "type": "sentence", "label": "沙拉也已流行起来，尽管传统上中国人一般不吃任何未经烹饪的菜肴。", "ch": 8, "full": "沙拉也已流行起来，尽管传统上中国人一般不吃任何未经烹饪的菜肴。", "en": "Salad has also become popular, although traditionally Chinese people generally do not eat any uncooked dishes.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET6 2015·06·S1#6", "type": "sentence", "label": "宴席通常至少有一道汤，可以最先或最后上桌。", "ch": 8, "full": "宴席通常至少有一道汤，可以最先或最后上桌。", "en": "A banquet usually has at least one soup, which can be served first or last.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET6 2015·06·S1#7", "type": "sentence", "label": "甜点和水果通常标志宴席的结束。", "ch": 8, "full": "甜点和水果通常标志宴席的结束。", "en": "Desserts and fruit usually mark the end of a banquet.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2023·12·S1#1", "type": "sentence", "label": "中国政府十分重视人民的健康饮食 (diet)。", "ch": 8, "full": "中国政府十分重视人民的健康饮食 (diet)。", "en": "The Chinese government attaches great importance to people's healthy diet.", "cls": "B", "pid": "u2_s5_p1", "sid": "u2_s5", "sec": "食疗", "cov": 0.286, "hits": [], "deg": 2}, {"id": "s:8:CET4 2023·12·S1#2", "type": "sentence", "label": "通过大力提倡健康饮食，人们对合理营养增进健康的重要性有了更加深刻的认识。", "ch": 8, "full": "通过大力提倡健康饮食，人们对合理营养增进健康的重要性有了更加深刻的认识。", "en": "By vigorously promoting a healthy diet, people have gained a deeper understanding of the importance of balanced nutrition to health.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2023·12·S1#3", "type": "sentence", "label": "“吃得安全、吃得营养、吃得健康”是人民对美好生活的基本需要，是提升人民幸福感的必", "ch": 8, "full": "“吃得安全、吃得营养、吃得健康”是人民对美好生活的基本需要，是提升人民幸福感的必然要求，也为食品产业的发展提供了新机遇。", "en": "\"Eating safely, eating nutritionally and eating healthily\" is a basic need of the people for a better life, an inevitable requirement for enhancing their sense of happiness, and a new opportunity for the development of the food industry.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2023·12·S1#4", "type": "sentence", "label": "目前，各级政府都在采取多种举措确保人民饮食健康，推进健康中国的建设。", "ch": 8, "full": "目前，各级政府都在采取多种举措确保人民饮食健康，推进健康中国的建设。", "en": "At present, governments at all levels are taking various measures to ensure people's healthy diet and advance the building of a Healthy China.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2023·12·S3#1", "type": "sentence", "label": "改革开放以来，中国人的饮食 (diet) 发生了显著变化。", "ch": 8, "full": "改革开放以来，中国人的饮食 (diet) 发生了显著变化。", "en": "Since the reform and opening up, significant changes have taken place in the Chinese diet.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2023·12·S3#2", "type": "sentence", "label": "过去由于经济落后，食品种类有限、数量不足，人们仅仅满足于吃得饱。", "ch": 8, "full": "过去由于经济落后，食品种类有限、数量不足，人们仅仅满足于吃得饱。", "en": "In the past, because the economy was backward, food was limited in variety and insufficient in quantity, and people were merely content with having enough to eat.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2023·12·S3#3", "type": "sentence", "label": "如今中国经济快速发展，食品不仅更加丰富多样，质量也大幅提高。", "ch": 8, "full": "如今中国经济快速发展，食品不仅更加丰富多样，质量也大幅提高。", "en": "Today, with China's rapid economic development, food is not only more varied but also much better in quality.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2023·12·S3#4", "type": "sentence", "label": "随着生活水平不断提升，人们对饮食的要求起来越高，更加注重吃得营养健康。", "ch": 8, "full": "随着生活水平不断提升，人们对饮食的要求起来越高，更加注重吃得营养健康。", "en": "As living standards keep rising, people have ever higher demands for their diet and pay more attention to eating nutritionally and healthily.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:8:CET4 2023·12·S3#5", "type": "sentence", "label": "因此，目前市场上推出的低脂、低糖、有机食品受到人们的普遍欢迎。", "ch": 8, "full": "因此，目前市场上推出的低脂、低糖、有机食品受到人们的普遍欢迎。", "en": "Therefore, the low-fat, low-sugar and organic foods now available on the market are widely welcomed by people.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:9:CET6 2016·06·S2#1", "type": "sentence", "label": "旗袍（qipao）是一种雅致的中国服装，源于中国的满族（Manchu Natio", "ch": 9, "full": "旗袍（qipao）是一种雅致的中国服装，源于中国的满族（Manchu Nationality） 。", "en": "The qipao is an elegant type of Chinese dress that originated from the Manchu Nationality in China.", "cls": "A", "pid": "u4_s2_p2", "sid": "u4_s2", "sec": "旗袍", "cov": 0.432, "hits": ["满族"], "deg": 2}, {"id": "s:9:CET6 2016·06·S2#2", "type": "sentence", "label": "在清代，旗袍是王室女性穿着的宽松长袍。", "ch": 9, "full": "在清代，旗袍是王室女性穿着的宽松长袍。", "en": "During the Qing Dynasty, the qipao was a loose long gown worn by royal women.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:9:CET6 2016·06·S2#3", "type": "sentence", "label": "上世纪 20 年代，受西方服饰影响，旗袍发生了一些变化。", "ch": 9, "full": "上世纪 20 年代，受西方服饰影响，旗袍发生了一些变化。", "en": "In the 1920s, under the influence of Western clothing, the qipao underwent some changes.", "cls": "B", "pid": "u2_s2_p20", "sid": "u2_s2", "sec": "不同时期的服饰", "cov": 0.45, "hits": [], "deg": 2}, {"id": "s:9:CET6 2016·06·S2#4", "type": "sentence", "label": "袖口（cuffs）变窄，袍身变短。", "ch": 9, "full": "袖口（cuffs）变窄，袍身变短。", "en": "The cuffs became narrower and the body of the gown became shorter.", "cls": "B", "pid": "u2_s2_p4", "sid": "u2_s2", "sec": "不同时期的服饰", "cov": 0.143, "hits": ["袖口"], "deg": 2}, {"id": "s:9:CET6 2016·06·S2#5", "type": "sentence", "label": "这些变化使女性美得以充分展现。", "ch": 9, "full": "这些变化使女性美得以充分展现。", "en": "These changes gave full expression to the beauty of women.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:9:CET6 2016·06·S2#6", "type": "sentence", "label": "如今，旗袍经常出现在世界级的时装秀上。", "ch": 9, "full": "如今，旗袍经常出现在世界级的时装秀上。", "en": "Today, the qipao often appears at world-class fashion shows.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:9:CET6 2016·06·S2#7", "type": "sentence", "label": "中国女性出席重要社交聚会时，旗袍往往是她们的首选。", "ch": 9, "full": "中国女性出席重要社交聚会时，旗袍往往是她们的首选。", "en": "When Chinese women attend important social gatherings, the qipao is often their first choice.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:9:CET6 2016·06·S2#8", "type": "sentence", "label": "很多中国新娘也会选择旗袍作为结婚礼服。", "ch": 9, "full": "很多中国新娘也会选择旗袍作为结婚礼服。", "en": "Many Chinese brides also choose the qipao as their wedding dress.", "cls": "B", "pid": "u4_s2_p5", "sid": "u4_s2", "sec": "旗袍", "cov": 0.255, "hits": [], "deg": 2}, {"id": "s:9:CET6 2016·06·S2#9", "type": "sentence", "label": "一些有影响的人士甚至建议将旗袍作为中国女性的民族服饰。", "ch": 9, "full": "一些有影响的人士甚至建议将旗袍作为中国女性的民族服饰。", "en": "Some influential figures have even suggested that the qipao be regarded as the national dress of Chinese women.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET6 2013·1 ": [], "deg": 1}, {"id": "s:10:CET6 2017·12·S1#1", "type": "sentence", "label": "太湖是中国东部的一个淡水湖,占地面积 2250 平方公里,是中国第三大淡水湖,仅", "ch": 10, "full": "太湖是中国东部的一个淡水湖,占地面积 2250 平方公里,是中国第三大淡水湖,仅次于鄱阳和洞庭。", "en": "Taihu Lake is a freshwater lake in eastern China covering an area of 2,250 square kilometers, and it is the third-largest freshwater lake in China, after Poyang and Dongting.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET6 2017·12·S1#2", "type": "sentence", "label": "太湖约有 90个岛屿,大小从几平方米到几平方公里不等。", "ch": 10, "full": "太湖约有 90个岛屿,大小从几平方米到几平方公里不等。", "en": "Taihu Lake has about 90 islands, ranging in size from a few square meters to several square kilometers.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET6 2017·12·S1#3", "type": "sentence", "label": "太湖以其独特的“太湖石”而闻名,太湖石常用于装饰中国传统园林。", "ch": 10, "full": "太湖以其独特的“太湖石”而闻名,太湖石常用于装饰中国传统园林。", "en": "Taihu Lake is famous for its unique \"Taihu stones\", which are often used to decorate traditional Chinese gardens.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET6 2017·12·S1#4", "type": "sentence", "label": "太湖也以高产的捕鱼业闻名。", "ch": 10, "full": "太湖也以高产的捕鱼业闻名。", "en": "Taihu Lake is also known for its highly productive fishing industry.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET6 2017·12·S1#5", "type": "sentence", "label": "自上世纪 70 年代后期以来,捕捞鱼蟹对沿湖的居民来说极为重要,并对周边地区的经", "ch": 10, "full": "自上世纪 70 年代后期以来,捕捞鱼蟹对沿湖的居民来说极为重要,并对周边地区的经济作出了重大贡献。", "en": "Since the late 1970s, catching fish and crabs has been extremely important to the residents around the lake and has made a major contribution to the economy of the surrounding areas.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET6 2017·12·S1#6", "type": "sentence", "label": "太湖地区是中国陶瓷( ceramics)业基地之一,其中宜兴的陶瓷厂家生产举世闻", "ch": 10, "full": "太湖地区是中国陶瓷( ceramics)业基地之一,其中宜兴的陶瓷厂家生产举世闻名的宜兴紫砂壶( clay", "en": "The Taihu area is one of China's ceramics bases, where ceramic factories in Yixing produce the world-famous Yixing zisha (purple clay) teapots.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET6 2022·06·S1#1", "type": "sentence", "label": "卢沟桥位于天安门广场西南 15 公里处，横跨永定河，是北京现存最古老的多拱石桥。", "ch": 10, "full": "卢沟桥位于天安门广场西南 15 公里处，横跨永定河，是北京现存最古老的多拱石桥。", "en": "The Lugou Bridge is located 15 kilometers southwest of Tian'anmen Square, spans the Yongding River, and is the oldest existing multi-arch stone bridge in Beijing.", "cls": "A", "pid": "u2_s18_p3", "sid": "u2_s18", "sec": "石拱桥", "cov": 0.364, "hits": ["卢沟桥", "永定河"], "deg": 2}, {"id": "s:10:CET6 2022·06·S1#2", "type": "sentence", "label": "卢沟桥最初建成于 1192 年， 1698 年重建，由 2 8 1 根柱子支撑。", "ch": 10, "full": "卢沟桥最初建成于 1192 年， 1698 年重建，由 2 8 1 根柱子支撑。", "en": "The Lugou Bridge was originally completed in 1192 and rebuilt in 1698, and it is supported by 281 pillars.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET6 2022·06·S1#3", "type": "sentence", "label": "每根柱子上都有一头石狮。", "ch": 10, "full": "每根柱子上都有一头石狮。", "en": "Each pillar carries a stone lion.", "cls": "A", "pid": "u1_s0_p4", "sid": "u1_s0", "sec": "导入问题", "cov": 0.3, "hits": ["石狮"], "deg": 2}, {"id": "s:10:CET6 2022·06·S1#4", "type": "sentence", "label": "这些石狮的头、背、腹部或爪子上都藏着更多的狮子。", "ch": 10, "full": "这些石狮的头、背、腹部或爪子上都藏着更多的狮子。", "en": "More lions are hidden on the heads, backs, bellies or paws of these stone lions.", "cls": "B", "pid": "u1_s0_p4", "sid": "u1_s0", "sec": "导入问题", "cov": 0.1, "hits": ["石狮"], "deg": 2}, {"id": "s:10:CET6 2022·06·S1#5", "type": "sentence", "label": "这些石狮生动逼真、千姿百态，是卢沟桥石刻艺术的精品。", "ch": 10, "full": "这些石狮生动逼真、千姿百态，是卢沟桥石刻艺术的精品。", "en": "These stone lions are vivid, true to life and highly varied, and represent the finest examples of the stone carving art of the Lugou Bridge.", "cls": "B", "pid": "u2_s18_p3", "sid": "u2 ize the Mogao Grottoes.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET4 2024·12·S2#2", "type": "sentence", "label": "展示中心采用数字技术和多媒体展示手段，使游客进入洞窟参观之前就能了解莫高窟的历史", "ch": 10, "full": "展示中心采用数字技术和多媒体展示手段，使游客进入洞窟参观之前就能了解莫高窟的历史文化，鉴赏莫高窟的艺术经典。", "en": "The center uses digital technology and multimedia displays, enabling visitors to learn about the history and culture of the Mogao Grottoes and appreciate their artistic classics before entering the caves.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET4 2024·12·S2#3", "type": "sentence", "label": "这将减少开放洞窟的数量，缩短游客在洞窟内的逗留时间，减轻参观对莫高窟造成的影响，", "ch": 10, "full": "这将减少开放洞窟的数量，缩短游客在洞窟内的逗留时间，减轻参观对莫高窟造成的影响，以使这一世界文化遗产得到妥善保护、长久利用。", "en": "This will reduce the number of open caves, shorten the time tourists spend inside them and lessen the impact of visits on the Mogao Grottoes, so as to ensure the proper protection and long-term use of this World Cultural Heritage site.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET6 2023·06·S3#1", "type": "sentence", "label": "近年来，中国城市加快发展，城市人居环境得到显著改善。", "ch": 10, "full": "近年来，中国城市加快发展，城市人居环境得到显著改善。", "en": "In recent years, Chinese cities have developed at a faster pace, and the urban living environment has improved markedly.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET6 2023·06·S3#2", "type": "sentence", "label": "许多城市努力探索中国特色的城市高质量发展之路，城市功能不断完善，治理水平明显提高", "ch": 10, "full": "许多城市努力探索中国特色的城市高质量发展之路，城市功能不断完善，治理水平明显提高。", "en": "Many cities have worked hard to explore a path of high-quality urban development with Chinese characteristics, with urban functions continuously improved and governance significantly enhanced.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET6 2023·06·S3#3", "type": "sentence", "label": "中国持续开展城市生态修复和功能修补，全面实施城镇老旧小区改造，大力推进城市园林绿", "ch": he evaporation of water on the ground and causes very little damage to the surface, thus effectively protecting natural resources and the ecological environment.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET4 2021·12·S2#4", "type": "sentence", "label": "坎儿井体现了我国人民与自然和谐共存的智慧，是对人类文明的一大贡献。", "ch": 10, "full": "坎儿井体现了我国人民与自然和谐共存的智慧，是对人类文明的一大贡献。", "en": "The karez embodies the wisdom of our people in living in harmony with nature and is a great contribution to human civilization.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET4 2021·12·S3#1", "type": "sentence", "label": "卢(Dujiangyan) 坐落在成都平原西部的氓江上，距成都市约 50 公里，", "ch": 10, "full": "卢(Dujiangyan) 坐落在成都平原西部的氓江上，距成都市约 50 公里，始建于公元前三世纪。", "en": "Dujiangyan is located on the Minjiang River in the west of the Chengdu Plain, about 50 kilometers from Chengdu, and was first built in the 3rd century BC.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET4 2021·12·S3#2", "type": "sentence", "label": "它的独特之处在于无需用堤坝调控水流。", "ch": 10, "full": "它的独特之处在于无需用堤坝调控水流。", "en": "Its unique feature lies in the fact that it controls water flow without the need for dams.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET4 2021·12·S3#3", "type": "sentence", "label": "两千多年来，都江堰一直有效地发挥看防洪与灌溉作用，使成都平原成为旱滂保收的沃土和", "ch": 10, "full": "两千多年来，都江堰一直有效地发挥看防洪与灌溉作用，使成都平原成为旱滂保收的沃土和中国最重要的棵食产地之一。", "en": "For more than 2,000 years, Dujiangyan has effectively played a role in flood control and irrigation, turning the Chengdu Plain into a fertile land with guaranteed harvests in both dry and wet years and one of China's most important grain-producing areas.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:10:CET4 2021·12·S3#4", "type": "sentence", "label": "都江堰工程体现了我国人民与自然和谐共存的智慧，是全世界年代最久、仍在使用、无坝控", "ch": 10, "full": "都江堰工程体现了我国人民与自然和谐共存 me and abroad to start businesses.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:11:CET6 2013·12·S1#1", "type": "sentence", "label": "闻名于世的丝绸之路是一系列连接东西方的路线。", "ch": 11, "full": "闻名于世的丝绸之路是一系列连接东西方的路线。", "en": "The world-famous Silk Road was a series of routes that connected the East and the West.", "cls": "A", "pid": "u3_s5_p1", "sid": "u3_s5", "sec": "历史商业发展", "cov": 0.35, "hits": ["丝绸之路"], "deg": 2}, {"id": "s:11:CET6 2013·12·S1#2", "type": "sentence", "label": "丝绸之路延伸6,000多公里，得名于古代中国的丝绸贸易。", "ch": 11, "full": "丝绸之路延伸6,000多公里，得名于古代中国的丝绸贸易。", "en": "The Silk Road extended for more than 6,000 kilometers, so named because of the silk trade in ancient China.", "cls": "A", "pid": "u3_s5_p1", "sid": "u3_s5", "sec": "历史商业发展", "cov": 0.421, "hits": ["丝绸之路", "丝绸"], "deg": 2}, {"id": "s:11:CET6 2013·12·S1#3", "type": "sentence", "label": "丝绸之路上的贸易在中国、南亚、欧洲和中东文明发展中发挥了重要作用。", "ch": 11, "full": "丝绸之路上的贸易在中国、南亚、欧洲和中东文明发展中发挥了重要作用。", "en": "Trade along the Silk Road played an important role in the development of the civilizations of China, South Asia, Europe and the Middle East.", "cls": "A", "pid": "u3_s5_p1", "sid": "u3_s5", "sec": "历史商业发展", "cov": 0.517, "hits": ["丝绸之路"], "deg": 2}, {"id": "s:11:CET6 2013·12·S1#4", "type": "sentence", "label": "正是通过丝绸之路，中国的造纸、火药、指南针、印刷术等四大发明才被引介到世界各地。", "ch": 11, "full": "正是通过丝绸之路，中国的造纸、火药、指南针、印刷术等四大发明才被引介到世界各地。", "en": "It was through the Silk Road that China's Four Great Inventions — papermaking, gunpowder, the compass and printing — were introduced to the rest of the world.", "cls": "B", "pid": "u3_s5_p1", "sid": "u3_s5", "sec": "历史商业发展", "cov": 0.235, "hits": ["丝绸之路"], "deg": 2}, {"id": "s:11:CET6 2013·12·S1#5", "type": "sentence", "label": "同样，中国的丝绸、茶叶和瓷器(porcelain)也传遍全球。", "ch": 11, "full": "同样，中国的丝绸、茶叶和瓷器(porcelain)也传遍全球。", "en": "Similarly, China's silk, tea and porcelain spread across the globe.", "cls": "A", "pid": "u3_s5_p1", "sid": "u3_s5", "sec": "历史商业发展", "cov": 0.25, "hits": ["丝绸"], "deg": 2}, {"id": "s:11:CET6 2013·12·S1#6", "type": "sentence", "label": "物质文化的交流是双向的，欧洲也通过丝绸之路出口各种商品和植物，满足中国市场的需要", "ch": 11, "full": "物质文化的交流是双向的，欧洲也通过丝绸之路出口各种商品和植物，满足中国市场的需要。", "en": "The exchange of material culture was two-way, and Europe also exported various goods and plants along the Silk Road to meet the needs of the Chinese market.", "cls": "B", "pid": "u3_s5_p1", "sid": "u3_s5", "sec": "历史商业发展", "cov": 0.189, "hits": ["丝绸之路"], "deg": 2}, {"id": "s:11:CET6 2023·03·S1#1", "type": "sentence", "label": "张骞(Zhang Qian)是中国第一个伟大的探险家。", "ch": 11, "full": "张骞(Zhang Qian)是中国第一个伟大的探险家。", "en": "Zhang Qian was China's first great explorer.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:11:CET6 2023·03·S1#2", "type": "sentence", "label": "他不畏艰险，克服重重困难，两次出使西域，开通了中国同西亚和欧洲的通商关系，将中国", "ch": 11, "full": "他不畏艰险，克服重重困难，两次出使西域，开通了中国同西亚和欧洲的通商关系，将中国的丝和丝织品运往西亚和欧洲，开拓了历史上著名的“丝绸之路”。", "en": "Braving dangers and overcoming numerous difficulties, he made two missions to the Western Regions, opened up trade relations between China and West Asia and Europe, carried China's silk and silk fabrics to West Asia and Europe, and pioneered the world-famous Silk Road.", "cls": "B", "pid": "u3_s5_p1", "sid": "u3_s5", "sec": "历史商业发展", "cov": 0.145, "hits": ["丝绸之路"], "deg": 2}, {"id": "s:11:CET6 2023·03·S1#3", "type": "sentence", "label": "同时，他又将西域的风土人情、地理文化以及特有物种等介绍到中原，极大地开阔了人们的", "ch": 11, "full": "同时，他又将西域的风土人情、地理文化以及特有物种等介绍到中原，极大地开阔了人们的视野。", "en": "Meanwhile, he also introduced the customs, geography and culture as well as unique species of the Western Regions to the Central Plains, greatly broadening people's horizons.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:11:CET6 2023·03·S1#4", "type": "sentence", "label": "正如历史学家所指出的那样，如果没有张骞出使西域，就不可能有丝绸之路的开辟，也就不", "ch": 11, "full": "正如历史学家所指出的那样，如果没有张骞出使西域，就不可能有丝绸之路的开辟，也就不会有汉朝同西域或欧洲的文化交流。", "en": "As historians have pointed out, without Zhang Qian's missions to the Western Regions, there would have been no opening of the Silk Road, nor any cultural exchange between the Han Dynasty and the Western Regions or Europe.", "cls": "B", "pid": "u3_s5_p1", "sid": "u3_s5", "sec": "历史商业发展", "cov": 0.143, "hits": ["丝绸之路"], "deg": 2}, {"id": "s:11:CET6 2023·03·S2#1", "type": "sentence", "label": "郑和是中国历史上最杰出的航海家，在航海、外交、军事等诸多领域都表现出非凡的智慧和", "ch": 11, "full": "郑和是中国历史上最杰出的航海家，在航海、外交、军事等诸多领域都表现出非凡的智慧和卓越的才能。", "en": "Zheng He was the most outstanding navigator in Chinese history and displayed extraordinary wisdom and outstanding talent in many fields such as navigation, diplomacy and military affairs.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:11:CET6 2023·03·S2#2", "type": "sentence", "label": "他曾七次率领庞大的船队远航，访问了西太平洋和印度洋的许多国家和地区，加深了中国同", "ch": 11, "full": "他曾七次率领庞大的船队远航，访问了西太平洋和印度洋的许多国家和地区，加深了中国同东南亚、东非的相互了解。", "en": "He led a huge fleet on seven voyages, visited many countries and regions in the Western Pacific and the Indian Ocean, and deepened mutual understanding between China and Southeast Asia and East Africa.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:11:CET6 2023·03·S2#3", "type": "sentence", "label": "郑和下西洋对中外的经济和文化交流起到了十分积极的推进作用，也为维护区域和平做出了", "ch": 11, "full": "郑和下西洋对中外的经济和文化交流起到了十分积极的推进作用，也为维护区域和平做出了巨大的贡献。", "en": "Zheng He's voyages to the Western Seas played a very positive role in promoting economic and cultural exchanges between China and foreign countries, and also made great contributions to safeguarding regional peace.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:11:CET6 2023·03·S2#4", "type": "sentence", "label": "为了永远铭记郑和及其丰功伟绩，7月11日，即郑和首次率船队远航启程的日子，被定为", "ch": 11, "full": "为了永远铭记郑和及其丰功伟绩，7月11日，即郑和首次率船队远航启程的日子，被定为中国的航海节。", "en": "To forever remember Zheng He and his great achievements, July 11, the day when he first led his fleet on a voyage, was designated as China's Maritime Day.", "cl otection.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:12:CET6 2014·06·S1#1", "type": "sentence", "label": "北京计划未来三年投资 7 600 亿元治理污染，从减少 PM2.5 排放入手。", "ch": 12, "full": "北京计划未来三年投资 7 600 亿元治理污染，从减少 PM2.5 排放入手。", "en": "Beijing plans to invest 760 billion yuan over the next three years to control pollution, starting with reducing PM2.5 emissions.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:12:CET6 2014·06·S1#2", "type": "sentence", "label": "这一新公布的计划旨在减少四种主要污染源，包括 500 多万辆机动车的尾气(exh", "ch": 12, "full": "这一新公布的计划旨在减少四种主要污染源，包括 500 多万辆机动车的尾气(exhaust)排放、周边地区燃煤、来自北方的沙尘暴和本地的建筑灰尘。", "en": "The newly announced plan aims to reduce four major sources of pollution, including exhaust emissions from more than 5 million motor vehicles, coal burning in surrounding areas, sandstorms from the north and local construction dust.", "cls": "B", "pid": "u3_s6_p1", "sid": "u3_s6", "sec": "西安", "cov": 0.094, "hits": ["周边地区"], "deg": 2}, {"id": "s:12:CET6 2014·06·S1#3", "type": "sentence", "label": "另 850 亿元用于新建或升级城市垃圾处理和污水（sewage)处理设施，加上 ", "ch": 12, "full": "另 850 亿元用于新建或升级城市垃圾处理和污水（sewage)处理设施，加上 300 亿元投资未来三年的丝树造林（forestation)。", "en": "Another 85 billion yuan will be used to build or upgrade urban garbage and sewage treatment facilities, plus 30 billion yuan to be invested in afforestation over the next three years.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:12:CET6 2014·06·S1#4", "type": "sentence", "label": "市政府还计划建造一批水循环利用工厂，并制止违章建筑，以改善环境。", "ch": 12, "full": "市政府还计划建造一批水循环利用工厂，并制止违章建筑，以改善环境。", "en": "The municipal government also plans to build a number of water recycling plants and stop illegal construction to improve the environment.", "cls": "D", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:12:CET6 2014·06·S1#5", "type": "sentence", "label": "另外，北京还将更严厉地处罚违反限排规定的行为。", "ch": 12, "full": "另外，北京还将更严厉地处罚违反限排规定的行为。", "en
