nts also believe that if their children can achieve great success in society, they will be respected.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2015·12·S1", "idx": 5, "cn": "因此，他们愿意牺牲自己的时间、爱好和兴趣，为孩子提供更好的条件。", "en": "Therefore, they are willing to sacrifice their own time, hobbies and interests to provide better conditions for their children.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET6 2015·12·S1", "idx": 1, "cn": "在中国，父母总是竭力帮助孩子，甚至为孩手做重要决定，而不管孩子想要什么，因为他们相信这样做是为孩子好。", "en": "In China, parents always try their best to help their children and even make important decisions for them, regardless of what the children want, because they believe it is for the children's good.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET6 2015·12·S1", "idx": 2, "cn": "结果，孩子的成长和教育往往屈从于父母的意愿。", "en": "As a result, children's growth and education are often subject to their parents' will.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET6 2015·12·S1", "idx": 3, "cn": "如果父母决定为孩子报名参加一个课外班，以增加其被重点学校录取的机会，他们会坚持自己的决定，即使孩子根本不感兴趣。", "en": "If parents decide to sign their children up for an after-school class to increase their chances of admission to a key school, they will stick to their decision even if the children are not interested at all.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET6 2015·12·S1", "idx": 4, "cn": "然而在美国，父母很可能会尊重孩子的意见，并在决策时更注重他们的意见。", "en": "In the United States, however, parents are likely to respect their children's opinions and pay more attention to them when making decisions.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET6 2015·12·S1", "idx": 5, "cn": "中国父母十分重视教育或许值得称赞。", "en": "That Chinese parents attach great importance to education is perhaps praiseworthy.", "cls": "A", "sid": "u1_s3", "pid": "u1_s3_p1", "sec": "传统教育的发展", "cov": 0.267, "hits": ["重视教育"]}, {"ch": 4, "set": "CET6 2015·12·S1", "idx": 6, "cn": "然而，他们应向美国父母学习在涉及教育时如何平衡父母与子女间的关系。", "en": "However, they should learn from American parents how to balance the relationship between parents and children when it comes to education.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2013·12·S4", "idx": 1, "cn": "信息技术(Information Technology)，正在飞速发展，中国公民也越来越重视信息技术，有些学校甚至将信息技术作为必修课程，对这一现象大家持不同观点。", "en": "Information technology is developing rapidly, and Chinese citizens are attaching growing importance to it; some schools even make it a compulsory course, and people hold different views on this phenomenon.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2013·12·S4", "idx": 2, "cn": "一部分人认为这是没有必要的，学生就应该学习传统的课程。", "en": "Some people think it is unnecessary, and students should simply study traditional courses.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2013·12·S4", "idx": 3, "cn": "另一部分人认为这是应该的，中国就应该与时俱进。", "en": "Others think it is appropriate, as China should keep pace with the times.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2013·12·S4", "idx": 4, "cn": "不管怎样，信息技术引起广大人民的重视是一件好事。", "en": "In any case, it is a good thing that information technology has drawn the attention of the general public.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2014·06·S1", "idx": 1, "cn": "中国应进一步发展核能，因为核电目前只占其总发电量的 2%。", "en": "China should further develop nuclear power, because it currently accounts for only 2% of the country's total power generation.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2014·06·S1", "idx": 2, "cn": "该比例在所有核国家中居第 30 位，几乎是最低的。", "en": "This proportion ranks 30th among all nuclear power countries, which is almost the lowest.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2014·06·S1", "idx": 3, "cn": "2011 年 3 月日本核电站事故后，中国的核能开发停了下来，中止审批新的核电站，并开展全国性的核安全检查。", "en": "After the nuclear power plant accident in Japan in March 2011, China's nuclear power development came to a halt, approval of new nuclear power plants was suspended, and a nationwide nuclear safety inspection was launched.", "cls": "B", "sid": "u5_s4", "pid": "u5_s4_p1", "sec": "核电站", "cov": 0.128, "hits": ["核电站"]}, {"ch": 5, "set": "CET4 2014·06·S1", "idx": 4, "cn": "到 2012 年 10 月，审批才又谨慎地恢复。", "en": "It was not until October 2012 that approval was cautiously resumed.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2014·06·S1", "idx": 5, "cn": "随着技术和安全措施的改进，发生核事故的可能性完全可以降到最低程度鈐", "en": "With the improvement of technology and safety measures, the possibility of a nuclear accident can be reduced to the minimum.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2014·06·S1", "idx": 6, "cn": "换句话说，核能是可以安全开发和利", "en": "In other words, nuclear power can be safely developed and utilized.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2014·12·S2", "idx": 1, "cn": "中国的互联网社区是全世界发展最快的。", "en": "China's internet community is the fastest-growing in the world.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2014·12·S2", "idx": 2, "cn": "2010 年，中国约有 4.2 亿网民（netizen)，而且人数还在迅速增长。", "en": "In 2010, China had about 420 million internet users, and the number was still growing rapidly.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2014·12·S2", "idx": 3, "cn": "互联网的日渐流行带来了重大的社会变化。", "en": "The growing popularity of the internet has brought about major social changes.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2014·12·S2", "idx": 4, "cn": "中国网民往往不同于美国网民。", "en": "Chinese internet users are often different from American internet users.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2014·12·S2", "idx": 5, "cn": "美国网民更多的是受实际需要的驱使，用互联网为工具发电子邮件、买卖商品、做研究、规划旅程或付款。", "en": "American internet users are more driven by practical needs, using the internet as a tool to send emails, buy and sell goods, do research, plan trips, or make payments.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2014·12·S2", "idx": 6, "cn": "中国网民更多是出于社交原因使用互联网，因而更广泛地使用论坛、博客、聊天室等。", "en": "Chinese internet users use the internet more for social reasons, and therefore use forums, blogs, chat rooms and the like more widely.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2018·12·S1", "idx": 1, "cn": "由于通信网络的快速发展，中国智能手机用户数量近年来以惊人度增长。", "en": "Due to the rapid development of communication networks, the number of smartphone users in China has grown at an astonishing rate in recent years.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2018·12·S1", "idx": 2, "cn": "这极大地改变了许多人的阅读方式。", "en": "This has greatly changed the way many people read.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2018·12·S1", "idx": 3, "cn": "他们现在经常智能手机上看新闻和文章，而不买传统报刊。", "en": "They now often read news and articles on their smartphones instead of buying traditional newspapers and magazines.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2018·12·S1", "idx": 4, "cn": "大量移动应用程序的开发使人们能用手机读小说和其他形式的文学作品。", "en": "The development of a large number of mobile applications enables people to read novels and other forms of literary works on their phones.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2018·12·S1", "idx": 5, "cn": "因此，纸质书籍的销售受到了影响。", "en": "As a result, the sales of paper books have been affected.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2018·12·S1", "idx": 6, "cn": "但调查显示，尽管能手机阅读市场稳步增长，超半数成年人仍喜欢读纸质书。", "en": "But surveys show that although the smartphone reading market is growing steadily, more than half of adults still prefer to read paper books.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2018·12·S3", "idx": 1, "cn": "过去几年里，移动支付市场在中国蓬勃发展。", "en": "Over the past few years, the mobile payment market has been booming in China.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2018·12·S3", "idx": 2, "cn": "随着移动互联网的出现，手机购物逐渐成为一种趋势。", "en": "With the emergence of the mobile internet, shopping on mobile phones has gradually become a trend.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2018·12·S3", "idx": 3, "cn": "18 到 30岁的年轻人构成了移动支付市场的最大群体。", "en": "Young people aged 18 to 30 make up the largest group in the mobile payment market.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2018·12·S3", "idx": 4, "cn": "由于现在用手机付款很容易，许多消费者在购物时宁愿用手机付款，而不愿用现金或信用卡。", "en": "Since paying with mobile phones is now very easy, many consumers prefer to pay by phone rather than in cash or by credit card when shopping.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2018·12·S3", "idx": 5, "cn": "为了鼓励人们多消费，许多商店给使用移动支付的顾客打折。", "en": "To encourage people to spend more, many stores offer discounts to customers who use mobile payment.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2018·12·S3", "idx": 6, "cn": "专家预测，中国移动支付市场未来仍有很大发展潜力。", "en": "Experts predict that China's mobile payment market still has great development potential in the future.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2024·12·S3", "idx": 1, "cn": "近年来，中国新能源汽车产业发展迅速。", "en": "In recent years, China's new energy vehicle industry has been developing rapidly.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2024·12·S3", "idx": 2, "cn": "目前，中国新能源汽车年产量已高达近千万辆，占全球市场份额超过 60%，出口量不断创出新高。", "en": "At present, China's annual output of new energy vehicles has reached nearly 10 million units, accounting for more than 60% of the global market share, and its export volume keeps hitting new highs.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2024·12·S3", "idx": 3, "cn": "中国政府通过加大资金投入和政策引导，鼓励新能源汽车企业进行技术创新，不断提高产品在市场上的竞争力。", "en": "By increasing funding and policy guidance, the Chinese government encourages new energy vehicle companies to carry out technological innovation and continuously improve the competitiveness of their products in the market.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2024·12·S3", "idx": 4, "cn": "中国新能源汽车产业的发展不仅有力推动了国内经济发展，也为全球新能源利用和环境保护做出了积极贡献。", "en": "The development of China's new energy vehicle industry has not only strongly boosted domestic economic development, but also made positive contributions to global new energy utilization and environmental protection.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2025·06·S1", "idx": 1, "cn": "被誉为“杂交水稻 ( hybrid rice ) 之父”的袁隆平和他的科研团队克服重重困难，研发出了一种超级杂交水稻。", "en": "Yuan Longping, known as the \"Father of Hybrid Rice,\" and his research team overcame numerous difficulties and developed a type of super hybrid rice.", "cls": "B", "sid": "u5_s16", "pid": "u5_s16_p1", "sec": "袁隆平与杂交水稻", "cov": 0.167, "hits": ["杂交水稻", "袁隆平"]}, {"ch": 5, "set": "CET4 2025·06·S1", "idx": 2, "cn": "这项技术获得了举世公认的巨大成功。", "en": "This technology has achieved universally acknowledged great success.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2025·06·S1", "idx": 3, "cn": "通过这项技术的应用，水稻抗旱抗病能力更强，能适应不同的气候和土壤条件，产量可提高 20% ~ 30%。", "en": "Through the application of this technology, rice has become more resistant to drought and disease and can adapt to different climate and soil conditions, with yields increasing by 20% to 30%.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET4 2025·06·S1", "idx": 4, "cn": "超级杂交水稻营养丰富，口感更佳。", "en": "Super hybrid rice is rich in nutrition and tastes better.", "cls": "A", "sid": "u5_s16", "pid": "u5_s16_p1", "sec": "袁隆平与杂交水稻", "cov": 0.251, "hits": ["杂交水稻"]}, {"ch": 5, "set": "CET4 2025·06·S1", "idx": 5, "cn": "目前，这项技术已经在许多国家得到广泛应用，为全球粮食安全做出了重大贡献。", "en": "At present, this technology has been widely applied in many countries, making a major contribution to global food security.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2014·06·S3", "idx": 1, "cn": "最近，中国科学院（Chinese Academy of Sciences)出版了关于其最新科学发现与未来一年展望的年度系列报告。", "en": "Recently, the Chinese Academy of Sciences published its annual series of reports on its latest scientific discoveries and its outlook for the coming year.", "cls": "B", "sid": "u5_s5", "pid": "u5_s5_p1", "sec": "超导体的研究、开发与应用", "cov": 0.129, "hits": ["中国科学院"]}, {"ch": 5, "set": "CET6 2014·06·S3", "idx": 2, "cn": "系列报告包括三部分:科学发展报告、高技术发展报告、中国可持续发展战略报告。", "en": "The series consists of three parts: a science development report, a high-technology development report, and a report on China's sustainable development strategy.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2014·06·S3", "idx": 3, "cn": "第一份报告包含中国科学家的最新发现，诸如新粒子研究与 H7N9 病毒研究的突破。", "en": "The first report covers the latest discoveries of Chinese scientists, such as breakthroughs in the study of new particles and in research on the H7N9 virus.", "cls": "B", "sid": "u5_s5", "pid": "u5_s5_p1", "sec": "超导体的研究、开发与应用", "cov": 0.2, "hits": ["科学家"]}, {"ch": 5, "set": "CET6 2014·06·S3", "idx": 4, "cn": "该报告还突出强调了未来几年需要关注的问题。", "en": "The report also highlights the issues that need to be addressed in the coming years.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2014·06·S3", "idx": 5, "cn": "第二份报告公布了一些应用科学研究的热门领域，如 3D 打印和人造器官研究。", "en": "The second report lists some hot fields in applied science research, such as 3D printing and the study of artificial organs.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2014·06·S3", "idx": 6, "cn": "第三份报告呼吁加强顶层设计，以消除工业升级中的结构性障碍，并促进节能减排。", "en": "The third report calls for strengthening top-level design in order to remove structural obstacles in industrial upgrading and promote energy conservation and emissions reduction.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2015·12·S2", "idx": 1, "cn": "最近，中国政府决定将其工业升级。", "en": "Recently, the Chinese government decided to upgrade its industry.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2015·12·S2", "idx": 2, "cn": "中国现在涉足建造高速列车、远洋船舶、机器人，甚至飞机。", "en": "China is now involved in building high-speed trains, oceangoing ships, robots and even aircraft.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2015·12·S2", "idx": 3, "cn": "不久前，中国获得了在印度尼西亚(Indonesia)建造一条高铁的合同；中国还与马来西亚(Malaysia)签署了为其提供高速列车的合同。", "en": "Not long ago, China won a contract to build a high-speed railway in Indonesia; it also signed a contract with Malaysia to supply high-speed trains.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2015·12·S2", "idx": 4, "cn": "这证明人们信赖中国造产品。", "en": "This proves that people trust products made in China.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2015·12·S2", "idx": 5, "cn": "中国造产品越来越受欢迎。", "en": "Products made in China are becoming increasingly popular.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2015·12·S2", "idx": 6, "cn": "中国为此付出了代价，但这确实有助于消除贫困，同时还为世界各地的人们提供了就业机会。", "en": "China has paid a price for this, but it has indeed helped eliminate poverty and has also provided employment opportunities for people around the world.", "cls": "B", "sid": "u4_s2", "pid": "u4_s2_p1", "sec": "烟花", "cov": 0.162, "hits": ["世界各地"]}, {"ch": 5, "set": "CET6 2015·12·S2", "idx": 7, "cn": "这是一件好事，值得称赞。", "en": "This is a good thing and deserves praise.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2015·12·S2", "idx": 8, "cn": "下次你去商店时，可能想看一看你所购商品的出产国名。", "en": "The next time you go to a store, you may want to check the country of origin of the goods you buy.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2015·12·S2", "idx": 9, "cn": "很有可能这件商品是中国造的。", "en": "It is quite possible that this product is made in China.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2018·06·S2", "idx": 1, "cn": "中国目前拥有世界上最大最快的高速铁路网。", "en": "China currently has the world's largest and fastest high-speed rail network.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2018·06·S2", "idx": 2, "cn": "高铁列车的运行速度还将继续提升，更多的城市将修建高铁站。", "en": "The operating speed of high-speed trains will continue to increase, and more cities will build high-speed rail stations.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2018·06·S2", "idx": 3, "cn": "高铁大大缩短了人们出行的时间。", "en": "High-speed rail has greatly shortened people's travel time.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2018·06·S2", "idx": 4, "cn": "相对飞机而言，高铁列车的突出优势在于准时，因为基本不受天气或交通管制的影响。", "en": "Compared with airplanes, the prominent advantage of high-speed trains lies in their punctuality, because they are basically unaffected by weather or traffic control.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2018·06·S2", "idx": 5, "cn": "高铁极大地改变了中国人的生活方式。", "en": "High-speed rail has greatly changed the lifestyle of Chinese people.", "cls": "A", "sid": "u3_s1", "pid": "u3_s1_p3", "sec": "中医", "cov": 0.267, "hits": ["生活方式"]}, {"ch": 5, "set": "CET6 2018·06·S2", "idx": 6, "cn": "如今，它已经成了很多人商务旅行的首选交通工具。", "en": "Today, it has already become the preferred means of transport for many people on business trips.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2018·06·S2", "idx": 7, "cn": "越来越多的人也在假日乘高铁外出旅游。", "en": "More and more people also travel by high-speed rail during holidays.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2018·06·S2", "idx": 8, "cn": "还有不少年轻人选择在一个城市工作而在邻近城市居住，每天乘高铁上下班。", "en": "Quite a few young people also choose to work in one city while living in a neighboring city, commuting by high-speed rail every day.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2024·12·S1", "idx": 1, "cn": "北斗（Beidou）卫星导航系统的成功研制是中国自改革开放以来取得的一项重大科技成就。", "en": "The successful development of the Beidou satellite navigation system is a major scientific and technological achievement that China has made since the reform and opening up.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2024·12·S1", "idx": 2, "cn": "研发人员经过不懈努力，攻克了一系列技术难题，北斗系统最终实现了全球覆盖和高精度定位，使中国成为世界上少数几个独立拥有全球卫星导航系统的国家之一。", "en": "Through unremitting efforts, researchers overcame a series of technical difficulties, and the Beidou system eventually achieved global coverage and high-precision positioning, making China one of the few countries in the world that independently own a global satellite navigation system.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2024·12·S1", "idx": 3, "cn": "北斗系统已广泛应用于交通运输、灾害救援、天气预报、公共安全等诸多领域。", "en": "The Beidou system has been widely applied in many fields such as transportation, disaster relief, weather forecasting, and public security.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2024·12·S1", "idx": 4, "cn": "北斗系统现在已经在国际上得到广泛认可，开始为越来越多的国家和地区提供优质服务。", "en": "The Beidou system is now widely recognized internationally and has begun to provide high-quality services to more and more countries and regions.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2024·12·S2", "idx": 1, "cn": "洋山港 (Yangshan Port) 是上海航运中心的重要组成部分，是中国第一个深水港，也是世界上规模最大的深水港之一。", "en": "Yangshan Port is an important part of Shanghai's shipping center, China's first deep-water port, and one of the largest deep-water ports in the world.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2024·12·S2", "idx": 2, "cn": "经过近 20 年的发展，洋山港已实现高度自动化。", "en": "After nearly 20 years of development, Yangshan Port has achieved a high degree of automation.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2024·12·S2", "idx": 3, "cn": "数字技术和人工智能的使用大大减少了用工成本和碳排放。", "en": "The use of digital technology and artificial intelligence has greatly reduced labor costs and carbon emissions.", "cls": "B", "sid": "u5_s17", "pid": "u5_s17_p1", "sec": "天河三号超级计算机", "cov": 0.208, "hits": ["人工智能"]}, {"ch": 5, "set": "CET6 2024·12·S2", "idx": 4, "cn": "自主研发的码头管理系统可以在百公里之外对大型设备进行远程操控。", "en": "The self-developed terminal management system can remotely control large equipment from a hundred kilometers away.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2024·12·S2", "idx": 5, "cn": "洋山港看上去一片繁忙，现场却见不到人工操作，而且能够 24 小时不间断运作。", "en": "Yangshan Port looks busy, yet no manual operation can be seen on site, and it can operate around the clock.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2024·12·S2", "idx": 6, "cn": "洋山港将不断发展，为把上海建成一个全球航运中心做出更大贡献。", "en": "Yangshan Port will keep developing and make greater contributions to building Shanghai into a global shipping center.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2024·12·S3", "idx": 1, "cn": "遨游太空历来是中华民族的梦想。", "en": "Traveling in space has long been the dream of the Chinese nation.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2024·12·S3", "idx": 2, "cn": "2003 年，神舟五号飞船发射成功，杨利伟成为第一个飞入太空的中国宇航员。", "en": "In 2003, the Shenzhou-5 spacecraft was launched successfully, and Yang Liwei became the first Chinese astronaut to travel into space.", "cls": "A", "sid": "u5_s14", "pid": "u5_s14_p2", "sec": "神舟飞船与天宫空间实验室", "cov": 0.413, "hits": ["神舟五号", "杨利伟"]}, {"ch": 5, "set": "CET6 2024·12·S3", "idx": 3, "cn": "2008 年，神舟七号升空，翟志刚成为中国历史上首位进行太空行走的宇航员。", "en": "In 2008, the Shenzhou-7 spacecraft was launched, and Zhai Zhigang became the first Chinese astronaut in history to carry out a spacewalk.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2024·12·S3", "idx": 4, "cn": "近年来，中国航天进入创新发展“快车道”，太空基础设施建设稳步推进，中国空间站于 2022 年全面建成。", "en": "In recent years, China's space industry has entered the \"fast lane\" of innovative development, space infrastructure has been steadily advanced, and the China Space Station was fully completed in 2022.", "cls": "B", "sid": "u5_s14", "pid": "u5_s14_p6", "sec": "神舟飞船与天宫空间实验室", "cov": 0.209, "hits": ["空间站"]}, {"ch": 5, "set": "CET6 2024·12·S3", "idx": 5, "cn": "中国航天事业的迅速发展在中华民族的历史上写下了辉煌一页，也为人类文明进步做出了巨大贡献。", "en": "The rapid development of China's space industry has written a glorious page in the history of the Chinese nation and made great contributions to the progress of human civilization.", "cls": "A", "sid": "u1_s3", "pid": "u1_s3_p1", "sec": "古代科学与技术", "cov": 0.268, "hits": ["人类文明", "巨大贡献"]}, {"ch": 5, "set": "CET6 2024·12·S3", "idx": 6, "cn": "未来，中国探索太空的脚步将迈得更稳、更远。", "en": "In the future, China will take steadier and longer strides in its exploration of space.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2025·06·S1", "idx": 1, "cn": "天宫空间站 (Tiangong Space Station) 是中国首个太空实验室，拥有 110 多立方米使用空间，可驻留 3 名航天员，在距地球表面 400—450 公里的轨道上运行。", "en": "Tiangong Space Station is China's first space laboratory, with more than 110 cubic meters of usable space that can accommodate three astronauts and orbits at an altitude of 400 to 450 kilometers above the Earth's surface.", "cls": "B", "sid": "u5_s14", "pid": "u5_s14_p6", "sec": "神舟飞船与天宫空间实验室", "cov": 0.227, "hits": ["空间站", "实验室"]}, {"ch": 5, "set": "CET6 2025·06·S1", "idx": 2, "cn": "天宫空间站已实施 180 多个科学研究与应用项目，涉及空间生命科学、太空医学、空间材料科学等领域。", "en": "Tiangong Space Station has carried out more than 180 scientific research and application projects, covering fields such as space life sciences, space medicine, and space materials science.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2025·06·S1", "idx": 3, "cn": "天宫空间站的研究成果在我国得到了广泛应用，产生了显著的经济效益。", "en": "The research results of Tiangong Space Station have been widely applied in China, producing significant economic benefits.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2025·06·S1", "idx": 4, "cn": "例如，太空育种创造的直接经济效益高达数千亿元。", "en": "For example, the direct economic benefits created by space breeding amount to hundreds of billions of yuan.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2025·06·S1", "idx": 5, "cn": "这不仅标志中国在航天技术上取得了巨大进步，也表明中国为全球的太空研究和应用做出了重大贡献。", "en": "This not only marks China's great progress in space technology, but also shows that China has made major contributions to global space research and application.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2026·06·S1", "idx": 1, "cn": "科技进步使中国的医疗事业得到快速发展。", "en": "Scientific and technological progress has enabled China's medical sector to develop rapidly.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2026·06·S1", "idx": 2, "cn": "近年来，远程医疗使优质医疗资源惠及更多患者。", "en": "In recent years, telemedicine has made high-quality medical resources available to more patients.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2026·06·S1", "idx": 3, "cn": "医学专家可以通过视频为偏远地区患者提供咨询，指导当地医生制定并实施治疗方案。", "en": "Medical experts can provide consultations for patients in remote areas through video, guiding local doctors to formulate and implement treatment plans.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2026·06·S1", "idx": 4, "cn": "人工智能辅助诊断系统帮助医生识别患者的早期症状，提高诊断准确率。", "en": "AI-assisted diagnosis systems help doctors identify patients' early symptoms and improve diagnostic accuracy.", "cls": "B", "sid": "u3_s1", "pid": "u3_s1_p6", "sec": "中医", "cov": 0.127, "hits": ["症状"]}, {"ch": 5, "set": "CET6 2026·06·S1", "idx": 5, "cn": "电子健康档案的普及让医生能够快速了解患者病史，避免重复检查。", "en": "The popularization of electronic health records enables doctors to quickly understand a patient's medical history and avoid repeated examinations.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2026·06·S1", "idx": 6, "cn": "线上医疗咨询平台极大地方便了患者就诊。", "en": "Online medical consultation platforms have greatly facilitated patients' access to medical care.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2026·06·S1", "idx": 7, "cn": "科技与医疗的深度融合更好地满足了人民的健康需求。", "en": "The deep integration of technology and medicine better meets the people's health needs.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2026·06·S3", "idx": 1, "cn": "近年来，中国无人机 (drone) 产业蓬勃发展，出口量跃升为全球第一。", "en": "In recent years, China's drone industry has been booming, and its export volume has jumped to first place in the world.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2026·06·S3", "idx": 2, "cn": "中国的无人机以出色的稳定性、高清 (high-definition) 拍摄能力和便捷的操作，受到全球消费者的喜爱，在民用领域得到广泛应用。", "en": "Chinese drones are loved by global consumers for their excellent stability, high-definition imaging capability and convenient operation, and are widely used in the civil sector.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2026·06·S3", "idx": 3, "cn": "无人机已被国家纳入战略性新兴产业，逐步成为能满足多种场景需求的智能助手。", "en": "Drones have been included by the state in strategic emerging industries, and are gradually becoming intelligent assistants capable of meeting the needs of various scenarios.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2026·06·S3", "idx": 4, "cn": "在农村，无人机可精准识别农作物病虫害，高效喷洒农药。", "en": "In rural areas, drones can precisely identify crop diseases and pests and efficiently spray pesticides.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2026·06·S3", "idx": 5, "cn": "在城市，无人机可快速运送生鲜食品。", "en": "In cities, drones can quickly deliver fresh food.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 5, "set": "CET6 2026·06·S3", "idx": 6, "cn": "在不久的将来，无人机能够在更多领域实现其独特价值，为经济社会发展注入新动能。", "en": "In the near future, drones will be able to realize their unique value in more fields and inject new momentum into economic and social development.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 6, "set": "CET4 2016·06·S1", "idx": 1, "cn": "功夫（Kong Fu) 是中国武术（martial arts）的俗称。", "en": "Kung Fu is a common name for Chinese martial arts.", "cls": "A", "sid": "u2_s4", "pid": "u2_s4_p9", "sec": "中国武术的分类", "cov": 0.576, "hits": ["中国武术", "武术"]}, {"ch": 6, "set": "CET4 2016·06·S1", "idx": 2, "cn": "中国武术的起源可以追溯到自卫的需要，狩猎活动以及古代中国的军士训练。", "en": "The origin of Chinese martial arts can be traced back to the need for self-defense, hunting activities, and the military training of ancient China.", "cls": "B", "sid": "u2_s3", "pid": "u2_s3_p2", "sec": "传统体育活动", "cov": 0.2, "hits": ["中国武术", "武术"]}, {"ch": 6, "set": "CET4 2016·06·S1", "idx": 3, "cn": "它是中国传统体育运动的一种，年轻人和老年人都练。", "en": "It is one of the traditional Chinese sports, and it is practiced by both young and old people.", "cls": "A", "sid": "u2_s9", "pid": "u2_s9_p7", "sec": "全民健身", "cov": 0.381, "hits": ["老年人", "年轻人"]}, {"ch": 6, "set": "CET4 2016·06·S1", "idx": 4, "cn": "它已逐渐演变成了中国文化的独特元素。", "en": "It has gradually evolved into a unique element of Chinese culture.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 6, "set": "CET4 2016·06·S1", "idx": 5, "cn": "作为中国的国宝，武术有上百种不同的风格，是世界上练得最多的武术形式。", "en": "As a national treasure of China, martial arts has hundreds of different styles and is the most widely practiced form of martial arts in the world.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 6, "set": "CET4 2016·06·S1", "idx": 6, "cn": "有些风格模仿了动物的动作，还有一些则受到了中国哲学思想，神话和传说的启发。", "en": "Some styles imitate the movements of animals, while others are inspired by Chinese philosophy, myths and legends.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 6, "set": "CET4 2022·09·S1", "idx": 1, "cn": "太极拳 (Taijiquan)起源于中国古代，是中国武术 (martialart)的一个重要分支。", "en": "Taijiquan originated in ancient China and is an important branch of Chinese martial arts.", "cls": "A", "sid": "u2_s7", "pid": "u2_s7_p1", "sec": "太极拳", "cov": 0.27, "hits": ["太极拳", "中国武术", "武术"]}, {"ch": 6, "set": "CET4 2022·09·S1", "idx": 2, "cn": "练太极拳最初是为了自卫，现在是促进身心健康的有效锻炼方式。", "en": "Practicing Taijiquan was originally for self-defense, but now it is an effective way of exercise to promote physical and mental health.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 6, "set": "CET4 2022·09·S1", "idx": 3, "cn": "大量研究表明，这种锻炼方式有助于保持力量、灵活性和平衡力，并减少压力和焦虑。", "en": "A large number of studies show that this form of exercise helps maintain strength, flexibility and balance, and reduce stress and anxiety.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 6, "set": "CET4 2022·09·S1", "idx": 4, "cn": "太极拳练习起来既容易又愉快，通过轻柔、流畅的动作，促使心情平静、头脑清晰。", "en": "Taijiquan is both easy and pleasant to practice, and through gentle, flowing movements it helps calm the mind and clear the head.", "cls": "B", "sid": "u2_s7", "pid": "u2_s7_p3", "sec": "太极拳", "cov": 0.214, "hits": ["太极拳"]}, {"ch": 6, "set": "CET4 2022·09·S1", "idx": 5, "cn": "今天，太极拳已经传播到世界各地，深受广大健身者的喜爱。", "en": "Today, Taijiquan has spread to all parts of the world and is deeply loved by fitness enthusiasts.", "cls": "B", "sid": "u2_s7", "pid": "u2_s7_p3", "sec": "太极拳", "cov": 0.15, "hits": ["太极拳"]}, {"ch": 6, "set": "CET6 2018·06·S3", "idx": 1, "cn": "自行车曾经是中国城乡最主要的交通工具，中国一度被称为“自行车王国”。", "en": "Bicycles were once the most important means of transportation in China's cities and countryside, and China was once called the \"kingdom of bicycles.\"", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 6, "set": "CET6 2018·06·S3", "idx": 2, "cn": "如今，随着城市交通拥堵和空气污染日益严重，骑自行车又开始起来。", "en": "Nowadays, as urban traffic congestion and air pollution are getting worse, riding bicycles is becoming popular again.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 6, "set": "CET6 2018·06·S3", "idx": 3, "cn": "近来，中国企业家将移动互联网技术与传统自行车结合在一起，发明了一种称为共享单车（shared bikes）的商业模式。", "en": "Recently, Chinese entrepreneurs have combined mobile Internet technology with traditional bicycles to invent a business model called shared bikes.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 6, "set": "CET6 2018·06·S3", "idx": 4, "cn": "共享单车的出现使骑车出行更加方便，人们仅需一部手机就可以随时使用共享单车。", "en": "The emergence of shared bikes has made cycling much more convenient, and people can use shared bikes at any time with just a smartphone.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 6, "set": "CET6 2018·06·S3", "idx": 5, "cn": "为了鼓励人们骑车出行，很多城市修建了自行车道。", "en": "To encourage people to cycle, many cities have built bicycle lanes.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 6, "set": "CET6 2018·06·S3", "idx": 6, "cn": "现在，越来越多的中国人也喜欢通过骑车健身。", "en": "Now, more and more Chinese people also like to keep fit by cycling.", "cls": "B", "sid": "u2_s9", "pid": "u2_s9_p1", "sec": "全民健身", "cov": 0.333, "hits": []}, {"ch": 6, "set": "CET6 2018·12·S3", "idx": 1, "cn": "近年来，中国政府进一步加大体育馆建设投资，以更好地满足人们快速增长的健身需求。", "en": "In recent years, the Chinese government has further increased investment in the construction of sports venues to better meet people's rapidly growing demand for fitness.", "cls": "A", "sid": "u2_s9", "pid": "u2_s9_p8", "sec": "全民健身", "cov": 0.363, "hits": ["中国政府"]}, {"ch": 6, "set": "CET6 2018·12·S3", "idx": 2, "cn": "除了新建体育馆外，许多城市换采取了改造旧工厂和商业建筑等措施，来增加当地体育馆的数量。", "en": "In addition to building new sports venues, many cities have also taken measures such as repurposing old factories and commercial buildings to increase the number of local sports venues.", "cls": "B", "sid": "u2_s9", "pid": "u2_s9_p1", "sec": "全民健身", "cov": 0.128, "hits": ["体育馆"]}, {"ch": 6, "set": "CET6 2018·12·S3", "idx": 3, "cn": "在政府资金的支持下，越来越多的体育馆向公众免费开放，或者只收取少量费用。", "en": "With the support of government funds, more and more sports venues are open to the public free of charge, or charge only a small fee.", "cls": "B", "sid": "u2_s9", "pid": "u2_s9_p1", "sec": "全民健身", "cov": 0.207, "hits": ["体育馆"]}, {"ch": 6, "set": "CET6 2018·12·S3", "idx": 4, "cn": "许多体育馆通过应用现代信息技术大大提高了服务质量。", "en": "Many sports venues have greatly improved their service quality through the application of modern information technology.", "cls": "B", "sid": "u2_s9", "pid": "u2_s9_p1", "sec": "全民健身", "cov": 0.15, "hits": ["体育馆"]}, {"ch": 6, "set": "CET6 2018·12·S3", "idx": 5, "cn": "人民可以方便地在线预订场地和付费。", "en": "People can conveniently book venues and pay online.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 6, "set": "CET6 2018·12·S3", "idx": 6, "cn": "可以预见，随着运动设施的不断改善，愈来愈多的人将会去体育馆健身。", "en": "It can be predicted that, as sports facilities continue to improve, more and more people will go to sports venues to keep fit.", "cls": "B", "sid": "u2_s9", "pid": "u2_s9_p1", "sec": "全民健身", "cov": 0.234, "hits": ["体育馆"]}, {"ch": 7, "set": "CET6 2013·12·S3", "idx": 1, "cn": "中国人自古以来就在中秋时节庆祝丰收。", "en": "Since ancient times, Chinese people have celebrated a good harvest during the Mid-Autumn season.", "cls": "B", "sid": "u2_s3", "pid": "u2_s3_p1", "sec": "春节的活动", "cov": 0.25, "hits": []}, {"ch": 7, "set": "CET6 2013·12·S3", "idx": 2, "cn": "这与北美地区庆祝感恩节的习俗十分相似。", "en": "This is very similar to the custom of celebrating Thanksgiving in North America.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET6 2013·12·S3", "idx": 3, "cn": "过中秋节的习俗于唐代早期在中国各地开始流行。", "en": "The custom of celebrating the Mid-Autumn Festival began to gain popularity across China in the early Tang Dynasty.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET6 2013·12·S3", "idx": 4, "cn": "中秋节在农历八月十五，是人们拜月的节日。", "en": "The Mid-Autumn Festival falls on the fifteenth day of the eighth lunar month and is a festival for people to worship the moon.", "cls": "A", "sid": "u2_s11", "pid": "u2_s11_p1", "sec": "中秋节", "cov": 0.549, "hits": ["中秋节"]}, {"ch": 7, "set": "CET6 2013·12·S3", "idx": 5, "cn": "这天夜晚皓月当空，人们合家团聚，共赏明月。", "en": "On this night, with the bright moon hanging in the sky, families gather for a reunion and appreciate the round moon together.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET6 2013·12·S3", "idx": 6, "cn": "2006年，中秋节被列为中国的文化遗产，2008年又被定为公共假日。", "en": "In 2006, the Mid-Autumn Festival was listed as a form of China's cultural heritage, and in 2008 it was designated as a public holiday.", "cls": "B", "sid": "u2_s4", "pid": "u2_s4_p5", "sec": "元宵节", "cov": 0.227, "hits": ["文化遗产"]}, {"ch": 7, "set": "CET6 2013·12·S3", "idx": 7, "cn": "月饼被视为中秋节不可或缺的美食。", "en": "Mooncakes are regarded as an indispensable delicacy of the Mid-Autumn Festival.", "cls": "A", "sid": "u2_s3", "pid": "u2_s3_p6", "sec": "春节的活动", "cov": 0.357, "hits": ["不可或缺"]}, {"ch": 7, "set": "CET6 2013·12·S3", "idx": 8, "cn": "人们将月饼作为礼物馈赠亲友或在家庭聚会上享用。", "en": "People give mooncakes as gifts to relatives and friends, or enjoy them at family gatherings.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET6 2013·12·S3", "idx": 9, "cn": "传统的月饼上带有“寿”（longevity）、“福”或“和”等字样。", "en": "Traditional mooncakes bear characters such as \"shou\" (longevity), \"fu\" (good fortune) and \"he\" (harmony).", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2020·12·S2", "idx": 1, "cn": "春节前夕吃团圆饭是中国人的传统。", "en": "Eating the reunion dinner on the eve of the Spring Festival is a Chinese tradition.", "cls": "A", "sid": "u2_s1", "pid": "u2_s1_p1", "sec": "春节", "cov": 0.357, "hits": ["春节"]}, {"ch": 7, "set": "CET4 2020·12·S2", "idx": 2, "cn": "团圆饭是一年中最重要的晚餐，也是家庭团聚的最佳时机，家人生活在不同地方的家庭尤其如此。", "en": "The reunion dinner is the most important dinner of the year and the best time for family reunions, especially for families whose members live in different places.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2020·12·S2", "idx": 3, "cn": "团圆饭上的菜看丰富多样，其中有些菜看有特殊含义。", "en": "The dishes at the reunion dinner are rich and varied, and some of them have special meanings.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2020·12·S2", "idx": 4, "cn": "例如，鱼是不可缺少的一道莱，因为汉语中的“鱼”宇和“余”宇听上去一样。", "en": "For example, fish is an indispensable dish, because the Chinese characters for \"fish\" and \"surplus\" sound the same.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2020·12·S2", "idx": 5, "cn": "在中国的许多地方，饺子也是一道重要的佳肴，因为饺子象征着财富和好运。", "en": "In many parts of China, jiaozi is also an important dish, because it symbolizes wealth and good luck.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2020·12·S3", "idx": 1, "cn": "，鱼是春节前夕餐桌上不可或缺的一道莱，因为汉语中“鱼”字的发音与“余”字的发音相同。", "en": "Fish is an indispensable dish on the dinner table on the eve of the Spring Festival, because the pronunciation of the Chinese character for \"fish\" is the same as that of \"surplus\".", "cls": "B", "sid": "u2_s3", "pid": "u2_s3_p6", "sec": "春节的活动", "cov": 0.214, "hits": ["春节", "不可或缺"]}, {"ch": 7, "set": "CET4 2020·12·S3", "idx": 2, "cn": "正由于这个象征性的意义，春节期间鱼也作为礼物送给亲戚朋友。", "en": "Because of this symbolic meaning, fish is also given as a gift to relatives and friends during the Spring Festival.", "cls": "B", "sid": "u2_s3", "pid": "u2_s3_p9", "sec": "春节的活动", "cov": 0.174, "hits": ["春节"]}, {"ch": 7, "set": "CET4 2020·12·S3", "idx": 3, "cn": "鱼的象征意义据说源于中国传统文化。", "en": "The symbolic meaning of fish is said to originate from traditional Chinese culture.", "cls": "B", "sid": "u2_s11", "pid": "u2_s11_p6", "sec": "中秋节", "cov": 0.333, "hits": []}, {"ch": 7, "set": "CET4 2020·12·S3", "idx": 4, "cn": "中国人有节省的传统，他们认为节省得愈多，就感到愈为安全。", "en": "Chinese people have a tradition of thrift: they believe that the more they save, the safer they feel.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2020·12·S3", "idx": 5, "cn": "今天，尽管人们愈来愈富裕了，但他们仍然认为节省是一种值得弘扬的美德。", "en": "Today, although people are getting richer and richer, they still regard thrift as a virtue worth promoting.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2022·09·S2", "idx": 1, "cn": "按照中国民间的传统习俗，春节期间长辈通常会给孩子发红包，俗称发压岁钱(luckymoney),以表达对孩子的祝福，祝他们好运。", "en": "According to traditional Chinese folk customs, during the Spring Festival elders usually give children red envelopes, commonly known as \"lucky money\", to express their blessings and wish them good luck.", "cls": "A", "sid": "u2_s3", "pid": "u2_s3_p7", "sec": "春节的活动", "cov": 0.27, "hits": ["红包", "压岁钱"]}, {"ch": 7, "set": "CET4 2022·09·S2", "idx": 2, "cn": "如今，红包不仅是给孩子的礼物，而且经常也是给长辈或亲朋好友的礼物。", "en": "Today, red envelopes are not only gifts for children but also gifts for elders or relatives and friends.", "cls": "B", "sid": "u2_s3", "pid": "u2_s3_p7", "sec": "春节的活动", "cov": 0.135, "hits": ["红包"]}, {"ch": 7, "set": "CET4 2022·09·S2", "idx": 3, "cn": "近年来，随着微信用户数量的增加，微信红包变得愈加流行。", "en": "In recent years, with the increase in the number of WeChat users, WeChat red envelopes have become increasingly popular.", "cls": "B", "sid": "u2_s3", "pid": "u2_s3_p8", "sec": "春节的活动", "cov": 0.111, "hits": ["红包"]}, {"ch": 7, "set": "CET4 2022·09·S2", "idx": 4, "cn": "欢度春节时，人们经常互发微信红包表达问候。", "en": "When celebrating the Spring Festival, people often send each other WeChat red envelopes to express greetings.", "cls": "B", "sid": "u2_s3", "pid": "u2_s3_p6", "sec": "春节的活动", "cov": 0.187, "hits": ["春节", "欢度春节"]}, {"ch": 7, "set": "CET4 2022·09·S2", "idx": 5, "cn": "这无疑是一种与远方亲友联系的便捷方式。", "en": "This is undoubtedly a convenient way to keep in touch with relatives and friends far away.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2022·12·S1", "idx": 1, "cn": "在中国农历中，立秋(Start of Autumn)意味着夏天的结束和秋天的开始。", "en": "In the Chinese lunar calendar, Start of Autumn means the end of summer and the beginning of autumn.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2022·12·S1", "idx": 2, "cn": "立秋带来的首先是天气的变化，气温逐渐下降。", "en": "What Start of Autumn brings first is a change in the weather, as temperatures gradually drop.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2022·12·S1", "idx": 3, "cn": "人们看到树叶开始变黄飘落时，知道秋天已经来临，这就是所谓的“一叶知秋”。", "en": "When people see the leaves begin to turn yellow and fall, they know autumn has arrived; this is the so-called \"one falling leaf heralds the coming of autumn\".", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2022·12·S1", "idx": 4, "cn": "但此时酷热的天气并未完全结束，高温通常还会持续一段时间，被称为“秋老虎”。", "en": "But the hot weather is not yet completely over; the high temperatures usually last for some time and are known as the \"Autumn Tiger\".", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2022·12·S1", "idx": 5, "cn": "立秋对农民意义重大，这时各种秋季作物迅速生长、开始成熟，收获的季节即将到来。", "en": "Start of Autumn is of great significance to farmers; at this time, various autumn crops grow rapidly and begin to ripen, and the harvest season is approaching.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2022·12·S3", "idx": 1, "cn": "冬至(Winter Solstice)是全年白昼最短、黑夜最长的一天，标志着一年中最寒冷时节的开始。", "en": "Winter Solstice is the shortest day and the longest night of the year, marking the beginning of the coldest season of the year.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2022·12·S3", "idx": 2, "cn": "冬至过后，气温越来越低，人们的户外活动逐渐减少。", "en": "After Winter Solstice, temperatures drop lower and lower, and people's outdoor activities gradually decrease.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2022·12·S3", "idx": 3, "cn": "农民地里活儿不多，主要忙于灌溉系统的维护和农作物的防冻，同时为来年春天播种做准备。", "en": "Farmers have little work in the fields; they are mainly busy with the maintenance of irrigation systems and the frost protection of crops, and are also preparing for spring sowing the following year.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2022·12·S3", "idx": 4, "cn": "中国人历来很重视冬至，许多地方都把冬至当作一个节日，庆祝方式各地不尽相同。", "en": "Chinese people have always attached great importance to Winter Solstice; in many places it is treated as a festival, and the ways of celebration vary from place to place.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2022·12·S3", "idx": 5, "cn": "北方人有冬至吃饺子(jiaozi)的习俗，南方人有冬至吃汤圆(tangyuan)的传统。", "en": "People in the north have the custom of eating jiaozi on Winter Solstice, while people in the south have the tradition of eating tangyuan.", "cls": "B", "sid": "u2_s3", "pid": "u2_s3_p5", "sec": "春节的活动", "cov": 0.333, "hits": []}, {"ch": 7, "set": "CET4 2024·06·S2", "idx": 1, "cn": "农历 (the lunar calendar) 起源于数千年前的中国，根据太阳和月亮的运行规律制定。", "en": "The lunar calendar originated in China thousands of years ago and was formulated according to the movements of the sun and the moon.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2024·06·S2", "idx": 2, "cn": "长期以来，农历在农业生产和人们日常生活中发挥着重要作用。", "en": "For a long time, the lunar calendar has played an important role in agricultural production and people's daily life.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2024·06·S2", "idx": 3, "cn": "古人依据农历记录日期、安排农活，以便最有效地利用自然资源和气候条件，提高农作物的产量和质量。", "en": "The ancients recorded dates and arranged farm work according to the lunar calendar so as to make the most effective use of natural resources and climatic conditions and improve the yield and quality of crops.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2024·06·S2", "idx": 4, "cn": "中国的春节、中秋节等传统节日的日期都基于农历。", "en": "The dates of traditional Chinese festivals such as the Spring Festival and the Mid-Autumn Festival are all based on the lunar calendar.", "cls": "A", "sid": "u2_s1", "pid": "u2_s1_p1", "sec": "春节", "cov": 0.32, "hits": ["春节", "传统节日"]}, {"ch": 7, "set": "CET4 2024·06·S2", "idx": 5, "cn": "农历是中国传统文化的重要组成部分，当今依然广为使用。", "en": "The lunar calendar is an important part of traditional Chinese culture and is still widely used today.", "cls": "B", "sid": "u2_s1", "pid": "u2_s1_p1", "sec": "春节", "cov": 0.237, "hits": []}, {"ch": 7, "set": "CET4 2024·06·S3", "idx": 1, "cn": "汉语中的“福”字 (the character fu) 表示幸福和好运，是中国传统文化中最常用的吉祥 (auspicious)符号之一。", "en": "The Chinese character \"fu\" in Chinese means happiness and good luck, and is one of the most commonly used auspicious symbols in traditional Chinese culture.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2024·06·S3", "idx": 2, "cn": "人们通常将一个大大的福字写在红纸上，寓意期盼家庭幸福、社会安定、国家昌盛。", "en": "People usually write a big \"fu\" character on red paper, symbolizing the hope for family happiness, social stability and national prosperity.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2024·06·S3", "idx": 3, "cn": "春节贴福字是民间由来已久的习俗。", "en": "Pasting the \"fu\" character during the Spring Festival is a long-standing folk custom.", "cls": "B", "sid": "u2_s3", "pid": "u2_s3_p10", "sec": "春节的活动", "cov": 0.214, "hits": ["春节"]}, {"ch": 7, "set": "CET4 2024·06·S3", "idx": 4, "cn": "为了欢庆春节，家家户户都会将福字贴在门上或墙上，表达对幸福生活的向往、对美好未来的期待。", "en": "To celebrate the Spring Festival, every household pastes the \"fu\" character on the door or wall, expressing their yearning for a happy life and their expectation of a bright future.", "cls": "B", "sid": "u2_s2", "pid": "u2_s2_p5", "sec": "春节的传说", "cov": 0.154, "hits": ["家家户户"]}, {"ch": 7, "set": "CET4 2024·06·S3", "idx": 5, "cn": "人们有时还将福字倒过来贴，表示幸福已到、好运已到。", "en": "People sometimes paste the \"fu\" character upside down, indicating that good fortune and good luck have arrived.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET6 2022·09·S1", "idx": 1, "cn": "贴春联(Spring Festival couplets)是中国人欢度春节的一个重要习俗。", "en": "Pasting Spring Festival couplets is an important custom for Chinese people to celebrate the Spring Festival.", "cls": "A", "sid": "u2_s3", "pid": "u2_s3_p6", "sec": "春节的活动", "cov": 0.412, "hits": ["春节", "欢度春节"]}, {"ch": 7, "set": "CET6 2022·09·S1", "idx": 2, "cn": "春联由一对诗句和四字横批(horizontal scroll)组成，诗句和横批用金色或黑色写在红纸上，红色代表幸运，金色代表财富。", "en": "Spring Festival couplets are composed of a pair of poetic lines and a four-character horizontal scroll, which are written on red paper in gold or black; red represents good luck and gold represents wealth.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET6 2022·09·S1", "idx": 3, "cn": "春联贴在大门左右两侧和门框上方。", "en": "Spring Festival couplets are pasted on both sides of the front gate and above the door frame.", "cls": "B", "sid": "u2_s3", "pid": "u2_s3_p4", "sec": "春节的活动", "cov": 0.214, "hits": []}, {"ch": 7, "set": "CET6 2022·09·S1", "idx": 4, "cn": "春联的诗句体现中国传统诗词的特点，两句诗的字数相同、内容相关。", "en": "The poetic lines of Spring Festival couplets reflect the characteristics of traditional Chinese poetry: the two lines have the same number of characters and are related in content.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET6 2022·09·S1", "idx": 5, "cn": "横批凸显春联的主题，更是锦上添花。", "en": "The horizontal scroll highlights the theme of the couplets and even adds a finishing touch.", "cls": "B", "sid": "u2_s2", "pid": "u2_s2_p5", "sec": "春节的传说", "cov": 0.091, "hits": ["春联"]}, {"ch": 7, "set": "CET6 2022·09·S1", "idx": 6, "cn": "春联以简洁的文字描绘生动的形象，抒发美好的愿望。", "en": "Spring Festival couplets use concise words to depict vivid images and express beautiful wishes.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET6 2022·09·S1", "idx": 7, "cn": "当家家户户贴春联时，人们就会意识到春节已经正式拉开序幕。", "en": "When every household pastes Spring Festival couplets, people realize that the Spring Festival has officially begun.", "cls": "A", "sid": "u2_s2", "pid": "u2_s2_p5", "sec": "春节的传说", "cov": 0.26, "hits": ["春联", "家家户户"]}, {"ch": 7, "set": "CET4 2019·06·S2", "idx": 1, "cn": "灯笼起源于东汉，最初主要用于照明。", "en": "Lanterns originated in the Eastern Han Dynasty and were initially used mainly for illumination.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2019·06·S2", "idx": 2, "cn": "在唐代，人们用红灯笼来庆祝安定的生活。", "en": "In the Tang Dynasty, people used red lanterns to celebrate a stable life.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2019·06·S2", "idx": 3, "cn": "从那时起，灯笼在中国的许多地方流行起来。", "en": "From then on, lanterns became popular in many parts of China.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2019·06·S2", "idx": 4, "cn": "灯笼通常用色彩鲜艳的薄纸，形状和尺寸各异。", "en": "Lanterns are usually made of thin, brightly colored paper and come in various shapes and sizes.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2019·06·S2", "idx": 5, "cn": "在中国传统文化中，红灯笼象征生活美满和生意兴隆，通常在春节、元宵节和国庆等节日期间悬挂。", "en": "In traditional Chinese culture, red lanterns symbolize a happy life and a thriving business, and are usually hung during festivals such as the Spring Festival, the Lantern Festival and National Day.", "cls": "B", "sid": "u2_s9", "pid": "u2_s9_p5", "sec": "屈原与端午节", "cov": 0.154, "hits": ["节日期间"]}, {"ch": 7, "set": "CET4 2019·06·S2", "idx": 6, "cn": "如今，世界上许多其他地方也能看到红灯笼。", "en": "Today, red lanterns can also be seen in many other parts of the world.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2016·12·S1", "idx": 1, "cn": "在中国文化中，红色通常象征着好运、长寿和幸福。", "en": "In Chinese culture, red usually symbolizes good luck, longevity and happiness.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2016·12·S1", "idx": 2, "cn": "在春节和其他喜庆场合，红色到处可见。", "en": "During the Spring Festival and other festive occasions, red can be seen everywhere.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2016·12·S1", "idx": 3, "cn": "人们把现金作为礼物送给家人或亲密朋友时，通常放在红信封里。", "en": "When people give cash as a gift to family members or close friends, it is usually put in a red envelope.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2016·12·S1", "idx": 4, "cn": "红色在中国流行的另一个原因是人们把它与中国革命和共产党相联系。", "en": "Another reason why red is popular in China is that people associate it with the Chinese revolution and the Communist Party.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2016·12·S1", "idx": 5, "cn": "然而，红色并不总是代表好运和快乐。", "en": "However, red does not always represent good luck and happiness.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 7, "set": "CET4 2016·12·S1", "idx": 6, "cn": "因为从前死者的名字常用红色书写，用红墨水书写中国人名被看成是一种冒犯行为。", "en": "Because the names of the dead used to be written in red, writing a Chinese name in red ink is regarded as an offense.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2013·12·S1", "idx": 1, "cn": "许多人喜欢中餐。", "en": "Many people like Chinese food.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2013·12·S1", "idx": 2, "cn": "在中国，烹饪不仅被视为一种技能，而且也被视为一种艺术。", "en": "In China, cooking is regarded not only as a skill but also as an art.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2013·12·S1", "idx": 3, "cn": "精心准备的中餐既可口又好看。", "en": "A well-prepared Chinese meal is both delicious and good-looking.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2013·12·S1", "idx": 4, "cn": "烹饪技艺和配料在中国各地差别很大。", "en": "Cooking techniques and ingredients vary greatly from region to region across China.", "cls": "B", "sid": "u2_s2", "pid": "u2_s2_p1", "sec": "烹饪方法", "cov": 0.267, "hits": []}, {"ch": 8, "set": "CET4 2013·12·S1", "idx": 5, "cn": "但好的烹饪都有一个共同点，总是要考虑到颜色、味道、口感和营养(nutrition)。", "en": "But all good cooking shares one thing in common: it always takes color, taste, texture and nutrition into account.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2013·12·S1", "idx": 6, "cn": "由于食物对健康至关重要，好的厨师总是努力在谷物、肉类和蔬菜之间取得平衡，所以中餐既味美又健康。", "en": "Since food is vital to health, good chefs always strive to strike a balance among grains, meat and vegetables, so Chinese food is both delicious and healthy.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2013·12·S3", "idx": 1, "cn": "“你要茶还是要咖啡？”是用餐人常被问到的问题。", "en": "\"Would you like tea or coffee?\" is a question often asked of diners.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2013·12·S3", "idx": 2, "cn": "许多西方人会选咖啡，而中国人则会选茶。", "en": "Many Westerners choose coffee, while Chinese people choose tea.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2013·12·S3", "idx": 3, "cn": "相传，中国的一位帝王于五千多年前发现了茶，并用来治病。", "en": "It is said that an ancient Chinese emperor discovered tea more than five thousand years ago and used it to treat illnesses.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2013·12·S3", "idx": 4, "cn": "在明清（the Ming and Qing Dynasties）期间，茶馆遍布全国。", "en": "During the Ming and Qing Dynasties, teahouses could be found all over the country.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2013·12·S3", "idx": 5, "cn": "饮茶在六世纪传到日本，但直到十七、十八世纪才传到欧美。", "en": "Tea drinking spread to Japan in the sixth century, but it did not reach Europe and America until the 17th and 18th centuries.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2013·12·S3", "idx": 6, "cn": "如今，茶是世界上最流行的饮料（beverage）之一。", "en": "Today, tea is one of the most popular beverages in the world.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2013·12·S3", "idx": 7, "cn": "茶是中国的民族饮品，也是中国传统和文化的重要组成部分。", "en": "Tea is China's national beverage and an important part of Chinese tradition and culture.", "cls": "B", "sid": "u6_s0", "pid": "u6_s0_p1", "sec": "中国酒", "cov": 0.273, "hits": []}, {"ch": 8, "set": "CET4 2015·06·S3", "idx": 1, "cn": "在西方人心目中，和中国联系最为密切的基本食物是大米。", "en": "In the eyes of Westerners, rice is the basic food most closely associated with China.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2015·06·S3", "idx": 2, "cn": "长期以来，大米在中国人的饮食中占据很重要的地位，以至于有谚语说“巧妇难为无米之炊”。", "en": "For a long time, rice has occupied such an important place in the Chinese diet that there is a saying, \"Even the cleverest housewife cannot cook a meal without rice.\"", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2015·06·S3", "idx": 3, "cn": "中国南方大多种植水稻，人们通常以大米为主食；而华北大部分地区因为过于寒冷或过于干燥,无法种植水稻，那里的主要作物是小麦。", "en": "Rice is widely grown in southern China, where people usually take rice as their staple food; in most parts of North China, however, rice cannot be grown because it is too cold or too dry, so the main crop there is wheat.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2015·06·S3", "idx": 4, "cn": "在中国，有些人用面粉做面包,但大多数人用面粉做馒头和面", "en": "In China, some people make bread from flour, but most people use flour to make steamed buns and noodles.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·07·S1", "idx": 1, "cn": "在中国，火锅已有2，000多年的历史，最早流行于最寒冷的地区，然后在很多地区盛行，出现了具有地方特色的种类。", "en": "In China, hot pot has a history of more than 2,000 years. It first became popular in the coldest regions and then spread widely across many areas, giving rise to varieties with local characteristics.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·07·S1", "idx": 2, "cn": "吃火锅时，家人和朋友围坐在桌边，桌子中间放着热腾腾的火锅。", "en": "When eating hot pot, family members and friends sit around a table with a steaming hot pot in the middle.", "cls": "B", "sid": "u3_s2", "pid": "u3_s2_p3", "sec": "川菜", "cov": 0.062, "hits": ["火锅"]}, {"ch": 8, "set": "CET4 2020·07·S1", "idx": 3, "cn": "吃火锅时，人们可以根据自己的口味放肉、海鲜、蔬菜和其他配料，自己烹饪。", "en": "When eating hot pot, people can add meat, seafood, vegetables and other ingredients according to their own taste, and cook the food themselves.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·07·S1", "idx": 4, "cn": "人们可以一边尽情地聊天，一边享受美餐。", "en": "People can chat to their heart's content while enjoying a delicious meal.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S1", "idx": 1, "cn": "茅台（Moutai)是中国最有名的白酒，在新中国成立前夕，被选为国宴用酒。", "en": "Moutai is China's most famous baijiu and, on the eve of the founding of New China, was chosen as the liquor for state banquets.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S1", "idx": 2, "cn": "据说赤水沿岸的村民四千年前就开始酿造茅台。", "en": "It is said that villagers along the Chishui River began to brew Moutai four thousand years ago.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S1", "idx": 3, "cn": "在西汉时期，那里的人们生产出了高质量的茅台，并把它贡给皇帝。", "en": "During the Western Han Dynasty, the people there produced high-quality Moutai and presented it to the emperor as tribute.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S1", "idx": 4, "cn": "自唐朝开始，这种地方酒通过海上丝绸之路运往海外。", "en": "Starting in the Tang Dynasty, this local liquor was shipped overseas along the Maritime Silk Road.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S1", "idx": 5, "cn": "茅台味道柔和，有一种特殊的香味；适量饮用可以帮助缓解疲劳，有镇静作用，因而广受国内夕消费者的喜爱。", "en": "Moutai has a mild taste and a distinctive aroma; when drunk in moderation, it can help relieve fatigue and has a calming effect, so it is widely loved by domestic consumers.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S2", "idx": 1, "cn": "茶拥有5,000年的历史。", "en": "Tea has a history of 5,000 years.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S2", "idx": 2, "cn": "传说，神农氏(Shen Nong)喝开水时，几片野树叶子落进壶里，开水顿时散发出宜人的香味。", "en": "Legend has it that when Shen Nong was drinking boiled water, a few wild leaves fell into the pot, and the water immediately gave off a pleasant fragrance.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S2", "idx": 3, "cn": "他喝了几口，觉得很提神。", "en": "He drank a few mouthfuls and found it very refreshing.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S2", "idx": 4, "cn": "茶就这样发现了。", "en": "And so tea was discovered.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S2", "idx": 5, "cn": "自此，茶在中国开始流行。", "en": "Since then, tea has become popular in China.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S2", "idx": 6, "cn": "茶园遍布全国，茶商变得富有。", "en": "Tea plantations spread across the country, and tea merchants grew rich.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S2", "idx": 7, "cn": "昂贵、雅致的茶具成了地位的象征。", "en": "Expensive and elegant tea sets became a symbol of status.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S2", "idx": 8, "cn": "今天，茶不仅是一种健康的饮品，而且是中国文化的一个组成部分。", "en": "Today, tea is not only a healthy beverage but also an integral part of Chinese culture.", "cls": "B", "sid": "u6_s0", "pid": "u6_s0_p1", "sec": "中国酒", "cov": 0.269, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S2", "idx": 9, "cn": "越来越多的国际游客一边品茶，一边了解中国文化。", "en": "More and more international tourists learn about Chinese culture while savoring tea.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S3", "idx": 1, "cn": "你如果到北京旅游，必须做两件事：一件是登长城，另一件是吃北京烤鸭。", "en": "If you travel to Beijing, you must do two things: climb the Great Wall and eat Beijing Roast Duck.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S3", "idx": 2, "cn": "闻名遐迩的北京烤鸭曾仅限于宫廷，而现在北京数百家餐厅均有供应。", "en": "The world-renowned Beijing Roast Duck was once served only in the imperial court, but now it is available at hundreds of restaurants in Beijing.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S3", "idx": 3, "cn": "北京烤鸭源于600年前的明代。", "en": "Beijing Roast Duck dates back to the Ming Dynasty, more than 600 years ago.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S3", "idx": 4, "cn": "来自全国各地的厨师被挑选出来到京城为皇帝做饭。", "en": "Chefs from all over the country were selected to cook for the emperor in the capital.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S3", "idx": 5, "cn": "人们认为在皇宫做饭是一种莫大的荣誉，只有厨艺出众者才能获得这份工作。", "en": "People considered it a great honor to cook in the imperial palace, and only those with outstanding cooking skills could obtain the job.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·09·S3", "idx": 6, "cn": "事实上，正是这些宫廷厨师使北京烤鸭的烹饪艺术日臻完善。", "en": "In fact, it was these imperial chefs who brought the art of cooking Beijing Roast Duck to perfection.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·12·S1", "idx": 1, "cn": "生活在中国不同地区的人们饮食多种多样。", "en": "People living in different parts of China enjoy a wide variety of foods.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·12·S1", "idx": 2, "cn": "北方人主要吃面食，南方人大多吃米饭。", "en": "Northerners mainly eat wheat-based food, while Southerners mostly eat rice.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·12·S1", "idx": 3, "cn": "在沿海地区，海鲜和淡水水产品在人们饮食中占有相当大的比例，而在其他地区人们的饮食中，肉类和奶制品更为常见。", "en": "In coastal areas, seafood and freshwater products account for a fairly large proportion of people's diet, while in other areas meat and dairy products are more common.", "cls": "B", "sid": "u3_s0", "pid": "u3_s0_p1", "sec": "八大菜系", "cov": 0.205, "hits": ["沿海地区"]}, {"ch": 8, "set": "CET4 2020·12·S1", "idx": 4, "cn": "四川、湖南等省份的居民普遍爱吃辛辣食物，而江苏和浙江人更喜欢甜食。", "en": "Residents of provinces like Sichuan and Hunan generally love spicy food, while people in Jiangsu and Zhejiang prefer sweet food.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2020·12·S1", "idx": 5, "cn": "然而，因为烹饪方式各异，同类食物的味道可能会有所不同。", "en": "However, because cooking methods vary, the taste of the same kind of food may differ.", "cls": "B", "sid": "u2_s4", "pid": "u2_s4_p1", "sec": "平衡之道", "cov": 0.261, "hits": []}, {"ch": 8, "set": "CET4 2021·06·S1", "idx": 1, "cn": "铁观音(Tieguanyin)是中国最受欢迎的茶之一,原产于福建省安溪县西坪镇，如今安溪全县普遍种植，但该县不同地区生产的铁观音又各具风味。", "en": "Tieguanyin is one of the most popular teas in China. It originated in Xiping Town, Anxi County, Fujian Province, and is now widely grown throughout Anxi County, though Tieguanyin produced in different parts of the county has its own distinctive flavor.", "cls": "B", "sid": "u5_s5", "pid": "u5_s5_p3", "sec": "乌龙茶", "cov": 0.16, "hits": ["铁观音"]}, {"ch": 8, "set": "CET4 2021·06·S1", "idx": 2, "cn": "铁观音一年四季均可采摘，尤以春秋两季采摘的茶叶品质最佳。", "en": "Tieguanyin can be picked all year round, and the tea picked in spring and autumn is of the best quality.", "cls": "B", "sid": "u5_s5", "pid": "u5_s5_p3", "sec": "乌龙茶", "cov": 0.103, "hits": ["铁观音"]}, {"ch": 8, "set": "CET4 2021·06·S1", "idx": 3, "cn": "铁观音的加工非常复杂，需要专门的技术和丰富的经验。", "en": "The processing of Tieguanyin is very complex and requires specialized skills and rich experience.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2021·06·S1", "idx": 4, "cn": "铁观音含有多种维生素，喝起来口感独特。", "en": "Tieguanyin contains various vitamins and has a unique taste.", "cls": "A", "sid": "u5_s7", "pid": "u5_s7_p2", "sec": "黑茶", "cov": 0.312, "hits": ["维生素"]}, {"ch": 8, "set": "CET4 2021·06·S1", "idx": 5, "cn": "常饮铁观音有助于预防心脏病、降低血压、增强记忆力。", "en": "Drinking Tieguanyin regularly helps prevent heart disease, lower blood pressure and improve memory.", "cls": "B", "sid": "u5_s5", "pid": "u5_s5_p3", "sec": "乌龙茶", "cov": 0.115, "hits": ["铁观音"]}, {"ch": 8, "set": "CET4 2021·06·S2", "idx": 1, "cn": "普洱(Pu'er)茶深受中国人喜爱。", "en": "Pu'er tea is deeply loved by Chinese people.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2021·06·S2", "idx": 2, "cn": "最好的普洱茶产自云南的西双版纳（Xishuangbanna)，那里的气候和环境为普洱茶树的生长提供了最佳条件。", "en": "The best Pu'er tea comes from Xishuangbanna in Yunnan, where the climate and environment provide the best conditions for the growth of Pu'er tea trees.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2021·06·S2", "idx": 3, "cn": "普洱茶颜色较深，味道与其他许多茶截然不同。", "en": "Pu'er tea has a relatively dark color and a taste quite different from many other teas.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2021·06·S2", "idx": 4, "cn": "普洱茶泡（brew)的时间越长越有味道。", "en": "The longer Pu'er tea is brewed, the more flavorful it becomes.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2021·06·S2", "idx": 5, "cn": "许多爱喝茶的人尤其喜欢其独特的香味和口感。", "en": "Many tea lovers especially enjoy its unique aroma and taste.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2021·06·S2", "idx": 6, "cn": "普洱茶含有多种有益健康的元素，常饮普洱茶有助于保护心脏和血管，还有减肥、消除疲劳和促进消化的功效。", "en": "Pu'er tea contains various elements beneficial to health. Drinking it regularly helps protect the heart and blood vessels, and also has the effects of losing weight, relieving fatigue and promoting digestion.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2021·06·S3", "idx": 1, "cn": "龙井(Longjing)是一种绿茶，主要产自中国东部沿海的浙江省。", "en": "Longjing is a kind of green tea, mainly produced in Zhejiang Province on China's eastern coast.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2021·06·S3", "idx": 2, "cn": "龙井茶独特的香味和口感为其赢得了“中国名茶”的称号，在中国深受大众的欢迎，在海外饮用的人也越来越多。", "en": "The unique aroma and taste of Longjing tea have earned it the title of \"a famous Chinese tea\". It is deeply loved by the Chinese public, and is being drunk by more and more people overseas.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2021·06·S3", "idx": 3, "cn": "龙井茶通常手工制作，其价格可能极其昂贵，也可能比较便宜，这取决于茶的生长地、采摘时间和制作工艺。", "en": "Longjing tea is usually handmade. Its price may be extremely high or fairly low, depending on where the tea is grown, when it is picked and how it is processed.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2021·06·S3", "idx": 4, "cn": "龙井茶富含维生素C和其他多种有益健康的元素。", "en": "Longjing tea is rich in vitamin C and many other elements beneficial to health.", "cls": "B", "sid": "u5_s7", "pid": "u5_s7_p2", "sec": "黑茶", "cov": 0.211, "hits": ["维生素"]}, {"ch": 8, "set": "CET4 2021·06·S3", "idx": 5, "cn": "经常喝龙井茶有助于减轻疲劳、延缓衰老。", "en": "Drinking Longjing tea regularly helps reduce fatigue and delay aging.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET6 2015·06·S1", "idx": 1, "cn": "中国传统的待客之道要求饭菜丰富多样，让客人吃不完。", "en": "The traditional Chinese way of entertaining guests requires a rich and varied spread of dishes, with more food than the guests can finish.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET6 2015·06·S1", "idx": 2, "cn": "中国宴席上典型的菜单包括开席的一套凉菜及其后的热菜，例如肉类、鸡鸭、蔬菜等。", "en": "A typical menu at a Chinese banquet includes a set of cold dishes to start with, followed by hot dishes such as meat, chicken and duck, and vegetables.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET6 2015·06·S1", "idx": 3, "cn": "大多数宴席上，全鱼被认为是必不可少的，除非已经上过各式海鮮。", "en": "At most banquets, a whole fish is considered essential unless various kinds of seafood have already been served.", "cls": "B", "sid": "u5_s8", "pid": "u5_s8_p6", "sec": "茶文化", "cov": 0.192, "hits": ["必不可少"]}, {"ch": 8, "set": "CET6 2015·06·S1", "idx": 4, "cn": "如今，中国人喜欢把西方特色菜与传统中式菜肴融于一席，因此牛排上桌也不少见。", "en": "Today, Chinese people like to combine Western specialties with traditional Chinese dishes at one table, so it is not uncommon for steak to be served.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET6 2015·06·S1", "idx": 5, "cn": "沙拉也已流行起来，尽管传统上中国人一般不吃任何未经烹饪的菜肴。", "en": "Salad has also become popular, although traditionally Chinese people generally do not eat any uncooked dishes.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET6 2015·06·S1", "idx": 6, "cn": "宴席通常至少有一道汤，可以最先或最后上桌。", "en": "A banquet usually has at least one soup, which can be served first or last.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET6 2015·06·S1", "idx": 7, "cn": "甜点和水果通常标志宴席的结束。", "en": "Desserts and fruit usually mark the end of a banquet.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2023·12·S1", "idx": 1, "cn": "中国政府十分重视人民的健康饮食 (diet)。", "en": "The Chinese government attaches great importance to people's healthy diet.", "cls": "B", "sid": "u2_s5", "pid": "u2_s5_p1", "sec": "食疗", "cov": 0.286, "hits": []}, {"ch": 8, "set": "CET4 2023·12·S1", "idx": 2, "cn": "通过大力提倡健康饮食，人们对合理营养增进健康的重要性有了更加深刻的认识。", "en": "By vigorously promoting a healthy diet, people have gained a deeper understanding of the importance of balanced nutrition to health.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2023·12·S1", "idx": 3, "cn": "“吃得安全、吃得营养、吃得健康”是人民对美好生活的基本需要，是提升人民幸福感的必然要求，也为食品产业的发展提供了新机遇。", "en": "\"Eating safely, eating nutritionally and eating healthily\" is a basic need of the people for a better life, an inevitable requirement for enhancing their sense of happiness, and a new opportunity for the development of the food industry.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2023·12·S1", "idx": 4, "cn": "目前，各级政府都在采取多种举措确保人民饮食健康，推进健康中国的建设。", "en": "At present, governments at all levels are taking various measures to ensure people's healthy diet and advance the building of a Healthy China.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2023·12·S3", "idx": 1, "cn": "改革开放以来，中国人的饮食 (diet) 发生了显著变化。", "en": "Since the reform and opening up, significant changes have taken place in the Chinese diet.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2023·12·S3", "idx": 2, "cn": "过去由于经济落后，食品种类有限、数量不足，人们仅仅满足于吃得饱。", "en": "In the past, because the economy was backward, food was limited in variety and insufficient in quantity, and people were merely content with having enough to eat.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2023·12·S3", "idx": 3, "cn": "如今中国经济快速发展，食品不仅更加丰富多样，质量也大幅提高。", "en": "Today, with China's rapid economic development, food is not only more varied but also much better in quality.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2023·12·S3", "idx": 4, "cn": "随着生活水平不断提升，人们对饮食的要求起来越高，更加注重吃得营养健康。", "en": "As living standards keep rising, people have ever higher demands for their diet and pay more attention to eating nutritionally and healthily.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 8, "set": "CET4 2023·12·S3", "idx": 5, "cn": "因此，目前市场上推出的低脂、低糖、有机食品受到人们的普遍欢迎。", "en": "Therefore, the low-fat, low-sugar and organic foods now available on the market are widely welcomed by people.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 9, "set": "CET6 2016·06·S2", "idx": 1, "cn": "旗袍（qipao）是一种雅致的中国服装，源于中国的满族（Manchu Nationality） 。", "en": "The qipao is an elegant type of Chinese dress that originated from the Manchu Nationality in China.", "cls": "A", "sid": "u4_s2", "pid": "u4_s2_p2", "sec": "旗袍", "cov": 0.432, "hits": ["满族"]}, {"ch": 9, "set": "CET6 2016·06·S2", "idx": 2, "cn": "在清代，旗袍是王室女性穿着的宽松长袍。", "en": "During the Qing Dynasty, the qipao was a loose long gown worn by royal women.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 9, "set": "CET6 2016·06·S2", "idx": 3, "cn": "上世纪 20 年代，受西方服饰影响，旗袍发生了一些变化。", "en": "In the 1920s, under the influence of Western clothing, the qipao underwent some changes.", "cls": "B", "sid": "u2_s2", "pid": "u2_s2_p20", "sec": "不同时期的服饰", "cov": 0.45, "hits": []}, {"ch": 9, "set": "CET6 2016·06·S2", "idx": 4, "cn": "袖口（cuffs）变窄，袍身变短。", "en": "The cuffs became narrower and the body of the gown became shorter.", "cls": "B", "sid": "u2_s2", "pid": "u2_s2_p4", "sec": "不同时期的服饰", "cov": 0.143, "hits": ["袖口"]}, {"ch": 9, "set": "CET6 2016·06·S2", "idx": 5, "cn": "这些变化使女性美得以充分展现。", "en": "These changes gave full expression to the beauty of women.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 9, "set": "CET6 2016·06·S2", "idx": 6, "cn": "如今，旗袍经常出现在世界级的时装秀上。", "en": "Today, the qipao often appears at world-class fashion shows.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 9, "set": "CET6 2016·06·S2", "idx": 7, "cn": "中国女性出席重要社交聚会时，旗袍往往是她们的首选。", "en": "When Chinese women attend important social gatherings, the qipao is often their first choice.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 9, "set": "CET6 2016·06·S2", "idx": 8, "cn": "很多中国新娘也会选择旗袍作为结婚礼服。", "en": "Many Chinese brides also choose the qipao as their wedding dress.", "cls": "B", "sid": "u4_s2", "pid": "u4_s2_p5", "sec": "旗袍", "cov": 0.255, "hits": []}, {"ch": 9, "set": "CET6 2016·06·S2", "idx": 9, "cn": "一些有影响的人士甚至建议将旗袍作为中国女性的民族服饰。", "en": "Some influential figures have even suggested that the qipao be regarded as the national dress of Chinese women.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2013·12·S2", "idx": 1, "cn": "中国园林(the Chinese garden)是经过三千多年演变而成的独具一格的园林景观(landscape)。", "en": "The Chinese garden is a unique garden landscape that has evolved over more than 3,000 years.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2013·12·S2", "idx": 2, "cn": "它既包括为皇室成员享乐而建造的大型花园，也包括学者、商人和卸任的政府官员为摆脱嘈杂的外部世界而建造的私家花园。", "en": "It includes both large gardens built for the enjoyment of members of the royal family and private gardens built by scholars, merchants and retired government officials to escape the noisy outside world.", "cls": "B", "sid": "u2_s7", "pid": "u2_s7_p2", "sec": "皇家建筑", "cov": 0.065, "hits": ["皇室成员"]}, {"ch": 10, "set": "CET6 2013·12·S2", "idx": 3, "cn": "这些花园构成了一种意在表达人与自然之间应有的和谐关系的微缩景观。", "en": "These gardens form a kind of miniature landscape intended to express the harmony that should exist between humanity and nature.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2013·12·S2", "idx": 4, "cn": "典型的中国园林四周有围墙，园内有池塘、假山(rockwork)、树木、花草以及各种各样由蜿蜒的小路和走廊连接的建筑。", "en": "A typical Chinese ga
