.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 11px;font-size:12px;color:#57606f;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ch);border-color:var(--ch);color:#fff;font-weight:600}

.stat{font-size:11.5px;color:var(--muted);white-space:nowrap}
main{flex:1;display:flex;min-height:0;position:relative}

canvas{display:block;width:100%;height:100%;cursor:grab}

#legend{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:11.5px;line-height:1.85;color:#57606f}

#legend .ln{display:inline-block;width:18px;height:0;border-top:2px solid;margin-right:5px;vertical-align:3px}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.92);padding:4px 12px;border-radius:20px;border:1px solid var(--line)}
aside{width:340px;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;flex:0 0 auto}
aside.hide{display:none}
.card{padding:13px 15px;border-bottom:1px solid var(--line)}
.card h3{margin:0 0 7px;font-size:13.5px}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:var(--muted)}
.kv b{color:var(--ink);font-weight:600}
.bar{height:6px;border-radius:3px;background:#eef0f4;overflow:hidden;margin:6px 0 9px;display:flex}
.bar i{display:block;height:100%}
.list{font-size:12px}
.list>div{padding:6px 0;border-bottom:1px dashed #eef0f4;cursor:pointer}
.list>div:hover{background:#f4f8fd}
.tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:4px;margin-right:5px;color:#fff}
.mini{font-size:11px;color:var(--muted)}
.sent{border-bottom:1px solid #f0f2f5;padding:7px 0;font-size:12px}
.sent .cn{color:var(--ink)}
.sent .en{color:#4a5361;margin-top:3px}
@media(max-width:820px){
  aside{position:absolute;right:0;top:0;bottom:0;width:86%;z-index:6;box-shadow:-4px 0 16px rgba(0,0,0,.1)}
  h1 small{display:none}
  input[type=search]{width:130px}
  #legend{display:none}
}
</style>

 "c12", "type": "chapter_link", "w": 1, "concept": 0, "set": 1}], "sents": [{"ch": 0, "set": "CET4 2014·12·S3", "idx": 1, "cn": "大熊猫(giant panda)是一种温顺的动物，长着独特的黑白皮毛。", "en": "The giant panda is a gentle animal with distinctive black-and-white fur.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2014·12·S3", "idx": 2, "cn": "因其数量极少，大熊猫已被列为濒危物种。", "en": "Because of its extremely small population, the giant panda has been listed as an endangered species.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2014·12·S3", "idx": 3, "cn": "大熊猫对于世界自然基金会(WWF)有着特殊意义。", "en": "The giant panda has a special significance for the World Wide Fund for Nature (WWF).", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2014·12·S3", "idx": 4, "cn": "自 1961 年该基金会成立以来，大熊猫就一直是它的徽标。", "en": "Since the fund was established in 1961, the giant panda has always been its logo.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2014·12·S3", "idx": 5, "cn": "大熊猫是熊科中最稀有的成员，主要生活在中国西南部的森林里。", "en": "The giant panda, the rarest member of the bear family, lives mainly in the forests of southwestern China.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2014·12·S3", "idx": 6, "cn": "目前,世界上大约有 1000 只大熊猫。", "en": "At present, there are about 1,000 giant pandas in the world.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2014·12·S3", "idx": 7, "cn": "这些以竹为食的动物正面临许多威胁。", "en": "These bamboo-eating animals are facing many threats.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2014·12·S3", "idx": 8, "cn": "因此，确保大熊猫的生存比以往更重要。", "en": "Therefore, ensuring the survival of the giant panda is more important than ever.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·06·S1", "idx": 1, "cn": "黄河是亚洲第三、世界第六长的河流。", "en": "The Yellow River is the third longest river in Asia and the sixth longest in the world.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·06·S1", "idx": 2, "cn": "“黄”这个字描述的是其河水浑浊的颜色。", "en": "The Chinese character huang ('yellow') describes the muddy color of its water.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·06·S1", "idx": 3, "cn": "黄河发源于青海，流经九个省份，最后注入渤海。", "en": "The Yellow River rises in Qinghai, flows through nine provinces and finally empties into the Bohai Sea.", "cls": "A", "sid": "u4_s3", "pid": "u4_s3_p4", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.52, "hits": ["黄河"]}, {"ch": 0, "set": "CET4 2017·06·S1", "idx": 4, "cn": "黄河是中国赖以生存的几条河流之一。", "en": "The Yellow River is one of the rivers on which China depends for its survival.", "cls": "A", "sid": "u4_s3", "pid": "u4_s3_p4", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.353, "hits": ["黄河"]}, {"ch": 0, "set": "CET4 2017·06·S1", "idx": 5, "cn": "黄河流域(river basin)是中国古代文明的诞生地，也是中国早期历史上最繁荣的地区。", "en": "The Yellow River basin, the cradle of ancient Chinese civilization, was also the most prosperous region in China's early history.", "cls": "B", "sid": "u4_s3", "pid": "u4_s3_p4", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.242, "hits": []}, {"ch": 0, "set": "CET4 2017·06·S1", "idx": 6, "cn": "然而，由于极具破坏力的洪水频发，黄河曾造成多次灾害。", "en": "However, because of frequent and highly destructive floods, the Yellow River has caused many disasters.", "cls": "B", "sid": "u4_s3", "pid": "u4_s3_p4", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.065, "hits": ["黄河"]}, {"ch": 0, "set": "CET4 2017·06·S1", "idx": 7, "cn": "在过去几十年里，政府采取了各种措施防止灾害发生。", "en": "Over the past few decades, the government has taken various measures to prevent disasters.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·06·S2", "idx": 1, "cn": "长江是亚洲最长、世界上第三长的河流。", "en": "The Yangtze River is the longest river in Asia and the third longest in the world.", "cls": "A", "sid": "u4_s3", "pid": "u4_s3_p3", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.62, "hits": ["长江"]}, {"ch": 0, "set": "CET4 2017·06·S2", "idx": 2, "cn": "长江流经多种不同的生态系统，是诸多濒危物种的栖息地，灌溉了中国五分之一的土地。", "en": "Flowing through a variety of ecosystems, the Yangtze River is the habitat of many endangered species and irrigates one fifth of China's land.", "cls": "B", "sid": "u4_s3", "pid": "u4_s3_p3", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.134, "hits": ["长江"]}, {"ch": 0, "set": "CET4 2017·06·S2", "idx": 3, "cn": "长江流域(river basin )居住着三分之一的人口。", "en": "The Yangtze River basin is home to one third of China's population.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·06·S2", "idx": 4, "cn": "长江在中国历史、文化和经济上起着很大的作用。", "en": "The Yangtze River plays a great role in China's history, culture and economy.", "cls": "B", "sid": "u4_s3", "pid": "u4_s3_p3", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.231, "hits": ["长江"]}, {"ch": 0, "set": "CET4 2017·06·S2", "idx": 5, "cn": "长江三角洲(delta)产出多达 20%的中国国民生产总值。", "en": "The Yangtze River Delta accounts for as much as 20% of China's GDP.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·06·S2", "idx": 6, "cn": "几千年来，长江一直被用于供水、运输和工业生产。", "en": "For thousands of years, the Yangtze River has been used for water supply, transportation and industrial production.", "cls": "B", "sid": "u4_s3", "pid": "u4_s3_p3", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.125, "hits": ["长江"]}, {"ch": 0, "set": "CET4 2017·06·S2", "idx": 7, "cn": "长江上还坐落着世界最大的水电站。", "en": "On the Yangtze River also stands the world's largest hydroelectric power station.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·06·S3", "idx": 1, "cn": "珠江是华南一大河系，流经广州市，是中国第三长的河流，仅次于长江和黄河。", "en": "The Pearl River, a major river system in South China, flows through the city of Guangzhou and is China's third longest river, after the Yangtze River and the Yellow River.", "cls": "A", "sid": "u4_s3", "pid": "u4_s3_p3", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.333, "hits": ["长江"]}, {"ch": 0, "set": "CET4 2017·06·S3", "idx": 2, "cn": "珠江三角洲（delta）是中国最发达的地区之一，面积约 11,000 平方公里。", "en": "The Pearl River Delta is one of the most developed regions in China, with an area of about 11,000 square kilometers.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·06·S3", "idx": 3, "cn": "它在面积和人口方面也是世界上最大的城市聚集区。", "en": "In terms of area and population, it is also the largest urban agglomeration in the world.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·06·S3", "idx": 4, "cn": "珠江三角洲九个最大城市共有 5,700 多万人口。", "en": "The nine largest cities in the Pearl River Delta have a combined population of more than 57 million.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·06·S3", "idx": 5, "cn": "上世纪 70 年代末中国改革开放以来，珠江三角洲已成为中国和世界主要经济区域和制造中心之一。", "en": "Since China launched reform and opening up in the late 1970s, the Pearl River Delta has become one of the major economic regions and manufacturing centers in China and the world.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·12·S1", "idx": 1, "cn": "泰山位于山东省西部。", "en": "Mount Tai is located in western Shandong Province.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·12·S1", "idx": 2, "cn": "海拔 1500 余米,方圆约 400 平方公里。", "en": "It rises more than 1,500 meters above sea level and covers an area of about 400 square kilometers.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·12·S1", "idx": 3, "cn": "泰山不仅雄伟壮观,而且是一座历史文化名山,过去3000 多年一直是人们前往朝拜的地方。", "en": "Mount Tai is not only majestic and spectacular but also a famous mountain of history and culture, and for more than 3,000 years it has been a place of pilgrimage.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·12·S1", "idx": 4, "cn": "据记载,共有 72 位帝王曾来此游览。", "en": "According to records, 72 emperors came here to visit the mountain.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·12·S1", "idx": 5, "cn": "许多作家到泰山获取灵感,写诗作文,艺术家也来此绘画。", "en": "Many writers came to Mount Tai for inspiration and wrote poems and essays, and artists also came here to paint.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·12·S1", "idx": 6, "cn": "山上因此留下了许许多多的文物古迹。", "en": "As a result, a great many cultural relics and historic sites have been left on the mountain.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·12·S1", "idx": 7, "cn": "泰山如今已成为中国一处主要的旅游景点。", "en": "Today Mount Tai has become a major tourist attraction in China.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·12·S3", "idx": 1, "cn": "黄山位于安徽省南部。", "en": "Mount Huangshan is located in southern Anhui Province.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·12·S3", "idx": 2, "cn": "它风景独特，尤以其日出和云海著称。", "en": "Its scenery is unique, and it is especially famous for its sunrises and seas of clouds.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·12·S3", "idx": 3, "cn": "要欣赏大山的宏伟壮丽，通常得向上看。", "en": "To appreciate the grandeur of great mountains, one usually has to look up.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·12·S3", "idx": 4, "cn": "但要欣赏黄山美景，得向下看。", "en": "But to enjoy the beautiful scenery of Mount Huangshan, one has to look down.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·12·S3", "idx": 5, "cn": "黄山的湿润气候有利于茶树生成，是中国主要产茶地之一。", "en": "The humid climate of Mount Huangshan is good for the growth of tea trees, making the mountain one of China's major tea-producing areas.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·12·S3", "idx": 6, "cn": "这里还有许多温泉，其泉水有助于防治皮肤病。", "en": "There are also many hot springs here, whose water helps prevent and treat skin diseases.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2017·12·S3", "idx": 7, "cn": "黄山是中国主要旅游目的地之一，也是摄影和传统国画最受欢迎的主题。", "en": "Mount Huangshan is one of China's major tourist destinations and also one of the most popular subjects for photography and traditional Chinese painting.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2021·12·S1", "idx": 1, "cn": "大运河（GrandCanal)是世界上最长的人工河，北起北京，南至杭州。", "en": "The Grand Canal, or the Beijing-Hangzhou Grand Canal, is the longest man-made river in the world, running from Beijing in the north to Hangzhou in the south.", "cls": "A", "sid": "u4_s3", "pid": "u4_s3_p6", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.47, "hits": ["大运河"]}, {"ch": 0, "set": "CET4 2021·12·S1", "idx": 2, "cn": "它是中国历史上最宏伟的工程之一。", "en": "It is one of the greatest projects in Chinese history.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2021·12·S1", "idx": 3, "cn": "大运河始建于公元前4世纪，公元13世纪末建成。", "en": "Construction of the Grand Canal began in the 4th century BC and was completed at the end of the 13th century AD.", "cls": "B", "sid": "u4_s3", "pid": "u4_s3_p6", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.153, "hits": ["大运河"]}, {"ch": 0, "set": "CET4 2021·12·S1", "idx": 4, "cn": "修建之初是为了运输粮食，后来也用于运输其他商品。", "en": "It was originally built to transport grain and later came to be used for transporting other goods as well.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2021·12·S1", "idx": 5, "cn": "大运河沿线区域逐渐发展成为中国的工商业中心。", "en": "The areas along the Grand Canal gradually developed into the industrial and commercial center of China.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET4 2021·12·S1", "idx": 6, "cn": "长久以来，大运河对中国的经济发展发挥了重要作用，有力地促进了南北地区之间的人员往来和文化交", "en": "For a long time, the Grand Canal has played an important role in China's economic development and has greatly promoted personnel exchanges and cultural exchanges between the north and the south.", "cls": "B", "sid": "u4_s3", "pid": "u4_s3_p7", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.187, "hits": ["大运河"]}, {"ch": 0, "set": "CET6 2015·06·S2", "idx": 1, "cn": "2011 年是中国城市化 (urbanization)进程中的历史性时刻，其城市人口首次超过农村人口。", "en": "2011 was a historic moment in China's urbanization, when the urban population exceeded the rural population for the first time.", "cls": "B", "sid": "u7_s0", "pid": "u7_s0_p2", "sec": "正文", "cov": 0.174, "hits": ["城市人口"]}, {"ch": 0, "set": "CET6 2015·06·S2", "idx": 2, "cn": "在未来 20 年里，预计约有 3.5 亿农村人口将移居到城市。", "en": "In the next 20 years, about 350 million rural people are expected to move to cities.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2015·06·S2", "idx": 3, "cn": "如此规模的城市发展对城市交通来说既是挑战，也是机遇。", "en": "Urban development on such a scale is both a challenge and an opportunity for urban transport.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2015·06·S2", "idx": 4, "cn": "中国政府一直提倡“以人为本”的发展理念，强调人们以公交而不是私家车出行。", "en": "The Chinese government has long advocated a people-oriented development philosophy, stressing that people should travel by public transport rather than by private car.", "cls": "B", "sid": "u7_s0", "pid": "u7_s0_p3", "sec": "正文", "cov": 0.149, "hits": ["中国政府"]}, {"ch": 0, "set": "CET6 2015·06·S2", "idx": 5, "cn": "它还号召建设“资源节约和环境友好型”社会。", "en": "It also calls for building a resource-conserving and environment-friendly society.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2015·06·S2", "idx": 6, "cn": "有了这个明确的目标，中国城市就可以更好地规划其发展，并把大量投资转向安全、清洁和经济型交通系统的发展上。", "en": "With this clear goal, Chinese cities can better plan their development and channel a large amount of investment into safe, clean and economical transport systems.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2015·06·S3", "idx": 1, "cn": "汉朝是中国历史上最重要的朝代之一。", "en": "The Han Dynasty is one of the most important dynasties in Chinese history.", "cls": "B", "sid": "u5_s0", "pid": "u5_s0_p9", "sec": "正文", "cov": 0.287, "hits": []}, {"ch": 0, "set": "CET6 2015·06·S3", "idx": 2, "cn": "汉朝统治期间有很多显著的成就。", "en": "During the Han Dynasty, there were many remarkable achievements.", "cls": "B", "sid": "u5_s0", "pid": "u5_s0_p7", "sec": "正文", "cov": 0.097, "hits": ["汉朝"]}, {"ch": 0, "set": "CET6 2015·06·S3", "idx": 3, "cn": "它最先向其他文化敞开大门，对外贸易兴旺。", "en": "It was the first to open its doors to other cultures, and its foreign trade flourished.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2015·06·S3", "idx": 4, "cn": "汉朝开拓的丝绸之路通向了中西亚乃至罗马。", "en": "The Silk Road opened up by the Han Dynasty led all the way to Central and Western Asia and even to Rome.", "cls": "B", "sid": "u5_s0", "pid": "u5_s0_p7", "sec": "正文", "cov": 0.076, "hits": ["汉朝"]}, {"ch": 0, "set": "CET6 2015·06·S3", "idx": 5, "cn": "各类艺术一派繁荣，涌现了很多文学、历史、哲学巨著。", "en": "The arts flourished, and many great works of literature, history and philosophy emerged.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2015·06·S3", "idx": 6, "cn": "公元 100 年中国第一部字典编撰完成，收入 9 000 个字，提供释义并列举不同的写法。", "en": "In 100 AD, China's first dictionary was completed, containing 9,000 characters with definitions and variant forms.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2015·06·S3", "idx": 7, "cn": "其间，科技方面也取得了很大进步，发明了纸张、水钟、日晷（sundials) 以及测量地震的仪器。", "en": "Meanwhile, great progress was also made in science and technology, with the invention of paper, water clocks, sundials and a device for measuring earthquakes.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2015·06·S3", "idx": 8, "cn": "汉朝历经 400 年，但统治者的腐败最终导致了它的灭亡。", "en": "The Han Dynasty lasted 400 years, but the corruption of its rulers eventually led to its downfall.", "cls": "B", "sid": "u5_s0", "pid": "u5_s0_p8", "sec": "正文", "cov": 0.12, "hits": ["汉朝", "灭亡"]}, {"ch": 0, "set": "CET6 2017·06·S1", "idx": 1, "cn": "明朝统治中国276年，被人们描绘成人类历史上治理有序、社会稳定的最伟大的时代之一。", "en": "The Ming Dynasty ruled China for 276 years and has been described as one of the greatest eras of orderly government and social stability in human history.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S1", "idx": 2, "cn": "这一时期，手工业的发展促进了市场经济和城市化。", "en": "During this period, the development of handicrafts promoted the market economy and urbanization.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S1", "idx": 3, "cn": "大量商品，包括酒和丝绸，都在市场销售。", "en": "A large number of goods, including wine and silk, were sold in the markets.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S1", "idx": 4, "cn": "同时，还进口许多外国商品，如时钟和烟草。", "en": "Meanwhile, many foreign goods, such as clocks and tobacco, were also imported.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S1", "idx": 5, "cn": "北京、南京、扬州、苏州这样的大商业中心相继形成。", "en": "Large commercial centers such as Beijing, Nanjing, Yangzhou and Suzhou emerged one after another.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S1", "idx": 6, "cn": "也是在明代，由郑和率领的船队曾到印度洋进行了七次大规模探险航行。", "en": "It was also in the Ming Dynasty that the fleets led by Zheng He made seven large-scale voyages of exploration to the Indian Ocean.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S1", "idx": 7, "cn": "还值得一提的是，中国文学的四大经典名著中有三部写于明代。", "en": "It is also worth mentioning that three of the four great classical novels of Chinese literature were written in the Ming Dynasty.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S2", "idx": 1, "cn": "宋朝始于 960 年，一直延续到 1279 年。", "en": "The Song Dynasty began in 960 and lasted until 1279.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S2", "idx": 2, "cn": "这一时期，中国经济大幅增长，成为世界上最先进的经济体，科学、技术、哲学和数学蓬勃发展。", "en": "During this period, China's economy grew substantially and became the most advanced economy in the world, while science, technology, philosophy and mathematics flourished.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S2", "idx": 3, "cn": "宋代中国是世界历史上首先发行纸币的国家。", "en": "Song China was the first country in world history to issue paper money.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S2", "idx": 4, "cn": "宋朝还最早使用火药并发明了活字（movable-type）印刷。", "en": "The Song Dynasty was also the first to use gunpowder and invented movable-type printing.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S2", "idx": 5, "cn": "人口增长迅速，越来越多的人住进城市，那里有热闹的娱乐场所。", "en": "The population grew rapidly, and more and more people moved into cities, where there were lively places of entertainment.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S2", "idx": 6, "cn": "社会生活多种多样。", "en": "Social life was diverse.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S2", "idx": 7, "cn": "人们聚集在一起观看和交易珍贵艺术品。", "en": "People gathered together to view and trade in precious works of art.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S2", "idx": 8, "cn": "宋朝的政府体制在当时也是先进的。", "en": "The government system of the Song Dynasty was also advanced for its time.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S2", "idx": 9, "cn": "政府官员均通过竞争性考试选拔任用。", "en": "Government officials were all selected and appointed through competitive examinations.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S3", "idx": 1, "cn": "唐朝始于618年，终于907年，是中国历史上最灿烂的时期。", "en": "The Tang Dynasty lasted from 618 to 907 and was the most brilliant period in Chinese history.", "cls": "A", "sid": "u5_s0", "pid": "u5_s0_p9", "sec": "正文", "cov": 0.409, "hits": ["唐朝"]}, {"ch": 0, "set": "CET6 2017·06·S3", "idx": 2, "cn": "经过近三百年的发展，唐代中国成为世界上最繁荣的强国，其首都长安是当时世界上最大的都市。", "en": "After nearly three hundred years of development, Tang China had become the most prosperous power in the world, and its capital Chang'an was the largest city in the world at that time.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S3", "idx": 3, "cn": "这一时期，经济发达、商业繁荣、社会秩序稳定，甚至边境也对外开放。", "en": "During this period, the economy was developed, commerce flourished and social order was stable; even the borders were open to the outside world.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S3", "idx": 4, "cn": "随着城市化和财富的增加，艺术和文学也繁荣起来。", "en": "With urbanization and growing wealth, art and literature also flourished.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S3", "idx": 5, "cn": "李白和杜甫是以作品简洁自然而著称的诗人。", "en": "Li Bai and Du Fu are poets renowned for the simplicity and naturalness of their works.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S3", "idx": 6, "cn": "他们的诗歌打动了学者和普通人的心。", "en": "Their poetry touched the hearts of scholars and ordinary people alike.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·06·S3", "idx": 7, "cn": "即使在今天，他们的许多诗歌仍广为儿童及成人阅读背诵。", "en": "Even today, many of their poems are still widely read and recited by children and adults.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·12·S1", "idx": 1, "cn": "太湖是中国东部的一个淡水湖,占地面积 2250 平方公里,是中国第三大淡水湖,仅次于鄱阳和洞庭。", "en": "Lake Taihu, a freshwater lake in eastern China covering 2,250 square kilometres, is the third largest freshwater lake in China, after Poyang and Dongting.", "cls": "A", "sid": "u4_s3", "pid": "u4_s3_p5", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.353, "hits": ["淡水湖"]}, {"ch": 0, "set": "CET6 2017·12·S1", "idx": 2, "cn": "太湖约有 90个岛屿,大小从几平方米到几平方公里不等。", "en": "Lake Taihu has about 90 islands, which range in size from a few square metres to several square kilometres.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·12·S1", "idx": 3, "cn": "太湖以其独特的“太湖石”而闻名,太湖石常用于装饰中国传统园林。", "en": "Lake Taihu is famous for its unique Taihu stones, which are often used to decorate traditional Chinese gardens.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·12·S1", "idx": 4, "cn": "太湖也以高产的捕鱼业闻名。", "en": "Lake Taihu is also known for its highly productive fishing industry.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·12·S1", "idx": 5, "cn": "自上世纪 70 年代后期以来,捕捞鱼蟹对沿湖的居民来说极为重要,并对周边地区的经济作出了重大贡献。", "en": "Since the late 1970s, fishing for fish and crabs has been extremely important to the residents around the lake and has made a major contribution to the economy of the surrounding areas.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·12·S1", "idx": 6, "cn": "太湖地区是中国陶瓷( ceramics)业基地之一,其中宜兴的陶瓷厂家生产举世闻名的宜兴紫砂壶( clay", "en": "The Taihu area is one of China's ceramics production bases, where ceramic manufacturers in Yixing produce the world-famous Yixing clay teapots.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·12·S3", "idx": 1, "cn": "洞庭湖位于湖南省东北部，面积很大，但湖水很浅。", "en": "Lake Dongting lies in northeastern Hunan Province. It covers a vast area, yet its water is quite shallow.", "cls": "A", "sid": "u4_s3", "pid": "u4_s3_p5", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.388, "hits": ["洞庭湖"]}, {"ch": 0, "set": "CET6 2017·12·S3", "idx": 2, "cn": "洞庭湖是长江的蓄洪池，湖的大校很大程度上取决于季节变化。", "en": "Lake Dongting serves as a flood storage basin for the Yangtze River, and the size of the lake depends largely on seasonal changes.", "cls": "B", "sid": "u4_s3", "pid": "u4_s3_p5", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.18, "hits": ["洞庭湖", "长江"]}, {"ch": 0, "set": "CET6 2017·12·S3", "idx": 3, "cn": "湖北和湖南两省因其与湖的相对位置而得名，湖北意为“湖的北边”，而湖南则为“湖的南边”。", "en": "Hubei and Hunan provinces are named after their positions relative to the lake: Hubei means “north of the lake” and Hunan means “south of the lake”.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·12·S3", "idx": 4, "cn": "洞庭湖作为龙舟赛的发源地，在中国文化中享有盛名。", "en": "As the birthplace of the dragon boat race, Lake Dongting enjoys a high reputation in Chinese culture.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·12·S3", "idx": 5, "cn": "据说龙舟赛始于洞庭湖东岸。", "en": "It is said that the dragon boat race originated on the east bank of Lake Dongting.", "cls": "B", "sid": "u4_s3", "pid": "u4_s3_p5", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.202, "hits": ["洞庭湖"]}, {"ch": 0, "set": "CET6 2017·12·S3", "idx": 6, "cn": "为的是搜寻楚国爱国诗人屈原的遗体。", "en": "The purpose was to search for the remains of Qu Yuan, the patriotic poet of the State of Chu.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2017·12·S3", "idx": 7, "cn": "龙舟赛与洞庭湖及周边的美景，每年都吸引着成千上万来自全国和世界各地的游客。", "en": "The dragon boat race and the beautiful scenery of Lake Dongting and its surroundings attract tens of thousands of visitors from across China and around the world every year.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2021·06·S1", "idx": 1, "cn": "海南是仅次于台湾的中国第二大岛，是位于中国最南端的省份。", "en": "Hainan is China's second largest island after Taiwan and the southernmost province of the country.", "cls": "B", "sid": "u4_s1", "pid": "u4_s1_p2", "sec": "Location and Boundary 位置与疆域", "cov": 0.208, "hits": []}, {"ch": 0, "set": "CET6 2021·06·S1", "idx": 2, "cn": "海南岛风景秀丽，气候宜人，阳光充足，生物多样，温泉密布，海水清澈，大部分海滩几乎全年都是游泳和日光浴的理想场所，因而被誉为中国的四季花园和度假胜地，每年都吸引了大批中外游客。", "en": "Blessed with beautiful scenery, a pleasant climate, abundant sunshine, rich biodiversity, numerous hot springs and clear seawater, Hainan Island offers beaches that are ideal for swimming and sunbathing almost all year round. It is therefore known as China's garden of four seasons and a holiday resort, attracting large numbers of tourists from home and abroad every year.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2021·06·S1", "idx": 3, "cn": "海南1988年建省以来,旅游业、服务业、高新技术产业飞速发展，是中国唯一的省级经济特区。", "en": "Since Hainan became a province in 1988, its tourism, service and high-tech industries have developed rapidly, and it is China's only province-level special economic zone.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2021·06·S1", "idx": 4, "cn": "在中央政府和全国人民的大力支持下，海南将建成中国最大的自由贸易试验区。", "en": "With the strong support of the central government and the people of the whole country, Hainan will be built into China's largest pilot free trade zone.", " es, and is known as the “Roof of the World”.", "cls": "A", "sid": "u4_s2", "pid": "u4_s2_p3", "sec": "Topography 地形", "cov": 0.426, "hits": ["青藏高原", "世界屋脊", "平均海拔"]}, {"ch": 0, "set": "CET6 2022·12·S1", "idx": 2, "cn": "青藏高原自然资源丰富，风景秀丽，拥有多种珍稀野生动物。", "en": "The Qinghai-Tibet Plateau is rich in natural resources and has beautiful scenery and a variety of rare wild animals.", "cls": "B", "sid": "u4_s3", "pid": "u4_s3_p1", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.217, "hits": ["青藏高原"]}, {"ch": 0, "set": "CET6 2022·12·S1", "idx": 3, "cn": "青藏高原气温很低，形成了大面积高山冰川。", "en": "Temperatures on the Qinghai-Tibet Plateau are very low, which has given rise to large areas of alpine glaciers.", "cls": "A", "sid": "u4_s2", "pid": "u4_s2_p3", "sec": "Topography 地形", "cov": 0.255, "hits": ["青藏高原"]}, {"ch": 0, "set": "CET6 2022·12·S1", "idx": 4, "cn": "这里是亚洲许多著名河流的源头，是中国和东南亚的主要淡水供应源。", "en": "This is the source of many famous rivers in Asia and the main source of fresh water for China and Southeast Asia.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2022·12·S1", "idx": 5, "cn": "青藏高原对全球生态系统至关重要。", "en": "The Qinghai-Tibet Plateau is of vital importance to the global ecosystem.", "cls": "A", "sid": "u4_s3", "pid": "u4_s3_p3", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.286, "hits": ["青藏高原"]}, {"ch": 0, "set": "CET6 2022·12·S1", "idx": 6, "cn": "由于气候变化的影响，青藏高原的冰川正在加速融化。", "en": "Under the impact of climate change, the glaciers on the Qinghai-Tibet Plateau are melting at an accelerating rate.", "cls": "B", "sid": "u4_s3", "pid": "u4_s3_p3", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.19, "hits": ["青藏高原"]}, {"ch": 0, "set": "CET6 2022·12·S1", "idx": 7, "cn": "中国一直在努力保护青藏高原的生态系统，草地覆盖率不断增加，许多濒危物种得到更为有效的保护。", "en": "China has been working to protect the ecosystem of the Qinghai-Tibet Plateau: grassland coverage has been increasing, and many endangered species are now better protected.", "cls": "B", "sid": "u4_s3", "pid": "u4_s3_p3", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.15, "hits": ["青藏高原"]}, {"ch": 0, "set": "CET6 2022·12·S2", "idx": 1, "cn": "黄土高原 (the Loess Plateau）面积约 60 万平方公里，是中国第三大高原，平均海拔 1000 — 2000 米，绝大部分覆盖着 50 — 80 米厚的黄土，是世界上黄土分布最集中、覆盖厚度最大的区域。", "en": "The Loess Plateau covers an area of about 600,000 square kilometres and is China's third largest plateau, with an average elevation of 1,000–2,000 metres. Most of it is covered with loess 50–80 metres thick, making it the area with the most concentrated loess distribution and the thickest loess cover in the world.", "cls": "B", "sid": "u4_s2", "pid": "u4_s2_p3", "sec": "Topography 地形", "cov": 0.174, "hits": ["平均海拔"]}, {"ch": 0, "set": "CET6 2022·12·S2", "idx": 2, "cn": "这是大自然创造的一个奇迹，在世界上也是绝无仅有的。", "en": "This is a miracle created by nature, one that is unique in the world.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2022·12·S2", "idx": 3, "cn": "黄土高原是中华民族的发祥地之一。", "en": "The Loess Plateau is one of the birthplaces of the Chinese nation.", "cls": "A", "sid": "u4_s3", "pid": "u4_s3_p4", "sec": "Rivers and Lakes 河流与湖泊", "cov": 0.357, "hits": ["中华民族"]}, {"ch": 0, "set": "CET6 2022·12·S2", "idx": 4, "cn": "早在 5500 年前，人们就已经在黄土高原上开始农耕。", "en": "As early as 5,500 years ago, people had already begun to farm on the Loess Plateau.", "cls": "B", "sid": "u4_s2", "pid": "u4_s2_p4", "sec": "Topography 地形", "cov": 0.187, "hits": ["黄土高原"]}, {"ch": 0, "set": "CET6 2022·12·S2", "idx": 5, "cn": "随着农耕业的持续发展，黄土高原人口不断增加，在秦汉时期就成为中国的政治和经济中心。", "en": "With the continuous development of farming, the population of the Loess Plateau kept growing, and by the Qin and Han dynasties the region had become China's political and economic centre.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2022·12·S2", "idx": 6, "cn": "如今，随着西部大开发战略的实施，黄土高原地区的经济得到了迅速发展。", "en": "Today, with the implementation of the strategy for the large-scale development of the western region, the economy of the Loess Plateau area has developed rapidly.", "cls": "B", "sid": "u4_s2", "pid": "u4_s2_p4", "sec": "Topography 地形", "cov": 0.158, "hits": ["黄土高原"]}, {"ch": 0, "set": "CET6 2022·12·S3", "idx": 1, "cn": "云贵高原(the Yunnan-Guizhou Plateau)大部分位于云南、贵州省境内，总面积约 50 万平方公里，平均海拔 2000 — 4000 米，是中国第四大高原。", "en": "Located mostly in Yunnan and Guizhou provinces, the Yunnan-Guizhou Plateau has a total area of about 500,000 square kilometres and an average elevation of 2,000–4,000 metres, making it China's fourth largest plateau.", "cls": "B", "sid": "u4_s2", "pid": "u4_s2_p3", "sec": "Topography 地形", "cov": 0.187, "hits": ["平均海拔"]}, {"ch": 0, "set": "CET6 2022·12·S3", "idx": 2, "cn": "云贵高原西高东低，河流众多，形成了许多又深又陡的峡谷(canyon)。", "en": "The Yunnan-Guizhou Plateau is high in the west and low in the east, and its many rivers have carved out numerous deep and steep canyons.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2022·12·S3", "idx": 3, "cn": "峡谷中许多地方土壤肥沃，非常有利于多种农作物生长。", "en": "In many parts of the canyons the soil is fertile, which is highly favourable for the growth of a wide variety of crops.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2022·12·S3", "idx": 4, "cn": "云贵高原独特的自然环境造就了生物和文化的多样性。", "en": "The unique natural environment of the Yunnan-Guizhou Plateau has created its biological and cultural diversity.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2022·12·S3", "idx": 5, "cn": "它是中国森林和矿产资源类型十分丰富的地区，也是古人类起源的重要地区。", "en": "It is an area with a great variety of forest and mineral resources in China, and also an important area for the origin of early humans.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2022·12·S3", "idx": 6, "cn": "云贵高原是中国少数民族数量最多的地区，各民族都保留了自己丰富多彩的文化传统。", "en": "The Yunnan-Guizhou Plateau is the region with the largest number of ethnic minority groups in China, and each group has preserved its own rich and colourful cultural traditions.", "cls": "A", "sid": "u8_s0", "pid": "u8_s0_p1", "sec": "正文", "cov": 0.294, "hits": ["少数民族"]}, {"ch": 0, "set": "CET6 2025·06·S2", "idx": 1, "cn": "自古以来，中国的水资源北缺南丰，分布极不均衡。", "en": "Since ancient times, China's water resources have been scarce in the north and abundant in the south, with an extremely uneven distribution.", "cls": "A", "sid": "u1_s0", "pid": "u1_s0_p1", "sec": "正文", "cov": 0.263, "hits": ["自古以来"]}, {"ch": 0, "set": "CET6 2025·06·S2", "idx": 2, "cn": "为了有效解决北方严重缺水问题，中国政府实施了南水北调工程 (the South-to-North Water Diversion Project)。", "en": "To effectively address the severe water shortage in the north, the Chinese government has implemented the South-to-North Water Diversion Project.", "cls": "B", "sid": "u7_s0", "pid": "u7_s0_p3", "sec": "正文", "cov": 0.154, "hits": ["中国政府"]}, {"ch": 0, "set": "CET6 2025·06·S2", "idx": 3, "cn": "这是一项跨区域配置水资源的宏大水利工程。", "en": "This is a massive water conservancy project that allocates water resources across regions.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2025·06·S2", "idx": 4, "cn": "历经数十年的规划与筹备，工程于 2002 年开工建设，分为东、中、西 3 条线路，总长 4350 公里，惠及人口将超过 4亿。", "en": "After decades of planning and preparation, construction began in 2002. The project consists of three routes — east, middle and west — with a total length of 4,350 kilometres, and will benefit more than 400 million people.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 0, "set": "CET6 2025·06·S2", "idx": 5, "cn": "自 2014 年通水以来，工程向北方调水累计已超 500 亿立方米，为北方地区的人民提供了可靠的水资源，同时也极大地改善了这一地区的生态环境，促进了经济的可持续健康发展。", "en": "Since water began to flow in 2014, the project has diverted more than 50 billion cubic metres of water to the north in total. It has provided the people in the north with reliable water resources and greatly improved the ecological environment of the region, promoting the sustainable and healthy development of its economy.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET4 2026·06·S2", "idx": 1, "cn": "餐桌礼仪 (dining etiquette) 是中华传统文化的重要组成部分，蕴含着热情有礼的待客之道。", "en": "Dining etiquette is an important part of traditional Chinese culture and embodies a warm and courteous way of hosting guests.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET4 2026·06·S2", "idx": 2, "cn": "为了招待客人，主人会根据客人的口味和喜好准备丰富精致的菜肴。", "en": "To entertain their guests, hosts prepare a rich and exquisite variety of dishes in line with the guests' tastes and preferences.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET4 2026·06·S2", "idx": 3, "cn": "就餐座位的安排非常讲究，主人坐在正对大门的位置，在主人身边就座的是最重要的客人。", "en": "Much attention is paid to the arrangement of seats at the table: the host sits in the seat facing the main door, and the most important guest sits beside the host.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET4 2026·06·S2", "idx": 4, "cn": "进餐时，主人会不时地为客人添酒加菜。", "en": "During the meal, the host from time to time refills the guests' glasses and serves them more food.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET4 2026·06·S2", "idx": 5, "cn": "这种独特的餐桌礼仪已延续了数千年，对促进和谐的人际交往起到了重要作用。", "en": "This distinctive dining etiquette has lasted for thousands of years and has played an important role in promoting harmonious interpersonal interaction.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET4 2026·06·S3", "idx": 1, "cn": "在中国传统文化中，亲朋好友之间互赠礼物是人际交往的一种重要礼节 (etiquette)。", "en": "In traditional Chinese culture, exchanging gifts among relatives and friends is an important form of etiquette in interpersonal interaction.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET4 2026·06·S3", "idx": 2, "cn": "赠送礼物不仅是物质的馈赠，更是情感的表达，是维系人际关系的重要纽带。", "en": "Giving a gift is not merely a material offering but an expression of feeling and an important bond that sustains interpersonal relationships.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET4 2026·06·S3", "idx": 3, "cn": "一份精心挑选、符合接受者喜好的礼物，往往能加深彼此的感情。", "en": "A gift carefully chosen to suit the recipient's taste often deepens the affection between the two parties.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET4 2026·06·S3", "idx": 4, "cn": "中国人遵循“礼尚往来” (mutually exchanging courtesies) 的传统，接受礼物时会表达谢意，并适时回赠礼物，以增进彼此的融洽关系。", "en": "Observing the tradition of “mutually exchanging courtesies”, the Chinese express their gratitude when they receive a gift and return one in due course, thereby enhancing the harmonious relationship between them.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET6 2014·12·S1", "idx": 1, "cn": "反映在艺术和文学中的乡村生活理想是中国文明的重要特征。", "en": "The ideal of rural life as reflected in art and literature is an important feature of Chinese civilization.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET6 2014·12·S1", "idx": 2, "cn": "这在很大程度上归功于道家（Taoist) 对自然的情感。", "en": "This is to a large extent thanks to the Taoist love of nature.", "cls": "A", "sid": "u2_s2", "pid": "u2_s2_p7", "sec": "古代哲学的发展 Development of Ancient Chinese Philosophy", "cov": 0.255, "hits": ["道家"]}, {"ch": 1, "set": "CET6 2014·12·S1", "idx": 3, "cn": "传统中国画有两个最受青睐的主题，一是家庭生活的各种幸福场景，画中往往有老人在饮茶下棋，男人在耕耘收割，妇女在织布缝衣，小孩在户外玩耍。", "en": "Traditional Chinese painting has two favored themes. One is the various happy scenes of family life, in which old people are often seen drinking tea and playing chess, men plowing and harvesting, women weaving and sewing, and children playing outdoors.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET6 2014·12·S1", "idx": 4, "cn": "另一个则是乡村生活的种种乐趣，画有渔夫在湖上打渔，农夫在山上欲柴采药，或是书生坐在松树下呤诗作画。", "en": "The other is the various pleasures of country life, with fishermen fishing on the lake, farmers cutting firewood and gathering herbs in the mountains, or scholars sitting under pine trees composing poems and painting.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET6 2014·12·S1", "idx": 5, "cn": "这两个主题可以分别代表儒家 (Confucian)和道家的生活理想。", "en": "These two themes can respectively represent the Confucian and the Taoist ideals of life.", "cls": "A", "sid": "u2_s2", "pid": "u2_s2_p4", "sec": "古代哲学的发展 Development of Ancient Chinese Philosophy", "cov": 0.27, "hits": ["儒家"]}, {"ch": 1, "set": "CET6 2025·12·S1", "idx": 1, "cn": "尊老是中华民族的传统美德，深深植根于中国人的思想和行为中，是人们普遍遵守的行为规范和社会准则。", "en": "Respecting the elderly is a traditional virtue of the Chinese nation, deeply rooted in the thoughts and behavior of the Chinese people and widely observed as a code of conduct and social norm.", "cls": "A", "sid": "u2_s2", "pid": "u2_s2_p4", "sec": "古代哲学的发展 Development of Ancient Chinese Philosophy", "cov": 0.262, "hits": ["准则", "植根于"]}, {"ch": 1, "set": "CET6 2025·12·S1", "idx": 2, "cn": "在当今的中国，这种美德得到广泛传承。", "en": "In China today, this virtue is widely passed down.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET6 2025·12·S1", "idx": 3, "cn": "社会各界积极营造敬老助老的社会氛围。", "en": "All sectors of society are actively fostering a social atmosphere of respecting and helping the elderly.", "cls": "A", "sid": "u2_s1", "pid": "u2_s1_p3", "sec": "引言与\"百家争鸣\"", "cov": 0.267, "hits": ["氛围"]}, {"ch": 1, "set": "CET6 2025·12·S1", "idx": 4, "cn": "为老年人提供便利服务已成为社会共识，例如社区专门开设长者食堂，公共场所配置优先座位。", "en": "Providing convenient services for the elderly has become a social consensus: communities have set up canteens for seniors, and priority seats have been provided in public places.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET6 2025·12·S1", "idx": 5, "cn": "政府还出台了一系列政策，为老年人的权益提供有力保障。", "en": "The government has also introduced a series of policies that provide strong protection for the rights and interests of the elderly.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET6 2025·12·S1", "idx": 6, "cn": "尊老是社会和谐与发展的重要基石，有助于培育良好的社会氛围，推动整个社会文明进步。", "en": "Respecting the elderly is an important cornerstone of social harmony and development, helping to foster a sound social atmosphere and advance the civility and progress of society as a whole.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET6 2025·12·S3", "idx": 1, "cn": "节俭 (frugality) 是中华民族的传统美德。", "en": "Frugality is a traditional virtue of the Chinese nation.", "cls": "A", "sid": "u2_s4", "pid": "u2_s4_p2", "sec": "中国伦理道德的特征 Characteristics of Chinese Ethics and Morality", "cov": 0.364, "hits": ["中华民族"]}, {"ch": 1, "set": "CET6 2025·12·S3", "idx": 2, "cn": "在中国古代，生产力低下，先人们深知劳动成果来之不易，因而秉持节俭的理念。", "en": "In ancient China, productivity was low, and our ancestors, well aware that the fruits of their labor were hard won, therefore upheld the idea of frugality.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET6 2025·12·S3", "idx": 3, "cn": "到了物质极大丰富的今天，中国人民依然坚持节俭的生活方式，体现了理性消费的生活理念和对劳动的尊重。", "en": "Even in today's world of great material abundance, the Chinese people still maintain a frugal lifestyle, which reflects a philosophy of rational consumption and a respect for labor.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET6 2025·12·S3", "idx": 4, "cn": "近年来，中国政府持续加强节约型社会的建设，倡导“光盘行动”，减少食物浪费，提倡简约低碳的生活方式，推进资源循环利用，反对过度消费。", "en": "In recent years, the Chinese government has consistently strengthened the building of a resource-conserving society, promoting the Clear Your Plate Campaign, reducing food waste, encouraging a simple, low-carbon lifestyle, advancing resource recycling, and opposing excessive consumption.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 1, "set": "CET6 2025·12·S3", "idx": 5, "cn": "节约型社会的建设有力地推动了中国经济的高质量发展。", "en": "The building of a resource-conserving society has given a strong boost to the high-quality development of China's economy.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET4 2019·12·S3", "idx": 1, "cn": "中国汉族人的全名由姓和名组成。", "en": "The full name of a Han Chinese consists of a surname and a given name.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET4 2019·12·S3", "idx": 2, "cn": "中文姓名的特点是，姓总是在前，名跟在其后。", "en": "A distinctive feature of Chinese names is that the surname always comes first, followed by the given name.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET4 2019·12·S3", "idx": 3, "cn": "千百年来，父姓一直世代相传。", "en": "For thousands of years, the father's surname has been passed down from generation to generation.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET4 2019·12·S3", "idx": 4, "cn": "然而，如今，孩子跟母亲姓并不罕见。", "en": "Today, however, it is not uncommon for children to take their mother's surname.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET4 2019·12·S3", "idx": 5, "cn": "一般来说，名有一个或两个汉字，通常承载父母对孩子的愿望。", "en": "Generally speaking, a given name consists of one or two Chinese characters and usually carries the parents' wishes for their child.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET4 2019·12·S3", "idx": 6, "cn": "从孩子的名字可以推断出父母希望孩子成为什么样的人，或者期望他们过什么样的生活。", "en": "A child's name reveals what kind of person the parents hope the child will become, or what kind of life they expect the child to lead.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET4 2019·12·S3", "idx": 7, "cn": "父母非常重视给孩子取名，因为名字往往会伴随孩子一生。", "en": "Parents attach great importance to naming their children, because a name often accompanies a child throughout his or her life.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2014·06·S2", "idx": 1, "cn": "中文热词通常反映社会变化和文化，有些在外国媒体上愈来愈流行。", "en": "Chinese buzzwords usually reflect social changes and culture, and some of them are becoming increasingly popular in foreign media.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2014·06·S2", "idx": 2, "cn": "例如,土豪（tuhao)和大妈（dama)都是老词，但已获取了新的意义。", "en": "For example, tuhao and dama are both old words, but they have acquired new meanings.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2014·06·S2", "idx": 3, "cn": "土豪以前指欺压佃户和仆人的乡村地主，现在用于指花钱如流水或喜欢炫耀财富的人。", "en": "Tuhao used to refer to a rural landlord who oppressed tenant farmers and servants, but now it refers to someone who spends money like water or likes to show off his or her wealth.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2014·06·S2", "idx": 4, "cn": "也就是说，土豪有钱，但没有品位。", "en": "In other words, tuhao means having money but no taste.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2014·06·S2", "idx": 5, "cn": "大妈是对中年妇女的称呼，但现在特指不久前金价下跌时大量购买黄金的中国妇女。", "en": "Dama is a term for middle-aged women, but now it specifically refers to the Chinese women who bought large quantities of gold when the price of gold fell not long ago.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2014·06·S2", "idx": 6, "cn": "土豪和大妈可能会被收入新版牛津(Oxford)英语词典。", "en": "Tuhao and dama may be included in the new edition of the Oxford English Dictionary.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2014·06·S2", "idx": 7, "cn": "至今已有约 120 个中文词被加进了牛津英语词典,成了英语语言的一部分。", "en": "So far, about 120 Chinese words have been added to the Oxford English Dictionary, becoming part of the English language.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2016·12·S2", "idx": 1, "cn": "随着中国经济的蓬勃发展，学汉语的人数迅速增加，使汉语成了世界上人们最爱学的语言之一。", "en": "With the vigorous development of China's economy, the number of Chinese learners has increased rapidly, making Chinese one of the most popular languages to learn in the world.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2016·12·S2", "idx": 2, "cn": "近年来，中国大学在国际上的排名也有了明显的提高。", "en": "In recent years, the international rankings of Chinese universities have also improved markedly.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2016·12·S2", "idx": 3, "cn": "由于中国教育的巨大进步，中国成为最受海外学生欢迎的留学目的地之一就不足为奇了。", "en": "Given the tremendous progress of Chinese education, it is not surprising that China has become one of the most popular destinations for overseas students.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2016·12·S2", "idx": 4, "cn": "2015 年，近 40 万国际学生蜂拥来到中国市场。", "en": "In 2015, nearly 400,000 international students flocked to the Chinese market.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2016·12·S2", "idx": 5, "cn": "他们学习的科目不再限于中国语言和文化，而包括科学与工程。", "en": "The subjects they study are no longer limited to Chinese language and culture, but include science and engineering.", "cls": "B", "sid": "u3_s1", "pid": "u3_s1_p4", "sec": "当代文学", "cov": 0.24, "hits": []}, {"ch": 2, "set": "CET6 2016·12·S2", "idx": 6, "cn": "在全球教育市场上，美国和英国仍占主导地位，但中国正在迅速赶上。", "en": "In the global education market, the United States and the United Kingdom still dominate, but China is catching up quickly.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2017·06·S3", "idx": 1, "cn": "唐朝始于618年，终于907年，是中国历史上最灿烂的时期。", "en": "The Tang Dynasty began in 618 and ended in 907, and was the most glorious period in Chinese history.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2017·06·S3", "idx": 2, "cn": "经过近三百年的发展，唐代中国成为世界上最繁荣的强国，其首都长安是当时世界上最大的都市。", "en": "After nearly three hundred years of development, Tang China became the most prosperous power in the world, and its capital Chang'an was the largest city in the world at that time.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2017·06·S3", "idx": 3, "cn": "这一时期，经济发达、商业繁荣、社会秩序稳定，甚至边境也对外开放。", "en": "During this period, the economy was developed, commerce flourished and social order was stable; even the borders were open to the outside world.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2017·06·S3", "idx": 4, "cn": "随着城市化和财富的增加，艺术和文学也繁荣起来。", "en": "With urbanization and growing wealth, art and literature also flourished.", "cls": "B", "sid": "u1_s12", "pid": "u1_s12_p1", "sec": "明清小说", "cov": 0.2, "hits": []}, {"ch": 2, "set": "CET6 2017·06·S3", "idx": 5, "cn": "李白和杜甫是以作品简洁自然而著称的诗人。", "en": "Li Bai and Du Fu were poets known for the simplicity and naturalness of their works.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2017·06·S3", "idx": 6, "cn": "他们的诗歌打动了学者和普通人的心。", "en": "Their poems touched the hearts of scholars and ordinary people alike.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2017·06·S3", "idx": 7, "cn": "即使在今天，他们的许多诗歌仍广为儿童及成人阅读背诵。", "en": "Even today, many of their poems are still widely read and recited by children and adults.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2019·06·S1", "idx": 1, "cn": "中国幅员辽阔，人口众多，很多地方人们都说自己的方言。", "en": "China is a vast country with a large population, and in many places people speak their own dialects.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2019·06·S1", "idx": 2, "cn": "方言在发音上差别很大，词汇和语法差别较小。", "en": "Dialects differ greatly in pronunciation but only slightly in vocabulary and grammar.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2019·06·S1", "idx": 3, "cn": "有些方言，特别是北方和南方的方言，差异很大，以致于说不同方言的人常常很难听懂彼此的讲话。", "en": "Some dialects, especially those in the north and the south, differ so greatly that people who speak different dialects often find it hard to understand each other.", "cls": "B", "sid": "u1_s11", "pid": "u1_s11_p1", "sec": "元曲", "cov": 0.108, "hits": ["北方和南方"]}, {"ch": 2, "set": "CET6 2019·06·S1", "idx": 4, "cn": "方言被认为是当地文化的一个组成部分，但近年来能说方言的人数不断减少。", "en": "Dialects are regarded as an integral part of local culture, but in recent years the number of people who can speak them has been steadily declining.", "cls": "B", "sid": "u1_s11", "pid": "u1_s11_p2", "sec": "元曲", "cov": 0.167, "hits": ["组成部分"]}, {"ch": 2, "set": "CET6 2019·06·S1", "idx": 5, "cn": "为了鼓励人们更多说本地语言，一些地方政府已经采取措施，如在学校开设方言课，在广播和电视上播放方言节目，以期保存本地的文化遗产。", "en": "To encourage people to speak local languages more often, some local governments have taken measures such as offering dialect courses in schools and broadcasting dialect programs on radio and television, in the hope of preserving local cultural heritage.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2019·06·S2", "idx": 1, "cn": "汉语现在是世界上用作本族语人数最多的语言。", "en": "Chinese is now the language spoken by more native speakers than any other language in the world.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2019·06·S2", "idx": 2, "cn": "汉语与西方语言的一个重要区别在于它是以方块字(character)而不是以字母构成的。", "en": "An important difference between Chinese and Western languages is that it is composed of characters rather than letters.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2019·06·S2", "idx": 3, "cn": "目前仍在使用的书写系统中，汉语是最古老的。", "en": "Of the writing systems still in use today, Chinese is the oldest.", "cls": "B", "sid": "u1_s3", "pid": "u1_s3_p2", "sec": "《诗经》与《楚辞》", "cov": 0.167, "hits": ["最古老"]}, {"ch": 2, "set": "CET6 2019·06·S2", "idx": 4, "cn": "在中国，来自不同地区的人可能听不懂对方的方言，但由于汉字有统一的书写形式，他们交流起来几乎没有任何困难。", "en": "In China, people from different regions may not understand each other's dialects, but because Chinese characters have a unified written form, they have almost no difficulty communicating.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2019·06·S2", "idx": 5, "cn": "汉语历史上对团结中华民族发挥了重要作用。", "en": "Historically, Chinese has played an important role in uniting the Chinese nation.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2019·06·S2", "idx": 6, "cn": "今天，随着中国经济的快速增长和全球影响力的增强，越来越多其他国家的人也开始学习汉语。", "en": "Today, with the rapid growth of China's economy and its growing global influence, more and more people in other countries are beginning to learn Chinese.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2019·06·S3", "idx": 1, "cn": "成语(Chinese idioms)是汉语中的一种独特的表达方式，大多由四个汉字组成。", "en": "Chinese idioms are a unique form of expression in the Chinese language, most of which consist of four characters.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2019·06·S3", "idx": 2, "cn": "它们高度简练且形式固定，但通常能形象地表达深刻的含义。", "en": "They are highly concise and fixed in form, yet they can usually express profound meanings in a vivid way.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2019·06·S3", "idx": 3, "cn": "成语大多来源于中国古代的文学作品，通常与某些神话、传说或者历史事件有关。", "en": "Most Chinese idioms come from ancient Chinese literature and are usually related to certain myths, legends or historical events.", "cls": "A", "sid": "u1_s4", "pid": "u1_s4_p1", "sec": "先秦散文", "cov": 0.25, "hits": ["历史事件"]}, {"ch": 2, "set": "CET6 2019·06·S3", "idx": 4, "cn": "如果不知道某个成语的出处，就很难理解其确切含义。", "en": "If one does not know the origin of an idiom, it is hard to understand its exact meaning.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2019·06·S3", "idx": 5, "cn": "因此，学习成语有助于人们更好地理解中国传统文化。", "en": "Therefore, learning Chinese idioms helps people better understand traditional Chinese culture.", "cls": "B", "sid": "u3_s1", "pid": "u3_s1_p12", "sec": "当代文学", "cov": 0.238, "hits": ["中国传统文化"]}, {"ch": 2, "set": "CET6 2019·06·S3", "idx": 6, "cn": "成语在日常会话和文学创作中广泛使用。", "en": "Chinese idioms are widely used in everyday conversation and literary creation.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2019·06·S3", "idx": 7, "cn": "恰当使用成语可以使一个人的语言更具表现力，交流更有效。", "en": "Using idioms appropriately can make one's language more expressive and one's communication more effective.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2020·07·S1", "idx": 1, "cn": "《 三国演义》 ( The Romance of the Three Kingdoms) 是中国一部著名的历史小说,写于十四世纪。", "en": "The Romance of the Three Kingdoms is a famous historical novel in China, written in the fourteenth century.", "cls": "A", "sid": "u1_s12", "pid": "u1_s12_p3", "sec": "明清小说", "cov": 0.401, "hits": ["三国演义", "历史小说"]}, {"ch": 2, "set": "CET6 2020·07·S1", "idx": 2, "cn": "这部文学作品以三国时期的历史为背景,描写了从公元二世纪下半叶到公元三世纪下半叶的魏、蜀、吴三国之间的战争。", "en": "Set against the history of the Three Kingdoms period, this literary work describes the wars among the three kingdoms of Wei, Shu and Wu from the second half of the second century AD to the second half of the third century AD.", "cls": "B", "sid": "u1_s12", "pid": "u1_s12_p3", "sec": "明清小说", "cov": 0.234, "hits": ["魏、蜀、吴", "三国", "吴三国"]}, {"ch": 2, "set": "CET6 2020·07·S1", "idx": 3, "cn": "小说中刻画了近千个人物和无数的历史事件。", "en": "The novel portrays nearly a thousand characters and countless historical events.", "cls": "A", "sid": "u1_s7", "pid": "u1_s7_p4", "sec": "汉代文学", "cov": 0.333, "hits": ["历史事件"]}, {"ch": 2, "set": "CET6 2020·07·S1", "idx": 4, "cn": "这些人物和事件虽然大都基于真实的历史,但都不同程度地被浪漫化和戏剧化了。", "en": "Although most of these characters and events are based on real history, they have been romanticized and dramatized to varying degrees.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2020·07·S1", "idx": 5, "cn": "《 三国演义》 是一部公认的文学杰作。", "en": "The Romance of the Three Kingdoms is a recognized literary masterpiece.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2020·07·S1", "idx": 6, "cn": "自面世以来,这部小说不断吸引着一代又一代的读者,并且对中国文化产生了广泛而持久的影响。", "en": "Since its publication, the novel has continued to attract generation after generation of readers and has exerted a broad and lasting influence on Chinese culture.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2020·09·S1", "idx": 1, "cn": "《水浒传》(Water Margin)是中国文学四大经典小说之一。", "en": "Water Margin is one of the four great classical novels of Chinese literature.", "cls": "A", "sid": "u1_s12", "pid": "u1_s12_p5", "sec": "明清小说", "cov": 0.62, "hits": ["水浒传", "中国文学"]}, {"ch": 2, "set": "CET6 2020·09·S1", "idx": 2, "cn": "这部小说基于历史人物宋江及其伙伴反抗封建帝王的故事，数百年来一直深受中国读者的喜爱。", "en": "Based on the story of the historical figures Song Jiang and his companions rebelling against the feudal emperors, this novel has been deeply loved by Chinese readers for centuries.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2020·09·S1", "idx": 3, "cn": "毫不夸张地说，几乎每个中国人都熟悉小说中的一些主要人物。", "en": "It is no exaggeration to say that almost every Chinese is familiar with some of the main characters in the novel.", "cls": "B", "sid": "u1_s12", "pid": "u1_s12_p5", "sec": "明清小说", "cov": 0.22, "hits": []}, {"ch": 2, "set": "CET6 2020·09·S1", "idx": 4, "cn": "这部小说中的精彩故事在茶馆、戏剧舞台、广播电视、电影屏幕和无数家庭中反复讲述。", "en": "The wonderful stories in this novel have been told and retold in teahouses, on the stage, on radio and television, on the cinema screen and in countless households.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2020·09·S1", "idx": 5, "cn": "事实上，这部小说的影响已经远远超出了国界。", "en": "In fact, the influence of this novel has gone far beyond national borders.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2020·09·S1", "idx": 6, "cn": "越来越多的外国读者也感到这部小说里的故事生动感人、趣味盎然。", "en": "More and more foreign readers also find the stories in this novel vivid, moving and full of interest.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2020·09·S2", "idx": 1, "cn": "《红楼梦》(Dream of the Red Chamber)是18世纪曹雪芹创作的一部小说。", "en": "Dream of the Red Chamber is a novel written by Cao Xueqin in the 18th century.", "cls": "A", "sid": "u1_s12", "pid": "u1_s12_p9", "sec": "明清小说", "cov": 0.42, "hits": ["红楼梦", "曹雪芹"]}, {"ch": 2, "set": "CET6 2020·09·S2", "idx": 2, "cn": "曹雪芹基于自己痛苦的个人经历，讲述了贾宝玉和林黛玉之间的悲剧性爱情故事。", "en": "Drawing on his own painful personal experience, Cao Xueqin tells the tragic love story between Jia Baoyu and Lin Daiyu.", "cls": "A", "sid": "u1_s12", "pid": "u1_s12_p9", "sec": "明清小说", "cov": 0.444, "hits": ["曹雪芹", "贾宝玉", "林黛玉"]}, {"ch": 2, "set": "CET6 2020·09·S2", "idx": 3, "cn": "书中有大约30个主要人物和400多个次要人物，每个人物都刻画得栩栩如生，具有鲜明的个性。", "en": "The book contains about 30 main characters and more than 400 minor ones, each portrayed vividly and with a distinct personality.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2020·09·S2", "idx": 4, "cn": "小说详尽地描述了四个贵族世家兴衰的历程，反映了封建社会隐藏的种种危机和错综复杂的社会冲突。", "en": "The novel gives a detailed description of the rise and fall of four noble families, reflecting the hidden crises and complicated social conflicts of feudal society.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2020·09·S2", "idx": 5, "cn": "《红楼梦》融合了现实主义和浪漫主义，具有很强的艺术感染力。", "en": "Dream of the Red Chamber combines realism and romanticism and has strong artistic appeal.", "cls": "A", "sid": "u1_s12", "pid": "u1_s12_p12", "sec": "明清小说", "cov": 0.281, "hits": ["现实主义", "浪漫主义"]}, {"ch": 2, "set": "CET6 2020·09·S2", "idx": 6, "cn": "它被普遍认为是中国最伟大的小说，也是世界上最伟大的文学创作之一。", "en": "It is generally regarded as the greatest novel in China and one of the greatest literary creations in the world.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2020·09·S3", "idx": 1, "cn": "《西游记》(Journey to the West)也许是中国文学四大经典小说中最具影响力的一部，当然也是在国外最广为人知的一部小说。", "en": "Journey to the West is perhaps the most influential of the four great classical novels of Chinese literature, and certainly the best known abroad.", "cls": "A", "sid": "u1_s12", "pid": "u1_s12_p5", "sec": "明清小说", "cov": 0.388, "hits": ["中国文学", "影响力"]}, {"ch": 2, "set": "CET6 2020·09·S3", "idx": 2, "cn": "这部小说描绘了著名僧侣玄奘在三个随从的陪同下穿越中国西部地区前往印度取经(Buddhist scripture)的艰难历程。", "en": "The novel depicts the arduous journey of the famous monk Xuanzang, accompanied by three disciples, across western China to India to obtain Buddhist scriptures.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2020·09·S3", "idx": 3, "cn": "虽然故事的主题基于佛教，但这部小说采用了大量中国民间故事和神话的素材，创造了各种栩栩如生的人物和动物形象。", "en": "Although the theme of the story is based on Buddhism, the novel draws heavily on Chinese folk tales and myths, creating a variety of lifelike human and animal characters.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 2, "set": "CET6 2020·09·S3", "idx": 4, "cn": "其中最著名的是孙悟空，他与各种各样妖魔作斗争的故事几乎为每个中国孩子所熟知。", "en": "The most famous of them is Sun Wukong, whose battles against various demons are known to almost every Chinese child.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2014·06·S3", "idx": 1, "cn": "为了促进教育公平，中国已投入 360 亿元,用于改善农村地区教育设施和加强中西部地区农村义务教育(compulsory education)。", "en": "To promote educational equity, China has invested 36 billion yuan to improve educational facilities in rural areas and strengthen compulsory education in rural areas of the central and western regions.", "cls": "B", "sid": "u2_s7", "pid": "u2_s7_p3", "sec": "高考", "cov": 0.139, "hits": ["教育公平"]}, {"ch": 4, "set": "CET4 2014·06·S3", "idx": 2, "cn": "这些资金用于改善教学设施、购买书籍，使 16 万多所中小学受益。", "en": "These funds are used to improve school equipment and facilities and to purchase books, benefiting more than 160,000 primary and secondary schools.", "cls": "B", "sid": "u2_s3", "pid": "u2_s3_p3", "sec": "九年义务教育", "cov": 0.145, "hits": ["中小学"]}, {"ch": 4, "set": "CET4 2014·06·S3", "idx": 3, "cn": "资金还用于购置音乐和绘画器材。", "en": "The funds are also used to purchase music and painting equipment.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2014·06·S3", "idx": 4, "cn": "现在农村和山区的儿童可以与沿海城市的儿童一样上音乐和绘画课。", "en": "Today, children in rural and mountainous areas can take music and painting classes just like children in coastal cities.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2014·06·S3", "idx": 5, "cn": "一些为接受更好教育而转往城市上学的学生如今又回到了本地农村学校就读。", "en": "Some students who moved to cities for a better education have now returned to their local rural schools.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2019·12·S1", "idx": 1, "cn": "中国家庭十分重视孩子的教育。", "en": "Chinese families attach great importance to their children's education.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2019·12·S1", "idx": 2, "cn": "许多父母认为应该努力工作，确保孩子受到良好教育。", "en": "Many parents believe that they should work hard to ensure that their children receive a good education.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2019·12·S1", "idx": 3, "cn": "他们不仅非常情愿为孩子的教育投资，而且花很多时间督促他们学习。", "en": "They are not only very willing to invest in their children's education but also spend a lot of time urging them to study.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2019·12·S1", "idx": 4, "cn": "多数家长希望孩子能上名牌大学。", "en": "Most parents hope that their children can attend prestigious universities.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2019·12·S1", "idx": 5, "cn": "由于改革开放，越来越多的家长能送孩子到国外学习或参与国际交流项目，以拓宽其视野。", "en": "Thanks to reform and opening up, more and more parents are able to send their children to study abroad or take part in international exchange programs to broaden their horizons.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2019·12·S1", "idx": 6, "cn": "通过这些努力，他们期望孩子健康成长，为国家的发展和繁荣作出贡献。", "en": "Through these efforts, they expect their children to grow up healthy and make contributions to the development and prosperity of the country.", "cls": "B", "sid": "u2_s15", "pid": "u2_s15_p1", "sec": "来华留学生", "cov": 0.321, "hits": []}, {"ch": 4, "set": "CET4 2023·06·S1", "idx": 1, "cn": "中国政府一直大力推行义务教育(compulsory education)，以使每个儿童都享有受教育的机会。", "en": "The Chinese government has been actively promoting compulsory education to ensure that every child has access to education.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2023·06·S1", "idx": 2, "cn": "自 1986 年《义务教育法》生效以来，经过不懈努力，实现了在全国推行义务教育的目标。", "en": "Since the Compulsory Education Law came into effect in 1986, China has achieved the goal of implementing compulsory education nationwide through unremitting efforts.", "cls": "A", "sid": "u2_s1", "pid": "u2_s1_p1", "sec": "现代教育", "cov": 0.25, "hits": ["不懈努力"]}, {"ch": 4, "set": "CET4 2023·06·S1", "idx": 3, "cn": "如今，在中国，儿童年满六周岁开始上小学，从小学到初中一共接受九年义务教育。", "en": "Today in China, children start primary school at the age of six and receive nine years of compulsory education from primary school to junior middle school.", "cls": "B", "sid": "u2_s3", "pid": "u2_s3_p2", "sec": "九年义务教育", "cov": 0.31, "hits": []}, {"ch": 4, "set": "CET4 2023·06·S1", "idx": 4, "cn": "从 2008 年秋季学期开始，义务教育阶段学生无需缴纳学费。", "en": "Starting from the autumn semester of 2008, students in the compulsory education stage no longer need to pay tuition fees.", "cls": "B", "sid": "u2_s3", "pid": "u2_s3_p1", "sec": "九年义务教育", "cov": 0.21, "hits": ["义务教育"]}, {"ch": 4, "set": "CET4 2023·06·S1", "idx": 5, "cn": "随着一系列教育改革举措的实施，中国义务教育的质量也有显著提高。", "en": "With the implementation of a series of education reform measures, the quality of China's compulsory education has also improved significantly.", "cls": "B", "sid": "u2_s11", "pid": "u2_s11_p2", "sec": "特殊教育", "cov": 0.222, "hits": ["教育改革"]}, {"ch": 4, "set": "CET4 2023·06·S2", "idx": 1, "cn": "改革开放 40 多年以来，中国政府对高等教育越来越重视，高等教育已经进入稳步发展阶段。", "en": "Over more than 40 years of reform and opening up, the Chinese government has attached increasing importance to higher education, and higher education has entered a stage of steady development.", "cls": "B", "sid": "u2_s8", "pid": "u2_s8_p4", "sec": "高等教育", "cov": 0.239, "hits": ["高等教育"]}, {"ch": 4, "set": "CET4 2023·06·S2", "idx": 2, "cn": "高校学生总数已接近 4700 万人，位居世界第一。", "en": "The total number of college students has approached 47 million, ranking first in the world.", "cls": "B", "sid": "u2_s15", "pid": "u2_s15_p2", "sec": "来华留学生", "cov": 0.25, "hits": []}, {"ch": 4, "set": "CET4 2023·06·S2", "idx": 3, "cn": "随着我国经济的快速发展，人民生活水平不断提高，越来越多的人渴望接受高等教育。", "en": "With the rapid development of China's economy and the steady improvement of people's living standards, more and more people are eager to receive higher education.", "cls": "A", "sid": "u2_s8", "pid": "u2_s8_p4", "sec": "高等教育", "cov": 0.255, "hits": ["高等教育"]}, {"ch": 4, "set": "CET4 2023·06·S2", "idx": 4, "cn": "我国高校的数量和学科专业持续增加，招生人数逐年上升,教学质量也在不断改进，为更多年轻人创造了接受高等教育的机会。", "en": "The number of colleges and universities and academic programs in China has kept increasing, enrollment has risen year by year, and teaching quality has also been improving, creating opportunities for more young people to receive higher education.", "cls": "B", "sid": "u2_s8", "pid": "u2_s8_p5", "sec": "高等教育", "cov": 0.177, "hits": ["高等教育"]}, {"ch": 4, "set": "CET4 2023·06·S3", "idx": 1, "cn": "中国越来越重视终身教育，发展继续教育是构建终身教育体系的有效途径。", "en": "China is attaching increasing importance to lifelong education, and developing continuing education is an effective way to build a lifelong education system.", "cls": "B", "sid": "u2_s10", "pid": "u2_s10_p1", "sec": "成人教育", "cov": 0.269, "hits": []}, {"ch": 4, "set": "CET4 2023·06·S3", "idx": 2, "cn": "高校作为人才培养的基地，拥有先进的教学理念和优越的教学资源，理应成为继续教育的办学主体。", "en": "As bases for talent cultivation, colleges and universities have advanced teaching philosophies and superior teaching resources, and should therefore become the main providers of continuing education.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2023·06·S3", "idx": 3, "cn": "因此，近年来许多高校适应社会需求，加强与用人单位沟通，努力探索一条符合中国国情的继续教育发展新路，以使继续教育在国家发展战略中发挥更大的作用。", "en": "Therefore, in recent years many colleges and universities have adapted to social needs, strengthened communication with employers, and worked hard to explore a new path of continuing education development suited to China's national conditions, so that continuing education can play a greater role in the national development strategy.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2026·06·S1", "idx": 1, "cn": "中国有句老话：“一日为师，终身为父”。", "en": "There is an old saying in China: \"One who teaches you for a day is like a father for life.\"", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2026·06·S1", "idx": 2, "cn": "在中国人的观念里，老师不仅传授知识，更教给学生做人的道理。", "en": "In the eyes of Chinese people, teachers not only impart knowledge but also teach students the principles of how to conduct themselves.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2026·06·S1", "idx": 3, "cn": "在古代，学生初次见老师时要举行隆重的仪式，足见老师地位之高。", "en": "In ancient times, a grand ceremony was held when students first met their teachers, which shows how high the status of teachers was.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2026·06·S1", "idx": 4, "cn": "为弘扬尊师的优良传统，中国从1985年开始将每年的9月10日定为教师节。", "en": "To promote the fine tradition of respecting teachers, China has designated September 10 as Teachers' Day every year since 1985.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2026·06·S1", "idx": 5, "cn": "在这一天，学生以各种方式表达对老师的敬意。", "en": "On this day, students express their respect for teachers in various ways.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2026·06·S1", "idx": 6, "cn": "尊师是中华民族的传统美德，在当今社会得到了发扬光大。", "en": "Respecting teachers is a traditional virtue of the Chinese nation, and it has been carried forward in today's society.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET6 2014·12·S3", "idx": 1, "cn": "中国将努力确保到 2015 年就业者接受过平均 13.3 年的教育。", "en": "China will work to ensure that by 2015 workers have received an average of 13.3 years of education.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET6 2014·12·S3", "idx": 2, "cn": "如果这一目标得以实现，今后大部分进入劳动力市场的人都须获得大学文凭。", "en": "If this goal is achieved, most people entering the labor market in the future will need to obtain a college diploma.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET6 2014·12·S3", "idx": 3, "cn": "在未来几年，中国将着力增加职业学院的招生人数；除了关注高等教育之外，还将寻找新的突破以确保教育制度更加公平。", "en": "In the coming years, China will focus on increasing enrollment in vocational colleges; apart from focusing on higher education, it will also seek new breakthroughs to ensure that the education system is more equitable.", "cls": "B", "sid": "u2_s1", "pid": "u2_s1_p2", "sec": "现代教育", "cov": 0.125, "hits": ["高等教育", "教育制度"]}, {"ch": 4, "set": "CET6 2014·12·S3", "idx": 4, "cn": "中国正在努力最佳地利用教育资源，这样农村和欠发达地区将获得更多的支持。", "en": "China is working to make the best use of educational resources, so that rural and less developed areas will receive more support.", "cls": "B", "sid": "u2_s8", "pid": "u2_s8_p4", "sec": "高等教育", "cov": 0.219, "hits": ["教育资源"]}, {"ch": 4, "set": "CET6 2014·12·S3", "idx": 5, "cn": "教育部还决定改善欠发达地区学生的营养，并为外来务工人员的子女提供在城市接受教育的同等机会。", "en": "The Ministry of Education has also decided to improve the nutrition of students in less developed areas and provide the children of migrant workers with equal opportunities to receive education in cities.", "cls": "B", "sid": "u2_s7", "pid": "u2_s7_p3", "sec": "高考", "cov": 0.22, "hits": ["欠发达"]}, {"ch": 4, "set": "CET4 2015·12·S1", "idx": 1, "cn": "中国父母往往过于关注孩子的学习，以至于不要他们帮忙做家务。", "en": "Chinese parents often focus too much on their children's studies, to the point that they do not let them help with housework.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2015·12·S1", "idx": 2, "cn": "他们对孩子的首要要求就是努力学习，考得好，能上名牌大学。", "en": "Their most important requirement for their children is to study hard, get good grades, and be admitted to prestigious universities.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2015·12·S1", "idx": 3, "cn": "他们相信这是为孩子好，因为在中国这样竞争激烈的社会里，只有成绩好才能保证前途光明。", "en": "They believe this is for their children's good, because in a society as competitive as China's, only good grades can guarantee a bright future.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 4, "set": "CET4 2015·12·S1", "idx": 4, "cn": "中国父母还认为，如果孩子能在社会上取得大的成就，父母就会受到尊敬。", "en": "Chinese pare
