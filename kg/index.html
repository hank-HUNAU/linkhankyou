受中国人喜爱，但现在已不只是消暑纳凉的工具，而更多地作为艺术品供人欣赏。", "en": "Fans have been deeply loved by the Chinese since ancient times, but today they are no longer merely tools for cooling off, serving more as works of art for people to appreciate.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2024.06 第3套", "idx": 2, "cn": "许多扇子造型优美、做工精良，并绘有山水、花鸟、人物等精美图案，具有很高的艺术价值。", "en": "Many fans are beautifully shaped and exquisitely made, and are painted with fine designs such as landscapes, flowers and birds, and figures, so they have high artistic value.", "cls": "B", "sid": "u1_s7", "pid": "u1_s7_p3", "sec": "绘画", "cov": 0.15, "hits": ["山水"]}, {"ch": 3, "set": "CET6 2024.06 第3套", "idx": 3, "cn": "中国许多著名画家和书法家喜欢在扇子上作诗绘画，展示其艺术品味。", "en": "Many famous Chinese painters and calligraphers like to compose poems and paint on fans, displaying their artistic taste.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2024.06 第3套", "idx": 4, "cn": "扇子常作为礼物赠予他人，表达美好的祝福和真挚的情感。", "en": "Fans are often given to others as gifts to express good wishes and sincere feelings.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2024.06 第3套", "idx": 5, "cn": "如今，扇子的实用功能已大为减弱，但作为一种文化符号和艺术形式，扇子仍然在中国传统文化中扮演着重要角色。", "en": "Today, the practical function of fans has been greatly weakened, but as a cultural symbol and art form, the fan still plays an important role in traditional Chinese culture.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2014.12 第1套", "idx": 1, "cn": "反映在艺术和文学中的乡村生活理想是中国文明的重要特征。", "en": "The ideal of rural life reflected in art and literature is an important feature of Chinese civilization.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2014.12 第1套", "idx": 2, "cn": "这在很大程度上归功于道家（Taoist) 对自然的情感。", "en": "This is to a great extent due to the Taoists' affection for nature.", "cls": "B", "sid": "u1_s7", "pid": "u1_s7_p4", "sec": "绘画", "cov": 0.12, "hits": ["道家"]}, {"ch": 3, "set": "CET6 2014.12 第1套", "idx": 3, "cn": "传统中国画有两个最受青睐的主题，一是家庭生活的各种幸福场景，画中往往有老人在饮茶下棋，男人在耕耘收割，妇女在织布缝衣，小孩在户外玩耍。", "en": "Traditional Chinese painting has two most favored themes. One is the various happy scenes of family life, in which there are often old people drinking tea and playing chess, men plowing and harvesting, women weaving and sewing, and children playing outdoors.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2014.12 第1套", "idx": 4, "cn": "另一个则是乡村生活的种种乐趣，画有渔夫在湖上打渔，农夫在山上欲柴采药，或是书生坐在松树下呤诗作画。", "en": "The other is the many pleasures of rural life, depicting fishermen fishing on the lake, farmers gathering firewood and herbs in the mountains, or scholars sitting under pine trees composing poems and painting.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2014.12 第1套", "idx": 5, "cn": "这两个主题可以分别代表儒家 (Confucian)和道家的生活理想。", "en": "These two themes can respectively represent the Confucian and Taoist ideals of life.", "cls": "B", "sid": "u1_s7", "pid": "u1_s7_p4", "sec": "绘画", "cov": 0.15, "hits": ["道家"]}, {"ch": 3, "set": "CET6 2019.12 第1套", "idx": 1, "cn": "牡丹(peony)花色艳丽,形象高雅,象征着和平与繁荣,因而在中国被称为“花中之王”。", "en": "The peony is gorgeous in color and elegant in appearance, symbolizing peace and prosperity, and thus it is known in China as the \"king of flowers.\"", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第1套", "idx": 2, "cn": "中国许多地方都培育和种植牡丹。", "en": "Peonies are cultivated and grown in many parts of China.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第1套", "idx": 3, "cn": "千百年来，创作了许多诗歌和绘画赞美牡丹。", "en": "Over the centuries, many poems and paintings have been created to praise the peony.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第1套", "idx": 4, "cn": "唐代时期,牡丹在皇家园林普遍种植并被誉为国花,因而特别风行。", "en": "In the Tang Dynasty, peonies were widely planted in imperial gardens and were honored as the national flower, and thus became especially popular.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第1套", "idx": 5, "cn": "十世纪时,洛阳古城成为牡丹栽培中心,而且这一地位一直保持到今天。", "en": "In the tenth century, the ancient city of Luoyang became the center of peony cultivation, and this status has been maintained to this day.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第1套", "idx": 6, "cn": "现在，成千上万的国内外游客蜂拥到洛阳参加一年一度的牡丹节,欣赏洛阳牡丹的独特之美,同时探索九朝古都的历史。", "en": "Today, tens of thousands of tourists from home and abroad flock to Luoyang for the annual Peony Culture Festival, admiring the unique beauty of Luoyang peonies while exploring the history of this ancient capital of nine dynasties.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第2套", "idx": 1, "cn": "梅花(plumblossom)位居中国十大名花之首,源于中国南方,已有三千多年的栽培和种植历史。", "en": "The plum blossom, which ranks first among China's ten most famous flowers, originated in southern China and has a history of more than 3,000 years of cultivation and planting.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第2套", "idx": 2, "cn": "隆冬时节，五颜六色的梅花不畏严寒，迎着风雪傲然绽放。", "en": "In the depths of winter, the colorful plum blossoms bloom proudly in the snow and wind, undaunted by the severe cold.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第2套", "idx": 3, "cn": "在中国传统文化中，梅花象征着坚强、纯洁、高雅，激励人们不畏艰难、砥砺前行。", "en": "In traditional Chinese culture, the plum blossom symbolizes strength, purity and elegance, inspiring people to brave hardships and forge ahead.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第2套", "idx": 4, "cn": "自古以来，许多诗人和画家从梅花中获取灵感,创作了无数不朽的作品。", "en": "Since ancient times, many poets and painters have drawn inspiration from the plum blossom and created countless immortal works.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第2套", "idx": 5, "cn": "普通大众也都喜爱梅花,春节期间常用于家庭装饰。", "en": "Ordinary people also love the plum blossom, and it is often used to decorate homes during the Spring Festival.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第2套", "idx": 6, "cn": "南京市已将梅花定为市花,每年举办梅花节,成千上万的人冒着严寒到梅花山踏雪赏梅", "en": "Nanjing has designated the plum blossom as its city flower and holds a Plum Blossom Festival every year, when tens of thousands of people brave the severe cold to visit Plum Blossom Hill and enjoy the blossoms in the snow.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第3套", "idx": 1, "cn": "荷花(lotusflower)是中国的名花之一,深受人们喜爱。", "en": "The lotus, one of China's famous flowers, is deeply loved by people.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第3套", "idx": 2, "cn": "中国许多地方的湖泊和池塘都适宜荷花生长。", "en": "The lakes and ponds in many parts of China are all suitable for the growth of lotus.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第3套", "idx": 3, "cn": "荷花色彩鲜艳，夏日清晨绽放，夜晚闭合，花期长达两三个月，吸引来自各地的游客前往观赏。", "en": "The lotus is bright in color; it blooms in the early morning and closes at night in summer, and its flowering period lasts as long as two or three months, attracting tourists from all over to admire it.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第3套", "idx": 4, "cn": "荷花具有多种功能，既能绿化水面，又能美化庭园，还可净化水质、减少污染、改善环境。", "en": "The lotus has many functions: it can green the water surface, beautify gardens, purify water, reduce pollution and improve the environment.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第3套", "idx": 5, "cn": "荷花迎骄阳而不惧，出污泥而不染，象征纯洁、高雅，常常用来比喻人的高尚品德，历来是诗人画家创作的重要题材。", "en": "Braving the scorching sun without fear and emerging unstained from the mud, the lotus symbolizes purity and elegance. It is often used to describe a person's noble character and has long been an important subject for poets and painters.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2019.12 第3套", "idx": 6, "cn": "荷花盛开的地方也是许多摄影爱好者经常光顾之地。", "en": "Places where lotuses bloom in profusion are also frequented by many photography enthusiasts.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}]}</script>
<script>
const G=JSON.parse(document.getElementById('data').textContent);
const N=G.nodes, L=G.links, SENT=G.sents||[], CHS=G.chapters||[];
const byId=new Map(N.map(n=>[n.id,n]));
const adj=new Map(); N.forEach(n=>adj.set(n.id,[]));
L.forEach(l=>{ if(adj.has(l.s)&&adj.has(l.t)){ adj.get(l.s).push({id:l.t,type:l.type,w:l.w}); adj.get(l.t).push({id:l.s,type:l.type,w:l.w}); }});
// 句索引
const secS=new Map(), conS=new Map(), setS=new Map();
SENT.forEach(s=>{
  if(s.sid){ const k=s.ch+':'+s.sid; (secS.get(k)||secS.set(k,[]).get(k)).push(s); }
  (setS.get(s.set)||setS.set(s.set,[]).get(s.set)).push(s);
});
const byCh=c=>N.filter(n=>n.ch===c);
const st={view:'chapter',ch:4,sel:null,hover:null,k:1,tx:0,ty:0};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1,VIS=[],VL=[];
function resize(){DPR=window.devicePixelRatio||1;cv.width=cv.clientWidth*DPR;cv.height=cv.clientHeight*DPR;}
const COL={chapter:'#2f5d8f',unit:'#4a86b8',concept:'#8a5cd6',exam_set:'#d94b4b'};
const R0={chapter:22,unit:14,section:5.5,concept:6.5,exam_set:4.5};
function colorOf(n){
  if(n.type==='section') return n.sent>0?'#e08a3c':'#8fa3b8';
  return COL[n.type]||'#8fa3b8';
}
/* ── 章内布局：椭圆比例扇区 + 径向分层（节多则自动扩圈） ── */
let GEO={cx:0,cy:0,rx:600,ry:380};
function pt(a,f){return {x:GEO.cx+Math.cos(a)*GEO.rx*f, y:GEO.cy+Math.sin(a)*GEO.ry*f};}
function layoutChapter(ch){
  const W=cv.clientWidth,H=cv.clientHeight;
  GEO={cx:W/2, cy:H/2, rx:Math.min(W*0.38,600), ry:Math.min(H*0.36,340)};
  const chn=byId.get('c'+ch);
  if(chn){chn.x=GEO.cx;chn.y=GEO.cy;chn._a=0;}
  const units=byCh(ch).filter(n=>n.type==='unit');
  const secs=byCh(ch).filter(n=>n.type==='section');
  const total=secs.length||1;
  let a=-Math.PI/2;
  units.forEach((u,ui)=>{
    u._L=ui+1;
    const uid=u.id.split('_').slice(1).join('_');
    const mine=secs.filter(s=>s.unit===uid);
    if(!mine.length){ const p=pt(a,0.30); u.x=p.x;u.y=p.y;u._a=a; a+=0.18; return; }
    const span=2*Math.PI*(mine.length/total);
    mine.forEach((sec,i)=>{
      const ang=a+span*(i+0.5)/mine.length;
      const ring=Math.floor(i/11);
      const p=pt(ang, 0.56+ring*0.17);
      sec.x=p.x; sec.y=p.y; sec._a=ang; sec._f=0.56+ring*0.17;
    });
    const mid=a+span/2; u._a=mid; const p=pt(mid,0.30); u.x=p.x; u.y=p.y;
    a+=span;
  });
  const cons=byCh(ch).filter(n=>n.type==='concept').map(c=>{
    const ns=(adj.get(c.id)||[]).filter(e=>e.id.startsWith('s'+ch+':')).map(e=>byId.get(e.id)).filter(Boolean);
    c._ang = ns.length? ns.reduce((t,e)=>t+(e._a||0),0)/ns.length : (Math.random()-.5)*6.28;
    return c;
  }).sort((a,b)=>a._ang-b._ang);
  cons.forEach((c,i)=>{ const f=0.84+(i%4)*0.072; const p=pt(c._ang,f); c.x=p.x;c.y=p.y;c._a=c._ang; });
  const sets=byCh(ch).filter(n=>n.type==='exam_set').map(t=>{
    const ns=(adj.get(t.id)||[]).filter(e=>e.id.startsWith('s'+ch+':')).map(e=>byId.get(e.id)).filter(Boolean);
    t._ang = ns.length? ns.reduce((x,e)=>x+(e._a||0),0)/ns.length : (Math.random()-.5)*6.28;
    return t;
  }).sort((a,b)=>a._ang-b._ang);
  sets.forEach((t,i)=>{ const f=1.14+(i%2)*0.09; const p=pt(t._ang,f); t.x=p.x;t.y=p.y;t._a=t._ang; });
}
/* ── 全局布局：13 章环 ── */
function layoutGlobal(){
  const W=cv.clientWidth,H=cv.clientHeight,cx=W/2,cy=H/2,R=Math.min(W,H)*0.34;
  GEO={cx:cx,cy:cy,rx:R,ry:R};
  CHS.forEach((c,i)=>{
    const n=byId.get('c'+c.ch); if(!n) return;
    const a=-Math.PI/2+i*2*Math.PI/CHS.length;
    n.x=cx+Math.cos(a)*R; n.y=cy+Math.sin(a)*R; n._a=a;
  });
}
function visible(){
  if(st.view==='global'){
    const ids=new Set(CHS.map(c=>'c'+c.ch));
    VIS=N.filter(n=>ids.has(n.id));
    VL=(G.chapter_links||[]).map(l=>({s:l.s,t:l.t,type:'chapter_link',w:l.w}));
  }else{
    const ch=st.ch;
    const con=new Set(byCh(ch).map(n=>n.id));
    // 关联真题套（通过章内节落点）
    L.forEach(l=>{ if(l.type==='exam_lands'&&con.has(l.s)) con.add(l.t); });
    // 跨章概念（该概念也连到本章节）
    VIS=N.filter(n=>con.has(n.id));
    VL=L.filter(l=>con.has(l.s)&&con.has(l.t));
  }
  document.getElementById('stat').textContent=`节点 ${VIS.length} · 关系 ${VL.length}`;
}
/* ── 绘制 ── */
function draw(){
  const W=cv.clientWidth,H=cv.clientHeight;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2+st.tx,H/2+st.ty); ctx.scale(st.k,st.k); ctx.translate(-W/2,-H/2);
  // 边
  VL.forEach(l=>{
    const a=byId.get(l.s),b=byId.get(l.t); if(!a||!b) return;
    const hl=st.sel&&(l.s===st.sel||l.t===st.sel);
    let col='#d7dde5',w=1;
    if(l.type==='exam_lands'){col=hl?'rgba(224,138,60,.95)':'rgba(224,138,60,.5)';w=Math.min(3,(l.w||1)*0.7);}
    else if(l.type==='has_concept'){col=hl?'rgba(138,92,214,.9)':'rgba(138,92,214,.28)';w=1.2;}
    else if(l.type==='uses_concept'){col=hl?'rgba(217,75,75,.8)':'rgba(217,75,75,.22)';w=1;}
    else if(l.type==='has_unit'||l.type==='has_section'){col=hl?'#aebdcd':'#eef1f5';w=1.3;}
    else if(l.type==='chapter_link'){col='rgba(138,92,214,.35)';w=Math.min(4,(l.w||1)*0.8);}
    ctx.strokeStyle=col; ctx.lineWidth=w/st.k;
    ctx.setLineDash(l.type==='has_concept'?[4/st.k,3/st.k]:[]);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });
  ctx.setLineDash([]);
  // 节点
  VIS.forEach(n=>{
    const r=(R0[n.type]||5)*(n.type==='chapter'?1+Math.min(1,(n.sent||0)/200):1);
    const dim=st.sel&&st.sel!==n.id&&!(adj.get(st.sel)||[]).some(e=>e.id===n.id);
    ctx.globalAlpha=dim?0.22:1;
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,6.2832);
    ctx.fillStyle=colorOf(n); ctx.fill();
    if(n.type==='section'&&n.sent===0){ctx.strokeStyle='#b9c4d2';ctx.lineWidth=1.2/st.k;ctx.stroke();}
    if(n.type==='chapter'){ctx.strokeStyle='#1e3f61';ctx.lineWidth=2/st.k;ctx.stroke();}
    if(n.type==='unit'){ctx.strokeStyle='#fff';ctx.lineWidth=2.4/st.k;ctx.stroke();}
    // 标签
    const show=(n.type==='chapter')||(n.type==='unit')||(n.type==='section')||
               (n.type==='concept'&&st.k>0.75)||(n.type==='exam_set'&&st.k>1.15);
    if(show){
      ctx.globalAlpha=dim?0.25:1;
      let fs=(n.type==='chapter'?12.5:(n.type==='unit'?11.5:(n.type==='section'?10:9)));
      ctx.font=`${n.type==='chapter'||n.type==='unit'?'700 ':''}${fs}px system-ui,sans-serif`;
      ctx.fillStyle=n.type==='chapter'?'#1d2129':(n.type==='unit'?'#2c6a9e':(n.type==='section'?'#4a5361':'#5b6472'));
      let txt = n.label;
      if(n.type==='unit'&&n._L) txt = 'L'+n._L+' · '+txt;
      if(n.type==='exam_set') txt = txt.replace(/^CET[46] /,'');
      const lim = (n.type==='exam_set')?18:13;
      txt = txt.length>lim ? txt.slice(0,lim-1)+'…' : txt;
      let yy=n.y-r-4, xx=n.x;
      const isLeaf=(n.type==='section'||n.type==='concept'||n.type==='exam_set');
      if(isLeaf&&n._a!==undefined&&st.view==='chapter'){
        const dx=Math.cos(n._a),dy=Math.sin(n._a);
        const off=r+7;
        xx=n.x+dx*off; yy=n.y+dy*off+3;
        ctx.textAlign=dx>0.25?'left':(dx<-0.25?'right':'center');
        ctx.textBaseline='middle';
        if(dx>0.25&&dx<0.9) { xx=n.x+dx*(r+6); yy=n.y+dy*(r+6); }
      }else{
        ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      }
      ctx.fillText(txt,xx,yy);
      ctx.textBaseline='alphabetic';
      if(n.type==='chapter'&&st.view==='global'){
        ctx.fillStyle='#8b95a3';ctx.font='10px system-ui,sans-serif';
        ctx.fillText(n.sent+' 句 · 依据 '+Math.round((n.cov||0)*100)+'%',n.x,yy-14);
      }
      if(n.type==='section'&&n.sent>0&&st.k>0.9){
        ctx.fillStyle='#b4703a';ctx.font='9px system-ui,sans-serif';
        ctx.textAlign='center'; ctx.fillText(n.sent+'句',n.x,n.y-r-15);
      }
    }
    ctx.globalAlpha=1;
  });
  ctx.restore();
}
/* ── 交互 ── */
function toWorld(ev){
  const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
  return {x:(mx-cv.clientWidth/2-st.tx)/st.k+cv.clientWidth/2,y:(my-cv.clientHeight/2-st.ty)/st.k+cv.clientHeight/2};
}
function pick(p){
  let best=null,bd=1e9;
  VIS.forEach(n=>{const d=Math.hypot(n.x-p.x,n.y-p.y);const lim=(R0[n.type]||6)+8/st.k;if(d<lim&&d<bd){bd=d;best=n;}});
  return best;
}
let drag=null,moved=0;
cv.addEventListener('mousedown',ev=>{drag=toWorld(ev);moved=0;cv.classList.add('drag');});
cv.addEventListener('mousemove',ev=>{
  if(drag){st.tx+=ev.movementX;st.ty+=ev.movementY;moved++;return;}
  const h=pick(toWorld(ev));
  if((h&&h.id)!==(st.hover&&st.hover.id)){st.hover=h;cv.title=h?(h.label+(h.en?' · '+h.en:'')):'';cv.style.cursor=h?'pointer':'grab';}
});
window.addEventListener('mouseup',ev=>{
  if(drag&&moved<4){const n=pick(toWorld(ev)); if(n)select(n.id); else {st.sel=null;document.getElementById('side').classList.add('hide');} }
  drag=null;cv.classList.remove('drag');
});
cv.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
  const f=ev.deltaY<0?1.12:0.89, k2=Math.min(4,Math.max(.35,st.k*f));
  st.tx-=(mx-cv.clientWidth/2-st.tx)*(k2/st.k-1);
  st.ty-=(my-cv.clientHeight/2-st.ty)*(k2/st.k-1);
  st.k=k2;
},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){st.sel=null;document.getElementById('side').classList.add('hide');}});
/* ── 侧栏 ── */
const side=document.getElementById('side');
const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const LVCOL={A:'#2fa84f',B:'#3d7fd6',C:'#e08a3c',D:'#9aa4b2',E:'#c9ced6'};
function sentHTML(list,limit){
  if(!list||!list.length) return '<div class="mini">无</div>';
  return list.slice(0,limit||8).map(s=>`<div class="sent"><span class="tag" style="background:${LVCOL[s.cls]||'#ccc'}">${s.cls}</span><span class="mini">${esc(s.set)}</span><div class="cn">${esc(s.cn)}</div><div class="en">${esc(s.en)}</div></div>`).join('')
    +(list.length>(limit||8)?`<div class="mini" style="padding-top:6px">还有 ${list.length-(limit||8)} 句…</div>`:'');
}
function select(id){
  st.sel=id; const n=byId.get(id); if(!n) return;
  side.classList.remove('hide');
  let h='';
  if(n.type==='chapter'){
    h+=`<div class="card"><h3>${esc(n.en||'')} ${esc(n.label)}</h3>
      <div class="kv"><span>真题套</span><b>${n.sets}</b></div>
      <div class="kv"><span>句子</span><b>${n.sent}</b></div>
      <div class="kv"><span>被考到的节</span><b>${n.secs}</b></div>
      <div class="kv"><span>教材依据 A+B</span><b>${Math.round((n.cov||0)*100)}%</b></div>
      <div class="bar">${['A','B','C','D','E'].map(k=>`<i style="width:${(n[k]||0)/Math.max(1,n.sent)*100}%;background:${LVCOL[k]}"></i>`).join('')}</div>
      <div class="kv"><span>A/B/C/D/E</span><b>${n.A}/${n.B}/${n.C}/${n.D}/${n.E}</b></div>
      <div style="margin-top:9px"><button onclick="gotoChapter(${n.ch})" style="width:100%;padding:7px;border-radius:8px;border:1px solid var(--line);background:#f4f8fd;cursor:pointer;font-size:12.5px">查看本章知识图谱 →</button></div></div>`;
    const us=(adj.get(id)||[]).filter(e=>e.type==='has_unit').map(e=>byId.get(e.id)).filter(Boolean);
    h+=`<div class="card"><h3>课次（${us.length}）</h3><div class="list">`+us.map(u=>`<div onclick="select('${u.id}')">${esc(u.label)} <span class="mini">${u.secs} 节</span></div>`).join('')+'</div></div>';
  }else if(n.type==='unit'){
    const secs=(adj.get(id)||[]).filter(e=>e.type==='has_section').map(e=>byId.get(e.id)).filter(Boolean);
    h+=`<div class="card"><h3>${esc(n.label)}</h3><div class="kv"><span>章</span><b>Ch${n.ch}</b></div>
      <div class="kv"><span>节数</span><b>${secs.length}</b></div>
      <div class="kv"><span>被考过的节</span><b>${secs.filter(s=>s.sent>0).length}</b></div></div>`;
    h+=`<div class="card"><h3>节（${secs.length}）</h3><div class="list">`+secs.map(s=>`<div onclick="select('${s.id}')">${esc(s.label)} <span class="mini">${s.sent>0?('考'+s.sent+'句'):'未考'}</span></div>`).join('')+'</div></div>';
  }else if(n.type==='section'){
    h+=`<div class="card"><h3>${esc(n.label)}</h3>
      <div class="kv"><span>章 / 课次</span><b>Ch${n.ch} · ${esc(n.unit||'')}</b></div>
      <div class="kv"><span>真题句数</span><b>${n.sent||0}</b></div>
      <div class="kv"><span>涉及套数</span><b>${n.land||0}</b></div>
      <div class="kv"><span>依据级别</span><b>${esc(n.lv||'—')}</b></div></div>`;
    const sets=(adj.get(id)||[]).filter(e=>e.type==='exam_lands').map(e=>byId.get(e.id)).filter(Boolean);
    if(sets.length) h+=`<div class="card"><h3>落点真题套（${sets.length}）</h3><div class="list">`+sets.map(s=>`<div onclick="select('${s.id}')">${esc(s.label)} <span class="mini">${s.sent} 句</span></div>`).join('')+'</div></div>';
    const cons=(adj.get(id)||[]).filter(e=>e.type==='has_concept').map(e=>byId.get(e.id)).filter(Boolean);
    if(cons.length) h+=`<div class="card"><h3>概念（${cons.length}）</h3><div class="list">`+cons.map(c=>`<div onclick="select('${c.id}')">${esc(c.label)} <span class="mini">${esc(c.en||'')}</span></div>`).join('')+'</div></div>';
    h+=`<div class="card"><h3>真题句</h3>${sentHTML(secS.get(n.ch+':'+n.sid),10)}</div>`;
  }else if(n.type==='concept'){
    const secs=(adj.get(id)||[]).filter(e=>e.type==='has_concept').map(e=>byId.get(e.id)).filter(Boolean);
    const sets=(adj.get(id)||[]).filter(e=>e.type==='uses_concept').map(e=>byId.get(e.id)).filter(Boolean);
    h+=`<div class="card"><h3>${esc(n.label)}</h3>
      <div class="kv"><span>英文</span><b>${esc(n.en||'—')}</b></div>
      <div class="kv"><span>来源</span><b>${esc(n.src||'')}</b></div>
      <div class="kv"><span>出现句数</span><b>${n.sent||0}</b></div>
      <div class="kv"><span>涉及节 / 套</span><b>${n.secs||0} / ${n.sets||0}</b></div></div>`;
    if(sets.length) h+=`<div class="card"><h3>用到该译名的真题套（${sets.length}）</h3><div class="list">`+sets.map(s=>`<div onclick="select('${s.id}')">${esc(s.label)}</div>`).join('')+'</div></div>';
    if(secs.length) h+=`<div class="card"><h3>教材节（${secs.length}）</h3><div class="list">`+secs.map(s=>`<div onclick="select('${s.id}')">${esc(s.label)} <span class="mini">Ch${s.ch} · 考${s.sent||0}</span></div>`).join('')+'</div></div>';
  }else if(n.type==='exam_set'){
    const secs=(adj.get(id)||[]).filter(e=>e.type==='exam_lands').map(e=>byId.get(e.id)).filter(Boolean);
    h+=`<div class="card"><h3>${esc(n.label)}</h3>
      <div class="kv"><span>归属章</span><b>Ch${n.ch}</b></div>
      <div class="kv"><span>句数</span><b>${n.sent||0}</b></div>
      <div class="kv"><span>落在教材节</span><b>${secs.length}</b></div></div>`;
    if(secs.length) h+=`<div class="card"><h3>教材落点（${secs.length}）</h3><div class="list">`+secs.map(s=>`<div onclick="select('${s.id}')">${esc(s.label)} <span class="mini">考${s.sent}句</span></div>`).join('')+'</div></div>';
    h+=`<div class="card"><h3>句子</h3>${sentHTML(setS.get(n.label),6)}</div>`;
  }
  side.innerHTML=h;
}
window.select=select;
/* ── 视图切换 ── */
function gotoChapter(ch){
  st.view='chapter'; st.ch=ch; st.k=1; st.tx=0; st.ty=0; st.sel=null;
  renderChips(); visible(); layoutChapter(ch);
  side.classList.add('hide');
  document.getElementById('hint').textContent='Ch'+ch+' 知识图谱 · 橙实心＝被真题考过的节';
  draw();
}
window.gotoChapter=gotoChapter;
function renderChips(){
  const box=document.getElementById('chips');
  let h=`<button class="chip g ${st.view==='global'?'on':''}" data-c="g">全局</button>`;
  h+=CHS.map(c=>`<button class="chip ${st.view==='chapter'&&st.ch===c.ch?'on':''}" data-c="${c.ch}" title="${c.sub} · ${c.sent} 句 · 依据 ${Math.round(c.cov*100)}%">${c.ch===0?'Overview':'Ch'+c.ch}</button>`).join('');
  box.innerHTML=h;
  box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const v=b.dataset.c;
    if(v==='g'){ st.view='global'; st.ch=null; st.k=1; st.tx=0; st.ty=0; st.sel=null; renderChips(); visible(); layoutGlobal(); side.classList.add('hide'); document.getElementById('hint').textContent='全局视图 · 点章进入该章图谱'; draw(); }
    else gotoChapter(+v);
  });
}
/* ── 搜索 ── */
const qEl=document.getElementById('q');
qEl.oninput=()=>{
  const q=qEl.value.trim(); if(!q) return;
  const hit=N.find(n=>n.label.includes(q)||(n.en||'').toLowerCase().includes(q.toLowerCase()));
  if(!hit) return;
  if(hit.ch==null) return;
  if(st.view!=='chapter'||st.ch!==hit.ch) gotoChapter(hit.ch);
  const n=byId.get(hit.id);
  setTimeout(()=>{
    st.k=Math.max(1,Math.min(2.2,1.4));
    st.tx=cv.clientWidth/2-n.x*st.k-(cv.clientWidth/2-n.x)*0+0;
    st.ty=cv.clientHeight/2-n.y*st.k;
    st.tx=cv.clientWidth/2-n.x*st.k;
    select(hit.id); draw();
  },60);
};
qEl.onkeydown=e=>{if(e.key==='Escape'){qEl.value='';qEl.blur();}};
/* ── 启动 ── */
resize(); window.addEventListener('resize',()=>{resize();if(st.view==='chapter')layoutChapter(st.ch);else layoutGlobal();draw();});
renderChips(); visible(); layoutChapter(st.ch); draw();
try{const q=new URLSearchParams(location.search); if(q.has('ch')) gotoChapter(+q.get('ch'));}catch(e){}
</script>
