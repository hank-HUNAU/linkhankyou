": "戏曲", "cov": 0.18, "hits": ["戏曲"], "deg": 2}, {"id": "s:3:CET4 2019.06 第1套#1", "type": "sentence", "label": "舞狮作为中国传统民间表演已有 2,000 多年历史。", "ch": 3, "full": "舞狮作为中国传统民间表演已有 2,000 多年历史。", "en": "Lion dance, a traditional Chinese folk performance, has a history of more than 2,000 years.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET4 2019.06 第1套#2", "type": "sentence", "label": "在狮子舞中，两位表演者同披一件狮子服，一个舞动头部，另一个舞动身体和尾巴。", "ch": 3, "full": "在狮子舞中，两位表演者同披一件狮子服，一个舞动头部，另一个舞动身体和尾巴。", "en": "In the lion dance, two performers share a single lion costume, with one moving the head and the other moving the body and the tail.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET4 2019.06 第1套#3", "type": "sentence", "label": "他们熟练配合，模仿狮子的各种动作。", "ch": 3, "full": "他们熟练配合，模仿狮子的各种动作。", "en": "They coordinate skillfully to imitate the various movements of a lion.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET4 2019.06 第1套#4", "type": "sentence", "label": "狮子是兽中之王，象征幸福和好运，所以人们通常在春节和其他节日期间表演狮子舞。", "ch": 3, "full": "狮子是兽中之王，象征幸福和好运，所以人们通常在春节和其他节日期间表演狮子舞。", "en": "The lion is the king of beasts and symbolizes happiness and good luck, so people usually perform the lion dance during the Spring Festival and other festivals.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET4 2019.06 第1套#5", "type": "sentence", "label": "狮子舞也可能出现在其他重要场合，如商店开业和结婚典礼，往往吸引许多人观赏。", "ch": 3, "full": "狮子舞也可能出现在其他重要场合，如商店开业和结婚典礼，往往吸引许多人观赏。", "en": "The lion dance may also appear on other important occasions, such as shop openings and wedding ceremonies, often attracting many spectators.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET4 2019.06 第3套#1", "type": "sentence", "label": "剪纸是中国民间艺术的一种独特形式，已有 2,000 多年历年。", "ch": 3, "full": "剪纸是中国民间艺术的一种独特形式，已有 2,000 多年历年。", "en": "Paper-cutting is a s": "B", "pid": "u1_s7_p3", "sid": "u1_s7", "sec": "绘画", "cov": 0.1, "hits": ["印章"], "deg": 2}, {"id": "s:3:CET6 2022.09 第2套#2", "type": "sentence", "label": "印章不仅具有实用性，而且也是一种艺术形式，是一门集书法与雕刻于一体的古老艺术，经", "ch": 3, "full": "印章不仅具有实用性，而且也是一种艺术形式，是一门集书法与雕刻于一体的古老艺术，经常被看作与书画并列的独立艺术品。", "en": "Seals are not only practical but also a form of art — an ancient art that combines calligraphy and carving, and they are often regarded as independent works of art that stand alongside calligraphy and painting.", "cls": "B", "pid": "u1_s7_p3", "sid": "u1_s7", "sec": "绘画", "cov": 0.06, "hits": ["印章"], "deg": 2}, {"id": "s:3:CET6 2022.09 第2套#3", "type": "sentence", "label": "印章从材料的选择、制作的工艺到字体的设计，都具有极其丰富的美学表现。", "ch": 3, "full": "印章从材料的选择、制作的工艺到字体的设计，都具有极其丰富的美学表现。", "en": "From the choice of materials and the craft of production to the design of the characters, seals display extremely rich aesthetic expression.", "cls": "B", "pid": "u1_s7_p3", "sid": "u1_s7", "sec": "绘画", "cov": 0.03, "hits": ["印章"], "deg": 2}, {"id": "s:3:CET6 2022.09 第2套#4", "type": "sentence", "label": "其他国家的艺术家通常在其绘画作品上签名，而中国艺术家则往往在其书画作品上盖上印章", "ch": 3, "full": "其他国家的艺术家通常在其绘画作品上签名，而中国艺术家则往往在其书画作品上盖上印章代替签名。", "en": "Artists in other countries usually sign their paintings, while Chinese artists often stamp a seal on their paintings and calligraphy instead of signing.", "cls": "B", "pid": "u1_s7_p3", "sid": "u1_s7", "sec": "绘画", "cov": 0.17, "hits": ["印章"], "deg": 2}, {"id": "s:3:CET6 2022.09 第2套#5", "type": "sentence", "label": "这样，印章也就成为作品的组成部分，是体现作品独特性的一种方式。", "ch": 3, "full": "这样，印章也就成为作品的组成部分，是体现作品独特性的一种方式。", "en": "In this way, the seal also becomes part of the work and a way of expressing its uniqueness.", "cls": "B", "pid": "u1_s7_p3", "sid": "u1_s7", "sec": "绘画", "cov": 0.12, "hits": ["印章"], "deg": 2}, {"id": "s:3:CET6 2024.06 第3套#1", "type": "sentence", "label": "扇子自古以来就深受中国人喜爱，但现在已不只是消暑纳凉的工具，而更多地作为艺术品供", "ch": 3, "full": "扇子自古以来就深受中国人喜爱，但现在已不只是消暑纳凉的工具，而更多地作为艺术品供人欣赏。", "en": "Fans have been deeply loved by the Chinese since ancient times, but today they are no longer merely tools for cooling off, serving more as works of art for people to appreciate.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2024.06 第3套#2", "type": "sentence", "label": "许多扇子造型优美、做工精良，并绘有山水、花鸟、人物等精美图案，具有很高的艺术价值", "ch": 3, "full": "许多扇子造型优美、做工精良，并绘有山水、花鸟、人物等精美图案，具有很高的艺术价值。", "en": "Many fans are beautifully shaped and exquisitely made, and are painted with fine designs such as landscapes, flowers and birds, and figures, so they have high artistic value.", "cls": "B", "pid": "u1_s7_p3", "sid": "u1_s7", "sec": "绘画", "cov": 0.15, "hits": ["山水"], "deg": 2}, {"id": "s:3:CET6 2024.06 第3套#3", "type": "sentence", "label": "中国许多著名画家和书法家喜欢在扇子上作诗绘画，展示其艺术品味。", "ch": 3, "full": "中国许多著名画家和书法家喜欢在扇子上作诗绘画，展示其艺术品味。", "en": "Many famous Chinese painters and calligraphers like to compose poems and paint on fans, displaying their artistic taste.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2024.06 第3套#4", "type": "sentence", "label": "扇子常作为礼物赠予他人，表达美好的祝福和真挚的情感。", "ch": 3, "full": "扇子常作为礼物赠予他人，表达美好的祝福和真挚的情感。", "en": "Fans are often given to others as gifts to express good wishes and sincere feelings.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2024.06 第3套#5", "type": "sentence", "label": "如今，扇子的实用功能已大为减弱，但作为一种文化符号和艺术形式，扇子仍然在中国传统", "ch": 3, "full": "如今，扇子的实用功能已大为减弱，但作为一种文化符号和艺术形式，扇子仍然在中国传统文化中扮演着重要角色。", "en": "Today, the practical function of fans has been greatly weakened, but as a cultural symbol and art form, the fan still plays an important role in traditional Chinese culture.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2014.12 第1套#1", "type": "sentence", "label": "反映在艺术和文学中的乡村生活理想是中国文明的重要特征。", "ch": 3, "full": "反映在艺术和文学中的乡村生活理想是中国文明的重要特征。", "en": "The ideal of rural life reflected in art and literature is an important feature of Chinese civilization.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2014.12 第1套#2", "type": "sentence", "label": "这在很大程度上归功于道家（Taoist) 对自然的情感。", "ch": 3, "full": "这在很大程度上归功于道家（Taoist) 对自然的情感。", "en": "This is to a great extent due to the Taoists' affection for nature.", "cls": "B", "pid": "u1_s7_p4", "sid": "u1_s7", "sec": "绘画", "cov": 0.12, "hits": ["道家"], "deg": 2}, {"id": "s:3:CET6 2014.12 第1套#3", "type": "sentence", "label": "传统中国画有两个最受青睐的主题，一是家庭生活的各种幸福场景，画中往往有老人在饮茶", "ch": 3, "full": "传统中国画有两个最受青睐的主题，一是家庭生活的各种幸福场景，画中往往有老人在饮茶下棋，男人在耕耘收割，妇女在织布缝衣，小孩在户外玩耍。", "en": "Traditional Chinese painting has two most favored themes. One is the various happy scenes of family life, in which there are often old people drinking tea and playing chess, men plowing and harvesting, women weaving and sewing, and children playing outdoors.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2014.12 第1套#4", "type": "sentence", "label": "另一个则是乡村生活的种种乐趣，画有渔夫在湖上打渔，农夫在山上欲柴采药，或是书生坐", "ch": 3, "full": "另一个则是乡村生活的种种乐趣，画有渔夫在湖上打渔，农夫在山上欲柴采药，或是书生坐在松树下呤诗作画。", "en": "The other is the many pleasures of rural life, depicting fishermen fishing on the lake, farmers gathering firewood and herbs in the mountains, or scholars sitting under pine trees composing poems and painting.", "cls": "E", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2014.12 第1套#5", "type": "sentence", "label": "这两个主题可以分别代表儒家 (Confucian)和道家的生活理想。", "ch": 3, "full": "这两个主题可以分别代表儒家 (Confucian)和道家的生活理想。", "en": "These two themes can respectively represent the Confucian and Taoist ideals of life.", "cls": "B", "pid": "u1_s7_p4", "sid": "u1_s7", "sec": "绘画", "cov": 0.15, "hits": ["道家"], "deg": 2}, {"id": "s:3:CET6 2019.12 第1套#1", "type": "sentence", "label": "牡丹(peony)花色艳丽,形象高雅,象征着和平与繁荣,因而在中国被称为“花中之", "ch": 3, "full": "牡丹(peony)花色艳丽,形象高雅,象征着和平与繁荣,因而在中国被称为“花中之王”。", "en": "The peony is gorgeous in color and elegant in appearance, symbolizing peace and prosperity, and thus it is known in China as the \"king of flowers.\"", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2019.12 第1套#2", "type": "sentence", "label": "中国许多地方都培育和种植牡丹。", "ch": 3, "full": "中国许多地方都培育和种植牡丹。", "en": "Peonies are cultivated and grown in many parts of China.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2019.12 第1套#3", "type": "sentence", "label": "千百年来，创作了许多诗歌和绘画赞美牡丹。", "ch": 3, "full": "千百年来，创作了许多诗歌和绘画赞美牡丹。", "en": "Over the centuries, many poems and paintings have been created to praise the peony.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2019.12 第1套#4", "type": "sentence", "label": "唐代时期,牡丹在皇家园林普遍种植并被誉为国花,因而特别风行。", "ch": 3, "full": "唐代时期,牡丹在皇家园林普遍种植并被誉为国花,因而特别风行。", "en": "In the Tang Dynasty, peonies were widely planted in imperial gardens and were honored as the national flower, and thus became especially popular.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2019.12 第1套#5", "type": "sentence", "label": "十世纪时,洛阳古城成为牡丹栽培中心,而且这一地位一直保持到今天。", "ch": 3, "full": "十世纪时,洛阳古城成为牡丹栽培中心,而且这一地位一直保持到今天。", "en": "In the tenth century, the ancient city of Luoyang became the center of peony cultivation, and this status has been maintained to this day.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2019.12 第1套#6", "type": "sentence", "label": "现在，成千上万的国内外游客蜂拥到洛阳参加一年一度的牡丹节,欣赏洛阳牡丹的独特之美", "ch": 3, "full": "现在，成千上万的国内外游客蜂拥到洛阳参加一年一度的牡丹节,欣赏洛阳牡丹的独特之美,同时探索九朝古都的历史。", "en": "Today, tens of thousands of tourists from home and abroad flock to Luoyang for the annual Peony Culture Festival, admiring the unique beauty of Luoyang peonies while exploring the history of this ancient capital of nine dynasties.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2019.12 第2套#1", "type": "sentence", "label": "梅花(plumblossom)位居中国十大名花之首,源于中国南方,已有三千多年的", "ch": 3, "full": "梅花(plumblossom)位居中国十大名花之首,源于中国南方,已有三千多年的栽培和种植历史。", "en": "The plum blossom, which ranks first among China's ten most famous flowers, originated in southern China and has a history of more than 3,000 years of cultivation and planting.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2019.12 第2套#2", "type": "sentence", "label": "隆冬时节，五颜六色的梅花不畏严寒，迎着风雪傲然绽放。", "ch": 3, "full": "隆冬时节，五颜六色的梅花不畏严寒，迎着风雪傲然绽放。", "en": "In the depths of winter, the colorful plum blossoms bloom proudly in the snow and wind, undaunted by the severe cold.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2019.12 第2套#3", "type": "sentence", "label": "在中国传统文化中，梅花象征着坚强、纯洁、高雅，激励人们不畏艰难、砥砺前行。", "ch": 3, "full": "在中国传统文化中，梅花象征着坚强、纯洁、高雅，激励人们不畏艰难、砥砺前行。", "en": "In traditional Chinese culture, the plum blossom symbolizes strength, purity and elegance, inspiring people to brave hardships and forge ahead.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2019.12 第2套#4", "type": "sentence", "label": "自古以来，许多诗人和画家从梅花中获取灵感,创作了无数不朽的作品。", "ch": 3, "full": "自古以来，许多诗人和画家从梅花中获取灵感,创作了无数不朽的作品。", "en": "Since ancient times, many poets and painters have drawn inspiration from the plum blossom and created countless immortal works.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2019.12 第2套#5", "type": "sentence", "label": "普通大众也都喜爱梅花,春节期间常用于家庭装饰。", "ch": 3, "full": "普通大众也都喜爱梅花,春节期间常用于家庭装饰。", "en": "Ordinary people also love the plum blossom, and it is often used to decorate homes during the Spring Festival.", "cls": "C", "pid": "", "sid": "", "sec": "", "cov": 0, "hits": [], "deg": 1}, {"id": "s:3:CET6 2019.12 第2套#6", "type": "sentence", "label": "南京市已将梅花定为市花,每年举办梅花节,成千上万的人冒着严寒到梅花山踏雪赏梅", "ch":       const es = (adj.get(n.id)||[]).find(e => e.id.startsWith('set:'));
      if (es){ const sn = byId.get(es.id); if (sn && sn.ch!=null) c = sn.ch; }
    }
    if (c == null) c = 0;
    (chTerms[c] = chTerms[c] || []).push(n);
  });
  Object.keys(chSets).forEach(k => chSets[k].sort((a,b) => (b.sent||0)-(a.sent||0)));
  Object.keys(chTerms).forEach(k => chTerms[k].sort((a,b) => (b.deg||0)-(a.deg||0)));
  // 章位置（内环）
  for (let i=0;i<13;i++){
    const a = A0 + i*STEP;
    chPosCache['ch'+i] = { x: cx+Math.cos(a)*R*0.42, y: cy+Math.sin(a)*R*0.42, a };
  }
  // 套（中环，扇区内均分）
  Object.keys(chSets).forEach(k => {
    const arr = chSets[k], base = chPosCache['ch'+k];
    if (!base) return;
    const span = STEP*0.62, n = arr.length;
    arr.forEach((n_,i) => {
      const a = base.a + (n===1 ? 0 : -span/2 + span*i/(n-1));
      n_.x = cx + Math.cos(a)*R*0.62; n_.y = cy + Math.sin(a)*R*0.62;
      n_.home = 'ch'+k;
    });
  });
  // 术语（外环，超过 14 个则分两圈）
  Object.keys(chTerms).forEach(k => {
    const arr = chTerms[k], base = chPosCache['ch'+k];
    if (!base) return;
    const two = arr.length > 14;
    const half = two ? Math.ceil(arr.length/2) : arr.length;
    arr.forEach((n_,i) => {
      const ring = two && i >= half ? 1 : 0;
      const idx = ring ? i-half : i;
      const cnt = ring ? arr.length-half : half;
      const span = STEP*0.86, r = R*(ring ? 1.02 : 0.83);
      const a = base.a + (cnt<=1 ? 0 : -span/2 + span*idx/(cnt-1));
      n_.x = cx + Math.cos(a)*r; n_.y = cy + Math.sin(a)*r;
      n_.home = 'ch'+k;
    });
  });
  // 章节点落位（关键：把 chPosCache 写回节点）
  VIS.forEach(n => {
    if (n.type === 'chapter' && chPosCache[n.id]){
      n.x = chPosCache[n.id].x; n.y = chPosCache[n.id].y; n.fx = n.x; n.fy = n.y;
    }
  });
  // 句/段（若开启，按邻接章散在外围）
  VIS.filter(n => n.type==='sentence' || n.type==='para').forEach(n => {
    let c = 0;
    if (n.type==='sentence') c = (n.ch==null?0:n.ch);
    const base = chPosCache['ch'+c] || {x:cx,y:cy,a:0};
    const a = base.a + (Math.random()-.5)*STEP*0.9, r = R*(0.98 + Math.random()*0.12);
    n.x = cx + Math.cos(a)*r; n.y = cy + Math.sin(a)*r;
  });
}

/* ── 物理 ── */
function step(alpha){
  const cell = 34, grid = new Map();
  VIS.forEach(n => {
    if (n.fx!==undefined) return;
    const gx = (n.x/cell)|0, gy = (n.y/cell)|0, k = gx+','+gy;
    (grid.get(k) || grid.set(k,[]).get(k)).push(n);
  });
  VIS.forEach(n => {
    if (n.fx!==undefined) return;
    let fx = 0, fy = 0;
    const gx = (n.x/cell)|0, gy = (n.y/cell)|0;
    for (let ox=-1; ox<=1; ox++) for (let oy=-1; oy<=1; oy++){
      const arr = grid.get((gx+ox)+','+(gy+oy)); if (!arr) continue;
      for (const m of arr){
        if (m === n) continue;
        let dx = n.x-m.x, dy = n.y-m.y, d2 = dx*dx+dy*dy;
        if (d2 < 1) { dx = Math.random()-.5; dy = Math.random()-.5; d2 = 1; }
        if (d2 > 22000) continue;
        const f = (n.type==='chapter'?0:1) * (m.type==='chapter'?0.3:1) * 150 / d2;
        fx += dx*f; fy += dy*f;
      }
    }
    n._fx = fx; n._fy = fy;
  });
  VLINKS.forEach(l => {
    const a = byId.get(l.s), b = byId.get(l.t); if (!a || !b) return;
    let dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy) || 1;
    const L = a.type==='chapter'||b.type==='chapter' ? 78 : (a.type==='term'||b.type==='term' ? 40 : 26);
    const f = (d-L)/d*0.06*(l.type==='has_term'?0.5:1);
    if (a.fx===undefined){ a._fx=(a._fx||0)+dx*f; a._fy=(a._fy||0)+dy*f; }
    if (b.fx===undefined){ b._fx=(b._fx||0)-dx*f; b._fy=(b._fy||0)-dy*f; }
  });
  VIS.forEach(n => {
    if (n.fx!==undefined) return;
    if (n.home && chPosCache[n.home] && n.type!=='chapter'){
      const h = chPosCache[n.home];
      let dx = n.x-h.x, dy = n.y-h.y, d = Math.hypot(dx,dy)||1;
      const want = TARGET_R[n.type] || 150;
      const f = (want-d)/d*(n.type==='exam_set'?0.030:0.014);
      n._fx = (n._fx||0)+dx*f; n._fy = (n._fy||0)+dy*f;
    }
    n.x += (n._fx||0)*alpha; n.y += (n._fy||0)*alpha;
    n._fx = 0; n._fy = 0;
  });
}
let alpha = 0, raf = 0;
function loop(){
  if (alpha > 0.008){ step(alpha); alpha *= 0.985; }
  draw();
  raf = requestAnimationFrame(loop);
}

/* ── 绘制 ── */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let DPR = 1;
function resize(){
  DPR = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth*DPR; cv.height = cv.clientHeight*DPR;
}
function colOf(n){
  if (n.type==='chapter') return '#2f5d8f';
  if (n.type==='exam_set') return '#e08a3c';
  if (n.type==='para') return '#6b7f99';
  if (n.type==='sentence') return LVCOL[n.cls] || '#9aa4b2';
  return TIERCOL[n.tier || (n.src==='术语库'?'lexicon':'common')] || '#9aa4b2';
}
function hlSet(){
  if (!S.sel) return null;
  const s = new Set([S.sel]);
  (adj.get(S.sel)||[]).forEach(e => s.add(e.id));
  return s;
}
function draw(){
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2 + S.x, H/2 + S.y); ctx.scale(S.k, S.k); ctx.translate(-W/2, -H/2);
  const HL = hlSet();
  // 边
  // 扇区放射线
  if (Object.keys(chPosCache).length){
    ctx.strokeStyle = 'rgba(47,93,143,.10)'; ctx.lineWidth = 1/S.k;
    for (let i=0;i<13;i++){
      const a = -Math.PI/2 + i*2*Math.PI/13 - Math.PI/13;
      ctx.beginPath(); ctx.moveTo(W/2, H/2);
      ctx.lineTo(W/2 + Math.cos(a)*Math.min(W,H)*0.5, H/2 + Math.sin(a)*Math.min(W,H)*0.5);
      ctx.stroke();
    }
  }
  ctx.lineWidth = 1/S.k;
  VLINKS.forEach(l => {
    if (l.type === 'has_term') return;
    if (l.type === 'uses_term'){ const ta = byId.get(l.s), tb = byId.get(l.t);
      if (ta && tb && ta.home && tb.home && ta.home !== tb.home) return; }
    const a = byId.get(l.s), b = byId.get(l.t); if (!a||!b) return;
    const on = HL && (HL.has(l.s) && HL.has(l.t));
    ctx.strokeStyle = on ? 'rgba(61,127,214,.5)' : 'rgba(140,152,170,.10)';
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });
  // 节点
  VIS.forEach(n => {
    const r = TYPE_R[n.type] || 3;
    const dim = HL && !HL.has(n.id) ? .18 : 1;
    ctx.globalAlpha = dim;
    ctx.fillStyle = colOf(n);
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.2832); ctx.fill();
    if (n.type==='chapter'){
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#1f2329'; ctx.font = '600 11px system-ui,sans-serif'; ctx.textAlign='center';
      ctx.fillText(n.label.split(' ')[0], n.x, n.y - r - 6);
      ctx.fillStyle = '#7b8494'; ctx.font = '10px system-ui,sans-serif';
      ctx.fillText(n.sent + ' 句 · 依据 ' + Math.round(n.cov*100) + '%', n.x, n.y + r + 13);
    }
    if (n.type==='exam_set' && S.k > 1.1){
      ctx.globalAlpha = dim*0.9; ctx.fillStyle = '#5b6472'; ctx.font = '9px system-ui,sans-serif'; ctx.textAlign='left';
      ctx.fillText(n.label.replace(/^(CET4|CET6) /,'$1 '), n.x + r + 3, n.y + 3);
    }
    if (n.type==='term' && S.k > 1.9 && (n.deg||0) >= 3){
      ctx.globalAlpha = dim*0.9; ctx.fillStyle = '#3b4250'; ctx.font = '9px system-ui,sans-serif'; ctx.textAlign='left';
      ctx.fillText(n.label, n.x + r + 3, n.y + 3);
    }
    ctx.globalAlpha = 1;
  });
  ctx.restore();
}

/* ── 交互 ── */
let drag = null, moved = 0;
function toWorld(ev){
  const r = cv.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  return { x: (mx - cv.clientWidth/2 - S.x)/S.k + cv.clientWidth/2,
           y: (my - cv.clientHeight/2 - S.y)/S.k + cv.clientHeight/2 };
}
function pick(p){
  let best = null, bd = 1e9;
  const lim = (S.k > 1.5 ? 14 : 20)/S.k;
  VIS.forEach(n => {
    const d = Math.hypot(n.x-p.x, n.y-p.y);
    if (d < lim && d < bd){ bd = d; best = n; }
  });
  return best;
}
cv.addEventListener('mousedown', ev => { drag = { p: toWorld(ev), node: pick(toWorld(ev)) }; moved = 0; cv.classList.add('drag'); });
cv.addEventListener('mousemove', ev => {
  const w = toWorld(ev);
  if (drag){
    moved += 1;
    if (drag.node && drag.node.type !== 'chapter'){ drag.node.fx = undefined; drag.node.x = w.x; drag.node.y = w.y; }
    else { S.x += ev.movementX; S.y += ev.movementY; }
    return;
  }
  const h = pick(w);
  if ((h&&h.id) !== (S.hover&&S.hover.id)){ S.hover = h; cv.title = h ? (h.label + (h.en ? ' · ' + h.en : '')) : ''; }
});
window.addEventListener('mouseup', ev => {
  if (drag && moved < 4){
    const w = toWorld(ev), n = pick(w);
    if (n) selectNode(n.id); else { S.sel = null; document.getElementById('side').classList.add('hide'); }
  }
  drag = null; cv.classList.remove('drag');
});
cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect(), mx = ev.clientX-r.left, my = ev.clientY-r.top;
  const f = ev.deltaY < 0 ? 1.12 : 0.89;
  const k2 = Math.min(6, Math.max(0.25, S.k*f));
  S.x -= (mx - cv.clientWidth/2 - S.x)*(k2/S.k - 1);
  S.y -= (my - cv.clientHeight/2 - S.y)*(k2/S.k - 1);
  S.k = k2;
}, {passive:false});

  b.onclick = () => {
    if (S.levels.has(k)){ S.levels.delete(k); b.style.opacity = .25; } else { S.levels.add(k); b.style.opacity = 1; }
    computeVisible(); alpha = 0;
  };
  lvbox.appendChild(b);
});

/* ── 搜索 ── */
const qEl = document.getElementById('q');
qEl.oninput = () => {
  const q = qEl.value.trim(); S.search = q;
  if (!q) return;
  const hit = NODES.find(n => n.label.includes(q) || (n.en||'').toLowerCase().includes(q.toLowerCase()));
  if (hit){
    if (hit.type === 'term' && !S.type.term){ S.type.term = 1; document.getElementById('f-term').checked = true; computeVisible(); }
    if (hit.type === 'sentence' && !S.type.sentence){ S.type.sentence = 1; document.getElementById('f-sent').checked = true; computeVisible(); }
    const n = byId.get(hit.id);
    S.k = Math.max(1.2, Math.min(2.4, S.k));
    S.x = cv.clientWidth/2 - n.x*S.k; S.y = cv.clientHeight/2 - n.y*S.k;
    selectNode(hit.id);
  }
};
qEl.onkeydown = ev => { if (ev.key === 'Escape'){ qEl.value = ''; qEl.blur(); } };
window.addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){ S.sel = null; side.classList.add('hide'); }
  if (ev.key === 'r' || ev.key === 'R'){ S.x = 0; S.y = 0; S.k = 1; alpha = 0; }
});

/* ── 启动 ── */
resize(); window.addEventListener('resize', () => { resize(); });
computeVisible(); loop(); window.__VIS=VIS;
/* 深链：?ch=N 聚焦某章（从章节卡片进入） */
try{
  const q=new URLSearchParams(location.search);
  if(q.has('ch')){
    const id='ch'+q.get('ch');
    if(byId.get(id)){
      selectNode(id);
      const n=byId.get(id);
      S.k=1.25; S.x=cv.clientWidth/2-n.x*S.k; S.y=cv.clientHeight/2-n.y*S.k;
      document.getElementById('hint').textContent='已定位到 '+n.label+' · 可点术语/套次继续下钻';
    }
  }
}catch(e){} window.__chPos=chPosCache; window.__S=S;
document.getElementById('hint').addEventListener('click', () => document.getElementById('hint').style.display = 'none');
</script>
</body>
