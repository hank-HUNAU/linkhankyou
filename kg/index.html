rden is enclosed by walls and includes ponds, rockeries, trees, flowers and various structures connected by winding paths and corridors.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2013·12·S2", "idx": 5, "cn": "漫步在花园中，人们可以看到一系列精心设计的景观犹如山水画卷(scroll)一般展现在面前。", "en": "Walking in the garden, people can see a series of carefully designed scenes unfold before them like a landscape scroll.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2017·12·S1", "idx": 1, "cn": "太湖是中国东部的一个淡水湖,占地面积 2250 平方公里,是中国第三大淡水湖,仅次于鄱阳和洞庭。", "en": "Taihu Lake is a freshwater lake in eastern China covering an area of 2,250 square kilometers, and it is the third-largest freshwater lake in China, after Poyang and Dongting.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2017·12·S1", "idx": 2, "cn": "太湖约有 90个岛屿,大小从几平方米到几平方公里不等。", "en": "Taihu Lake has about 90 islands, ranging in size from a few square meters to several square kilometers.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2017·12·S1", "idx": 3, "cn": "太湖以其独特的“太湖石”而闻名,太湖石常用于装饰中国传统园林。", "en": "Taihu Lake is famous for its unique \"Taihu stones\", which are often used to decorate traditional Chinese gardens.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2017·12·S1", "idx": 4, "cn": "太湖也以高产的捕鱼业闻名。", "en": "Taihu Lake is also known for its highly productive fishing industry.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2017·12·S1", "idx": 5, "cn": "自上世纪 70 年代后期以来,捕捞鱼蟹对沿湖的居民来说极为重要,并对周边地区的经济作出了重大贡献。", "en": "Since the late 1970s, catching fish and crabs has been extremely important to the residents around the lake and has made a major contribution to the economy of the surrounding areas.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2017·12·S1", "idx": 6, "cn": "太湖地区是中国陶瓷( ceramics)业基地之一,其中宜兴的陶瓷厂家生产举世闻名的宜兴紫砂壶( clay", "en": "The Taihu area is one of China's ceramics bases, where ceramic factories in Yixing produce the world-famous Yixing zisha (purple clay) teapots.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2022·06·S1", "idx": 1, "cn": "卢沟桥位于天安门广场西南 15 公里处，横跨永定河，是北京现存最古老的多拱石桥。", "en": "The Lugou Bridge is located 15 kilometers southwest of Tian'anmen Square, spans the Yongding River, and is the oldest existing multi-arch stone bridge in Beijing.", "cls": "A", "sid": "u2_s18", "pid": "u2_s18_p3", "sec": "石拱桥", "cov": 0.364, "hits": ["卢沟桥", "永定河"]}, {"ch": 10, "set": "CET6 2022·06·S1", "idx": 2, "cn": "卢沟桥最初建成于 1192 年， 1698 年重建，由 2 8 1 根柱子支撑。", "en": "The Lugou Bridge was originally completed in 1192 and rebuilt in 1698, and it is supported by 281 pillars.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2022·06·S1", "idx": 3, "cn": "每根柱子上都有一头石狮。", "en": "Each pillar carries a stone lion.", "cls": "A", "sid": "u1_s0", "pid": "u1_s0_p4", "sec": "导入问题", "cov": 0.3, "hits": ["石狮"]}, {"ch": 10, "set": "CET6 2022·06·S1", "idx": 4, "cn": "这些石狮的头、背、腹部或爪子上都藏着更多的狮子。", "en": "More lions are hidden on the heads, backs, bellies or paws of these stone lions.", "cls": "B", "sid": "u1_s0", "pid": "u1_s0_p4", "sec": "导入问题", "cov": 0.1, "hits": ["石狮"]}, {"ch": 10, "set": "CET6 2022·06·S1", "idx": 5, "cn": "这些石狮生动逼真、千姿百态，是卢沟桥石刻艺术的精品。", "en": "These stone lions are vivid, true to life and highly varied, and represent the finest examples of the stone carving art of the Lugou Bridge.", "cls": "B", "sid": "u2_s18", "pid": "u2_s18_p3", "sec": "石拱桥", "cov": 0.202, "hits": ["石狮", "卢沟桥"]}, {"ch": 10, "set": "CET6 2022·06·S1", "idx": 6, "cn": "桥上的石狮不计其数，因而北京地区流传着“卢沟桥上的石狮子 —数不清”的说法。", "en": "The stone lions on the bridge are too numerous to count, so there is a saying in the Beijing area that \"the lions of the Lugou Bridge are too numerous to count\".", "cls": "B", "sid": "u2_s18", "pid": "u2_s18_p3", "sec": "石拱桥", "cov": 0.205, "hits": ["卢沟桥", "石狮"]}, {"ch": 10, "set": "CET6 2022·06·S1", "idx": 7, "cn": "卢沟桥不仅以其美学特征闻名于世，还被公认为石桥建筑史上的一座丰碑。", "en": "The Lugou Bridge is not only famous worldwide for its aesthetic features but is also acclaimed as a monument in the history of stone bridge architecture.", "cls": "A", "sid": "u2_s18", "pid": "u2_s18_p3", "sec": "石拱桥", "cov": 0.253, "hits": ["卢沟桥"]}, {"ch": 10, "set": "CET6 2022·06·S2", "idx": 1, "cn": "南京长江大桥是长江上首座由中国设计、采用国产材料建造的铁路、公路两用桥，上层的 4 车道公路桥长 4589 米，下层的双轨道铁路桥长 6772 米。", "en": "The Nanjing Yangtze River Bridge is the first double-deck road-rail bridge over the Yangtze River designed by China and built with domestic materials, with its upper four-lane highway bridge 4,589 meters long and its lower double-track railway bridge 6,772 meters long.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2022·06·S2", "idx": 2, "cn": "铁路桥连接原来的天津一浦口和上海一南京两条铁路线，使火车过江从过去一个半小时缩短为现在的 2 分钟。", "en": "The railway bridge connects the two original railway lines between Tianjin and Pukou and between Shanghai and Nanjing, reducing the time for trains to cross the river from one and a half hours in the past to two minutes today.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2022·06·S2", "idx": 3, "cn": "大桥是南北交通的重要枢纽，也是南京的著名景点之一。", "en": "The bridge is an important hub for north-south transportation and one of the famous scenic spots in Nanjing.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2022·06·S2", "idx": 4, "cn": "南京长江大桥的建成标志着中国桥梁建设的一个飞跃，大大方便了长江两岸的物资交流和人员来往，对促进经济发展和改善人民生活起到了巨大作用。", "en": "The completion of the Nanjing Yangtze River Bridge marked a leap forward in China's bridge construction, greatly facilitated the exchange of goods and the movement of people across the Yangtze River, and played a huge role in promoting economic development and improving people's lives.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2022·06·S3", "idx": 1, "cn": "赵州桥建于隋朝，公元 6 0 5 年左右，长 50.82 米，宽 9 .6 米，跨度 37.37 米。", "en": "The Zhaozhou Bridge was built in the Sui Dynasty, around 605 AD; it is 50.82 meters long, 9.6 meters wide and 37.37 meters in span.", "cls": "A", "sid": "u2_s18", "pid": "u2_s18_p2", "sec": "石拱桥", "cov": 0.353, "hits": ["赵州桥"]}, {"ch": 10, "set": "CET6 2022·06·S3", "idx": 2, "cn": "天才建筑师李春设计并监督了桥的建设。", "en": "The gifted architect Li Chun designed and supervised the construction of the bridge.", "cls": "B", "sid": "u2_s7", "pid": "u2_s7_p1", "sec": "皇家建筑", "cov": 0.188, "hits": ["建筑师"]}, {"ch": 10, "set": "CET6 2022·06·S3", "idx": 3, "cn": "赵州桥结构新颖、造型优美。", "en": "The Zhaozhou Bridge has a novel structure and an elegant design.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2022·06·S3", "idx": 4, "cn": "桥有一个大拱，在大拱的两端有两个小拱，帮助排泄洪水、减轻桥梁重量并节省石材。", "en": "The bridge has a large arch, with two small arches at both ends of the large one, helping to discharge floodwater, reduce the weight of the bridge and save stone.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2022·06·S3", "idx": 5, "cn": "建成以来，该桥经受了多次洪水和地震，但其主体结构仍然完好无损，至今仍在使用。", "en": "Since its completion, the bridge has withstood many floods and earthquakes, but its main structure remains intact and it is still in use today.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2022·06·S3", "idx": 6, "cn": "赵州桥是世界桥梁建筑史上的一次创举，是中国古代文明史上的一项杰出成就。", "en": "The Zhaozhou Bridge was a pioneering achievement in the history of world bridge architecture and an outstanding accomplishment in the history of ancient Chinese civilization.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2022·06·S3", "idx": 7, "cn": "类似设计的桥梁直到 14 世纪才在欧洲出现，比赵州桥晚了 7 0 0 多年。", "en": "Bridges of similar design did not appear in Europe until the 14th century, more than 700 years later than the Zhaozhou Bridge.", "cls": "B", "sid": "u2_s18", "pid": "u2_s18_p2", "sec": "石拱桥", "cov": 0.187, "hits": ["赵州桥"]}, {"ch": 10, "set": "CET6 2020·12·S2", "idx": 1, "cn": "港珠澳大桥(HongKong-Zhuhai-MacauBridge)全长55公里,是我国一项不同寻常的工程壮举。", "en": "The Hong Kong-Zhuhai-Macao Bridge, 55 kilometers long, is an extraordinary engineering feat of China.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2020·12·S2", "idx": 2, "cn": "大桥将三个城市连接起来，是世界上最长的跨海桥梁和隧道系统。", "en": "The bridge connects three cities and is the world's longest sea-crossing bridge-tunnel system.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2020·12·S2", "idx": 3, "cn": "大桥将三个城市之间的旅行时间从3小时缩短到30分钟。", "en": "The bridge cuts the travel time between the three cities from three hours to 30 minutes.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2020·12·S2", "idx": 4, "cn": "这座跨度巨大的钢筋混凝土大桥充分证明中国有能力建造创纪录的巨型建筑。", "en": "This reinforced concrete bridge with a huge span is strong proof that China has the ability to build record-breaking giant structures.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2020·12·S2", "idx": 5, "cn": "它将助推区域一体化，促进经济增长。", "en": "It will boost regional integration and promote economic growth.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2020·12·S2", "idx": 6, "cn": "大桥是中国发展自已的大湾区总体规划的关键。", "en": "The bridge is key to China's master plan for developing its own Greater Bay Area.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2020·12·S2", "idx": 7, "cn": "中国希望将大湾区建成在技术创新和经济繁荣上能与旧金山、纽约和东京的湾区相媲美的地区。", "en": "China hopes to build the Greater Bay Area into a region comparable to the San Francisco, New York and Tokyo Bay Areas in technological innovation and economic prosperity.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2020·12·S3", "idx": 1, "cn": "青藏铁路是世界上最高最长的高原铁路，全长1，956公里，其中有960公里在海拔4，000多米之上，是连接西藏和中国其他地区的第一条铁路。", "en": "The Qinghai-Tibet Railway is the highest and longest plateau railway in the world, with a total length of 1,956 kilometers, of which 960 kilometers lie at an altitude of over 4,000 meters, and it is the first railway linking Tibet with the rest of China.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2020·12·S3", "idx": 2, "cn": "由于铁路穿越世界上最脆弱的生态系统，在建设期间和建成后都采取了生态保护措施，以确保其成为一条“绿色铁路”。", "en": "Because the railway crosses the world's most fragile ecosystem, ecological protection measures were taken both during and after construction to ensure that it would become a \"green railway\".", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2020·12·S3", "idx": 3, "cn": "青藏铁路大大缩短了去往西藏的旅行时间。", "en": "The Qinghai-Tibet Railway has greatly shortened the travel time to Tibet.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2020·12·S3", "idx": 4, "cn": "更重要的是，它极大地促进了西藏的经济发展，改善了当地居民的生活。", "en": "More importantly, it has greatly promoted Tibet's economic development and improved the lives of local residents.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2020·12·S3", "idx": 5, "cn": "铁路开通后，愈来愈多的人选择乘火车前往西藏，这样还有机会欣赏沿线的美景。", "en": "After the railway opened, more and more people have chosen to travel to Tibet by train, which also gives them a chance to enjoy the beautiful scenery along the way.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2020·09·S3", "idx": 1, "cn": "你如果到北京旅游，必须做两件事：一件是登长城，另一件是吃北京烤鸭。", "en": "If you travel to Beijing, you must do two things: one is to climb the Great Wall, and the other is to eat Beijing Roast Duck.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2020·09·S3", "idx": 2, "cn": "闻名遐迩的北京烤鸭曾仅限于宫廷，而现在北京数百家餐厅均有供应。", "en": "The world-famous Beijing Roast Duck was once limited to the imperial court, but today it is served in hundreds of restaurants in Beijing.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2020·09·S3", "idx": 3, "cn": "北京烤鸭源于600年前的明代。", "en": "Beijing Roast Duck originated in the Ming Dynasty, more than 600 years ago.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2020·09·S3", "idx": 4, "cn": "来自全国各地的厨师被挑选出来到京城为皇帝做饭。", "en": "Cooks from all over the country were selected to go to the capital to cook for the emperor.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2020·09·S3", "idx": 5, "cn": "人们认为在皇宫做饭是一种莫大的荣誉，只有厨艺出众者才能获得这份工作。", "en": "It is considered a great honor to cook in the imperial palace, and only those with outstanding culinary skills can get such a job.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2020·09·S3", "idx": 6, "cn": "事实上，正是这些宫廷厨师使北京烤鸭的烹饪艺术日臻完善。", "en": "In fact, it was these imperial cooks who brought the culinary art of Beijing Roast Duck to near perfection.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2022·09·S3", "idx": 1, "cn": "中央电视台总部大楼位于北京市朝阳区，总建筑面积约55万平方米。", "en": "The CCTV Headquarters Building is located in the Chaoyang District of Beijing, with a total floor area of about 550,000 square meters.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2022·09·S3", "idx": 2, "cn": "主楼由两座塔楼组成，因其独特的造型，成为这座城市的一个热门景点，每天都吸引众多游客前来参观。", "en": "The main building consists of two towers and, because of its unique shape, has become a popular attraction in the city, attracting many tourists every day.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2022·09·S3", "idx": 3, "cn": "大楼的创新结构是中外建筑师长期合作的成果，不仅体现了环保意识，而且大大节约了建筑材料。", "en": "The building's innovative structure is the result of long-term cooperation between Chinese and foreign architects, embodying not only environmental awareness but also a great saving of building materials.", "cls": "B", "sid": "u2_s7", "pid": "u2_s7_p1", "sec": "皇家建筑", "cov": 0.132, "hits": ["建筑师"]}, {"ch": 10, "set": "CET6 2022·09·S3", "idx": 4, "cn": "中央电视台总部设有一条穿过大楼的专用通道，向公众展示各个工作室以及中央电视台的历史。", "en": "The CCTV Headquarters has a dedicated passage running through the building, which shows the public the various studios and the history of CCTV.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2022·09·S3", "idx": 5, "cn": "在那里，参观者还可以看到故宫和北京其他地方的壮观景色。", "en": "From there, visitors can also enjoy spectacular views of the Palace Museum and other parts of Beijing.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2016·06·S3", "idx": 1, "cn": "乌镇是浙江的一座古老水镇，坐落在京杭大运河畔。", "en": "Wuzhen is an ancient water town in Zhejiang province, situated on the bank of the Beijing-Hangzhou Grand Canal.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2016·06·S3", "idx": 2, "cn": "这是一处迷人的地方，有许多古桥、中式旅店和餐馆。", "en": "It is a charming place with many ancient bridges, Chinese-style inns and restaurants.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2016·06·S3", "idx": 3, "cn": "在过去一千年里，乌镇的水系和生活方式并未经历多少变化，是一座展现古文明的博物馆。", "en": "Over the past thousand years, Wuzhen's water system and way of life have not changed much, and it is a museum showing ancient civilization.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2016·06·S3", "idx": 4, "cn": "乌镇所有房屋都用石木建造。", "en": "All the houses in Wuzhen are built of stone and wood.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2016·06·S3", "idx": 5, "cn": "数百年来，当地人沿着河边建起了住宅和集市。", "en": "For hundreds of years, locals have built houses and markets along the river.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2016·06·S3", "idx": 6, "cn": "无数宽敞美丽的庭院藏身于屋舍之间，游客们每到一处都有会惊喜的发现。", "en": "Countless spacious and beautiful courtyards are hidden among the houses, and tourists will find something surprising at every turn.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2024·06·S1", "idx": 1, "cn": "四合院 (siheyuan)是中国一种传统的住宅建筑，其特点是房屋建造在一个院子的四周，将院子合围在中间。", "en": "The siheyuan is a traditional type of Chinese residential building, characterized by houses built on all four sides of a courtyard and enclosing it in the middle.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2024·06·S1", "idx": 2, "cn": "四合院通常冬暖夏凉，环境舒适，尤其适合大家庭居住。", "en": "A siheyuan is usually warm in winter and cool in summer, comfortable and especially suitable for large families.", "cls": "A", "sid": "u2_s9", "pid": "u2_s9_p3", "sec": "北京四合院", "cov": 0.258, "hits": ["四合院"]}, {"ch": 10, "set": "CET4 2024·06·S1", "idx": 3, "cn": "四合院在中国各地有多种类型，其中以北京的四合院最为典型。", "en": "Siheyuan come in many types across China, among which the Beijing siheyuan is the most typical.", "cls": "B", "sid": "u2_s9", "pid": "u2_s9_p1", "sec": "北京四合院", "cov": 0.194, "hits": ["四合院"]}, {"ch": 10, "set": "CET4 2024·06·S1", "idx": 4, "cn": "如今，随着现代城市的发展，传统的四合院已逐渐减少，但因其独特的建筑风格，四合院对中国文化的传承和中国历史的研究具有重要意义。", "en": "Today, with the development of modern cities, traditional siheyuan have gradually decreased, but because of their unique architectural style, they remain highly significant to the inheritance of Chinese culture and the study of Chinese history.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2024·12·S2", "idx": 1, "cn": "敦煌莫高窟 (Mogao Grottoes) 数字展示中心于 2014 年开放启用，是莫高窟保护利用工程的重要组成部分。", "en": "The Mogao Grottoes Digital Exhibition Center in Dunhuang opened in 2014 and is an important part of the project to protect and utilize the Mogao Grottoes.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2024·12·S2", "idx": 2, "cn": "展示中心采用数字技术和多媒体展示手段，使游客进入洞窟参观之前就能了解莫高窟的历史文化，鉴赏莫高窟的艺术经典。", "en": "The center uses digital technology and multimedia displays, enabling visitors to learn about the history and culture of the Mogao Grottoes and appreciate their artistic classics before entering the caves.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2024·12·S2", "idx": 3, "cn": "这将减少开放洞窟的数量，缩短游客在洞窟内的逗留时间，减轻参观对莫高窟造成的影响，以使这一世界文化遗产得到妥善保护、长久利用。", "en": "This will reduce the number of open caves, shorten the time tourists spend inside them and lessen the impact of visits on the Mogao Grottoes, so as to ensure the proper protection and long-term use of this World Cultural Heritage site.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2023·06·S3", "idx": 1, "cn": "近年来，中国城市加快发展，城市人居环境得到显著改善。", "en": "In recent years, Chinese cities have developed at a faster pace, and the urban living environment has improved markedly.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2023·06·S3", "idx": 2, "cn": "许多城市努力探索中国特色的城市高质量发展之路，城市功能不断完善，治理水平明显提高。", "en": "Many cities have worked hard to explore a path of high-quality urban development with Chinese characteristics, with urban functions continuously improved and governance significantly enhanced.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET6 2023·06·S3", "idx": 3, "cn": "中国持续开展城市生态修复和功能修补，全面实施城镇老旧小区改造，大力推进城市园林绿化，消除污染；同时大力推进城市基础设施体系化建设，开展房屋建筑和市政设施普查以及安全隐患排查整治，努力为市民创造高品质的生活环境，让城市更美丽、更安全、更宜居。", "en": "China has continuously carried out urban ecological restoration and urban repair, fully implemented the renovation of old residential communities in cities and towns and vigorously promoted urban greening to eliminate pollution; at the same time, it has vigorously advanced the systematic development of urban infrastructure, carried out surveys of buildings and municipal facilities as well as the screening and rectification of potential safety hazards, and worked hard to create a high-quality living environment for urban residents, making cities more beautiful, safer and more livable.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2021·12·S1", "idx": 1, "cn": "大运河（GrandCanal)是世界上最长的人工河，北起北京，南至杭州。", "en": "The Grand Canal is the longest man-made river in the world, running from Beijing in the north to Hangzhou in the south.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2021·12·S1", "idx": 2, "cn": "它是中国历史上最宏伟的工程之一。", "en": "It is one of the grandest projects in Chinese history.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2021·12·S1", "idx": 3, "cn": "大运河始建于公元前4世纪，公元13世纪末建成。", "en": "The Grand Canal was first built in the 4th century BC and completed at the end of the 13th century AD.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2021·12·S1", "idx": 4, "cn": "修建之初是为了运输粮食，后来也用于运输其他商品。", "en": "It was originally built to transport grain, and later it was also used to transport other goods.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2021·12·S1", "idx": 5, "cn": "大运河沿线区域逐渐发展成为中国的工商业中心。", "en": "The areas along the Grand Canal gradually developed into an industrial and commercial center of China.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2021·12·S1", "idx": 6, "cn": "长久以来，大运河对中国的经济发展发挥了重要作用，有力地促进了南北地区之间的人员往来和文化交", "en": "For a long time, the Grand Canal has played an important role in China's economic development and greatly promoted the movement of people and cultural exchanges between the north and the south.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2021·12·S2", "idx": 1, "cn": "坎儿井(Karez) 是新疆干旱地区的一种水利系统，由地下渠道将水井连接而成。", "en": "The karez is a water conservancy system in the arid regions of Xinjiang, consisting of underground channels that connect wells.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2021·12·S2", "idx": 2, "cn": "该系统将春夏季节登今 (seep into) 地下的大量币水及积雪融水收集起来，通过山体的自然坡度引到地面，用于灌溉农田和满足人们的日常用水需求。", "en": "This system collects the large amount of rainwater that seeps into the ground in spring and summer as well as melted snow, and, through the natural slope of the mountains, leads it to the surface for irrigating farmland and meeting people's daily water needs.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2021·12·S2", "idx": 3, "cn": "坎儿井减少了水在地面的蒸发 (evaporation),对地表破坏很小，因而有效地保护了自然资源与生态环境。", "en": "The karez reduces the evaporation of water on the ground and causes very little damage to the surface, thus effectively protecting natural resources and the ecological environment.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2021·12·S2", "idx": 4, "cn": "坎儿井体现了我国人民与自然和谐共存的智慧，是对人类文明的一大贡献。", "en": "The karez embodies the wisdom of our people in living in harmony with nature and is a great contribution to human civilization.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2021·12·S3", "idx": 1, "cn": "卢(Dujiangyan) 坐落在成都平原西部的氓江上，距成都市约 50 公里，始建于公元前三世纪。", "en": "Dujiangyan is located on the Minjiang River in the west of the Chengdu Plain, about 50 kilometers from Chengdu, and was first built in the 3rd century BC.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2021·12·S3", "idx": 2, "cn": "它的独特之处在于无需用堤坝调控水流。", "en": "Its unique feature lies in the fact that it controls water flow without the need for dams.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2021·12·S3", "idx": 3, "cn": "两千多年来，都江堰一直有效地发挥看防洪与灌溉作用，使成都平原成为旱滂保收的沃土和中国最重要的棵食产地之一。", "en": "For more than 2,000 years, Dujiangyan has effectively played a role in flood control and irrigation, turning the Chengdu Plain into a fertile land with guaranteed harvests in both dry and wet years and one of China's most important grain-producing areas.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 10, "set": "CET4 2021·12·S3", "idx": 4, "cn": "都江堰工程体现了我国人民与自然和谐共存的智慧，是全世界年代最久、仍在使用、无坝控水的水利工", "en": "The Dujiangyan project embodies the wisdom of our people in living in harmony with nature and is the oldest dam-free water conservancy project in the world that is still in use.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2014·12·S2", "idx": 1, "cn": "自从 1978 年启动改革以来，中国已从计划经济转为以市场为基础的经济，并经历了经济和社会的快速发展。", "en": "Since the launch of reform in 1978, China has transformed from a planned economy to a market-based economy and has experienced rapid economic and social development.", "cls": "B", "sid": "u4_s4", "pid": "u4_s4_p1", "sec": "进一步完善社会主义市场经济体制阶段", "cov": 0.308, "hits": []}, {"ch": 11, "set": "CET6 2014·12·S2", "idx": 2, "cn": "年均10%的 GDP 增长已使五亿多人脱贫。", "en": "GDP growth averaging 10 percent a year has lifted more than 500 million people out of poverty.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2014·12·S2", "idx": 3, "cn": "联合国的“千年(millennium)发展目标”在中国均已达到或即将达到。", "en": "The UN's Millennium Development Goals have all been met or are about to be met in China.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2014·12·S2", "idx": 4, "cn": "目前，中国的第十二个五年规划强调发展服务业和解决环境及社会不平衡的问题。", "en": "At present, China's 12th Five-Year Plan emphasizes developing the service sector and addressing environmental and social imbalances.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2014·12·S2", "idx": 5, "cn": "政府已设定目标减少污染，提高能源效率，改善得到教育和医保的机会，并扩大社会保障。", "en": "The government has set goals to reduce pollution, improve energy efficiency, improve access to education and medical insurance, and expand social security.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2014·12·S2", "idx": 6, "cn": "中国现在 7%的经济年增长目标表明政府意在重视生活质量而不是增长速度。", "en": "China's current annual economic growth target of 7 percent indicates that the government intends to focus on the quality of life rather than the growth rate.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET4 2025·12·S1", "idx": 1, "cn": "近年来，中国政府高度重视民营经济（private economy）的发展，出台了一系列政策支持民营企业。", "en": "In recent years, the Chinese government has attached great importance to the development of the private economy and issued a series of policies to support private enterprises.", "cls": "B", "sid": "u3_s5", "pid": "u3_s5_p1", "sec": "历史商业发展", "cov": 0.233, "hits": ["中国政府"]}, {"ch": 11, "set": "CET4 2025·12·S1", "idx": 2, "cn": "截至 2025 年 3 月底，全国民营企业数量超过 5700 万家，占企业总量的 92.3%。", "en": "By the end of March 2025, the number of private enterprises nationwide had exceeded 57 million, accounting for 92.3 percent of all enterprises.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET4 2025·12·S1", "idx": 3, "cn": "民营企业不仅数量稳步增长，质量和结构也在不断提升。", "en": "Private enterprises have not only grown steadily in number but also kept improving in quality and structure.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET4 2025·12·S1", "idx": 4, "cn": "民营企业的研发投入不断增加，在新一代信息技术、人工智能等领域发展迅速。", "en": "Private enterprises have kept increasing their R&D investment and are developing rapidly in fields such as new-generation information technology and artificial intelligence.", "cls": "B", "sid": "u4_s7", "pid": "u4_s7_p1", "sec": "Made in China (中国制造) and Intelligent Manufacturing in China (中国智造) \"中国制造\"与\"中国智造\"", "cov": 0.226, "hits": []}, {"ch": 11, "set": "CET4 2025·12·S1", "idx": 5, "cn": "民营企业核心竞争力的增强为中国经济的高质量发展提供了有力支撑。", "en": "The enhancement of the core competitiveness of private enterprises has provided strong support for the high-quality development of the Chinese economy.", "cls": "A", "sid": "u4_s3", "pid": "u4_s3_p2", "sec": "社会主义市场经济体制框架初步建立阶段", "cov": 0.345, "hits": ["竞争力"]}, {"ch": 11, "set": "CET6 2026·06·S2", "idx": 1, "cn": "电子商务的蓬勃发展正在深刻改变中国农村的面貌。", "en": "The booming development of e-commerce is profoundly changing the face of rural China.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2026·06·S2", "idx": 2, "cn": "随着互联网和物流网络快速向农村延伸，越来越多的农村居民通过电子商务平台将农产品直接销售给城市消费者。", "en": "As the Internet and logistics networks rapidly extend into rural areas, more and more rural residents are selling agricultural products directly to urban consumers through e-commerce platforms.", "cls": "B", "sid": "u4_s13", "pid": "u4_s13_p2", "sec": "数字经济的核心领域", "cov": 0.196, "hits": ["电子商务", "互联网", "消费者"]}, {"ch": 11, "set": "CET6 2026·06·S2", "idx": 3, "cn": "近年来，直播带货 (live-streamingcommerce) 使城市消费者能够与卖家实时互动，已成为促进农村发展的一种新方式。", "en": "In recent years, livestream sales have enabled urban consumers to interact with sellers in real time and have become a new way to promote rural development.", "cls": "A", "sid": "u4_s13", "pid": "u4_s13_p2", "sec": "数字经济的核心领域", "cov": 0.278, "hits": ["消费者"]}, {"ch": 11, "set": "CET6 2026·06·S2", "idx": 4, "cn": "电子商务打破了城乡之间的信息壁垒，拓宽了农产品销售渠道，帮助农村居民增收致富。", "en": "E-commerce has broken down the information barriers between urban and rural areas, broadened sales channels for agricultural products, and helped rural residents increase their incomes.", "cls": "B", "sid": "u4_s13", "pid": "u4_s13_p2", "sec": "数字经济的核心领域", "cov": 0.143, "hits": ["电子商务"]}, {"ch": 11, "set": "CET6 2026·06·S2", "idx": 5, "cn": "数字经济与乡村振兴的深度融合，正在为中国农村发展注入前所未有的活力。", "en": "The deep integration of the digital economy and rural revitalization is injecting unprecedented vitality into China's rural development.", "cls": "A", "sid": "u4_s11", "pid": "u4_s11_p1", "sec": "中国数字经济", "cov": 0.258, "hits": ["数字经济"]}, {"ch": 11, "set": "CET4 2015·06·S1", "idx": 1, "cn": "中国是世界上最古老的文明之一。", "en": "China is one of the oldest civilizations in the world.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET4 2015·06·S1", "idx": 2, "cn": "构成现代世界基础的许多元素都起源于中国。", "en": "Many elements that form the basis of the modern world originated in China.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET4 2015·06·S1", "idx": 3, "cn": "中国现在拥有世界上发展最快的经济，并正经历着一次新的工业革命。", "en": "China now has the fastest-growing economy in the world and is undergoing a new industrial revolution.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET4 2015·06·S1", "idx": 4, "cn": "中国还启动了雄心勃勃的太空探索计划，其中包括到2020年建成一个太空站。", "en": "China has also launched an ambitious space exploration program, which includes building a space station by 2020.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET4 2015·06·S1", "idx": 5, "cn": "目前,中国是世界最大的出口国之一，并正在吸引大量外国投资。", "en": "At present, China is one of the world's largest exporters and is attracting a large amount of foreign investment.", "cls": "B", "sid": "u4_s7", "pid": "u4_s7_p1", "sec": "Made in China (中国制造) and Intelligent Manufacturing in China (中国智造) \"中国制造\"与\"中国智造\"", "cov": 0.24, "hits": []}, {"ch": 11, "set": "CET4 2015·06·S1", "idx": 6, "cn": "同时,它也在海外投资数十亿美元。", "en": "At the same time, it has also been investing billions of dollars overseas.", "cls": "B", "sid": "u4_s10", "pid": "u4_s10_p2", "sec": "高铁", "cov": 0.231, "hits": []}, {"ch": 11, "set": "CET4 2015·06·S1", "idx": 7, "cn": "2011年，中国超越日本成为世界第二大经济体。", "en": "In 2011, China surpassed Japan to become the world's second-largest economy.", "cls": "A", "sid": "u4_s1", "pid": "u4_s1_p2", "sec": "改革开放", "cov": 0.25, "hits": ["经济体"]}, {"ch": 11, "set": "CET4 2015·06·S2", "idx": 1, "cn": "据报道，今年中国快递服务（courier services)将递送大约 120 亿件包裹。", "en": "It is reported that China's courier services will deliver about 12 billion parcels this year.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET4 2015·06·S2", "idx": 2, "cn": "这将使中国有可能超越美国成为世界上最大的快递市场。", "en": "This will make it possible for China to surpass the United States and become the world's largest express delivery market.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET4 2015·06·S2", "idx": 3, "cn": "大多数包裹里装着网上订购的物品。", "en": "Most parcels contain items ordered online.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET4 2015·06·S2", "idx": 4, "cn": "中国给数百万在线零售商以极具竞争力的价格销售商品的机会。", "en": "China gives millions of online retailers the opportunity to sell goods at highly competitive prices.", "cls": "B", "sid": "u4_s3", "pid": "u4_s3_p2", "sec": "社会主义市场经济体制框架初步建立阶段", "cov": 0.16, "hits": ["竞争力"]}, {"ch": 11, "set": "CET4 2015·06·S2", "idx": 5, "cn": "仅在 11 月 11 日，中国消费者就从国内最大的购物平台购买了价值 90 亿美元的商品。", "en": "On November 11 alone, Chinese consumers bought goods worth 9 billion US dollars from the country's largest shopping platform.", "cls": "B", "sid": "u4_s13", "pid": "u4_s13_p3", "sec": "数字经济的核心领域", "cov": 0.233, "hits": ["消费者"]}, {"ch": 11, "set": "CET4 2015·06·S2", "idx": 6, "cn": "中国有不少这样的特殊购物日。", "en": "China has quite a few such special shopping days.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET4 2015·06·S2", "idx": 7, "cn": "因此,快递业在中国扩展就不足为奇了。", "en": "Therefore, it is not surprising that the express delivery industry is expanding in China.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2016·06·S3", "idx": 1, "cn": "深圳是中国广东省一座新开发的城市。", "en": "Shenzhen is a newly developed city in Guangdong Province, China.", "cls": "B", "sid": "u4_s2", "pid": "u4_s2_p1", "sec": "起步与目标探索阶段", "cov": 0.22, "hits": []}, {"ch": 11, "set": "CET6 2016·06·S3", "idx": 2, "cn": "在改革开放之前，深圳不过是一个渔村，仅有三万多人。", "en": "Before reform and opening up, Shenzhen was no more than a fishing village with a population of just over 30,000.", "cls": "A", "sid": "u4_s2", "pid": "u4_s2_p1", "sec": "起步与目标探索阶段", "cov": 0.258, "hits": ["改革开放"]}, {"ch": 11, "set": "CET6 2016·06·S3", "idx": 3, "cn": "20 世纪80 年代，中国政府创建了深圳经济特区，作为实施社会主义市场经济的试验田。", "en": "In the 1980s, the Chinese government established the Shenzhen Special Economic Zone as a testing ground for implementing the socialist market economy.", "cls": "A", "sid": "u4_s3", "pid": "u4_s3_p1", "sec": "社会主义市场经济体制框架初步建立阶段", "cov": 0.323, "hits": ["社会主义市场经济", "市场经济", "社会主义"]}, {"ch": 11, "set": "CET6 2016·06·S3", "idx": 4, "cn": "如今，深圳人口已经超过 1000万，整个城市发生了巨大的变化。", "en": "Today, Shenzhen's population has exceeded 10 million, and the whole city has undergone tremendous changes.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2016·06·S3", "idx": 5, "cn": "到 2014 年，深圳的人均（per-capita）GDP 已达 25000 美元，相当于世界上一些发达国家的水平。", "en": "By 2014, Shenzhen's per-capita GDP had reached 25,000 US dollars, equivalent to that of some developed countries in the world.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2016·06·S3", "idx": 6, "cn": "就综合经济实力而言，深圳居于中国顶尖城市之列。", "en": "In terms of overall economic strength, Shenzhen ranks among the top cities in China.", "cls": "B", "sid": "u4_s2", "pid": "u4_s2_p1", "sec": "起步与目标探索阶段", "cov": 0.22, "hits": []}, {"ch": 11, "set": "CET6 2016·06·S3", "idx": 7, "cn": "由于其独特的地位，深圳也是国内外企业家创业的理想之地。", "en": "Because of its unique status, Shenzhen is also an ideal place for entrepreneurs at home and abroad to start businesses.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2013·12·S1", "idx": 1, "cn": "闻名于世的丝绸之路是一系列连接东西方的路线。", "en": "The world-famous Silk Road was a series of routes that connected the East and the West.", "cls": "A", "sid": "u3_s5", "pid": "u3_s5_p1", "sec": "历史商业发展", "cov": 0.35, "hits": ["丝绸之路"]}, {"ch": 11, "set": "CET6 2013·12·S1", "idx": 2, "cn": "丝绸之路延伸6,000多公里，得名于古代中国的丝绸贸易。", "en": "The Silk Road extended for more than 6,000 kilometers, so named because of the silk trade in ancient China.", "cls": "A", "sid": "u3_s5", "pid": "u3_s5_p1", "sec": "历史商业发展", "cov": 0.421, "hits": ["丝绸之路", "丝绸"]}, {"ch": 11, "set": "CET6 2013·12·S1", "idx": 3, "cn": "丝绸之路上的贸易在中国、南亚、欧洲和中东文明发展中发挥了重要作用。", "en": "Trade along the Silk Road played an important role in the development of the civilizations of China, South Asia, Europe and the Middle East.", "cls": "A", "sid": "u3_s5", "pid": "u3_s5_p1", "sec": "历史商业发展", "cov": 0.517, "hits": ["丝绸之路"]}, {"ch": 11, "set": "CET6 2013·12·S1", "idx": 4, "cn": "正是通过丝绸之路，中国的造纸、火药、指南针、印刷术等四大发明才被引介到世界各地。", "en": "It was through the Silk Road that China's Four Great Inventions — papermaking, gunpowder, the compass and printing — were introduced to the rest of the world.", "cls": "B", "sid": "u3_s5", "pid": "u3_s5_p1", "sec": "历史商业发展", "cov": 0.235, "hits": ["丝绸之路"]}, {"ch": 11, "set": "CET6 2013·12·S1", "idx": 5, "cn": "同样，中国的丝绸、茶叶和瓷器(porcelain)也传遍全球。", "en": "Similarly, China's silk, tea and porcelain spread across the globe.", "cls": "A", "sid": "u3_s5", "pid": "u3_s5_p1", "sec": "历史商业发展", "cov": 0.25, "hits": ["丝绸"]}, {"ch": 11, "set": "CET6 2013·12·S1", "idx": 6, "cn": "物质文化的交流是双向的，欧洲也通过丝绸之路出口各种商品和植物，满足中国市场的需要。", "en": "The exchange of material culture was two-way, and Europe also exported various goods and plants along the Silk Road to meet the needs of the Chinese market.", "cls": "B", "sid": "u3_s5", "pid": "u3_s5_p1", "sec": "历史商业发展", "cov": 0.189, "hits": ["丝绸之路"]}, {"ch": 11, "set": "CET6 2023·03·S1", "idx": 1, "cn": "张骞(Zhang Qian)是中国第一个伟大的探险家。", "en": "Zhang Qian was China's first great explorer.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2023·03·S1", "idx": 2, "cn": "他不畏艰险，克服重重困难，两次出使西域，开通了中国同西亚和欧洲的通商关系，将中国的丝和丝织品运往西亚和欧洲，开拓了历史上著名的“丝绸之路”。", "en": "Braving dangers and overcoming numerous difficulties, he made two missions to the Western Regions, opened up trade relations between China and West Asia and Europe, carried China's silk and silk fabrics to West Asia and Europe, and pioneered the world-famous Silk Road.", "cls": "B", "sid": "u3_s5", "pid": "u3_s5_p1", "sec": "历史商业发展", "cov": 0.145, "hits": ["丝绸之路"]}, {"ch": 11, "set": "CET6 2023·03·S1", "idx": 3, "cn": "同时，他又将西域的风土人情、地理文化以及特有物种等介绍到中原，极大地开阔了人们的视野。", "en": "Meanwhile, he also introduced the customs, geography and culture as well as unique species of the Western Regions to the Central Plains, greatly broadening people's horizons.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2023·03·S1", "idx": 4, "cn": "正如历史学家所指出的那样，如果没有张骞出使西域，就不可能有丝绸之路的开辟，也就不会有汉朝同西域或欧洲的文化交流。", "en": "As historians have pointed out, without Zhang Qian's missions to the Western Regions, there would have been no opening of the Silk Road, nor any cultural exchange between the Han Dynasty and the Western Regions or Europe.", "cls": "B", "sid": "u3_s5", "pid": "u3_s5_p1", "sec": "历史商业发展", "cov": 0.143, "hits": ["丝绸之路"]}, {"ch": 11, "set": "CET6 2023·03·S2", "idx": 1, "cn": "郑和是中国历史上最杰出的航海家，在航海、外交、军事等诸多领域都表现出非凡的智慧和卓越的才能。", "en": "Zheng He was the most outstanding navigator in Chinese history and displayed extraordinary wisdom and outstanding talent in many fields such as navigation, diplomacy and military affairs.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2023·03·S2", "idx": 2, "cn": "他曾七次率领庞大的船队远航，访问了西太平洋和印度洋的许多国家和地区，加深了中国同东南亚、东非的相互了解。", "en": "He led a huge fleet on seven voyages, visited many countries and regions in the Western Pacific and the Indian Ocean, and deepened mutual understanding between China and Southeast Asia and East Africa.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2023·03·S2", "idx": 3, "cn": "郑和下西洋对中外的经济和文化交流起到了十分积极的推进作用，也为维护区域和平做出了巨大的贡献。", "en": "Zheng He's voyages to the Western Seas played a very positive role in promoting economic and cultural exchanges between China and foreign countries, and also made great contributions to safeguarding regional peace.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2023·03·S2", "idx": 4, "cn": "为了永远铭记郑和及其丰功伟绩，7月11日，即郑和首次率船队远航启程的日子，被定为中国的航海节。", "en": "To forever remember Zheng He and his great achievements, July 11, the day when he first led his fleet on a voyage, was designated as China's Maritime Day.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2023·06·S2", "idx": 1, "cn": "近年来，越来越多的中国文化产品走向全球市场，日益受到海外消费者的青睐。", "en": "In recent years, more and more Chinese cultural products have entered the global market, increasingly favored by overseas consumers.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2023·06·S2", "idx": 2, "cn": "随着中国对外文化贸易的快速发展，中国文化产品出口额已持续多年位居世界前列，形成了一批具有国际影响力的文化企业、产品和品牌。", "en": "With the rapid development of China's foreign cultural trade, the export volume of Chinese cultural products has ranked among the world's top for many years, forming a number of cultural enterprises, products and brands with international influence.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2023·06·S2", "idx": 3, "cn": "数据显示，中国的出版物、影视作品、网络文学与动漫作品等在海外的销售量连年攀升。", "en": "Data show that the overseas sales of Chinese publications, film and television works, online literature and animation have been climbing year after year.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2023·06·S2", "idx": 4, "cn": "中国政府出台了一系列政策鼓励和支持更多具有中国元素的优秀文化产品走出国门，扩大海外市场份额，进一步提升中国文化的世界影响力。", "en": "The Chinese government has issued a series of policies to encourage and support more excellent cultural products with Chinese elements to go global, expand overseas market share and further enhance the global influence of Chinese culture.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2016·12·S3", "idx": 1, "cn": "农业是中国的一个重要产业，从业者超过 3 亿。", "en": "Agriculture is an important industry in China, with more than 300 million workers.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2016·12·S3", "idx": 2, "cn": "中国农业产量全球第一，主要生产水稻、小麦和豆类。", "en": "China's agricultural output ranks first in the world, mainly producing rice, wheat and beans.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2016·12·S3", "idx": 3, "cn": "虽然中国的农业用地仅占世界的百分之十，但为世界百分之二十的人口提供了粮食。", "en": "Although China's farmland accounts for only 10 percent of the world's total, it feeds 20 percent of the world's population.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2016·12·S3", "idx": 4, "cn": "中国 7700 年前开始种植水稻。", "en": "China began to grow rice 7,700 years ago.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2016·12·S3", "idx": 5, "cn": "早在使用机械和化肥之前，勤劳和富有创造性的中国农民就已经采用各种各样的方法来增加农作物产量。", "en": "Long before the use of machinery and chemical fertilizers, hardworking and creative Chinese farmers had already adopted various methods to increase crop yields.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 11, "set": "CET6 2016·12·S3", "idx": 6, "cn": "中国农业最新的发展是推进有机农业。", "en": "The latest development of China's agriculture is the promotion of organic farming.", "cls": "A", "sid": "u4_s15", "pid": "u4_s15_p1", "sec": "生态保护与修复", "cov": 0.357, "hits": ["有机农业", "农业"]}, {"ch": 11, "set": "CET6 2016·12·S3", "idx": 7, "cn": "有机农业可以同时服务于多种目的，包括食品安全、大众健康和可持续发展。", "en": "Organic farming can serve multiple purposes at the same time, including food safety, public health and sustainable development.", "cls": "B", "sid": "u4_s5", "pid": "u4_s5_p1", "sec": "全面深化改革阶段", "cov": 0.2, "hits": ["可持续发展"]}, {"ch": 11, "set": "CET4 2024·12·S3", "idx": 1, "cn": "近年来，中国新能源汽车产业发展迅速。", "en": "In recent years, China's new energy vehicle industry has developed rapidly.", "cls": "A", "sid": "u4_s9", "pid": "u4_s9_p1", "sec": "中国新能源汽车产业的崛起", "cov": 0.62, "hits": ["新能源汽车", "新能源", "汽车产业"]}, {"ch": 11, "set": "CET4 2024·12·S3", "idx": 2, "cn": "目前，中国新能源汽车年产量已高达近千万辆，占全球市场份额超过 60%，出口量不断创出新高。", "en": "At present, China's annual NEV output has reached nearly 10 million units, accounting for more than 60 percent of the global market share, with exports hitting new highs.", "cls": "A", "sid": "u4_s9", "pid": "u4_s9_p1", "sec": "中国新能源汽车产业的崛起", "cov": 0.27, "hits": ["新能源汽车", "新能源"]}, {"ch": 11, "set": "CET4 2024·12·S3", "idx": 3, "cn": "中国政府通过加大资金投入和政策引导，鼓励新能源汽车企业进行技术创新，不断提高产品在市场上的竞争力。", "en": "By increasing capital investment and policy guidance, the Chinese government encourages new energy vehicle enterprises to carry out technological innovation and continuously improve the competitiveness of their products in the market.", "cls": "B", "sid": "u4_s3", "pid": "u4_s3_p2", "sec": "社会主义市场经济体制框架初步建立阶段", "cov": 0.2, "hits": ["竞争力"]}, {"ch": 11, "set": "CET4 2024·12·S3", "idx": 4, "cn": "中国新能源汽车产业的发展不仅有力推动了国内经济发展，也为全球新能源利用和环境保护做出了积极贡献。", "en": "The development of China's new energy vehicle industry has not only strongly boosted domestic economic development but also made positive contributions to global new energy utilization and environmental protection.", "cls": "A", "sid": "u4_s9", "pid": "u4_s9_p1", "sec": "中国新能源汽车产业的崛起", "cov": 0.33, "hits": ["新能源汽车", "新能源", "汽车产业"]}, {"ch": 12, "set": "CET6 2023·12·S1", "idx": 1, "cn": "随着经济与社会的发展，中国人口结构发生了显著变化，逐渐步入老龄化社会。", "en": "With the development of the economy and society, China's population structure has undergone significant changes, and the country has gradually entered an aging society.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S1", "idx": 2, "cn": "中国老年人口将持续增加，人口老龄化趋势将更加明显。", "en": "China's elderly population will keep increasing, and the trend of population aging will become even more evident.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S1", "idx": 3, "cn": "为了应对人口老龄化带来的种种挑战，国家正积极采取措施，加大对养老的支持。", "en": "To address the various challenges brought by population aging, the country is actively taking measures to increase support for elderly care.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S1", "idx": 4, "cn": "通过改革社会保障 (social security) 制度，政府不断增加社会保障经费，逐步扩大社会保障覆盖范围，使更多老年人受益。", "en": "By reforming the social security system, the government has kept increasing funding for social security and gradually expanded its coverage, benefiting more elderly people.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S1", "idx": 5, "cn": "政府还鼓励各种社会团体为老年人提供服务。", "en": "The government also encourages various social organizations to provide services for the elderly.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S1", "idx": 6, "cn": "在政府和社会团体的共同努力下，老年人将生活得更加幸福。", "en": "With the joint efforts of the government and social organizations, the elderly will live a happier life.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S2", "idx": 1, "cn": "在中国，随着老龄化社会的到来，养老受到普遍关注。", "en": "In China, with the advent of an aging society, the issue of elderly care has drawn widespread attention.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S2", "idx": 2, "cn": "人们谈论最多的是应当采取什么样的养老模式。", "en": "What people talk about most is what kind of elderly care model should be adopted.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S2", "idx": 3, "cn": "多数人认为，养老模式需要多元化。", "en": "Most people believe that elderly care models need to be diversified.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S2", "idx": 4, "cn": "可以通过政府引导和社会参与，建立更多更好的养老服务机构，改进社区服务中心，鼓励居家自助养老，还可以推行家庭养老与社会养老相结合的模式。", "en": "Through government guidance and social participation, we can establish more and better elderly care service institutions, improve community service centers, encourage home-based self-care, and also promote a model that combines family care with social care.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S2", "idx": 5, "cn": "随着政府和社会对养老服务事业投入的持续增加，养老设施将不断升级，服务质量逐步改进，老年人的生活将会更加方便舒适、健康快乐。", "en": "As the government and society continue to increase their investment in elderly care services, care facilities will be constantly upgraded, service quality will gradually improve, and the lives of the elderly will become more convenient, comfortable, healthy and happy.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S3", "idx": 1, "cn": "近年来，中国老龄人口持续增长。", "en": "In recent years, China's elderly population has continued to grow.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S3", "idx": 2, "cn": "中国政府正采取各种措施，推进养老服务体系建设，使老年人晚年生活健康幸福。", "en": "The Chinese government is taking various measures to advance the building of an elderly care service system and ensure that the elderly live a healthy and happy life in their later years.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S3", "idx": 3, "cn": "全国兴建了各类养老服务机构。", "en": "Various elderly care service institutions have been built across the country.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S3", "idx": 4, "cn": "为了提升养老机构的服务质量，政府颁布了一系列标准，加强对养老机构的监管。", "en": "To improve the service quality of elderly care institutions, the government has issued a series of standards to strengthen supervision over them.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S3", "idx": 5, "cn": "许多城市为方便老年人用餐，开设了社区食堂，为他们提供价格实惠的饭菜。", "en": "To make it easier for the elderly to have meals, many cities have opened community canteens offering them affordable food.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S3", "idx": 6, "cn": "行动不便的老年人还能享受上门送餐服务。", "en": "Elderly people with limited mobility can also enjoy door-to-door meal delivery services.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·12·S3", "idx": 7, "cn": "同时，中国还在积极探索居家和社区养老等其他养老模式，以确保所有老年人老有所养。", "en": "Meanwhile, China is also actively exploring other elderly care models such as home-based and community-based care, to ensure that all elderly people are well provided for.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2015·06·S2", "idx": 1, "cn": "2011 年是中国城市化 (urbanization)进程中的历史性时刻，其城市人口首次超过农村人口。", "en": "2011 was a historic moment in China's urbanization process, when its urban population exceeded its rural population for the first time.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2015·06·S2", "idx": 2, "cn": "在未来 20 年里，预计约有 3.5 亿农村人口将移居到城市。", "en": "In the next 20 years, about 350 million rural people are expected to move to cities.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2015·06·S2", "idx": 3, "cn": "如此规模的城市发展对城市交通来说既是挑战，也是机遇。", "en": "Urban development on such a scale is both a challenge and an opportunity for urban transport.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2015·06·S2", "idx": 4, "cn": "中国政府一直提倡“以人为本”的发展理念，强调人们以公交而不是私家车出行。", "en": "The Chinese government has long advocated a \"people-oriented\" development philosophy, emphasizing that people should travel by public transport rather than by private cars.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2015·06·S2", "idx": 5, "cn": "它还号召建设“资源节约和环境友好型”社会。", "en": "It also calls for building a \"resource-conserving and environment-friendly\" society.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2015·06·S2", "idx": 6, "cn": "有了这个明确的目标，中国城市就可以更好地规划其发展，并把大量投资转向安全、清洁和经济型交通系统的发展上。", "en": "With this clear goal, Chinese cities can better plan their development and direct large investments toward developing safe, clean and economical transport systems.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2018·12·S3", "idx": 1, "cn": "过去几年里，移动支付市场在中国蓬勃发展。", "en": "In the past few years, the mobile payment market has been booming in China.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2018·12·S3", "idx": 2, "cn": "随着移动互联网的出现，手机购物逐渐成为一种趋势。", "en": "With the advent of the mobile Internet, mobile shopping has gradually become a trend.", "cls": "A", "sid": "u2_s4", "pid": "u2_s4_p1", "sec": "网上购物", "cov": 0.286, "hits": ["互联网"]}, {"ch": 12, "set": "CET4 2018·12·S3", "idx": 3, "cn": "18 到 30岁的年轻人构成了移动支付市场的最大群体。", "en": "Young people aged 18 to 30 make up the largest group in the mobile payment market.", "cls": "B", "sid": "u2_s2", "pid": "u2_s2_p1", "sec": "体育休闲活动", "cov": 0.105, "hits": ["年轻人"]}, {"ch": 12, "set": "CET4 2018·12·S3", "idx": 4, "cn": "由于现在用手机付款很容易，许多消费者在购物时宁愿用手机付款，而不愿用现金或信用卡。", "en": "As paying with mobile phones is now very easy, many consumers prefer to pay by phone when shopping rather than use cash or credit cards.", "cls": "B", "sid": "u2_s4", "pid": "u2_s4_p3", "sec": "网上购物", "cov": 0.094, "hits": ["消费者"]}, {"ch": 12, "set": "CET4 2018·12·S3", "idx": 5, "cn": "为了鼓励人们多消费，许多商店给使用移动支付的顾客打折。", "en": "To encourage people to spend more, many stores offer discounts to customers who pay by mobile payment.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2018·12·S3", "idx": 6, "cn": "专家预测，中国移动支付市场未来仍有很大发展潜力。", "en": "Experts predict that China's mobile payment market still has great potential for development in the future.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2018·06·S1", "idx": 1, "cn": "过去，乘飞机出行对大多数中国人来说是难以想象的。", "en": "In the past, air travel was unimaginable for most Chinese people.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2018·06·S1", "idx": 2, "cn": "如今，随着经济的发展和生活水平的提高，越来越多的中国人包括许多农民和外出务工人员都能乘飞机出行。", "en": "Today, with economic development and the improvement of living standards, more and more Chinese people, including many farmers and migrant workers, can now travel by air.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2018·06·S1", "idx": 3, "cn": "他们可以乘飞机到达所有大城市，还有很多城市也在筹建机场。", "en": "They can fly to all big cities, and many more cities are also building airports.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2018·06·S1", "idx": 4, "cn": "航空服务不断改进，而且经常会有廉价机票。", "en": "Air services are constantly improving, and discounted air tickets are often available.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2018·06·S1", "idx": 5, "cn": "近年来，节假日期间选择乘飞机外出旅游的人数在不断增加。", "en": "In recent years, the number of people choosing to travel by air during public holidays has been increasing.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2016·12·S1", "idx": 1, "cn": "随着生活水平的提高，度假在中国人生活中的作用越来越重要。", "en": "With the improvement of living standards, vacations are playing an increasingly important role in the lives of Chinese people.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2016·12·S1", "idx": 2, "cn": "过去，中国人的时间主要花在谋生上，很少有机会外出旅行。", "en": "In the past, Chinese people spent most of their time making a living and had few opportunities to travel.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2016·12·S1", "idx": 3, "cn": "然而，近年来中国旅游业发展迅速。", "en": "However, in recent years China's tourism industry has developed rapidly.", "cls": "A", "sid": "u4_s5", "pid": "u4_s5_p4", "sec": "红色旅游景点", "cov": 0.405, "hits": ["旅游业"]}, {"ch": 12, "set": "CET6 2016·12·S1", "idx": 4, "cn": "经济的繁荣和富裕中产阶级的出现，引发了一个前所未有的旅游热潮。", "en": "Economic prosperity and the emergence of a wealthy middle class have triggered an unprecedented tourism boom.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2016·12·S1", "idx": 5, "cn": "中国人不仅在国内旅游，出国旅游也越来越普遍。", "en": "Chinese people not only travel within China, but also increasingly travel abroad.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2016·12·S1", "idx": 6, "cn": "2016 年国庆节假日期间，旅游消费总计超过 4000 亿元。", "en": "During the 2016 National Day holiday, tourism spending totaled more than 400 billion yuan.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2016·12·S1", "idx": 7, "cn": "据世界贸易组织估计，2020 年中国将成为世界上最大的旅游国，在未来几年里将成为出境旅游支出增长最快的国家。", "en": "According to the World Trade Organization, China will become the world's largest tourist country in 2020 and the country with the fastest-growing outbound tourism spending in the years to come.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S1", "idx": 1, "cn": "近年来,越来越多的年轻人喜爱各种形式的自助旅游。", "en": "In recent years, more and more young people have come to enjoy various forms of self-guided travel.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S1", "idx": 2, "cn": "许多自助旅游者选择徒步或骑自行车出游。", "en": "Many self-guided travelers choose to travel on foot or by bicycle.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S1", "idx": 3, "cn": "他们自己设计路线,自带帐篷、厨具以及其他必备的生活用品。", "en": "They design their own routes and bring tents, cooking utensils and other daily necessities with them.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S1", "idx": 4, "cn": "在旅途中,自助旅游者经常能够发现一些新的美丽景点,但有时也会遇见意想不到的困难或突发事件。", "en": "On their journeys, self-guided travelers can often discover some new and beautiful scenic spots, but sometimes they may also encounter unexpected difficulties or emergencies.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S1", "idx": 5, "cn": "游客在旅行中拥抱自然、欣赏美景,同时也增强了自己克服困难的勇气和野外生存的能力。", "en": "While traveling, tourists embrace nature and enjoy beautiful scenery, while also strengthening their courage to overcome difficulties and their ability to survive in the wild.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S2", "idx": 1, "cn": "随着生活水平的提高，更多人开始加入到自驾游的行列之中。", "en": "As living standards improve, more and more people are beginning to join the ranks of self-driving tourists.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S2", "idx": 2, "cn": "自驾游者既可驾驶自家车也可借车或租车出游。", "en": "Self-driving tourists can either drive their own cars or travel in borrowed or rented cars.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S2", "idx": 3, "cn": "司机可能是车主或结伴出游者。", "en": "The driver may be the car owner or a fellow traveler.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S2", "idx": 4, "cn": "自驾游与传统的组团旅游不同,它能够更好地满足旅游者的个性化需求，使他们更好地享受旅游的过程。", "en": "Different from traditional group tours, self-driving tours can better meet the individualized needs of tourists and enable them to better enjoy the travel process.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S2", "idx": 5, "cn": "自驾游尤其受到年轻出游者的欢迎。", "en": "Self-driving tours are especially popular among young travelers.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S2", "idx": 6, "cn": "年轻人追求独立自由的生活,而自驾游恰好满足了他们的这一需求。", "en": "Young people pursue an independent and free life, and self-driving tours happen to meet this need of theirs.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S3", "idx": 1, "cn": "近年来，越来越多的城市居民为农村的田园风光所吸引,利用节假日到乡村旅游。", "en": "In recent years, more and more urban residents have been attracted by the rural scenery and have visited the countryside during holidays.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S3", "idx": 2, "cn": "他们住在农民家中,品尝具有当地风味的农家饭菜。", "en": "They stay in farmers' homes and taste home-style meals with local flavors.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S3", "idx": 3, "cn": "有些游客还参与采摘瓜果等活动,亲身感受收获的喜悦。", "en": "Some tourists also take part in activities such as picking fruits and vegetables, experiencing the joy of harvest in person.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S3", "idx": 4, "cn": "乡村旅游能够有效地帮助游客舒缓压力,放松心情,增进身心健康。", "en": "Rural tourism can effectively help tourists relieve stress, relax and improve their physical and mental health.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2023·03·S3", "idx": 5, "cn": "实际上,这种旅游形式不仅能使城市游客受益,同时也能增加农民的收入,促进农村经济发展。", "en": "In fact, this form of tourism can not only benefit urban tourists but also increase farmers' incomes and promote rural economic development.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2025·12·S2", "idx": 1, "cn": "“城市漫步 (city walk)”在中国的年轻人中悄然兴起，已成为一种旅游新潮流。", "en": "\"City walk\" has quietly emerged among young people in China and has become a new tourism trend.", "cls": "A", "sid": "u2_s2", "pid": "u2_s2_p1", "sec": "体育休闲活动", "cov": 0.28, "hits": ["年轻人"]}, {"ch": 12, "set": "CET4 2025·12·S2", "idx": 2, "cn": "与传统旅游近年来，不同，城市漫步不追求在短时间内游览尽可能多的景点。", "en": "Different from traditional tourism, city walk does not seek to visit as many attractions as possible in a short time.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2025·12·S2", "idx": 3, "cn": "而是随意行走或按照主题路线漫步在城市的大街小巷。", "en": "Instead, they wander at will or stroll along themed routes through the streets and alleys of the city.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2025·12·S2", "idx": 4, "cn": "漫步者品尝地道小吃，欣赏特色建筑，了解当地生活方式。", "en": "Walkers taste authentic local snacks, admire historic buildings and learn about the local way of life.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2025·12·S2", "idx": 5, "cn": "他们还用相机或手机记录城市的风景和人物。", "en": "They also use cameras or mobile phones to record the city's scenery and people.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2025·12·S2", "idx": 6, "cn": "这种旅游方式能让城市漫步者更深入了解城市的历史与文化。", "en": "This way of traveling enables city walkers to gain a deeper understanding of the city's history and culture.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2025·06·S3", "idx": 1, "cn": "近年来，中国东北地区正在大力开发冰雪资源。", "en": "In recent years, Northeast China has been vigorously developing its ice and snow resources.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2025·06·S3", "idx": 2, "cn": "例如，哈尔滨利用丰富的冰雪资源打造了极具地方特色的“冰雪大世界”，让游客在欣赏冰雪之美的同时也能体验当地独特的民俗文化。", "en": "For example, Harbin has used its rich ice and snow resources to create the highly distinctive \"Harbin Ice-Snow World,\" enabling visitors to enjoy the beauty of ice and snow while experiencing the area's unique folk culture.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2025·06·S3", "idx": 3, "cn": "如今，曾令人畏惧的冰天雪地正吸引着四面八方的游客，成为深受欢迎的旅游胜地。", "en": "Today, the once-feared icy world is attracting tourists from near and far and has become a popular tourist destination.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2025·06·S3", "idx": 4, "cn": "冰雪旅游业正为当地的经济发展做出越来越大的贡献。", "en": "The ice and snow tourism industry is making an ever-greater contribution to the local economy.", "cls": "B", "sid": "u4_s5", "pid": "u4_s5_p4", "sec": "红色旅游景点", "cov": 0.227, "hits": ["旅游业"]}, {"ch": 12, "set": "CET4 2024·12·S1", "idx": 1, "cn": "中国政府十分重视环境保护。", "en": "The Chinese government attaches great importance to environmental protection.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2024·12·S1", "idx": 2, "cn": "近年来，中国在减少空气、水和土壤污染上取得了显著成效。", "en": "In recent years, China has achieved remarkable results in reducing air, water and soil pollution.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2024·12·S1", "idx": 3, "cn": "为了不断改善人们的生活环境，中国采取了一系列有效措施，包括大力发展清洁能源，改善公共交通，推广共享单车，实施垃圾分类。", "en": "To continuously improve people's living environment, China has taken a series of effective measures, including vigorously developing clean energy, improving public transport, promoting shared bikes and implementing garbage sorting.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2024·12·S1", "idx": 4, "cn": "通过这些措施，中国的城市和农村正在绿起来、美起来。", "en": "Through these measures, China's cities and countryside are becoming greener and more beautiful.", "cls": "E", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2024·12·S1", "idx": 5, "cn": "中国还积极参与国际合作，为全球环境保护做出了重要贡献。", "en": "China has also actively participated in international cooperation and made important contributions to global environmental protection.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2025·12·S3", "idx": 1, "cn": "中国政府十分重视绿色经济的发展。", "en": "The Chinese government attaches great importance to the development of the green economy.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2025·12·S3", "idx": 2, "cn": "通过加强森林资源保护、加大污染治理力度等一系列措施，许多地区的生态环境得到了显著改善。", "en": "Through a series of measures such as strengthening forest resource protection and intensifying pollution control, the ecological environment in many regions has been significantly improved.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2025·12·S3", "idx": 3, "cn": "绿水青山 (lucid waters and lush mountains) 促进了当地的旅游、健康等产业的发展，创造了可观的经济效益。", "en": "Lucid waters and lush mountains have boosted the development of local tourism, healthcare and other industries, creating considerable economic benefits.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2025·12·S3", "idx": 4, "cn": "如今，生态环境与人类社会和谐共存的观念在中国已深入人心。", "en": "Today, the idea of harmonious coexistence between the ecological environment and human society has taken root in the hearts of the Chinese people.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET4 2025·12·S3", "idx": 5, "cn": "绿色经济的推进不仅能为中国可持续发展做出贡献，也为全球环境保护提供了宝贵经验。", "en": "Advancing the green economy can not only contribute to China's sustainable development but also provide valuable experience for global environmental protection.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2014·06·S1", "idx": 1, "cn": "北京计划未来三年投资 7 600 亿元治理污染，从减少 PM2.5 排放入手。", "en": "Beijing plans to invest 760 billion yuan over the next three years to control pollution, starting with reducing PM2.5 emissions.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2014·06·S1", "idx": 2, "cn": "这一新公布的计划旨在减少四种主要污染源，包括 500 多万辆机动车的尾气(exhaust)排放、周边地区燃煤、来自北方的沙尘暴和本地的建筑灰尘。", "en": "The newly announced plan aims to reduce four major sources of pollution, including exhaust emissions from more than 5 million motor vehicles, coal burning in surrounding areas, sandstorms from the north and local construction dust.", "cls": "B", "sid": "u3_s6", "pid": "u3_s6_p1", "sec": "西安", "cov": 0.094, "hits": ["周边地区"]}, {"ch": 12, "set": "CET6 2014·06·S1", "idx": 3, "cn": "另 850 亿元用于新建或升级城市垃圾处理和污水（sewage)处理设施，加上 300 亿元投资未来三年的丝树造林（forestation)。", "en": "Another 85 billion yuan will be used to build or upgrade urban garbage and sewage treatment facilities, plus 30 billion yuan to be invested in afforestation over the next three years.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2014·06·S1", "idx": 4, "cn": "市政府还计划建造一批水循环利用工厂，并制止违章建筑，以改善环境。", "en": "The municipal government also plans to build a number of water recycling plants and stop illegal construction to improve the environment.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2014·06·S1", "idx": 5, "cn": "另外，北京还将更严厉地处罚违反限排规定的行为。", "en": "In addition, Beijing will punish violations of emission limits more severely.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·06·S1", "idx": 1, "cn": "随着中国经济的快速发展和人们生活水平的稳步提高，城市居民对环境和生活品质的要求越来越高。", "en": "With China's rapid economic development and the steady improvement of people's living standards, urban residents have increasingly high demands for the environment and quality of life.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·06·S1", "idx": 2, "cn": "中国地方政府更加注重公共设施的建设和改进，以更好地满足人们的需求。", "en": "Local governments in China pay more attention to the construction and improvement of public facilities to better meet people's needs.", "cls": "D", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·06·S1", "idx": 3, "cn": "通过兴建新的广场、公园和公共绿地或对原有公共场地重新加以规划改造，许多城市为市民提供了更多休闲和社交的场所。", "en": "By building new squares, parks and public green spaces or re-planning and renovating existing public spaces, many cities have provided citizens with more places for leisure and social activities.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·06·S1", "idx": 4, "cn": "如今，政府出资购置的健身器械和铺设的健身步道在不少城市随处可见，既明显改善了市民户外活动的条件，又使城市更加美丽。", "en": "Today, government-funded fitness facilities and fitness trails can be seen everywhere in many cities, which has both clearly improved the conditions for citizens' outdoor activities and made the cities more beautiful.", "cls": "B", "sid": "u2_s2", "pid": "u2_s2_p1", "sec": "体育休闲活动", "cov": 0.122, "hits": ["随处可见"]}, {"ch": 12, "set": "CET6 2023·06·S3", "idx": 1, "cn": "近年来，中国城市加快发展，城市人居环境得到显著改善。", "en": "In recent years, Chinese cities have developed at a faster pace, and the urban living environment has improved markedly.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·06·S3", "idx": 2, "cn": "许多城市努力探索中国特色的城市高质量发展之路，城市功能不断完善，治理水平明显提高。", "en": "Many cities have worked hard to explore a path of high-quality urban development with Chinese characteristics, with urban functions continuously improved and governance significantly enhanced.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 12, "set": "CET6 2023·06·S3", "idx": 3, "cn": "中国持续开展城市生态修复和功能修补，全面实施城镇老旧小区改造，大力推进城市园林绿化，消除污染；同时大力推进城市基础设施体系化建设，开展房屋建筑和市政设施普查以及安全隐患排查整治，努力为市民创造高品质的生活环境，让城市更美丽、更安全、更宜居。", "en": "China has continuously carried out urban ecological restoration and urban repair, fully implemented the renovation of old residential communities in cities and towns and vigorously promoted urban greening to eliminate pollution; at the same time, it has vigorously advanced the systematic development of urban infrastructure, carried out surveys of buildings and municipal facilities as well as the screening and rectification of potential safety hazards, and worked hard to create a high-quality living environment for urban residents, making cities more beautiful, safer and more livable.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET4 2022.09 第3套", "idx": 1, "cn": "戏曲是一种中国传统的艺术形式，可以追溯到唐朝。", "en": "Chinese traditional opera is a form of traditional Chinese art that can be traced back to the Tang Dynasty.", "cls": "A", "sid": "u3_s1", "pid": "u3_s1_p1", "sec": "戏曲", "cov": 0.3, "hits": []}, {"ch": 3, "set": "CET4 2022.09 第3套", "idx": 2, "cn": "中国戏曲吸引观众的一大特色是其独具风格的脸谱(facialpainting)。", "en": "One striking feature of Chinese opera that attracts audiences is its distinctive facial painting.", "cls": "B", "sid": "u3_s4", "pid": "u3_s4_p2", "sec": "京剧的脸谱与服饰", "cov": 0.05, "hits": ["脸谱"]}, {"ch": 3, "set": "CET4 2022.09 第3套", "idx": 3, "cn": "脸谱代表不同角色的性格和命运。", "en": "The facial painting represents the personalities and destinies of different roles.", "cls": "A", "sid": "u3_s4", "pid": "u3_s4_p3", "sec": "京剧的脸谱与服饰", "cov": 0.31, "hits": []}, {"ch": 3, "set": "CET4 2022.09 第3套", "idx": 4, "cn": "观众通过观察脸谱能够更好地理解这些角色的故事。", "en": "By observing the facial painting, the audience can better understand the stories of these roles.", "cls": "B", "sid": "u3_s4", "pid": "u3_s4_p2", "sec": "京剧的脸谱与服饰", "cov": 0.14, "hits": ["脸谱"]}, {"ch": 3, "set": "CET4 2022.09 第3套", "idx": 5, "cn": "欣赏戏曲是中国人特别是老年人的一大乐趣。", "en": "Appreciating Chinese opera is a great pleasure for Chinese people, especially the elderly.", "cls": "B", "sid": "u3_s1", "pid": "u3_s1_p1", "sec": "戏曲", "cov": 0.11, "hits": ["戏曲"]}, {"ch": 3, "set": "CET4 2022.09 第3套", "idx": 6, "cn": "为了吸引更多的年轻观众 , 传统戏曲正在不断地发展和创新。", "en": "To attract more young audiences, traditional Chinese opera is constantly developing and innovating.", "cls": "B", "sid": "u3_s1", "pid": "u3_s1_p1", "sec": "戏曲", "cov": 0.08, "hits": ["戏曲"]}, {"ch": 3, "set": "CET4 2022.09 第3套", "idx": 7, "cn": "如今，越来越多的外国观众也喜欢中国戏曲。", "en": "Today, more and more foreign audiences also enjoy Chinese opera.", "cls": "B", "sid": "u3_s1", "pid": "u3_s1_p1", "sec": "戏曲", "cov": 0.18, "hits": ["戏曲"]}, {"ch": 3, "set": "CET4 2019.06 第1套", "idx": 1, "cn": "舞狮作为中国传统民间表演已有 2,000 多年历史。", "en": "Lion dance, a traditional Chinese folk performance, has a history of more than 2,000 years.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET4 2019.06 第1套", "idx": 2, "cn": "在狮子舞中，两位表演者同披一件狮子服，一个舞动头部，另一个舞动身体和尾巴。", "en": "In the lion dance, two performers share a single lion costume, with one moving the head and the other moving the body and the tail.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET4 2019.06 第1套", "idx": 3, "cn": "他们熟练配合，模仿狮子的各种动作。", "en": "They coordinate skillfully to imitate the various movements of a lion.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET4 2019.06 第1套", "idx": 4, "cn": "狮子是兽中之王，象征幸福和好运，所以人们通常在春节和其他节日期间表演狮子舞。", "en": "The lion is the king of beasts and symbolizes happiness and good luck, so people usually perform the lion dance during the Spring Festival and other festivals.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET4 2019.06 第1套", "idx": 5, "cn": "狮子舞也可能出现在其他重要场合，如商店开业和结婚典礼，往往吸引许多人观赏。", "en": "The lion dance may also appear on other important occasions, such as shop openings and wedding ceremonies, often attracting many spectators.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET4 2019.06 第3套", "idx": 1, "cn": "剪纸是中国民间艺术的一种独特形式，已有 2,000 多年历年。", "en": "Paper-cutting is a unique form of Chinese folk art with a history of more than 2,000 years.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET4 2019.06 第3套", "idx": 2, "cn": "剪纸很可能源于汉代，继纸张发明之后。", "en": "Paper-cutting most probably originated in the Han Dynasty, following the invention of paper.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET4 2019.06 第3套", "idx": 3, "cn": "从此，它在中国的许多地方得到了普及。", "en": "From then on, it became widespread in many parts of China.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET4 2019.06 第3套", "idx": 4, "cn": "剪纸用的材料和工具很简单：纸和剪刀。", "en": "The materials and tools used for paper-cutting are very simple: paper and scissors.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET4 2019.06 第3套", "idx": 5, "cn": "剪纸作品通常是用红纸做成的，因为红色在中国传统文化中与幸福相联。", "en": "Paper-cutting works are usually made from red paper, because red is associated with happiness in traditional Chinese culture.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET4 2019.06 第3套", "idx": 6, "cn": "因此，在婚礼、春节等喜庆场合，红颜色的剪纸是门窗装饰的首选。", "en": "Therefore, on festive occasions such as weddings and the Spring Festival, red paper-cuttings are the preferred decoration for doors and windows.", "cls": "C", "sid": "", "pid": "", "sec": "", "cov": 0, "hits": []}, {"ch": 3, "set": "CET6 2022.09 第2套", "idx": 1, "cn": "自古以来，印章在中国就是身份的凭证和权力的象征。", "en": "Since ancient times, seals in China have been the proof of identity and a symbol of power.", "cls": "B", "sid": "u1_s7", "pid": "u1_s7_p3", "sec": "绘画", "cov": 0.1, "hits": ["印章"]}, {"ch": 3, "set": "CET6 2022.09 第2套", "idx": 2, "cn": "印章不仅具有实用性，而且也是一种艺术形式，是一门集书法与雕刻于一体的古老艺术，经常被看作与书画并列的独立艺术品。", "en": "Seals are not only practical but also a form of art — an ancient art that combines calligraphy and carving, and they are often regarded as independent works of art that stand alongside calligraphy and painting.", "cls": "B", "sid": "u1_s7", "pid": "u1_s7_p3", "sec": "绘画", "cov": 0.06, "hits": ["印章"]}, {"ch": 3, "set": "CET6 2022.09 第2套", "idx": 3, "cn": "印章从材料的选择、制作的工艺到字体的设计，都具有极其丰富的美学表现。", "en": "From the choice of materials and the craft of production to the design of the characters, seals display extremely rich aesthetic expression.", "cls": "B", "sid": "u1_s7", "pid": "u1_s7_p3", "sec": "绘画", "cov": 0.03, "hits": ["印章"]}, {"ch": 3, "set": "CET6 2022.09 第2套", "idx": 4, "cn": "其他国家的艺术家通常在其绘画作品上签名，而中国艺术家则往往在其书画作品上盖上印章代替签名。", "en": "Artists in other countries usually sign their paintings, while Chinese artists often stamp a seal on their paintings and calligraphy instead of signing.", "cls": "B", "sid": "u1_s7", "pid": "u1_s7_p3", "sec": "绘画", "cov": 0.17, "hits": ["印章"]}, {"ch": 3, "set": "CET6 2022.09 第2套", "idx": 5, "cn": "这样，印章也就成为作品的组成部分，是体现作品独特性的一种方式。", "en": "In this way, the seal also becomes part of the work and a way of expressing its uniqueness.", "cls": "B", "sid": "u1_s7", "pid": "u1_s7_p3", "sec": "绘画", "cov": 0.12, "hits": ["印章"]}, {"ch": 3, "set": "CET6 2024.06 第3套", "idx": 1, "cn": "扇子自古以来就深
