魏、蜀、吴三国之间的战争。","en":"Set against the history of the Three Kingdoms period, this literary work describes the wars among the three kingdoms of Wei, Shu and Wu from the second half of the second century AD to the second half of the third century AD.","set":"CET6 2020·07·S1","cls":"B","ch":2},{"cn":"《 三国演义》 是一部公认的文学杰作。","en":"The Romance of the Three Kingdoms is a recognized literary masterpiece.","set":"CET6 2020·07·S1","cls":"C","ch":2}],"水浒传":[{"cn":"《水浒传》(Water Margin)是中国文学四大经典小说之一。","en":"Water Margin is one of the four great classical novels of Chinese literature.","set":"CET6 2020·09·S1","cls":"A","ch":2},{"cn":"这部小说基于历史人物宋江及其伙伴反抗封建帝王的故事，数百年来一直深受中国读者的喜爱。","en":"Based on the story of the historical figures Song Jiang and his companions rebelling against the feudal emperors, this novel has been deeply loved by Chinese readers for centuries.","set":"CET6 2020·09·S1","cls":"C","ch":2}],"四大名著":[{"cn":"《水浒传》(Water Margin)是中国文学四大经典小说之一。","en":"Water Margin is one of the four great classical novels of Chinese literature.","set":"CET6 2020·09·S1","cls":"A","ch":2},{"cn":"《西游记》(Journey to the West)也许是中国文学四大经典小说中最具影响力的一部，当然也是在国外最广为人知的一部小说。","en":"Journey to the West is perhaps the most influential of the four great classical novels of Chinese literature, and certainly the best known abroad.","set":"CET6 2020·09·S3","cls":"A","ch":2}],"小说人物":[{"cn":"毫不夸张地说，几乎每个中国人都熟悉小说中的一些主要人物。","en":"It is no exaggeration to say that almost every Chinese is familiar with some of the main characters in the novel.","set":"CET6 2020·09·S1","cls":"B","ch":2},{"cn":"书中有大约30个主要人物和400多个次要人物，每个人物都刻画得栩栩如生，具有鲜明的个性。","en":"The book contains about 30 main characters and more than 400 minor ones, each portrayed vividly and with a distinct personality.","set":"CET6 2020·09·S2","cls":"D","ch":2}],"茶馆":[{"cn":"这部小说中的精彩故事在茶馆、戏剧舞台、广播电视、电影屏幕和无数家庭中反复讲述。","en":"The wonderful stories in this novel have been told and retold in teahouses, on the stage, on radio and television, on the cinema screen and in countless households.","set":"CET6 2020·09·S1","cls":"D","ch":2},{"cn":"在明清（the Ming and Qing Dynasties）期间，茶馆遍布全国。","en":"During the Ming and Qing Dynasties, teahouses could be found all over the country.","set":"CET4 2013·12·S3","cls":"C","ch":8}],"红楼梦":[{"cn":"《红楼梦》(Dream of the Red Chamber)是18世纪曹雪芹创作的一部小说。","en":"Dream of the Red Chamber is a novel written by Cao Xueqin in the 18th century.","set":"CET6 2020·09·S2","cls":"A","ch":2},{"cn":"《红楼梦》融合了现实主义和浪漫主义，具有很强的艺术感染力。","en":"Dream of the Red Chamber combines realism and romanticism and has strong artistic appeal.","set":"CET6 2020·09·S2","cls":"A","ch":2},{"cn":"它被普遍认为是中国最伟大的小说，也是世界上最伟大的文学创作之一。","en":"It is generally regarded as the greatest novel in China and one of the greatest literary creations in the world.","set":"CET6 2020·09·S2","cls":"C","ch":2}],"曹雪芹":[{"cn":"《红楼梦》(Dream of the Red Chamber)是18世纪曹雪芹创作的一部小说。","en":"Dream of the Red Chamber is a novel written by Cao Xueqin in the 18th century.","set":"CET6 2020·09·S2","cls":"A","ch":2},{"cn":"曹雪芹基于自己痛苦的个人经历，讲述了贾宝玉和林黛玉之间的悲剧性爱情故事。","en":"Drawing on his own painful personal experience, Cao Xueqin tells the tragic love story between Jia Baoyu and Lin Daiyu.","set":"CET6 2020·09·S2","cls":"A","ch":2}],"现实主义":[{"cn":"《红楼梦》融合了现实主义和浪漫主义，具有很强的艺术感染力。","en":"Dream of the Red Chamber combines realism and romanticism and has strong artistic appeal.","set":"CET6 2020·09·S2","cls":"A","ch":2}],"浪漫主义":[{"cn":"《红楼梦》融合了现实主义和浪漫主义，具有很强的艺术感染力。","en":"Dream of the Red Chamber combines realism and romanticism and has strong artistic appeal.","set":"CET6 2020·09·S2","cls":"A","ch":2}],"西游记":[{"cn":"《西游记》(Journey to the West)也许是中国文学四大经典小说中最具影响力的一部，当然也是在国外最广为人知的一部小说。","en":"Journey to the West is perhaps the most influential of the four great classical novels of Chinese literature, and certainly the best known abroad.","set":"CET6 2020·09·S3","cls":"A","ch":2},{"cn":"这部小说描绘了著名僧侣玄奘在三个随从的陪同下穿越中国西部地区前往印度取经(Buddhist scripture)的艰难历程。","en":"The novel depicts the arduous journey of the famous monk Xuanzang, accompanied by three disciples, across western China to India to obtain Buddhist scriptures.","set":"CET6 2020·09·S3","cls":"C","ch":2}],"佛教":[{"cn":"虽然故事的主题基于佛教，但这部小说采用了大量中国民间故事和神话的素材，创造了各种栩栩如生的人物和动物形象。","en":"Although the theme of the story is based on Buddhism, the novel draws heavily on Chinese folk tales and myths, creating a variety of lifelike human and animal characters.","set":"CET6 2020·09·S3","cls":"C","ch":2}],"尊师":[{"cn":"为弘扬尊师的优良传统，中国从1985年开始将每年的9月10日定为教师节。","en":"To promote the fine tradition of respecting teachers, China has designated September 10 as Teachers' Day every year since 1985.","set":"CET4 2026·06·S1","cls":"C","ch":4},{"cn":"尊师是中华民族的传统美德，在当今社会得到了发扬光大。","en":"Respecting teachers is a traditional virtue of the Chinese nation, and it has been carried forward in today's society.","set":"CET4 2026·06·S1","cls":"C","ch":4}],"人类文明":[{"cn":"中国航天事业的迅速发展在中华民族的历史上写下了辉煌一页，也为人类文明进步做出了巨大贡献。","en":"The rapid development of China's space industry has written a glorious page in the history of the Chinese nation and made great contributions to the progress of human civilization.","set":"CET6 2024·12·S3","cls":"A","ch":5},{"cn":"坎儿井体现了我国人民与自然和谐共存的智慧，是对人类文明的一大贡献。","en":"The karez embodies the wisdom of our people in living in harmony with nature and is a great contribution to human civilization.","set":"CET4 2021·12·S2","cls":"C","ch":10}],"功夫":[{"cn":"功夫（Kong Fu) 是中国武术（martial arts）的俗称。","en":"Kung Fu is a common name for Chinese martial arts.","set":"CET4 2016·06·S1","cls":"A","ch":6}],"武术":[{"cn":"功夫（Kong Fu) 是中国武术（martial arts）的俗称。","en":"Kung Fu is a common name for Chinese martial arts.","set":"CET4 2016·06·S1","cls":"A","ch":6},{"cn":"中国武术的起源可以追溯到自卫的需要，狩猎活动以及古代中国的军士训练。","en":"The origin of Chinese martial arts can be traced back to the need for self-defense, hunting activities, and the military training of ancient China.","set":"CET4 2016·06·S1","cls":"B","ch":6},{"cn":"作为中国的国宝，武术有上百种不同的风格，是世界上练得最多的武术形式。","en":"As a national treasure of China, martial arts has hundreds of different styles and is the most widely practiced form of martial arts in the world.","set":"CET4 2016·06·S1","cls":"C","ch":6},{"cn":"太极拳 (Taijiquan)起源于中国古代，是中国武术 (martialart)的一个重要分支。","en":"Taijiquan originated in ancient China and is an important branch of Chinese martial arts.","set":"CET4 2022·09·S1","cls":"A","ch":6}],"老年人":[{"cn":"它是中国传统体育运动的一种，年轻人和老年人都练。","en":"It is one of the traditional Chinese sports, and it is practiced by both young and old people.","set":"CET4 2016·06·S1","cls":"A","ch":6},{"cn":"在政府和社会团体的共同努力下，老年人将生活得更加幸福。","en":"With the joint efforts of the government and social organizations, the elderly will live a happier life.","set":"CET6 2023·12·S1","cls":"D","ch":12}],"太极拳":[{"cn":"太极拳 (Taijiquan)起源于中国古代，是中国武术 (martialart)的一个重要分支。","en":"Taijiquan originated in ancient China and is an important branch of Chinese martial arts.","set":"CET4 2022·09·S1","cls":"A","ch":6}],"身心健康":[{"cn":"练太极拳最初是为了自卫，现在是促进身心健康的有效锻炼方式。","en":"Practicing Taijiquan was originally for self-defense, but now it is an effective way of exercise to promote physical and mental health.","set":"CET4 2022·09·S1","cls":"C","ch":6},{"cn":"乡村旅游能够有效地帮助游客舒缓压力,放松心情,增进身心健康。","en":"Rural tourism can effectively help tourists relieve stress, relax and improve their physical and mental health.","set":"CET4 2023·03·S3","cls":"C","ch":12}],"中秋节":[{"cn":"过中秋节的习俗于唐代早期在中国各地开始流行。","en":"The custom of celebrating the Mid-Autumn Festival began to gain popularity across China in the early Tang Dynasty.","set":"CET6 2013·12·S3","cls":"C","ch":7},{"cn":"2006年，中秋节被列为中国的文化遗产，2008年又被定为公共假日。","en":"In 2006, the Mid-Autumn Festival was listed as a form of China's cultural heritage, and in 2008 it was designated as a public holiday.","set":"CET6 2013·12·S3","cls":"B","ch":7},{"cn":"中国的春节、中秋节等传统节日的日期都基于农历。","en":"The dates of traditional Chinese festivals such as the Spring Festival and the Mid-Autumn Festival are all based on the lunar calendar.","set":"CET4 2024·06·S2","cls":"A","ch":7}],"农历":[{"cn":"中秋节在农历八月十五，是人们拜月的节日。","en":"The Mid-Autumn Festival falls on the fifteenth day of the eighth lunar month and is a festival for people to worship the moon.","set":"CET6 2013·12·S3","cls":"A","ch":7},{"cn":"在中国农历中，立秋(Start of Autumn)意味着夏天的结束和秋天的开始。","en":"In the Chinese lunar calendar, Start of Autumn means the end of summer and the beginning of autumn.","set":"CET4 2022·12·S1","cls":"C","ch":7},{"cn":"农历 (the lunar calendar) 起源于数千年前的中国，根据太阳和月亮的运行规律制定。","en":"The lunar calendar originated in China thousands of years ago and was formulated according to the movements of the sun and the moon.","set":"CET4 2024·06·S2","cls":"C","ch":7},{"cn":"长期以来，农历在农业生产和人们日常生活中发挥着重要作用。","en":"For a long time, the lunar calendar has played an important role in agricultural production and people's daily life.","set":"CET4 2024·06·S2","cls":"C","ch":7},{"cn":"古人依据农历记录日期、安排农活，以便最有效地利用自然资源和气候条件，提高农作物的产量和质量。","en":"The ancients recorded dates and arranged farm work according to the lunar calendar so as to make the most effective use of natural resources and climatic conditions and improve the yield and quality of crops.","set":"CET4 2024·06·S2","cls":"C","ch":7},{"cn":"中国的春节、中秋节等传统节日的日期都基于农历。","en":"The dates of traditional Chinese festivals such as the Spring Festival and the Mid-Autumn Festival are all based on the lunar calendar.","set":"CET4 2024·06·S2","cls":"A","ch":7},{"cn":"农历是中国传统文化的重要组成部分，当今依然广为使用。","en":"The lunar calendar is an important part of traditional Chinese culture and is still widely used today.","set":"CET4 2024·06·S2","cls":"B","ch":7}],"月饼":[{"cn":"月饼被视为中秋节不可或缺的美食。","en":"Mooncakes are regarded as an indispensable delicacy of the Mid-Autumn Festival.","set":"CET6 2013·12·S3","cls":"A","ch":7},{"cn":"人们将月饼作为礼物馈赠亲友或在家庭聚会上享用。","en":"People give mooncakes as gifts to relatives and friends, or enjoy them at family gatherings.","set":"CET6 2013·12·S3","cls":"C","ch":7},{"cn":"传统的月饼上带有“寿”（longevity）、“福”或“和”等字样。","en":"Traditional mooncakes bear characters such as \"shou\" (longevity), \"fu\" (good fortune) and \"he\" (harmony).","set":"CET6 2013·12·S3","cls":"C","ch":7}],"春节":[{"cn":"春节前夕吃团圆饭是中国人的传统。","en":"Eating the reunion dinner on the eve of the Spring Festival is a Chinese tradition.","set":"CET4 2020·12·S2","cls":"A","ch":7},{"cn":"，鱼是春节前夕餐桌上不可或缺的一道莱，因为汉语中“鱼”字的发音与“余”字的发音相同。","en":"Fish is an indispensable dish on the dinner table on the eve of the Spring Festival, because the pronunciation of the Chinese character for \"fish\" is the same as that of \"surplus\".","set":"CET4 2020·12·S3","cls":"B","ch":7},{"cn":"正由于这个象征性的意义，春节期间鱼也作为礼物送给亲戚朋友。","en":"Because of this symbolic meaning, fish is also given as a gift to relatives and friends during the Spring Festival.","set":"CET4 2020·12·S3","cls":"B","ch":7},{"cn":"按照中国民间的传统习俗，春节期间长辈通常会给孩子发红包，俗称发压岁钱(luckymoney),以表达对孩子的祝福，祝他们好运。","en":"According to traditional Chinese folk customs, during the Spring Festival elders usually give children red envelopes, commonly known as \"lucky money\", to express their blessings and wish them good luck.","set":"CET4 2022·09·S2","cls":"A","ch":7},{"cn":"中国的春节、中秋节等传统节日的日期都基于农历。","en":"The dates of traditional Chinese festivals such as the Spring Festival and the Mid-Autumn Festival are all based on the lunar calendar.","set":"CET4 2024·06·S2","cls":"A","ch":7},{"cn":"春节贴福字是民间由来已久的习俗。","en":"Pasting the \"fu\" character during the Spring Festival is a long-standing folk custom.","set":"CET4 2024·06·S3","cls":"B","ch":7},{"cn":"为了欢庆春节，家家户户都会将福字贴在门上或墙上，表达对幸福生活的向往、对美好未来的期待。","en":"To celebrate the Spring Festival, every household pastes the \"fu\" character on the door or wall, expressing their yearning for a happy life and their expectation of a bright future.","set":"CET4 2024·06·S3","cls":"B","ch":7},{"cn":"贴春联(Spring Festival couplets)是中国人欢度春节的一个重要习俗。","en":"Pasting Spring Festival couplets is an important custom for Chinese people to celebrate the Spring Festival.","set":"CET6 2022·09·S1","cls":"A","ch":7},{"cn":"当家家户户贴春联时，人们就会意识到春节已经正式拉开序幕。","en":"When every household pastes Spring Festival couplets, people realize that the Spring Festival has officially begun.","set":"CET6 2022·09·S1","cls":"A","ch":7},{"cn":"在中国传统文化中，红灯笼象征生活美满和生意兴隆，通常在春节、元宵节和国庆等节日期间悬挂。","en":"In traditional Chinese culture, red lanterns symbolize a happy life and a thriving business, and are usually hung during festivals such as the Spring Festival, the Lantern Festival and National Day.","set":"CET4 2019·06·S2","cls":"B","ch":7},{"cn":"在春节和其他喜庆场合，红色到处可见。","en":"During the Spring Festival and other festive occasions, red can be seen everywhere.","set":"CET4 2016·12·S1","cls":"C","ch":7},{"cn":"狮子是兽中之王，象征幸福和好运，所以人们通常在春节和其他节日期间表演狮子舞。","en":"The lion is the king of beasts and symbolizes happiness and good luck, so people usually perform the lion dance during the Spring Festival and other festivals.","set":"CET4 2019.06 第1套","cls":"C","ch":3},{"cn":"因此，在婚礼、春节等喜庆场合，红颜色的剪纸是门窗装饰的首选。","en":"Therefore, on festive occasions such as weddings and the Spring Festival, red paper-cuttings are the preferred decoration for doors and windows.","set":"CET4 2019.06 第3套","cls":"C","ch":3},{"cn":"普通大众也都喜爱梅花,春节期间常用于家庭装饰。","en":"Ordinary people also love the plum blossom, and it is often used to decorate homes during the Spring Festival.","set":"CET6 2019.12 第2套","cls":"C","ch":3}],"团圆饭":[{"cn":"春节前夕吃团圆饭是中国人的传统。","en":"Eating the reunion dinner on the eve of the Spring Festival is a Chinese tradition.","set":"CET4 2020·12·S2","cls":"A","ch":7},{"cn":"团圆饭是一年中最重要的晚餐，也是家庭团聚的最佳时机，家人生活在不同地方的家庭尤其如此。","en":"The reunion dinner is the most important dinner of the year and the best time for family reunions, especially for families whose members live in different places.","set":"CET4 2020·12·S2","cls":"C","ch":7},{"cn":"团圆饭上的菜看丰富多样，其中有些菜看有特殊含义。","en":"The dishes at the reunion dinner are rich and varied, and some of them have special meanings.","set":"CET4 2020·12·S2","cls":"C","ch":7}],"年年有余":[{"cn":"例如，鱼是不可缺少的一道莱，因为汉语中的“鱼”宇和“余”宇听上去一样。","en":"For example, fish is an indispensable dish, because the Chinese characters for \"fish\" and \"surplus\" sound the same.","set":"CET4 2020·12·S2","cls":"C","ch":7},{"cn":"，鱼是春节前夕餐桌上不可或缺的一道莱，因为汉语中“鱼”字的发音与“余”字的发音相同。","en":"Fish is an indispensable dish on the dinner table on the eve of the Spring Festival, because the pronunciation of the Chinese character for \"fish\" is the same as that of \"surplus\".","set":"CET4 2020·12·S3","cls":"B","ch":7}],"饺子":[{"cn":"在中国的许多地方，饺子也是一道重要的佳肴，因为饺子象征着财富和好运。","en":"In many parts of China, jiaozi is also an important dish, because it symbolizes wealth and good luck.","set":"CET4 2020·12·S2","cls":"D","ch":7},{"cn":"北方人有冬至吃饺子(jiaozi)的习俗，南方人有冬至吃汤圆(tangyuan)的传统。","en":"People in the north have the custom of eating jiaozi on Winter Solstice, while people in the south have the tradition of eating tangyuan.","set":"CET4 2022·12·S3","cls":"B","ch":7}],"红包":[{"cn":"按照中国民间的传统习俗，春节期间长辈通常会给孩子发红包，俗称发压岁钱(luckymoney),以表达对孩子的祝福，祝他们好运。","en":"According to traditional Chinese folk customs, during the Spring Festival elders usually give children red envelopes, commonly known as \"lucky money\", to express their blessings and wish them good luck.","set":"CET4 2022·09·S2","cls":"A","ch":7},{"cn":"如今，红包不仅是给孩子的礼物，而且经常也是给长辈或亲朋好友的礼物。","en":"Today, red envelopes are not only gifts for children but also gifts for elders or relatives and friends.","set":"CET4 2022·09·S2","cls":"B","ch":7}],"压岁钱":[{"cn":"按照中国民间的传统习俗，春节期间长辈通常会给孩子发红包，俗称发压岁钱(luckymoney),以表达对孩子的祝福，祝他们好运。","en":"According to traditional Chinese folk customs, during the Spring Festival elders usually give children red envelopes, commonly known as \"lucky money\", to express their blessings and wish them good luck.","set":"CET4 2022·09·S2","cls":"A","ch":7}],"立秋":[{"cn":"在中国农历中，立秋(Start of Autumn)意味着夏天的结束和秋天的开始。","en":"In the Chinese lunar calendar, Start of Autumn means the end of summer and the beginning of autumn.","set":"CET4 2022·12·S1","cls":"C","ch":7},{"cn":"立秋带来的首先是天气的变化，气温逐渐下降。","en":"What Start of Autumn brings first is a change in the weather, as temperatures gradually drop.","set":"CET4 2022·12·S1","cls":"C","ch":7},{"cn":"立秋对农民意义重大，这时各种秋季作物迅速生长、开始成熟，收获的季节即将到来。","en":"Start of Autumn is of great significance to farmers; at this time, various autumn crops grow rapidly and begin to ripen, and the harvest season is approaching.","set":"CET4 2022·12·S1","cls":"C","ch":7}],"冬至":[{"cn":"冬至(Winter Solstice)是全年白昼最短、黑夜最长的一天，标志着一年中最寒冷时节的开始。","en":"Winter Solstice is the shortest day and the longest night of the year, marking the beginning of the coldest season of the year.","set":"CET4 2022·12·S3","cls":"C","ch":7},{"cn":"冬至过后，气温越来越低，人们的户外活动逐渐减少。","en":"After Winter Solstice, temperatures drop lower and lower, and people's outdoor activities gradually decrease.","set":"CET4 2022·12·S3","cls":"C","ch":7},{"cn":"中国人历来很重视冬至，许多地方都把冬至当作一个节日，庆祝方式各地不尽相同。","en":"Chinese people have always attached great importance to Winter Solstice; in many places it is treated as a festival, and the ways of celebration vary from place to place.","set":"CET4 2022·12·S3","cls":"C","ch":7},{"cn":"北方人有冬至吃饺子(jiaozi)的习俗，南方人有冬至吃汤圆(tangyuan)的传统。","en":"People in the north have the custom of eating jiaozi on Winter Solstice, while people in the south have the tradition of eating tangyuan.","set":"CET4 2022·12·S3","cls":"B","ch":7}],"福字":[{"cn":"汉语中的“福”字 (the character fu) 表示幸福和好运，是中国传统文化中最常用的吉祥 (auspicious)符号之一。","en":"The Chinese character \"fu\" in Chinese means happiness and good luck, and is one of the most commonly used auspicious symbols in traditional Chinese culture.","set":"CET4 2024·06·S3","cls":"C","ch":7},{"cn":"人们通常将一个大大的福字写在红纸上，寓意期盼家庭幸福、社会安定、国家昌盛。","en":"People usually write a big \"fu\" character on red paper, symbolizing the hope for family happiness, social stability and national prosperity.","set":"CET4 2024·06·S3","cls":"D","ch":7},{"cn":"春节贴福字是民间由来已久的习俗。","en":"Pasting the \"fu\" character during the Spring Festival is a long-standing folk custom.","set":"CET4 2024·06·S3","cls":"B","ch":7},{"cn":"人们有时还将福字倒过来贴，表示幸福已到、好运已到。","en":"People sometimes paste the \"fu\" character upside down, indicating that good fortune and good luck have arrived.","set":"CET4 2024·06·S3","cls":"C","ch":7}],"幸福":[{"cn":"汉语中的“福”字 (the character fu) 表示幸福和好运，是中国传统文化中最常用的吉祥 (auspicious)符号之一。","en":"The Chinese character \"fu\" in Chinese means happiness and good luck, and is one of the most commonly used auspicious symbols in traditional Chinese culture.","set":"CET4 2024·06·S3","cls":"C","ch":7},{"cn":"在中国文化中，红色通常象征着好运、长寿和幸福。","en":"In Chinese culture, red usually symbolizes good luck, longevity and happiness.","set":"CET4 2016·12·S1","cls":"C","ch":7}],"好运":[{"cn":"汉语中的“福”字 (the character fu) 表示幸福和好运，是中国传统文化中最常用的吉祥 (auspicious)符号之一。","en":"The Chinese character \"fu\" in Chinese means happiness and good luck, and is one of the most commonly used auspicious symbols in traditional Chinese culture.","set":"CET4 2024·06·S3","cls":"C","ch":7},{"cn":"在中国文化中，红色通常象征着好运、长寿和幸福。","en":"In Chinese culture, red usually symbolizes good luck, longevity and happiness.","set":"CET4 2016·12·S1","cls":"C","ch":7},{"cn":"然而，红色并不总是代表好运和快乐。","en":"However, red does not always represent good luck and happiness.","set":"CET4 2016·12·S1","cls":"C","ch":7}],"春联":[{"cn":"贴春联(Spring Festival couplets)是中国人欢度春节的一个重要习俗。","en":"Pasting Spring Festival couplets is an important custom for Chinese people to celebrate the Spring Festival.","set":"CET6 2022·09·S1","cls":"A","ch":7},{"cn":"春联由一对诗句和四字横批(horizontal scroll)组成，诗句和横批用金色或黑色写在红纸上，红色代表幸运，金色代表财富。","en":"Spring Festival couplets are composed of a pair of poetic lines and a four-character horizontal scroll, which are written on red paper in gold or black; red represents good luck and gold represents wealth.","set":"CET6 2022·09·S1","cls":"C","ch":7},{"cn":"春联贴在大门左右两侧和门框上方。","en":"Spring Festival couplets are pasted on both sides of the front gate and above the door frame.","set":"CET6 2022·09·S1","cls":"B","ch":7},{"cn":"春联的诗句体现中国传统诗词的特点，两句诗的字数相同、内容相关。","en":"The poetic lines of Spring Festival couplets reflect the characteristics of traditional Chinese poetry: the two lines have the same number of characters and are related in content.","set":"CET6 2022·09·S1","cls":"C","ch":7},{"cn":"春联以简洁的文字描绘生动的形象，抒发美好的愿望。","en":"Spring Festival couplets use concise words to depict vivid images and express beautiful wishes.","set":"CET6 2022·09·S1","cls":"C","ch":7},{"cn":"当家家户户贴春联时，人们就会意识到春节已经正式拉开序幕。","en":"When every household pastes Spring Festival couplets, people realize that the Spring Festival has officially begun.","set":"CET6 2022·09·S1","cls":"A","ch":7}],"横批":[{"cn":"春联由一对诗句和四字横批(horizontal scroll)组成，诗句和横批用金色或黑色写在红纸上，红色代表幸运，金色代表财富。","en":"Spring Festival couplets are composed of a pair of poetic lines and a four-character horizontal scroll, which are written on red paper in gold or black; red represents good luck and gold represents wealth.","set":"CET6 2022·09·S1","cls":"C","ch":7},{"cn":"横批凸显春联的主题，更是锦上添花。","en":"The horizontal scroll highlights the theme of the couplets and even adds a finishing touch.","set":"CET6 2022·09·S1","cls":"B","ch":7}],"灯笼":[{"cn":"灯笼起源于东汉，最初主要用于照明。","en":"Lanterns originated in the Eastern Han Dynasty and were initially used mainly for illumination.","set":"CET4 2019·06·S2","cls":"C","ch":7},{"cn":"在唐代，人们用红灯笼来庆祝安定的生活。","en":"In the Tang Dynasty, people used red lanterns to celebrate a stable life.","set":"CET4 2019·06·S2","cls":"C","ch":7},{"cn":"从那时起，灯笼在中国的许多地方流行起来。","en":"From then on, lanterns became popular in many parts of China.","set":"CET4 2019·06·S2","cls":"C","ch":7},{"cn":"灯笼通常用色彩鲜艳的薄纸，形状和尺寸各异。","en":"Lanterns are usually made of thin, brightly colored paper and come in various shapes and sizes.","set":"CET4 2019·06·S2","cls":"C","ch":7},{"cn":"在中国传统文化中，红灯笼象征生活美满和生意兴隆，通常在春节、元宵节和国庆等节日期间悬挂。","en":"In traditional Chinese culture, red lanterns symbolize a happy life and a thriving business, and are usually hung during festivals such as the Spring Festival, the Lantern Festival and National Day.","set":"CET4 2019·06·S2","cls":"B","ch":7},{"cn":"如今，世界上许多其他地方也能看到红灯笼。","en":"Today, red lanterns can also be seen in many other parts of the world.","set":"CET4 2019·06·S2","cls":"C","ch":7}],"元宵节":[{"cn":"在中国传统文化中，红灯笼象征生活美满和生意兴隆，通常在春节、元宵节和国庆等节日期间悬挂。","en":"In traditional Chinese culture, red lanterns symbolize a happy life and a thriving business, and are usually hung during festivals such as the Spring Festival, the Lantern Festival and National Day.","set":"CET4 2019·06·S2","cls":"B","ch":7}],"中餐":[{"cn":"许多人喜欢中餐。","en":"Many people like Chinese food.","set":"CET4 2013·12·S1","cls":"C","ch":8},{"cn":"精心准备的中餐既可口又好看。","en":"A well-prepared Chinese meal is both delicious and good-looking.","set":"CET4 2013·12·S1","cls":"C","ch":8},{"cn":"由于食物对健康至关重要，好的厨师总是努力在谷物、肉类和蔬菜之间取得平衡，所以中餐既味美又健康。","en":"Since food is vital to health, good chefs always strive to strike a balance among grains, meat and vegetables, so Chinese food is both delicious and healthy.","set":"CET4 2013·12·S1","cls":"C","ch":8}],"配料":[{"cn":"烹饪技艺和配料在中国各地差别很大。","en":"Cooking techniques and ingredients vary greatly from region to region across China.","set":"CET4 2013·12·S1","cls":"B","ch":8},{"cn":"吃火锅时，人们可以根据自己的口味放肉、海鲜、蔬菜和其他配料，自己烹饪。","en":"When eating hot pot, people can add meat, seafood, vegetables and other ingredients according to their own taste, and cook the food themselves.","set":"CET4 2020·07·S1","cls":"C","ch":8}],"明清":[{"cn":"在明清（the Ming and Qing Dynasties）期间，茶馆遍布全国。","en":"During the Ming and Qing Dynasties, teahouses could be found all over the country.","set":"CET4 2013·12·S3","cls":"C","ch":8}],"饮茶":[{"cn":"饮茶在六世纪传到日本，但直到十七、十八世纪才传到欧美。","en":"Tea drinking spread to Japan in the sixth century, but it did not reach Europe and America until the 17th and 18th centuries.","set":"CET4 2013·12·S3","cls":"D","ch":8}],"小麦":[{"cn":"中国南方大多种植水稻，人们通常以大米为主食；而华北大部分地区因为过于寒冷或过于干燥,无法种植水稻，那里的主要作物是小麦。","en":"Rice is widely grown in southern China, where people usually take rice as their staple food; in most parts of North China, however, rice cannot be grown because it is too cold or too dry, so the main crop there is wheat.","set":"CET4 2015·06·S3","cls":"C","ch":8},{"cn":"中国农业产量全球第一，主要生产水稻、小麦和豆类。","en":"China's agricultural output ranks first in the world, mainly producing rice, wheat and beans.","set":"CET6 2016·12·S3","cls":"D","ch":11}],"火锅":[{"cn":"在中国，火锅已有2，000多年的历史，最早流行于最寒冷的地区，然后在很多地区盛行，出现了具有地方特色的种类。","en":"In China, hot pot has a history of more than 2,000 years. It first became popular in the coldest regions and then spread widely across many areas, giving rise to varieties with local characteristics.","set":"CET4 2020·07·S1","cls":"C","ch":8},{"cn":"吃火锅时，家人和朋友围坐在桌边，桌子中间放着热腾腾的火锅。","en":"When eating hot pot, family members and friends sit around a table with a steaming hot pot in the middle.","set":"CET4 2020·07·S1","cls":"B","ch":8},{"cn":"吃火锅时，人们可以根据自己的口味放肉、海鲜、蔬菜和其他配料，自己烹饪。","en":"When eating hot pot, people can add meat, seafood, vegetables and other ingredients according to their own taste, and cook the food themselves.","set":"CET4 2020·07·S1","cls":"C","ch":8}],"茅台":[{"cn":"茅台（Moutai)是中国最有名的白酒，在新中国成立前夕，被选为国宴用酒。","en":"Moutai is China's most famous baijiu and, on the eve of the founding of New China, was chosen as the liquor for state banquets.","set":"CET4 2020·09·S1","cls":"C","ch":8},{"cn":"据说赤水沿岸的村民四千年前就开始酿造茅台。","en":"It is said that villagers along the Chishui River began to brew Moutai four thousand years ago.","set":"CET4 2020·09·S1","cls":"C","ch":8}],"西汉":[{"cn":"在西汉时期，那里的人们生产出了高质量的茅台，并把它贡给皇帝。","en":"During the Western Han Dynasty, the people there produced high-quality Moutai and presented it to the emperor as tribute.","set":"CET4 2020·09·S1","cls":"C","ch":8}],"皇帝":[{"cn":"在西汉时期，那里的人们生产出了高质量的茅台，并把它贡给皇帝。","en":"During the Western Han Dynasty, the people there produced high-quality Moutai and presented it to the emperor as tribute.","set":"CET4 2020·09·S1","cls":"C","ch":8},{"cn":"来自全国各地的厨师被挑选出来到京城为皇帝做饭。","en":"Chefs from all over the country were selected to cook for the emperor in the capital.","set":"CET4 2020·09·S3","cls":"D","ch":8}],"海上丝绸之路":[{"cn":"自唐朝开始，这种地方酒通过海上丝绸之路运往海外。","en":"Starting in the Tang Dynasty, this local liquor was shipped overseas along the Maritime Silk Road.","set":"CET4 2020·09·S1","cls":"C","ch":8}],"茶具":[{"cn":"昂贵、雅致的茶具成了地位的象征。","en":"Expensive and elegant tea sets became a symbol of status.","set":"CET4 2020·09·S2","cls":"D","ch":8}],"品茶":[{"cn":"越来越多的国际游客一边品茶，一边了解中国文化。","en":"More and more international tourists learn about Chinese culture while savoring tea.","set":"CET4 2020·09·S2","cls":"D","ch":8}],"长城":[{"cn":"你如果到北京旅游，必须做两件事：一件是登长城，另一件是吃北京烤鸭。","en":"If you travel to Beijing, you must do two things: climb the Great Wall and eat Beijing Roast Duck.","set":"CET4 2020·09·S3","cls":"C","ch":8},{"cn":"你如果到北京旅游，必须做两件事：一件是登长城，另一件是吃北京烤鸭。","en":"If you travel to Beijing, you must do two things: one is to climb the Great Wall, and the other is to eat Beijing Roast Duck.","set":"CET4 2020·09·S3","cls":"C","ch":10}],"北京烤鸭":[{"cn":"你如果到北京旅游，必须做两件事：一件是登长城，另一件是吃北京烤鸭。","en":"If you travel to Beijing, you must do two things: climb the Great Wall and eat Beijing Roast Duck.","set":"CET4 2020·09·S3","cls":"C","ch":8},{"cn":"闻名遐迩的北京烤鸭曾仅限于宫廷，而现在北京数百家餐厅均有供应。","en":"The world-renowned Beijing Roast Duck was once served only in the imperial court, but now it is available at hundreds of restaurants in Beijing.","set":"CET4 2020·09·S3","cls":"C","ch":8},{"cn":"北京烤鸭源于600年前的明代。","en":"Beijing Roast Duck dates back to the Ming Dynasty, more than 600 years ago.","set":"CET4 2020·09·S3","cls":"C","ch":8},{"cn":"事实上，正是这些宫廷厨师使北京烤鸭的烹饪艺术日臻完善。","en":"In fact, it was these imperial chefs who brought the art of cooking Beijing Roast Duck to perfection.","set":"CET4 2020·09·S3","cls":"C","ch":8},{"cn":"你如果到北京旅游，必须做两件事：一件是登长城，另一件是吃北京烤鸭。","en":"If you travel to Beijing, you must do two things: one is to climb the Great Wall, and the other is to eat Beijing Roast Duck.","set":"CET4 2020·09·S3","cls":"C","ch":10},{"cn":"闻名遐迩的北京烤鸭曾仅限于宫廷，而现在北京数百家餐厅均有供应。","en":"The world-famous Beijing Roast Duck was once limited to the imperial court, but today it is served in hundreds of restaurants in Beijing.","set":"CET4 2020·09·S3","cls":"C","ch":10},{"cn":"北京烤鸭源于600年前的明代。","en":"Beijing Roast Duck originated in the Ming Dynasty, more than 600 years ago.","set":"CET4 2020·09·S3","cls":"C","ch":10},{"cn":"事实上，正是这些宫廷厨师使北京烤鸭的烹饪艺术日臻完善。","en":"In fact, it was these imperial cooks who brought the culinary art of Beijing Roast Duck to near perfection.","set":"CET4 2020·09·S3","cls":"C","ch":10}],"宫廷":[{"cn":"闻名遐迩的北京烤鸭曾仅限于宫廷，而现在北京数百家餐厅均有供应。","en":"The world-renowned Beijing Roast Duck was once served only in the imperial court, but now it is available at hundreds of restaurants in Beijing.","set":"CET4 2020·09·S3","cls":"C","ch":8},{"cn":"闻名遐迩的北京烤鸭曾仅限于宫廷，而现在北京数百家餐厅均有供应。","en":"The world-famous Beijing Roast Duck was once limited to the imperial court, but today it is served in hundreds of restaurants in Beijing.","set":"CET4 2020·09·S3","cls":"C","ch":10}],"京城":[{"cn":"来自全国各地的厨师被挑选出来到京城为皇帝做饭。","en":"Chefs from all over the country were selected to cook for the emperor in the capital.","set":"CET4 2020·09·S3","cls":"D","ch":8},{"cn":"来自全国各地的厨师被挑选出来到京城为皇帝做饭。","en":"Cooks from all over the country were selected to go to the capital to cook for the emperor.","set":"CET4 2020·09·S3","cls":"D","ch":10}],"皇宫":[{"cn":"人们认为在皇宫做饭是一种莫大的荣誉，只有厨艺出众者才能获得这份工作。","en":"People considered it a great honor to cook in the imperial palace, and only those with outstanding cooking skills could obtain the job.","set":"CET4 2020·09·S3","cls":"D","ch":8},{"cn":"人们认为在皇宫做饭是一种莫大的荣誉，只有厨艺出众者才能获得这份工作。","en":"It is considered a great honor to cook in the imperial palace, and only those with outstanding culinary skills can get such a job.","set":"CET4 2020·09·S3","cls":"D","ch":10}],"铁观音":[{"cn":"铁观音(Tieguanyin)是中国最受欢迎的茶之一,原产于福建省安溪县西坪镇，如今安溪全县普遍种植，但该县不同地区生产的铁观音又各具风味。","en":"Tieguanyin is one of the most popular teas in China. It originated in Xiping Town, Anxi County, Fujian Province, and is now widely grown throughout Anxi County, though Tieguanyin produced in different parts of the county has its own distinctive flavor.","set":"CET4 2021·06·S1","cls":"B","ch":8},{"cn":"铁观音一年四季均可采摘，尤以春秋两季采摘的茶叶品质最佳。","en":"Tieguanyin can be picked all year round, and the tea picked in spring and autumn is of the best quality.","set":"CET4 2021·06·S1","cls":"B","ch":8},{"cn":"铁观音的加工非常复杂，需要专门的技术和丰富的经验。","en":"The processing of Tieguanyin is very complex and requires specialized skills and rich experience.","set":"CET4 2021·06·S1","cls":"C","ch":8},{"cn":"常饮铁观音有助于预防心脏病、降低血压、增强记忆力。","en":"Drinking Tieguanyin regularly helps prevent heart disease, lower blood pressure and improve memory.","set":"CET4 2021·06·S1","cls":"B","ch":8}],"普洱茶":[{"cn":"普洱(Pu'er)茶深受中国人喜爱。","en":"Pu'er tea is deeply loved by Chinese people.","set":"CET4 2021·06·S2","cls":"C","ch":8},{"cn":"最好的普洱茶产自云南的西双版纳（Xishuangbanna)，那里的气候和环境为普洱茶树的生长提供了最佳条件。","en":"The best Pu'er tea comes from Xishuangbanna in Yunnan, where the climate and environment provide the best conditions for the growth of Pu'er tea trees.","set":"CET4 2021·06·S2","cls":"C","ch":8},{"cn":"普洱茶颜色较深，味道与其他许多茶截然不同。","en":"Pu'er tea has a relatively dark color and a taste quite different from many other teas.","set":"CET4 2021·06·S2","cls":"C","ch":8},{"cn":"普洱茶泡（brew)的时间越长越有味道。","en":"The longer Pu'er tea is brewed, the more flavorful it becomes.","set":"CET4 2021·06·S2","cls":"C","ch":8},{"cn":"普洱茶含有多种有益健康的元素，常饮普洱茶有助于保护心脏和血管，还有减肥、消除疲劳和促进消化的功效。","en":"Pu'er tea contains various elements beneficial to health. Drinking it regularly helps protect the heart and blood vessels, and also has the effects of losing weight, relieving fatigue and promoting digestion.","set":"CET4 2021·06·S2","cls":"C","ch":8}],"绿茶":[{"cn":"龙井(Longjing)是一种绿茶，主要产自中国东部沿海的浙江省。","en":"Longjing is a kind of green tea, mainly produced in Zhejiang Province on China's eastern coast.","set":"CET4 2021·06·S3","cls":"C","ch":8}],"龙井茶":[{"cn":"龙井茶独特的香味和口感为其赢得了“中国名茶”的称号，在中国深受大众的欢迎，在海外饮用的人也越来越多。","en":"The unique aroma and taste of Longjing tea have earned it the title of \"a famous Chinese tea\". It is deeply loved by the Chinese public, and is being drunk by more and more people overseas.","set":"CET4 2021·06·S3","cls":"C","ch":8},{"cn":"龙井茶通常手工制作，其价格可能极其昂贵，也可能比较便宜，这取决于茶的生长地、采摘时间和制作工艺。","en":"Longjing tea is usually handmade. Its price may be extremely high or fairly low, depending on where the tea is grown, when it is picked and how it is processed.","set":"CET4 2021·06·S3","cls":"C","ch":8},{"cn":"龙井茶富含维生素C和其他多种有益健康的元素。","en":"Longjing tea is rich in vitamin C and many other elements beneficial to health.","set":"CET4 2021·06·S3","cls":"B","ch":8},{"cn":"经常喝龙井茶有助于减轻疲劳、延缓衰老。","en":"Drinking Longjing tea regularly helps reduce fatigue and delay aging.","set":"CET4 2021·06·S3","cls":"C","ch":8}],"健康饮食":[{"cn":"中国政府十分重视人民的健康饮食 (diet)。","en":"The Chinese government attaches great importance to people's healthy diet.","set":"CET4 2023·12·S1","cls":"B","ch":8},{"cn":"通过大力提倡健康饮食，人们对合理营养增进健康的重要性有了更加深刻的认识。","en":"By vigorously promoting a healthy diet, people have gained a deeper understanding of the importance of balanced nutrition to health.","set":"CET4 2023·12·S1","cls":"D","ch":8}],"长袍":[{"cn":"在清代，旗袍是王室女性穿着的宽松长袍。","en":"During the Qing Dynasty, the qipao was a loose long gown worn by royal women.","set":"CET6 2016·06·S2","cls":"C","ch":9}],"袖口":[{"cn":"袖口（cuffs）变窄，袍身变短。","en":"The cuffs became narrower and the body of the gown became shorter.","set":"CET6 2016·06·S2","cls":"B","ch":9}],"中国园林":[{"cn":"中国园林(the Chinese garden)是经过三千多年演变而成的独具一格的园林景观(landscape)。","en":"The Chinese garden is a unique garden landscape that has evolved over more than 3,000 years.","set":"CET6 2013·12·S2","cls":"C","ch":10}],"卢沟桥":[{"cn":"卢沟桥位于天安门广场西南 15 公里处，横跨永定河，是北京现存最古老的多拱石桥。","en":"The Lugou Bridge is located 15 kilometers southwest of Tian'anmen Square, spans the Yongding River, and is the oldest existing multi-arch stone bridge in Beijing.","set":"CET6 2022·06·S1","cls":"A","ch":10},{"cn":"卢沟桥不仅以其美学特征闻名于世，还被公认为石桥建筑史上的一座丰碑。","en":"The Lugou Bridge is not only famous worldwide for its aesthetic features but is also acclaimed as a monument in the history of stone bridge architecture.","set":"CET6 2022·06·S1","cls":"A","ch":10}],"石狮":[{"cn":"每根柱子上都有一头石狮。","en":"Each pillar carries a stone lion.","set":"CET6 2022·06·S1","cls":"A","ch":10},{"cn":"这些石狮的头、背、腹部或爪子上都藏着更多的狮子。","en":"More lions are hidden on the heads, backs, bellies or paws of these stone lions.","set":"CET6 2022·06·S1","cls":"B","ch":10},{"cn":"这些石狮生动逼真、千姿百态，是卢沟桥石刻艺术的精品。","en":"These stone lions are vivid, true to life and highly varied, and represent the finest examples of the stone carving art of the Lugou Bridge.","set":"CET6 2022·06·S1","cls":"B","ch":10}],"南京长江大桥":[{"cn":"南京长江大桥是长江上首座由中国设计、采用国产材料建造的铁路、公路两用桥，上层的 4 车道公路桥长 4589 米，下层的双轨道铁路桥长 6772 米。","en":"The Nanjing Yangtze River Bridge is the first double-deck road-rail bridge over the Yangtze River designed by China and built with domestic materials, with its upper four-lane highway bridge 4,589 meters long and its lower double-track railway bridge 6,772 meters long.","set":"CET6 2022·06·S2","cls":"C","ch":10},{"cn":"南京长江大桥的建成标志着中国桥梁建设的一个飞跃，大大方便了长江两岸的物资交流和人员来往，对促进经济发展和改善人民生活起到了巨大作用。","en":"The completion of the Nanjing Yangtze River Bridge marked a leap forward in China's bridge construction, greatly facilitated the exchange of goods and the movement of people across the Yangtze River, and played a huge role in promoting economic development and improving people's lives.","set":"CET6 2022·06·S2","cls":"C","ch":10}],"赵州桥":[{"cn":"赵州桥建于隋朝，公元 6 0 5 年左右，长 50.82 米，宽 9 .6 米，跨度 37.37 米。","en":"The Zhaozhou Bridge was built in the Sui Dynasty, around 605 AD; it is 50.82 meters long, 9.6 meters wide and 37.37 meters in span.","set":"CET6 2022·06·S3","cls":"A","ch":10},{"cn":"赵州桥结构新颖、造型优美。","en":"The Zhaozhou Bridge has a novel structure and an elegant design.","set":"CET6 2022·06·S3","cls":"C","ch":10},{"cn":"赵州桥是世界桥梁建筑史上的一次创举，是中国古代文明史上的一项杰出成就。","en":"The Zhaozhou Bridge was a pioneering achievement in the history of world bridge architecture and an outstanding accomplishment in the history of ancient Chinese civilization.","set":"CET6 2022·06·S3","cls":"C","ch":10},{"cn":"类似设计的桥梁直到 14 世纪才在欧洲出现，比赵州桥晚了 7 0 0 多年。","en":"Bridges of similar design did not appear in Europe until the 14th century, more than 700 years later than the Zhaozhou Bridge.","set":"CET6 2022·06·S3","cls":"B","ch":10}],"隋朝":[{"cn":"赵州桥建于隋朝，公元 6 0 5 年左右，长 50.82 米，宽 9 .6 米，跨度 37.37 米。","en":"The Zhaozhou Bridge was built in the Sui Dynasty, around 605 AD; it is 50.82 meters long, 9.6 meters wide and 37.37 meters in span.","set":"CET6 2022·06·S3","cls":"A","ch":10}],"敞肩拱":[{"cn":"桥有一个大拱，在大拱的两端有两个小拱，帮助排泄洪水、减轻桥梁重量并节省石材。","en":"The bridge has a large arch, with two small arches at both ends of the large one, helping to discharge floodwater, reduce the weight of the bridge and save stone.","set":"CET6 2022·06·S3","cls":"C","ch":10}],"青藏铁路":[{"cn":"青藏铁路是世界上最高最长的高原铁路，全长1，956公里，其中有960公里在海拔4，000多米之上，是连接西藏和中国其他地区的第一条铁路。","en":"The Qinghai-Tibet Railway is the highest and longest plateau railway in the world, with a total length of 1,956 kilometers, of which 960 kilometers lie at an altitude of over 4,000 meters, and it is the first railway linking Tibet with the rest of China.","set":"CET6 2020·12·S3","cls":"C","ch":10},{"cn":"青藏铁路大大缩短了去往西藏的旅行时间。","en":"The Qinghai-Tibet Railway has greatly shortened the travel time to Tibet.","set":"CET6 2020·12·S3","cls":"C","ch":10}],"故宫":[{"cn":"在那里，参观者还可以看到故宫和北京其他地方的壮观景色。","en":"From there, visitors can also enjoy spectacular views of the Palace Museum and other parts of Beijing.","set":"CET6 2022·09·S3","cls":"C","ch":10}],"乌镇":[{"cn":"乌镇是浙江的一座古老水镇，坐落在京杭大运河畔。","en":"Wuzhen is an ancient water town in Zhejiang province, situated on the bank of the Beijing-Hangzhou Grand Canal.","set":"CET4 2016·06·S3","cls":"C","ch":10},{"cn":"乌镇所有房屋都用石木建造。","en":"All the houses in Wuzhen are built of stone and wood.","set":"CET4 2016·06·S3","cls":"C","ch":10}],"四合院":[{"cn":"四合院 (siheyuan)是中国一种传统的住宅建筑，其特点是房屋建造在一个院子的四周，将院子合围在中间。","en":"The siheyuan is a traditional type of Chinese residential building, characterized by houses built on all four sides of a courtyard and enclosing it in the middle.","set":"CET4 2024·06·S1","cls":"C","ch":10},{"cn":"四合院通常冬暖夏凉，环境舒适，尤其适合大家庭居住。","en":"A siheyuan is usually warm in winter and cool in summer, comfortable and especially suitable for large families.","set":"CET4 2024·06·S1","cls":"A","ch":10},{"cn":"四合院在中国各地有多种类型，其中以北京的四合院最为典型。","en":"Siheyuan come in many types across China, among which the Beijing siheyuan is the most typical.","set":"CET4 2024·06·S1","cls":"B","ch":10},{"cn":"如今，随着现代城市的发展，传统的四合院已逐渐减少，但因其独特的建筑风格，四合院对中国文化的传承和中国历史的研究具有重要意义。","en":"Today, with the development of modern cities, traditional siheyuan have gradually decreased, but because of their unique architectural style, they remain highly significant to the inheritance of Chinese culture and the study of Chinese history.","set":"CET4 2024·06·S1","cls":"D","ch":10}],"世界文化遗产":[{"cn":"这将减少开放洞窟的数量，缩短游客在洞窟内的逗留时间，减轻参观对莫高窟造成的影响，以使这一世界文化遗产得到妥善保护、长久利用。","en":"This will reduce the number of open caves, shorten the time tourists spend inside them and lessen the impact of visits on the Mogao Grottoes, so as to ensure the proper protection and long-term use of this World Cultural Heritage site.","set":"CET4 2024·12·S2","cls":"C","ch":10}],"坎儿井":[{"cn":"坎儿井(Karez) 是新疆干旱地区的一种水利系统，由地下渠道将水井连接而成。","en":"The karez is a water conservancy system in the arid regions of Xinjiang, consisting of underground channels that connect wells.","set":"CET4 2021·12·S2","cls":"C","ch":10},{"cn":"坎儿井减少了水在地面的蒸发 (evaporation),对地表破坏很小，因而有效地保护了自然资源与生态环境。","en":"The karez reduces the evaporation of water on the ground and causes very little damage to the surface, thus effectively protecting natural resources and the ecological environment.","set":"CET4 2021·12·S2","cls":"C","ch":10},{"cn":"坎儿井体现了我国人民与自然和谐共存的智慧，是对人类文明的一大贡献。","en":"The karez embodies the wisdom of our people in living in harmony with nature and is a great contribution to human civilization.","set":"CET4 2021·12·S2","cls":"C","ch":10}],"与自然和谐共存":[{"cn":"坎儿井体现了我国人民与自然和谐共存的智慧，是对人类文明的一大贡献。","en":"The karez embodies the wisdom of our people in living in harmony with nature and is a great contribution to human civilization.","set":"CET4 2021·12·S2","cls":"C","ch":10},{"cn":"都江堰工程体现了我国人民与自然和谐共存的智慧，是全世界年代最久、仍在使用、无坝控水的水利工","en":"The Dujiangyan project embodies the wisdom of our people in living in harmony with nature and is the oldest dam-free water conservancy project in the world that is still in use.","set":"CET4 2021·12·S3","cls":"C","ch":10}],"都江堰":[{"cn":"卢(Dujiangyan) 坐落在成都平原西部的氓江上，距成都市约 50 公里，始建于公元前三世纪。","en":"Dujiangyan is located on the Minjiang River in the west of the Chengdu Plain, about 50 kilometers from Chengdu, and was first built in the 3rd century BC.","set":"CET4 2021·12·S3","cls":"C","ch":10},{"cn":"两千多年来，都江堰一直有效地发挥看防洪与灌溉作用，使成都平原成为旱滂保收的沃土和中国最重要的棵食产地之一。","en":"For more than 2,000 years, Dujiangyan has effectively played a role in flood control and irrigation, turning the Chengdu Plain into a fertile land with guaranteed harvests in both dry and wet years and one of China's most important grain-producing areas.","set":"CET4 2021·12·S3","cls":"C","ch":10},{"cn":"都江堰工程体现了我国人民与自然和谐共存的智慧，是全世界年代最久、仍在使用、无坝控水的水利工","en":"The Dujiangyan project embodies the wisdom of our people in living in harmony with nature and is the oldest dam-free water conservancy project in the world that is still in use.","set":"CET4 2021·12·S3","cls":"C","ch":10}],"造纸":[{"cn":"正是通过丝绸之路，中国的造纸、火药、指南针、印刷术等四大发明才被引介到世界各地。","en":"It was through the Silk Road that China's Four Great Inventions — papermaking, gunpowder, the compass and printing — were introduced to the rest of the world.","set":"CET6 2013·12·S1","cls":"B","ch":11}],"印刷术":[{"cn":"正是通过丝绸之路，中国的造纸、火药、指南针、印刷术等四大发明才被引介到世界各地。","en":"It was through the Silk Road that China's Four Great Inventions — papermaking, gunpowder, the compass and printing — were introduced to the rest of the world.","set":"CET6 2013·12·S1","cls":"B","ch":11}],"瓷器":[{"cn":"同样，中国的丝绸、茶叶和瓷器(porcelain)也传遍全球。","en":"Similarly, China's silk, tea and porcelain spread across the globe.","set":"CET6 2013·12·S1","cls":"A","ch":11}],"西域":[{"cn":"他不畏艰险，克服重重困难，两次出使西域，开通了中国同西亚和欧洲的通商关系，将中国的丝和丝织品运往西亚和欧洲，开拓了历史上著名的“丝绸之路”。","en":"Braving dangers and overcoming numerous difficulties, he made two missions to the Western Regions, opened up trade relations between China and West Asia and Europe, carried China's silk and silk fabrics to West Asia and Europe, and pioneered the world-famous Silk Road.","set":"CET6 2023·03·S1","cls":"B","ch":11},{"cn":"同时，他又将西域的风土人情、地理文化以及特有物种等介绍到中原，极大地开阔了人们的视野。","en":"Meanwhile, he also introduced the customs, geography and culture as well as unique species of the Western Regions to the Central Plains, greatly broadening people's horizons.","set":"CET6 2023·03·S1","cls":"C","ch":11},{"cn":"正如历史学家所指出的那样，如果没有张骞出使西域，就不可能有丝绸之路的开辟，也就不会有汉朝同西域或欧洲的文化交流。","en":"As historians have pointed out, without Zhang Qian's missions to the Western Regions, there would have been no opening of the Silk Road, nor any cultural exchange between the Han Dynasty and the Western Regions or Europe.","set":"CET6 2023·03·S1","cls":"B","ch":11}],"中原":[{"cn":"同时，他又将西域的风土人情、地理文化以及特有物种等介绍到中原，极大地开阔了人们的视野。","en":"Meanwhile, he also introduced the customs, geography and culture as well as unique species of the Western Regions to the Central Plains, greatly broadening people's horizons.","set":"CET6 2023·03·S1","cls":"C","ch":11}],"农业":[{"cn":"农业是中国的一个重要产业，从业者超过 3 亿。","en":"Agriculture is an important industry in China, with more than 300 million workers.","set":"CET6 2016·12·S3","cls":"C","ch":11}],"水稻":[{"cn":"中国农业产量全球第一，主要生产水稻、小麦和豆类。","en":"China's agricultural output ranks first in the world, mainly producing rice, wheat and beans.","set":"CET6 2016·12·S3","cls":"D","ch":11},{"cn":"中国 7700 年前开始种植水稻。","en":"China began to grow rice 7,700 years ago.","set":"CET6 2016·12·S3","cls":"D","ch":11}],"戏曲":[{"cn":"戏曲是一种中国传统的艺术形式，可以追溯到唐朝。","en":"Chinese traditional opera is a form of traditional Chinese art that can be traced back to the Tang Dynasty.","set":"CET4 2022.09 第3套","cls":"A","ch":3},{"cn":"中国戏曲吸引观众的一大特色是其独具风格的脸谱(facialpainting)。","en":"One striking feature of Chinese opera that attracts audiences is its distinctive facial painting.","set":"CET4 2022.09 第3套","cls":"B","ch":3},{"cn":"欣赏戏曲是中国人特别是老年人的一大乐趣。","en":"Appreciating Chinese opera is a great pleasure for Chinese people, especially the elderly.","set":"CET4 2022.09 第3套","cls":"B","ch":3},{"cn":"为了吸引更多的年轻观众 , 传统戏曲正在不断地发展和创新。","en":"To attract more young audiences, traditional Chinese opera is constantly developing and innovating.","set":"CET4 2022.09 第3套","cls":"B","ch":3},{"cn":"如今，越来越多的外国观众也喜欢中国戏曲。","en":"Today, more and more foreign audiences also enjoy Chinese opera.","set":"CET4 2022.09 第3套","cls":"B","ch":3}],"脸谱":[{"cn":"中国戏曲吸引观众的一大特色是其独具风格的脸谱(facialpainting)。","en":"One striking feature of Chinese opera that attracts audiences is its distinctive facial painting.","set":"CET4 2022.09 第3套","cls":"B","ch":3},{"cn":"脸谱代表不同角色的性格和命运。","en":"The facial painting represents the personalities and destinies of different roles.","set":"CET4 2022.09 第3套","cls":"A","ch":3},{"cn":"观众通过观察脸谱能够更好地理解这些角色的故事。","en":"By observing the facial painting, the audience can better understand the stories of these roles.","set":"CET4 2022.09 第3套","cls":"B","ch":3}],"舞狮":[{"cn":"舞狮作为中国传统民间表演已有 2,000 多年历史。","en":"Lion dance, a traditional Chinese folk performance, has a history of more than 2,000 years.","set":"CET4 2019.06 第1套","cls":"C","ch":3},{"cn":"在狮子舞中，两位表演者同披一件狮子服，一个舞动头部，另一个舞动身体和尾巴。","en":"In the lion dance, two performers share a single lion costume, with one moving the head and the other moving the body and the tail.","set":"CET4 2019.06 第1套","cls":"C","ch":3},{"cn":"他们熟练配合，模仿狮子的各种动作。","en":"They coordinate skillfully to imitate the various movements of a lion.","set":"CET4 2019.06 第1套","cls":"C","ch":3},{"cn":"狮子是兽中之王，象征幸福和好运，所以人们通常在春节和其他节日期间表演狮子舞。","en":"The lion is the king of beasts and symbolizes happiness and good luck, so people usually perform the lion dance during the Spring Festival and other festivals.","set":"CET4 2019.06 第1套","cls":"C","ch":3},{"cn":"狮子舞也可能出现在其他重要场合，如商店开业和结婚典礼，往往吸引许多人观赏。","en":"The lion dance may also appear on other important occasions, such as shop openings and wedding ceremonies, often attracting many spectators.","set":"CET4 2019.06 第1套","cls":"C","ch":3}],"剪纸":[{"cn":"剪纸是中国民间艺术的一种独特形式，已有 2,000 多年历年。","en":"Paper-cutting is a unique form of Chinese folk art with a history of more than 2,000 years.","set":"CET4 2019.06 第3套","cls":"C","ch":3},{"cn":"剪纸很可能源于汉代，继纸张发明之后。","en":"Paper-cutting most probably originated in the Han Dynasty, following the invention of paper.","set":"CET4 2019.06 第3套","cls":"C","ch":3},{"cn":"从此，它在中国的许多地方得到了普及。","en":"From then on, it became widespread in many parts of China.","set":"CET4 2019.06 第3套","cls":"C","ch":3},{"cn":"剪纸用的材料和工具很简单：纸和剪刀。","en":"The materials and tools used for paper-cutting are very simple: paper and scissors.","set":"CET4 2019.06 第3套","cls":"C","ch":3},{"cn":"剪纸作品通常是用红纸做成的，因为红色在中国传统文化中与幸福相联。","en":"Paper-cutting works are usually made from red paper, because red is associated with happiness in traditional Chinese culture.","set":"CET4 2019.06 第3套","cls":"C","ch":3},{"cn":"因此，在婚礼、春节等喜庆场合，红颜色的剪纸是门窗装饰的首选。","en":"Therefore, on festive occasions such as weddings and the Spring Festival, red paper-cuttings are the preferred decoration for doors and windows.","set":"CET4 2019.06 第3套","cls":"C","ch":3}],"印章":[{"cn":"自古以来，印章在中国就是身份的凭证和权力的象征。","en":"Since ancient times, seals in China have been the proof of identity and a symbol of power.","set":"CET6 2022.09 第2套","cls":"B","ch":3},{"cn":"印章不仅具有实用性，而且也是一种艺术形式，是一门集书法与雕刻于一体的古老艺术，经常被看作与书画并列的独立艺术品。","en":"Seals are not only practical but also a form of art — an ancient art that combines calligraphy and carving, and they are often regarded as independent works of art that stand alongside calligraphy and painting.","set":"CET6 2022.09 第2套","cls":"B","ch":3},{"cn":"印章从材料的选择、制作的工艺到字体的设计，都具有极其丰富的美学表现。","en":"From the choice of materials and the craft of production to the design of the characters, seals display extremely rich aesthetic expression.","set":"CET6 2022.09 第2套","cls":"B","ch":3},{"cn":"其他国家的艺术家通常在其绘画作品上签名，而中国艺术家则往往在其书画作品上盖上印章代替签名。","en":"Artists in other countries usually sign their paintings, while Chinese artists often stamp a seal on their paintings and calligraphy instead of signing.","set":"CET6 2022.09 第2套","cls":"B","ch":3},{"cn":"这样，印章也就成为作品的组成部分，是体现作品独特性的一种方式。","en":"In this way, the seal also becomes part of the work and a way of expressing its uniqueness.","set":"CET6 2022.09 第2套","cls":"B","ch":3}],"扇子":[{"cn":"扇子自古以来就深受中国人喜爱，但现在已不只是消暑纳凉的工具，而更多地作为艺术品供人欣赏。","en":"Fans have been deeply loved by the Chinese since ancient times, but today they are no longer merely tools for cooling off, serving more as works of art for people to appreciate.","set":"CET6 2024.06 第3套","cls":"E","ch":3},{"cn":"许多扇子造型优美、做工精良，并绘有山水、花鸟、人物等精美图案，具有很高的艺术价值。","en":"Many fans are beautifully shaped and exquisitely made, and are painted with fine designs such as landscapes, flowers and birds, and figures, so they have high artistic value.","set":"CET6 2024.06 第3套","cls":"B","ch":3},{"cn":"中国许多著名画家和书法家喜欢在扇子上作诗绘画，展示其艺术品味。","en":"Many famous Chinese painters and calligraphers like to compose poems and paint on fans, displaying their artistic taste.","set":"CET6 2024.06 第3套","cls":"E","ch":3},{"cn":"扇子常作为礼物赠予他人，表达美好的祝福和真挚的情感。","en":"Fans are often given to others as gifts to express good wishes and sincere feelings.","set":"CET6 2024.06 第3套","cls":"E","ch":3},{"cn":"如今，扇子的实用功能已大为减弱，但作为一种文化符号和艺术形式，扇子仍然在中国传统文化中扮演着重要角色。","en":"Today, the practical function of fans has been greatly weakened, but as a cultural symbol and art form, the fan still plays an important role in traditional Chinese culture.","set":"CET6 2024.06 第3套","cls":"E","ch":3}],"牡丹":[{"cn":"牡丹(peony)花色艳丽,形象高雅,象征着和平与繁荣,因而在中国被称为“花中之王”。","en":"The peony is gorgeous in color and elegant in appearance, symbolizing peace and prosperity, and thus it is known in China as the \"king of flowers.\"","set":"CET6 2019.12 第1套","cls":"C","ch":3},{"cn":"中国许多地方都培育和种植牡丹。","en":"Peonies are cultivated and grown in many parts of China.","set":"CET6 2019.12 第1套","cls":"C","ch":3},{"cn":"千百年来，创作了许多诗歌和绘画赞美牡丹。","en":"Over the centuries, many poems and paintings have been created to praise the peony.","set":"CET6 2019.12 第1套","cls":"C","ch":3},{"cn":"唐代时期,牡丹在皇家园林普遍种植并被誉为国花,因而特别风行。","en":"In the Tang Dynasty, peonies were widely planted in imperial gardens and were honored as the national flower, and thus became especially popular.","set":"CET6 2019.12 第1套","cls":"C","ch":3},{"cn":"十世纪时,洛阳古城成为牡丹栽培中心,而且这一地位一直保持到今天。","en":"In the tenth century, the ancient city of Luoyang became the center of peony cultivation, and this status has been maintained to this day.","set":"CET6 2019.12 第1套","cls":"C","ch":3},{"cn":"现在，成千上万的国内外游客蜂拥到洛阳参加一年一度的牡丹节,欣赏洛阳牡丹的独特之美,同时探索九朝古都的历史。","en":"Today, tens of thousands of tourists from home and abroad flock to Luoyang for the annual Peony Culture Festival, admiring the unique beauty of Luoyang peonies while exploring the history of this ancient capital of nine dynasties.","set":"CET6 2019.12 第1套","cls":"C","ch":3}],"皇家园林":[{"cn":"唐代时期,牡丹在皇家园林普遍种植并被誉为国花,因而特别风行。","en":"In the Tang Dynasty, peonies were widely planted in imperial gardens and were honored as the national flower, and thus became especially popular.","set":"CET6 2019.12 第1套","cls":"C","ch":3}],"梅花":[{"cn":"梅花(plumblossom)位居中国十大名花之首,源于中国南方,已有三千多年的栽培和种植历史。","en":"The plum blossom, which ranks first among China's ten most famous flowers, originated in southern China and has a history of more than 3,000 years of cultivation and planting.","set":"CET6 2019.12 第2套","cls":"C","ch":3},{"cn":"隆冬时节，五颜六色的梅花不畏严寒，迎着风雪傲然绽放。","en":"In the depths of winter, the colorful plum blossoms bloom proudly in the snow and wind, undaunted by the severe cold.","set":"CET6 2019.12 第2套","cls":"C","ch":3},{"cn":"在中国传统文化中，梅花象征着坚强、纯洁、高雅，激励人们不畏艰难、砥砺前行。","en":"In traditional Chinese culture, the plum blossom symbolizes strength, purity and elegance, inspiring people to brave hardships and forge ahead.","set":"CET6 2019.12 第2套","cls":"C","ch":3},{"cn":"自古以来，许多诗人和画家从梅花中获取灵感,创作了无数不朽的作品。","en":"Since ancient times, many poets and painters have drawn inspiration from the plum blossom and created countless immortal works.","set":"CET6 2019.12 第2套","cls":"C","ch":3},{"cn":"普通大众也都喜爱梅花,春节期间常用于家庭装饰。","en":"Ordinary people also love the plum blossom, and it is often used to decorate homes during the Spring Festival.","set":"CET6 2019.12 第2套","cls":"C","ch":3},{"cn":"南京市已将梅花定为市花,每年举办梅花节,成千上万的人冒着严寒到梅花山踏雪赏梅","en":"Nanjing has designated the plum blossom as its city flower and holds a Plum Blossom Festival every year, when tens of thousands of people brave the severe cold to visit Plum Blossom Hill and enjoy the blossoms in the snow.","set":"CET6 2019.12 第2套","cls":"C","ch":3}],"市花":[{"cn":"南京市已将梅花定为市花,每年举办梅花节,成千上万的人冒着严寒到梅花山踏雪赏梅","en":"Nanjing has designated the plum blossom as its city flower and holds a Plum Blossom Festival every year, when tens of thousands of people brave the severe cold to visit Plum Blossom Hill and enjoy the blossoms in the snow.","set":"CET6 2019.12 第2套","cls":"C","ch":3}],"荷花":[{"cn":"荷花(lotusflower)是中国的名花之一,深受人们喜爱。","en":"The lotus, one of China's famous flowers, is deeply loved by people.","set":"CET6 2019.12 第3套","cls":"C","ch":3},{"cn":"中国许多地方的湖泊和池塘都适宜荷花生长。","en":"The lakes and ponds in many parts of China are all suitable for the growth of lotus.","set":"CET6 2019.12 第3套","cls":"C","ch":3},{"cn":"荷花色彩鲜艳，夏日清晨绽放，夜晚闭合，花期长达两三个月，吸引来自各地的游客前往观赏。","en":"The lotus is bright in color; it blooms in the early morning and closes at night in summer, and its flowering period lasts as long as two or three months, attracting tourists from all over to admire it.","set":"CET6 2019.12 第3套","cls":"C","ch":3},{"cn":"荷花具有多种功能，既能绿化水面，又能美化庭园，还可净化水质、减少污染、改善环境。","en":"The lotus has many functions: it can green the water surface, beautify gardens, purify water, reduce pollution and improve the environment.","set":"CET6 2019.12 第3套","cls":"C","ch":3},{"cn":"荷花迎骄阳而不惧，出污泥而不染，象征纯洁、高雅，常常用来比喻人的高尚品德，历来是诗人画家创作的重要题材。","en":"Braving the scorching sun without fear and emerging unstained from the mud, the lotus symbolizes purity and elegance. It is often used to describe a person's noble character and has long been an important subject for poets and painters.","set":"CET6 2019.12 第3套","cls":"C","ch":3},{"cn":"荷花盛开的地方也是许多摄影爱好者经常光顾之地。","en":"Places where lotuses bloom in profusion are also frequented by many photography enthusiasts.","set":"CET6 2019.12 第3套","cls":"C","ch":3}]}};
const LV={"真题落点":"◆","教材命中":"◇","仅章级":"○"};
function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const main=document.getElementById('main'),nav=document.getElementById('nav');
D.stages.forEach(s=>{
  const a=document.createElement('a');a.textContent=s.stage+'·'+s.title;a.href='#st'+s.no;nav.appendChild(a);
  const sec=document.createElement('section');sec.className='stage';sec.id='st'+s.no;
  sec.innerHTML=`<h2>${s.stage}｜${s.title}<em>${s.n} 概念 / ${s.sent} 句真题</em></h2>`;
  const grid=document.createElement('div');grid.className='grid';
  s.groups.forEach(g=>{
    const card=document.createElement('div');card.className='g '+(g.deps.length?'dep':'free');
    const tags=g.concepts.map(k=>{
      const v=D.c[k];
      return `<span class="c" data-k="${esc(k)}"><b>${esc(k)}</b><i>${v.sent}</i></span>`;
    }).join('');
    card.innerHTML=`<h3>${g.id} ${g.title}<span>${g.n}概念 / ${g.sent}句</span></h3>
      <div class="pre">${g.deps.length?'前置：'+g.deps.join('、'):'起点（无前置）'}</div>
      <div class="why">${esc(g.why||'')}</div><div class="tags">${tags}</div>`;
    grid.appendChild(card);
  });
  sec.appendChild(grid);main.appendChild(sec);
});
main.addEventListener('click',e=>{
  const t=e.target.closest('.c'); if(!t) return; show(t.dataset.k);
});
function show(k){
  const v=D.c[k], a=v.anchor||{};
  const ss=(D.sents[k]||[]);
  const lv=LV[a.lv]||'';
  document.getElementById('dc').innerHTML=`
    <h2>${esc(k)} ${lv}</h2><div class="en">${esc(v.en)}</div>
    <div class="kv">真题 <b>${v.sent}</b> 句 · <b>${v.nsets}</b> 套 ｜ 覆盖章：<b>${(v.chsName||[]).join('、')}</b><br>
      所属组：<b>${v.group}</b> ｜ 教材落点：<b>${esc(a.chName||'—')}${a.unit?'·'+esc(a.unit):''}${a.sec?'·'+esc(a.sec):''}</b></div>
    ${v.url?`<a class="back" href="${v.url}">打开课本对应小节 →</a><br>`:''}
    ${v.alias&&v.alias.length?`<div class="kv" style="margin-top:8px">合并自：${v.alias.map(esc).join('、')}</div>`:''}
    ${ss.map(x=>`<div class="sent"><div class="s">${esc(x.set)} · ${esc(x.cls)} 级</div><div class="cn">${esc(x.cn)}</div><div class="en">${esc(x.en)}</div></div>`).join('')||'<div class="kv">（该概念在路径中的句子未收录）</div>'}`;
  document.getElementById('drawer').classList.add('on');
}
function hide(){document.getElementById('drawer').classList.remove('on')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
document.getElementById('q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.c').forEach(el=>{
    const v=D.c[el.dataset.k];
    const hit=!q||el.dataset.k.toLowerCase().includes(q)||(v.en||'').toLowerCase().includes(q);
    el.classList.toggle('hide',!hit);
  });
  document.querySelectorAll('.g').forEach(g=>{
    const vis=[...g.querySelectorAll('.c')].some(x=>!x.classList.contains('hide'));
    g.style.display=q&&!vis?'none':'';
  });
});

</script></body></html>
