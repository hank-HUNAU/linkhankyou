<script>
const D={"stages":[{"stage":"阶段一","no":1,"title":"时空底座","groups":[{"id":"G01","title":"朝代坐标","n":9,"sent":28,"deps":[],"why":"所有文化现象都要挂在朝代上——唐诗、宋画、明式家具、清代服饰。先有年代轴，后面每个概念才知道自己站在哪。","concepts":["唐朝","汉朝","明朝","宋朝","中国古代文明","长安","明清","西汉","隋朝"]},{"id":"G02","title":"山河地理","n":14,"sent":54,"deps":[],"why":"真题几乎必带地理坐标（黄河＝母亲河、长江＝黄金水道、青藏高原＝世界屋脊）。地势三级阶梯还决定气候、物产、民居形制。","concepts":["长江","黄河","泰山","洞庭湖","青藏高原","黄土高原","青海湖","云贵高原","珠江三角洲","云南","太湖","水资源","湖泊","中原"]},{"id":"G03","title":"民族与农耕","n":7,"sent":15,"deps":["G02"],"why":"南稻北麦的物产格局、多民族分布，是饮食、服饰、节日的物质前提；「中华民族」是全部文化叙事的共同主语。","concepts":["中华民族","人类文明","小麦","少数民族","水稻","农业","汉族"]}],"n":30,"sent":97},{"stage":"阶段二","no":2,"title":"思想内核","groups":[{"id":"G04","title":"儒家与礼治","n":6,"sent":12,"deps":["G01","G03"],"why":"儒家的礼与仁解释了后面所有的「规矩」——等级、家庭、尊老、人际。不学这层，节日、建筑、服饰只能死记现象。","concepts":["传统美德","学者","尊师","社会秩序","儒家","节俭"]},{"id":"G05","title":"道家与自然观","n":2,"sent":4,"deps":["G01"],"why":"道法自然、阴阳五行是审美与技术的内在逻辑：中国画留白、园林借景、太极养生、风水选址都由它推导。","concepts":["与自然和谐共存","道家"]},{"id":"G06","title":"佛教中国化","n":1,"sent":1,"deps":["G01"],"why":"佛教中国化带来寺庙、塔、石窟、禅意，是建筑与艺术的第二条线，也是「三教合一」话题的来源。","concepts":["佛教"]},{"id":"G07","title":"礼俗与处世","n":5,"sent":10,"deps":["G04"],"why":"把礼制落到日常动作上：待客、餐桌、取名。这是写作里最常用的「现象 + 解释」层，套话最多、性价比最高。","concepts":["习俗","人际交往","取名","待客之道","餐桌礼仪"]}],"n":14,"sent":27},{"stage":"阶段三","no":3,"title":"语言文字与文学","groups":[{"id":"G08","title":"汉字与汉语","n":6,"sent":22,"deps":["G01"],"why":"汉字是形音义的复合体，成语、书法、印章、对联全部建立在它之上；方块字本身也是高频考点。","concepts":["成语","土豪","汉语","方言","汉字","书写系统"]},{"id":"G09","title":"文学谱系","n":5,"sent":7,"deps":["G08","G01"],"why":"诗经—楚辞—汉赋—唐诗—宋词—元曲—明清小说是一条演进链。先有谱系，名家名著才有位置，不会背成散点。","concepts":["文学创作","神话","楚国","浪漫主义","现实主义"]},{"id":"G10","title":"名家与名著","n":10,"sent":22,"deps":["G09"],"why":"四大名著与李杜是谱系里的具体坐标；考「红楼梦」「李白」时几乎总要交代时代与文体。","concepts":["三国演义","红楼梦","四大名著","小说人物","曹雪芹","李白","杜甫","水浒传","茶馆","西游记"]}],"n":21,"sent":51},{"stage":"阶段四","no":4,"title":"艺术门类","groups":[{"id":"G11","title":"绘画与花木审美","n":7,"sent":32,"deps":["G05","G08"],"why":"梅兰竹菊的比德传统把思想内核转成视觉符号：画的是花木，说的是人格。花木审美也直接用于城市市花类题目。","concepts":["乡村生活","梅花","牡丹","荷花","黄山","中国画","市花"]},{"id":"G12","title":"书法与印章","n":1,"sent":5,"deps":["G08"],"why":"书法是汉字的线条艺术，印章是书法 + 雕刻 + 金石学，处在绘画与工艺的交叉点。","concepts":["印章"]},{"id":"G13","title":"戏曲与表演","n":3,"sent":13,"deps":["G09","G10"],"why":"戏曲的剧目来自文学故事，行当与脸谱是程式化的视觉语言；不懂故事，脸谱只是花纹。","concepts":["戏曲","舞狮","脸谱"]},{"id":"G14","title":"工艺与器物","n":5,"sent":19,"deps":["G11"],"why":"剪纸、扇面、灯笼靠谐音与寓意承载祝福（福／鱼／灯），陶瓷与瓷器则是「土与火」的器物传统，是民间版的「比德」系统。","concepts":["剪纸","灯笼","扇子","瓷器","陶瓷"]}],"n":16,"sent":69},{"stage":"阶段五","no":5,"title":"生活民俗","groups":[{"id":"G15","title":"岁时节日","n":7,"sent":35,"deps":["G01","G04"],"why":"农历是时间轴，家族团圆是意义内核。春节是真题第一高频场景（12 句），必须放在符号细节之前先讲清「为什么过」。","concepts":["春节","农历","冬至","中秋节","立秋","龙舟赛","元宵节"]},{"id":"G16","title":"节庆符号","n":12,"sent":35,"deps":["G15"],"why":"春联、福字、红包、饺子、月饼是节日的可写细节；先懂节日的意义，细节才不是清单式死记。","concepts":["春联","亲友","福字","团圆饭","好运","月饼","年年有余","幸福","横批","红包","饺子","压岁钱"]},{"id":"G17","title":"饮食文化","n":5,"sent":18,"deps":["G03","G07"],"why":"菜系由物产决定，餐桌由礼俗决定。饮食题常一半写物、一半写礼。","concepts":["北京烤鸭","中餐","火锅","健康饮食","配料"]},{"id":"G18","title":"茶与酒","n":8,"sent":19,"deps":["G17"],"why":"茶与酒是饮食里的文化符号，考法与礼仪、文人、地域绑定（龙井—杭州、普洱—云南）。","concepts":["普洱茶","铁观音","龙井茶","茅台","品茶","绿茶","茶具","饮茶"]},{"id":"G19","title":"服饰与等级","n":3,"sent":4,"deps":["G01","G04"],"why":"形制随朝代变，颜色与纹样随等级变。服饰题的关键不是布料，是「谁可以穿」。","concepts":["丝绸","袖口","长袍"]},{"id":"G20","title":"体育与养生","n":5,"sent":10,"deps":["G05","G04"],"why":"武术与太极是哲学的身体化（气、阴阳、以柔克刚），养生观同样源自阴阳平衡。","concepts":["武术","老年人","身心健康","功夫","太极拳"]}],"n":40,"sent":121},{"stage":"阶段六","no":6,"title":"营造与工程","groups":[{"id":"G21","title":"宫城与民居","n":9,"sent":20,"deps":["G01","G04"],"why":"中轴对称、四合院、影壁、石狮，都是礼制与家族结构的空间化；不懂礼就讲不清布局。","concepts":["四合院","石狮","乌镇","京城","大门","宫廷","皇宫","皇帝","故宫"]},{"id":"G22","title":"园林与乡土","n":6,"sent":10,"deps":["G21","G11"],"why":"园林是「把山水画搬进院子」：借景、框景、太湖石，审美来自绘画，哲学来自道家。","concepts":["中国传统园林","太湖石","宜兴","捕鱼业","中国园林","皇家园林"] 有 1000 只大熊猫。","en":"At present, there are about 1,000 giant pandas in the world.","set":"CET4 2014·12·S3","cls":"C","ch":0},{"cn":"这些以竹为食的动物正面临许多威胁。","en":"These bamboo-eating animals are facing many threats.","set":"CET4 2014·12·S3","cls":"C","ch":0},{"cn":"因此，确保大熊猫的生存比以往更重要。","en":"Therefore, ensuring the survival of the giant panda is more important than ever.","set":"CET4 2014·12·S3","cls":"C","ch":0}],"濒危物种":[{"cn":"因其数量极少，大熊猫已被列为濒危物种。","en":"Because of its extremely small population, the giant panda has been listed as an endangered species.","set":"CET4 2014·12·S3","cls":"C","ch":0},{"cn":"长江流经多种不同的生态系统，是诸多濒危物种的栖息地，灌溉了中国五分之一的土地。","en":"Flowing through a variety of ecosystems, the Yangtze River is the habitat of many endangered species and irrigates one fifth of China's land.","set":"CET4 2017·06·S2","cls":"B","ch":0},{"cn":"中国一直在努力保护青藏高原的生态系统，草地覆盖率不断增加，许多濒危物种得到更为有效的保护。","en":"China has been working to protect the ecosystem of the Qinghai-Tibet Plateau: grassland coverage has been increasing, and many endangered species are now better protected.","set":"CET6 2022·12·S1","cls":"B","ch":0}],"黄河":[{"cn":"黄河是亚洲第三、世界第六长的河流。","en":"The Yellow River is the third longest river in Asia and the sixth longest in the world.","set":"CET4 2017·06·S1","cls":"C","ch":0},{"cn":"“黄”这个字描述的是其河水浑浊的颜色。","en":"The Chinese character huang ('yellow') describes the muddy color of its water.","set":"CET4 2017·06·S1","cls":"C","ch":0},{"cn":"黄河发源于青海，流经九个省份，最后注入渤海。","en":"The Yellow River rises in Qinghai, flows through nine provinces and finally empties into the Bohai Sea.","set":"CET4 2017·06·S1","cls":"A","ch":0},{"cn":"黄河是中国赖以生存的几条河流之一。","en":"The Yellow River is one of the rivers on which China depends for its survival.","set":"CET4 2017·06·S1","cls":"A","ch":0},{"cn":"然而，由于极具破坏力的洪水频发，黄河曾造成多次灾害。","en":"However, because of frequent and highly destructive floods, the Yellow River has caused many disasters.","set":"CET4 2017·06·S1","cls":"B","ch":0},{"cn":"珠江是华南一大河系，流经广州市，是中国第三长的河流，仅次于长江和黄河。","en":"The Pearl River, a major river system in South China, flows through the city of Guangzhou and is China's third longest river, after the Yangtze River and the Yellow River.","set":"CET4 2017·06·S3","cls":"A","ch":0},{"cn":"青海尤以水资源丰富而闻名，是中国三大河流长江，黄河和澜沧江的发源地，在中国的水生态中发挥着重要作用。","en":"Qinghai is especially known for its abundant water resources. It is the source of China's three major rivers — the Yangtze, the Yellow River and the Lancang River — and plays an important role in China's water ecology.","set":"CET6 2021·06·S2","cls":"B","ch":0}],"青海湖":[{"cn":"黄河发源于青海，流经九个省份，最后注入渤海。","en":"The Yellow River rises in Qinghai, flows through nine provinces and finally empties into the Bohai Sea.","set":"CET4 2017·06·S1","cls":"A","ch":0},{"cn":"青海是中国西北部的一个省份，平均海拔3000米以上，大部分地区为高山和高原。","en":"Qinghai is a province in northwestern China, with an average elevation of over 3,000 metres, and most of its territory consists of high mountains and plateaus.","set":"CET6 2021·06·S2","cls":"A","ch":0},{"cn":"青海省得名于全国最大的咸水湖青海湖。","en":"Qinghai Province is named after Qinghai Lake, the largest saltwater lake in the country.","set":"CET6 2021·06·S2","cls":"A","ch":0},{"cn":"青海湖被誉为“中国最美的湖泊”，是最受欢迎的旅游景点之一，也是摄影师和艺术家的天堂。","en":"Known as “the most beautiful lake in China”, Qinghai Lake is one of the most popular tourist attractions and a paradise for photographers and artists.","set":"CET6 2021·06·S2","cls":"D","ch":0}],"中国古代文明":[{"cn":"黄河流域(river basin)是中国古代文明的诞生地，也是中国早期历史上最繁荣的地区。","en":"The Yellow River basin, the cradle of ancient Chinese civilization, was also the most prosperous region in China's early history.","set":"CET4 2017·06·S1","cls":"B","ch":0},{"cn":"赵州桥是世界桥梁建筑史上的一次创举，是中国古代文明史上的一项杰出成就。","en":"The Zhaozhou Bridge was a pioneering achievement in the history of world bridge architecture and an outstanding accomplishment in the history of ancient Chinese civilization.","set":"CET6 2022·06·S3","cls":"C","ch":10}],"长江":[{"cn":"长江是亚洲最长、世界上第三长的河流。","en":"The Yangtze River is the longest river in Asia and the third longest in the world.","set":"CET4 2017·06·S2","cls":"A","ch":0},{"cn":"长江流经多种不同的生态系统，是诸多濒危物种的栖息地，灌溉了中国五分之一的土地。","en":"Flowing through a variety of ecosystems, the Yangtze River is the habitat of many endangered species and irrigates one fifth of China's land.","set":"CET4 2017·06·S2","cls":"B","ch":0},{"cn":"长江在中国历史、文化和经济上起着很大的作用。","en":"The Yangtze River plays a great role in China's history, culture and economy.","set":"CET4 2017·06·S2","cls":"B","ch":0},{"cn":"几千年来，长江一直被用于供水、运输和工业生产。","en":"For thousands of years, the Yangtze River has been used for water supply, transportation and industrial production.","set":"CET4 2017·06·S2","cls":"B","ch":0},{"cn":"长江上还坐落着世界最大的水电站。","en":"On the Yangtze River also stands the world's largest hydroelectric power station.","set":"CET4 2017·06·S2","cls":"C","ch":0},{"cn":"珠江是华南一大河系，流经广州市，是中国第三长的河流，仅次于长江和黄河。","en":"The Pearl River, a major river system in South China, flows through the city of Guangzhou and is China's third longest river, after the Yangtze River and the Yellow River.","set":"CET4 2017·06·S3","cls":"A","ch":0},{"cn":"洞庭湖是长江的蓄洪池，湖的大校很大程度上取决于季节变化。","en":"Lake Dongting serves as a flood storage basin for the Yangtze River, and the size of the lake depends largely on seasonal changes.","set":"CET6 2017·12·S3","cls":"B","ch":0},{"cn":"青海尤以水资源丰富而闻名，是中国三大河流长江，黄河和澜沧江的发源地，在中国的水生态中发挥着重要作用。","en":"Qinghai is especially known for its abundant water resources. It is the source of China's three major rivers — the Yangtze, the Yellow River and the Lancang River — and plays an important role in China's water ecology.","set":"CET6 2021·06·S2","cls":"B","ch":0}],"珠江三角洲":[{"cn":"珠江三角洲（delta）是中国最发达的地区之一，面积约 11,000 平方公里。","en":"The Pearl River Delta is one of the most developed regions in China, with an area of about 11,000 square kilometers.","set":"CET4 2017·06·S3","cls":"C","ch":0},{"cn":"珠江三角洲九个最大城市共有 5,700 多万人口。","en":"The nine largest cities in the Pearl River Delta have a combined population of more than 57 million.","set":"CET4 2017·06·S3","cls":"C","ch":0},{"cn":"上世纪 70 年代末中国改革开放以来，珠江三角洲已成为中国和世界主要经济区域和制造中心之一。","en":"Since China launched reform and opening up in the late 1970s, the Pearl River Delta has become one of the major economic regions and manufacturing centers in China and the world.","set":"CET4 2017·06·S3","cls":"C","ch":0}],"泰山":[{"cn":"泰山位于山东省西部。","en":"Mount Tai is located in western Shandong Province.","set":"CET4 2017·12·S1","cls":"C","ch":0},{"cn":"海拔 1500 余米,方圆约 400 平方公里。","en":"It rises more than 1,500 meters above sea level and covers an area of about 400 square kilometers.","set":"CET4 2017·12·S1","cls":"D","ch":0},{"cn":"泰山不仅雄伟壮观,而且是一座历史文化名山,过去3000 多年一直是人们前往朝拜的地方。","en":"Mount Tai is not only majestic and spectacular but also a famous mountain of history and culture, and for more than 3,000 years it has been a place of pilgrimage.","set":"CET4 2017·12·S1","cls":"D","ch":0},{"cn":"许多作家到泰山获取灵感,写诗作文,艺术家也来此绘画。","en":"Many writers came to Mount Tai for inspiration and wrote poems and essays, and artists also came here to paint.","set":"CET4 2017·12·S1","cls":"D","ch":0},{"cn":"泰山如今已成为中国一处主要的旅游景点。","en":"Today Mount Tai has become a major tourist attraction in China.","set":"CET4 2017·12·S1","cls":"D","ch":0}],"黄山":[{"cn":"黄山位于安徽省南部。","en":"Mount Huangshan is located in southern Anhui Province.","set":"CET4 2017·12·S3","cls":"C","ch":0},{"cn":"它风景独特，尤以其日出和云海著称。","en":"Its scenery is unique, and it is especially famous for its sunrises and seas of clouds.","set":"CET4 2017·12·S3","cls":"D","ch":0},{"cn":"但要欣赏黄山美景，得向下看。","en":"But to enjoy the beautiful scenery of Mount Huangshan, one has to look down.","set":"CET4 2017·12·S3","cls":"D","ch":0},{"cn":"黄山的湿润气候有利于茶树生成，是中国主要产茶地之一。","en":"The humid climate of Mount Huangshan is good for the growth of tea trees, making the mountain one of China's major tea-producing areas.","set":"CET4 2017·12·S3","cls":"D","ch":0},{"cn":"黄山是中国主要旅游目的地之一，也是摄影和传统国画最受欢迎的主题。","en":"Mount Huangshan is one of China's major tourist destinations and also one of the most popular subjects for photography and traditional Chinese painting.","set":"CET4 2017·12·S3","cls":"C","ch":0}],"大运河":[{"cn":"大运河（GrandCanal)是世界上最长的人工河，北起北京，南至杭州。","en":"The Grand Canal, or the Beijing-Hangzhou Grand Canal, is the longest man-made river in the world, running from Beijing in the north to Hangzhou in the south.","set":"CET4 2021·12·S1","cls":"A","ch":0},{"cn":"大运河始建于公元前4世纪，公元13世纪末建成。","en":"Construction of the Grand Canal began in the 4th century BC and was completed at the end of the 13th century AD.","set":"CET4 2021·12·S1","cls":"B","ch":0},{"cn":"大运河沿线区域逐渐发展成为中国的工商业中心。","en":"The areas along the Grand Canal gradually developed into the industrial and commercial center of China.","set":"CET4 2021·12·S1","cls":"C","ch":0},{"cn":"长久以来，大运河对中国的经济发展发挥了重要作用，有力地促进了南北地区之间的人员往来和文化交","en":"For a long time, the Grand Canal has played an important role in China's economic development and has greatly promoted personnel exchanges and cultural exchanges between the north and the south.","set":"CET4 2021·12·S1","cls":"B","ch":0},{"cn":"乌镇是浙江的一座古老水镇，坐落在京杭大运河畔。","en":"Wuzhen is an ancient water town in Zhejiang province, situated on the bank of the Beijing-Hangzhou Grand Canal.","set":"CET4 2016·06·S3","cls":"C","ch":10},{"cn":"大运河（GrandCanal)是世界上最长的人工河，北起北京，南至杭州。","en":"The Grand Canal is the longest man-made river in the world, running from Beijing in the north to Hangzhou in the south.","set":"CET4 2021·12·S1","cls":"C","ch":10},{"cn":"大运河始建于公元前4世纪，公元13世纪末建成。","en":"The Grand Canal was first built in the 4th century BC and completed at the end of the 13th century AD.","set":"CET4 2021·12·S1","cls":"C","ch":10},{"cn":"大运河沿线区域逐渐发展成为中国的工商业中心。","en":"The areas along the Grand Canal gradually developed into an industrial and commercial center of China.","set":"CET4 2021·12·S1","cls":"C","ch":10},{"cn":"长久以来，大运河对中国的经济发展发挥了重要作用，有力地促进了南北地区之间的人员往来和文化交","en":"For a long time, the Grand Canal has played an important role in China's economic development and greatly promoted the movement of people and cultural exchanges between the north and the south.","set":"CET4 2021·12·S1","cls":"C","ch":10}],"汉朝":[{"cn":"汉朝是中国历史上最重要的朝代之一。","en":"The Han Dynasty is one of the most important dynasties in Chinese history.","set":"CET6 2015·06·S3","cls":"B","ch":0},{"cn":"汉朝统治期间有很多显著的成就。","en":"During the Han Dynasty, there were many remarkable achievements.","set":"CET6 2015·06·S3","cls":"B","ch":0},{"cn":"汉朝开拓的丝绸之路通向了中西亚乃至罗马。","en":"The Silk Road opened up by the Han Dynasty led all the way to Central and Western Asia and even to Rome.","set":"CET6 2015·06·S3","cls":"B","ch":0},{"cn":"汉朝历经 400 年，但统治者的腐败最终导致了它的灭亡。","en":"The Han Dynasty lasted 400 years, but the corruption of its rulers eventually led to its downfall.","set":"CET6 2015·06·S3","cls":"B","ch":0},{"cn":"随着农耕业的持续发展，黄土高原人口不断增加，在秦汉时期就成为中国的政治和经济中心。","en":"With the continuous development of farming, the population of the Loess Plateau kept growing, and by the Qin and Han dynasties the region had become China's political and economic centre.","set":"CET6 2022·12·S2","cls":"C","ch":0},{"cn":"正如历史学家所指出的那样，如果没有张骞出使西域，就不可能有丝绸之路的开辟，也就不会有汉朝同西域或欧洲的文化交流。","en":"As historians have pointed out, without Zhang Qian's missions to the Western Regions, there would have been no opening of the Silk Road, nor any cultural exchange between the Han Dynasty and the Western Regions or Europe.","set":"CET6 2023·03·S1","cls":"B","ch":11}],"丝绸之路":[{"cn":"汉朝开拓的丝绸之路通向了中西亚乃至罗马。","en":"The Silk Road opened up by the Han Dynasty led all the way to Central and Western Asia and even to Rome.","set":"CET6 2015·06·S3","cls":"B","ch":0},{"cn":"闻名于世的丝绸之路是一系列连接东西方的路线。","en":"The world-famous Silk Road was a series of routes that connected the East and the West.","set":"CET6 2013·12·S1","cls":"A","ch":11},{"cn":"丝绸之路延伸6,000多公里，得名于古代中国的丝绸贸易。","en":"The Silk Road extended for more than 6,000 kilometers, so named because of the silk trade in ancient China.","set":"CET6 2013·12·S1","cls":"A","ch":11},{"cn":"丝绸之路上的贸易在中国、南亚、欧洲和中东文明发展中发挥了重要作用。","en":"Trade along the Silk Road played an important role in the development of the civilizations of China, South Asia, Europe and the Middle East.","set":"CET6 2013·12·S1","cls":"A","ch":11},{"cn":"正是通过丝绸之路，中国的造纸、火药、指南针、印刷术等四大发明才被引介到世界各地。","en":"It was through the Silk Road that China's Four Great Inventions — papermaking, gunpowder, the compass and printing — were introduced to the rest of the world.","set":"CET6 2013·12·S1","cls":"B","ch":11},{"cn":"物质文化的交流是双向的，欧洲也通过丝绸之路出口各种商品和植物，满足中国市场的需要。","en":"The exchange of material culture was two-way, and Europe also exported various goods and plants along the Silk Road to meet the needs of the Chinese market.","set":"CET6 2013·12·S1","cls":"B","ch":11},{"cn":"他不畏艰险，克服重重困难，两次出使西域，开通了中国同西亚和欧洲的通商关系，将中国的丝和丝织品运往西亚和欧洲，开拓了历史上著名的“丝绸之路”。","en":"Braving dangers and overcoming numerous difficulties, he made two missions to the Western Regions, opened up trade relations between China and West Asia and Europe, carried China's silk and silk fabrics to West Asia and Europe, and pioneered the world-famous Silk Road.","set":"CET6 2023·03·S1","cls":"B","ch":11}],"明朝":[{"cn":"明朝统治中国276年，被人们描绘成人类历史上治理有序、社会稳定的最伟大的时代之一。","en":"The Ming Dynasty ruled China for 276 years and has been described as one of the greatest eras of orderly government and social stability in human history.","set":"CET6 2017·06·S1","cls":"C","ch":0},{"cn":"也是在明代，由郑和率领的船队曾到印度洋进行了七次大规模探险航行。","en":"It was also in the Ming Dynasty that the fleets led by Zheng He made seven large-scale voyages of exploration to the Indian Ocean.","set":"CET6 2017·06·S1","cls":"C","ch":0},{"cn":"还值得一提的是，中国文学的四大经典名著中有三部写于明代。","en":"It is also worth mentioning that three of the four great classical novels of Chinese literature were written in the Ming Dynasty.","set":"CET6 2017·06·S1","cls":"C","ch":0},{"cn":"北京烤鸭源于600年前的明代。","en":"Beijing Roast Duck dates back to the Ming Dynasty, more than 600 years ago.","set":"CET4 2020·09·S3","cls":"C","ch":8},{"cn":"北京烤鸭源于600年前的明代。","en":"Beijing Roast Duck originated in the Ming Dynasty, more than 600 years ago.","set":"CET4 2020·09·S3","cls":"C","ch":10}],"丝绸":[{"cn":"大量商品，包括酒和丝绸，都在市场销售。","en":"A large number of goods, including wine and silk, were sold in the markets.","set":"CET6 2017·06·S1","cls":"C","ch":0},{"cn":"同样，中国的丝绸、茶叶和瓷器(porcelain)也传遍全球。","en":"Similarly, China's silk, tea and porcelain spread across the globe.","set":"CET6 2013·12·S1","cls":"A","ch":11}],"郑和":[{"cn":"也是在明代，由郑和率领的船队曾到印度洋进行了七次大规模探险航行。","en":"It was also in the Ming Dynasty that the fleets led by Zheng He made seven large-scale voyages of exploration to the Indian Ocean.","set":"CET6 2017·06·S1","cls":"C","ch":0},{"cn":"郑和是中国历史上最杰出的航海家，在航海、外交、军事等诸多领域都表现出非凡的智慧和卓越的才能。","en":"Zheng He was the most outstanding navigator in Chinese history and displayed extraordinary wisdom and outstanding talent in many fields such as navigation, diplomacy and military affairs.","set":"CET6 2023·03·S2","cls":"D","ch":11}],"印度洋":[{"cn":"也是在明代，由郑和率领的船队曾到印度洋进行了七次大规模探险航行。","en":"It was also in the Ming Dynasty that the fleets led by Zheng He made seven large-scale voyages of exploration to the Indian Ocean.","set":"CET6 2017·06·S1","cls":"C","ch":0},{"cn":"他曾七次率领庞大的船队远航，访问了西太平洋和印度洋的许多国家和地区，加深了中国同东南亚、东非的相互了解。","en":"He led a huge fleet on seven voyages, visited many countries and regions in the Western Pacific and the Indian Ocean, and deepened mutual understanding between China and Southeast Asia and East Africa.","set":"CET6 2023·03·S2","cls":"D","ch":11}],"船队":[{"cn":"也是在明代，由郑和率领的船队曾到印度洋进行了七次大规模探险航行。","en":"It was also in the Ming Dynasty that the fleets led by Zheng He made seven large-scale voyages of exploration to the Indian Ocean.","set":"CET6 2017·06·S1","cls":"C","ch":0},{"cn":"他曾七次率领庞大的船队远航，访问了西太平洋和印度洋的许多国家和地区，加深了中国同东南亚、东非的相互了解。","en":"He led a huge fleet on seven voyages, visited many countries and regions in the Western Pacific and the Indian Ocean, and deepened mutual understanding between China and Southeast Asia and East Africa.","set":"CET6 2023·03·S2","cls":"D","ch":11}],"宋朝":[{"cn":"宋朝始于 960 年，一直延续到 1279 年。","en":"The Song Dynasty began in 960 and lasted until 1279.","set":"CET6 2017·06·S2","cls":"C","ch":0},{"cn":"宋代中国是世界历史上首先发行纸币的国家。","en":"Song China was the first country in world history to issue paper money.","set":"CET6 2017·06·S2","cls":"C","ch":0},{"cn":"宋朝还最早使用火药并发明了活字（movable-type）印刷。","en":"The Song Dynasty was also the first to use gunpowder and invented movable-type printing.","set":"CET6 2017·06·S2","cls":"C","ch":0},{"cn":"宋朝的政府体制在当时也是先进的。","en":"The government system of the Song Dynasty was also advanced for its time.","set":"CET6 2017·06·S2","cls":"C","ch":0}],"火药":[{"cn":"宋朝还最早使用火药并发明了活字（movable-type）印刷。","en":"The Song Dynasty was also the first to use gunpowder and invented movable-type printing.","set":"CET6 2017·06·S2","cls":"C","ch":0},{"cn":"正是通过丝绸之路，中国的造纸、火药、指南针、印刷术等四大发明才被引介到世界各地。","en":"It was through the Silk Road that China's Four Great Inventions — papermaking, gunpowder, the compass and printing — were introduced to the rest of the world.","set":"CET6 2013·12·S1","cls":"B","ch":11}],"唐朝":[{"cn":"唐朝始于618年，终于907年，是中国历史上最灿烂的时期。","en":"The Tang Dynasty lasted from 618 to 907 and was the most brilliant period in Chinese history.","set":"CET6 2017·06·S3","cls":"A","ch":0},{"cn":"经过近三百年的发展，唐代中国成为世界上最繁荣的强国，其首都长安是当时世界上最大的都市。","en":"After nearly three hundred years of development, Tang China had become the most prosperous power in the world, and its capital Chang'an was the largest city in the world at that time.","set":"CET6 2017·06·S3","cls":"C","ch":0},{"cn":"唐朝始于618年，终于907年，是中国历史上最灿烂的时期。","en":"The Tang Dynasty began in 618 and ended in 907, and was the most glorious period in Chinese history.","set":"CET6 2017·06·S3","cls":"C","ch":2},{"cn":"过中秋节的习俗于唐代早期在中国各地开始流行。","en":"The custom of celebrating the Mid-Autumn Festival began to gain popularity across China in the early Tang Dynasty.","set":"CET6 2013·12·S3","cls":"C","ch":7}  the Yangtze River, and the size of the lake depends largely on seasonal changes.","set":"CET6 2017·12·S3","cls":"B","ch":0},{"cn":"洞庭湖作为龙舟赛的发源地，在中国文化中享有盛名。","en":"As the birthplace of the dragon boat race, Lake Dongting enjoys a high reputation in Chinese culture.","set":"CET6 2017·12·S3","cls":"C","ch":0},{"cn":"据说龙舟赛始于洞庭湖东岸。","en":"It is said that the dragon boat race originated on the east bank of Lake Dongting.","set":"CET6 2017·12·S3","cls":"B","ch":0},{"cn":"龙舟赛与洞庭湖及周边的美景，每年都吸引着成千上万来自全国和世界各地的游客。","en":"The dragon boat race and the beautiful scenery of Lake Dongting and its surroundings attract tens of thousands of visitors from across China and around the world every year.","set":"CET6 2017·12·S3","cls":"C","ch":0}],"龙舟赛":[{"cn":"洞庭湖作为龙舟赛的发源地，在中国文化中享有盛名。","en":"As the birthplace of the dragon boat race, Lake Dongting enjoys a high reputation in Chinese culture.","set":"CET6 2017·12·S3","cls":"C","ch":0},{"cn":"据说龙舟赛始于洞庭湖东岸。","en":"It is said that the dragon boat race originated on the east bank of Lake Dongting.","set":"CET6 2017·12·S3","cls":"B","ch":0},{"cn":"龙舟赛与洞庭湖及周边的美景，每年都吸引着成千上万来自全国和世界各地的游客。","en":"The dragon boat race and the beautiful scenery of Lake Dongting and its surroundings attract tens of thousands of visitors from across China and around the world every year.","set":"CET6 2017·12·S3","cls":"C","ch":0}],"楚国":[{"cn":"为的是搜寻楚国爱国诗人屈原的遗体。","en":"The purpose was to search for the remains of Qu Yuan, the patriotic poet of the State of Chu.","set":"CET6 2017·12·S3","cls":"C","ch":0}],"云南":[{"cn":"云南是位于中国西南的一个省份，平均海拔1500米。","en":"Yunnan is a province in southwestern China, with an average elevation of 1,500 metres.","set":"CET6 2021·06·S3","cls":"A","ch":0},{"cn":"云贵高原(the Yunnan-Guizhou Plateau)大部分位于云南、贵州省境内，总面积约 50 万平方公里，平均海拔 2000 — 4000 米，是中国第四大高原。","en":"Located mostly in Yunnan and Guizhou provinces, the Yunnan-Guizhou Plateau has a total area of about 500,000 square kilometres and an average elevation of 2,000–4,000 metres, making it China's fourth largest plateau.","set":"CET6 2022·12·S3","cls":"B","ch":0}],"生物多样性":[{"cn":"云南生态环境优越，生物多种多样，被誉为野生动植物的天堂。","en":"Yunnan has an excellent ecological environment and rich biodiversity, and is known as a paradise for wildlife.","set":"CET6 2021·06·S3","cls":"D","ch":0},{"cn":"云贵高原独特的自然环境造就了生物和文化的多样性。","en":"The unique natural environment of the Yunnan-Guizhou Plateau has created its biological and cultural diversity.","set":"CET6 2022·12·S3","cls":"C","ch":0}],"水资源":[{"cn":"云南还有多种矿藏和充足的水资源，为全省经济的可持续发展提供了有利条件。","en":"Yunnan also possesses a variety of mineral resources and abundant water resources, which provide favourable conditions for the sustainable development of the province's economy.","set":"CET6 2021·06·S3","cls":"D","ch":0},{"cn":"自古以来，中国的水资源北缺南丰，分布极不均衡。","en":"Since ancient times, China's water resources have been scarce in the north and abundant in the south, with an extremely uneven distribution.","set":"CET6 2025·06·S2","cls":"A","ch":0}],"少数民族":[{"cn":"云南居住着25个少数民族，他们大多有自己的语言，习俗和宗教。","en":"Yunnan is home to 25 ethnic minority groups, most of whom have their own languages, customs and religions.","set":"CET6 2021·06·S3","cls":"A","ch":0},{"cn":"云贵高原是中国少数民族数量最多的地区，各民族都保留了自己丰富多彩的文化传统。","en":"The Yunnan-Guizhou Plateau is the region with the largest number of ethnic minority groups in China, and each group has preserved its own rich and colourful cultural traditions.","set":"CET6 2022·12·S3","cls":"A","ch":0}],"习俗":[{"cn":"云南居住着25个少数民族，他们大多有自己的语言，习俗和宗教。","en":"Yunnan is home to 25 ethnic minority groups, most of whom have their own languages, customs and religions.","set":"CET6 2021·06·S3","cls":"A","ch":0},{"cn":"春节贴福字是民间由来已久的习俗。","en":"Pasting the \"fu\" character during the Spring Festival is a long-standing folk custom.","set":"CET4 2024·06·S3","cls":"B","ch":7}],"青藏高原":[{"cn":"青藏高原(the Qinghai-Tibet Plateau)位于中国西南部，面积约 230 万平方公里，平均海拔 4000 米以上，被称为“世界屋脊” 。","en":"The Qinghai-Tibet Plateau, located in southwestern China, covers an area of about 2.3 million square kilometres, with an average elevation of over 4,000 metres, and is known as the “Roof of the World”.","set":"CET6 2022·12·S1","cls":"A","ch":0},{"cn":"青藏高原自然资源丰富，风景秀丽，拥有多种珍稀野生动物。","en":"The Qinghai-Tibet Plateau is rich in natural resources and has beautiful scenery and a variety of rare wild animals.","set":"CET6 2022·12·S1","cls":"B","ch":0},{"cn":"青藏高原气温很低，形成了大面积高山冰川。","en":"Temperatures on the Qinghai-Tibet Plateau are very low, which has given rise to large areas of alpine glaciers.","set":"CET6 2022·12·S1","cls":"A","ch":0},{"cn":"由于气候变化的影响，青藏高原的冰川正在加速融化。","en":"Under the impact of climate change, the glaciers on the Qinghai-Tibet Plateau are melting at an accelerating rate.","set":"CET6 2022·12·S1","cls":"B","ch":0},{"cn":"中国一直在努力保护青藏高原的生态系统，草地覆盖率不断增加，许多濒危物种得到更为有效的保护。","en":"China has been working to protect the ecosystem of the Qinghai-Tibet Plateau: grassland coverage has been increasing, and many endangered species are now better protected.","set":"CET6 2022·12·S1","cls":"B","ch":0}],"东南亚":[{"cn":"这里是亚洲许多著名河流的源头，是中国和东南亚的主要淡水供应源。","en":"This is the source of many famous rivers in Asia and the main source of fresh water for China and Southeast Asia.","set":"CET6 2022·12·S1","cls":"D","ch":0},{"cn":"他曾七次率领庞大的船队远航，访问了西太平洋和印度洋的许多国家和地区，加深了中国同东南亚、东非的相互了解。","en":"He led a huge fleet on seven voyages, visited many countries and regions in the Western Pacific and the Indian Ocean, and deepened mutual understanding between China and Southeast Asia and East Africa.","set":"CET6 2023·03·S2","cls":"D","ch":11}],"黄土高原":[{"cn":"黄土高原 (the Loess Plateau）面积约 60 万平方公里，是中国第三大高原，平均海拔 1000 — 2000 米，绝大部分覆盖着 50 — 80 米厚的黄土，是世界上黄土分布最集中、覆盖厚度最大的区域。","en":"The Loess Plateau covers an area of about 600,000 square kilometres and is China's third largest plateau, with an average elevation of 1,000–2,000 metres. Most of it is covered with loess 50–80 metres thick, making it the area with the most concentrated loess distribution and the thickest loess cover in the world.","set":"CET6 2022·12·S2","cls":"B","ch":0},{"cn":"黄土高原是中华民族的发祥地之一。","en":"The Loess Plateau is one of the birthplaces of the Chinese nation.","set":"CET6 2022·12·S2","cls":"A","ch":0},{"cn":"早在 5500 年前，人们就已经在黄土高原上开始农耕。","en":"As early as 5,500 years ago, people had already begun to farm on the Loess Plateau.","set":"CET6 2022·12·S2","cls":"B","ch":0},{"cn":"随着农耕业的持续发展，黄土高原人口不断增加，在秦汉时期就成为中国的政治和经济中心。","en":"With the continuous development of farming, the population of the Loess Plateau kept growing, and by the Qin and Han dynasties the region had become China's political and economic centre.","set":"CET6 2022·12·S2","cls":"C","ch":0},{"cn":"如今，随着西部大开发战略的实施，黄土高原地区的经济得到了迅速发展。","en":"Today, with the implementation of the strategy for the large-scale development of the western region, the economy of the Loess Plateau area has developed rapidly.","set":"CET6 2022·12·S2","cls":"B","ch":0}],"中华民族":[{"cn":"黄土高原是中华民族的发祥地之一。","en":"The Loess Plateau is one of the birthplaces of the Chinese nation.","set":"CET6 2022·12·S2","cls":"A","ch":0},{"cn":"节俭 (frugality) 是中华民族的传统美德。","en":"Frugality is a traditional virtue of the Chinese nation.","set":"CET6 2025·12·S3","cls":"A","ch":1},{"cn":"汉语历史上对团结中华民族发挥了重要作用。","en":"Historically, Chinese has played an important role in uniting the Chinese nation.","set":"CET6 2019·06·S2","cls":"D","ch":2},{"cn":"尊师是中华民族的传统美德，在当今社会得到了发扬光大。","en":"Respecting teachers is a traditional virtue of the Chinese nation, and it has been carried forward in today's society.","set":"CET4 2026·06·S1","cls":"C","ch":4},{"cn":"遨游太空历来是中华民族的梦想。","en":"Traveling in space has long been the dream of the Chinese nation.","set":"CET6 2024·12·S3","cls":"D","ch":5}],"云贵高原":[{"cn":"云贵高原(the Yunnan-Guizhou Plateau)大部分位于云南、贵州省境内，总面积约 50 万平方公里，平均海拔 2000 — 4000 米，是中国第四大高原。","en":"Located mostly in Yunnan and Guizhou provinces, the Yunnan-Guizhou Plateau has a total area of about 500,000 square kilometres and an average elevation of 2,000–4,000 metres, making it China's fourth largest plateau.","set":"CET6 2022·12·S3","cls":"B","ch":0},{"cn":"云贵高原西高东低，河流众多，形成了许多又深又陡的峡谷(canyon)。","en":"The Yunnan-Guizhou Plateau is high in the west and low in the east, and its many rivers have carved out numerous deep and steep canyons.","set":"CET6 2022·12·S3","cls":"C","ch":0},{"cn":"云贵高原独特的自然环境造就了生物和文化的多样性。","en":"The unique natural environment of the Yunnan-Guizhou Plateau has created its biological and cultural diversity.","set":"CET6 2022·12·S3","cls":"C","ch":0}],"餐桌礼仪":[{"cn":"餐桌礼仪 (dining etiquette) 是中华传统文化的重要组成部分，蕴含着热情有礼的待客之道。","en":"Dining etiquette is an important part of traditional Chinese culture and embodies a warm and courteous way of hosting guests.","set":"CET4 2026·06·S2","cls":"C","ch":1},{"cn":"这种独特的餐桌礼仪已延续了数千年，对促进和谐的人际交往起到了重要作用。","en":"This distinctive dining etiquette has lasted for thousands of years and has played an important role in promoting harmonious interpersonal interaction.","set":"CET4 2026·06·S2","cls":"C","ch":1}],"待客之道":[{"cn":"餐桌礼仪 (dining etiquette) 是中华传统文化的重要组成部分，蕴含着热情有礼的待客之道。","en":"Dining etiquette is an important part of traditional Chinese culture and embodies a warm and courteous way of hosting guests.","set":"CET4 2026·06·S2","cls":"C","ch":1},{"cn":"中国传统的待客之道要求饭菜丰富多样，让客人吃不完。","en":"The traditional Chinese way of entertaining guests requires a rich and varied spread of dishes, with more food than the guests can finish.","set":"CET6 2015·06·S1","cls":"C","ch":8}],"大门":[{"cn":"就餐座位的安排非常讲究，主人坐在正对大门的位置，在主人身边就座的是最重要的客人。","en":"Much attention is paid to the arrangement of seats at the table: the host sits in the seat facing the main door, and the most important guest sits beside the host.","set":"CET4 2026·06·S2","cls":"D","ch":1},{"cn":"春联贴在大门左右两侧和门框上方。","en":"Spring Festival couplets are pasted on both sides of the front gate and above the door frame.","set":"CET6 2022·09·S1","cls":"B","ch":7}],"人际交往":[{"cn":"这种独特的餐桌礼仪已延续了数千年，对促进和谐的人际交往起到了重要作用。","en":"This distinctive dining etiquette has lasted for thousands of years and has played an important role in promoting harmonious interpersonal interaction.","set":"CET4 2026·06·S2","cls":"C","ch":1},{"cn":"在中国传统文化中，亲朋好友之间互赠礼物是人际交往的一种重要礼节 (etiquette)。","en":"In traditional Chinese culture, exchanging gifts among relatives and friends is an important form of etiquette in interpersonal interaction.","set":"CET4 2026·06·S3","cls":"C","ch":1}],"亲友":[{"cn":"在中国传统文化中，亲朋好友之间互赠礼物是人际交往的一种重要礼节 (etiquette)。","en":"In traditional Chinese culture, exchanging gifts among relatives and friends is an important form of etiquette in interpersonal interaction.","set":"CET4 2026·06·S3","cls":"C","ch":1},{"cn":"人们将月饼作为礼物馈赠亲友或在家庭聚会上享用。","en":"People give mooncakes as gifts to relatives and friends, or enjoy them at family gatherings.","set":"CET6 2013·12·S3","cls":"C","ch":7},{"cn":"正由于这个象征性的意义，春节期间鱼也作为礼物送给亲戚朋友。","en":"Because of this symbolic meaning, fish is also given as a gift to relatives and friends during the Spring Festival.","set":"CET4 2020·12·S3","cls":"B","ch":7},{"cn":"如今，红包不仅是给孩子的礼物，而且经常也是给长辈或亲朋好友的礼物。","en":"Today, red envelopes are not only gifts for children but also gifts for elders or relatives and friends.","set":"CET4 2022·09·S2","cls":"B","ch":7},{"cn":"这无疑是一种与远方亲友联系的便捷方式。","en":"This is undoubtedly a convenient way to keep in touch with relatives and friends far away.","set":"CET4 2022·09·S2","cls":"C","ch":7}],"乡村生活":[{"cn":"反映在艺术和文学中的乡村生活理想是中国文明的重要特征。","en":"The ideal of rural life as reflected in art and literature is an important feature of Chinese civilization.","set":"CET6 2014·12·S1","cls":"D","ch":1},{"cn":"另一个则是乡村生活的种种乐趣，画有渔夫在湖上打渔，农夫在山上欲柴采药，或是书生坐在松树下呤诗作画。","en":"The other is the various pleasures of country life, with fishermen fishing on the lake, farmers cutting firewood and gathering herbs in the mountains, or scholars sitting under pine trees composing poems and painting.","set":"CET6 2014·12·S1","cls":"D","ch":1},{"cn":"反映在艺术和文学中的乡村生活理想是中国文明的重要特征。","en":"The ideal of rural life reflected in art and literature is an important feature of Chinese civilization.","set":"CET6 2014.12 第1套","cls":"E","ch":3},{"cn":"这在很大程度上归功于道家（Taoist) 对自然的情感。","en":"This is to a great extent due to the Taoists' affection for nature.","set":"CET6 2014.12 第1套","cls":"B","ch":3},{"cn":"传统中国画有两个最受青睐的主题，一是家庭生活的各种幸福场景，画中往往有老人在饮茶下棋，男人在耕耘收割，妇女在织布缝衣，小孩在户外玩耍。","en":"Traditional Chinese painting has two most favored themes. One is the various happy scenes of family life, in which there are often old people drinking tea and playing chess, men plowing and harvesting, women weaving and sewing, and children playing outdoors.","set":"CET6 2014.12 第1套","cls":"E","ch":3},{"cn":"另一个则是乡村生活的种种乐趣，画有渔夫在湖上打渔，农夫在山上欲柴采药，或是书生坐在松树下呤诗作画。","en":"The other is the many pleasures of rural life, depicting fishermen fishing on the lake, farmers gathering firewood and herbs in the mountains, or scholars sitting under pine trees composing poems and painting.","set":"CET6 2014.12 第1套","cls":"E","ch":3},{"cn":"这两个主题可以分别代表儒家 (Confucian)和道家的生活理想。","en":"These two themes can respectively represent the Confucian and Taoist ideals of life.","set":"CET6 2014.12 第1套","cls":"B","ch":3}],"道家":[{"cn":"这在很大程度上归功于道家（Taoist) 对自然的情感。","en":"This is to a large extent thanks to the Taoist love of nature.","set":"CET6 2014·12·S1","cls":"A","ch":1},{"cn":"这两个主题可以分别代表儒家 (Confucian)和道家的生活理想。","en":"These two themes can respectively represent the Confucian and the Taoist ideals of life.","set":"CET6 2014·12·S1","cls":"A","ch":1}],"中国画":[{"cn":"传统中国画有两个最受青睐的主题，一是家庭生活的各种幸福场景，画中往往有老人在饮茶下棋，男人在耕耘收割，妇女在织布缝衣，小孩在户外玩耍。","en":"Traditional Chinese painting has two favored themes. One is the various happy scenes of family life, in which old people are often seen drinking tea and playing chess, men plowing and harvesting, women weaving and sewing, and children playing outdoors.","set":"CET6 2014·12·S1","cls":"D","ch":1}],"儒家":[{"cn":"这两个主题可以分别代表儒家 (Confucian)和道家的生活理想。","en":"These two themes can respectively represent the Confucian and the Taoist ideals of life.","set":"CET6 2014·12·S1","cls":"A","ch":1}],"传统美德":[{"cn":"尊老是中华民族的传统美德，深深植根于中国人的思想和行为中，是人们普遍遵守的行为规范和社会准则。","en":"Respecting the elderly is a traditional virtue of the Chinese nation, deeply rooted in the thoughts and behavior of the Chinese people and widely observed as a code of conduct and social norm.","set":"CET6 2025·12·S1","cls":"A","ch":1},{"cn":"节俭 (frugality) 是中华民族的传统美德。","en":"Frugality is a traditional virtue of the Chinese nation.","set":"CET6 2025·12·S3","cls":"A","ch":1},{"cn":"尊师是中华民族的传统美德，在当今社会得到了发扬光大。","en":"Respecting teachers is a traditional virtue of the Chinese nation, and it has been carried forward in today's society.","set":"CET4 2026·06·S1","cls":"C","ch":4},{"cn":"今天，尽管人们愈来愈富裕了，但他们仍然认为节省是一种值得弘扬的美德。","en":"Today, although people are getting richer and richer, they still regard thrift as a virtue worth promoting.","set":"CET4 2020·12·S3","cls":"D","ch":7}],"节俭":[{"cn":"节俭 (frugality) 是中华民族的传统美德。","en":"Frugality is a traditional virtue of the Chinese nation.","set":"CET6 2025·12·S3","cls":"A","ch":1}],"汉族":[{"cn":"中国汉族人的全名由姓和名组成。","en":"The full name of a Han Chinese consists of a surname and a given name.","set":"CET4 2019·12·S3","cls":"C","ch":2}],"汉字":[{"cn":"一般来说，名有一个或两个汉字，通常承载父母对孩子的愿望。","en":"Generally speaking, a given name consists of one or two Chinese characters and usually carries the parents' wishes for their child.","set":"CET4 2019·12·S3","cls":"D","ch":2},{"cn":"在中国，来自不同地区的人可能听不懂对方的方言，但由于汉字有统一的书写形式，他们交流起来几乎没有任何困难。","en":"In China, people from different regions may not understand each other's dialects, but because Chinese characters have a unified written form, they have almost no difficulty communicating.","set":"CET6 2019·06·S2","cls":"D","ch":2},{"cn":"成语(Chinese idioms)是汉语中的一种独特的表达方式，大多由四个汉字组成。","en":"Chinese idioms are a unique form of expression in the Chinese language, most of which consist of four characters.","set":"CET6 2019·06·S3","cls":"C","ch":2}],"取名":[{"cn":"从孩子的名字可以推断出父母希望孩子成为什么样的人，或者期望他们过什么样的生活。","en":"A child's name reveals what kind of person the parents hope the child will become, or what kind of life they expect the child to lead.","set":"CET4 2019·12·S3","cls":"D","ch":2},{"cn":"父母非常重视给孩子取名，因为名字往往会伴随孩子一生。","en":"Parents attach great importance to naming their children, because a name often accompanies a child throughout his or her life.","set":"CET4 2019·12·S3","cls":"D","ch":2}],"土豪":[{"cn":"例如,土豪（tuhao)和大妈（dama)都是老词，但已获取了新的意义。","en":"For example, tuhao and dama are both old words, but they have acquired new meanings.","set":"CET6 2014·06·S2","cls":"C","ch":2},{"cn":"土豪以前指欺压佃户和仆人的乡村地主，现在用于指花钱如流水或喜欢炫耀财富的人。","en":"Tuhao used to refer to a rural landlord who oppressed tenant farmers and servants, but now it refers to someone who spends money like water or likes to show off his or her wealth.","set":"CET6 2014·06·S2","cls":"C","ch":2},{"cn":"也就是说，土豪有钱，但没有品位。","en":"In other words, tuhao means having money but no taste.","set":"CET6 2014·06·S2","cls":"C","ch":2},{"cn":"土豪和大妈可能会被收入新版牛津(Oxford)英语词典。","en":"Tuhao and dama may be included in the new edition of the Oxford English Dictionary.","set":"CET6 2014·06·S2","cls":"C","ch":2}],"汉语":[{"cn":"随着中国经济的蓬勃发展，学汉语的人数迅速增加，使汉语成了世界上人们最爱学的语言之一。","en":"With the vigorous development of China's economy, the number of Chinese learners has increased rapidly, making Chinese one of the most popular languages to learn in the world.","set":"CET6 2016·12·S2","cls":"D","ch":2},{"cn":"汉语现在是世界上用作本族语人数最多的语言。","en":"Chinese is now the language spoken by more native speakers than any other language in the world.","set":"CET6 2019·06·S2","cls":"D","ch":2},{"cn":"目前仍在使用的书写系统中，汉语是最古老的。","en":"Of the writing systems still in use today, Chinese is the oldest.","set":"CET6 2019·06·S2","cls":"B","ch":2},{"cn":"今天，随着中国经济的快速增长和全球影响力的增强，越来越多其他国家的人也开始学习汉语。","en":"Today, with the rapid growth of China's economy and its growing global influence, more and more people in other countries are beginning to learn Chinese.","set":"CET6 2019·06·S2","cls":"D","ch":2}],"方言":[{"cn":"中国幅员辽阔，人口众多，很多地方人们都说自己的方言。","en":"China is a vast country with a large population, and in many places people speak their own dialects.","set":"CET6 2019·06·S1","cls":"D","ch":2},{"cn":"有些方言，特别是北方和南方的方言，差异很大，以致于说不同方言的人常常很难听懂彼此的讲话。","en":"Some dialects, especially those in the north and the south, differ so greatly that people who speak different dialects often find it hard to understand each other.","set":"CET6 2019·06·S1","cls":"B","ch":2},{"cn":"在中国，来自不同地区的人可能听不懂对方的方言，但由于汉字有统一的书写形式，他们交流起来几乎没有任何困难。","en":"In China, people from different regions may not understand each other's dialects, but because Chinese characters have a unified written form, they have almost no difficulty communicating.","set":"CET6 2019·06·S2","cls":"D","ch":2}],"文化遗产":[{"cn":"为了鼓励人们更多说本地语言，一些地方政府已经采取措施，如在学校开设方言课，在广播和电视上播放方言节目，以期保存本地的文化遗产。","en":"To encourage people to speak local languages more often, some local governments have taken measures such as offering dialect courses in schools and broadcasting dialect programs on radio and television, in the hope of preserving local cultural heritage.","set":"CET6 2019·06·S1","cls":"D","ch":2},{"cn":"2006年，中秋节被列为中国的文化遗产，2008年又被定为公共假日。","en":"In 2006, the Mid-Autumn Festival was listed as a form of China's cultural heritage, and in 2008 it was designated as a public holiday.","set":"CET6 2013·12·S3","cls":"B","ch":7}],"书写系统":[{"cn":"目前仍在使用的书写系统中，汉语是最古老的。","en":"Of the writing systems still in use today, Chinese is the oldest.","set":"CET6 2019·06·S2","cls":"B","ch":2}],"成语":[{"cn":"成语(Chinese idioms)是汉语中的一种独特的表达方式，大多由四个汉字组成。","en":"Chinese idioms are a unique form of expression in the Chinese language, most of which consist of four characters.","set":"CET6 2019·06·S3","cls":"C","ch":2},{"cn":"它们高度简练且形式固定，但通常能形象地表达深刻的含义。","en":"They are highly concise and fixed in form, yet they can usually express profound meanings in a vivid way.","set":"CET6 2019·06·S3","cls":"C","ch":2},{"cn":"成语大多来源于中国古代的文学作品，通常与某些神话、传说或者历史事件有关。","en":"Most Chinese idioms come from ancient Chinese literature and are usually related to certain myths, legends or historical events.","set":"CET6 2019·06·S3","cls":"A","ch":2},{"cn":"如果不知道某个成语的出处，就很难理解其确切含义。","en":"If one does not know the origin of an idiom, it is hard to understand its exact meaning.","set":"CET6 2019·06·S3","cls":"C","ch":2},{"cn":"因此，学习成语有助于人们更好地理解中国传统文化。","en":"Therefore, learning Chinese idioms helps people better understand traditional Chinese culture.","set":"CET6 2019·06·S3","cls":"B","ch":2},{"cn":"成语在日常会话和文学创作中广泛使用。","en":"Chinese idioms are widely used in everyday conversation and literary creation.","set":"CET6 2019·06·S3","cls":"C","ch":2},{"cn":"恰当使用成语可以使一个人的语言更具表现力，交流更有效。","en":"Using idioms appropriately can make one's language more expressive and one's communication more effective.","set":"CET6 2019·06·S3","cls":"C","ch":2}],"神话":[{"cn":"成语大多来源于中国古代的文学作品，通常与某些神话、传说或者历史事件有关。","en":"Most Chinese idioms come from ancient Chinese literature and are usually related to certain myths, legends or historical events.","set":"CET6 2019·06·S3","cls":"A","ch":2},{"cn":"虽然故事的主题基于佛教，但这部小说采用了大量中国民间故事和神话的素材，创造了各种栩栩如生的人物和动物形象。","en":"Although the theme of the story is based on Buddhism, the novel draws heavily on Chinese folk tales and myths, creating a variety of lifelike human and animal characters.","set":"CET6 2020·09·S3","cls":"C","ch":2}],"中国传统文化":[{"cn":"因此，学习成语有助于人们更好地理解中国传统文化。","en":"Therefore, learning Chinese idioms helps people better understand traditional Chinese culture.","set":"CET6 2019·06·S3","cls":"B","ch":2},{"cn":"自面世以来,这部小说不断吸引着一代又一代的读者,并且对中国文化产生了广泛而持久的影响。","en":"Since its publication, the novel has continued to attract generation after generation of readers and has exerted a broad and lasting influence on Chinese culture.","set":"CET6 2020·07·S1","cls":"D","ch":2},{"cn":"它已逐渐演变成了中国文化的独特元素。","en":"It has gradually evolved into a unique element of Chinese culture.","set":"CET4 2016·06·S1","cls":"D","ch":6},{"cn":"鱼的象征意义据说源于中国传统文化。","en":"The symbolic meaning of fish is
