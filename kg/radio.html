个渔村怎么就变成了一座国际大都市？", "words": [{"zh": "改革开放", "en": "reform and opening up", "note": "up 是副词，不能省"}, {"zh": "生活水平", "en": "living standards", "note": "standard 要复数"}, {"zh": "可持续发展", "en": "sustainable development", "note": "撑得住，才叫可持续"}, {"zh": "生态环境", "en": "ecological environment", "note": "必加 ecological"}, {"zh": "丝绸之路", "en": "the Silk Road", "note": "是一张网，不是一条路"}, {"zh": "经济特区", "en": "special economic zone", "note": "zone 是划出来试的"}], "total": 423.5, "segs": [{"i": 0, "role": "A", "text": "这里是《中国文化概况》词汇电台，第十一期：经济。", "start": 0.0, "dur": 5.4}, {"i": 1, "role": "B", "text": "我是老周。", "start": 5.68, "dur": 1.92}, {"i": 2, "role": "A", "text": "我是小夏。今天六个词，新闻里天天见，但你可能一个都译不准。", "start": 7.88, "dur": 6.86}, {"i": 3, "role": "B", "text": "而且这六个词是连着的：一个决定，改变了生活，也改变了山水。开场先问一句：四十多年前，一个渔村，怎么就变成了一座国际大都市？", "start": 15.02, "dur": 7.68}, {"i": 4, "role": "A", "text": "悬念留到最后。第一个词，也是分量最重的一个：改革开放。", "start": 22.98, "dur": 6.62}, {"i": 5, "role": "B", "text": "改革开放，英文不是 open the door，是 reform and opening up。四十年，一个国家的转向，就压在这几个词上。", "start": 29.89, "dur": 10.06}, {"i": 6, "role": "A", "text": "拆开看：reform 改革，opening up 开放。up 是副词，不能省。这是定译，写作和翻译都照这个来。", "start": 40.22, "dur": 10.66}, {"i": 7, "role": "B", "text": "起点是一九七八年，十一届三中全会。课本原句。", "start": 51.16, "dur": 6.07}, {"i": 8, "role": "E", "text": "In 1978, the Third Plenary Session of the 11th CPC Central Committee marked a pivotal moment in China's history, as the country began to embrace reform and opening up.", "start": 57.51, "dur": 12.29}, {"i": 9, "role": "A", "text": "三个硬词：plenary session 全会，pivotal 关键的，embrace 拥抱、开始接受。pivotal 换成 crucial 也得分。", "start": 70.25, "dur": 1.92}, {"i": 10, "role": "B", "text": "再记两个搭配：reform and opening-up policy，改革开放政策；the early period of reform and opening up，改革开放初期。课本两个都用过。", "start": 72.45, "dur": 6.36}, {"i": 11, "role": "A", "text": "第二个词，生活水平，living standards。standard 要用复数，因为它是一整套：收入、住房、医疗、教育。", "start": 79.09, "dur": 10.99}, {"i": 12, "role": "B", "text": "这个词背后有个转折。改革初期目标是增长，后来目标变成生活质量，quality of life。", "start": 90.36, "dur": 8.81}, {"i": 13, "role": "A", "text": "quality of life 和 living standards 差不多能换，但后者更偏物质，前者更偏感受。", "start": 99.45, "dur": 8.04}, {"i": 14, "role": "B", "text": "课本原句。", "start": 107.77, "dur": 2.02}, {"i": 15, "role": "E", "text": "It also created millions of jobs, improved living standards, and supported social stability.", "start": 110.07, "dur": 6.91}, {"i": 16, "role": "A", "text": "一句话三个结果：创造就业、提高生活水平、支撑社会稳定。social stability，社会稳定，作文里很好用。", "start": 117.43, "dur": 11.11}, {"i": 17, "role": "B", "text": "第三个词，可持续发展，sustainable development。sustain 是撑住，sustainable 就是能撑下去的。", "start": 128.82, "dur": 8.83}, {"i": 18, "role": "A", "text": "关键词在时间：不牺牲下一代，来满足这一代。中文四个字，英文两个词，一一对得上。", "start": 137.93, "dur": 9.19}, {"i": 19, "role": "B", "text": "课本原句，还顺带送了我们另一个高频词。", "start": 147.4, "dur": 4.1}, {"i": 20, "role": "E", "text": "By 2012, China had entered a new phase of development, prioritising high-quality development and sustainable development.", "start": 151.79, "dur": 8.76}, {"i": 21, "role": "A", "text": "had entered 用过去完成时，因为句子站在二〇一二年往回看；prioritise 优先考虑。high-quality development 高质量发展，连字符不能丢。", "start": 161.0, "dur": 13.63}, {"i": 22, "role": "B", "text": "第四个词，生态环境，ecological environment。不能只说 environment，前面必须加 ecological。", "start": 174.91, "dur": 9.46}, {"i": 23, "role": "A", "text": "ecology 生态学，ecological 生态的。生态文明就是 ecological civilisation，同一个形容词。", "start": 184.65, "dur": 9.6}, {"i": 24, "role": "B", "text": "这一节还有一串词可以打包记：biodiversity 生物多样性、environmental protection 环境保护、ecological restoration 生态修复。", "start": 194.53, "dur": 1.68}, {"i": 25, "role": "A", "text": "课本原句。", "start": 196.49, "dur": 1.7}, {"i": 26, "role": "E", "text": "A healthy ecological environment is the foundation for a better life and a shared aspiration of humanity.", "start": 198.47, "dur": 7.01}, {"i": 27, "role": "B", "text": "foundation for 是什么的基础，shared aspiration of humanity 人类共同的愿望。这句可以当作文开头，句式很稳。", "start": 205.93, "dur": 9.89}, {"i": 28, "role": "A", "text": "第五个词，丝绸之路，the Silk Road。定冠词 the 不能省，Road 首字母大写。", "start": 216.1, "dur": 7.66}, {"i": 29, "role": "B", "text": "这个词其实是个外来名字。一八七七年，德国地理学家李希霍芬把它命名为 Seidenstraße，英文 the Silk Road 是后来的直译。", "start": 224.03, "dur": 2.16}, {"i": 30, "role": "A", "text": "路是汉朝走出来的，名字是十九世纪欧洲人起的。谁命名，谁就定了世界怎么叫它。", "start": 226.47, "dur": 2.52}, {"i": 31, "role": "B", "text": "这条路今天还活着。二〇一三年提出的一带一路，英文 the Belt and Road Initiative，接的就是这个名字。", "start": 229.27, "dur": 9.29}, {"i": 32, "role": "E", "text": "Established during the Han Dynasty, the ancient Silk Road was a vast network of trade routes that connected China to regions across Asia, Europe, and Africa.", "start": 238.84, "dur": 10.46}, {"i": 33, "role": "A", "text": "记住 network of trade routes，贸易路线的网络。它不是一条路，是一张网，这是最容易译错的地方。", "start": 249.75, "dur": 9.29}, {"i": 34, "role": "B", "text": "最后一个词，经济特区，special economic zone，缩写 SEZ。", "start": 259.32, "dur": 3.36}, {"i": 35, "role": "A", "text": "为什么用 zone 不用 area？zone 是划定的功能区。特区是划出来做试验的，一个词就见用意。", "start": 262.96, "dur": 4.2}, {"i": 36, "role": "B", "text": "课本原句。", "start": 267.44, "dur": 2.02}, {"i": 37, "role": "E", "text": "The establishment of Special Economic Zones in cities like Shenzhen and Zhuhai embodied a pragmatic approach to foreign economic engagement, with flexibility and experimentation at the core.", "start": 269.74, "dur": 12.34}, {"i": 38, "role": "A", "text": "embody 体现，pragmatic 务实的，experimentation 试验。深圳的角色，课本用的词是试验，不是成功。", "start": 282.52, "dur": 10.25}, {"i": 39, "role": "B", "text": "再补一个词：a testing ground，试验田。写深圳，用这个词比用 example 地道得多。", "start": 293.05, "dur": 7.61}, {"i": 40, "role": "A", "text": "快问快答。三个词，老周你答英文。", "start": 300.94, "dur": 4.51}, {"i": 41, "role": "B", "text": "来。", "start": 305.73, "dur": 1.58}, {"i": 42, "role": "A", "text": "改革开放。", "start": 307.6, "dur": 1.7}, {"i": 43, "role": "B", "text": "reform and opening up。", "start": 309.58, "dur": 2.62}, {"i": 44, "role": "A", "text": "生活水平。", "start": 312.48, "dur": 1.85}, {"i": 45, "role": "B", "text": "living standards。", "start": 314.6, "dur": 2.11}, {"i": 46, "role": "A", "text": "可持续发展。", "start": 317.0, "dur": 1.99}, {"i": 47, "role": "B", "text": "sustainable development。", "start": 319.27, "dur": 2.66}, {"i": 48, "role": "A", "text": "最后一个环节：这些词在真题里怎么考。", "start": 322.21, "dur": 4.32}, {"i": 49, "role": "B", "text": "二〇一三年十二月六级：丝绸之路延伸六千多公里，得名于古代中国的丝绸贸易。", "start": 326.81, "dur": 7.66}, {"i": 50, "role": "A", "text": "关键在得名于，英文用 so named because of，两个词解决因果，比 is named after 更准。", "start": 334.75, "dur": 2.64}, {"i": 51, "role": "B", "text": "二〇一六年六月六级考深圳：在改革开放之前，深圳不过是一个渔村，仅有三万多人。", "start": 337.67, "dur": 8.35}, {"i": 52, "role": "A", "text": "no more than 不过、只是；三万多用 just over，那个多要用 over，不能用 more。", "start": 346.3, "dur": 7.25}, {"i": 53, "role": "B", "text": "两道题并起来看有个规律：真题最爱考转折，之前怎么样、之后怎么样。数字加对比，就是采分点。", "start": 353.83, "dur": 10.61}, {"i": 54, "role": "A", "text": "今天六个词：改革开放 reform and opening up、生活水平 living standards、可持续发展 sustainable development、生态环境 ecological environment、丝绸之路 the Silk Road、经济特区 special economic zone。", "start": 364.72, "dur": 18.65}, {"i": 55, "role": "B", "text": "回到开场：渔村怎么变成了大都市？", "start": 383.64, "dur": 3.91}, {"i": 56, "role": "A", "text": "因为一九八〇年，它被划成了一个特区。给政策，不给答案，让人自己去试。", "start": 387.84, "dur": 7.82}, {"i": 57, "role": "B", "text": "中国经济的四十多年，说到底一句话：先划一小块地方，试给世界看。", "start": 395.94, "dur": 6.65}, {"i": 58, "role": "A", "text": "这一期的六个词，其实是一条线：从一九七八年的一个决定，到今天的绿水青山。", "start": 402.87, "dur": 7.7}, {"i": 59, "role": "B", "text": "下一期，现代生活。今天的中国人放假在干什么，答案可能出乎你意料。", "start": 410.85, "dur": 7.46}, {"i": 60, "role": "A", "text": "这里是词汇电台，我们下期见。", "start": 418.6, "dur": 3.43}]}, "12": {"ch": 12, "title": "现代生活", "en": "Modern Life", "episode": 12, "hook": "长假一到，为什么中国人宁愿去走路，也不去逛商场？", "words": [{"zh": "国庆节", "en": "National Day", "note": "配 holiday 用"}, {"zh": "故宫", "en": "the Palace Museum", "note": "城 Forbidden 馆 Museum"}, {"zh": "文化遗产", "en": "cultural heritage", "note": "heritage 不可数"}, {"zh": "移动互联网", "en": "the mobile Internet", "note": "Internet 大写"}, {"zh": "城市漫步", "en": "city walks", "note": "英语回流的词"}, {"zh": "大雁塔", "en": "Big Wild Goose Pagoda", "note": "塔说 pagoda"}], "total": 453.0, "segs": [{"i": 0, "role": "A", "text": "这里是《中国文化概况》词汇电台，第十二期：现代生活。", "start": 0.0, "dur": 5.88}, {"i": 1, "role": "B", "text": "我是老周。", "start": 6.16, "dur": 1.92}, {"i": 2, "role": "A", "text": "我是小夏。今天六个词，讲的是中国人今天怎么过节、怎么逛、怎么买东西。", "start": 8.36, "dur": 8.06}, {"i": 3, "role": "B", "text": "六个词里，一半是老东西，一半是新玩法，正好是今天的中国。", "start": 16.7, "dur": 6.43}, {"i": 4, "role": "A", "text": "开场先问一个：长假一到，为什么中国人宁愿去走路，也不去逛商场？", "start": 23.42, "dur": 6.94}, {"i": 5, "role": "B", "text": "悬念留到最后。先从一个所有人都会放假的节日说起，国庆节。", "start": 30.63, "dur": 6.48}, {"i": 6, "role": "A", "text": "国庆节，National Day，十月一日。National 和 Day 都大写，中间不加 of，也不写成 National Festival。", "start": 37.39, "dur": 9.94}, {"i": 7, "role": "B", "text": "记住固定搭配：the National Day holiday，国庆假期，也叫黄金周，golden week。定译就是这个。", "start": 47.61, "dur": 8.78}, {"i": 8, "role": "A", "text": "这个节日最直观的变化，是它变成了一个旅游节。真题里有一句写得很清楚。", "start": 56.67, "dur": 7.58}, {"i": 9, "role": "E", "text": "During the 2016 National Day holiday, tourism spending totaled more than 400 billion yuan.", "start": 64.54, "dur": 2.04}, {"i": 10, "role": "B", "text": "tourism spending 旅游消费，total 作动词是总计，billion 是十亿。数字读法要单独练，四千亿说 more than 400 billion。", "start": 67.03, "dur": 3.36}, {"i": 11, "role": "A", "text": "第二个词，故宫。这个词有个陷阱：它有两个英文名。", "start": 70.67, "dur": 5.74}, {"i": 12, "role": "B", "text": "the Forbidden City 是紫禁城，说的是这座城；the Palace Museum 是故宫博物院，说的是这座博物馆。考试给故宫，一般写 the Palace Museum。", "start": 76.68, "dur": 11.98}, {"i": 13, "role": "A", "text": "forbidden 被禁止的，因为当年平民进不去。这名字里藏着一道门禁。而最近几年，它把整座宫搬上了网。", "start": 88.94, "dur": 10.9}, {"i": 14, "role": "E", "text": "These tools enable the public to visit the Palace Museum and explore its collections without leaving home.", "start": 100.11, "dur": 6.84}, {"i": 15, "role": "B", "text": "enable somebody to do 使某人能够，collections 藏品，without leaving home 足不出户。这句话本身就是数字故宫的说明书。", "start": 107.4, "dur": 10.37}, {"i": 16, "role": "A", "text": "第三个词，文化遗产，cultural heritage。heritage 是不可数名词，不加 s。", "start": 118.05, "dur": 7.99}, {"i": 17, "role": "B", "text": "常和它一起出现的是 intangible cultural heritage，非物质文化遗产。加一个词，范围就从房子变成手艺、戏曲、节庆。", "start": 126.32, "dur": 11.64}, {"i": 18, "role": "A", "text": "课本把这两件事做成了两套公园：国家文化公园，national cultural parks；国家考古遗址公园，national archaeological site parks。", "start": 138.24, "dur": 11.98}, {"i": 19, "role": "B", "text": "课本讲国家文化公园，用的就是这个词。原句。", "start": 150.5, "dur": 5.59}, {"i": 20, "role": "E", "text": "These parks are not only treasure troves of China's cultural heritage but also vital windows showcasing the country's civilisation and culture to the world.", "start": 156.37, "dur": 10.18}, {"i": 21, "role": "A", "text": "treasure trove 宝库，vital windows 重要窗口，showcasing 展示。not only 加 but also，把保存和展示连在一起，句子立刻就稳了。", "start": 167.0, "dur": 11.88}, {"i": 22, "role": "B", "text": "第四个词，移动互联网，the mobile Internet。Internet 首字母大写，前面加 the。", "start": 179.16, "dur": 7.85}, {"i": 23, "role": "A", "text": "mobile 是移动的，不是手机；手机是 mobile phone。但 mobile Internet 就是手机上网，别译成 moving internet。", "start": 187.29, "dur": 9.94}, {"i": 24, "role": "B", "text": "课本原句，也是真题原句，两边一字不差。", "start": 197.5, "dur": 5.11}, {"i": 25, "role": "E", "text": "With the advent of the mobile Internet, mobile shopping has gradually become a trend.", "start": 202.89, "dur": 5.83}, {"i": 26, "role": "A", "text": "with the advent of 随着什么的出现，advent 到来；trend 趋势。一个介词短语顶中文一整句，这是英语省力的地方。", "start": 209.18, "dur": 11.21}, {"i": 27, "role": "B", "text": "第五个词，城市漫步，city walks。这个词有意思，它是英语 city walk 进了中文，又被翻回英语。", "start": 220.66, "dur": 9.53}, {"i": 28, "role": "A", "text": "所以要分单复数：city walk 指一种玩法，city walks 指一次次具体的漫步。课本用的是复数。", "start": 230.47, "dur": 9.41}, {"i": 29, "role": "B", "text": "一个词绕地球走了一圈。语言的旅行，有时候比人还快。", "start": 240.16, "dur": 5.76}, {"i": 30, "role": "A", "text": "顺便说一句，city walk 在英语里本来是散步，到中文变成一种玩法，再回英语，就带上了中国城市的味道。", "start": 246.2, "dur": 10.39}, {"i": 31, "role": "E", "text": "Outdoor activities, such as visiting parks and city walks, have become some of the most popular leisure choices, largely because they are low-cost and relaxing.", "start": 256.87, "dur": 10.37}, {"i": 32, "role": "B", "text": "leisure choices 休闲选择，low-cost 低成本，relaxing 让人放松。花的钱少了，体验反而变重了，这是这几年最大的变化。", "start": 267.69, "dur": 11.59}, {"i": 33, "role": "A", "text": "最后一个词，大雁塔，Big Wild Goose Pagoda。这个名字本身就是一道翻译题。", "start": 279.56, "dur": 7.66}, {"i": 34, "role": "B", "text": "大雁是 wild goose，复数是 wild geese；塔是 pagoda，不叫 tower。pagoda 是专门为这种多层带檐的东方塔造出来的词。", "start": 287.5, "dur": 11.38}, {"i": 35, "role": "A", "text": "唐代玄奘从印度取经回来，在长安修塔藏经。一座塔，装着一个走了十七年的人。", "start": 299.15, "dur": 8.33}, {"i": 36, "role": "E", "text": "The city also contains numerous other historic monuments, including the Great Mosque (大清真寺), the Big Wild Goose Pagoda (大雁塔), the Small Wild Goose Pagoda (小雁塔), and the Bell and Drum Towers.", "start": 307.76, "dur": 11.64}, {"i": 37, "role": "B", "text": "monuments 古迹，including 后面并列。小雁塔是 Small Wild Goose Pagoda，只差一个词，别写反。", "start": 319.85, "dur": 8.88}, {"i": 38, "role": "A", "text": "快问快答。三个词，老周你答英文。", "start": 329.01, "dur": 4.51}, {"i": 39, "role": "B", "text": "来。", "start": 333.8, "dur": 1.58}, {"i": 40, "role": "A", "text": "文化遗产。", "start": 335.67, "dur": 1.75}, {"i": 41, "role": "B", "text": "cultural heritage。", "start": 337.7, "dur": 2.42}, {"i": 42, "role": "A", "text": "移动互联网。", "start": 340.4, "dur": 1.85}, {"i": 43, "role": "B", "text": "the mobile Internet。", "start": 342.53, "dur": 2.26}, {"i": 44, "role": "A", "text": "故宫，我要博物院那个名字。", "start": 345.07, "dur": 2.95}, {"i": 45, "role": "B", "text": "the Palace Museum。", "start": 348.3, "dur": 2.33}, {"i": 46, "role": "A", "text": "最后一个环节：这些词在真题里怎么出现。", "start": 350.91, "dur": 4.58}, {"i": 47, "role": "B", "text": "二〇一八年十二月四级：随着移动互联网的出现，手机购物逐渐成为一种趋势。", "start": 355.77, "dur": 7.01}, {"i": 48, "role": "A", "text": "with the advent of 是万能开头。写作里把它换掉 with the development of，立刻高一档。", "start": 363.06, "dur": 8.33}, {"i": 49, "role": "B", "text": "二〇一六年十二月六级考国庆：二〇一六年国庆节假日期间，旅游消费总计超过四千亿元。", "start": 371.67, "dur": 8.47}, {"i": 50, "role": "A", "text": "注意两个词：期间用 during，总计超过用 totaled more than，一个动词同时解决总计和超过。", "start": 380.42, "dur": 8.62}, {"i": 51, "role": "B", "text": "二〇二二年九月六级还考过一座塔楼：参观者还可以看到故宫和北京其他地方的壮观景色。故宫在那里译成 the Palace Museum，两个名字选它，没错。", "start": 389.32, "dur": 13.9}, {"i": 52, "role": "A", "text": "今天六个词：国庆节 National Day、故宫 the Palace Museum、文化遗产 cultural heritage、移动互联网 the mobile Internet、城市漫步 city walks、大雁塔 Big Wild Goose Pagoda。", "start": 403.49, "dur": 15.43}, {"i": 53, "role": "B", "text": "回到开场的问题：为什么中国人放假宁愿走路，也不逛商场？", "start": 419.2, "dur": 6.6}, {"i": 54, "role": "A", "text": "因为消费变成了体验。课文说，休闲娱乐已经成为中国人日常生活必不可少的一部分。", "start": 426.08, "dur": 8.95}, {"i": 55, "role": "B", "text": "走进城市，走进博物馆，走进一条老街。现代生活的关键词，不是买，是经历。", "start": 435.32, "dur": 8.28}, {"i": 56, "role": "A", "text": "建筑、经济、现代生活，三期讲完了。这里是词汇电台，我们下次见。", "start": 443.88, "dur": 7.87}]}}, VOC={"0": {"ch": 0, "voice": "en-US-AriaNeural", "rate": "-10%", "gap": 1.2, "count": 43, "total": 159.6, "words": [{"i": 0, "zh": "汉朝", "en": "Han Dynasty", "start": 0.0, "dur": 2.21}, {"i": 1, "zh": "城市化", "en": "urbanization", "start": 3.41, "dur": 2.21}, {"i": 2, "zh": "灭亡", "en": "Destruction", "start": 6.82, "dur": 2.02}, {"i": 3, "zh": "人口", "en": "population", "start": 10.03, "dur": 2.09}, {"i": 4, "zh": "少数民族", "en": "ethnic minority group", "start": 13.32, "dur": 2.64}, {"i": 5, "zh": "水资源", "en": "water resources", "start": 17.16, "dur": 2.47}, {"i": 6, "zh": "一国两制", "en": "One Country, Two Systems", "start": 20.83, "dur": 3.17}, {"i": 7, "zh": "习近平新时代中国特色社会主义思想", "en": "Xi Jinping Thought on Socialism with Chinese Characteristics for a New Era", "start": 25.2, "dur": 5.86}, {"i": 8, "zh": "和平统一、一国两制", "en": "peaceful reunification and One Country, Two Systems", "start": 32.26, "dur": 4.78}, {"i": 9, "zh": "东周", "en": "Eastern Zhou const fmt=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

function openEp(ch){
  if(!DATA[ch]) return;
  cur=ch; mode='radio'; SEGS=DATA[ch].segs; VOCW=(VOC[ch]||{}).words||[]; actx=-1;
  au.src='radio/ch'+ch+'.mp3'; au.load(); disc.classList.remove('playing');
  document.getElementById('discNo').textContent=ch===0?'总':ch;
  document.getElementById('discEn').textContent=(IDX.find(x=>x.ch===ch).en||'').toUpperCase().slice(0,14);
  ttl.textContent=DATA[ch].title;
  sub.textContent=`词汇电台 · 第 ${DATA[ch].episode} 期 · ${DATA[ch].words.length} 个词 · ${fmt(DATA[ch].total)}`;
  modeEl.textContent='电台模式'; modeEl.classList.remove('v');
  document.getElementById('chSel').value=ch;
  buildVoc(); buildLyr(); buildPl();
}
function switchToVocab(){
  if(!VOCW.length){ppIcon.innerHTML='<path d="M8 5v14l11-7z"/>';return;}
  mode='vocab'; actx=-1;
  au.src='radio/ch'+cur+'_vocab.mp3'; au.load();
  ttl.textContent=DATA[cur].title+' · 跟读';
  sub.textContent=`跟读模式 · ${VOC[cur].count} 词 · ${fmt(VOC[cur].total)} · 听到读音后跟读一遍`;
  modeEl.textContent='跟读模式'; modeEl.classList.add('v');
  buildLyr(); const p=au.play(); if(p&&p.catch)p.catch(()=>{});
}

function buildVoc(){
  const words = VOCW.length ? VOCW : (DATA[cur]?DATA[cur].words:[]);
  document.getElementById('lyrTitle').textContent = '词汇表';
  lyrBody.innerHTML = words.map((w,i)=>`<div class="ly voc wv" data-i="${i}" data-t="${w.start!=null?w.start:''}">
      <span class="no">${i+1}</span><span class="zh">${w.zh}</span><span class="en">${w.en||''}</span></div>`).join('');
  document.getElementById('miniLyr').classList.add('voctab');
  lyrBody.classList.add('vlist');
  actx=-1;
}
function buildLyr(){
  if(mode==='radio'){
    document.getElementById('miniLyr').classList.remove('voctab');
    lyrBody.classList.remove('vlist');
    document.getElementById('lyrTitle').textContent='文字稿';
    lyrBody.innerHTML=SEGS.map((s,i)=>`<div class="ly ${s.role==='E'?'E':''}" data-i="${i}" data-t="${s.start}">
      <span class="who">${s.role==='E'?'英文原声':(s.role==='A'?'小夏':'老周')}</span>${s.text}</div>`).join('');
    actx=-1;
  }else{ buildVoc(); }
}
let wordStop=null;
/* ── 词汇连播：每词 repW 遍 × 全表 repT 遍 ── */
let repW=1, repT=1, chainOn=false, ci=0, cRep=0, cRound=1;
function endOfWord(i){ return (i+1<VOCW.length && VOCW[i+1].start!=null) ? VOCW[i+1].start : (au.duration||0); }
function vocPlain(k){ if(!VOCW.length) return 0; return (k+1<VOCW.length?VOCW[k+1].start:au.duration) - VOCW[k].start; }
function chainBtn(){
  const b=document.getElementById('miniChain');
  if(chainOn){ b.classList.add('stop'); b.innerHTML='<svg viewBox="0 0 24 24" style="width:11px;height:11px;fill:currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>停止'; }
  else { b.classList.remove('stop'); b.innerHTML='<svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:currentColor"><path d="M8 5v14l11-7z"/></svg>连播'; }
  b.dataset.on = chainOn?'1':'0';
}
function seekWord(i){
  const go=()=>{ try{au.currentTime=VOCW[i].start;}catch(_){}
    const p=au.play(); if(p&&p.catch)p.catch(()=>{});
    const el=lyrBody.querySelector(`.ly[data-i="${i}"]`);
    if(el){ const old=lyrBody.querySelector('.ly.on'); if(old) old.classList.remove('on');
      el.classList.add('on'); el.scrollIntoView({block:'center',behavior:'smooth'}); } };
  if(au.src.indexOf('_vocab')<0){ au.src='radio/ch'+cur+'_vocab.mp3'; au.load(); au.addEventListener('loadedmetadata',go,{once:true}); }
  else if(au.readyState>=1) go(); else { au.addEventListener('loadedmetadata',go,{once:true}); au.load(); }
}
function chainStart(){
  if(!VOCW.length){ toast('该章暂无跟读音轨'); return; }
  chainOn=true; ci=0; cRep=0; cRound=1; chainBtn(); seekWord(0);
}
function chainStop(){ chainOn=false; chainBtn(); }
function chainTick(){
  if(!chainOn || mode!=='vocab' || au.paused) return;
  const i=ci, end=endOfWord(i);
  if(end<=0 || au.currentTime < end-0.22) return;
  cRep++;
  if(cRep < repW){ try{au.currentTime=VOCW[i].start;}catch(_){} const p=au.play(); if(p&&p.catch)p.catch(()=>{}); }
  else {
    cRep=0;
    if(i+1 < VOCW.length){ ci=i+1; seekWord(ci); }
    else if(cRound < repT){ cRound++; ci=0; seekWord(0); }
    else { chainStop(); au.pause(); toast('连播结束'); }
  }
}
document.getElementById('miniChain').onclick=()=>{ if(chainOn){ chainStop(); au.pause(); } else { enterVocab(false); chainStart(); } };
document.getElementById('repW').onclick=()=>{ repW = repW%3+1; document.getElementById('repW').textContent='每词'+repW+'×'; };
document.getElementById('repT').onclick=()=>{ const seq=[1,2,3,999]; const i=seq.indexOf(repT); repT=seq[(i+1)%4];
  document.getElementById('repT').textContent='全表'+(repT>=999?'∞':repT+'×'); };
function playWordAt(t,d){
  if(wordStop){clearTimeout(wordStop);wordStop=null;}
  const go=()=>{ try{au.currentTime=t;}catch(_){}
    const p=au.play(); if(p&&p.catch)p.catch(()=>{});
    if(d) wordStop=setTimeout(()=>{au.pause();},Math.max(600,d*1000+250)); };
  if(au.src.indexOf('_vocab')<0){ au.src='radio/ch'+cur+'_vocab.mp3'; au.load();
    au.addEventListener('loadedmetadata',go,{once:true}); }
  else if(au.readyState>=1) go();
  else { au.addEventListener('loadedmetadata',go,{once:true}); au.load(); }
}
lyrBody.addEventListener('click',e=>{
  const wv=e.target.closest('.wv');
  if(wv){
    const i=+wv.dataset.i, w=VOCW[i];
    if(chainOn){ chainStop(); }
    if(VOCW.length && w && w.start!=null){ playWordAt(w.start,w.dur); }
    else { toast('该词暂无独立发音'); }
    return;
  }
  const el=e.target.closest('.ly'); if(!el) return;
  const t=parseFloat(el.dataset.t);
  const go=()=>{try{au.currentTime=t;}catch(_){}; const p=au.play(); if(p&&p.catch)p.catch(()=>{});};
  if(au.readyState>=1) go(); else {au.addEventListener('loadedmetadata',go,{once:true});au.load();}
});
function toast(msg){
  let t=document.getElementById('tst');
  if(!t){t=document.createElement('div');t.id='tst';
    t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;font-size:12.5px;padding:7px 15px;border-radius:18px;z-index:99;opacity:0;transition:.25s;pointer-events:none';
    document.body.appendChild(t);}
  t.textContent=msg; t.style.opacity=1;
  clearTimeout(t._h); t._h=setTimeout(()=>{t.style.opacity=0;},1600);
}

function buildPl(){
  plBody.innerHTML=IDX.map((e,i)=>`<div class="row ${e.ready?'':'off'} ${e.ch===cur?'on':''}" data-ch="${e.ch}">

  openEp(+row.dataset.ch); closeSheets();
});
/* ── 进度与高亮 ── */
au.onloadedmetadata=()=>{t2.textContent=fmt(au.duration)};
au.onplay=()=>{ppIcon.innerHTML='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';disc.classList.add('playing');};
au.onpause=()=>{ppIcon.innerHTML='<path d="M8 5v14l11-7z"/>';disc.classList.remove('playing');};
au.onended=()=>{
  if(mode==='radio'){ switchToVocab(); }
  else { disc.classList.remove('playing'); ppIcon.innerHTML='<path d="M8 5v14l11-7z"/>'; modeEl.textContent='跟读完成'; }
};
au.ontimeupdate=()=>{
  const d=au.duration||0,t=au.currentTime;
  seek.value=d?Math.round(t/d*1000):0; t1.textContent=fmt(t); t2.textContent=fmt(d);
  const arr=mode==='radio'?SEGS:VOCW;
  let idx=0; for(let i=0;i<arr.length;i++){ if(arr[i].start<=t+.05) idx=i; else break; }
  if(idx!==actx){
    actx=idx;
    const old=lyrBody.querySelector('.ly.on'); if(old) old.classList.remove('on');
    const el=lyrBody.querySelector(`.ly[data-i="${idx}"]`);
    if(el){ el.classList.add('on');
      const r=el.getBoundingClientRect(), br=el.parentElement.parentElement.getBoundingClientRect();
      if(r.top<br.top+60||r.bottom>br.bottom-100) el.scrollIntoView({block:'center',behavior:'smooth'});
      // 迷你条
      document.getElementById('miniT1').textContent=(mode==='radio'?el.innerText.split('\n').pop():el.innerText.replace(/\n/g,' · '));
      document.getElementById('miniT2').textContent=document.getElementById('miniT1').textContent;
    }
  }
  const mt=document.getElementById('miniTime'); if(mt) mt.textContent=fmt(t)+' / '+fmt(d);
  const pct=d?(t/d*100):0;
  document.getElementById('miniBar').style.width=pct+'%';
  document.getElementById('miniBar2').style.width=pct+'%';
  if(typeof chainTick==='function') chainTick();
};
seek.oninput=e=>{ if(typeof chainOn!=='undefined'&&chainOn) chainStop(); if(au.duration) au.currentTime=e.target.value/1000*au.duration; };
/* ── 交互 ── */
pp.onclick=()=>{ if(au.paused){const p=au.play();if(p&&p.catch)p.catch(()=>{});} else au.pause(); };
document.getElementById('miniPP').onclick=()=>pp.onclick();
document.getElementById('miniPP2').onclick=()=>pp.onclick();
document.getElementById('loop').onclick=e=>{loop=!loop;e.currentTarget.classList.toggle('on',loop);au.loop=loop;};
document.getElementById('prev').onclick=()=>{const i=CHS.findIndex(x=>x.ch===cur);if(i>0)openEp(CHS[i-1].ch);};
document.getElementById('next').onclick=()=>{const i=CHS.findIndex(x=>x.ch===cur);if(i<CHS.length-1)openEp(CHS[i+1].ch);};
const sp=document.getElementById('speed'),rates=[1,.85,1.15,1.3];let ri=0;
sp.onclick=()=>{ri=(ri+1)%rates.length;sp.textContent=rates[ri]+'×';au.playbackRate=rates[ri];};
/* 层开关 */
function openSheet(el){el.classList.add('on');document.body.style.overflow='hidden';}
function closeSheets(){sheetLyr.classList.remove('on');sheetPl.classList.remove('on');}
function enterVocab(ap){
  if(!VOCW.length){ toast('该章暂无跟读音轨'); return; }
  if(mode!=='vocab'){
    mode='vocab'; actx=-1;
    au.src='radio/ch'+cur+'_vocab.mp3'; au.load();
    ttl.textContent=DATA[cur].title+' · 跟读';
    sub.textContent=`跟读模式 · ${VOC[cur].count} 词 · ${fmt(VOC[cur].total)} · 可逐词点读或连播`;
    modeEl.textContent='跟读模式'; modeEl.classList.add('v');
    buildVoc();
    if(ap){ const p=au.play(); if(p&&p.catch)p.catch(()=>{}); }
  }
}
document.getElementById('nLyr').onclick=()=>{
  if(mode==='vocab'){ chainStop(); mode='radio'; actx=-1;
    au.src='radio/ch'+cur+'.mp3'; au.load(); au.pause();
    ttl.textContent=DATA[cur].title;
    sub.textContent=`词汇电台 · 第 ${DATA[cur].episode} 期 · ${DATA[cur].words.length} 个词 · ${fmt(DATA[cur].total)}`;
    modeEl.textContent='电台模式'; modeEl.classList.remove('v'); }
  buildLyr(); openSheet(sheetLyr);};
document.getElementById('nVoc').onclick=()=>{ enterVocab(false); buildVoc(); openSheet(sheetLyr); };
document.getElementById('nPl').onclick=()=>{buildPl();openSheet(sheetPl);};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheets();});
/* 启动 */
const m=(location.hash||'').match(/ch(\d+)/);
openEp(m&&DATA[m[1]]?+m[1]:(CHS[0]?CHS[0].ch:1));
</script></body></html>
