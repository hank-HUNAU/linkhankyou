<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>词汇电台 · 中国文化课程在线学习</title>
<style>
:root{--bg:#f3efe7;--card:#fffdf9;--ink:#2a2622;--sub:#7a7064;--line:#e3ddd1;--acc:#8a5a2b;
  --dark1:#241f1a;--dark2:#3b332a;--cream:#f5efe3}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
/* ── 顶栏 ── */
.top{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
.top a{color:var(--sub);text-decoration:none;font-size:13px}
.top .sp{margin-left:auto}
.top select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12.5px;color:var(--ink);max-width:46vw}
/* ── 主播放视图 ── */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 22px 0;min-height:0}
.disc{width:min(46vw,190px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#5b4b3a,#3a322a 62%,#241f1a);
  box-shadow:0 14px 40px rgba(60,45,30,.28),inset 0 0 0 7px rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;position:relative}
.disc.playing{animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.disc::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.disc .ct{position:relative;z-index:2;text-align:center;color:#f0e7d8;line-height:1.15}
.disc .ct b{display:block;font-size:24px;font-weight:600}
.disc .ct i{font-style:normal;font-size:10px;opacity:.6;letter-spacing:1px}
.ttl{margin:18px 0 0;font-size:18px;font-weight:600;text-align:center}
.sub{margin:5px 0 0;font-size:12.5px;color:var(--sub);text-align:center}
.chip{display:inline-block;margin-top:7px;font-size:11.5px;padding:2px 10px;border-radius:20px;background:#efe9de;color:#7a6a55}
.chip.v{background:#e8f0e9;color:#3f6b52}
.prog{width:min(94%,540px);margin:16px 0 0}
.prog input{width:100%;accent-color:var(--acc);height:20px}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;margin-top:-3px}
.ctrl{width:min(94%,500px);margin:10px 0 0;display:flex;align-items:center;justify-content:space-between}
.ctrl button{border:none;background:none;padding:9px;cursor:pointer;color:#4a4238;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ctrl button:active{background:rgba(0,0,0,.05)}
.ctrl .sm{opacity:.66}
.ctrl .sm.on{opacity:1;color:var(--acc)}
.ctrl .main{width:64px;height:64px;background:var(--acc);color:#fff;box-shadow:0 8px 22px rgba(138,90,43,.34)}
.ctrl .main svg{width:26px;height:26px;fill:#fff}
/* ── 底部三入口 ── */
.navb{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:9px 0 12px;flex:0 0 auto;background:var(--bg)}
.navb button{border:none;background:none;font-size:12.5px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 14px}
.navb button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8}
.navb button.on{color:var(--acc)}
/* ── 全屏层（歌词 / 列表）── */
.sheet{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;
  background:linear-gradient(180deg,var(--dark1),var(--dark2) 62%,#2b2620);color:var(--cream)}
.sheet.on{display:flex}
.sheet .hd{display:flex;align-items:center;gap:12px;padding:14px 18px 8px;flex:0 0 auto}
.sheet .hd .t{font-size:13px;opacity:.72}
.sheet .hd .x{margin-left:auto;background:none;border:none;color:var(--cream);font-size:22px;opacity:.7;cursor:pointer;line-height:1}
.sheet .body{flex:1;overflow:auto;padding:16px 22px 40px;scroll-behavior:smooth}
/* 歌词 */
.lyr{text-align:center;padding:24vh 0 40vh}
#lyrBody.vlist{padding:4px 0 96px;max-width:940px;margin:0 auto}
.ly{color:rgba(245,239,227,.34);font-size:15px;line-height:1.85;padding:9px 0;cursor:pointer;transition:color .25s,font-size .25s,transform .25s}
.ly:hover{color:rgba(245,239,227,.62)}
.ly.on{color:#fff;font-size:20px;font-weight:600;text-shadow:0 2px 16px rgba(0,0,0,.5);letter-spacing:.3px;padding:15px 0}
.ly .who{font-size:10.5px;opacity:.36;margin-right:7px;letter-spacing:.5px}
.ly.B{color:rgba(232,206,178,.40)}
.ly.B.on{color:#f2dcc0}
.ly.E{font-family:Georgia,serif}
.ly.voc{display:grid;grid-template-columns:26px minmax(150px,0.40fr) minmax(0,1fr);align-items:baseline;column-gap:18px;
  text-align:left;background:rgba(255,255,255,.045);border-radius:9px;padding:9px 14px;margin:5px 0;font-size:15.5px}
.ly.voc:hover{background:rgba(255,255,255,.10)}
.ly.voc:active{background:rgba(224,176,115,.22)}
.ly.voc .no{font-size:11px;color:rgba(245,239,227,.35);font-variant-numeric:tabular-nums}
.ly.voc .zh{min-width:0;overflow-wrap:anywhere}
.ly.voc .en{min-width:0;text-align:left;font-family:Georgia,serif;font-size:13.2px;line-height:1.45;color:#d8b98d;opacity:.9;overflow-wrap:anywhere}
.ly.voc.on{background:rgba(224,176,115,.20)}
.ly.voc.on .zh{color:#fff}
@media (max-width:600px){
  .ly.voc{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);column-gap:12px;font-size:14.5px;padding:10px 12px}
  .ly.voc .en{font-size:12.2px}
}
.ly.on.voc .en{font-size:15px;color:#f0c98f;opacity:1}
/* 播放列表 */
.pl .row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer;border-radius:8px}
.pl .row:hover{background:rgba(255,255,255,.05)}
.pl .row.on{background:rgba(255,255,255,.08)}
.pl .row.on .no{color:#e0b073}
.pl .no{flex:0 0 26px;font-size:12.5px;color:rgba(245,239,227,.4);font-variant-numeric:tabular-nums;text-align:center}
.pl .ti{flex:1;min-width:0}
.pl .ti .a{font-size:14.5px;color:var(--cream)}
.pl .ti .b{font-size:11.5px;color:rgba(245,239,227,.45);margin-top:2px}
.pl .du{font-size:11.5px;color:rgba(245,239,227,.45);font-variant-numeric:tabular-nums}
.pl .row.off{opacity:.38;cursor:default}
.pl .now{color:#e0b073;font-size:11px;margin-left:6px}
/* 迷你控制（层内底部） */
.mini{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px 16px;border-top:1px solid rgba(255,255,255,.09)}
.mini .m{flex:1;min-width:0;font-size:12.5px;color:rgba(245,239,227,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini button{border:none;background:none;color:var(--cream);cursor:pointer;padding:6px}
.mini svg{width:22px;height:22px;fill:currentColor}
.mini .bar{flex:0 0 90px;height:3px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
.mini .bar i{display:block;height:100%;width:0;background:#e0b073}
.mini .mch{display:flex;align-items:center;gap:4px;border:none;border-radius:999px;background:#e0b073;color:#241a13;font-size:11.5px;font-weight:700;padding:6px 11px;cursor:pointer;white-space:nowrap;font-family:inherit}
.mini .mch:active{transform:scale(.96)}
.mini .mch.stop{background:rgba(255,255,255,.14);color:#f0c894;border:1px solid rgba(224,176,115,.5)}
.mini .rp{border:1px solid rgba(224,176,115,.42);border-radius:999px;background:rgba(224,176,115,.09);color:#e8c795;font-size:11px;font-weight:600;padding:5px 9px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums;font-family:inherit;line-height:1}
.mini .rp:active{transform:scale(.96)}
.mini:not(.voctab) #miniChain,.mini:not(.voctab) .rp{display:none}
.mini.voctab #miniPP{display:none}
.mini.voctab .bar{flex:1 1 auto;min-width:36px}
.mini.voctab .m{flex:1 1 100%;order:-1;font-size:11.5px}
.mini.voctab{flex-wrap:wrap;row-gap:6px;padding:8px 14px 14px}
.mini.voctab #miniTime{font-size:10.5px}
@media(max-height:700px){.disc{width:min(32vh,132px)}.ttl{font-size:16px;margin-top:12px}}
/*backx2*/
.backx2{color:#2f2a26;text-decoration:none;font-size:13px;font-weight:600;padding:4px 11px;border:1px solid #c8c0b2;border-radius:8px;background:#fffdf9;white-space:nowrap;box-shadow:0 1px 3px rgba(60,48,36,.12)}
.backx2:hover{background:#f4ece0;color:#7a231f;border-color:#b8a992}
</style></head><body>

  <a href="index.html">知识图谱</a><a href="glossary.html">词汇表</a>

<div class="navb">

  <button data-v="pl" id="nPl"><svg viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7"/><circle cx="18" cy="16" r="2.4"/><path d="M20.4 16V8l-3 1"/></svg>播放列表</button>
</div>

<!-- 歌词层 -->
<div class="sheet" id="sheetLyr">
  <div class="hd"><span class="t" id="lyrTitle">文字稿</span><button class="x" data-close>×</button></div>
  <div class="body"><div class="lyr" id="lyrBody"></div></div>
  <div class="mini" id="miniLyr"><button id="miniChain" class="mch"><svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:currentColor"><path d="M8 5v14l11-7z"/></svg>连播</button>
    <div class="m" id="miniT1">—</div><div class="mt" id="miniTime" style="font-size:11px;color:rgba(245,239,227,.5);font-variant-numeric:tabular-nums">0:00</div><div class="bar"><i id="miniBar"></i></div>
    <button id="repW" class="rp" title="每个词重复遍数">每词1×</button><button id="repT" class="rp" title="整表循环遍数">全表1×</button>
    <button id="miniPP"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button></div>
</div>

<!-- 播放列表层 -->
<div class="sheet" id="sheetPl">
  <div class="hd"><span class="t">播放列表 · 13 期</span><button class="x" data-close>×</button></div>
  <div class="body"><div class="pl" id="plBody"></div></div>

    <button id="miniPP2"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button></div>
</div>

 "悬念留到最后。先看第一个词，中华民族。", "start": 22.91, "dur": 5.16}, {"i": 5, "role": "A", "text": "中华民族，英文 the Chinese nation。nation 是共同体，race 是人种，ethnic group 是族群。", "start": 28.35, "dur": 2.52}, {"i": 6, "role": "B", "text": "课本里五十六个民族用 ethnic minority groups；整体那一个，才是 the Chinese nation。", "start": 31.15, "dur": 7.3}, {"i": 7, "role": "A", "text": "课本没给它单独造句，我们看真题原句。", "start": 38.73, "dur": 4.13}, {"i": 8, "role": "E", "text": "The Loess Plateau is one of the birthplaces of the Chinese nation.", "start": 43.14, "dur": 4.58}, {"i": 9, "role": "B", "text": "黄土高原是中华民族的发祥地之一。birthplace 一个词，就把“发祥地”拿下了。", "start": 48.17, "dur": 7.44}, {"i": 10, "role": "A", "text": "第二个词，长江，the Yangtze River。", "start": 55.89, "dur": 3.62}, {"i": 11, "role": "B", "text": "为什么不是 Changjiang？最早把它写进英文的人，走的是下游一段，扬子江。Yangtze 就是“扬子”的音。", "start": 59.79, "dur": 9.94}, {"i": 12, "role": "A", "text": "课本原句。", "start": 70.01, "dur": 1.7}, {"i": 13, "role": "E", "text": "The Yangtze River is the longest river in China (more than 6,300 kilometres) and the third-longest river in the world.", "start": 71.99, "dur": 8.64}, {"i": 14, "role": "B", "text": "坑在这儿：世界第三长是 the third-longest，the 不能丢。再记一个词 artery，动脉。", "start": 81.08, "dur": 7.44}, {"i": 15, "role": "A", "text": "第三个词，汉朝，the Han Dynasty。", "start": 88.8, "dur": 3.7}, {"i": 16, "role": "B", "text": "课本原句。", "start": 92.78, "dur": 2.02}, {"i": 17, "role": "E", "text": "The Han Dynasty (汉朝, 202 BCE—220 CE) was established by Liu Bang, with its capital at Chang'an (now Xi'an).", "start": 95.08, "dur": 10.13}, {"i": 18, "role": "A", "text": "刘邦 Liu Bang，长安 Chang'an。公元前写 BCE，公元后写 CE。", "start": 105.65, "dur": 6.55}, {"i": 19, "role": "B", "text": "汉朝是中国人身份的总开关：汉族 the Han people，汉字 Chinese characters，都从这儿来。", "start": 112.49, "dur": 7.78}, {"i": 20, "role": "A", "text": "第四个词，黄河，the Yellow River。长江音译，黄河意译，两条河两种命名法。", "start": 120.54, "dur": 8.33}, {"i": 21, "role": "B", "text": "课本原句。", "start": 129.15, "dur": 2.02}, {"i": 22, "role": "E", "text": "China's second-longest river, the Yellow River, originates in Qinghai Province and flows about 5,464 kilometres to the Bohai Sea.", "start": 131.45, "dur": 8.88}, {"i": 23, "role": "A", "text": "originate in 是发源于。真题里还见过 rise 和 empty into 这两种说法，意思都是发源和注入。", "start": 140.78, "dur": 9.74}, {"i": 24, "role": "B", "text": "rise 讲发源，empty into 讲入海。同义替换，分就在这里。", "start": 150.8, "dur": 6.7}, {"i": 25, "role": "A", "text": "第五个词，京杭大运河，the Beijing-Hangzhou Grand Canal。", "start": 157.78, "dur": 5.04}, {"i": 26, "role": "B", "text": "canal 是人工挖的，river 是天生的。真题给的是 man-made river，教材统一用 canal。", "start": 163.1, "dur": 8.95}, {"i": 27, "role": "A", "text": "课本原句。", "start": 172.33, "dur": 1.7}, {"i": 28, "role": "E", "text": "The Beijing-Hangzhou Grand Canal stretches over 1,700 kilometres between Beijing and Hangzhou.", "start": 174.31, "dur": 7.7}, {"i": 29, "role": "B", "text": "stretch over 是绵延多长。Beijing-Hangzhou 用连字符把地名焊在一起，运河、铁路都这么造词。", "start": 182.47, "dur": 9.31}, {"i": 30, "role": "A", "text": "最后一个词，国歌，the National Anthem。anthem 是颂歌，不说 national song。", "start": 192.06, "dur": 7.37}, {"i": 31, "role": "B", "text": "中国的国歌是《义勇军进行曲》，不叫 Volunteer Army Song。", "start": 199.71, "dur": 5.21}, {"i": 32, "role": "A", "text": "课本原句。", "start": 205.19, "dur": 1.7}, {"i": 33, "role": "E", "text": "\"March of the Volunteers\" was written in 1935, with lyrics by the playwright Tian Han and music by the composer Nie Er.", "start": 207.18, "dur": 8.9}, {"i": 34, "role": "B", "text": "march 进行曲，volunteer 义勇；lyrics 歌词，composer 作曲，playwright 剧作家。", "start": 216.53, "dur": 7.61}, {"i": 35, "role": "A", "text": "快问快答，三个词，老周你答英文。", "start": 224.42, "dur": 3.96}, {"i": 36, "role": "B", "text": "来。", "start": 228.66, "dur": 1.58}, {"i": 37, "role": "A", "text": "长江。", "start": 230.52, "dur": 1.34}, {"i": 38, "role": "B", "text": "the Yangtze River。", "start": 232.15, "dur": 2.28}, {"i": 39, "role": "A", "text": "黄河。", "start": 234.71, "dur": 1.37}, {"i": 40, "role": "B", "text": "the Yellow River。", "start": 236.36, "dur": 2.09}, {"i": 41, "role": "A", "text": "京杭大运河，别漏掉一个地名。", "start": 238.72, "dur": 3.41}, {"i": 42, "role": "B", "text": "the Beijing-Hangzhou Grand Canal。", "start": 242.41, "dur": 2.86}, {"i": 43, "role": "A", "text": "最后一个环节：这些词在卷子上长什么样。", "start": 245.55, "dur": 4.46}, {"i": 44, "role": "B", "text": "真题一句：大运河是世界上最长的人工河，北起北京，南至杭州。", "start": 250.29, "dur": 7.03}, {"i": 45, "role": "A", "text": "官方译文：The Grand Canal, or the Beijing-Hangzhou Grand Canal, is the longest man-made river in the world, running from Beijing in the north to Hangzhou in the south.", "start": 257.6, "dur": 11.54}, {"i": 46, "role": "B", "text": "or 引出一个同义名，顺手把“京杭”补进去；“北起南至”一个 running from…to… 就收住。", "start": 269.43, "dur": 8.3}, {"i": 47, "role": "A", "text": "还有 the。the Grand Canal，世界只有这一条，定冠词不能省。", "start": 278.01, "dur": 6.14}, {"i": 48, "role": "A", "text": "今天六个词：中华民族 the Chinese nation、长江 the Yangtze River、汉朝 the Han Dynasty、黄河 the Yellow River、京杭大运河 the Beijing-Hangzhou Grand Canal、国歌 the National Anthem。", "start": 284.44, "dur": 15.22}, {"i": 49, "role": "B", "text": "回到开场：长江为什么不叫 Changjiang？", "start": 299.93, "dur": 4.3}, {"i": 50, "role": "A", "text": "因为第一个把它写进英文的人，是从扬子江上的船进来的。名字记的是相遇的地方。", "start": 304.51, "dur": 7.9}, {"i": 51, "role": "B", "text": "下一期，文学。我们从《三国演义》的英文名开始问：romance，为什么不是爱情？", "start": 312.68, "dur": 8.59}, {"i": 52, "role": "A", "text": "这里是词汇电台，我们下期见。", "start": 321.56, "dur": 3.43}]}, "1": {"ch": 1, "title": "哲学与宗教", "en": "Philosophy and Religion", "episode": 1, "hook": "如果孔子和老子同时开直播，谁的粉丝更多？", "words": [{"zh": "儒家", "en": "Confucianism", "note": "-ism 学派族：Confucianism / Daoism / Legalism / Mohism"}, {"zh": "道家", "en": "Daoism / Daoist philosophy", "note": "Dao 音译，不译作 the way"}, {"zh": "佛教", "en": "Buddhism", "note": "佛 Buddha ｜ 佛教 Buddhism ｜ 佛学 Buddhist philosophy"}, {"zh": "禅宗", "en": "Chinese Chan Buddhism", "note": "禅 chan → 日语 zen → 英语 zen"}, {"zh": "八仙", "en": "Eight Immortals", "note": "专名大写；immortal＝不朽者"}, {"zh": "重集体而轻个人", "en": "Collectivism over Individualism", "note": "over 表优先于；价值观题高频"}], "total": 316.0, "segs": [{"i": 0, "role": "A", "text": "这里是《中国文化概况》词汇电台，第一期：哲学与宗教。", "start": 0.0, "dur": 5.52}, {"i": 1, "role": "B", "text": "我是老周。", "start": 5.8, "dur": 1.92}, {"i": 2, "role": "A", "text": "我是小夏。今天只聊六个词，但聊完你会发现，中国人看世界的方式，就藏在这六个词里。", "start": 8.0, "dur": 9.22}, {"i": 3, "role": "B", "text": "开场先抛一个问题：如果孔子和老子同时开直播，谁的粉丝更多？", "start": 17.5, "dur": 6.43}, {"i": 4, "role": "A", "text": "悬念留到最后。先看第一个词，儒家。", "start": 24.21, "dur": 4.7}, {"i": 5, "role": "A", "text": "儒家，它不是宗教，更像一套讲人与人怎么相处的说明书。核心就三个字：仁、礼、中庸。", "start": 29.19, "dur": 7.2}, {"i": 6, "role": "B", "text": "英文是 Confucianism，来自 Confucius，也就是孔子的拉丁化名字。十七世纪传教士按拉丁语习惯造的，所以不是 Kongism。", "start": 36.67, "dur": 11.64}, {"i": 7, "role": "A", "text": "课本里有一句原话。", "start": 48.59, "dur": 2.26}, {"i": 8, "role": "E", "text": "During this time, various schools of thought, such as Confucianism, Legalism, Daoism, and Mohism, emerged.", "start": 51.13, "dur": 8.71}, {"i": 9, "role": "B", "text": "这正是百家争鸣。记住四个词：儒家 Confucianism、法家 Legalism、道家 Daoism、墨家 Mohism，四个 ism 排一排，都是学派。", "start": 60.29, "dur": 13.68}, {"i": 10, "role": "A", "text": "第二个词，道家，英文 Daoist philosophy，也可以只说 Daoism。", "start": 74.25, "dur": 1.92}, {"i": 11, "role": "B", "text": "关键词是 Dao，道。它直接音译，不译成 the way。这是文化词的规矩：概念独一无二，就音译。", "start": 76.45, "dur": 10.68}, {"i": 12, "role": "A", "text": "道家讲道法自然，英文里常译成 follow the natural order。", "start": 87.41, "dur": 5.45}, {"i": 13, "role": "B", "text": "对比着记：儒家管人与人，道家管人与自然。一个 ism 讲社会，一个 Dao 讲天地。", "start": 93.14, "dur": 9.34}, {"i": 14, "role": "A", "text": "第三个词，佛教，Buddhism，从印度来，在中国落地。", "start": 102.75, "dur": 5.52}, {"i": 15, "role": "B", "text": "容易混的三个词：佛是 Buddha，佛教是 Buddhism，佛学是 Buddhist philosophy。", "start": 108.55, "dur": 7.63}, {"i": 16, "role": "A", "text": "课本原句。", "start": 116.47, "dur": 1.7}, {"i": 17, "role": "E", "text": "During the Sui and Tang dynasties, Buddhism reached its apex in China.", "start": 118.45, "dur": 5.4}, {"i": 18, "role": "B", "text": "隋唐时期，佛教在中国达到顶点。apex 是顶点，比 peak 更书面，考试里遇到要知道是同义。", "start": 124.3, "dur": 10.03}, {"i": 19, "role": "A", "text": "第四个词，禅宗。它是佛教里最中国化的一支。", "start": 134.61, "dur": 5.59}, {"i": 20, "role": "B", "text": "英文有两个说法：Zen Buddhism 和 Chinese Chan Buddhism。Zen 是日语读音传出去的，Chan 才是中国的禅。课本用的是 Chan。", "start": 140.48, "dur": 11.93}, {"i": 21, "role": "A", "text": "一个词的旅行：禅，在中国读 chan，传到日本变 zen，再由日本传进英语，就成了 zen。", "start": 152.69, "dur": 8.45}, {"i": 22, "role": "B", "text": "谁先把它介绍出去，谁就定了这个名字。这也是文化传播最生动的一个注脚。", "start": 161.42, "dur": 1.56}, {"i": 23, "role": "A", "text": "第五个词，八仙，Eight Immortals。", "start": 163.26, "dur": 3.6}, {"i": 24, "role": "B", "text": "注意 Immortals 首字母大写，因为它是专名。immortal 本义是不朽的，转成名词，就是不死的人。", "start": 167.14, "dur": 9.48}, {"i": 25, "role": "A", "text": "课本原句。", "start": 176.9, "dur": 1.7}, {"i": 26, "role": "E", "text": "The Eight Daoist Immortals are widely worshipped by Daoist believers as well as ordinary people.", "start": 178.88, "dur": 6.7}, {"i": 27, "role": "B", "text": "道士拜，老百姓也拜。八仙过海、各显神通，英文常译成 Eight Immortals crossing the sea, each showing their own magic powers.", "start": 186.03, "dur": 10.94}, {"i": 28, "role": "A", "text": "最后一个词有点长：重集体而轻个人。", "start": 197.25, "dur": 4.3}, {"i": 29, "role": "B", "text": "英文是 Collectivism over Individualism。用 over 表示优先于，比 more important than 简练得多。", "start": 201.83, "dur": 9.02}, {"i": 30, "role": "A", "text": "课本说，传统文化重视集体利益，优先考虑社会和国家的需要。", "start": 211.13, "dur": 6.62}, {"i": 31, "role": "B", "text": "这是价值观层面最高频的一组对立，写作文时用来解释，为什么中国人重视家庭、尊老、讲和睦。", "start": 218.04, "dur": 9.48}, {"i": 32, "role": "A", "text": "快问快答。三个词，老周你答英文。", "start": 227.8, "dur": 4.51}, {"i": 33, "role": "B", "text": "来。", "start": 232.59, "dur": 1.58}, {"i": 34, "role": "A", "text": "儒家。", "start": 234.45, "dur": 1.32}, {"i": 35, "role": "B", "text": "Confucianism。", "start": 236.05, "dur": 2.06}, {"i": 36, "role": "A", "text": "八仙。", "start": 238.4, "dur": 1.37}, {"i": 37, "role": "B", "text": "Eight Immortals。", "start": 240.05, "dur": 2.21}, {"i": 38, "role": "A", "text": "禅宗，要用中国那个说法。", "start": 242.53, "dur": 1.8}, {"i": 39, "role": "B", "text": "Chinese Chan Buddhism。", "start": 244.61, "dur": 2.5}, {"i": 40, "role": "A", "text": "最后一个环节：这些词在考试里长什么样。", "start": 247.39, "dur": 4.51}, {"i": 41, "role": "B", "text": "一道真题：中华民族在五千多年的历史发展中，形成了自己独特的传统美德。", "start": 252.18, "dur": 3.24}, {"i": 42, "role": "A", "text": "这里有两个坑。传统美德是 traditional virtues，virtue 用复数，因为是一整套。", "start": 255.7, "dur": 7.9}, {"i": 43, "role": "B", "text": "中华民族是 the Chinese nation，不是 Chinese people。nation 强调共同体。", "start": 263.88, "dur": 7.32}, {"i": 44, "role": "A", "text": "这两个词，恰好就是下一期文学的开场。", "start": 271.48, "dur": 4.03}, {"i": 45, "role": "A", "text": "今天六个词：儒家 Confucianism、道家 Daoism、佛教 Buddhism、禅宗 Chinese Chan Buddhism、八仙 Eight Immortals、重集体轻个人 Collectivism over Individualism。", "start": 275.79, "dur": 14.86}, {"i": 46, "role": "B", "text": "回到开场的问题：孔子和老子，谁的粉丝多？", "start": 290.93, "dur": 5.14}, {"i": 47, "role": "A", "text": "答案在课本里：儒家做了两千多年官方正统，道家成了中国人的退路。一个入世，一个出世。", "start": 296.34, "dur": 9.46}, {"i": 48, "role": "B", "text": "下一期，文学。我们从诗这个字开始。", "start": 306.08, "dur": 4.68}, {"i": 49, "role": "A", "text": "这里是词汇电台，我们下期见。", "start": 311.04, "dur": 3.43}]}, "2": {"ch": 2, "title": "文学", "en": "Literature", "episode": 2, "hook": "《三国演义》英文名里的 romance，为什么不是爱情？", "words": [{"zh": "神话", "en": "mythology", "note": "myth 是单个神话"}, {"zh": "《诗经》", "en": "The Book of Songs", "note": "能唱，所以是 song"}, {"zh": "《论语》", "en": "The Analects", "note": "lect 是挑出来的"}, {"zh": "唐朝", "en": "the Tang Dynasty", "note": "唐是诗的时间坐标"}, {"zh": "《三国演义》", "en": "Romance of the Three Kingdoms", "note": "romance 是传奇"}, {"zh": "《水浒传》", "en": "Water Margin", "note": "margin 是水边"}], "total": 299.8, "segs": [{"i": 0, "role": "A", "text": "这里是《中国文化概况》词汇电台，第二期：文学。", "start": 0.0, "dur": 5.21}, {"i": 1, "role": "B", "text": "我是老周。", "start": 5.49, "dur": 1.92}, {"i": 2, "role": "A", "text": "我是小夏。这一期六个词，从神话走到小说，跨度三千年。", "start": 7.69, "dur": 6.6}, {"i": 3, "role": "B", "text": "开场先抛一个问题：《三国演义》英文叫 Romance of the Three Kingdoms，romance 明明是爱情，怎么跑到这儿来了？", "start": 14.57, "dur": 9.41}, {"i": 4, "role": "A", "text": "悬念留到最后。先看第一个词，神话。", "start": 24.26, "dur": 4.73}, {"i": 5, "role": "A", "text": "神话，英文 mythology。词根是希腊语 mythos，意思是“说出来的故事”。myth 是一个，mythology 是一整套。", "start": 29.26, "dur": 10.92}, {"i": 6, "role": "B", "text": "中国神话有个特点：主角都在跟自然较劲，补天、治水、移山。", "start": 40.46, "dur": 0.36}, {"i": 7, "role": "A", "text": "课本原句。", "start": 41.1, "dur": 1.7}, {"i": 8, "role": "E", "text": "For over 3,000 years, Chinese literature has included diverse genres (类型) and forms, such as mythology (神话), poetry, fiction, and drama.", "start": 43.09, "dur": 10.39}, {"i": 9, "role": "B", "text": "genre 是体裁，fiction 是小说，drama 是戏剧。一句话四个体裁，最好用的一句总纲。", "start": 53.93, "dur": 8.47}, {"i": 10, "role": "A", "text": "第二个词，《诗经》，The Book of Songs。", "start": 62.68, "dur": 3.6}, {"i": 11, "role": "B", "text": "不叫 Book of Poetry。song 才准，诗经本来是可以唱的：三百零五首，都是歌词。", "start": 66.56, "dur": 8.11}, {"i": 12, "role": "A", "text": "课本原句。", "start": 74.95, "dur": 1.7}, {"i": 13, "role": "E", "text": "The Book of Songs is the oldest existing collection of poems or songs, dating from the early Western Zhou Dynasty to the middle of the Spring and Autumn Period.", "start": 76.94, "dur": 10.01}, {"i": 14, "role": "B", "text": "the oldest existing collection，现存最古老。existing 不能漏：更早的也许有，但没留下来。", "start": 87.4, "dur": 8.35}, {"i": 15, "role": "A", "text": "第三个词，《论语》，The Analects。", "start": 96.03, "dur": 3.62}, {"i": 16, "role": "B", "text": "Analects 是“选集、语录”，来自希腊语 analekta。欧洲人给中国经典取拉丁名的时候，用的就是它。", "start": 99.93, "dur": 3.6}, {"i": 17, "role": "A", "text": "课本原句。", "start": 103.81, "dur": 1.7}, {"i": 18, "role": "E", "text": "Compiled by the disciples of Confucius, this work records his sayings and behaviour in a question-and-answer format.", "start": 105.8, "dur": 7.99}, {"i": 19, "role": "B", "text": "compile 编纂，disciple 弟子。lect 跟 collect、select 同源，都是“挑出来的”。", "start": 114.24, "dur": 7.54}, {"i": 20, "role": "A", "text": "第四个词，唐朝，the Tang Dynasty。", "start": 122.05, "dur": 3.72}, {"i": 21, "role": "B", "text": "课本原句。", "start": 126.05, "dur": 2.02}, {"i": 22, "role": "E", "text": "The Tang Dynasty witnessed the continued development of Chinese poetry.", "start": 128.35, "dur": 5.02}, {"i": 23, "role": "A", "text": "witness 是见证。中文说“唐朝见证了诗歌的发展”，英文一个 witness 就够。", "start": 133.82, "dur": 7.61}, {"i": 24, "role": "B", "text": "朝代是时间坐标：唐诗 Tang poetry，都挂在这个坐标上。", "start": 141.7, "dur": 5.76}, {"i": 25, "role": "A", "text": "第五个词，《三国演义》，Romance of the Three Kingdoms。", "start": 147.74, "dur": 4.85}, {"i": 26, "role": "B", "text": "这里的 romance 不是爱情，是中世纪那套“传奇、英雄故事”。“演义”两个字，正好对上。", "start": 152.87, "dur": 8.76}, {"i": 27, "role": "A", "text": "课本原句。", "start": 161.91, "dur": 1.7}, {"i": 28, "role": "E", "text": "Romance of the Three Kingdoms by Luo Guanzhong is recognised as the earliest historical novel written in chapters in China.", "start": 163.9, "dur": 3.12}, {"i": 29, "role": "B", "text": "written in chapters 就是章回体。三国的故事，是一回一回说出来的。", "start": 167.47, "dur": 6.65}, {"i": 30, "role": "A", "text": "最后一个词，《水浒传》，Water Margin。", "start": 174.39, "dur": 3.82}, {"i": 31, "role": "B", "text": "margin 是边缘、水边。宋江他们待在梁山泊，就在水边，所以是 Water Margin，不是 Water Story。", "start": 178.49, "dur": 9.79}, {"i": 32, "role": "A", "text": "课本原句。", "start": 188.56, "dur": 1.7}, {"i": 33, "role": "E", "text": "Water Margin by Shi Nai’an tells the story of the rebellion of 108 heroes at the end of the Northern Song Dynasty.", "start": 190.55, "dur": 8.04}, {"i": 34, "role": "B", "text": "rebellion 造反，108 heroes 一百单八将。二十世纪故事搬上舞台，老舍那出话剧就叫《茶馆》Teahouse。", "start": 199.04, "dur": 11.09}, {"i": 35, "role": "A", "text": "快问快答，三个词，老周你答英文。", "start": 210.4, "dur": 3.96}, {"i": 36, "role": "B", "text": "来。", "start": 214.64, "dur": 1.58}, {"i": 37, "role": "A", "text": "诗经。", "start": 216.51, "dur": 1.37}, {"i": 38, "role": "B", "text": "The Book of Songs。", "start": 218.16, "dur": 2.14}, {"i": 39, "role": "A", "text": "论语。", "start": 220.57, "dur": 1.34}, {"i": 40, "role": "B", "text": "The Analects。", "start": 222.2, "dur": 1.94}, {"i": 41, "role": "A", "text": "三国演义，注意那个不是爱情的词。", "start": 224.42, "dur": 3.84}, {"i": 42, "role": "B", "text": "Romance of the Three Kingdoms。", "start": 228.54, "dur": 2.98}, {"i": 43, "role": "A", "text": "最后一个环节：这些词在卷子上怎么考。", "start": 231.8, "dur": 4.3}, {"i": 44, "role": "B", "text": "真题一句：唐朝始于 618 年，终于 907 年，是中国历史上最灿烂的时期。", "start": 236.37, "dur": 7.92}, {"i": 45, "role": "A", "text": "译文：The Tang Dynasty began in 618 and ended in 907, and was the most glorious period in Chinese history.", "start": 244.57, "dur": 5.28}, {"i": 46, "role": "B", "text": "两个点：the Tang Dynasty，the 加大写；“最灿烂”用 glorious，比 great 有分量。", "start": 250.13, "dur": 7.37}, {"i": 47, "role": "A", "text": "同一套还有一句：李白和杜甫以简洁自然著称，Li Bai and Du Fu were poets known for the simplicity and naturalness of their works。", "start": 257.78, "dur": 10.56}, {"i": 48, "role": "A", "text": "今天六个词：神话 mythology、诗经 The Book of Songs、论语 The Analects、唐朝 the Tang Dynasty、三国演义 Romance of the Three Kingdoms、水浒传 Water Margin。", "start": 268.62, "dur": 14.11}, {"i": 49, "role": "B", "text": "回到开场：romance 为什么不是爱情？因为它记的是传奇，是英雄故事。", "start": 283.01, "dur": 7.42}, {"i": 50, "role": "A", "text": "下一期，艺术。第一个问题：汉字为什么叫 Chinese character，不叫 Chinese word？", "start": 290.71, "dur": 8.04}]}, "3": {"ch": 3, "title": "艺术", "en": "The Arts", "episode": 3, "hook": "汉字在英文里为什么叫 Chinese character，不叫 Chinese word？", "words": [{"zh": "汉字", "en": "Chinese character", "note": "character 是刻痕"}, {"zh": "乡村生活", "en": "rural life", "note": "rural 对 urban"}, {"zh": "脸谱", "en": "facial make-up", "note": "颜色就是台词"}, {"zh": "昆曲", "en": "Kunqu Opera", "note": "六百多年，百戏之母"}, {"zh": "《二泉映月》", "en": "The Moon Reflected on the Second Spring", "note": "moon 倒映第二泉"}, {"zh": "相声", "en": "crosstalk", "note": "cross 交叉着说"}], "total": 298.7, "segs": [{"i": 0, "role": "A", "text": "这里是《中国文化概况》词汇电台，第三期：艺术。", "start": 0.0, "dur": 5.26}, {"i": 1, "role": "B", "text": "我是老周。", "start": 5.54, "dur": 1.92}, {"i": 2, "role": "A", "text": "我是小夏。这一期六个词，从写字、画画，一直说到唱戏、说相声。", "start": 7.74, "dur": 7.66}, {"i": 3, "role": "B", "text": "开场先抛一个问题：汉字在英文里为什么叫 Chinese character，不叫 Chinese word？", "start": 15.67, "dur": 7.49}, {"i": 4, "role": "A", "text": "悬念留到最后。先看第一个词，汉字。", "start": 23.44, "dur": 4.75}, {"i": 5, "role": "A", "text": "汉字，英文 Chinese character。character 的本义是“刻下的记号”，不是“词”。", "start": 28.47, "dur": 7.3}, {"i": 6, "role": "B", "text": "word 是语言单位，character 是书写符号。一个字一个字刻下来，所以是 character。", "start": 36.05, "dur": 8.26}, {"i": 7, "role": "A", "text": "课本原句。", "start": 44.58, "dur": 1.7}, {"i": 8, "role": "E", "text": "Chinese characters evolved from pictures and signs, and the art of calligraphy developed naturally from this unique writing system.", "start": 46.57, "dur": 8.45}, {"i": 9, "role": "B", "text": "evolve from 从……演化而来，sign 是符号。这一句还顺手带出书法：calligraphy，美的书写。", "start": 55.47, "dur": 0.84}, {"i": 10, "role": "A", "text": "第二个词，乡村生活，rural life。", "start": 56.59, "dur": 3.77}, {"i": 11, "role": "B", "text": "rural 是乡下的，反义词 urban 城里的。中国画最爱画的，就是这种生活。", "start": 60.63, "dur": 6.72}, {"i": 12, "role": "A", "text": "课本正文里没有现成句，我们看真题。", "start": 67.63, "dur": 3.6}, {"i": 13, "role": "E", "text": "The ideal of rural life reflected in art and literature is an important feature of Chinese civilization.", "start": 71.51, "dur": 7.3}, {"i": 14, "role": "B", "text": "艺术和文学里的乡村理想，是中国文明的重要特征。reflected in 过去分词后置，汉译英里很好用。", "start": 79.26, "dur": 9.65}, {"i": 15, "role": "A", "text": "第三个词，脸谱，facial make-up。", "start": 89.19, "dur": 3.62}, {"i": 16, "role": "B", "text": "脸谱不是画上去的一幅画，它是化妆，所以用 make-up。红忠、白奸、黑直，颜色就是台词。", "start": 93.09, "dur": 6.6}, {"i": 17, "role": "A", "text": "课本原句。", "start": 99.97, "dur": 1.7}, {"i": 18, "role": "E", "text": "In Peking Opera, performers wear different types of make-up that correspond to the characters they portray.", "start": 101.96, "dur": 6.96}, {"i": 19, "role": "B", "text": "correspond to 对应，portray 扮演。注意 characters 在这儿是“角色”，不是“汉字”。", "start": 109.37, "dur": 7.3}, {"i": 20, "role": "A", "text": "第四个词，昆曲，Kunqu Opera。", "start": 116.94, "dur": 3.55}, {"i": 21, "role": "B", "text": "六百多年，被叫作“百戏之母”。2001 年进教科文组织首批非遗名录，2008 年进代表作名录。", "start": 120.77, "dur": 9.89}, {"i": 22, "role": "A", "text": "课本原句。", "start": 130.94, "dur": 1.7}, {"i": 23, "role": "E", "text": "Kunqu Opera is one of the oldest operatic forms in China, with a history of more than 600 years.", "start": 132.93, "dur": 7.06}, {"i": 24, "role": "B", "text": "operatic forms 是戏曲形式。昆曲字少音长，所以英文常配 gentle and clear vocals。", "start": 140.43, "dur": 8.3}, {"i": 25, "role": "A", "text": "第五个词，《二泉映月》，The Moon Reflected on the Second Spring。", "start": 149.02, "dur": 5.57}, {"i": 26, "role": "B", "text": "译得很老实：moon 月亮，reflected 倒映，second spring 第二泉。这是阿炳在无锡泉边拉出来的曲子。", "start": 154.86, "dur": 9.24}, {"i": 27, "role": "A", "text": "课本原句。", "start": 164.38, "dur": 1.7}, {"i": 28, "role": "E", "text": "The most popular erhu piece is “The Moon Reflected on the Second Spring” (《二泉映月》).", "start": 166.37, "dur": 5.14}, {"i": 29, "role": "B", "text": "erhu piece 就是二胡曲。二胡在西方也叫 Chinese violin，用熟悉的词给陌生的东西定位。", "start": 171.95, "dur": 8.88}, {"i": 30, "role": "A", "text": "最后一个词，相声，crosstalk。", "start": 181.11, "dur": 3.48}, {"i": 31, "role": "B", "text": "这个词妙：cross 交叉，talk 说话，一来一往交叉着说，正是一个逗、一个捧。", "start": 184.87, "dur": 7.51}, {"i": 32, "role": "A", "text": "课本原句。", "start": 192.67, "dur": 1.7}, {"i": 33, "role": "E", "text": "A skilled crosstalk performer must have clear enunciation (发音) and be able to imitate various kinds of people and situations, often incorporating sound effects.", "start": 194.65, "dur": 10.39}, {"i": 34, "role": "B", "text": "enunciation 吐字，imitate 模仿，sound effects 音效。说学逗唱，一句英文全在里面。", "start": 205.49, "dur": 8.69}, {"i": 35, "role": "A", "text": "快问快答，三个词，老周你答英文。", "start": 214.46, "dur": 3.96}, {"i": 36, "role": "B", "text": "来。", "start": 218.7, "dur": 1.58}, {"i": 37, "role": "A", "text": "汉字。", "start": 220.56, "dur": 1.34}, {"i": 38, "role": "B", "text": "Chinese character。", "start": 222.19, "dur": 2.35}, {"i": 39, "role": "A", "text": "脸谱。", "start": 224.82, "dur": 1.37}, {"i": 40, "role": "B", "text": "facial make-up。", "start": 226.47, "dur": 2.28}, {"i": 41, "role": "A", "text": "相声，别翻成 talk show。", "start": 229.03, "dur": 2.81}, {"i": 42, "role": "B", "text": "crosstalk。", "start": 232.12, "dur": 1.78}, {"i": 43, "role": "A", "text": "最后一个环节：这些词在卷子上怎么考。", "start": 234.17, "dur": 4.3}, {"i": 44, "role": "B", "text": "真题一句：中国戏曲吸引观众的一大特色是其独具风格的脸谱。", "start": 238.75, "dur": 6.58}, {"i": 45, "role": "A", "text": "译文：One striking feature of Chinese opera that attracts audiences is its distinctive facial painting.", "start": 245.6, "dur": 7.82}, {"i": 46, "role": "B", "text": "注意：卷子括注给的是 facial painting，教材用 facial make-up，两个都对，看题目给不给提示。", "start": 253.71, "dur": 8.69}, {"i": 47, "role": "A", "text": "还有 striking 和 distinctive，一个醒目，一个独特，都比 famous 高级。", "start": 262.68, "dur": 4.2}, {"i": 48, "role": "A", "text": "今天六个词：汉字 Chinese character、乡村生活 rural life、脸谱 facial make-up、昆曲 Kunqu Opera、二泉映月 The Moon Reflected on the Second Spring、相声 crosstalk。", "start": 267.16, "dur": 14.74}, {"i": 49, "role": "B", "text": "回到开场：汉字为什么叫 character？因为它本来就是一个一个刻下来的记号。", "start": 282.17, "dur": 6.96}, {"i": 50, "role": "A", "text": "下一期，教育。我们从科举和高考说起。这里是词汇电台，我们下期见。", "start": 289.41, "dur": 8.21}]}, "4": {"ch": 4, "title": "教育", "en": "Education", "episode": 4, "hook": "科举和高考，到底是不是一回事？", "words": [{"zh": "高等教育", "en": "higher education", "note": "high 要变 higher"}, {"zh": "汉语", "en": "the Chinese language", "note": "Mandarin 只是普通话"}, {"zh": "科举制度", "en": "imperial civil examination system", "note": "civil 是文官"}, {"zh": "九年义务教育", "en": "nine-year compulsory education", "note": "compulsory 就是强制"}, {"zh": "《中庸》", "en": "The Doctrine of the Mean", "note": "mean 是中道"}, {"zh": "招生人数", "en": "enrollment", "note": "enroll 报名→人数"}], "total": 360.5, "segs": [{"i": 0, "role": "A", "text": "这里是《中国文化概况》词汇电台，第四期：教育。", "start": 0.0, "dur": 5.21}, {"i": 1, "role": "B", "text": "我是老周。", "start": 5.49, "dur": 1.92}, {"i": 2, "role": "A", "text": "我是小夏。这一期六个词，都跟读书有关。", "start": 7.69, "dur": 4.85}, {"i": 3, "role": "B", "text": "开场先抛一个问题：科举和高考，到底是不是一回事？", "start": 12.82, "dur": 5.33}, {"i": 4, "role": "A", "text": "先别急着答，听完六个词，课本早就给了线索。第一个词，高等教育——它说的不是高中，是高中以后：大学、硕士、博士。", "start": 18.42, "dur": 12.72}, {"i": 5, "role": "B", "text": "英文 higher education。这里有个常见错误：不能说 high education，要用比较级 higher，因为它比中学高一级。", "start": 31.42, "dur": 9.89}, {"i": 6, "role": "E", "text": "More than 3,000 institutions of higher education in China offer a wide range of programmes.", "start": 41.59, "dur": 6.65}, {"i": 7, "role": "B", "text": "institutions 是院校，programmes 是专业。课本另一句更狠：中国已建成世界规模最大的高等教育体系——largest 说的是规模，不是最强。", "start": 48.69, "dur": 12.79}, {"i": 8, "role": "A", "text": "第二个词，汉语，the Chinese language。只写 Chinese 也行，但它还能指中国人、中国的。", "start": 61.76, "dur": 6.48}, {"i": 9, "role": "B", "text": "还要跟 Mandarin 分开：Mandarin 是普通话，汉语还包括各种方言。", "start": 68.52, "dur": 3.48}, {"i": 10, "role": "E", "text": "The international status of the Chinese language continues to rise, and in 2021, Chinese officially became one of the official languages of the United Nations World Tourism Organization.", "start": 72.28, "dur": 12.6}, {"i": 11, "role": "A", "text": "continues to rise，还在上升。补个数字：180 多个国家和地区开设了汉语课程，70 多个国家把汉语纳入国民教育体系。", "start": 85.33, "dur": 12.31}, {"i": 12, "role": "B", "text": "第三个词，科举制度，imperial civil examination system。三个零件：imperial 帝国的，civil 文职的，examination system 考试制度。", "start": 97.92, "dur": 12.02}, {"i": 13, "role": "A", "text": "最容易看错的是 civil。它是文官，对着的是军事。所以这不是“考试的科学”，是选文官的考试。", "start": 110.23, "dur": 10.18}, {"i": 14, "role": "E", "text": "The imperial civil examination system dominated education in China’s feudal society.", "start": 120.68, "dur": 6.46}, {"i": 15, "role": "B", "text": "dominate，支配。课本还说，科举给寒门子弟开了门——humble backgrounds，也能 bring honour to the family。", "start": 127.59, "dur": 9.14}, {"i": 16, "role": "A", "text": "第四个词，九年义务教育，nine-year compulsory education。compulsory 来自 compel，强迫。", "start": 137.01, "dur": 8.62}, {"i": 17, "role": "B", "text": "所以这个词的骨头是“强制”，不是把“义务”两个字照抄一遍。说成义务，英文里得是 obligation，那就跑偏了。", "start": 145.91, "dur": 2.4}, {"i": 18, "role": "E", "text": "The nine-year compulsory education consists of both primary and junior middle school levels.", "start": 148.59, "dur": 6.29}, {"i": 19, "role": "A", "text": "1986 年 7 月 1 日《义务教育法》生效。生效是 come into effect，真题原题。初中是 junior middle school，英美学区更常说 junior high。", "start": 155.33, "dur": 13.06}, {"i": 20, "role": "B", "text": "第五个词是一本书，《中庸》，The Doctrine of the Mean。doctrine 是学说，mean 不是“意思”，也不是“平均”，是不偏不倚——所以这本书讲的是分寸。", "start": 168.66, "dur": 12.17}, {"i": 21, "role": "E", "text": "The term “Four Books” refers to the four Confucian classics: The Great Learning, The Doctrine of the Mean, The Analects, and Mencius.", "start": 181.11, "dur": 9.07}, {"i": 22, "role": "B", "text": "四书连着记：《大学》The Great Learning，《中庸》The Doctrine of the Mean，《论语》The Analects，《孟子》Mencius。", "start": 190.63, "dur": 10.18}, {"i": 23, "role": "A", "text": "同一套书，两种译法：前两个意译，《孟子》干脆音译成人名。译名不是一次定终身，是译者一次次选出来的。", "start": 201.09, "dur": 11.02}, {"i": 24, "role": "B", "text": "最后一个词，招生人数，enrollment。enroll 是注册入学，enrollment 是招生规模；拼写美式双 l，英式单 l。", "start": 212.39, "dur": 11.11}, {"i": 25, "role": "E", "text": "The number of colleges and universities and academic programs in China has kept increasing, enrollment has risen year by year, and teaching quality has also been improving, creating opportunities for more young people to receive higher education.", "start": 223.78, "dur": 15.31}, {"i": 26, "role": "B", "text": "三个并列：院校和专业增加、招生人数逐年上升、教学质量改进。enrollment has risen year by year，可以直接背。注意 rise 不及物，只能说 has risen。", "start": 239.54, "dur": 14.95}, {"i": 27, "role": "A", "text": "快问快答，三个词，老周你答英文。", "start": 254.77, "dur": 3.96}, {"i": 28, "role": "B", "text": "来。", "start": 259.01, "dur": 1.58}, {"i": 29, "role": "A", "text": "科举制度。", "start": 260.88, "dur": 1.73}, {"i": 30, "role": "B", "text": "imperial civil examination system。", "start": 262.88, "dur": 3.5}, {"i": 31, "role": "A", "text": "《中庸》。", "start": 266.67, "dur": 1.34}, {"i": 32, "role": "B", "text": "The Doctrine of the Mean。", "start": 268.29, "dur": 2.3}, {"i": 33, "role": "A", "text": "招生人数。", "start": 270.88, "dur": 1.73}, {"i": 34, "role": "B", "text": "enrollment。", "start": 272.88, "dur": 1.82}, {"i": 35, "role": "A", "text": "最后一个环节，真题连线。2023 年 6 月四级：如今，儿童年满六周岁开始上小学，从小学到初中一共接受九年义务教育。", "start": 274.99, "dur": 13.44}, {"i": 36, "role": "B", "text": "关键词都在这儿：start primary school at the age of six，receive nine years of compulsory education from primary school to junior middle school。", "start": 288.71, "dur": 8.04}, {"i": 37, "role": "A", "text": "同一套还有一句：自 1986 年《义务教育法》生效以来，实现了在全国推行义务教育的目标。", "start": 297.03, "dur": 8.78}, {"i": 38, "role": "B", "text": "《义务教育法》the Compulsory Education Law，生效 come into effect，都是课本原句。所以课本里那些句子，不是例子，是答案。", "start": 306.09, "dur": 11.57}, {"i": 39, "role": "A", "text": "今天六个词：高等教育 higher education、汉语 the Chinese language、科举制度 imperial civil examination system、九年义务教育 nine-year compulsory education、《中庸》The Doctrine of the Mean、招生人数 enrollment。", "start": 317.94, "dur": 17.98}, {"i": 40, "role": "B", "text": "回到开场：科举和高考，是不是一回事？", "start": 336.2, "dur": 4.63}, {"i": 41, "role": "A", "text": "课本给的线索是：科举直接连着做官，高考只是一道门。门是同一道门，门后的风景不一样。", "start": 341.11, "dur": 9.55}, {"i": 42, "role": "B", "text": "下一期，科学技术。我们从一炉丹说起。", "start": 350.94, "dur": 5.04}, {"i": 43, "role": "A", "text": "这里是词汇电台，我们下期见。", "start": 356.26, "dur": 3.43}]}, "5": {"ch": 5, "title": "科学技术", "en": "Science and Technology", "episode": 5, "hook": "古人炼丹想求长生不老，为什么炼出了炸药？", "words": [{"zh": "火药", "en": "gunpowder", "note": "英文抓火器，中文抓药"}, {"zh": "中国空间站", "en": "China Space Station", "note": "complete 就是建成"}, {"zh": "人工智能", "en": "artificial intelligence", "note": "artificial 非假货"}, {"zh": "船队", "en": "fleet", "note": "fleet 是整支船队"}, {"zh": "活字印刷", "en": "movable-type printing", "note": "type 是活字，不是类型"}, {"zh": "瓷器", "en": "porcelain", "note": "词源是一种贝壳"}], "total": 354.3, "segs": [{"i": 0, "role": "A", "text": "这里是《中国文化概况》词汇电台，第五期：科学技术。", "start": 0.0, "dur": 5.76}, {"i": 1, "role": "B", "text": "我是老周。", "start": 6.04, "dur": 1.92}, {"i": 2, "role": "A", "text": "我是小夏。六个词，从一炉丹讲到天上的空间站。", "start": 8.24, "dur": 5.52}, {"i": 3, "role": "B", "text": "开场先问一个问题：古人炼丹，本来想求长生不老，为什么最后炼出了炸药？", "start": 14.04, "dur": 7.39}, {"i": 4, "role": "A", "text": "答案就在第一个词里。火药——gun 是枪，powder 是粉末，英文抓住的是火器用的粉。", "start": 21.71, "dur": 8.57}, {"i": 5, "role": "B", "text": "中文抓住的是“药”，因为它真出自炼丹术——求长生的人，把各种东西放在一起加热。", "start": 30.56, "dur": 7.46}, {"i": 6, "role": "E", "text": "Gunpowder was accidentally discovered by ancient Chinese alchemists (炼丹术士) who sought elixirs of immortality by combining various substances and heating them.", "start": 38.3, "dur": 10.03}, {"i": 7, "role": "A", "text": "accidentally，意外地；elixir of immortality，长生不老药。找药的人，找到了爆炸物。", "start": 48.79, "dur": 8.62}, {"i": 8, "role": "B", "text": "课本还补了一句：元代火药制法传到阿拉伯和欧洲，武器和战法同时被改写。记个搭配：spark a revolution，引发一场革命。", "start": 57.68, "dur": 12.14}, {"i": 9, "role": "A", "text": "第二个词，中国空间站，China Space Station。space 是太空，station 是站，它是长期驻留的，不是一次性飞船。", "start": 70.11, "dur": 10.94}, {"i": 10, "role": "B", "text": "顺便说个用词变化：课本讲航天员时用 crewed spacecraft，不用 manned。crew 是全体乘员，比 man 中性。", "start": 81.33, "dur": 10.03}, {"i": 11, "role": "E", "text": "In recent years, China's space industry has entered the \"fast lane\" of innovative development, space infrastructure has been steadily advanced, and the China Space Station was fully completed in 2022.", "start": 91.64, "dur": 13.2}, {"i": 12, "role": "B", "text": "fully completed，2022 年全面建成。中文两个字“建成”，英文一个 complete 就够。", "start": 105.29, "dur": 7.8}, {"i": 13, "role": "A", "text": "第三个词，人工智能，artificial intelligence，缩写 AI。", "start": 113.37, "dur": 4.92}, {"i": 14, "role": "B", "text": "artificial 是人造的，不等于 fake。fake 是假货，artificial 是中性的“非天然”。intelligence 是智能，别跟 information 混。", "start": 118.57, "dur": 11.54}, {"i": 15, "role": "E", "text": "The use of digital technology and artificial intelligence has greatly reduced labor costs and carbon emissions.", "start": 130.4, "dur": 7.8}, {"i": 16, "role": "B", "text": "课本讲天河三号超算时，也把人工智能列成它的应用领域。超算不是在算账，是在撑 AI。", "start": 138.65, "dur": 9.74}, {"i": 17, "role": "A", "text": "第四个词，船队，fleet。一艘船是 ship，一支船队才是 fleet，所以它天然带规模。", "start": 148.67, "dur": 9.24}, {"i": 18, "role": "E", "text": "From 1405 to 1433, sent by the emperors, he led the fleet on seven separate maritime expeditions to more than 30 countries and regions in Asia and Africa.", "start": 158.19, "dur": 2.88}, {"i": 19, "role": "B", "text": "郑和七下西洋。maritime expedition，海上远航。这句里没有 compass，但指南针是这件事的前提。", "start": 161.52, "dur": 10.18}, {"i": 20, "role": "A", "text": "fleet 现在也用于车队：a fleet of taxis。五个字母，本期最好记的一个词。", "start": 171.98, "dur": 6.6}, {"i": 21, "role": "B", "text": "第五个词，活字印刷，movable-type printing。坑在 type——它在这里不是“类型”，是活字、铅字。", "start": 178.86, "dur": 9.31}, {"i": 22, "role": "A", "text": "所以这个英文名几乎是一句解释：能搬动的字，拿来印。", "start": 188.45, "dur": 3.96}, {"i": 23, "role": "E", "text": "During the Song Dynasty, the Chinese inventor Bi Sheng invented movable-type printing, which ushered in a major revolution in the history of printing.", "start": 192.69, "dur": 9.62}, {"i": 24, "role": "A", "text": "usher in，开创、迎来，比 start 高级。课本还说，这比欧洲出现类似方法早大约四百年。", "start": 202.76, "dur": 9.65}, {"i": 25, "role": "B", "text": "最后一个词，瓷器，porcelain。这个词有故事：一般认为来自意大利语 porcellana，本义是一种贝壳，因为瓷器的釉面光泽像贝壳。", "start": 212.69, "dur": 12.14}, {"i": 26, "role": "A", "text": "所以它不是音译，是外国人看着它像什么，就起了什么名字。", "start": 225.11, "dur": 6.0}, {"i": 27, "role": "E", "text": "Porcelain is generally made from kaolin (高岭土)—a type of fine white clay—mixed with other materials.", "start": 231.39, "dur": 6.53}, {"i": 28, "role": "A", "text": "而 kaolin 反过来是音译，从景德镇高岭村的地名来。一个词是别人看我们，一个词是我们被直接搬走。", "start": 238.37, "dur": 10.34}, {"i": 29, "role": "B", "text": "补一句：英文小写的 china，就是瓷器。", "start": 249.0, "dur": 4.1}, {"i": 30, "role": "A", "text": "快问快答，三个词，老周你答英文。", "start": 253.38, "dur": 3.96}, {"i": 31, "role": "B", "text": "来。", "start": 257.62, "dur": 1.58}, {"i": 32, "role": "A", "text": "火药。", "start": 259.48, "dur": 1.37}, {"i": 33, "role": "B", "text": "gunpowder。", "start": 261.13, "dur": 1.82}, {"i": 34, "role": "A", "text": "活字印刷。", "start": 263.24, "dur": 1.75}, {"i": 35, "role": "B", "text": "movable-type printing。", "start": 265.27, "dur": 2.54}, {"i": 36, "role": "A", "text": "船队。", "start": 268.09, "dur": 1.34}, {"i": 37, "role": "B", "text": "fleet。", "start": 269.72, "dur": 1.75}, {"i": 38, "role": "A", "text": "真题连线。2024 年 12 月六级：中国航天进入创新发展“快车道”，太空基础设施建设稳步推进，中国空间站于 2022 年全面建成。", "start": 271.75, "dur": 14.23}, {"i": 39, "role": "B", "text": "三个动作全是关键：enter the \"fast lane\" of innovative development，be steadily advanced，be fully completed。", "start": 286.26, "dur": 8.47}, {"i": 40, "role": "A", "text": "2025 年 6 月还考了天宫：天宫空间站是中国首个太空实验室，可驻留 3 名航天员。", "start": 295.01, "dur": 9.02}, {"i": 41, "role": "B", "text": "可驻留译成 accommodate，一个动词解决。所以空间站这个词，考的不是词汇量，是动词选得准不准。", "start": 304.32, "dur": 10.2}, {"i": 42, "role": "A", "text": "今天六个词：火药 gunpowder、中国空间站 China Space Station、人工智能 artificial intelligence、船队 fleet、活字印刷 movable-type printing、瓷器 porcelain。", "start": 314.8, "dur": 13.8}, {"i": 43, "role": "B", "text": "回到开场：为什么炼丹炼出了炸药？", "start": 328.88, "dur": 3.91}, {"i": 44, "role": "A", "text": "因为火药本来是“药”。求长生的人一直在调配方，配方里正好有硝石、硫磺和木炭。意外只奖励一直在试的人。", "start": 333.07, "dur": 11.66}, {"i": 45, "role": "B", "text": "下一期，体育。我们从“功夫”这个词说起。", "start": 345.01, "dur": 4.73}, {"i": 46, "role": "A", "text": "这里是词汇电台，我们下期见。", "start": 350.02, "dur": 3.43}]}, "6": {"ch": 6, "title": "体育", "en": "Sports", "episode": 6, "hook": "功夫和 martial arts，到底是不是一个东西？", "words": [{"zh": "中国武术", "en": "Chinese martial arts", "note": "martial 出自战神"}, {"zh": "太极拳", "en": "Taijiquan", "note": "教材写 tai chi"}, {"zh": "功夫", "en": "kung fu", "note": "英语里只是俗称"}, {"zh": "自卫", "en": "self-defense", "note": "美式 s，英式 c"}, {"zh": "信息技术", "en": "information technology", "note": "不可数，别加 s"}, {"zh": "老年人", "en": "the elderly", "note": "the 加形容词指一群人"}], "total": 361.5, "segs": [{"i": 0, "role": "A", "text": "这里是《中国文化概况》词汇电台，第六期：体育。", "start": 0.0, "dur": 5.18}, {"i": 1, "role": "B", "text": "我是老周。", "start": 5.46, "dur": 1.92}, {"i": 2, "role": "A", "text": "我是小夏。这一期的词，一半跟“打”有关，一半跟“练”有关。", "start": 7.66, "dur": 6.38}, {"i": 3, "role": "B", "text": "开场一个问题：功夫和 martial arts，到底是不是一个东西？", "start": 14.33, "dur": 5.18}, {"i": 4, "role": "A", "text": "听完你会发现，答案比想象中绕。第一个词，中国武术——martial 来自罗马战神 Mars，本义是尚武的、军事的。", "start": 19.79, "dur": 10.99}, {"i": 5, "role": "B", "text": "所以它字面是“战神的技艺”，不是打人术。还有，martial arts 永远用复数，因为它是多种拳种的总称。", "start": 31.06, "dur": 10.34}, {"i": 6, "role": "E", "text": "Among traditional Chinese physical activities, martial arts are arguably the most representative and typical.", "start": 41.69, "dur": 7.61}, {"i": 7, "role": "B", "text": "arguably，可以说、大概。学术写作常用它把话说得留有余地。", "start": 49.75, "dur": 6.86}, {"i": 8, "role": "A", "text": "第二个词，太极拳。这个词有三个英文说法。", "start": 56.89, "dur": 5.3}, {"i": 9, "role": "B", "text": "真题和规范译名用 Taijiquan，拼音直写；教材用 tai chi chuan，老式拼法；英语世界最常说 tai chi。一个词三种写法，说明它出国的路走了不止一条。", "start": 62.47, "dur": 14.42}, {"i": 10, "role": "E", "text": "Tai chi chuan is a popular school of Chinese martial arts characterised by slow and gentle movements that are designed for self-defence, physical strengthening, and the promotion of health.", "start": 77.18, "dur": 11.71}, {"i": 11, "role": "A", "text": "这里的 school 不是学校，是流派；characterised by 是以什么为特点。", "start": 89.34, "dur": 6.46}, {"i": 12, "role": "B", "text": "后面三个目的：自卫、强身、养生。所以它一开始不是养生操。课本还说，2008 年北京奥运开幕式，2008 个人穿白衣打太极。", "start": 96.08, "dur": 14.23}, {"i": 13, "role": "A", "text": "第三个词，功夫，kung fu。课本有一句原话。", "start": 110.59, "dur": 5.06}, {"i": 14, "role": "E", "text": "Martial arts can also be referred to as kung fu.", "start": 115.93, "dur": 3.91}, {"i": 15, "role": "B", "text": "be referred to as，也可以叫。所以课本的答案是：可以互指。", "start": 120.29, "dur": 6.46}, {"i": 16, "role": "A", "text": "但真题写得更准：功夫是中国武术的俗称。a common name for，一个 common 就把“俗称”说清了。", "start": 127.03, "dur": 8.86}, {"i": 17, "role": "B", "text": "还有一层：功夫本义是“工夫”，花的力气、练出来的本事。所以 kung fu 本来更宽，进了英语反而变窄。", "start": 136.17, "dur": 9.91}, {"i": 18, "role": "A", "text": "第四个词，自卫，self-defense。美式用 s，英式 self-defence 用 c。课本是英式，真题是美式，都对。", "start": 146.36, "dur": 9.48}, {"i": 19, "role": "E", "text": "The origin of Chinese martial arts can be traced back to the need for self-defense, hunting activities, and the military training of ancient China.", "start": 156.12, "dur": 9.36}, {"i": 20, "role": "B", "text": "三个来源并列：自卫、狩猎、军事训练。trace back to，追溯到。武术不是凭空来的，是活下去的需要。", "start": 165.93, "dur": 11.16}, {"i": 21, "role": "A", "text": "课本还有一句更东方的说法：武术存在的意义是止冲突，而不是起冲突。止戈为武，英文也能讲得这么直白。", "start": 177.37, "dur": 11.04}, {"i": 22, "role": "B", "text": "第五个词，信息技术，information technology，缩写 IT。technology 在这里不可数，加 s 就变成“多种技术门类”。", "start": 188.69, "dur": 10.61}, {"i": 23, "role": "E", "text": "Many sports venues have greatly improved their service quality through the application of modern information technology.", "start": 199.58, "dur": 7.63}, {"i": 24, "role": "B", "text": "through the application of，通过应用；service quality，服务质量。", "start": 207.66, "dur": 6.17}, {"i": 25, "role": "A", "text": "sports venues 是体育馆、场地。venue 不只指体育场，演出场地也叫 venue。在线订场地，就是 book venues online。", "start": 214.11, "dur": 11.76}, {"i": 26, "role": "B", "text": "最后一个词，老年人，the elderly。英文没有这个名词，它用 the 加形容词指一群人：the elderly、the young、the rich。", "start": 226.15, "dur": 3.24}, {"i": 27, "role": "A", "text": "elderly 也比 old 委婉，正式场合都用它。", "start": 229.67, "dur": 4.49}, {"i": 28, "role": "E", "text": "It is one of the traditional Chinese sports, and it is practiced by both young and old people.", "start": 234.43, "dur": 6.19}, {"i": 29, "role": "A", "text": "这是真题原句：年轻人和老年人都练。口语说 young and old people 就够，写作换 the elderly 更稳。", "start": 241.08, "dur": 9.58}, {"i": 30, "role": "B", "text": "课本讲全民健身，说清晨公园里练拳、跳舞的多半是老人。8 月 8 日是全民健身日，取自 2008 年北京奥运。", "start": 250.93, "dur": 11.18}, {"i": 31, "role": "A", "text": "快问快答，三个词，老周你答英文。", "start": 262.4, "dur": 3.96}, {"i": 32, "role": "B", "text": "来。", "start": 266.64, "dur": 1.58}, {"i": 33, "role": "A", "text": "太极拳，用真题那个拼法。", "start": 268.5, "dur": 3.12}, {"i": 34, "role": "B", "text": "Taijiquan。", "start": 271.9, "dur": 1.87}, {"i": 35, "role": "A", "text": "功夫。", "start": 274.05, "dur": 1.32}, {"i": 36, "role": "B", "text": "kung fu。", "start": 275.65, "dur": 0.36}, {"i": 37, "role": "A", "text": "自卫，美式拼写。", "start": 276.29, "dur": 2.45}, {"i": 38, "role": "B", "text": "self-defense。", "start": 279.02, "dur": 2.11}, {"i": 39, "role": "A", "text": "真题连线。2016 年 6 月四级：功夫是中国武术的俗称。", "start": 281.41, "dur": 6.67}, {"i": 40, "role": "B", "text": "Kung Fu is a common name for Chinese martial arts。一个 common name，把“俗称”解决了。", "start": 288.36, "dur": 7.15}, {"i": 41, "role": "A", "text": "同一套还有一句：中国武术的起源可以追溯到自卫的需要、狩猎活动和古代中国的军事训练。", "start": 295.8, "dur": 9.1}, {"i": 42, "role": "B", "text": "be traced back to the need for self-defense, hunting activities, and the military training。三个并列，一个动词串起来。2018 年那道体育馆的题也是这个路数——考的是全民健身的现代化，不只是打拳。", "start": 305.17, "dur": 17.02}, {"i": 43, "role": "A", "text": "今天六个词：中国武术 Chinese martial arts、太极拳 Taijiquan、功夫 kung fu、自卫 self-defense、信息技术 information technology、老年人 the elderly。", "start": 322.47, "dur": 13.73}, {"i": 44, "role": "B", "text": "回到开场：功夫和 martial arts 是不是一个东西？", "start": 336.48, "dur": 4.49}, {"i": 45, "role": "A", "text": "课本的答案是：可以互指。但一个是外面看我们的眼光，一个是我们自己的说法。词相同，视角不同。", "start": 341.24, "dur": 10.46}, {"i": 46, "role": "B", "text": "下一期，传统节日。我们从过年说起。", "start": 351.99, "dur": 4.85}, {"i": 47, "role": "A", "text": "这里是词汇电台，我们下期见。", "start": 357.12, "dur": 3.43}]}, "7": {"ch": 7, "title": "传统节日", "en": "Traditional Festivals", "episode": 7, "hook": "过年吃鱼，为什么一定要剩下一条？", "words": [{"zh": "春节", "en": "Spring Festival", "note": "中国最重要的传统节日"}, {"zh": "农历", "en": "the lunar calendar", "note": "lunar 月，solar 日"}, {"zh": "中秋节", "en": "Mid-Autumn Festival", "note": "少了 Mid 就成秋天"}, {"zh": "习俗", "en": "custom", "note": "习俗有复数 customs"}, {"zh": "年年有余", "en": "may you have surplus year after year", "note": "鱼与余同音，祝福语"}, {"zh": "饺子", "en": "jiaozi", "note": "音译优先，不吃亏"}], "total": 399.4, "segs": [{"i": 0, "role": "A", "text": "这里是《中国文化概况》词汇电台，第七期：传统节日。", "start": 0.0, "dur": 5.78}, {"i": 1, "role": "B", "text": "我是老周。", "start": 6.06, "dur": 1.92}, {"i": 2, "role": "A", "text": "我是小夏。今天六个词，全都跟过节有关。中国人一年到头的团圆，就藏在这六个词里。", "start": 8.26, "dur": 9.38}, {"i": 3, "role": "B", "text": "开场先抛一个问题：过年吃鱼，为什么一定要剩下一条？", "start": 17.93, "dur": 5.71}, {"i": 4, "role": "A", "text": "答案不在厨房，在谐音里。悬念留到最后。先看第一个词，春节。", "start": 23.92, "dur": 7.7}, {"i": 5, "role": "A", "text": "春节，英文 Spring Festival，也可以说 Chinese New Year。它是中国最重要的传统节日。", "start": 31.9, "dur": 8.23}, {"i": 6, "role": "B", "text": "注意 Festival 首字母大写，节日是专名。这里不用 Spring Holiday，holiday 是假日，festival 才是节日。", "start": 40.42, "dur": 10.27}, {"i": 7, "role": "A", "text": "课本原句。", "start": 50.97, "dur": 1.7}, {"i": 8, "role": "E", "text": "The Spring Festival, also called the Chinese New Year, is China's most important traditional festival, falling on the first day of the first lunar month each year.", "start": 52.95, "dur": 10.37}, {"i": 9, "role": "B", "text": "一句话里三个要点：most important、first day、first lunar month。农历正月初一，全在这一句里。", "start": 63.77, "dur": 9.65}, {"i": 10, "role": "A", "text": "第二个词，农历，the lunar calendar。", "start": 73.7, "dur": 3.58}, {"i": 11, "role": "B", "text": "lunar 是月亮的，罗马神话里的月神叫 Luna。所以农历是按月相算的。阳历叫 solar calendar，solar 是太阳。", "start": 77.55, "dur": 10.78}, {"i": 12, "role": "A", "text": "课本里有一句很实用的。", "start": 88.61, "dur": 2.69}, {"i": 13, "role": "E", "text": "The Spring Festival activities start in the early days of the 12th lunar month and continue until about the middle of the first lunar month of the following year.", "start": 91.58, "dur": 9.65}, {"i": 14, "role": "B", "text": "腊月初就开始忙年，一直忙到正月十五。start in 加 continue until，这个时间跨度句式写作文很好用。", "start": 101.68, "dur": 10.25}, {"i": 15, "role": "A", "text": "第三个词，中秋节，Mid-Autumn Festival。", "start": 112.2, "dur": 4.13}, {"i": 16, "role": "B", "text": "这里有个小陷阱：Autumn 前面必须加 Mid。少了 Mid，就只是秋天，不是中秋。中秋是秋天的中间那段。", "start": 116.61, "dur": 10.08}, {"i": 17, "role": "A", "text": "课本原句。", "start": 126.97, "dur": 1.7}, {"i": 18, "role": "E", "text": "The Mid-Autumn Festival falls on the fifteenth day of the eighth lunar month.", "start": 128.96, "dur": 5.18}, {"i": 19, "role": "B", "text": "节日说日期用 fall on，不用 is on。月饼是 mooncakes，象征团圆 reunion 与和谐 harmony。fall on 加农历日期，这个组合值得整句背。", "start": 134.59, "dur": 13.37}, {"i": 20, "role": "A", "text": "第四个词，习俗，custom。", "start": 148.24, "dur": 3.29}, {"i": 21, "role": "B", "text": "custom 是风俗，讲多种习俗时用复数 customs。别用 habit，habit 是个人习惯。客户 customer 同源，本义是惯常来往的人。", "start": 151.81, "dur": 12.96}, {"i": 22, "role": "A", "text": "课本原句。", "start": 165.05, "dur": 1.7}, {"i": 23, "role": "E", "text": "As time passed, these customs spread far and wide and have been passed down through the generations.", "start": 167.03, "dur": 6.62}, {"i": 24, "role": "B", "text": "一句里两个好表达：spread far and wide 传播很广，be passed down through the generations 代代相传。清明扫墓、端午赛舟，都能套这句。", "start": 174.1, "dur": 11.54}, {"i": 25, "role": "A", "text": "第五个词，年年有余，英文 may you have surplus year after year。", "start": 185.93, "dur": 5.64}, {"i": 26, "role": "B", "text": "这是祝福语，所以用 may 开头。surplus 是盈余、剩余，不用 remaining。year after year 是一年又一年。", "start": 191.85, "dur": 10.51}, {"i": 27, "role": "A", "text": "为什么偏偏是鱼？因为鱼和余同音。课本专门解释了这个谐音。", "start": 202.64, "dur": 6.96}, {"i": 28, "role": "E", "text": "Dishes such as chicken, fish, and tofu are traditionally included, as their pronunciations are similar to the Chinese characters 吉 (jí), 余 (yú), and 福 (fú), which mean \"auspicious\", \"abundance\", and \"blessing\", respectively.", "start": 209.88, "dur": 15.1}, {"i": 29, "role": "B", "text": "鸡对吉，鱼对余，豆腐对福。三道菜，三个音，三份祝福。这桌饭吃的不是味道，是读音。", "start": 225.43, "dur": 10.82}, {"i": 30, "role": "A", "text": "所以那条鱼不能吃完。剩下的那一口，就是年年有余。", "start": 236.53, "dur": 6.05}, {"i": 31, "role": "B", "text": "最后一个词，饺子。英文不译 dumpling，直接写 jiaozi。", "start": 242.86, "dur": 6.79}, {"i": 32, "role": "A", "text": "为什么音译？因为 dumpling 在英语里泛指一切面皮包馅的东西，意大利饺、波兰饺都叫 dumpling，用它会丢掉更岁交子的意思。", "start": 249.93, "dur": 12.05}, {"i": 33, "role": "B", "text": "课本原句。", "start": 262.26, "dur": 2.02}, {"i": 34, "role": "E", "text": "In northern China, jiaozi (Chinese dumplings) are preferred as they are believed to represent bidding farewell to the old and welcoming the new.", "start": 264.55, "dur": 9.34}, {"i": 35, "role": "A", "text": "课本的写法很聪明：jiaozi 后面加括号注 Chinese dumplings。先音译，再解释，这是文化词最稳的译法。", "start": 274.34, "dur": 10.82}, {"i": 36, "role": "B", "text": "再补一句：jiaozi 的形状像元宝 ingot，所以还象征财富。", "start": 285.44, "dur": 6.5}, {"i": 37, "role": "A", "text": "快问快答。老周，三个词，你答英文。", "start": 292.23, "dur": 4.85}, {"i": 38, "role": "B", "text": "来。", "start": 297.36, "dur": 1.58}, {"i": 39, "role": "A", "text": "农历。", "start": 299.22, "dur": 1.32}, {"i": 40, "role": "B", "text": "the lunar calendar。", "start": 300.82, "dur": 2.3}, {"i": 41, "role": "A", "text": "习俗，注意复数。", "start": 303.4, "dur": 2.42}, {"i": 42, "role": "B", "text": "customs。", "start": 306.11, "dur": 1.85}, {"i": 43, "role": "A", "text": "饺子，用中国那个说法。", "start": 308.24, "dur": 2.81}, {"i": 44, "role": "B", "text": "jiaozi。", "start": 311.32, "dur": 1.9}, {"i": 45, "role": "A", "text": "再加一个：年年有余。", "start": 313.5, "dur": 2.74}, {"i": 46, "role": "B", "text": "may you have surplus year after year。", "start": 316.52, "dur": 3.38}, {"i": 47, "role": "A", "text": "最后一个环节：这些词在真题里长什么样。", "start": 320.18, "dur": 4.49}, {"i": 48, "role": "B", "text": "一道四级题：中国的春节、中秋节等传统节日的日期都基于农历。", "start": 324.95, "dur": 6.7}, {"i": 49, "role": "A", "text": "译文是 The dates of traditional Chinese festivals such as the Spring Festival and the Mid-Autumn Festival are all based on the lunar calendar.", "start": 331.92, "dur": 10.1}, {"i": 50, "role": "B", "text": "一句话考了本期三个词。主干是 dates are based on，such as 后面只是举例，别把例子当主干。", "start": 342.31, "dur": 9.14}, {"i": 51, "role": "A", "text": "还有一道考饺子：北方人有冬至吃饺子的习俗。这里的习俗是 the custom of eating，饺子照原卷写 jiaozi，不吃亏。", "start": 351.73, "dur": 11.69}, {"i": 52, "role": "A", "text": "今天六个词：春节 Spring Festival、农历 the lunar calendar、中秋节 Mid-Autumn Festival、习俗 custom、年年有余 may you have surplus year after year、饺子 jiaozi。", "start": 363.7, "dur": 14.23}, {"i": 53, "role": "B", "text": "回到开场：鱼为什么剩下一条？因为那个余字得留在桌上，说出来，才叫年年有余。", "start": 378.21, "dur": 8.64}, {"i": 54, "role": "A", "text": "下一期，饮食文化。我们从一道菜为什么讲究色、香、味说起。", "start": 387.13, "dur": 7.13}, {"i": 55, "role": "B", "text": "这里是词汇电台，我们下期见。", "start": 394.54, "dur": 3.6}]}, "8": {"ch": 8, "title": "饮食文化", "en": "Food Culture", "episode": 8, "hook": "为什么英文里的 black tea，是红茶，不是黑茶？", "words": [{"zh": "香味", "en": "aroma", "note": "色香味的中间那个"}, {"zh": "口感", "en": "taste", "note": "说质地要用 texture"}, {"zh": "配料", "en": "ingredients", "note": "配料永远复数"}, {"zh": "火锅", "en": "hotpot", "note": "hot 加 pot，一口热锅"}, {"zh": "绿茶", "en": "green tea", "note": "black tea 不是黑茶"}, {"zh": "餐桌礼仪", "en": "table manners", "note": "礼仪必用复数 manners"}], "total": 386.9, "segs": [{"i": 0, "role": "A", "text": "这里是《中国文化概况》词汇电台，第八期：饮食文化。", "start": 0.0, "dur": 5.69}, {"i": 1, "role": "B", "text": "我是老周。", "start": 5.97, "dur": 1.92}, {"i": 2, "role": "A", "text": "我是小夏。今天六个词，全都摆在饭桌上。聊完这六个词，你就懂了中国菜为什么讲究。", "start": 8.17, "dur": 9.38}, {"i": 3, "role": "B", "text": "开场先问一个问题：为什么英文里的 black tea，是红茶，不是黑茶？", "start": 17.83, "dur": 6.7}, {"i": 4, "role": "A", "text": "这个答案，要留到第五个词。先说第一个词，香味。", "start": 24.81, "dur": 5.74}, {"i": 5, "role": "A", "text": "香味，英文 aroma。它专指鼻子闻到的、让人有食欲的香，比 smell 讲究，又比 fragrance 更常用于食物。", "start": 30.82, "dur": 10.3}, {"i": 6, "role": "B", "text": "中餐评价有三个字：色、香、味，对应 colour、aroma、taste。三个词排一排，aroma 正好在中间。", "start": 41.4, "dur": 10.87}, {"i": 7, "role": "A", "text": "课本原句。", "start": 52.55, "dur": 1.7}, {"i": 8, "role": "E", "text": "In general, Chinese cooking is evaluated according to three essential criteria: colour, aroma, and taste, which should exist in harmony and balance.", "start": 54.54, "dur": 10.46}, {"i": 9, "role": "B", "text": "evaluated according to 是按什么来评价，criteria 是标准，单数是 criterion。这一句可以直接背，聊任何饮食话题都用得上。", "start": 65.45, "dur": 3.0}, {"i": 10, "role": "A", "text": "第二个词，口感。课本给的英文是 taste。", "start": 68.73, "dur": 4.85}, {"i": 11, "role": "B", "text": "但这里有一条界线要划清：口语里说的口感，很多时候指的是质地，英文是 texture。真题里颜色、味道、口感和营养，口感就译成 texture。", "start": 73.86, "dur": 13.94}, {"i": 12, "role": "A", "text": "课本也说了，taste 不只是味道，还包括质地和调味。", "start": 88.08, "dur": 5.47}, {"i": 13, "role": "E", "text": "Taste encompasses not only the flavour of the food itself, but also its texture and the use of seasonings (调味品).", "start": 93.83, "dur": 7.3}, {"i": 14, "role": "B", "text": "encompass 是包含，比 include 正式。flavour 是风味，texture 是质地，seasonings 是调味品。一句话三个考点。", "start": 101.58, "dur": 11.04}, {"i": 15, "role": "A", "text": "第三个词，配料，ingredients。", "start": 112.9, "dur": 3.53}, {"i": 16, "role": "B", "text": "它一般用复数，因为配料从来不止一样。单数 ingredient 指的是成分、要素，写议论文时也用得上。", "start": 116.71, "dur": 9.98}, {"i": 17, "role": "A", "text": "课本原句。", "start": 126.97, "dur": 1.7}, {"i": 18, "role": "E", "text": "People are mindful of combining different ingredients to achieve a harmonious balance of flavours and colours.", "start": 128.96, "dur": 6.98}, {"i": 19, "role": "B", "text": "be mindful of 是讲究，比 pay attention to 雅。中餐配料的逻辑不是堆料，是求和：荤素、浓淡、冷暖，都往平衡上凑。", "start": 136.39, "dur": 12.6}, {"i": 20, "role": "A", "text": "第四个词，火锅，hotpot。", "start": 149.27, "dur": 3.26}, {"i": 21, "role": "B", "text": "两个词拼起来：hot 加热，pot 是锅。这是直译，但英语世界已经认了 hotpot，不用另造 fire pot。", "start": 152.81, "dur": 10.06}, {"i": 22, "role": "A", "text": "课本讲川菜，第一道菜点的就是火锅。", "start": 163.15, "dur": 4.22}, {"i": 23, "role": "E", "text": "Typical dishes of Sichuan cuisine include hotpot (火锅), twice-cooked pork slices (回锅肉), spicy diced chicken with peanuts (宫保鸡丁), fish-flavoured pork shreds (鱼香肉丝), and mapo tofu (麻婆豆腐).", "start": 167.65, "dur": 10.97}, {"i": 24, "role": "B", "text": "回锅肉是 twice-cooked，直译煮两次；鱼香肉丝里没有鱼，只能译成 fish-flavoured pork shreds；麻婆豆腐干脆音译。", "start": 179.07, "dur": 9.86}, {"i": 25, "role": "A", "text": "火锅的文化点不在吃，在一起吃。一口锅，谁都能下筷子。", "start": 189.22, "dur": 6.43}, {"i": 26, "role": "A", "text": "第五个词，绿茶，green tea。", "start": 195.93, "dur": 3.17}, {"i": 27, "role": "B", "text": "越简单的词越有坑。中国茶分六类，红茶是 black tea，黑茶是 dark tea。所以英文的 black tea 不是黑茶。", "start": 199.38, "dur": 10.82}, {"i": 28, "role": "A", "text": "课本原句，把六类一次念完。", "start": 210.48, "dur": 3.22}, {"i": 29, "role": "E", "text": "According to processing methods and flavours, it is generally divided into six main categories: green tea (绿茶), white tea (白茶), yellow tea (黄茶), oolong tea (乌龙茶), black tea (红茶), and dark tea (黑茶).", "start": 213.98, "dur": 12.14}, {"i": 30, "role": "B", "text": "记住这一句就够：英文看茶汤的颜色，中国人看干茶的颜色。红茶泡出来深红，外国人看成黑，于是红茶叫 black tea，黑茶只好另叫 dark tea。", "start": 226.57, "dur": 13.18}, {"i": 31, "role": "A", "text": "开场那个问题到此有答案了：black tea 是红茶，dark tea 才是黑茶。", "start": 240.03, "dur": 6.62}, {"i": 32, "role": "B", "text": "至于绿茶，它最简单：不发酵，unfermented，最接近茶叶本来的样子，历史也最长。", "start": 246.93, "dur": 8.16}, {"i": 33, "role": "A", "text": "最后一个词，餐桌礼仪，table manners。", "start": 255.37, "dur": 4.06}, {"i": 34, "role": "B", "text": "manner 单数是方式，复数是礼貌、规矩。所以讲礼仪一定要用 manners，落下一个 s 就不是那个意思了。", "start": 259.71, "dur": 9.58}, {"i": 35, "role": "A", "text": "课本原句。", "start": 269.56, "dur": 1.7}, {"i": 36, "role": "E", "text": "Although some rules and habits have evolved over time, the essence of traditional Chinese table manners—respect, courtesy, and harmony—remains valued and upheld.", "start": 271.55, "dur": 11.09}, {"i": 37, "role": "B", "text": "三个关键词：respect、courtesy、harmony，敬、礼、和。句式也好用：although 让步开头，主句落在 remains valued and upheld，至今仍被看重、被遵守。", "start": 283.08, "dur": 15.0}, {"i": 38, "role": "A", "text": "座次、动筷的先后、给客人夹菜，都是这套礼仪的动作。", "start": 298.36, "dur": 2.52}, {"i": 39, "role": "A", "text": "快问快答。老周，英文。", "start": 301.16, "dur": 3.58}, {"i": 40, "role": "B", "text": "来。", "start": 305.02, "dur": 1.58}, {"i": 41, "role": "A", "text": "香味。", "start": 306.88, "dur": 1.34}, {"i": 42, "role": "B", "text": "aroma。", "start": 308.51, "dur": 1.73}, {"i": 43, "role": "A", "text": "配料。", "start": 310.52, "dur": 1.34}, {"i": 44, "role": "B", "text": "ingredients，复数。", "start": 312.14, "dur": 2.66}, {"i": 45, "role": "A", "text": "黑茶。", "start": 315.08, "dur": 1.37}, {"i": 46, "role": "B", "text": "dark tea。红茶是 black tea，别弄反。", "start": 316.73, "dur": 4.61}, {"i": 47, "role": "A", "text": "餐桌礼仪。", "start": 321.62, "dur": 1.75}, {"i": 48, "role": "B", "text": "table manners。", "start": 323.65, "dur": 2.06}, {"i": 49, "role": "A", "text": "真题连线。", "start": 326.0, "dur": 1.75}, {"i": 50, "role": "B", "text": "一道四级题：但好的烹饪都有一个共同点，总是要考虑到颜色、味道、口感和营养。", "start": 328.03, "dur": 8.23}, {"i": 51, "role": "A", "text": "译文是 But all good cooking shares one thing in common: it always takes color, taste, texture and nutrition into account.", "start": 336.54, "dur": 9.14}, {"i": 52, "role": "B", "text": "share one thing in common 是有一个共同点，take into account 是考虑到。这里口感是 texture，不是 taste，正好印证刚才那条界线。", "start": 345.96, "dur": 2.64}, {"i": 53, "role": "A", "text": "还有一道六级题考宴席：中国宴席上典型的菜单包括开席的一套凉菜及其后的热菜。凉菜是 cold dishes，上菜的顺序本身就是礼仪。", "start": 348.88, "dur": 7.56}, {"i": 54, "role": "A", "text": "今天六个词：香味 aroma、口感 taste、配料 ingredients、火锅 hotpot、绿茶 green tea、餐桌礼仪 table manners。", "start": 356.72, "dur": 10.8}, {"i": 55, "role": "B", "text": "回到开场：black tea 是红茶，dark tea 是黑茶。名字是别人起的，颜色是别人看的。", "start": 367.8, "dur": 8.59}, {"i": 56, "role": "A", "text": "下一期，服饰与装饰。我们从一根丝说起。", "start": 376.68, "dur": 4.99}, {"i": 57, "role": "B", "text": "这里是词汇电台，我们下期见。", "start": 381.95, "dur": 3.6}]}, "9": {"ch": 9, "title": "服饰与装饰", "en": "Clothing and Adornments", "episode": 9, "hook": "如果你穿越回宋朝，穿错颜色会被抓吗？", "words": [{"zh": "丝绸", "en": "silk", "note": "中国独有很久，后来走丝路"}, {"zh": "蚕神", "en": "Goddess of Silkworms", "note": "silk 加 worm，就是蚕"}, {"zh": "宋朝", "en": "Song Dynasty", "note": "朝代名必带 Dynasty"}, {"zh": "袖口", "en": "cuff", "note": "三粒扣，三民主义"}, {"zh": "长袍", "en": "long robe", "note": "robe 是袍，礼服 gown"}, {"zh": "苏绣", "en": "Su embroidery", "note": "地名加绣种，四大名绣"}], "total": 345.1, "segs": [{"i": 0, "role": "A", "text": "这里是《中国文化概况》词汇电台，第九期：服饰与装饰。", "start": 0.0, "dur": 6.0}, {"i": 1, "role": "B", "text": "我是老周。", "start": 6.28, "dur": 1.92}, {"i": 2, "role": "A", "text": "我是小夏。今天六个词，从一根丝、一件袍子，到一只袖口，把中国人穿在身上的东西聊一遍。", "start": 8.48, "dur": 9.7}, {"i": 3, "role": "B", "text": "开场先问：如果你穿越回宋朝，穿错颜色会被抓吗？", "start": 18.46, "dur": 5.64}, {"i": 4, "role": "A", "text": "会。答案在第三个词。先说第一个词，丝绸。", "start": 24.38, "dur": 6.02}, {"i": 5, "role": "A", "text": "丝绸，silk。它是中国给世界的一份礼，也是英语里少数直接接过汉语血脉的词。", "start": 30.68, "dur": 2.64}, {"i": 6, "role": "B", "text": "silk 这个词一路从希腊语、拉丁语传过去，源头就是丝。同一条路上的还有 sericulture，养蚕业。", "start": 33.6, "dur": 10.3}, {"i": 7, "role": "A", "text": "课本原句。", "start": 44.18, "dur": 1.7}, {"i": 8, "role": "E", "text": "As a Chinese invention, silk was produced and used exclusively in China for a long period.", "start": 46.16, "dur": 6.6}, {"i": 9, "role": "B", "text": "exclusively 是专有地、独占地。很长一段时间里，只有中国会做丝。后来才有丝绸之路 Silk Road，把一件家事变成世界贸易。", "start": 53.21, "dur": 12.7}, {"i": 10, "role": "A", "text": "第二个词，蚕神，Goddess of Silkworms。", "start": 66.19, "dur": 4.03}, {"i": 11, "role": "B", "text": "silkworm 拆开就是 silk 加 worm，蚕。Goddess 是女神，god 的阴性形式，首字母大写，因为它是神名。", "start": 70.5, "dur": 10.51}, {"i": 12, "role": "A", "text": "课本记了两个版本。官方传说里，蚕丝是黄帝的妻子嫘祖偶然发现的。", "start": 81.29, "dur": 7.3}, {"i": 13, "role": "E", "text": "One official legend regarding the discovery of silk is that Huangdi's wife, Leizu (嫘祖), discovered it by chance.", "start": 88.87, "dur": 7.63}, {"i": 14, "role": "B", "text": "by chance 是偶然。民间版本更离奇：马头娘，Horse-Head Goddess，一个姑娘和一张马皮的故事。", "start": 96.95, "dur": 9.17}, {"i": 15, "role": "A", "text": "一个管种桑养蚕，一个被农家供奉。同一件事，官方讲发明，民间讲恩情。", "start": 106.4, "dur": 8.26}, {"i": 16, "role": "A", "text": "第三个词，宋朝，Song Dynasty。", "start": 114.93, "dur": 3.58}, {"i": 17, "role": "B", "text": "朝代名一律加 Dynasty，首字母大写。宋代服饰的味道，课本用了两个词：calm 和 unworldly，安静、出尘。", "start": 118.79, "dur": 10.49}, {"i": 18, "role": "A", "text": "课本原句。", "start": 129.56, "dur": 1.7}, {"i": 19, "role": "E", "text": "Song clothing embodied an ideal unique to its people—a calm, unworldly elegance reminiscent of hermits and cultivated gentlemen at ease in nature.", "start": 131.54, "dur": 10.1}, {"i": 20, "role": "B", "text": "embody 是体现，reminiscent of 是让人想起，hermit 是隐士。一句话把宋人的审美说透了：不张扬的雅。", "start": 142.09, "dur": 10.22}, {"i": 21, "role": "A", "text": "回到开场的颜色问题。宋代官员的衣服，面料、颜色、花纹都严格规定，品级不同，穿的就不同。穿错，是要出事的。", "start": 152.6, "dur": 11.16}, {"i": 22, "role": "A", "text": "第四个词，袖口，cuff。", "start": 164.04, "dur": 3.1}, {"i": 23, "role": "B", "text": "cuff 是袖子最下面那一圈。裤脚卷边也叫 cuff，所以动词 to cuff 就是卷起来。", "start": 167.41, "dur": 7.97}, {"i": 24, "role": "A", "text": "中式服装的袖口从来不只是一块布，它上面带符号。中山装最典型。", "start": 175.66, "dur": 7.49}, {"i": 25, "role": "E", "text": "The three buttons on each cuff (袖口) symbolise the Three Principles of the People (三民主义)—the Principle of Nationalism (民族主义), the Principle of Democracy (民权主义), and the Principle of the People's Livelihood (民生主义).", "start": 183.43, "dur": 0.84}, {"i": 26, "role": "B", "text": "三粒扣，三民主义。中山装四个口袋是四德，门襟五粒扣是五权，袖口三粒扣是三民。一件衣服，穿了一整套政治理想。", "start": 184.72, "dur": 13.06}, {"i": 27, "role": "A", "text": "第五个词，长袍，long robe。", "start": 198.06, "dur": 3.22}, {"i": 28, "role": "B", "text": "robe 是宽松的长外衣，gown 偏礼服、长裙。中文一个袍字，英文要分两种场合，这就是译名的分寸。", "start": 201.55, "dur": 10.03}, {"i": 29, "role": "A", "text": "课本写的是蒙古族服饰。", "start": 211.86, "dur": 2.86}, {"i": 30, "role": "E", "text": "Both Mongolian men and women wear long robes, though women's robes in some regions are designed to be more form-fitting.", "start": 215.0, "dur": 1.44}, {"i": 31, "role": "B", "text": "form-fitting 是贴身的，though 让步。蒙古袍配腰带、靴子、刀和火镰，是骑马生活长出来的样子。", "start": 216.89, "dur": 9.62}, {"i": 32, "role": "A", "text": "最后一个词，苏绣，Su embroidery。", "start": 226.79, "dur": 3.84}, {"i": 33, "role": "B", "text": "embroidery 是刺绣，embroider 是动词。前面加地名，就是绣种：苏绣 Su embroidery、蜀绣 Shu embroidery、湘绣 Xiang embroidery、粤绣 Yue embroidery。", "start": 230.91, "dur": 1.92}, {"i": 34, "role": "A", "text": "课本原句。", "start": 233.11, "dur": 1.7}, {"i": 35, "role": "E", "text": "The four most famous regional types of embroidery in China are Shu embroidery (蜀绣) from Sichuan, Su embroidery (苏绣) from Suzhou, Xiang embroidery (湘绣) from Hunan, and Yue embroidery (粤绣) from Guangdong.", "start": 235.1, "dur": 13.13}, {"i": 36, "role": "B", "text": "四个绣种，四个产地：蜀是四川，苏是苏州，湘是湖南，粤是广东。苏绣针法四十多种，最出名的是双面绣。", "start": 248.68, "dur": 5.4}, {"i": 37, "role": "A", "text": "快问快答。老周，英文。", "start": 254.36, "dur": 3.58}, {"i": 38, "role": "B", "text": "来。", "start": 258.21, "dur": 1.58}, {"i": 39, "role": "A", "text": "丝绸。", "start": 260.08, "dur": 1.42}, {"i": 40, "role": "B", "text": "silk。", "start": 261.77, "dur": 1.73}, {"i": 41, "role": "A", "text": "蚕神。", "start": 263.78, "dur": 1.37}, {"i": 42, "role": "B", "text": "Goddess of Silkworms。", "start": 265.43, "dur": 2.54}, {"i": 43, "role": "A", "text": "长袍。", "start": 268.25, "dur": 1.37}, {"i": 44, "role": "B", "text": "long robe。", "start": 269.9, "dur": 1.73}, {"i": 45, "role": "A", "text": "苏绣。", "start": 271.91, "dur": 1.42}, {"i": 46, "role": "B", "text": "Su embroidery。", "start": 273.6, "dur": 2.38}, {"i": 47, "role": "A", "text": "真题连线。", "start": 276.26, "dur": 1.75}, {"i": 48, "role": "B", "text": "一道六级题：在清代，旗袍是王室女性穿着的宽松长袍。", "start": 278.29, "dur": 6.36}, {"i": 49, "role": "A", "text": "译文是 During the Qing Dynasty, the qipao was a loose long gown worn by royal women.", "start": 284.93, "dur": 6.38}, {"i": 50, "role": "B", "text": "注意这里的长袍没有用 robe，用的是 long gown。因为旗袍在清代是袍，今天成了裙装，英语跟着场合换词。", "start": 291.6, "dur": 10.1}, {"i": 51, "role": "A", "text": "同一套题还有一句：很多中国新娘也会选择旗袍作为结婚礼服。礼服是 wedding dress，不叫 wedding clothes。", "start": 301.98, "dur": 10.49}, {"i": 52, "role": "A", "text": "今天六个词：丝绸 silk、蚕神 Goddess of Silkworms、宋朝 Song Dynasty、袖口 cuff、长袍 long robe、苏绣 Su embroidery。", "start": 312.75, "dur": 11.33}, {"i": 53, "role": "B", "text": "回到开场：穿错颜色会被抓吗？会。那身衣服不是审美，是秩序。", "start": 324.36, "dur": 8.42}, {"i": 54, "role": "A", "text": "下一期，中国传统建筑。我们看看中国人怎么用木头搭起一座城。", "start": 333.06, "dur": 6.91}, {"i": 55, "role": "B", "text": "这里是词汇电台，我们下期见。", "start": 340.25, "dur": 3.6}]}, "10": {"ch": 10, "title": "建筑", "en": "Architecture", "episode": 10, "hook": "为什么中国的大门口，总蹲着两只狮子？", "words": [{"zh": "赵州桥", "en": "Zhaozhou Bridge", "note": "地名命名，工匠无名"}, {"zh": "石狮", "en": "stone lions", "note": "卷发几个，主人几品"}, {"zh": "皇帝", "en": "the emperor", "note": "家国一体，家就是衙门"}, {"zh": "喇嘛教的", "en": "Lamaist", "note": "Lama 加 ist，只形容塔"}, {"zh": "四合院", "en": "siheyuan", "note": "四面合围，中间留院"}, {"zh": "亭", "en": "pavilion", "note": "亭者停也，歇脚之处"}], "total": 464.2, "segs": [{"i": 0, "role": "A", "text": "这里是《中国文化概况》词汇电台，第十期：建筑。", "start": 0.0, "dur": 5.3}, {"i": 1, "role": "B", "text": "我是老周。", "start": 5.58, "dur": 1.92}, {"i": 2, "role": "A", "text": "我是小夏。今天六个词，说的都是不会说话的东西：桥、狮子、塔、院子、亭子，还有一位皇帝。", "start": 7.78, "dur": 10.66}, {"i": 3, "role": "B", "text": "开场先问一句：为什么中国的大门口，总要蹲着两只狮子？", "start": 18.72, "dur": 5.69}, {"i": 4, "role": "A", "text": "悬念留到最后。先从一座活了一千四百年的桥说起，赵州桥。", "start": 24.69, "dur": 6.67}, {"i": 5, "role": "B", "text": "赵州桥在河北赵县，隋朝建成，公元六〇五年。设计它的人不是官，是个石匠，叫李春。", "start": 31.64, "dur": 5.76}, {"i": 6, "role": "A", "text": "英文是 Zhaozhou Bridge，也可以叫 Anji Bridge，安济桥。两个名字都对，但都要大写。", "start": 37.68, "dur": 8.52}, {"i": 7, "role": "B", "text": "有个细节值得注意：中国给建筑起名，习惯用地方，不用人。赵州是地名，李春反而被忘了。", "start": 46.48, "dur": 3.96}, {"i": 8, "role": "A", "text": "西方相反，圣彼得大教堂、埃菲尔铁塔，都记着人。中国的桥记地名，工匠是无名的。课本这句原话很有意思。", "start": 50.72, "dur": 11.81}, {"i": 9, "role": "E", "text": "Completed in the year 605 by the mason (石匠) Li Chun (李春), the Zhaozhou Bridge is 64.4 metres long.", "start": 62.81, "dur": 8.02}, {"i": 10, "role": "B", "text": "一句话三个点：completed in the year 605，被动加年份；mason 是石匠，不是木匠 carpenter；长度一律用 long。", "start": 71.27, "dur": 10.49}, {"i": 11, "role": "A", "text": "这道桥的本事在拱：一个大拱，两端各两个小拱，泄洪水、减重量、省石材。", "start": 82.04, "dur": 7.94}, {"i": 12, "role": "B", "text": "三个动词顺手记：discharge floodwater 泄洪，reduce the weight 减重，save stone 省石。所以它叫敞肩拱桥，欧洲出现类似设计，晚了七百多年。", "start": 90.27, "dur": 13.46}, {"i": 13, "role": "A", "text": "第二个词，石狮，stone lions。lion 要用复数，因为它们从来成对出现。", "start": 104.01, "dur": 7.54}, {"i": 14, "role": "B", "text": "门口的狮子不是装饰，是等级表。课本说得很直接：鬃毛上的卷，数量代表主人的品级。", "start": 111.83, "dur": 8.83}, {"i": 15, "role": "A", "text": "皇宫门口四十五个卷，官越小卷越少，七品以下不许摆狮子。", "start": 120.94, "dur": 6.5}, {"i": 16, "role": "E", "text": "Traditionally, the number of curls on a stone lion's mane indicated the owner's rank and status.", "start": 127.72, "dur": 6.72}, {"i": 17, "role": "B", "text": "记这句就记两个词：curls 卷发，rank and status 品级和地位。中国人把秩序刻在了石头上。", "start": 134.89, "dur": 9.02}, {"i": 18, "role": "A", "text": "第三个词，皇帝，the emperor。为什么不是 king？", "start": 144.2, "dur": 5.18}, {"i": 19, "role": "B", "text": "king 是国王，emperor 是皇帝。区别在头上：emperor 头顶没有更高的主君，king 往往还有。中国皇帝自称天子。", "start": 149.66, "dur": 8.4}, {"i": 20, "role": "A", "text": "课本讲皇家建筑，用的就是 emperors。原句。", "start": 158.34, "dur": 5.4}, {"i": 21, "role": "E", "text": "Imperial palaces served as the residences of emperors and some of their family members, as well as the centres of political administration.", "start": 164.02, "dur": 9.02}, {"i": 22, "role": "B", "text": "served as 充当，residences 居所，centres of political administration 政治管理中心。皇帝的家就是政府大楼，家国一体，一句讲完。", "start": 173.49, "dur": 12.53}, {"i": 23, "role": "A", "text": "顺带说华表：天安门前那对望君归，是盼皇帝回宫办事；后面那对望君出，是劝皇帝出门看民间。石头也在给皇帝提意见。", "start": 186.3, "dur": 13.32}, {"i": 24, "role": "B", "text": "第四个词有点冷门，考试爱考：喇嘛教的，Lamaist。", "start": 199.9, "dur": 5.42}, {"i": 25, "role": "A", "text": "塔按样式分几类，其中一类就是 Lamaist pagoda。Lamaist 来自 Lama，藏传佛教的僧人。它是形容词，后面必须跟 pagoda。", "start": 205.61, "dur": 12.58}, {"i": 26, "role": "B", "text": "顺便说 pagoda 这个词本身，它不是英语土产，是从东方一路传进英语的。", "start": 218.46, "dur": 6.84}, {"i": 27, "role": "E", "text": "Lamaist pagodas are similar in design to Indian stupas (舍利塔).", "start": 225.58, "dur": 4.66}, {"i": 28, "role": "A", "text": "后半句给了线索：stupa，舍利塔，印度的原版。塔在中国换了模样，血缘还在印度。记住一对：pagoda 是中国的塔，stupa 是印度的塔。", "start": 230.69, "dur": 14.09}, {"i": 29, "role": "B", "text": "第五个词，四合院。英文不翻译，直接写 siheyuan。", "start": 245.06, "dur": 5.88}, {"i": 30, "role": "A", "text": "这是音译的胜利。有人译成 courtyard house，外国人只看见一个有院子的房子，四和合全丢了。", "start": 251.22, "dur": 9.26}, {"i": 31, "role": "B", "text": "四合，四面房子合围，中间一个院。课本原句。", "start": 260.76, "dur": 5.86}, {"i": 32, "role": "E", "text": "A typical Beijing siheyuan is composed of four inward-facing houses on all four sides, with a quadrangular yard formed in the middle.", "start": 266.9, "dur": 8.4}, {"i": 33, "role": "A", "text": "be composed of 由什么组成，inward-facing 朝里的，quadrangular 四方的。院子朝里，门朝外，中国人把家围起来，也把喧嚣关在门外。", "start": 275.75, "dur": 12.58}, {"i": 34, "role": "B", "text": "最后一个词，亭，pavilion。今天最轻的一个词，也是最美的一个。", "start": 288.6, "dur": 6.89}, {"i": 35, "role": "A", "text": "pavilion 在英语里意思很多：展馆、帐篷、凉亭。到中国，专指柱子上顶个屋顶、四面不砌墙的小建筑。", "start": 295.77, "dur": 11.02}, {"i": 36, "role": "B", "text": "汉字给了答案：亭，就是停。走累了，停一下。", "start": 307.07, "dur": 5.93}, {"i": 37, "role": "A", "text": "园林里的亭，是给眼睛歇的地方。坐在亭里，看出去每一面都是一幅画，所以它四面都不砌墙。", "start": 313.27, "dur": 9.55}, {"i": 38, "role": "E", "text": "In general, pavilions feature an open structure, with a roof supported by columns, no enclosing walls, and a light, elegant design.", "start": 323.11, "dur": 9.55}, {"i": 39, "role": "B", "text": "feature 以什么为特点，open structure 敞开的结构，no enclosing walls 不砌围墙。中国园林的逻辑：不把你挡在外面，是把你请进来坐一会儿。", "start": 333.11, "dur": 12.5}, {"i": 40, "role": "A", "text": "快问快答。三个词，老周你答英文。", "start": 345.89, "dur": 4.51}, {"i": 41, "role": "B", "text": "来。", "start": 350.68, "dur": 1.58}, {"i": 42, "role": "A", "text": "四合院，要最标准的写法。", "start": 352.55, "dur": 3.17}, {"i": 43, "role": "B", "text": "siheyuan。", "start": 356.0, "dur": 1.92}, {"i": 44, "role": "A", "text": "石狮。", "start": 358.2, "dur": 1.39}, {"i": 45, "role": "B", "text": "stone lions。", "start": 359.87, "dur": 2.04}, {"i": 46, "role": "A", "text": "喇嘛教的塔。", "start": 362.19, "dur": 1.8}, {"i": 47, "role": "B", "text": "Lamaist pagoda。", "start": 364.27, "dur": 2.21}, {"i": 48, "role": "A", "text": "最后一个环节：这些词在真题里长什么样。", "start": 366.76, "dur": 4.49}, {"i": 49, "role": "B", "text": "二〇二二年六月六级考卢沟桥：桥上的石狮不计其数，因而北京地区流传着卢沟桥上的石狮子数不清的说法。", "start": 371.52, "dur": 10.18}, {"i": 50, "role": "A", "text": "关键译法是 too numerous to count，多到数不清。numerous 比 many 书面，too 加 to 直接对上数不清。", "start": 381.98, "dur": 9.19}, {"i": 51, "role": "B", "text": "同一套还考赵州桥：赵州桥建于隋朝，公元六〇五年前后。英文是 The Zhaozhou Bridge was built in the Sui Dynasty, around 605 AD.", "start": 391.45, "dur": 13.27}, {"i": 52, "role": "A", "text": "两个点：朝代用 Dynasty，首字母大写；左右用 around，年份前面不用再加介词。", "start": 405.0, "dur": 8.59}, {"i": 53, "role": "B", "text": "今天六个词：赵州桥 Zhaozhou Bridge、石狮 stone lions、皇帝 the emperor、喇嘛教的 Lamaist、四合院 siheyuan、亭 pavilion。", "start": 413.88, "dur": 11.88}, {"i": 54, "role": "A", "text": "回到开场的问题：为什么门口总要蹲一对狮子？", "start": 426.04, "dur": 4.73}, {"i": 55, "role": "B", "text": "因为它们不只是狮子，是门第。卷发几个，主人几品。", "start": 431.04, "dur": 6.12}, {"i": 56, "role": "A", "text": "中国建筑最厉害的地方，不是高，是把规矩、秩序、分寸，全砌进了石头里。", "start": 437.44, "dur": 7.73}, {"i": 57, "role": "B", "text": "还有一样东西今天没细说：木头的骨架，一根钉子都不用。那是另一期的事。", "start": 445.45, "dur": 7.25}, {"i": 58, "role": "A", "text": "下一期，经济。从一个渔村怎么变成一座城市说起。", "start": 452.98, "dur": 5.93}, {"i": 59, "role": "B", "text": "这里是词汇电台，我们下期见。", "start": 459.19, "dur": 3.6}]}, "11": {"ch": 11, "title": "经济", "en": "Economy", "episode": 11, "hook": "四十多年前，一
