const IDX=[{"ch": 0, "title": "总览", "en": "Overview", "episode": 0, "ready": false}, {"ch": 1, "title": "哲学与宗教", "en": "Philosophy and Religion", "episode": 1, "hook": "如果孔子和老子同时开直播，谁的粉丝更多？", "words": [{"zh": "儒家", "en": "Confucianism", "note": "-ism 学派族：Confucianism / Daoism / Legalism / Mohism"}, {"zh": "道家", "en": "Daoism / Daoist philosophy", "note": "Dao 音译，不译作 the way"}, {"zh": "佛教", "en": "Buddhism", "note": "佛 Buddha ｜ 佛教 Buddhism ｜ 佛学 Buddhist philosophy"}, {"zh": "禅宗", "en": "Chinese Chan Buddhism", "note": "禅 chan → 日语 zen → 英语 zen"}, {"zh": "八仙", "en": "Eight Immortals", "note": "专名大写；immortal＝不朽者"}, {"zh": "重集体而轻个人", "en": "Collectivism over Individualism", "note": "over 表优先于；价值观题高频"}], "total": 316.0, "segs": 50, "ready": true}, {"ch": 2, "title": "文学", "en": "Literature", "episode": 2, "ready": false}, {"ch": 3, "title": "艺术", "en": "The Arts", "episode": 3, "ready": false}, {"ch": 4, "title": "教育", "en": "Education", "episode": 4, "ready": false}, {"ch": 5, "title": "科学技术", "en": "Science and Technology", "episode": 5, "ready": false}, {"ch": 6, "title": "体育", "en": "Sports", "episode": 6, "ready": false}, {"ch": 7, "title": "传统节日", "en": "Traditional Festivals", "episode": 7, "ready": false}, {"ch": 8, "title": "饮食文化", "en": "Culinary Culture", "episode": 8, "ready": false}, {"ch": 9, "title": "服饰与装饰", "en": "Clothing and Adornment", "episode": 9, "ready": false}, {"ch": 10, "title": "建筑", "en": "Architecture", "episode": 10, "ready": false}, {"ch": 11, "title": "经济", "en": "Economy", "episode": 11, "ready": false}, {"ch": 12, "title": "现代生活", "en": "Modern Life", "episode": 12, "ready": false}], DATA={"1": {"ch": 1, "title": "哲学与宗教", "en": "Philosophy and Religion", "episode": 1, "hook": "如果孔子和老子同时开直播，谁的粉丝更多？", "words": [{"zh": "儒家", "en": "Confucianism", "note": "-ism 学派族：Confucianism / Daoism / Legalism / Mohism"}, {"zh": "道家", "en": "Daoism / Daoist philosophy", "note": "Dao 音译，不译作 the way"}, {"zh": "佛教", "en": "Buddhism", "note": "佛 Buddha ｜ 佛教 Buddhism ｜ 佛学 Buddhist philosophy"}, {"zh": "禅宗", "en": "Chinese Chan Buddhism", "note": "禅 chan → 日语 zen → 英语 zen"}, {"zh": "八仙", "en": "Eight Immortals", "note": "专名大写；immortal＝不朽者"}, {"zh": "重集体而轻个人", "en": "Collectivism over Individualism", "note": "over 表优先于；价值观题高频"}], "total": 316.0, "segs": [{"i": 0, "role": "A", "text": "这里是《中国文化概况》词汇电台，第一期：哲学与宗教。", "start": 0.0, "dur": 5.52}, {"i": 1, "role": "B", "text": "我是老周。", "start": 5.8, "dur": 1.92}, {"i": 2, "role": "A", "text": "我是小夏。今天只聊六个词，但聊完你会发现，中国人看世界的方式，就藏在这六个词里。", "start": 8.0, "dur": 9.22}, {"i": 3, "role": "B", "text": "开场先抛一个问题：如果孔子和老子同时开直播，谁的粉丝更多？", "start": 17.5, "dur": 6.43}, {"i": 4, "role": "A", "text": "悬念留到最后。先看第一个词，儒家。", "start": 24.21, "dur": 4.7}, {"i": 5, "role": "A", "text": "儒家，它不是宗教，更像一套讲人与人怎么相处的说明书。核心就三个字：仁、礼、中庸。", "start": 29.19, "dur": 7.2}, {"i": 6, "role": "B", "text": "英文是 Confucianism，来自 Confucius，也就是孔子的拉丁化名字。十七世纪传教士按拉丁语习惯造的，所以不是 Kongism。", "start": 36.67, "dur": 11.64}, {"i": 7, "role": "A", "text": "课本里有一句原话。", "start": 48.59, "dur": 2.26}, {"i": 8, "role": "E", "text": "During this time, various schools of thought, such as Confucianism, Legalism, Daoism, and Mohism, emerged.", "start": 51.13, "dur": 8.71}, {"i": 9, "role": "B", "text": "这正是百家争鸣。记住四个词：儒家 Confucianism、法家 Legalism、道家 Daoism、墨家 Mohism，四个 ism 排一排，都是学派。", "start": 60.29, "dur": 13.68}, {"i": 10, "role": "A", "text": "第二个词，道家，英文 Daoist philosophy，也可以只说 Daoism。", "start": 74.25, "dur": 1.92}, {"i": 11, "role": "B", "text": "关键词是 Dao，道。它直接音译，不译成 the way。这是文化词的规矩：概念独一无二，就音译。", "start": 76.45, "dur": 10.68}, {"i": 12, "role": "A", "text": "道家讲道法自然，英文里常译成 follow the natural order。", "start": 87.41, "dur": 5.45}, {"i": 13, "role": "B", "text": "对比着记：儒家管人与人，道家管人与自然。一个 ism 讲社会，一个 Dao 讲天地。", "start": 93.14, "dur": 9.34}, {"i": 14, "role": "A", "text": "第三个词，佛教，Buddhism，从印度来，在中国落地。", "start": 102.75, "dur": 5.52}, {"i": 15, "role": "B", "text": "容易混的三个词：佛是 Buddha，佛教是 Buddhism，佛学是 Buddhist philosophy。", "start": 108.55, "dur": 7.63}, {"i": 16, "role": "A", "text": "课本原句。", "start": 116.47, "dur": 1.7}, {"i": 17, "role": "E", "text": "During the Sui and Tang dynasties, Buddhism reached its apex in China.", "start": 118.45, "dur": 5.4}, {"i": 18, "role": "B", "text": "隋唐时期，佛教在中国达到顶点。apex 是顶点，比 peak 更书面，考试里遇到要知道是同义。", "start": 124.3, "dur": 10.03}, {"i": 19, "role": "A", "text": "第四个词，禅宗。它是佛教里最中国化的一支。", "start": 134.61, "dur": 5.59}, {"i": 20, "role": "B", "text": "英文有两个说法：Zen Buddhism 和 Chinese Chan Buddhism。Zen 是日语读音传出去的，Chan 才是中国的禅。课本用的是 Chan。", "start": 140.48, "dur": 11.93}, {"i": 21, "role": "A", "text": "一个词的旅行：禅，在中国读 chan，传到日本变 zen，再由日本传进英语，就成了 zen。", "start": 152.69, "dur": 8.45}, {"i": 22, "role": "B", "text": "谁先把它介绍出去，谁就定了这个名字。这也是文化传播最生动的一个注脚。", "start": 161.42, "dur": 1.56}, {"i": 23, "role": "A", "text": "第五个词，八仙，Eight Immortals。", "start": 163.26, "dur": 3.6}, {"i": 24, "role": "B", "text": "注意 Immortals 首字母大写，因为它是专名。immortal 本义是不朽的，转成名词，就是不死的人。", "start": 167.14, "dur": 9.48}, {"i": 25, "role": "A", "text": "课本原句。", "start": 176.9, "dur": 1.7}, {"i": 26, "role": "E", "text": "The Eight Daoist Immortals are widely worshipped by Daoist believers as well as ordinary people.", "start": 178.88, "dur": 6.7}, {"i": 27, "role": "B", "text": "道士拜，老百姓也拜。八仙过海、各显神通，英文常译成 Eight Immortals crossing the sea, each showing their own magic powers.", "start": 186.03, "dur": 10.94}, {"i": 28, "role": "A", "text": "最后一个词有点长：重集体而轻个人。", "start": 197.25, "dur": 4.3}, {"i": 29, "role": "B", "text": "英文是 Collectivism over Individualism。用 over 表示优先于，比 more important than 简练得多。", "start": 201.83, "dur": 9.02}, {"i": 30, "role": "A", "text": "课本说，传统文化重视集体利益，优先考虑社会和国家的需要。", "start": 211.13, "dur": 6.62}, {"i": 31, "role": "B", "text": "这是价值观层面最高频的一组对立，写作文时用来解释，为什么中国人重视家庭、尊老、讲和睦。", "start": 218.04, "dur": 9.48}, {"i": 32, "role": "A", "text": "快问快答。三个词，老周你答英文。", "start": 227.8, "dur": 4.51}, {"i": 33, "role": "B", "text": "来。", "start": 232.59, "dur": 1.58}, {"i": 34, "role": "A", "text": "儒家。", "start": 234.4 const au=document.getElementById('au'),disc=document.getElementById('disc');
const ttl=document.getElementById('ttl'),sub=document.getElementById('sub'),modeEl=document.getElementById('mode');
const panel=document.getElementById('panel'),seek=document.getElementById('seek');
const t1=document.getElementById('t1'),t2=document.getElementById('t2'),pp=document.getElementById('pp'),ppIcon=document.getElementById('ppIcon');
let cur=null, mode='radio', SEGS=[], VOCW=[], accA=-1, accV=-1, tab='sub', loop=false, rate=1;

function fmt(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
const CHS=IDX.filter(x=>x.ready);
CHS.forEach(e=>{const o=document.createElement('option');o.value=e.ch;o.textContent=(e.ch===0?'总览':'Ch'+e.ch)+' · '+e.title;document.getElementById('chSel').appendChild(o);});
document.getElementById('chSel').onchange=e=>openEp(+e.target.value);

function openEp(ch){
  if(!DATA[ch]) return;
  cur=ch; mode='radio'; SEGS=DATA[ch].segs; VOCW=(VOC[ch]||{}).words||[];
  au.src='radio/ch'+ch+'.mp3'; au.load();
  disc.classList.remove('playing');
  document.getElementById('discNo').textContent = ch===0?'总':ch;
  document.getElementById('discEn').textContent = (IDX.find(x=>x.ch===ch).en||'').toUpperCase().slice(0,14);
  ttl.textContent = DATA[ch].title;
  sub.textContent = `词汇电台 · 第 ${DATA[ch].episode} 期 · ${DATA[ch].words.length} 个词 · ${fmt(DATA[ch].total)}`;
  modeEl.textContent='电台模式'; modeEl.classList.remove('v');
  accA=-1; accV=-1; render();
  document.getElementById('chSel').value=ch;
}
function switchToVocab(){
  if(!VOC[cur]||!VOCW.length){ ppIcon.innerHTML='<path d="M8 5v14l11-7z"/>'; return; }
  mode='vocab'; accV=-1;
  au.src='radio/ch'+cur+'_vocab.mp3'; au.load();
  ttl.textContent = DATA[cur].title + ' · 跟读';
  sub.textContent = `跟读模式 · ${VOC[cur].count} 词 · ${fmt(VOC[cur].total)} · 听到读音后跟读一遍`;
  modeEl.textContent='跟读模式'; modeEl.classList.add('v');
  render();
  const pr=au.play(); if(pr&&pr.catch) pr.catch(()=>{});
}
function render(){
  if(tab==='sub'){
    panel.innerHTML = mode==='radio'
      ? SEGS.map((s,i)=>`<div class="subitem ${s.role}" data-i="${i}" data-t="${s.start}"><div class="w">${s.role==='E'?'原声':(s.role==='A'?'小夏':'老周')}</div><div>${s.text}</div></div>`).join('')
      : (VOCW.length? `<div class="note">跟读音轨无文字稿 · 当前第 <b id="vnow">1</b> 词</div>` : '<div class="note">本期暂无跟读音轨</div>');
  }else if(tab==='word'){
    if(mode==='vocab' && VOCW.length){
      panel.innerHTML = `<div class="note" style="padding:0 0 8px">跟读词汇 · 共 ${VOCW.length} 词 · 点任一词可跳转</div>` +
        VOCW.map((w,i)=>`<div class="wordrow" data-i="${i}" data-vt="${w.start}" style="cursor:pointer"><div class="n">${i+1}</div><div><div class="z">${w.zh}</div><div class="e">${w.en}</div></div></div>`).join('');
    }else{
      panel.innerHTML = (DATA[cur]?DATA[cur].words:[]).map((w,i)=>`<div class="wordrow" data-i="${i}"><div class="n">${i+1}</div><div><div class="z">${w.zh}</div><div class="e">${w.en}</div></div><div class="g">${w.note||''}</div></div>`).join('');
    }
  }else{
    panel.innerHTML = IDX.map(e=>`<div class="wordrow" data-ch="${e.ch}" style="cursor:pointer;${e.ready?'':'opacity:.5'}">
      <div class="n">${e.ch===0?'总':e.ch}</div><div><div class="z">${e.title}</div><div class="e">${e.en||''}</div></div>
      <div class="g">${e.ready?Math.round(e.total/60)+'′'+Math.round(e.total%60)+'″':'准备中'}</div></div>`).join('');
  }
}
document.querySelectorAll('.tabs span').forEach(s=>s.onclick=()=>{
  document.querySelectorAll('.tabs span').forEach(x=>x.classList.remove('on')); s.classList.add('on'); tab=s.dataset.t; render();});
panel.addEventListener('click',e=>{
  const it=e.target.closest('.subitem');
  if(it&&mode==='radio'){const t=parseFloat(it.dataset.t);
    const go=()=>{try{au.currentTime=t;}catch(_){}; const p=au.play(); if(p&&p.catch)p.catch(()=>{});};
    if(au.readyState>=1) go(); else {au.addEventListener('loadedmetadata',go,{once:true});au.load();} return;}
  const wv=e.target.closest('.wordrow[data-vt]');
  if(wv){ const t=parseFloat(wv.dataset.vt);
    const go=()=>{try{au.currentTime=t;}catch(_){}; const p=au.play(); if(p&&p.catch)p.catch(()=>{});};
    if(au.readyState>=1) go(); else {au.addEventListener('loadedmetadata',go,{once:true});au.load();} return; }
  const w=e.target.closest('.wordrow');
  if(w&&w.dataset.ch!==undefined){const ch=+w.dataset.ch; if(DATA[ch]) openEp(ch);}
});
pp.onclick=()=>{ if(au.paused){const p=au.play(); if(p&&p.catch)p.catch(()=>{});} else au.pause(); };
au.onplay=()=>{ppIcon.innerHTML='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'; disc.classList.add('playing');};
au.onpause=()=>{ppIcon.innerHTML='<path d="M8 5v14l11-7z"/>'; disc.classList.remove('playing');};
au.onended=()=>{
  if(mode==='radio'){ switchToVocab(); }
  else { disc.classList.remove('playing'); ppIcon.innerHTML='<path d="M8 5v14l11-7z"/>';
         modeEl.textContent='跟读完成'; }
};
au.onloadedmetadata=()=>{t2.textContent=fmt(au.duration);};
au.ontimeupdate=()=>{
  const d=au.duration||0, t=au.currentTime;
  seek.value = d? Math.round(t/d*1000):0;
  t1.textContent=fmt(t); t2.textContent=fmt(d);
  if(mode==='radio'){
    let idx=0; for(let i=0;i<SEGS.length;i++){ if(SEGS[i].start<=t+.05) idx=i; else break; }
    if(idx!==accA){ accA=idx;
      const old=panel.querySelector('.subitem.on'); if(old) old.classList.remove('on');
      const el=panel.querySelector(`.subitem[data-i="${idx}"]`);
      if(el){ el.classList.add('on'); const r=el.getBoundingClientRect(), pr=panel.getBoundingClientRect();
        if(r.top<pr.top+6||r.bottom>pr.bottom-6) el.scrollIntoView({block:'center',behavior:'smooth'}); } }
  } else {
    let idx=0; for(let i=0;i<VOCW.length;i++){ if(VOCW[i].start<=t+.05) idx=i; else break; }
    if(idx!==accV){ accV=idx;
      const vn=document.getElementById('vnow'); if(vn) vn.textContent=(idx+1);
      panel.querySelectorAll('.wordrow.on').forEach(x=>x.classList.remove('on'));
      const el=panel.querySelector(`.wordrow[data-i="${idx}"]`); if(el) el.classList.add('on'); }
  }
};
seek.oninput=e=>{ if(au.duration) au.currentTime = e.target.value/1000*au.duration; };
document.getElementById('loop').onclick=e=>{ loop=!loop; e.currentTarget.classList.toggle('on',loop); au.loop=loop; };
document.getElementById('prev').onclick=()=>{ const i=CHS.findIndex(x=>x.ch===cur); if(i>0) openEp(CHS[i-1].ch); };
document.getElementById('next').onclick=()=>{ const i=CHS.findIndex(x=>x.ch===cur); if(i<CHS.length-1) openEp(CHS[i+1].ch); };
const sp=document.getElementById('speed'), rates=[1,.85,1.15,1.3]; let ri=0;
sp.onclick=()=>{ ri=(ri+1)%rates.length; rate=rates[ri]; sp.textContent=rate+'×'; au.playbackRate=rate; };

// 启动
const m=(location.hash||'').match(/ch(\d+)/);
const first = m && DATA[m[1]] ? +m[1] : (CHS[0]?CHS[0].ch:1);
openEp(first);
</script></body></html>
