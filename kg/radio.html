<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>词汇电台 · 中国文化课程在线学习</title>
<style>
:root{--bg:#f3efe7;--card:#fffdf9;--ink:#2a2622;--sub:#7a7064;--line:#e3ddd1;--acc:#8a5a2b;
  --dark1:#241f1a;--dark2:#3b332a;--cream:#f5efe3}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
/* ── 顶栏 ── */
.top{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
.top a{color:var(--sub);text-decoration:none;font-size:13px}
.top .sp{margin-left:auto}
.top select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12.5px;color:var(--ink);max-width:46vw}
/* ── 主播放视图 ── */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 22px 0;min-height:0}
.disc{width:min(46vw,190px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#5b4b3a,#3a322a 62%,#241f1a);
  box-shadow:0 14px 40px rgba(60,45,30,.28),inset 0 0 0 7px rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;position:relative}
.disc.playing{animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.disc::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.disc .ct{position:relative;z-index:2;text-align:center;color:#f0e7d8;line-height:1.15}
.disc .ct b{display:block;font-size:24px;font-weight:600}
.disc .ct i{font-style:normal;font-size:10px;opacity:.6;letter-spacing:1px}
.ttl{margin:18px 0 0;font-size:18px;font-weight:600;text-align:center}
.sub{margin:5px 0 0;font-size:12.5px;color:var(--sub);text-align:center}
.chip{display:inline-block;margin-top:7px;font-size:11.5px;padding:2px 10px;border-radius:20px;background:#efe9de;color:#7a6a55}
.chip.v{background:#e8f0e9;color:#3f6b52}
.prog{width:min(94%,540px);margin:16px 0 0}
.prog input{width:100%;accent-color:var(--acc);height:20px}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;margin-top:-3px}
.ctrl{width:min(94%,500px);margin:10px 0 0;display:flex;align-items:center;justify-content:space-between}
.ctrl button{border:none;background:none;padding:9px;cursor:pointer;color:#4a4238;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ctrl button:active{background:rgba(0,0,0,.05)}
.ctrl .sm{opacity:.66}
.ctrl .sm.on{opacity:1;color:var(--acc)}
.ctrl .main{width:64px;height:64px;background:var(--acc);color:#fff;box-shadow:0 8px 22px rgba(138,90,43,.34)}
.ctrl .main svg{width:26px;height:26px;fill:#fff}
/* ── 底部三入口 ── */
.navb{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:9px 0 12px;flex:0 0 auto;background:var(--bg)}
.navb button{border:none;background:none;font-size:12.5px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 14px}
.navb button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8}
.navb button.on{color:var(--acc)}
/* ── 全屏层（歌词 / 列表）── */
.sheet{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;
  background:linear-gradient(180deg,var(--dark1),var(--dark2) 62%,#2b2620);color:var(--cream)}
.sheet.on{display:flex}
.sheet .hd{display:flex;align-items:center;gap:12px;padding:14px 18px 8px;flex:0 0 auto}
.sheet .hd .t{font-size:13px;opacity:.72}
.sheet .hd .x{margin-left:auto;background:none;border:none;color:var(--cream);font-size:22px;opacity:.7;cursor:pointer;line-height:1}
.sheet .body{flex:1;overflow:auto;padding:16px 22px 40px;scroll-behavior:smooth}
/* 歌词 */
.lyr{text-align:center;padding:24vh 0 40vh}
.ly{color:rgba(245,239,227,.34);font-size:15px;line-height:1.85;padding:9px 0;cursor:pointer;transition:color .25s,font-size .25s,transform .25s}
.ly:hover{color:rgba(245,239,227,.62)}
.ly.on{color:#fff;font-size:20px;font-weight:600;text-shadow:0 2px 16px rgba(0,0,0,.5);letter-spacing:.3px;padding:15px 0}
.ly .who{font-size:10.5px;opacity:.36;margin-right:7px;letter-spacing:.5px}
.ly.B{color:rgba(232,206,178,.40)}
.ly.B.on{color:#f2dcc0}
.ly.E{font-family:Georgia,serif}
.ly.voc .en{display:block;font-family:Georgia,serif;font-size:13.5px;color:#d8b98d;margin-top:2px;opacity:.85}
.ly.on.voc .en{font-size:15px;color:#f0c98f;opacity:1}
/* 播放列表 */
.pl .row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer;border-radius:8px}
.pl .row:hover{background:rgba(255,255,255,.05)}
.pl .row.on{background:rgba(255,255,255,.08)}
.pl .row.on .no{color:#e0b073}
.pl .no{flex:0 0 26px;font-size:12.5px;color:rgba(245,239,227,.4);font-variant-numeric:tabular-nums;text-align:center}
.pl .ti{flex:1;min-width:0}
.pl .ti .a{font-size:14.5px;color:var(--cream)}
.pl .ti .b{font-size:11.5px;color:rgba(245,239,227,.45);margin-top:2px}
.pl .du{font-size:11.5px;color:rgba(245,239,227,.45);font-variant-numeric:tabular-nums}
.pl .row.off{opacity:.38;cursor:default}
.pl .now{color:#e0b073;font-size:11px;margin-left:6px}
/* 迷你控制（层内底部） */
.mini{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px 16px;border-top:1px solid rgba(255,255,255,.09)}
.mini .m{flex:1;min-width:0;font-size:12.5px;color:rgba(245,239,227,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini button{border:none;background:none;color:var(--cream);cursor:pointer;padding:6px}
.mini svg{width:22px;height:22px;fill:currentColor}
.mini .bar{flex:0 0 90px;height:3px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
.mini .bar i{display:block;height:100%;width:0;background:#e0b073}
@media(max-height:700px){.disc{width:min(32vh,132px)}.ttl{font-size:16px;margin-top:12px}}
</style></head><body>

</div>

<script>
const IDX=[{"ch": 0, "title": "总览", "en": "Overview", "episode": 0, "ready": false}, {"ch": 1, "title": "哲学与宗教", "en": "Philosophy and Religion", "episode": 1, "hook": "如果孔子和老子同时开直播，谁的粉丝更多？", "words": [{"zh": "儒家", "en": "Confucianism", "note": "-ism 学派族：Confucianism / Daoism / Legalism / Mohism"}, {"zh": "道家", "en": "Daoism / Daoist philosophy", "note": "Dao 音译，不译作 the way"}, {"zh": "佛教", "en": "Buddhism", "note": "佛 Buddha ｜ 佛教 Buddhism ｜ 佛学 Buddhist philosophy"}, {"zh": "禅宗", "en": "Chinese Chan Buddhism", "note": "禅 chan → 日语 zen → 英语 zen"}, {"zh": "八仙", "en": "Eight Immortals", "note": "专名大写；immortal＝不朽者"}, {"zh": "重集体而轻个人", "en": "Collectivism over Individualism", "note": "over 表优先于；价值观题高频"}], "total": 316.0, "segs": 50, "ready": true}, {"ch": 2, "title": "文学", "en": "Literature", "episode": 2, "ready": false}, {"ch": 3, "title": "艺术", "en": "The Arts", "episode": 3, "ready": false}, {"ch": 4, "title": "教育", "en": "Education", "episode": 4, "ready": false}, {"ch": 5, "title": "科学技术", "en": "Science and Technology", "episode": 5, "ready": false}, {"ch": 6, "title": "体育", "en": "Sports", "episode": 6, "ready": false}, {"ch": 7, "title": "传统节日", "en": "Traditional Festivals", "episode": 7, "ready": false}, {"ch": 8, "title": "饮食文化", "en": "Culinary Culture", "episode": 8, "ready": false}, {"ch": 9, "title": "服饰与装饰", "en": "Clothing and Adornment", "episode": 9, "ready": false}, {"ch": 10, "title": "建筑", "en": "Architecture", "episode": 10, "ready": false}, {"ch": 11, "title": "经济", "en": "Economy", "episode": 11, "ready": false}, {"ch": 12, "title": "现代生活", "en": "Modern Life", "episode": 12, "ready": false}], DATA={"1": {"ch": 1, "title": "哲学与宗教", "en": "Philosophy and Religion", "episode": 1, "hook": "如果孔子和老子同时开直播，谁的粉丝更多？", "words": [{"zh": "儒家", "en": "Confucianism", "note": "-ism 学派族：Confucianism / Daoism / Legalism / Mohism"}, {"zh": "道家", "en": "Daoism / Daoist philosophy", "note": "Dao 音译，不译作 the way"}, {"zh": "佛教", "en": "Buddhism", "note": "佛 Buddha ｜ 佛教 Buddhism ｜ 佛学 Buddhist philosophy"}, {"zh": "禅宗", "en": "Chinese Chan Buddhism", "note": "禅 chan → 日语 zen → 英语 zen"}, {"zh": "八仙", "en": "Eight Immortals", "note": "专名大写；immortal＝不朽者"}, {"zh": "重集体而轻个人", "en": "Collectivism over Individualism", "note": "over 表优先于；价值观题高频"}], "total": 316.0, "segs": [{"i": 0, "role": "A", "text": "这里是《中国文化概况》词汇电台，第一期：哲学与宗教。", "start": 0.0, "dur": 5.52}, {"i": 1, "role": "B", "text": "我是老周。", "start": 5.8, "dur": 1.92}, {"i": 2, "role": "A", "text": "我是小夏。今天只聊六个词，但聊完你会发现，中国人看世界的方式，就藏在这六个词里。", "start": 8.0, "dur": 9.22}, {"i": 3, "role": "B", "text": "开场先抛一个问题：如果孔子和老子同时开直播，谁的粉丝更多？", "start": 17.5, "dur": 6.43}, {"i": 4, "role": "A", "text": "悬念留到最后。先看第一个词，儒家。", "start": 24.21, "dur": 4.7}, {"i": 5, "role": "A", "text": "儒家，它不是宗教，更像一套讲人与人怎么相处的说明书。核心就三个字：仁、礼、中庸。", "start": 29.19, "dur": 7.2}, {"i": 6, "role": "B", "text": "英文是 Confucianism，来自 Confucius，也就是孔子的拉丁化名字。十七世纪传教士按拉丁语习惯造的，所以不是 Kongism。", "start": 36.67, "dur": 11.64}, {"i": 7, "role": "A", "text": "课本里有一句原话。", "start": 48.59, "dur": 2.26}, {"i": 8, "role": "E", "text": "During this time, various schools of thought, such as Confucianism, Legalism, Daoism, and Mohism, emerged.", "start": 51.13, "dur": 8.71}, {"i": 9, "role": "B", "text": "这正是百家争鸣。记住四个词：儒家 Confucianism、法家 Legalism、道家 Daoism、墨家 Mohism，四个 ism 排一排，都是学派。", "start": 60.29, "dur": 13.68}, {"i": 10, "role": "A", "text": "第二个词，道家，英文 Daoist philosophy，也可以只说 Daoism。", "start": 74.25, "dur": 1.92}, {"i": 11, "role": "B", "text": "关键词是 Dao，道。它直接音译，不译成 the way。这是文化词的规矩：概念独一无二，就音译。", "start": 76.45, "dur": 10.68}, {"i": 12, "role": "A", "text": "道家讲道法自然，英文里常译成 follow the natural order。", "start": 87.41, "dur": 5.45}, {"i": 13, "role": "B", "text": "对比着记：儒家管人与人，道家管人与自然。一个 ism 讲社会，一个 Dao 讲天地。", "start": 93.14, "dur": 9.34}, {"i": 14, "role": "A", "text": "第三个词，佛教，Buddhism，从印度来，在中国落地。", "start": 102.75, "dur": 5.52}, {"i": 15, "role": "B", "text": "容易混的三个词：佛是 Buddha，佛教是 Buddhism，佛学是 Buddhist philosophy。", "start": 108.55, "dur": 7.63}, {"i": 16, "role": "A", "text": "课本原句。", "start": 116.47, "dur": 1.7}, {"i": 17, "role": "E", "text": "During the Sui and Tang dynasties, Buddhism reached its apex in China.", "start": 118.45, "dur": 5.4}, {"i": 18, "role": "B", "text": "隋唐时期，佛教在中国达到顶点。apex 是顶点，比 peak 更书面，考试里遇到要知道是同义。", "start": 124.3, "dur": 10.03}, {"i": 19, "role": "A", "text": "第四个词，禅宗。它是佛教里最中国化的一支。", "start": 134.61, "dur": 5.59}, {"i": 20, "role": "B", "text": "英文有两个说法：Zen Buddhism 和 Chinese Chan Buddhism。Zen 是日语读音传出去的，Chan 才是中国的禅。课本用的是 Chan。", "start": 140.48, "dur": 11.93}, {"i": 21, "role": "A", "text": "一个词的旅行：禅，在中国读 chan，传到日本变 zen，再由日本传进英语，就成了 zen。", "start": 152.69, "dur": 8.45}, {"i": 22, "role": "B", "text": "谁先把它介绍出去，谁就定了这个名字。这也是文化传播最生动的一个注脚。", "start": 161.42, "dur": 1.56}, {"i": 23, "role": "A", "text": "第五个词，八仙，Eight Immortals。", "start": 163.26, "dur": 3.6}, {"i": 24, "role": "B", "text": "注意 Immortals 首字母大写，因为它是专名。immortal 本义是不朽的，转成名词，就是不死的人。", "start": 167.14, "dur": 9.48}, {"i": 25, "role": "A", "text": "课本原句。", "start": 176.9, "dur": 1.7}, {"i": 26, "role": "E", "text": "The Eight Daoist Immortals are widely worshipped by Daoist believers as well as ordinary people.", "start": 178.88, "dur": 6.7}, {"i": 27, "role": "B", "text": "道士拜，老百姓也拜。八仙过海、各显神通，英文常译成 Eight Immortals crossing the sea, each showing their own magic powers.", "start": 186.03, "dur": 10.94}, {"i": 28, "role": "A", "text": "最后一个词有点长：重集体而轻个人。", "start": 197.25, "dur": 4.3}, {"i": 29, "role": "B", "text": "英文是 Collectivism over Individualism。用 over 表示优先于，比 more important than 简练得多。", "start": 201.83, "dur": 9.02}, {"i": 30, "role": "A", "text": "课本说，传统文化重视集体利益，优先考虑社会和国家的需要。", "start": 211.13, "dur": 6.62}, {"i": 31, "role": "B", "text": "这是价值观层面最高频的一组对立，写作文时用来解释，为什么中国人重视家庭、尊老、讲和睦。", "start": 218.04, "dur": 9.48}, {"i": 32, "role": "A", "text": "快问快答。三个词，老周你答英文。", "start": 227.8, "dur": 4.51}, {"i": 33, "role": "B", "text": "来。", "start": 232.59, "dur": 1.58}, {"i": 34, "role": "A", "text": "儒家。", "start": 234.45, "dur": 1.32}, {"i": 35, "role": "B", "text": "Confucianism。", "start": 236.05, "dur": 2.06}, {"i": 36, "role": "A", "text": "八仙。", "start": 238.4, "dur": 1.37}, {"i": 37, "role": "B", "text": "Eight Immortals。", "start": 240.05, "dur": 2.21}, {"i": 38, "role": "A", "text": "禅宗，要用中国那个说法。", "start": 242.53, "dur": 1.8}, {"i": 39, "role": "B", "text": "Chinese Chan Buddhism。", "start": 244.61, "dur": 2.5}, {"i": 40, "role": "A", "text": "最后一个环节：这些词在考试里长什么样。", "start": 247.39, "dur": 4.51}, {"i": 41, "role": "B", "text": "一道真题：中华民族在五千多年的历史发展中，形成了自己独特的传统美德。", "start": 252.18, "dur": 3.24}, {"i": 42, "role": "A", "text": "这里有两个坑。传统美德是 traditional virtues，virtue 用复数，因为是一整套。", "start": 255.7, "dur": 7.9}, {"i": 43, "role": "B", "text": "中华民族是 the Chinese nation，不是 Chinese people。nation 强调共同体。", "start": 263.88, "dur": 7.32}, {"i": 44, "role": "A", "text": "这两个词，恰好就是下一期文学的开场。", "start": 271.48, "dur": 4.03}, {"i": 45, "role": "A", "text": "今天六个词：儒家 Confucianism、道家 Daoism、佛教 Buddhism、禅宗 Chinese Chan Buddhism、八仙 Eight Immortals、重集体轻个人 Collectivism over Individualism。", "start": 275.79, "dur": 14.86}, {"i": 46, "role": "B", "text": "回到开场的问题：孔子和老子，谁的粉丝多？", "start": 290.93, "dur": 5.14}, {"i": 47, "role": "A", "text": "答案在课本里：儒家做了两千多年官方正统，道家成了中国人的退路。一个入世，一个出世。", "start": 296.34, "dur": 9.46}, {"i": 48, "role": "B", "text": "下一期，文学。我们从诗这个字开始。", "start": 306.08, "dur": 4.68}, {"i": 49, "role": "A", "text": "这里是词汇电台，我们下期见。", "start": 311.04, "dur": 3.43}]}}, VOC={"1": {"ch": 1, "voice": "en-US-AriaNeural", "rate": "-10%", "gap": 1.2, "count": 72, "total": 276.8, "words": [{"i": 0, "zh": "传统美德", "en": "traditional virtue", "start": 0.0, "dur": 2.42}, {"i": 1, "zh": "儒家", "en": "Confucianism", "start": 3.62, "dur": 2.23}, {"i": 2, "zh": "道家", "en": "Daoist philosophy", "start": 7.06, "dur": 2.59}, {"i": 3, "zh": "三玄", "en": "the Three Metaphysical Classics", "start": 10.85, "dur": 3.19}, {"i": 4, "zh": "两汉经学", "en": "Study of Confucian Classics During the Han Dynasty", "start": 15.       if(r.top<br.top+60||r.bottom>br.bottom-100) el.scrollIntoView({block:'center',behavior:'smooth'});
      // 迷你条
      document.getElementById('miniT1').textContent=(mode==='radio'?el.innerText.split('\n').pop():el.innerText.replace(/\n/g,' · '));
      document.getElementById('miniT2').textContent=document.getElementById('miniT1').textContent;
    }
  }
  const mt=document.getElementById('miniTime'); if(mt) mt.textContent=fmt(t)+' / '+fmt(d);
  const pct=d?(t/d*100):0;
  document.getElementById('miniBar').style.width=pct+'%';
  document.getElementById('miniBar2').style.width=pct+'%';
};
seek.oninput=e=>{ if(au.duration) au.currentTime=e.target.value/1000*au.duration; };
/* ── 交互 ── */
pp.onclick=()=>{ if(au.paused){const p=au.play();if(p&&p.catch)p.catch(()=>{});} else au.pause(); };
document.getElementById('miniPP').onclick=()=>pp.onclick();
document.getElementById('miniPP2').onclick=()=>pp.onclick();
document.getElementById('loop').onclick=e=>{loop=!loop;e.currentTarget.classList.toggle('on',loop);au.loop=loop;};
document.getElementById('prev').onclick=()=>{const i=CHS.findIndex(x=>x.ch===cur);if(i>0)openEp(CHS[i-1].ch);};
document.getElementById('next').onclick=()=>{const i=CHS.findIndex(x=>x.ch===cur);if(i<CHS.length-1)openEp(CHS[i+1].ch);};
const sp=document.getElementById('speed'),rates=[1,.85,1.15,1.3];let ri=0;
sp.onclick=()=>{ri=(ri+1)%rates.length;sp.textContent=rates[ri]+'×';au.playbackRate=rates[ri];};
/* 层开关 */
function openSheet(el){el.classList.add('on');document.body.style.overflow='hidden';}
function closeSheets(){sheetLyr.classList.remove('on');sheetPl.classList.remove('on');}
document.getElementById('nLyr').onclick=()=>{if(mode==='vocab')buildLyr();openSheet(sheetLyr);};
document.getElementById('nVoc').onclick=()=>openSheet(sheetLyr);
document.getElementById('nPl').onclick=()=>{buildPl();openSheet(sheetPl);};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheets();});
/* 启动 */
const m=(location.hash||'').match(/ch(\d+)/);
openEp(m&&DATA[m[1]]?+m[1]:(CHS[0]?CHS[0].ch:1));
</script></body></html>
