    const n=r.n?`<span class="num">${r.n}</span>`+(r.f?`<span class="badge">+${r.f}续</span>`:''):'';
    const t=r.t?`<span class="badge t">${r.t}</span>`:'';
    return `<tr><td class="z">${z}</td><td class="e">${e}</td><td class="c h">${r.c?`<span class="badge">${r.c}</span>`:''}</td>
      <td class="h">${(r.h||"").replace(/Overview/g,"总览")}</td><td class="p">${r.p||''}</td><td>${n}</td><td class="h">${t}</td></tr>`;
  }).join('');
  stat.textContent=`${rows.length} / ${D.length} 条`;
  tip.style.display=rows.length?'none':'block';
}
