<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《中国文化概况》Overview 电子课本 · 幻灯片版</title>
<style>
:root{--red:#5c1a1a;--red2:#8c2a26;--gold:#c2912a;--paper:#ece9e0;--card:#fff;--line:#cfbfa0;--exbg:#faf6ec;--ink:#222;--muted:#6f6a58;--green:#1c6e3c;--wood:#4a3d2a;--fs:1}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC",SimSun,sans-serif;background:var(--paper);color:var(--ink)}
.hdr{position:relative;z-index:40;background:linear-gradient(135deg,#5c1a1a,#8c2a26);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hdr-in{max-width:1200px;margin:0 auto;padding:7px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.hdr .tt{font-size:16px;font-weight:800;letter-spacing:.5px}
.hdr .tt small{font-weight:400;font-size:11px;opacity:.85;margin-left:8px}
.hdr .ctrl{display:flex;align-items:center;gap:8px;font-size:12px;color:#ffe9c9}
.hdr .seg{display:inline-flex;background:rgba(0,0,0,.28);border-radius:8px;padding:2px;gap:2px}
.hdr .seg b{padding:4px 8px;font-weight:700;color:#e8cda5}
.hdr .seg button{border:none;background:transparent;color:#ffe9c9;font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer;font-weight:700}
.hdr .seg button.on{background:#fff;color:var(--red)}
.fsctl{display:flex;align-items:center;gap:4px}
.fsctl button{background:rgba(0,0,0,.28);border:none;color:#fff;width:24px;height:24px;border-radius:5px;font-weight:800;cursor:pointer;font-size:14px}
.fsctl .val{min-width:44px;text-align:center}
.hlink{background:rgba(0,0,0,.28);color:#ffe9c9;font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;text-decoration:none;white-space:nowrap}
.hlink:hover{background:rgba(255,255,255,.25);color:#fff}
.topstrip{background:var(--card);border-bottom:1px solid var(--line);padding:6px 12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;position:relative;z-index:20}
.hamb{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:15px;color:var(--red2);font-weight:800;display:flex;align-items:center;justify-content:center}
.crumb{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);flex-wrap:wrap;min-width:0}
.crumb span.cur{color:var(--ink);font-weight:800}
.crumb .g{cursor:pointer;color:#8a5a1a;font-weight:800;padding:2px 6px;border-radius:5px}
.crumb .g:hover{background:#f3ecdd}
.crumb .sep{opacity:.45}
.course-sw{display:inline-flex;background:#f0e6d2;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.course-sw button{border:none;background:transparent;font-size:12px;font-weight:800;color:#8a5a1a;padding:3px 12px;border-radius:999px;cursor:pointer}
.course-sw button.on{background:var(--red2);color:#fff}
.modes{display:none}
.layout{position:relative;height:calc(100vh - 108px);display:flex;flex-direction:column}
.viewport{flex:1;min-height:0;position:relative;overflow:hidden}
.stage,.tool{position:absolute;inset:0}
.tool{overflow-y:auto;padding:14px 18px 60px;max-width:980px;margin:0 auto;width:100%}
.stage{overflow:hidden}
.slide{position:absolute;inset:0;padding:10px 20px 4px;overflow:hidden}
.slide.scroll .sbody{overflow-y:auto;padding-right:6px}
.slide.scroll .phead::after{content:'▼ 本页可滚动';font-size:11px;color:#8a5a1a;position:absolute;right:0;top:2px;background:var(--paper);padding:1px 8px;border-radius:999px;border:1px dashed var(--gold)}
.slide .inner{max-width:900px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.phead{position:relative;margin-bottom:8px;flex-shrink:0}
.phead .p-rt{font-size:11px;font-weight:800;color:#fff;background:var(--red2);border-radius:999px;padding:2px 10px;display:inline-block}
.phead .p-cs{font-size:11px;font-weight:800;color:#8a5a1a;border:1px solid var(--gold);background:#fff;border-radius:999px;padding:2px 10px;margin-left:6px;display:inline-block}
.phead .p-pt{font-size:clamp(16px,2.6vw,22px);font-weight:800;color:var(--red);margin:5px 0 0;border-bottom:3px double var(--gold);padding-bottom:5px;display:inline-block;padding-right:150px}
.phead .p-cont{font-size:12px;color:var(--muted);margin-left:10px;font-weight:700}
.sbody{flex:1;min-height:0;overflow:hidden}
.sec{border-left:4px solid var(--gold);margin:13px 0 5px;padding:2px 0 2px 12px}
.sec h2{font-size:clamp(14px,2vw,17px);margin:0;color:var(--red2)}
.sec .se{font-size:12px;color:var(--muted)}
.para{position:relative;margin:0 0 24px 0;padding:0 6px 0 10px;border-radius:8px;transition:background .22s;cursor:pointer}
.para.reading{background:rgba(194,145,42,.12)}
.para:hover{background:#f7f1e2}
.para .pb{position:absolute;left:6px;top:9px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--red2);background:#fff;color:var(--red2);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;z-index:2}
.para .pb.playing{background:var(--green);border-color:var(--green);color:#fff}
.para .ptext{font-family:"Segoe UI",Georgia,serif;font-size:calc(15px*var(--fs));line-height:2.0;color:#2c2418;text-align:justify}
.ptext .voc{background:#f3e6c8;border-radius:4px;padding:0 2px;cursor:pointer;border-bottom:1px dashed #c2912a}
.ptext .voc.voce{background:#ffdfb8;border-bottom:1px solid #e07a1a}
.ptext .voc.voce:hover{background:#f6c889}
.ptext .voc.vocx{background:#eee0fb;border-bottom:1px solid #8e4fc2}
.ptext .voc.vocx:hover{background:#ddc6f4}
.ptext .voc.voce.vocx{background:#ffd9cf;border-bottom:1px solid #d0431f}
.ptext .voc:hover{background:#e9cf8f}
.ptext s.sen{text-decoration:none;cursor:pointer;border-radius:3px}
.ptext s.sen.reading{border-bottom:3px solid var(--gold);background:linear-gradient(transparent 78%,#ffe9b0 78%)}
.note{background:var(--exbg);border:1px dashed var(--line);border-radius:10px;padding:10px 13px;margin:8px 0;font-size:12.5px;color:#6a5a3a;line-height:1.7}
.marker{color:#b09a6a;font-size:12px;font-weight:700}
.fnav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.72);box-shadow:0 2px 10px rgba(60,20,10,.22);color:var(--red2);font-size:24px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:15;opacity:.6;transition:opacity .2s;line-height:1;padding:0 0 2px}
.fnav:hover{opacity:1;background:#fff}
.fnav:disabled{opacity:0;pointer-events:none}
#fprev{left:10px}
#fnext{right:10px}
.fpage{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;background:rgba(60,30,15,.58);color:#fff;font-size:11px;padding:3px 14px;border-radius:999px;z-index:15;letter-spacing:.5px;white-space:nowrap;pointer-events:none}
.player{height:56px;background:linear-gradient(90deg,#5c1a1a,#8c2a26);color:#fff;display:flex;align-items:center;gap:9px;padding:0 14px;position:relative;z-index:20;flex-shrink:0;flex-wrap:nowrap}
.player .p-btn{width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:15px;cursor:pointer;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.player .p-btn:hover{background:rgba(255,255,255,.3)}
.p-seek{flex:1;min-width:110px;display:flex;align-items:center;gap:8px}
.p-seek input{flex:1;accent-color:#ffd98a;cursor:pointer}
.p-seek .tt{font-size:11px;color:#ffe9c9;white-space:nowrap;min-width:86px;text-align:right;font-variant-numeric:tabular-nums}
.p-sel{display:inline-flex;gap:5px;font-size:11px;color:#ffe9c9;align-items:center;flex-shrink:0}
.p-sel select{background:rgba(0,0,0,.24);color:#fff;border:1px solid rgba(255,255,255,.38);border-radius:6px;font-size:11px;padding:3px 6px}
.p-sel select option{color:#222;background:#fff}
.player .p-flag{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);color:#ffe9c9;font-size:11px;padding:4px 10px;border-radius:999px;cursor:pointer;flex-shrink:0;font-weight:700}
.player .p-flag.on{background:#ffd98a;color:#5c1a1a;border-color:#ffd98a}
.ptr{margin:7px 0 1px;padding:6px 10px 6px 12px;border-left:3px solid var(--gold);background:#fff8e6;color:#6a5a35;font-size:calc(13px*var(--fs));line-height:1.75;border-radius:0 6px 6px 0;transition:background .22s;text-align:justify}
.ptr::before{content:'译';font-weight:800;color:var(--gold);font-size:11px;margin-right:6px;vertical-align:1px}
.para.reading .ptr{background:#ffefc9}
/* 译文模式：左右分栏（左英右中），段落成对对齐 */
.tr2col .para{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;margin-bottom:22px}
.tr2col .para .ptext{grid-column:1;font-size:calc(14px*var(--fs))}
.tr2col .para .ptr{grid-column:2;margin:0;padding:6px 12px;font-size:calc(14px*var(--fs));line-height:1.9}
.para .ptext{border-radius:6px}
.para.flash .ptext{animation:paraFlash 1.4s ease}
@keyframes paraFlash{0%,55%{background:rgba(194,145,42,.3)}100%{background:transparent}}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(360px,86vw);background:var(--card);z-index:90;transform:translateX(-102%);transition:transform .22s ease;box-shadow:2px 0 18px rgba(0,0,0,.18);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{padding:14px 16px 10px;font-size:15px;font-weight:800;color:var(--red);border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer-head .x{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted)}
.dtree{flex:1;overflow-y:auto;padding:8px 10px 40px}
.dr-m{color:#7a4a1a;cursor:pointer;font-weight:800;font-size:13px;padding:8px 8px;border-radius:8px;display:flex;align-items:center;gap:6px}
.dr-m:hover{background:#f3ecdd}
.dr-m.on{color:var(--red)}
.dr-m .car{font-size:10px;color:var(--muted);width:12px;flex-shrink:0}
.dr-m.ph{opacity:.5}
.dr-m .ig{margin-left:auto;font-size:10px;color:var(--muted);font-weight:600}
.dr-c{color:#8a5a1a;font-weight:700;font-size:12.5px;margin:5px 0 2px;margin-left:8px;padding:5px 8px;border-radius:8px;display:flex;align-items:center;gap:6px;cursor:pointer}
.dr-c:hover{background:#f3ecdd}
.dr-c.on{color:var(--red);background:#f6ecda}
.dr-c .ig,.dr-t .ig,.dr-p button .ig{margin-left:auto;font-size:10px;color:var(--muted);font-weight:600}
.dr-p{margin:1px 0 1px 26px;border-left:1px solid var(--line);padding-left:10px}
.dr-p button{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:none;cursor:pointer;font-size:12.5px;color:var(--wood);padding:5px 8px;border-radius:6px}
.dr-p button:hover{background:#f3ecdd}
.dr-p button.on{color:var(--red);font-weight:700}
.dr-t{color:#7a5a3a;font-weight:700;font-size:12.5px;margin:5px 8px 2px;padding:7px 10px;border-radius:8px;display:flex;align-items:center;gap:6px;cursor:pointer;border:1px dashed var(--line);background:#fbf7ee}
.dr-t:hover{background:#f3ecdd}
.dr-t.on{background:var(--red2);color:#fff;border-color:var(--red2)}
.dr-t.on .ig{color:rgba(255,255,255,.8)}
.dr-t.ph{opacity:.55;cursor:default;background:#f4f0e6;border-style:solid;border-color:#e0d6c0;color:#9a927c}
.dr-t.ph:hover{background:#f4f0e6}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.excard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.excard h4{margin:0 0 6px;font-size:13px;color:var(--red)}
.excard .set{font-size:11px;color:#b06a2a;font-weight:700}
.excard .cn{font-size:13px;line-height:1.6;margin:6px 0}
.excard .en{font-family:"Segoe UI",Georgia,serif;font-size:13px;color:var(--green);font-style:italic;line-height:1.55}
.excard .meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.mtag{font-size:10px;font-weight:700;border-radius:999px;padding:1px 8px}
.mtag.pt{background:#f2e6f5;color:#7a3b8c}
.mtag.cl{background:#e6f0ee;color:#246a5a}
.unithead{border-bottom:3px double var(--gold);padding-bottom:8px;margin-bottom:12px}
.unithead h1{font-size:20px;margin:0;color:var(--red);font-family:"Segoe UI",Georgia,"Microsoft YaHei",serif}
.unithead .ensub{font-size:12.5px;color:var(--muted);margin-top:2px}
.exsec{margin:14px 0 6px}
.exsec>h2{font-size:15px;font-weight:800;letter-spacing:1px;margin:14px 0 4px;background:linear-gradient(90deg,#3d4852,#566d7f);color:#fff;padding:8px 14px;border-radius:5px;display:flex;align-items:center;gap:9px}
.exsec .intro{font-size:12.5px;color:#5f5340;margin:6px 0 9px;line-height:1.65;padding-left:24px}
.exsec .secbar{display:flex;align-items:center;gap:12px;margin:8px 0 2px;flex-wrap:wrap;color:#9a7b46;font-size:12px}
.exgrp{display:flex;align-items:baseline;gap:8px;margin:14px 0 6px;font-size:13.5px;color:var(--red2);font-weight:800;letter-spacing:.3px}
.exgrp .no{font-size:16px;color:var(--red)}
.exq{margin:12px 0;padding-left:46px;position:relative}
.exq .exq-h{position:absolute;left:0;top:1px;min-width:38px;display:flex;align-items:center;gap:6px}
.exq .exq-no{font-weight:800;color:var(--red2);font-size:13px;line-height:1}
.exq .exq-q{font-family:"Segoe UI",Georgia,serif;font-size:13.5px;line-height:1.95;color:#241c12}
.blank{display:inline-block;min-width:62px;min-height:1.02em;border-bottom:1px solid #000;margin:0 3px;color:#222;font-weight:600;letter-spacing:.3px;line-height:1.02}
.blank.wide{width:72%;min-width:180px}
input.blank{border:none;border-bottom:1px solid #000;background:transparent;font:inherit;font-weight:600;letter-spacing:.3px;color:#222;text-align:center;padding:2px 6px;outline:none;border-radius:0;min-height:1.7em}
input.blank:focus{border-bottom-color:var(--gold);background:#fdf9ea}
input.blank.ok{border-bottom-color:#1c6e3c;color:#1c6e3c;background:rgba(28,110,60,.06)}
input.blank.bad{border-bottom-color:#b03a1a;color:#b03a1a;background:rgba(176,58,26,.07)}
.exctl{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:2px 0 10px;padding:7px 12px;background:#f4ecdb;border:1px solid var(--line);border-radius:6px}
.exctl .sc{border:1px solid var(--line);background:#fff;padding:4px 12px;border-radius:999px;font-weight:800;color:var(--red2);font-size:12px;white-space:nowrap}
.exctl .btn{font-size:12px;font-weight:700;padding:5px 15px;border-radius:5px;border:none;cursor:pointer;white-space:nowrap}
.exctl .btn.check{background:var(--red2);color:#fff}
.exctl .btn.show{background:#e7dcc4;color:#5a4a30}
.exctl .btn.reset{background:#fff;color:#6f6a58;border:1px solid var(--line)}
.passbox .parea{width:100%;min-height:120px;border:1.4px solid #cbb989;border-radius:6px;background:#fffdf6;font:inherit;font-size:13.5px;line-height:1.8;color:#241c12;padding:10px 12px;resize:vertical}
table.ex{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
table.ex th,table.ex td{border:1px dotted #b7a06e;padding:8px 10px;text-align:left}
table.ex thead th{background:transparent;color:var(--red2);font-weight:800;text-align:center;border:1px #cbb989 solid;border-bottom:2px solid #cbb989}
table.ex td.given{font-weight:700;color:var(--red2)}
table.ct{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #cbb989;border-radius:8px;overflow:hidden;font-size:12.5px;margin:10px 0}
table.ct .cthead td{background:#f4ecdb;color:var(--red2);font-weight:800;text-align:center;padding:8px 12px;border-bottom:2px solid #cbb989}
table.ct td{padding:9px 10px;border:1px dotted #b7a06e;text-align:left;vertical-align:top}
.passagebox{background:var(--exbg);border:1px dashed var(--line);border-radius:3px;padding:12px 14px;font-family:"SimSun","Microsoft YaHei",serif;font-size:13.5px;line-height:1.9;color:#241c12}
.passage-en{font-size:12px;color:#8a6a1c;margin:7px 0 4px;font-style:italic;font-weight:600}
.exq-a{display:none;margin-top:7px;padding:9px 12px;background:var(--exbg);border-left:3px solid var(--green);font-size:12.5px;color:#355a4a;line-height:1.7}
.exsec.show .exq-a,.exq.show .exq-a{display:block}
.tooltip{position:fixed;z-index:120;max-width:340px;background:#fffdf5;border:1px solid var(--gold);border-radius:10px;box-shadow:0 6px 22px rgba(90,45,10,.18);padding:11px 14px;font-size:12.5px;line-height:1.55;pointer-events:none;opacity:0;transition:opacity .12s}
.tooltip.show{opacity:1}
.tooltip .t-t{font-weight:800;color:var(--red);font-size:13.5px}
.tooltip .t-pi{color:var(--red2);font-weight:700;margin:3px 0 1px;font-size:12px}
.tooltip .t-pi .ipa{font-weight:800;font-family:Georgia,serif;margin-left:7px;color:#8e4fc2}
.tooltip .t-z{color:#5a4a2a;font-size:12.5px;margin:2px 0}
.tooltip .t-d{font-size:11px;color:#9a7b46;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tooltip .t-q{color:var(--green);font-style:italic;margin-top:6px;font-size:11.5px}
.tooltip .t-q .t-src{color:var(--red2);font-style:normal;font-weight:700;margin-left:6px;font-size:11px}
.tooltip .t-sec{margin-top:7px;border-top:1px dashed var(--line);padding-top:6px}
.tooltip .t-sec .t-h{font-weight:800;font-size:11px;letter-spacing:.3px}
.tooltip .t-sec.t-e .t-h{color:#d0431f}
.tooltip .t-sec.t-x .t-h{color:#7a3b8c}
.tooltip .t-en{font-style:italic;color:var(--green)}
.tooltip .t-cn{color:#5a4a2a}
.tooltip .t-qx{font-style:italic;color:#4a4030;font-size:11.5px;margin-top:4px}
/* 注标（页内标注 + 页面弹窗） */
.note-t{border-bottom:2px dotted var(--gold);background:rgba(194,145,42,.12);border-radius:3px;padding:0 2px;cursor:pointer}
.note-t:hover{background:#ffd98a}
.note-t::after{content:"注";font-size:9px;vertical-align:super;color:#b37b1c;margin-left:1px}
.ntk{cursor:pointer;color:var(--red2);font-weight:800;border:1px dashed var(--gold);border-radius:6px;padding:0 3px;margin-left:4px;background:#fff;font-size:11px}
.ntk:hover{background:#ffe3b0}
.nfbar{margin-left:6px}
.npop{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;background:rgba(30,18,5,.35)}
.npop.show{display:flex}
.np-card{width:min(540px,92vw);max-height:70vh;overflow:auto;background:#fffdf4;border:2px solid var(--gold);border-radius:14px;box-shadow:0 18px 60px rgba(30,15,0,.4);padding:0;animation:npin .16s}
.np-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--red2);color:#fff;border-radius:12px 12px 0 0;font-weight:800}
.np-x{cursor:pointer;font-weight:900;border:none;background:rgba(255,255,255,.22);color:#fff;width:24px;height:24px;border-radius:6px}
.np-term{font-weight:800;color:var(--red);padding:10px 16px 0;font-size:14px}
.np-body{padding:8px 16px 16px;line-height:1.85;color:#3a2f1c;font-size:14px;white-space:pre-wrap}
@keyframes npin{from{transform:translateY(8px);opacity:.5}to{transform:none;opacity:1}}
.msr{position:fixed;left:-99999px;top:0;visibility:hidden;pointer-events:none}
*{scrollbar-width:thin;scrollbar-color:rgba(92,26,26,.45) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(92,26,26,.3);border-radius:999px;border:2px solid transparent;background-clip:padding-box}

<script>
const D=window.ETEXTBOOK,$=id=>document.getElementById(id);
const TRANS=window.ETEXTBOOK_TRANS||{};
const GRP_A=['u1','u2','u3','u4'];
function cn(s){const m=String(s||'').match(/[\u4e00-\u9fff·—]+/);return m?m[0]:String(s||'');}
function enOf(u){const i=u.title.search(/\s|着/);return i>0?u.title.slice(0,i).trim():'';}
/* ---------- 词库 ---------- */
function cleanTerm(t){return String(t||'').toLowerCase().replace(/（[^）]*）/g,'').replace(/\([^)]*[\u4e00-\u9fff][^)]*\)/g,'').replace(/[（）()·.\*]/g,' ').replace(/\s+/g,' ').trim();}
function esc(w){return w.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&');}
function wordAlt(w){const forms=[w,w+'s',w+'es',w+'d',w+'ed',w+'ing'];if(w.endsWith('y')&&w.length>1){const r=w.slice(0,-1);forms.push(r+'ies',r+'ied');}forms.sort((a,b)=>b.length-a.length);return forms.map(esc).join('|');}
function matchKey(term){return cleanTerm(String(term).replace(/\([^)]*\)/g,' '));}
function lexReg(ct){const toks=ct.split(' ').filter(w=>w.length>=2);if(!toks.length)return null;try{if(toks.length===1)return new RegExp('(?<=[^A-Za-z])('+wordAlt(toks[0])+')(?=[^A-Za-z])','gi');return new RegExp('(?<=[^A-Za-z])'+toks.map(esc).join('\\s+')+'(?=[^A-Za-z])','gi');}catch(e){return null;}}
function vocabReg(term){const ct=matchKey(term);const ws=ct.split(' ').filter(Boolean);if(!ws.length)return null;try{if(ws.length===1)return new RegExp('(?<=[^A-Za-z])('+wordAlt(ws[0])+')(?=[^A-Za-z])','gi');return new RegExp('(?<=[^A-Za-z])'+ws.map(esc).join('\\s+')+'(?=[^A-Za-z])','gi');}catch(e){return null;}}
const LEX=[];
function he(w){return String(w).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtIpa(p){const o=p||{},u=o.us||'',k=o.uk||'';const r=x=>'/'+String(x).replace(/^\/|\/$/g,'')+'/';if(k&&u&&k!==u)return '英 '+r(k)+' · 美 '+r(u);return (k||u)?r(k||u):'';}
function isSub(nee,hay){let i=0;for(const c of hay){if(nee[i]===c)i++;if(i>=nee.length)return true;}return nee.length===0;}
function exQ(label){const i=label.indexOf('·');const secName=(i>0?label.slice(0,i):label).trim(),key=i>0?label.slice(i+1).trim():'';const ex=(D.exercises||[]).find(e=>{const enPre=((e.sec.match(/^[A-Za-z0-9 ]+/)||[''])[0]).trim();return enPre===secName||e.sec.includes(secName);});if(!ex)return'';if(ex.kind==='fill'||ex.kind==='open'){const n=parseInt(key.replace(/^[Qq]/i,''))||parseInt(key);const q=(ex.qs||[]).find(x=>(x.no||x.cl)===n);return q?q.q:'';}if(ex.kind==='table'){const rows=(ex.table&&ex.table.rows)||[];const keyn=key.replace(/\s+/g,'');const R=rows.map(r=>String(r[0]).replace(/\s+/g,''));let idx=R.findIndex(c=>c.includes(keyn));if(idx<0)idx=R.findIndex(c=>isSub(keyn,c));return idx>=0?String(rows[idx][0]):'';}if(ex.kind==='passage')return ex.cn||ex.en_q||'';return'';}
function examTerm(t){return String(t||'').replace(/^[\s"“”'‘’]+|[\s"“”'‘’]+$/g,'').replace(/\s+/g,' ').trim();}
D.vocabA.forEach(v=>LEX.push({term:v.term,zh:v.zh,cat:'教材词A · '+v.pos,diff:v.diff,q:v.q,pos:v.pos||'',ipa:fmtIpa(v.ipa),exam:v.exam||[],ex:v.ex||[],multi:false}));
D.vocabB.forEach(v=>LEX.push({term:v.term,zh:v.zh,cat:'教材词B · '+v.pos,diff:v.diff,q:v.q,pos:v.pos||'',ipa:fmtIpa(v.ipa),exam:v.exam||[],ex:v.ex||[],multi:false}));
[['examsA','真题A'],['examsB','真题B']].forEach(([k,cat])=>{D[k].forEach(v=>{const t=examTerm(v.term);LEX.push({term:t,zh:v.zh,cat:cat+' · '+(v.cls||''),diff:v.map?'真题映射':'真题',q:v.en,pos:v.ptype||'',ipa:'',exam:[],ex:[],multi:false,raw:v.term});});});
LEX.forEach(l=>{l.re=l.multi?lexReg(matchKey(l.term)):vocabReg(l.term);});
function hlMark(text){if(!text)return'';let out=text,toks=[];for(let ii=0;ii<LEX.length;ii++){const l=LEX[ii];if(!l.re)continue;out=out.replace(l.re,m=>{const k=toks.length;toks.push({z:ii,k,m});return '\uE001'+k+'\uE000';});}for(const t of toks)out=out.split('\uE001'+t.k+'\uE000').join('<mark class="voc'+(LEX[t.z].exam.length?' voce':'')+(LEX[t.z].ex.length?' vocx':'')+'" data-z="'+t.z+'">'+t.m+'</mark>');return out;}
const SEN_RE=/[^.!?。！？\r\n]+[.!?。！？]*[ \t]*/g;
function senHTML(txt){const text=String(txt||'');const arr=text.match(SEN_RE);if(!arr)return hlMark(text);return arr.filter(s=>s.trim()).map(s=>'<s class="sen">'+hlMark(s.trim())+'</s>').join(' ');}
/* ---------- 播放器（全文/逐句 · 进度 · 音色 · 语速 · 译文） ---------- */
let VOICE='gb_f',plRate=1,audio=null,curId=null,SHOW_TR=false;
let fullQ=[],fullIdx=-1,pageMode=false,ptrTimer=null;
const AUD_BASE='Overview_原文朗读/段落朗读/';
let timel=null;try{timel=window.SENTTL||null;}catch(e){timel=null;}
let sentSents=[],sentStarts=[],curSen=-1;
function stopA(){if(audio){audio.pause();audio=null;}curId=null;document.querySelectorAll('.para.reading').forEach(x=>x.classList.remove('reading'));clearSen();syncPlayUI();}
function clearSen(){sentSents.forEach(s=>s.classList.remove('reading'));sentSents=[];sentStarts=[];curSen=-1;}
function markAt(t){if(!sentStarts||!sentStarts.length)return;const i=SlideHelpers.sentenceIndexAt(sentStarts,t);if(i===curSen)return;curSen=i;sentSents.forEach((se,j)=>se.classList.toggle('reading',j===i));}
function paraElFor(id){return document.querySelector('.para[data-p="'+id+'"]')||null;}
function slideForId(id){for(let i=0;i<SLIDES.length;i++){for(const p of SLIDES[i].paras){if(p.id===id)return {idx:i,p};}}return null;}
function syncPlayUI(){const pb=$('pbt');if(pb)pb.textContent=audio&&!audio.paused&&!audio.ended?'⏸':'▶';}
function fmtT(t){t=Math.max(0,Math.floor(t||0));const m=Math.floor(t/60),s=t%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function refreshTime(){const cur=$('ptime');if(cur&&audio!=null&&!isNaN(audio.duration)){cur.textContent=fmtT(audio.currentTime)+' / '+fmtT(audio.duration);$('pseek').value=audio.duration?(audio.currentTime/audio.duration*100):0;}}
function loadPara(id){
  const sl=slideForId(id);if(!sl)return;
  if(sl.idx!==PAGE){goSlide(sl.idx);}            // goSlide 内部 stopA()，会复位状态
  const para=paraElFor(id);if(!para)return;
  sentSents=[...para.querySelectorAll('s.sen')];
  curId=id;clearSen();
  document.querySelectorAll('.para.reading').forEach(x=>x.classList.remove('reading'));para.classList.add('reading');
  const a=new Audio(AUD_BASE+VOICE+'/'+id+'.mp3');audio=a;a.playbackRate=plRate;
  a.addEventListener('loadedmetadata',()=>{
    const total=a.duration||0;const tl=(timel&&timel[id])||null;
    sentStarts=(tl&&tl.length===sentSents.length)?tl.slice(0,sentSents.length):SlideHelpers.computeSentenceStarts(sentSents.map(s=>Math.max(1,s.textContent.length)),total);
    curSen=-1;
  });
  a.addEventListener('timeupdate',()=>{markAt(a.currentTime);refreshTime();});
  a.onended=()=>{if(pageMode){stepParaNext();}else{syncPlayUI();}};
  return a;
}
function playPara(id){            // 点击段落 → 播放该段音频（本段播完即停）
  pageMode=false;stopA();
  const a=loadPara(id);if(a){a.play();syncPlayUI();}
}
function playPage(){              // 播放键 ▶ → 顺序朗读本页各段
  pageMode=true;stopA();
  const s=SLIDES[PAGE];if(!s)return;
  const paras=s.paras.filter(p=>p.text!==undefined);
  if(!paras.length)return;
  fullQ=paras.map(p=>p.id);fullIdx=0;
  const a=loadPara(fullQ[0]);if(a){a.play();syncPlayUI();}
}
function stepParaNext(){            // 全文：段播完自动下一段
  fullIdx++;if(fullIdx>=fullQ.length){document.querySelectorAll('.para.reading').forEach(x=>x.classList.remove('reading'));audio=null;curId=null;clearSen();syncPlayUI();return;}
  const a=loadPara(fullQ[fullIdx]);if(a){a.play();syncPlayUI();}
}
function playButton(){if(!audio||audio.ended){playPage();return;}if(audio.paused){audio.play();syncPlayUI();}else{audio.pause();syncPlayUI();}}
/* ---------- 结构模型 ---------- */
function unitParts(u){
  const prep=p=>{if(p&&p.text!==undefined){
      const c=cleanText(p.text);
      if(!c.text&&!((c.notes||[]).length))return null;      // 纯噪点段落（整段为图注/〔补〕等）剔除
      p.text=c.text;if(c.notes&&c.notes.length)p.notes=c.notes;else delete p.notes;
      if(TRANS[p.id])p.tr=TRANS[p.id];
    }return p;};
  const fil=a=>(a||[]).map(prep).filter(Boolean);
  const any=(u.sections&&u.sections.length)?u.sections:null;
  if(!any)return[{title:u.title,en:enOf(u),paras:[]}];
  if(any.length<=1)return[{title:u.title,en:enOf(u),paras:fil(any[0].paras)}];
  return any.map(s=>({title:s.title,en:'',paras:fil(s.paras)}));
}
/* 正文净化：去掉分页残留〔续X→Y〕等噪点，把〔注：…〕抽成 notes */
function noteTerm(inner){
  const m=String(inner||'').match(/^\s*((?:"[^"]+")|(?:[A-Za-z][A-Za-z0-9'’\-]*(?:\s+[A-Za-z][A-Za-z0-9'’\-]*)*))\s*(?=[：:（(—\u2013\u2014\-]|\s*$)/);
  return m?m[1].trim():'';
}
function cleanText(txt){
  const s=String(txt||'');
  const clean=s
    .replace(/【图注[：:][^】]*】/g,'')
    .replace(/〔补[：:][^〕]*〕|（补[：:][^）]*）|（本句?|\[补[：:][^\]]*\]/g,'')
    .replace(/〔\s*续\s*\d+\s*[→─—\-–]\s*\d+\s*〕/g,'')
    .replace(/\[?\((?:续上|[Cc]ont'd|cont\.)\s*[→\-][^)\]]*\)/g,'')
    .replace(/〔注(?!\s*[：:])(?!〔)〕|\[注\](?!\[)/g,'');
  const notes=[];
  const out=clean.replace(/〔注\s*[：:]\s*([^〕]*)〕|（注\s*[：:]\s*([^）]*)）/g,(all,g1,g2)=>{
    const inner=(g1||g2||'').trim();if(!inner)return'';
    notes.push({term:noteTerm(inner),note:inner});return'';
  });
  return {text:out.replace(/\s{2,}/g,' ').trim(),notes};
}
function ovParts(A){const ids=A?['u1','u2','u3','u4']:['u5','u6','u7','u8','u9'];let out=[];for(const id of ids){const u=D.units.find(x=>x.id===id);if(u)out=out.concat(unitParts(u));}return out;}
function chParts(no){return [{title:'正文（待录入）',en:'',paras:[{note:'Chapter '+no+' · 课次{cs} · 正文尚待录入。此为方案结构骨架占位，正文录入后自动分页呈现。'}]}];}
function buildStruct(){
  const S=[{id:'ov',label:'Overview',sub:'总览',courses:[{key:'A',label:'课次A',parts:ovParts(true)},{key:'B',label:'课次B',parts:ovParts(false)}]}];
  [1,2,3,5,7,8,9].forEach(no=>{S.push({id:'c'+no,label:'Chapter '+no,sub:'第'+no+'章',placeholder:true,courses:[{key:'A',label:'课次A',parts:chParts(no)},{key:'B',label:'课次B',parts:chParts(no)}]});});
  return S;
}
const STRUCT=buildStruct();
/* ---------- 幻灯片构建（自动分页） ---------- */
let SLIDES=[],PAGE=0,mode='text',curRoot='ov',curCourse='A';
function viewW(){return Math.max(300,($('stage').clientWidth||860)-40);}
function msrW(){return Math.min(viewW(),900);}
function trHTML(p){return SHOW_TR&&p.tr?('<div class="ptr" data-pid="'+he(p.id||'')+'">'+he(p.tr)+'</div>'):'';}
function msrPara(p){
  const m=$('msr');m.style.width=msrW()+'px';m.classList.toggle('tr2col',SHOW_TR);
  m.innerHTML=p.note!==undefined?('<div class="note">'+he(p.note)+'</div>'):('<div class="para"><div class="ptext">'+senHTML(p.text)+'</div>'+trHTML(p)+'</div>');
  const h=m.firstElementChild?m.firstElementChild.offsetHeight:24;m.innerHTML='';return h;
}
function msrHead(part){
  const m=$('msr');m.style.width=msrW()+'px';
  m.innerHTML='<div class="phead"><h2 class="p-pt">'+he(part.title||'')+'</h2></div>';
  const h=m.firstElementChild?m.firstElementChild.offsetHeight:34;m.innerHTML='';return h;
}
function avH(part){return Math.max(160,($('viewport').clientHeight||500)-14-(msrHead(part)+8)-6);}
function paginate(paras,part){const avail=avH(part);const gap=16;
  const heights=paras.map(msrPara);
  return SlideHelpers.groupByHeight(heights,gap,avail).map(g=>g.map(i=>paras[i]));}
function buildSlides(){
  SLIDES=[];PAGE=0;
  for(const root of STRUCT)for(const cs of root.courses){
    for(const part of cs.parts){const batches=paginate(part.paras,part);
      part._idx=SLIDES.length;part._pages=batches.length;
      batches.forEach((paras,bi)=>{SLIDES.push({root:root.id,rl:root.label,course:cs.key,cl:cs.label,part:part.title,partEn:part.en,fresh:bi===0,paras:paras});});
    }
  }
  firstIdxOf(STRUCT,curRoot,curCourse);
}
function firstIdxOf(root,course){for(let k=0;k<SLIDES.length;k++){if(SLIDES[k].root===root&&SLIDES[k].course===course)return k;}return 0;}
function goSlide(i){PAGE=((i%SLIDES.length)+SLIDES.length)%SLIDES.length;stopA();renderSlide();renderCrumb();renderFbar();}
/* ---------- 渲染 ---------- */
function paraHTML(p){
  if(p.note!==undefined)return '<div class="note">'+he(p.note)+'</div>';
  let body=senHTML(p.text);
  const notes=p.notes||[];const pid=he(p.id||'');
  const miss=[];
  notes.forEach((n,k)=>{const t=n.term;if(!t){miss.push(k);return;}
    const esc=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re=new RegExp('(^|[^A-Za-z])('+esc+')(?=[^A-Za-z])','i');
    const nw=body.replace(re,'$1<span class="note-t" data-i="'+k+'" data-p="'+pid+'">$2</span>');
    if(nw!==body){body=nw;}else{miss.push(k);}});
  if(miss.length){body+='<span class="nfbar">'+miss.map(k=>'<sup class="ntk" data-i="'+k+'" data-p="'+pid+'">['+(k+1)+']</sup>').join(' ')+'</span>';}
  return '<div class="para" data-p="'+pid+'"><div class="ptext">'+body+'</div>'+trHTML(p)+'</div>';
}
function renderSlide(){
  const s=SLIDES[PAGE];const st=$('stage');if(!s)return;
  let h='<div class="slide"><div class="inner">';
  h+='<div class="phead"><h2 class="p-pt">'+he(s.part)+(s.fresh?'':('<span class="p-cont">（续）</span>'))+'</h2>';
  h+='</div><div class="sbody">'+s.paras.map(paraHTML).join('')+'</div></div></div>';
  st.innerHTML=h;
  const slEl=st.querySelector('.slide'),sb=st.querySelector('.sbody');sb.classList.toggle('tr2col',SHOW_TR);
  slEl.classList.remove('scroll');
  if(sb&&sb.scrollHeight>sb.clientHeight+4)slEl.classList.add('scroll');
  st.querySelectorAll('.para[data-p]').forEach(para=>{para.onclick=e=>{
    if(e.target.closest('.voc,.note-t,.ntk'))return;         // 词块 / 注标交给各自处理
    if(e.target.closest('s.sen')&&audio)return;              // 已播放时点句子交给 seek
    playPara(para.dataset.p);
  };});
  st.querySelectorAll('s.sen').forEach(sen=>{sen.onclick=()=>senClick(sen);});
  st.querySelectorAll('.note-t,.ntk').forEach(el=>el.onclick=e=>{e.stopPropagation();openNoteBy(+el.dataset.i,el.dataset.p);});
  st.querySelectorAll('.ptr').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const para=el.closest('.para');if(!para)return;
    para.classList.remove('flash');void para.offsetWidth;para.classList.add('flash');
    clearTimeout(ptrTimer);ptrTimer=setTimeout(()=>para.classList.remove('flash'),1400);
  });
}
function openNoteBy(i,pid){const sl=slideForId(pid);const p=sl?sl.p:null;const n=p&&p.notes?p.notes[i]:null;if(!n)return;
  $('nterm').textContent=n.term?('注 · '+n.term):'页面注释';
  $('nbody').textContent=n.note||'（无内容）';
  $('npop').classList.add('show');}
function closeNote(){$('npop').classList.remove('show');}
function senClick(sen){if(!audio||!sentStarts||!sentStarts.length)return;const i=sentSents.indexOf(sen);if(i<0)return;
  audio.currentTime=sentStarts[i];audio.play();syncPlayUI();}
function renderCrumb(){
  const s=SLIDES[PAGE];const root=STRUCT.find(x=>x.id===s.root);
  const rootLabel=root?(root.id==='ov'?'Overview':root.sub):'';
  if(mode!=='text'){
    $('crumb').innerHTML='<span class="g" data-act="home">'+he(rootLabel)+'</span><span class="sep">/</span><span class="cur">'+he(mode==='ex'?'课后习题':'CET真题')+'</span>';
    $('crumb').querySelectorAll('.g').forEach(g=>g.onclick=()=>{setMode('text');jumpRoot(s.root);});
    $('csw').innerHTML='';return;
  }
  $('crumb').innerHTML='<span class="g" data-act="home">'+he(rootLabel)+'</span>';
  $('crumb').querySelectorAll('.g').forEach(g=>g.onclick=()=>jumpRoot(s.root));
  /* 课次A/B 切换 */
  const cur=STRUCT.find(x=>x.id===s.root);if(!cur)return;
  $('csw').innerHTML=cur.courses.map(c=>'<button class="'+(c.key===s.course?'on':'')+'" data-c="'+c.key+'">'+c.label+'</button>').join('');
  $('csw').querySelectorAll('button').forEach(b=>b.onclick=()=>{stopA();curCourse=b.dataset.c;PAGE=firstIdxOf(s.root,b.dataset.c);renderSlide();renderCrumb();renderFbar();});
}
function renderFbar(){
  const s=SLIDES[PAGE];
  $('fpage').textContent='页 '+(PAGE+1)+' / '+SLIDES.length;
  $('fprev').disabled=PAGE<=0;$('fnext').disabled=PAGE>=SLIDES.length-1;
}
function jumpRoot(root){curRoot=root;stopA();const cs=STRUCT.find(x=>x.id===root);curCourse=cs?cs.courses[0].key:'A';PAGE=firstIdxOf(root,curCourse);renderSlide();renderCrumb();renderFbar();}
/* ---------- 工具视图 ---------- */
function excard(e){return '<div class="excard"><h4>'+e.term+'<span class="set" style="margin-left:8px">'+e.set+'</span></h4><div class="cn">'+e.cn+'</div><div class="en">'+e.en+'</div><div class="meta"><span class="mtag pt">'+(e.ptype||'')+'</span><span class="mtag cl">'+(e.cls||'')+'</span></div></div>';}
function renderExam(){let h='<div class="unithead"><h1>CET真题词块</h1><div class="ensub">真题A '+D.examsA.length+' 条 · 真题B '+D.examsB.length+' 条</div></div>';
  h+='<h2 style="border-left:4px solid var(--gold);padding-left:10px;color:var(--red2)">真题A</h2><div class="exgrid">'+D.examsA.map(excard).join('')+'</div>';
  h+='<h2 style="border-left:4px solid var(--gold);padding-left:10px;color:var(--red2);margin-top:20px">真题B</h2><div class="exgrid">'+D.examsB.map(excard).join('')+'</div>';
  $('tool').innerHTML=h;}
function coreAns(a){return (a||'').toLowerCase().replace(/（[^）]*）/g,'').replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim();}
function blanksArr(ans){return String(ans||'').trim().split(/；|;/).map(s=>s.trim()).filter(Boolean);}
function inW(a){return Math.max(70,Math.min(300,Math.round(coreAns(a).length*8.4+20)));}
function bk(a,w,ph){const ws=w?w:(inW(a)+'px');const wu=/%$/.test(String(ws))?ws:(isNaN(Number(ws))?ws:(+ws+'px'));return '<input class="blank" autocomplete="off" spellcheck="false" data-a="'+he(a)+'" data-core="'+he(coreAns(a))+'" style="width:'+wu+'"'+(ph?' placeholder="'+ph+'"':'')+'></input>';}
function fillQHTML(q){const ans=blanksArr(q.ans);let ai=0;const qb=he(q.q).replace(/_+/g,()=>{const a=ans.length>ai?ans[ai++]:'';return bk(a);});return '<div class="exq"><div class="exq-h"><span class="exq-no">'+q.no+'.</span></div><div class="exq-q">'+qb+'</div></div>';}
function ctTableHTML(){const rows=[['Climate','cold and dry winters, large temperature differences','warm and humid, plentiful rainfall, small temperature variation'],['Geography',null,null],['Food Culture',null,null],['Festival Celebrations',null,null]];let h='<table class="ct"><tr class="cthead"><td style="width:26%">Item</td><td>Northern China</td><td>Southern China</td></tr>';rows.forEach(r=>h+='<tr><td class="given">'+he(r[0])+'</td><td>'+(r[1]?bk(r[1],'94%'):'<input class="blank" placeholder="自由作答" style="width:94%"></input>')+'</td><td>'+(r[2]?bk(r[2],'94%'):'<input class="blank" placeholder="自由作答" style="width:94%"></input>')+'</td></tr>');return h+'</table>';}
function circ(n){return ['①','②','③','④','⑤'][n-1]||(n+'.');}
function renderEx(){const BARS=[['Comprehension 理解填空',[0]],['Abbreviations 简写还原',[1]],['Translation 翻译',[2,3]],['Critical Thinking and Discussion 思辨与讨论',[4]],['Communication 口语任务',[5]]];
  let h='<div class="unithead"><h1>Exercises · 课次B 习题（在线练习）</h1><div class="ensub">直接在黑色下划线上作答，点「核对」判分；「显示答案」查看原文，「重置」清空。</div></div>';
  for(const [bar,idxs] of BARS){h+='<div class="exsec"><h2>'+bar+'</h2><div class="exctl"><span class="sc">未作答</span><button class="btn check" data-action="check">核对</button><button class="btn show" data-action="show">显示答案</button><button class="btn reset" data-action="reset">重置</button></div>';
    idxs.forEach((xi,gi)=>{const x=D.exercises[xi];
      if(x.kind==='fill'){h+='<div class="exgrp"><span class="no">'+circ(gi+1)+'</span> Fill in the blanks 根据课文填空</div>';x.qs.forEach(q=>h+=fillQHTML(q));}
      else if(x.kind==='table'&&/Abbrev|缩写/.test(x.sec)){if(x.intro)h+='<div class="intro">'+he(x.intro)+'</div>';h+='<table class="ex"><thead><tr><th>Abbreviations</th><th>Full Names</th><th>Chinese Names</th></tr></thead><tbody>';x.table.rows.forEach(r=>h+='<tr><td class="given">'+he(r[0])+'</td><td>'+bk(r[1],'94%')+'</td><td>'+bk(r[2],'94%')+'</td></tr>');h+='</tbody></table>';}
      else if(x.kind==='table'){const th=(x.table&&x.table.head)||[];h+='<div class="exgrp"><span class="no">'+circ(gi+1)+'</span> Term translation 术语翻译</div><table class="ex"><thead><tr><th style="width:46%">'+he(th[0]||'Term')+'</th><th>'+he(th[1]||'Translation')+'</th></tr></thead><tbody>';x.table.rows.forEach(r=>h+='<tr><td class="given">'+he(r[0])+'</td><td>'+bk(r[1],'100%')+'</td></tr>');h+='</tbody></table>';}
      else if(x.kind==='passage'){h+='<div class="exgrp"><span class="no">'+circ(gi+1)+'</span> Passage translation 将下列中文译为英文</div>';if(x.en_q)h+='<div class="passage-en">'+he(x.en_q)+'</div>';h+='<div class="passagebox">'+he(x.cn)+'</div><div class="passbox"><textarea class="parea" placeholder="在此写出你的英文翻译…"></textarea><div class="exq-a">'+he(x.ans||'')+'</div></div>';}
      else if(x.kind==='open'&&/Critical|Thinking/.test(x.sec)){x.qs.forEach((q,i)=>{h+='<div class="exgrp"><span class="no">'+circ(gi+1)+'.'+(i+1)+'</span>'+he(q.q)+'</div>';if(i===0)h+=ctTableHTML();if(q.ans)h+='<div class="exq-a">'+he(q.ans)+'</div>';});}
      else{x.qs.forEach((q,i)=>{h+='<div class="exgrp"><span class="no">'+circ(gi+1)+'.'+(i+1)+'</span>'+he(q.q)+'</div>';if(q.ans)h+='<div class="exq-a">'+he(q.ans)+'</div>';});}
    });h+='</div>';}
  $('tool').innerHTML=h;}
$('tool').addEventListener('click',e=>{const b=e.target.closest('.exctl [data-action]');if(!b)return;const root=b.closest('.exsec');if(!root)return;const act=b.dataset.action;const inputs=[...root.querySelectorAll('input.blank')];const sc=root.querySelector('.exctl .sc');
  if(act==='check'){let ok=0,done=0,tot=0;inputs.forEach(inp=>{if(inp.dataset.core===undefined||inp.dataset.core===''){inp.classList.remove('ok','bad');return;}const c=coreAns(inp.value);tot++;if(inp.value.trim()===''){inp.classList.remove('ok','bad');return;}done++;if(c===inp.dataset.core){inp.classList.remove('bad');inp.classList.add('ok');ok++;}else{inp.classList.remove('ok');inp.classList.add('bad');}});if(sc)sc.textContent='答对 '+ok+' / '+done+(done<tot?' · 未作答 '+(tot-done):'');}
  else if(act==='show'){const hasA=inputs.some(x=>x.dataset.a);if(!hasA){if(sc)sc.textContent='本区为开放题，无固定答案';return;}root.classList.add('show');inputs.forEach(inp=>{if(inp.dataset.a){inp.value=inp.dataset.a;inp.classList.add('ok');inp.classList.remove('bad');}});if(sc)sc.textContent='已显示答案';}
  else if(act==='reset'){root.classList.remove('show');inputs.forEach(inp=>{inp.value='';inp.classList.remove('ok','bad');});const ta=root.querySelector('textarea.parea');if(ta)ta.value='';if(sc)sc.textContent='未作答';}});
function renderTool(){if(mode==='ex')renderEx();else renderExam();}
function setMode(m){mode=m;
  if(m==='text'){$('tool').style.display='none';$('stage').style.display='';$('fprev').style.display='';$('fnext').style.display='';$('fpage').style.display='';$('player').style.visibility='';renderSlide();renderCrumb();renderFbar();}
  else{$('stage').style.display='none';$('fprev').style.display='none';$('fnext').style.display='none';$('fpage').style.display='none';$('player').style.visibility='hidden';$('tool').style.display='';stopA();renderTool();renderCrumb();}}
/* ---------- 目录抽屉 ---------- */
let drOpen={ov:true};
function renderDrawer(){
  $('dtree').innerHTML=STRUCT.map(r=>{
    const on=r.id===curRoot,open=!!drOpen[r.id];
    const ig=r.sub+(r.placeholder?' · 待录入':'');
    let h='<div class="dr-m'+(on?' on':'')+(r.placeholder?' ph':'')+'" data-root="'+r.id+'"><span class="car">'+(open?'▾':'▸')+'</span>'+he(r.label)+'<span class="ig">'+he(ig)+'</span></div>';
    if(!open)return h;
    r.courses.forEach(c=>{
      const cOn=on&&mode==='text'&&curCourse===c.key;
      const total=c.parts.reduce((a,p)=>a+p._pages,0);
      h+='<div class="dr-c'+(cOn?' on':'')+'" data-root="'+r.id+'" data-course="'+c.key+'">'+he(c.label)+'<span class="ig">共 '+total+' 页</span></div>';
      h+='<div class="dr-p">';
      c.parts.forEach(p=>{const active=on&&mode==='text'&&curCourse===c.key&&p._idx<=PAGE&&p._idx+p._pages>PAGE;
        const pg=p._pages===1?('页'+(p._idx+1)):('页'+(p._idx+1)+'–'+(p._idx+p._pages));
        h+='<button data-goto="'+p._idx+'" class="'+(active?'on':'')+'">'+he(p.title)+'<span class="ig">'+pg+'</span></button>';});
      h+='</div>';
    });
    if(r.placeholder){
      h+='<div class="dr-t ph" title="该章节课后习题待录入">课后习题<span class="ig">待录入</span></div>';
      h+='<div class="dr-t ph" title="该章节CET真题待录入">CET真题<span class="ig">待录入</span></div>';
    }else{
      const t=(m,label,ig)=>'<div class="dr-t'+(on&&mode===m?' on':'')+'" data-tool="'+m+'">'+label+'<span class="ig">'+ig+'</span></div>';
      h+=t('ex','课后习题',(D.exercises||[]).length+' 组');
      h+=t('exam','CET真题',((D.examsA||[]).length+(D.examsB||[]).length)+' 条');
    }
    return h;
  }).join('');
  $('dtree').querySelectorAll('.dr-m').forEach(m=>m.onclick=()=>{const id=m.dataset.root;drOpen[id]=!drOpen[id];renderDrawer();});
  $('dtree').querySelectorAll('.dr-c[data-course]').forEach(c=>c.onclick=()=>{jumpCourseTo(c.dataset.root,c.dataset.course);closeD();});
  $('dtree').querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{setMode('text');PAGE=+b.dataset.goto;renderSlide();renderCrumb();renderFbar();closeD();});
  $('dtree').querySelectorAll('.dr-t:not(.ph)').forEach(t=>t.onclick=()=>{setMode(t.dataset.tool);closeD();});
}
function jumpCourseTo(root,key){setMode('text');curRoot=root;curCourse=key;PAGE=firstIdxOf(root,key);renderSlide();renderCrumb();renderFbar();}
function openD(){$('drawer').classList.add('open');$('mask').classList.add('show');renderDrawer();}
function closeD(){$('drawer').classList.remove('open');$('mask').classList.remove('show');}
$('hamb').onclick=openD;$('dclose').onclick=closeD;$('mask').onclick=closeD;
/* ---------- 开关 / 事件 ---------- */
window.addEventListener('unhandledrejection',e=>{e.preventDefault();});
$('npx').onclick=closeNote;
$('npop').addEventListener('click',e=>{if(e.target===$('npop'))closeNote();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('npop').classList.contains('show'))closeNote();});
$('pbt').onclick=playButton;
$('pseek').addEventListener('input',e=>{if(audio)audio.currentTime=(+e.target.value)/100*(audio.duration||0);});
$('prate').onchange=e=>{plRate=parseFloat(e.target.value);if(audio)audio.playbackRate=plRate;};
$('pvoice').onchange=e=>{const nv=e.target.value;if(nv===VOICE)return;VOICE=nv;
  if(!audio||!curId)return;                 // 未在播放则仅更新音色，不打扰当前页
  const id=curId,t=audio.currentTime;stopA();
  const a=loadPara(id);                     // 同页加载当前段，不改页码
  if(a){a.currentTime=Math.max(0,t);a.play();syncPlayUI();}};
$('ptrans').onclick=()=>{SHOW_TR=!SHOW_TR;$('ptrans').classList.toggle('on',SHOW_TR);rebuildKeep();};
function rebuildKeep(){                     // 切换行内译文 → 重新分页并保持当前段与播放位置
  const cur=SLIDES[PAGE];
  const id=curId||(cur&&cur.paras.find(p=>p.text!==undefined)&&cur.paras.find(p=>p.text!==undefined).id);
  const wasPlaying=!!(audio&&!audio.paused&&!audio.ended);
  const t=audio?audio.currentTime:0;
  stopA();
  buildSlides();
  if(id){const k=SLIDES.findIndex(s=>s.paras.some(p=>p.id===id));if(k>=0)PAGE=k;}
  if(PAGE>=SLIDES.length)PAGE=SLIDES.length-1;
  renderSlide();renderCrumb();renderFbar();renderDrawer();
  if(id&&wasPlaying){const a=loadPara(id);if(a){a.currentTime=Math.max(0,t);a.play();syncPlayUI();}}
}
$('fprev').onclick=()=>goSlide(PAGE-1);$('fnext').onclick=()=>goSlide(PAGE+1);
document.addEventListener('keydown',e=>{if(mode!=='text'||$('drawer').classList.contains('open'))return;if(e.key==='ArrowLeft')goSlide(PAGE-1);else if(e.key==='ArrowRight')goSlide(PAGE+1);else if(e.key==='Home')goSlide(0);else if(e.key==='End')goSlide(SLIDES.length-1);});
/* 触屏左右滑动 */
(function(){const v=$('viewport');let sx=0,sy=0,busy=false;v.ontouchstart=e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;busy=false;};v.ontouchmove=e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;if(!busy&&Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>48){busy=true;if(dx<0)goSlide(PAGE+1);else goSlide(PAGE-1);}};})();
let fs=120;
$('fsp').onclick=()=>{if(fs<140){fs+=10;applyFs();}};
$('fsm').onclick=()=>{if(fs>80){fs-=10;applyFs();}};
function applyFs(){document.documentElement.style.setProperty('--fs',fs/100);$('fsv').textContent=fs+'%';buildSlides();goSlide(PAGE);renderCrumb();renderFbar();renderDrawer();}
applyFs();
/* ---------- 词块 tooltip ---------- */
function exSrc(l){if(!l||!l.q)return'';return /真题/.test(l.cat||'')?'（真题）':(/教材/.test(l.cat||'')?'（教材）':'');}
const tip=$('tip');
document.addEventListener('mouseover',e=>{const m=e.target.closest('.voc');if(!m){tip.classList.remove('show');return;}const l=LEX[+m.dataset.z];if(!l){tip.classList.remove('show');return;}
  let h='<div class="t-t">'+he(l.term)+'</div>';
  if(l.pos)h+='<div class="t-pi">'+he(l.pos)+'</div>';
  if(l.zh)h+='<div class="t-z">'+he(l.zh)+'</div>';
  if(l.q)h+='<div class="t-q">例：'+he(l.q)+'<span class="t-src">'+exSrc(l)+'</span></div>';
  tip.innerHTML=h;const r=m.getBoundingClientRect();tip.style.left=Math.min(r.left+8,innerWidth-360)+'px';tip.style.top=(r.bottom+10)+'px';tip.classList.add('show');});
document.addEventListener('mouseout',e=>{if(!e.target.closest('.voc'))tip.classList.remove('show');});
/* ---------- 初始 ---------- */
buildSlides();
setMode('text');
renderDrawer();
</script></body></html>
