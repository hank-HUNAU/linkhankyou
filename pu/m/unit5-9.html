  PEND[id] = [cb];
  const sc = document.createElement('script');
  sc.src = 'audio/' + id + '.js';
  sc.onload = () => {
    Object.assign(AUDIO, window.PU_AUDIO || {});
    DONE[id] = 1;
    const q = PEND[id] || []; delete PEND[id];
    q.forEach(f => f && f());
    if (!prefetch) {
      const nx = nextChunkId(id);
      if (nx && !DONE[nx]) setTimeout(() => ensureChunk(nx, null, true), 1500);
    }
  };
  sc.onerror = () => { delete PEND[id]; hintOnce('音频加载失败，请检查网络后重试'); };
  document.head.appendChild(sc);
}
function playKey(k) {
  const it = cur();
  if (!k) return;
  if (AUDIO[k]) { _play(k); return; }
  ensureChunk(chunkOf(it), () => { if (AUDIO[k]) _play(k); else hintOnce('这条音频缺失'); });
}
function _play(k) {
  au.src = AUDIO[k]; au.playbackRate = rates[ri];
  au.play().then(() => { playing = true; card.classList.add('pulse'); render(); })
             .catch(() => { playing = false; render(); });
}
function playEn() { const it = cur(); if (it) playKey(it.ke); }
function playZh() { if (cur().zh) playKey(cur().kz); }
function move(d) {
  const a = list(); if (!a.length) return;
  clearGap();
  idx = (idx + d + a.length) % a.length;
  render();
  if (allMode) playEn(); else if (d !== 0) playEn();
}
document.getElementById('play').onclick = () => {
  if (playing) { stop(); } else { allMode = true; playEn(); }
};
document.getElementById('prev').onclick = () => move(-1);
document.getElementById('next').onclick = () => move(1);
document.getElementById('all').onclick = () => { clearGap(); allMode = true; idx = 0; render(); playEn(); };
document.getElementById('spd').onclick = (e) => {
  ri = (ri + 1) % rates.length;
  e.target.textContent = rates[ri].toFixed(1) + '×';
  au.playbackRate = rates[ri];
};
card.addEventListener('click', (e) => {
  if (e.target.id === 'zh') { playZh(); return; }
  if (e.target.id === 'spk') { playEn(); return; }
  playEn();
});
au.addEventListener('ended', () => {
  if (!allMode) { playing = false; card.classList.remove('pulse'); render(); return; }
  const a = list(), from = a[idx];
  const last = idx + 1 >= a.length;
  const to = last ? a[0] : a[idx + 1];
  // 收尾：停 0.8s → 回到第 1 条并停下；否则按 词1s/句3s/换组1.8s 留白
  const ms = last ? Math.round(GAP.tail * rateScale()) : gapMs(from, to);
  card.classList.remove('pulse'); render();
  runGap(ms, () => {
    if (!allMode) { return; }
    if (last) { idx = 0; allMode = false; playing = false; render(); return; }
    idx = idx + 1; render(); playEn();
  });
});
document.getElementById('seg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  [...document.querySelectorAll('#seg button')].forEach(x => x.classList.remove('on'));
  b.classList.add('on'); mode = b.dataset.mode; idx = 0; group = null;
  stop(); renderPick(); render();
});
// 左右滑动
let x0 = null, y0 = null;
card.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
card.addEventListener('touchend', (e) => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) { move(dx < 0 ? 1 : -1); }
  x0 = y0 = null;
}, {passive:true});
renderPick(); render();
</script>
</body></html>
